<title>Dugout Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: data-dense manager console. Top command bar with section menus, contextual sub-tabs, tile dashboards and tight tables.
   Single deliberate night palette: ink navy surfaces, amber for the one primary action, cyan for data highlights. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b;--bg2:#0f0f11;--panel:#141416;--panel2:#1b1b1e;--row:#161618;--hover:#222225;--line:#252528;--line2:#333337;
  --text:#ededeb;--muted:#9a9993;--dim:#68675f;
  --accent:#ffb43a;--accent2:#ffd27f;--ink:#2b1900;--cyan:#e7e1d3;
  --win:#38d184;--draw:#b9c3d6;--loss:#ff5a6d;--warn:#ffcf4a;
  --fd:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font:14px/1.4 var(--fb);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#0c0c0d}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;margin:0;letter-spacing:.02em;text-wrap:balance}
small,.muted{color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}
a{color:var(--cyan)}

/* ---------- command bar ---------- */
#bar{--tc:#333;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 30%,#151517) 0%,color-mix(in srgb,var(--tc) 12%,#141416) 35%,#121214 70%);border-bottom:2px solid color-mix(in srgb,var(--tc) 70%,#222);box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
.bar-row{display:flex;align-items:center;gap:6px;min-height:54px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:8px;margin-right:10px;font:800 17px/1 var(--fd);letter-spacing:.2em;color:var(--accent)}
.logo svg{width:30px;height:30px}
.club-chip{display:flex;align-items:center;gap:8px;padding:0 12px 0 4px;margin-right:6px;border-right:1px solid var(--line2);height:36px}
.club-chip .crest{width:26px;height:31px}
.club-chip b{font:700 15px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:6px;opacity:.85}
.nav button{padding:9px 10px;border-radius:8px;font:700 14px/1 var(--fd);letter-spacing:.07em;text-transform:uppercase;color:#c9c7c0;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{color:#fff;background:rgba(255,180,58,.1);box-shadow:inset 0 -2px 0 var(--accent)}
.nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--loss);margin-left:6px;vertical-align:2px}
.when{display:flex;flex-direction:column;align-items:flex-end;margin-left:8px;padding:0 10px;border-left:1px solid var(--line2);line-height:1.15;white-space:nowrap}
.when b{font:700 15px var(--fd);letter-spacing:.04em}
.when small{font-size:12px}
.go{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 18px;border-radius:9px;background:linear-gradient(180deg,#2b2b2f,#1d1d20);color:#ffd18a;border:1px solid rgba(255,180,58,.5);font:800 15px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 16px -8px rgba(0,0,0,.8);white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
.go:hover{border-color:rgba(255,180,58,.85);color:#ffe2b0;background:linear-gradient(180deg,#323237,#222226)}
.go svg,.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sub{display:flex;align-items:center;gap:4px;min-height:38px;background:#0e0e10;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sub::-webkit-scrollbar{display:none}
.sub button{padding:6px 11px;border-radius:6px;font:600 14px/1 var(--fb);color:var(--muted);white-space:nowrap}
.sub button:hover{color:#fff;background:rgba(255,255,255,.05)}
.sub button[aria-current="true"]{color:#fff;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line2)}
.sub .sp{flex:1}
main{padding-block:16px 60px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}

/* ---------- surfaces ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.panel{background:linear-gradient(180deg,#17171a,var(--panel) 120px);border:1px solid var(--line);border-radius:12px;min-width:0;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 30px -18px rgba(0,0,0,.8)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);min-height:42px}
.ph h3{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:#dedbd2}
.ph h3 small{font:500 13px var(--fb);letter-spacing:0;text-transform:none;margin-left:6px}
.pb{padding:12px;min-width:0}
.pb.flush{padding:0}
.scroll{overflow:auto}
.eyebrow{font:700 11px/1 var(--fd);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.kpi{font:800 28px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kpi.sm{font-size:22px}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--accent))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;border:1px solid #38383d;background:linear-gradient(180deg,#26262a,#1a1a1d);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px -2px rgba(0,0,0,.6);font:700 13px/1 var(--fd);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s}
.btn:hover{border-color:#57565c;background:linear-gradient(180deg,#2e2e33,#202024);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 6px 14px -6px rgba(0,0,0,.7)}
.btn:active{transform:translateY(0)}
.btn.pri{background:linear-gradient(180deg,#2c2b2a,#1f1e1d);color:#ffd18a;border-color:rgba(255,180,58,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 6px 16px -8px rgba(0,0,0,.8)}
.btn.pri:hover{border-color:rgba(255,180,58,.9);color:#ffe2b0;background:linear-gradient(180deg,#34332f,#252422)}
.btn.lg{height:42px;padding:0 20px;font-size:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.seg button:hover{color:#fff}
.seg button{padding:6px 10px;border-radius:6px;transition:background .12s,color .12s;color:var(--muted);font:700 13px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--panel2);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
select,input[type=search],input[type=text],input[type=number]{background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:7px;height:32px;padding:0 8px;font:500 13px var(--fb);min-width:0}
input[type=range]{accent-color:var(--accent);width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
.toolbar label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;font:700 11px/1.4 var(--fd);letter-spacing:.06em;text-transform:uppercase;background:var(--panel2);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.ok{background:rgba(56,209,132,.14);color:#7ef0b4;border-color:transparent}
.chip.bad{background:rgba(255,90,109,.14);color:#ff9aa6;border-color:transparent}
.chip.hot{background:rgba(255,180,58,.16);color:var(--accent2);border-color:transparent}
.stars{font-size:14px;letter-spacing:1px;white-space:nowrap;background:linear-gradient(90deg,var(--accent) var(--v),#3a3934 var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.li[disabled]{opacity:.45;cursor:default}
.link{color:var(--cyan)}
.flag{width:20px;height:13px;border-radius:2px;display:inline-block;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.35);flex:none}
.crest{display:inline-block;vertical-align:middle;flex:none}
.pos{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 5px;border-radius:4px;font:700 11px/1 var(--fd);letter-spacing:.06em;color:#fff;background:var(--g,#3a3a3e)}
.g-GK{--g:#9a7412}.g-DEF{--g:#2459bd}.g-MID{--g:#11875f}.g-ATT{--g:#b9304a}
.num-badge{display:inline-grid;place-items:center;min-width:24px;height:20px;border-radius:4px;background:var(--bg2);border:1px solid var(--line2);font:700 12px/1 var(--fd);color:var(--muted)}
.rt{display:inline-grid;place-items:center;min-width:36px;height:20px;padding:0 4px;border-radius:4px;font:800 13px/1 var(--fd);color:#0b1220;font-variant-numeric:tabular-nums}
.av{font:700 13px var(--fd);font-variant-numeric:tabular-nums}
.v1{color:#ff6b7c}.v2{color:#ff9f43}.v3{color:#ffd13a}.v4{color:#b6e35a}.v5{color:#38d184}.v6{color:#ffc65c}
.form{display:inline-flex;gap:3px}
.form i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font:800 11px/1 var(--fd);font-style:normal;color:#111}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}

/* ---------- tables ---------- */
.tw{overflow:auto;max-width:100%}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;z-index:1;text-align:left;font:700 11px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:9px 8px;background:var(--panel2);white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th.s{cursor:pointer}.tbl th.s:hover{color:#fff}
.tbl th.on{color:var(--cyan)}
.tbl td{padding:5px 8px;border-bottom:1px solid rgba(32,49,80,.7);white-space:nowrap;font-variant-numeric:tabular-nums;height:31px}
.tbl tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.me td{background:rgba(255,180,58,.09)!important}
.tbl .r{text-align:right}.tbl .c{text-align:center}
.tbl .who{display:flex;align-items:center;gap:8px;min-width:0}
.tbl .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tbl .crest{width:18px;height:22px}
.tbl tr.zp td:first-child{box-shadow:inset 3px 0 0 var(--win)}
.tbl tr.zr td:first-child{box-shadow:inset 3px 0 0 var(--loss)}
.tbl tr.zc td:first-child{box-shadow:inset 3px 0 0 var(--cyan)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:0}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.li small{font-size:12px;display:block}
.li .crest{width:22px;height:26px}
.unread b{color:#fff}.unread .dotc{background:var(--accent)}
.dotc{width:7px;height:7px;border-radius:50%;background:transparent;flex:none}

/* ---------- start ---------- */
.start{max-width:1300px;margin:0 auto;padding-block:20px}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hero svg{width:58px;height:58px}
.hero h1{font-size:clamp(38px,6vw,60px);letter-spacing:.16em;font-weight:800;line-height:.9}
.hero p{margin:4px 0 0;color:var(--muted)}
.pick-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;align-items:start}
.club-prev{position:sticky;top:12px}
.cp-head{display:flex;gap:14px;align-items:center}
.cp-head .crest{width:86px;height:103px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.kits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.kits figure{margin:0;text-align:center}
.kits figcaption{font:700 11px var(--fd);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kit{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0 0 14px}
.facts dt{font:600 11px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:2px 0 0;font-weight:600}

/* ---------- player ---------- */
.pp-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px}
.pp-head .kit{width:92px}
.pp-head h1{font-size:34px;line-height:1}
.pp-head h1 b{text-transform:uppercase}
.pp-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;color:var(--muted);font-size:13px;align-items:center}
.pp-meta .crest{width:18px;height:22px}
.pp-ovr{text-align:center;padding:0 10px}
.pp-ovr .kpi{font-size:44px}
.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ag h4{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:6px}
.ar{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-radius:5px;font-size:13px}
.ar:nth-child(odd){background:rgba(255,255,255,.025)}
.ar b{font:700 15px var(--fd);font-variant-numeric:tabular-nums}
.posmap{position:relative;width:100%;max-width:220px;aspect-ratio:68/100;margin:0 auto;border-radius:8px;background:#164a2c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.posmap i{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;display:grid;place-items:center;font:700 9px var(--fd);font-style:normal;color:#06240f}
.posmap i.n{background:#38d184;box-shadow:0 0 0 3px rgba(56,209,132,.3)}.posmap i.s{background:#b6e35a}.posmap i.x{background:rgba(255,255,255,.12);color:rgba(255,255,255,.5)}

/* ---------- tactics ---------- */
.tac{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:start}
.pitch{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:68/100;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(0deg,#1b5f35 0 8.333%,#1e693b 8.333% 16.666%)}
.pitch>svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:92px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:8px}
.slot .shirt{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 15px/1 var(--fd);box-shadow:0 0 0 2px var(--fit,#fff),0 6px 12px rgba(0,0,0,.45)}
.slot.sel .shirt{box-shadow:0 0 0 3px #fff,0 0 20px 4px rgba(255,255,255,.5)}
.slot .nm{font:700 12px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.03em;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.slot .rl{font:600 10px/1 var(--fd);letter-spacing:.06em;color:rgba(255,255,255,.75);text-transform:uppercase;white-space:nowrap}
.slot .sr{position:absolute;top:0;right:10px;padding:1px 3px;border-radius:4px;background:#0d0d0f;font:800 11px/1.2 var(--fd);box-shadow:0 0 0 1px var(--fit)}
.fit-good{--fit:var(--win)}.fit-ok{--fit:var(--warn)}.fit-bad{--fit:var(--loss)}
.ins{display:grid;gap:10px}
.ins .row{display:grid;gap:5px}
.ins .row>small{font:700 11px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ins .seg{display:flex}
.ins .seg button{flex:1;padding:7px 4px;font-size:12px}
.role-desc{font-size:13px;color:var(--muted);margin:8px 0 0}

/* ---------- match ---------- */
.mbar{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 14px;margin-bottom:12px;background:linear-gradient(180deg,#1c1c1f,#131315);border:1px solid var(--line2);border-radius:10px}
.mt{display:flex;align-items:center;gap:10px;min-width:0}
.mt:last-child{flex-direction:row-reverse;text-align:right}
.mt .crest{width:40px;height:48px}
.mt b{font:700 20px/1 var(--fd);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt small{display:block;font-size:12px;margin-top:3px}
.msc{text-align:center}
.msc .kpi{font-size:40px;letter-spacing:.06em}
.clock{display:inline-block;margin-top:3px;padding:2px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line2);font:700 13px var(--fd);letter-spacing:.08em;color:var(--accent)}
.mgrid{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;gap:12px;align-items:start}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#050505;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.ff{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.72);font:700 12px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);pointer-events:none}
.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.flash b{font:800 clamp(44px,10vw,110px)/1 var(--fd);letter-spacing:.1em;color:#fff;text-shadow:0 0 30px var(--fc,#ffb43a),0 6px 0 rgba(0,0,0,.4)}
.flash.on{animation:flash 2.4s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0}}
.wx{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wxline{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:5px;font-size:12px;color:var(--muted)}
.forecast{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);margin-top:10px}
.forecast .wx{width:26px;height:26px;color:var(--accent)}
.forecast b{display:block}.forecast small{display:block;font-size:12px;margin-top:2px}
.mctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.feed{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}
.feed li{display:grid;grid-template-columns:36px 1fr;gap:6px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:13px}
.feed li b{font:700 13px var(--fd);color:var(--dim)}
.feed .goal{background:linear-gradient(90deg,rgba(255,180,58,.18),transparent)}
.feed .goal span{color:#fff;font-weight:600}.feed .goal b{color:var(--accent)}
.feed .card span::before{content:"";display:inline-block;width:8px;height:11px;border-radius:2px;background:#ffd400;margin-right:6px;vertical-align:-1px}
.feed .red span::before{background:#ff3344}
.feed .whistle span{color:var(--cyan);font-weight:600}
.srow{display:grid;grid-template-columns:46px 1fr 46px;gap:6px;align-items:center;padding:5px 12px;font:700 14px var(--fd);font-variant-numeric:tabular-nums}
.srow span:last-child{text-align:right}
.srow div{text-align:center;font:600 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.srow .bar{grid-column:1/-1;display:flex;height:4px;border-radius:9px;overflow:hidden;background:var(--line)}
.srow .bar i{background:var(--cyan)}.srow .bar i+i{background:var(--accent)}
.lineup .li{grid-template-columns:24px 1fr auto auto;padding:5px 12px}
.lineup .li.sel{background:rgba(255,180,58,.1);box-shadow:inset 3px 0 0 var(--accent)}
.en{width:34px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.en i{display:block;height:100%;background:var(--win)}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.72);backdrop-filter:blur(5px);overflow:auto}
.modal-box{position:relative;width:min(760px,100%);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#1b1b1e,#121214);border:1px solid var(--line2);border-radius:14px;padding:22px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}
.modal .x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:8px;font-size:22px;color:var(--muted)}
.modal .x:hover{background:rgba(255,255,255,.06);color:#fff}
#toast{position:fixed;left:50%;bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 14px));transform:translate(-50%,30px);z-index:120;padding:11px 16px;border-radius:10px;background:#111113;border:1px solid var(--line2);box-shadow:0 20px 40px rgba(0,0,0,.5);font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---- sharp minimal controls ---- */
.btn,.btn:hover,.btn:active{transform:none}
.btn{height:32px;padding:0 14px;border-radius:2px;border:1px solid #3a3a3f;background:#1b1b1d;box-shadow:none;font:700 12px/1 var(--fd);letter-spacing:.1em;transition:background .1s,border-color .1s}
.btn:hover{background:#26262a;border-color:#5c5c62;box-shadow:none}
.btn.pri{background:#e9e6df;color:#111;border-color:#e9e6df;box-shadow:none}
.btn.pri:hover{background:#ffffff;border-color:#ffffff;color:#000;filter:none}
.btn.lg{height:40px;font-size:14px}
.go{height:36px;border-radius:2px;background:#e9e6df;color:#111;border:1px solid #e9e6df;box-shadow:none;font:800 13px/1 var(--fd);letter-spacing:.12em}
.go:hover{background:#fff;color:#000;border-color:#fff}
.seg{border-radius:2px;padding:0;gap:0;border-color:#333337;background:#141416}
.seg button{border-radius:0;padding:7px 11px;border-right:1px solid #2a2a2e}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#26262a;color:#fff;box-shadow:inset 0 -2px 0 #e9e6df}
.nav button{border-radius:0}
.nav button[aria-current="page"]{background:transparent;color:#fff;box-shadow:inset 0 -2px 0 #e9e6df}
.sub button{border-radius:0}
.sub button[aria-current="true"]{background:#1d1d20;box-shadow:inset 0 -2px 0 #e9e6df}
.chip,.pos,.rt,.num-badge{border-radius:2px}
.panel{border-radius:4px}
select,input[type=search],input[type=text]{border-radius:2px}
.lnk{cursor:pointer}.lnk:hover{text-decoration:underline}
/* ---- competitions ---- */
.comp-strip{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;scrollbar-width:thin;padding-bottom:4px}
.comp-pick{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--panel);border-radius:2px;white-space:nowrap;font:700 12px var(--fd);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.comp-pick:hover{border-color:#4a4a50;color:#fff}
.comp-pick[aria-pressed="true"]{border-color:#e9e6df;color:#fff}
.comp-hero{display:flex;gap:20px;align-items:center;padding:18px 20px;margin-bottom:12px;border-radius:4px;border:1px solid var(--line);background:linear-gradient(100deg,color-mix(in srgb,var(--lc) 70%,#000) 0%,color-mix(in srgb,var(--lc) 25%,#0a0a0b) 55%,#0f0f11 100%)}
.comp-hero h1{font-size:clamp(28px,4vw,44px);text-transform:uppercase;line-height:1;margin:4px 0 10px}
.ch-main{min-width:0;flex:1}
.ch-stats{display:flex;flex-wrap:wrap;gap:8px 26px}
.ch-stats small{display:block;font:600 11px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.ch-stats b{font:700 17px var(--fd);display:flex;gap:6px;align-items:center}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.legend .zc,.tbl tr.zc td:first-child{box-shadow:inset 3px 0 0 #e9e6df}.legend i.zc{background:#e9e6df}
.legend i.zq{background:#6e9fd1}.tbl tr.zq td:first-child{box-shadow:inset 3px 0 0 #6e9fd1}
.legend i.zr{background:var(--loss)}.legend i.zp{background:var(--win)}
.fx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.fx-grid.one{grid-template-columns:minmax(0,1fr)}
.fxr{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px}
.fxr .t{display:flex;gap:7px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.fxr .t.r{justify-content:flex-end}
.fxr .sc{min-width:62px;text-align:center;font:800 14px var(--fd);padding:3px 6px;background:var(--bg2);border:1px solid var(--line);border-radius:2px;font-variant-numeric:tabular-nums}
.fxr.mine{background:rgba(233,230,223,.06)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpis small,.kt small{display:block;font:600 11px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kpis b{font:800 22px var(--fd)}
.club-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.cc{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(100deg,color-mix(in srgb,var(--cc) 22%,var(--panel)),var(--panel) 60%)}
.cc b{display:block;font:700 16px var(--fd);text-transform:uppercase}
.cc small{display:block;font-size:12px}
.cc-row{display:flex;gap:10px;align-items:center;margin:4px 0;font:700 13px var(--fd)}
/* ---- transfers ---- */
.kpi-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.kt{background:var(--panel);padding:12px 14px}
.kt b{display:block;font:800 21px var(--fd);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt em{font:500 12px var(--fb);color:var(--muted);font-style:normal;margin-left:2px}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tcard{border:1px solid var(--line);border-radius:4px;background:#121214;padding:12px;display:flex;flex-direction:column;gap:10px}
.tcard header{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tcard header b{display:block;font:700 15px var(--fd);text-transform:uppercase;letter-spacing:.03em}
.tcard header small{display:flex;gap:5px;align-items:center;font-size:11px;color:var(--muted)}
.tc-row,.tc-foot{display:flex;gap:16px}
.tc-row small,.tc-foot small{display:block;font:600 10px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tc-foot{border-top:1px solid var(--line);padding-top:8px;justify-content:space-between}
.tc-foot b{font:700 14px var(--fd)}
.tc-act{display:flex;gap:6px}.tc-act .btn{flex:1}
.abs{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.ab{display:grid;grid-template-columns:30px 1fr 20px;gap:6px;align-items:center;font:700 11px var(--fd);letter-spacing:.06em;color:var(--muted)}
.ab.wide{grid-template-columns:120px 1fr 22px;font-size:12px}
.ab i{height:5px;background:#26262a;display:block}
.ab i b{display:block;height:100%;background:#cfcbc2}
.ab em{font-style:normal;text-align:right;font-size:13px}
.needs{display:grid;gap:7px}
.need{display:grid;grid-template-columns:34px 1fr 22px;gap:8px;align-items:center}
.need i{height:7px;background:#26262a;display:block}.need i b{display:block;height:100%;background:#8f8b83}
.need.hot i b{background:var(--accent)}
.need em{font:700 13px var(--fd);font-style:normal;text-align:right}
.need small{grid-column:2/-1;font-size:11px;margin-top:-4px}
.neg-head{display:grid;grid-template-columns:88px 1fr;gap:16px;align-items:center;margin-bottom:14px}
.neg-head h2{font-size:26px}.neg-head h2 b{text-transform:uppercase}
.neg-head small{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.neg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.neg-notes{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--muted)}
.neg-lbl{display:flex;justify-content:space-between;font:700 12px var(--fd);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.neg-lbl output{font-size:18px;color:#fff}
.neg-msg{min-height:1.4em;font-size:13px;color:var(--accent2)}
.neg-counter{margin-top:10px;padding:10px;border:1px solid #4a4a50;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px}
.search-bar{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
/* ---- office ---- */
.frow{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.frow i{height:8px;background:#222225;display:block}.frow i b{display:block;height:100%;background:#cfcbc2}
.frow em{font:700 14px var(--fd);font-style:normal;text-align:right}
.frow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.split{display:flex;justify-content:space-between;margin-bottom:8px}
.split small{display:block;font:600 11px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.split b{font:800 24px var(--fd)}
.meter.big{height:10px;margin:10px 0}
.meter i{background:#cfcbc2}
/* ---- tactics extras ---- */
.slot .kitm{display:block;width:30px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.slot .kitm .kit{filter:none}
.slot.sel .kitm{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 2px #fff)}
.slot .sr{display:none}
.slot .nm b{color:var(--accent2);margin-left:4px}
.sd{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sd-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sd-top b{font:700 16px var(--fd);text-transform:uppercase}
.sd-kv,.ta-kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.sd-kv b,.ta-kv b{color:var(--text)}
.ta{margin-top:14px}
.ta-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
/* ---- negotiation room ---- */
.modal-box.wide{width:min(1060px,100%);padding:0;overflow:auto}
.modal-box.wide .x{z-index:3;color:#fff}
.nr-head{display:grid;grid-template-columns:120px 1fr 120px;gap:12px;align-items:center;padding:22px 24px;background:linear-gradient(100deg,color-mix(in srgb,var(--a) 55%,#000) 0%,#141416 42%,#141416 58%,color-mix(in srgb,var(--b) 55%,#000) 100%);border-bottom:1px solid var(--line)}
.nr-club{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.nr-club b{font:700 15px var(--fd);text-transform:uppercase;letter-spacing:.05em}
.nr-club small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.nr-player{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;justify-self:center}
.nr-player h2{font-size:30px;line-height:1}.nr-player h2 b{text-transform:uppercase}
.nr-meta{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.nr-steps{display:flex;border-bottom:1px solid var(--line)}
.nr-steps span{flex:1;padding:10px;text-align:center;font:700 12px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-right:1px solid var(--line)}
.nr-steps span:last-child{border-right:0}
.nr-steps .on{color:#fff;box-shadow:inset 0 -2px 0 #e9e6df;background:#18181b}.nr-steps .ok{color:var(--win)}
.nr-body{display:grid;grid-template-columns:1fr 1fr;gap:0}
.nr-col{padding:18px 22px;min-width:0}
.nr-col+.nr-col{border-left:1px solid var(--line);background:#111113}
.nr-col h3{font-size:14px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;color:#dedbd2}
.nr-col input[type=range]{margin:2px 0 14px}
.nr-check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 12px}
.nr-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:8px}
.nr-sum.big{grid-template-columns:repeat(5,1fr);margin:16px 0}
.nr-sum>div{background:#151517;padding:10px}
.nr-sum small{display:block;font:600 10px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.nr-sum b{font:800 17px var(--fd)}
.gauge{margin-bottom:12px}
.g-bar{position:relative;height:14px;background:#222}
.g-bar span{position:absolute;top:0;bottom:0}
.g-bar .z1{background:#5a2a2a}.g-bar .z2{background:#6b5a2a}.g-bar .z3{background:#2f5a3f}.g-bar .z4{background:#2a4a5a}
.g-bar i{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 0 2px #000}
.g-lbl{display:grid;grid-template-columns:repeat(4,1fr);font:600 10px var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.g-read{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.g-read small{display:block;font:600 10px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.g-read b{font:800 16px var(--fd)}
.nr-log{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;margin-top:10px;padding-right:4px}
.msg-b{max-width:86%;padding:8px 11px;border:1px solid var(--line);background:#18181b;font-size:13px}
.msg-b small{display:block;font:700 10px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.msg-b p{margin:0;line-height:1.45}
.msg-b.us{align-self:flex-end;background:#202024;border-color:#3a3a3f}
.msg-b.them{border-left:3px solid #8f8b83}.msg-b.agent{border-left:3px solid var(--accent)}
.nr-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:#121214}
.neg-warn{margin:-6px 0 12px;font-size:12px;color:#ff9a8a}
.nr-done{padding:26px;text-align:center}.nr-done h2{font-size:30px;margin-top:6px}
.tw-banner{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center;padding:18px 20px;margin-bottom:12px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(100deg,#1a1a1d,#121214)}
.tw-banner.open{background:linear-gradient(100deg,color-mix(in srgb,var(--cc) 30%,#121214),#121214 70%);border-color:#3a3a3f}
.tw-banner h2{font-size:26px;text-transform:uppercase;margin:4px 0}
.tw-banner p{margin:0;color:var(--muted);font-size:13px}
.twb-stats{display:grid;gap:8px}
.twb-stats small{display:block;font:600 10px var(--fd);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.twb-stats b{font:700 15px var(--fd)}
@media (max-width:900px){.nr-body{grid-template-columns:1fr}.nr-col+.nr-col{border-left:0;border-top:1px solid var(--line)}.nr-head{grid-template-columns:1fr;justify-items:center}.nr-head .nr-club{display:none}.nr-sum.big{grid-template-columns:repeat(2,1fr)}.tw-banner{grid-template-columns:1fr}}
/* ---- menus ---- */
.nav button{position:relative;transition:color .12s}
.nav button::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:#e9e6df;transform:scaleX(0);transition:transform .15s}
.nav button:hover::after{transform:scaleX(.6)}
.nav button[aria-current="page"]{box-shadow:none}.nav button[aria-current="page"]::after{transform:scaleX(1)}
.sub{background:rgba(10,10,11,.85);backdrop-filter:blur(6px)}
/* ---- charts ---- */
.tac-left{display:grid;gap:12px;align-content:start}
.tc-charts{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:center}
.radar{width:100%;max-width:280px;display:block;margin:0 auto}
.tc-list{display:grid;gap:6px}
.tcl{display:grid;grid-template-columns:1fr 26px 30px;gap:6px;font-size:12px;color:var(--muted)}
.tcl b{color:var(--text);text-align:right;font:700 14px var(--fd)}.tcl em{font:700 12px var(--fd);font-style:normal;text-align:right}
.cond-bars{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;align-items:end;height:110px}
.cond-bars div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cond-bars i{display:block;width:100%;max-width:22px}
.cond-bars span{font:700 11px var(--fd);color:var(--muted)}
.spark{width:100%;height:70px;display:block;margin:8px 0}
/* ---- training / talks / jobs / honours ---- */
.train-grid,.talk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.train-card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--line2);border-radius:2px;background:#151517;transition:border-color .12s,background .12s}
.train-card b{font:700 15px var(--fd);text-transform:uppercase;letter-spacing:.05em}
.train-card small{font-size:12px}
.train-card:hover{border-color:#5c5c62;background:#1c1c1f}
.train-card[aria-pressed="true"]{border-color:#e9e6df;background:#1f1f22;box-shadow:inset 3px 0 0 #e9e6df}
.talk h2{font-size:26px;margin:6px 0 4px}
.jobs{display:grid;gap:8px}
.job{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line2);border-radius:2px;background:linear-gradient(100deg,color-mix(in srgb,var(--cc) 22%,#151517),#151517 60%)}
.job b{display:block;font:700 17px var(--fd);text-transform:uppercase}.job small{display:block;font-size:12px;margin-top:2px}
.cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.cup{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.cup svg{width:70px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
.cup b{font:700 13px var(--fd);text-transform:uppercase}.cup small{font-size:11px}
/* ---- celebrations ---- */
.fx{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;background:rgba(5,5,6,.9);backdrop-filter:blur(6px);opacity:0;transition:opacity .35s}
.fx.show{opacity:1}
.fx-skip{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);height:38px;padding:0 22px;border:1px solid #e9e6df;background:transparent;color:#e9e6df;font:700 13px var(--fd);letter-spacing:.14em;text-transform:uppercase;border-radius:2px;z-index:5}
.fx-skip:hover{background:#e9e6df;color:#111}
.fx-confetti i{position:absolute;top:-20px;left:var(--x);width:7px;height:12px;background:var(--c);opacity:0}
.fx.show .fx-confetti i{animation:conf 2.8s cubic-bezier(.2,.6,.4,1) var(--d) forwards}
@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(var(--r))}}
.fx.sign .fx-confetti,.fx.youth .fx-confetti{display:none}
.sg{position:relative;display:grid;grid-template-columns:auto auto;gap:34px;align-items:center;padding:0 24px;max-width:1000px}
.sg-sweep{position:fixed;inset:0;background:linear-gradient(115deg,transparent 30%,color-mix(in srgb,var(--cc) 55%,transparent) 30% 62%,transparent 62%);transform:translateX(-110%);z-index:-1}
.fx.show .sg-sweep{animation:sweepIn .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes sweepIn{to{transform:translateX(0)}}
