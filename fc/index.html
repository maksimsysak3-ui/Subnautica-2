<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pitch GM</title>
  <meta name="description" content="A football management sim with real clubs, squads and crests, a live 2D match engine, deep tactics and a full transfer market." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>html,body{background:#070a12;margin:0}#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 10%,#133a2c,#070a12 65%);color:#e9eefb;font-family:'Barlow Condensed',Arial Narrow,sans-serif;z-index:1000;transition:opacity .5s}#boot.done{opacity:0;pointer-events:none}#boot h1{margin:0;font-size:clamp(56px,10vw,110px);font-weight:900;font-style:italic;letter-spacing:.02em}#boot h1 b{color:#22e3a1}#boot .bar{width:min(420px,80vw);height:6px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:20px auto 10px}#boot .bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#22e3a1,#3b82f6);transition:width .3s}#boot .msg{text-align:center;color:#8c99b8;font:600 13px Inter,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
  <div id="boot"><div><h1>PITCH<b>GM</b></h1><div class="bar"><i id="boot-bar"></i></div><div class="msg" id="boot-msg">Loading</div></div></div>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
