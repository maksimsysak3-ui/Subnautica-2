<!doctype html>
<meta charset="utf-8"><title>Zone colour code</title>
<style>
  body { margin: 0; padding: 32px; background: #10151b; color: #e6edf4;
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: #7d8b99; font-weight: 500; }
  figure { margin: 0 0 18px; display: flex; gap: 18px; align-items: flex-start;
    background: #161d25; border: 1px solid #232d38; border-radius: 12px; padding: 16px; }
  figcaption b { display: block; font-size: 15px; }
  figcaption span { color: #93a1b0; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; gap: 14px; flex-wrap: wrap; }
  li { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #93a1b0;
    display: flex; align-items: center; gap: 6px; }
  i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #0006; }
</style>
<h1>Zone colour code</h1>
  <figure>
    <img src="residential.svg" width="72" height="72" alt="Residential">
    <figcaption><b>Residential</b><span>Where people live, from detached houses to tower blocks.</span>
      <ul><li><i style="background:#1d4a2b"></i>deep #1d4a2b</li><li><i style="background:#3f9a55"></i>base #3f9a55</li><li><i style="background:#7fc98d"></i>light #7fc98d</li><li><i style="background:#c9e8cf"></i>wash #c9e8cf</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="commercial.svg" width="72" height="72" alt="Commercial">
    <figcaption><b>Commercial</b><span>Shops, food, fuel and services that need passing trade.</span>
      <ul><li><i style="background:#123a63"></i>deep #123a63</li><li><i style="background:#2f7fc1"></i>base #2f7fc1</li><li><i style="background:#79b7e2"></i>light #79b7e2</li><li><i style="background:#c6e0f2"></i>wash #c6e0f2</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="industrial.svg" width="72" height="72" alt="Industrial">
    <figcaption><b>Industrial</b><span>Sheds, plants and yards. Jobs and goods, noise and pollution.</span>
      <ul><li><i style="background:#6b4a10"></i>deep #6b4a10</li><li><i style="background:#d09a2c"></i>base #d09a2c</li><li><i style="background:#eac878"></i>light #eac878</li><li><i style="background:#f4e4bd"></i>wash #f4e4bd</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="office.svg" width="72" height="72" alt="Office">
    <figcaption><b>Office</b><span>Desk work. Clean, dense, and hungry for transport rather than footfall.</span>
      <ul><li><i style="background:#0f4a4c"></i>deep #0f4a4c</li><li><i style="background:#2a9d9c"></i>base #2a9d9c</li><li><i style="background:#7ecfcd"></i>light #7ecfcd</li><li><i style="background:#c8e9e8"></i>wash #c8e9e8</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="service.svg" width="72" height="72" alt="Services">
    <figcaption><b>Services</b><span>What the city provides for itself, and pays for every week.</span>
      <ul><li><i style="background:#3c4450"></i>deep #3c4450</li><li><i style="background:#79879a"></i>base #79879a</li><li><i style="background:#b3bfcd"></i>light #b3bfcd</li><li><i style="background:#dde3ea"></i>wash #dde3ea</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="fire.svg" width="72" height="72" alt="Fire">
    <figcaption><b>Fire</b><span>Stations, a training tower, and the reach of an appliance in traffic.</span>
      <ul><li><i style="background:#5e1b16"></i>deep #5e1b16</li><li><i style="background:#c0392b"></i>base #c0392b</li><li><i style="background:#e58274"></i>light #e58274</li><li><i style="background:#f4cec8"></i>wash #f4cec8</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="police.svg" width="72" height="72" alt="Police">
    <figcaption><b>Police</b><span>Precincts and holding. Coverage buys down crime, slowly.</span>
      <ul><li><i style="background:#152f5c"></i>deep #152f5c</li><li><i style="background:#2f5fa8"></i>base #2f5fa8</li><li><i style="background:#7fa4d8"></i>light #7fa4d8</li><li><i style="background:#cddcf0"></i>wash #cddcf0</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="health.svg" width="72" height="72" alt="Healthcare">
    <figcaption><b>Healthcare</b><span>Clinics up to a general hospital, plus the ambulances they dispatch.</span>
      <ul><li><i style="background:#5e2130"></i>deep #5e2130</li><li><i style="background:#d0596e"></i>base #d0596e</li><li><i style="background:#eb9dab"></i>light #eb9dab</li><li><i style="background:#f7d8de"></i>wash #f7d8de</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="education.svg" width="72" height="72" alt="Education">
    <figcaption><b>Education</b><span>Primary through university. The slowest investment and the largest.</span>
      <ul><li><i style="background:#3a2a58"></i>deep #3a2a58</li><li><i style="background:#7a5ba8"></i>base #7a5ba8</li><li><i style="background:#b39ad4"></i>light #b39ad4</li><li><i style="background:#e0d6ef"></i>wash #e0d6ef</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="water.svg" width="72" height="72" alt="Water & sewage">
    <figcaption><b>Water & sewage</b><span>Pumping, treatment and storage. Nobody notices it until it stops.</span>
      <ul><li><i style="background:#0f4657"></i>deep #0f4657</li><li><i style="background:#2aa3c4"></i>base #2aa3c4</li><li><i style="background:#84d0e2"></i>light #84d0e2</li><li><i style="background:#ccebf3"></i>wash #ccebf3</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="power.svg" width="72" height="72" alt="Electricity">
    <figcaption><b>Electricity</b><span>Generation and the substations that get it to the street.</span>
      <ul><li><i style="background:#6a4a0f"></i>deep #6a4a0f</li><li><i style="background:#e0a52c"></i>base #e0a52c</li><li><i style="background:#f2cf82"></i>light #f2cf82</li><li><i style="background:#faecc9"></i>wash #faecc9</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="transport.svg" width="72" height="72" alt="Transport">
    <figcaption><b>Transport</b><span>Depots, stations and interchanges. The thing that decides the map.</span>
      <ul><li><i style="background:#14503c"></i>deep #14503c</li><li><i style="background:#2f8f6a"></i>base #2f8f6a</li><li><i style="background:#86c9b0"></i>light #86c9b0</li><li><i style="background:#cfe9df"></i>wash #cfe9df</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="government.svg" width="72" height="72" alt="Government">
    <figcaption><b>Government</b><span>City hall, courts and the offices that run the rest of it.</span>
      <ul><li><i style="background:#4c432c"></i>deep #4c432c</li><li><i style="background:#96854f"></i>base #96854f</li><li><i style="background:#c9bd96"></i>light #c9bd96</li><li><i style="background:#e8e2d1"></i>wash #e8e2d1</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="parks.svg" width="72" height="72" alt="Parks">
    <figcaption><b>Parks</b><span>Squares, playgrounds and green space. Land value, not throughput.</span>
      <ul><li><i style="background:#2b5719"></i>deep #2b5719</li><li><i style="background:#6ab04c"></i>base #6ab04c</li><li><i style="background:#a8d693"></i>light #a8d693</li><li><i style="background:#d9edcd"></i>wash #d9edcd</li></ul>
    </figcaption>
  </figure>
