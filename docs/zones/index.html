<!doctype html>
<meta charset="utf-8"><title>Zone colour code</title>
<style>
  body { margin: 0; padding: 32px; background: #10151b; color: #e6edf4;
    font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; }
  h1 { font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
    color: #7d8b99; font-weight: 500; }
  figure { margin: 0 0 18px; display: flex; gap: 18px; align-items: flex-start;
    background: #161d25; border: 1px solid #232d38; border-radius: 12px; padding: 16px; }
  figcaption b { display: block; font-size: 15px; }
  figcaption span { color: #93a1b0; }
  ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; gap: 14px; flex-wrap: wrap; }
  li { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #93a1b0;
    display: flex; align-items: center; gap: 6px; }
  i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #0006; }
</style>
<h1>Zone colour code</h1>
  <figure>
    <img src="residential.svg" width="72" height="72" alt="Residential">
    <figcaption><b>Residential</b><span>Where people live, from detached houses to tower blocks.</span>
      <ul><li><i style="background:#1d4a2b"></i>deep #1d4a2b</li><li><i style="background:#3f9a55"></i>base #3f9a55</li><li><i style="background:#7fc98d"></i>light #7fc98d</li><li><i style="background:#c9e8cf"></i>wash #c9e8cf</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="commercial.svg" width="72" height="72" alt="Commercial">
    <figcaption><b>Commercial</b><span>Shops, food, fuel and services that need passing trade.</span>
      <ul><li><i style="background:#123a63"></i>deep #123a63</li><li><i style="background:#2f7fc1"></i>base #2f7fc1</li><li><i style="background:#79b7e2"></i>light #79b7e2</li><li><i style="background:#c6e0f2"></i>wash #c6e0f2</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="industrial.svg" width="72" height="72" alt="Industrial">
    <figcaption><b>Industrial</b><span>Sheds, plants and yards. Jobs and goods, noise and pollution.</span>
      <ul><li><i style="background:#6b4a10"></i>deep #6b4a10</li><li><i style="background:#d09a2c"></i>base #d09a2c</li><li><i style="background:#eac878"></i>light #eac878</li><li><i style="background:#f4e4bd"></i>wash #f4e4bd</li></ul>
    </figcaption>
  </figure>
  <figure>
    <img src="office.svg" width="72" height="72" alt="Office">
    <figcaption><b>Office</b><span>Desk work. Clean, dense, and hungry for transport rather than footfall.</span>
      <ul><li><i style="background:#0f4a4c"></i>deep #0f4a4c</li><li><i style="background:#2a9d9c"></i>base #2a9d9c</li><li><i style="background:#7ecfcd"></i>light #7ecfcd</li><li><i style="background:#c8e9e8"></i>wash #c8e9e8</li></ul>
    </figcaption>
  </figure>
