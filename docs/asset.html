<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>citysim — asset viewer</title>
<meta name="description" content="Procedural building assets, previewed one at a time.">
<script>
/* Replace a stale cached copy of this page. Same guard as index.html: GitHub
 * Pages serves HTML with a ten-minute max-age and no way to change it, so a
 * deploy is invisible to anyone holding a cached copy. */
window.__BUILD__ = 'mtk0r1l2';
(function () {
  fetch('version.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (v) {
      if (!v || !v.build || v.build === window.__BUILD__) return;
      var key = 'rev-asset-' + v.build;
      if (sessionStorage.getItem(key)) return;
      sessionStorage.setItem(key, '1');
      var params = new URLSearchParams(location.search);
      params.set('b', v.build);
      location.replace(location.pathname + '?' + params.toString() + location.hash);
    })
    .catch(function () { /* dev server, or offline: carry on */ });
})();
</script>
<style>
  :root {
    --bg: #0b0e13; --panel: #0e131a; --fg: #c9d4e3; --dim: #5d6b80;
    --accent: #62d4ff; --line: rgba(98,212,255,.16);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg); font: 12px/1.55 var(--mono); }
  #app { display: grid; grid-template-columns: 268px 1fr; height: 100%; }
  #side { background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 14px 0 24px; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  h1 { font-size: 10px; letter-spacing: .34em; text-transform: uppercase;
    color: var(--dim); font-weight: 500; padding: 0 16px 12px; }
  .group { font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--dim); padding: 14px 16px 5px;
    display: flex; align-items: center; gap: 8px; }
  .group svg { flex: none; border-radius: 4px; }
  /* The category bar: a grid of icon tiles, the toolbar the game will use. */
  #legend { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
    padding: 0 12px 14px; margin-bottom: 4px;
    border-bottom: 1px solid var(--line); }
  .cat { position: relative; display: grid; place-items: center; gap: 0;
    padding: 6px 0 3px; border-radius: 8px; background: rgba(255,255,255,.03);
    border: 1px solid transparent; cursor: pointer; }
  .cat svg { display: block; }
  .cat span { font-size: 9px; color: var(--dim); letter-spacing: .06em; }
  .cat .allx { font-size: 10px; letter-spacing: .14em; color: #dfe7ef;
    line-height: 26px; text-transform: uppercase; }
  .cat:hover { background: rgba(255,255,255,.07); }
  .cat.on { background: color-mix(in srgb, var(--c) 22%, transparent);
    border-color: var(--c); }
  .cat.on span { color: #eef4fb; }
  .item { padding: 7px 16px; cursor: pointer; border-left: 2px solid transparent; }
  .item:hover { background: rgba(98,212,255,.05); }
  .item.on { background: rgba(98,212,255,.10); border-left-color: var(--accent); }
  .item .n { color: var(--fg); }
  .item .m { color: var(--dim); font-size: 11px; }
  .item.on .n { color: var(--accent); }

  #bar { position: absolute; top: 12px; left: 14px; display: flex; gap: 6px; }
  button { font: 11px var(--mono); color: var(--dim); background: rgba(6,9,13,.8);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 10px; cursor: pointer; }
  button:hover { color: var(--fg); }
  button.on { color: #0b0e13; background: var(--accent); border-color: var(--accent); }

  #info { position: absolute; right: 14px; top: 12px; width: 246px; padding: 12px 14px;
    background: rgba(6,9,13,.82); border: 1px solid var(--line); border-radius: 3px;
    color: var(--dim); }
  #info b { color: var(--fg); font-weight: 500; }
  #info .row { display: flex; justify-content: space-between; gap: 10px; }
  #info .note { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line);
    color: var(--dim); line-height: 1.6; }
  #hint { position: absolute; left: 14px; bottom: 12px; color: var(--dim); font-size: 11px; }
  #fatal { position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; padding: 30px; color: #ff6b7a; background: var(--bg);
    z-index: 20; font: 13px/1.6 var(--mono); }
</style>
  <script type="module" crossorigin src="./assets/asset-C5BTbwWL.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/m4-DvGWrzTh.js">
</head>
<body>
  <div id="app">
    <aside id="side"><h1>assets</h1><div id="legend"></div>
  <div id="list"></div></aside>
    <div id="stage">
      <canvas id="gpu-canvas"></canvas>
      <div id="bar">
        <button data-lod="0" class="on">LOD 0</button>
        <button data-lod="1">LOD 1</button>
        <button data-lod="2">LOD 2</button>
        <button id="wire">wireframe</button>
        <button id="spin" class="on">spin</button>
      </div>
      <div id="info"></div>
      <div id="hint">drag to orbit · wheel to zoom</div>
    </div>
  </div>
  <script>
  /* Boot watchdog, same as index.html's and for the same reason.
   *
   * When a static host serves the repository root, this file is the source
   * one: it points at /src/asset-viewer.ts, and GitHub Pages returns .ts as
   * video/mp2t -- HTTP 200, wrong MIME, and the browser silently refuses to
   * execute it as a module. The page then renders its static chrome with no
   * behaviour behind it: buttons that do not respond, an empty asset list,
   * and a blank canvas. Which is exactly how it failed.
   *
   * index.html had this and asset.html did not, which is the whole bug.
   */
  (function () {
    var el = document.querySelector('script[type=module]');
    var SRC = el.src;
    var ran = false;

    function say(msg) {
      var box = document.getElementById('stage');
      if (!box) return;
      var d = document.createElement('div');
      d.id = 'fatal';
      d.innerHTML = msg;
      box.appendChild(d);
    }

    function inDocs() {
      return /\/docs\//.test(location.pathname);
    }

    function diagnose() {
      if (ran || window.__viewerBooted) return;
      ran = true;
      fetch(SRC, { cache: 'no-store' }).then(function (r) {
        var type = (r.headers.get('content-type') || 'unknown').toLowerCase();
        var ok = r.ok && (type.indexOf('javascript') !== -1 || type.indexOf('ecmascript') !== -1);
        if (ok) {
          say('The page loaded but never started.<br>Press ` for the log.');
          return;
        }
        if (!inDocs()) {
          fetch('docs/asset.html', { cache: 'no-store' })
            .then(function (d) {
              if (d.ok) location.replace('docs/asset.html' + location.search + location.hash);
              else say('Nothing is built here. Run <b>npm run build</b>.');
            })
            .catch(function () { say('Nothing is built here. Run <b>npm run build</b>.'); });
          return;
        }
        say('The app bundle came back as <b>' + type + '</b>, not JavaScript.');
      }).catch(function (e) {
        say('Could not reach the app bundle:<br>' + e);
      });
    }

    el.addEventListener('error', diagnose);
    setTimeout(diagnose, 2500);
  })();
  </script>
</body>
</html>
