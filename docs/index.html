<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>citysim</title>
<meta name="description" content="A city simulation engine built on WebGPU.">
<!-- Adds COOP/COEP so SharedArrayBuffer works on GitHub Pages. Must run before the app. -->
<script src="./coi-serviceworker.js"></script>
<style>
  :root {
    --bg: #0b0e13;
    --fg: #c9d4e3;
    --dim: #5d6b80;
    --accent: #62d4ff;
    --warn: #ffb454;
    --err: #ff6b7a;
    --ok: #7ee0a0;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #gpu-canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; outline: none;
  }
  /* ---- boot screen ---- */
  #boot {
    position: fixed; inset: 0; display: grid; place-content: center;
    gap: 10px; background: var(--bg); z-index: 10;
    transition: opacity .35s ease; text-align: center;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot h1 {
    font-size: 12px; font-weight: 500; letter-spacing: .42em;
    text-transform: uppercase; color: var(--dim);
  }
  #boot-status { color: var(--accent); font-size: 12px; min-height: 1.5em; }
  /* ---- overlays mounted by the app ---- */
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  noscript { position: fixed; inset: 0; display: grid; place-content: center; }
</style>
  <script type="module" crossorigin src="/Subnautica-2/assets/index-CpdXjxse.js"></script>
</head>
<body>
  <canvas id="gpu-canvas" tabindex="0"></canvas>
  <div id="overlay"></div>
  <div id="boot">
    <h1>citysim</h1>
    <div id="boot-status">initialising&hellip;</div>
  </div>
  <noscript>This requires JavaScript and a WebGPU-capable browser.</noscript>
  <script>
  /* Boot watchdog.
   *
   * If the module bundle never runs -- 404, wrong MIME type, a syntax error on
   * an old browser -- the page just sits on "initialising..." forever with no
   * clue why. Four seconds in, go and find out.
   */
  (function () {
    var SRC = document.querySelector('script[type=module]').src;
    setTimeout(function () {
      if (window.__citysimBooted) return;
      var box = document.getElementById('boot-status');
      if (!box) return;
      var say = function (msg) { box.innerHTML = msg; box.style.color = '#ffb454'; };
      say('the app bundle did not load&hellip;');
      fetch(SRC, { method: 'GET', cache: 'no-store' })
        .then(function (r) {
          var type = r.headers.get('content-type') || 'unknown';
          if (!r.ok) {
            say(
              '<b>' + r.status + '</b> fetching the app bundle<br><br>' +
              '<span style="color:#5d6b80;font-size:11px">' + SRC + '</span><br><br>' +
              'If this is GitHub Pages, the source folder is set to <b>/</b>.<br>' +
              'It needs to be <b>/docs</b> — that is where the built site lives.<br>' +
              'Settings &rarr; Pages &rarr; Folder &rarr; /docs'
            );
          } else if (type.indexOf('javascript') === -1) {
            say(
              'the server sent the bundle as <b>' + type + '</b>,<br>' +
              'so the browser refused to run it as a module.'
            );
          } else {
            say(
              'the bundle downloaded but never ran.<br>' +
              '<span style="color:#5d6b80;font-size:11px">press ` for the log, or open the browser console</span>'
            );
          }
        })
        .catch(function (e) {
          say('could not reach the app bundle:<br><span style="color:#5d6b80;font-size:11px">' + e + '</span>');
        });
    }, 4000);
  })();
  </script>
</body>
</html>
