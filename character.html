<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================ RENDERER */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d11);
scene.fog = new THREE.FogExp2(0x0d0d11, 0.02);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(1.9, 1.75, 4.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.6;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.56;
controls.target.set(0, 1.45, 0);

/* IBL from procedural room — gives soft, even, realistic base light (fixes darkness) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.05).texture;

/* ============================================================ LIGHTS (brighter, still cinematic) */
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x241d15, 0.55));
const ambient = new THREE.AmbientLight(0xffffff, 0.25);
scene.add(ambient);

const key = new THREE.SpotLight(0xfff0d8, 6.5, 40, Math.PI * 0.28, 0.55, 1.2);
key.position.set(-3.6, 5.4, 3.8);
key.target.position.set(-0.15, 1.6, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
key.shadow.camera.near = 1; key.shadow.camera.far = 18;
scene.add(key, key.target);

const rim = new THREE.SpotLight(0xaebfe0, 7.0, 40, Math.PI * 0.32, 0.7, 1.5);
rim.position.set(4.4, 4.2, -3.6);
rim.target.position.set(0, 1.6, 0);
scene.add(rim, rim.target);

const fill = new THREE.PointLight(0xffe0bf, 2.2, 22, 2);
fill.position.set(2.8, 1.7, 3.4);
scene.add(fill);

/* background amber practicals */
const practicalGroup = new THREE.Group(); scene.add(practicalGroup);
for (let i = 0; i < 6; i++) {
  const p = new THREE.PointLight(0xff9a3c, 1.1, 6, 2.2);
  p.position.set(3.9 + (i % 2) * 0.5, 0.9 + i * 0.55, -4.0 - (i % 3) * 0.3);
  practicalGroup.add(p);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), new THREE.MeshBasicMaterial({ color: 0xffb056 }));
  bulb.position.copy(p.position); practicalGroup.add(bulb);
}

/* ============================================================ FLOOR */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30, 96),
  new THREE.MeshStandardMaterial({ color: 0x121216, roughness: 0.5, metalness: 0.35 })
);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
{
  const grid = new THREE.PolarGridHelper(9, 8, 8, 64, 0x26221a, 0x1a1813);
  grid.position.y = 0.002; grid.material.opacity = 0.3; grid.material.transparent = true; scene.add(grid);
}

/* ============================================================ MATERIALS */
const skinMat = new THREE.MeshStandardMaterial({ color: 0xb78a68, roughness: 0.58, metalness: 0.0 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x161009, roughness: 0.42, metalness: 0.12 });
const suitMat = new THREE.MeshPhysicalMaterial({
  color: 0x14141a, roughness: 0.72, metalness: 0.0, sheen: 0.7,
  sheenColor: new THREE.Color(0x33333d), sheenRoughness: 0.5, clearcoat: 0.05
});
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x0d0d0f, roughness: 0.5 });
const tieMat = new THREE.MeshPhysicalMaterial({ color: 0x08080a, roughness: 0.38, sheen: 0.9, sheenColor: new THREE.Color(0x3a3a44) });
const kerchiefMat = new THREE.MeshStandardMaterial({ color: 0xece9e1, roughness: 0.66 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.24, metalness: 1.0 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0e14, roughness: 0.04, metalness: 0, transmission: 0.5, thickness: 0.2 });
const shoeMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, roughness: 0.26, clearcoat: 0.7, clearcoatRoughness: 0.2 });

/* ============================================================ CHARACTER RIG */
const character = new THREE.Group();
scene.add(character);
const FEET_Y = 0.0;

/* ---- variable-radius tube (single continuous limb surface) ---- */
function radiusAt(radii, t) {
  const seg = t * (radii.length - 1);
  const i = Math.floor(seg), f = seg - i;
  const a = radii[Math.min(i, radii.length - 1)];
  const b = radii[Math.min(i + 1, radii.length - 1)];
  return a + (b - a) * f;
}
function varTube(pts, radii, radial = 20, tubular = 46, squashZ = 1, capEnds = true) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), false, 'catmullrom', 0.5);
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], idx = [];
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    const P = curve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    const r = radiusAt(radii, t);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const v = P.clone()
        .addScaledVector(N, r * Math.cos(a))
        .addScaledVector(B, r * Math.sin(a) * squashZ);
      pos.push(v.x, v.y, v.z);
    }
  }
  for (let i = 0; i < tubular; i++)
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  if (capEnds) { /* small end fill via center fans */ }
  g.computeVertexNormals();
  return g;
}

/* ---- lofted elliptical rings (torso) ---- */
function loftRings(rings, radial = 28) {
  const pos = [], idx = [];
  rings.forEach(r => {
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      pos.push((r.cx || 0) + Math.cos(a) * r.rx, r.y, (r.cz || 0) + Math.sin(a) * r.rz);
    }
  });
  for (let i = 0; i < rings.length - 1; i++)
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j, b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ================= SUIT BODY (merged continuous mesh) ================= */
const torsoGeo = loftRings([
  { y: 0.86, rx: 0.20, rz: 0.155 },
  { y: 0.96, rx: 0.185, rz: 0.14 },
  { y: 1.06, rx: 0.185, rz: 0.14 },
  { y: 1.18, rx: 0.215, rz: 0.155 },
  { y: 1.30, rx: 0.255, rz: 0.175 },
  { y: 1.40, rx: 0.29, rz: 0.185 },
  { y: 1.48, rx: 0.30, rz: 0.18 },
  { y: 1.54, rx: 0.235, rz: 0.155 },
  { y: 1.585, rx: 0.13, rz: 0.115 }
], 30);

/* shoulders — smooth caps that blend the arms in */
const shoulderL = new THREE.SphereGeometry(0.2, 24, 20); shoulderL.translate(-0.29, 1.5, 0);
const shoulderR = new THREE.SphereGeometry(0.2, 24, 20); shoulderR.translate(0.29, 1.5, 0);

/* arms — folded low, hands meeting toward centre (reference pose) */
const armL = varTube(
  [[-0.30, 1.50, 0.0], [-0.35, 1.30, 0.03], [-0.33, 1.10, 0.10], [-0.20, 1.02, 0.24], [-0.05, 1.0, 0.30]],
  [0.135, 0.12, 0.11, 0.085, 0.07], 20, 48, 1.0
);
const armR = varTube(
  [[0.30, 1.50, 0.0], [0.35, 1.30, 0.03], [0.33, 1.10, 0.10], [0.20, 1.02, 0.24], [0.06, 1.0, 0.30]],
  [0.135, 0.12, 0.11, 0.085, 0.07], 20, 48, 1.0
);

/* legs */
const legL = varTube(
  [[-0.12, 0.92, 0.0], [-0.14, 0.70, 0.02], [-0.13, 0.45, 0.03], [-0.13, 0.22, 0.02], [-0.13, 0.04, 0.0]],
  [0.175, 0.16, 0.125, 0.11, 0.10], 20, 44, 1.0
);
const legR = varTube(
  [[0.12, 0.92, 0.0], [0.14, 0.70, 0.02], [0.13, 0.45, 0.03], [0.13, 0.22, 0.02], [0.13, 0.04, 0.0]],
  [0.175, 0.16, 0.125, 0.11, 0.10], 20, 44, 1.0
);

const suitGeo = mergeGeometries([torsoGeo, shoulderL, shoulderR, armL, armR, legL, legR], false);
const suit = new THREE.Mesh(suitGeo, suitMat);
suit.castShadow = true; suit.receiveShadow = true;
character.add(suit);

/* ================= SHIRT / TIE / LAPELS ================= */
const dress = new THREE.Group(); character.add(dress);
// shirt V (visible chest triangle)
const shirtV = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 3, 1), shirtMat);
shirtV.rotation.x = Math.PI; shirtV.position.set(0, 1.36, 0.2); shirtV.scale.set(1, 1, 0.5);
shirtV.castShadow = true; dress.add(shirtV);
// collar
[-1, 1].forEach(s => {
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.13, 0.03), shirtMat);
  c.position.set(s * 0.08, 1.53, 0.16); c.rotation.z = s * 0.5; c.rotation.y = s * 0.25;
  c.castShadow = true; dress.add(c);
});
// tie knot + blade
const knot = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, 0.06), tieMat);
knot.position.set(0, 1.48, 0.2); dress.add(knot);
const tie = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.5, 0.04), tieMat);
tie.position.set(0, 1.2, 0.215); dress.add(tie);
const tieTip = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.1, 4), tieMat);
tieTip.position.set(0, 0.93, 0.215); tieTip.rotation.x = Math.PI; tieTip.rotation.y = Math.PI / 4; dress.add(tieTip);
// lapels
[-1, 1].forEach(s => {
  const lap = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.62, 0.035), suitMat);
  lap.position.set(s * 0.14, 1.34, 0.21); lap.rotation.z = s * 0.16; lap.rotation.y = s * -0.3;
  lap.castShadow = true; dress.add(lap);
});
// buttons
for (let i = 0; i < 2; i++) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.015, 12), metalMat);
  b.rotation.x = Math.PI / 2; b.position.set(0.015, 1.15 - i * 0.22, 0.235); dress.add(b);
}
// pocket square
const pocket = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.04, 0.02), kerchiefMat);
pocket.position.set(-0.2, 1.33, 0.235); pocket.rotation.z = 0.06; dress.add(pocket);
for (let i = 0; i < 3; i++) {
  const pk = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.05, 4), kerchiefMat);
  pk.position.set(-0.235 + i * 0.03, 1.36, 0.24); dress.add(pk);
}

/* ================= NECK + HANDS (skin) ================= */
const neckGeo = varTube([[0, 1.55, 0.02], [0, 1.63, 0.02], [0, 1.7, 0.02]], [0.10, 0.105, 0.10], 20, 10);
const neck = new THREE.Mesh(neckGeo, skinMat);
neck.castShadow = true; character.add(neck);

function buildHand(mirror) {
  const parts = [];
  const palm = new THREE.SphereGeometry(0.075, 18, 14);
  palm.scale(1.05, 0.7, 1.25); parts.push(palm);
  for (let i = 0; i < 4; i++) {
    const f = varTube(
      [[-0.05 + i * 0.033, 0, 0.06], [-0.05 + i * 0.033, -0.01, 0.13], [-0.05 + i * 0.033, -0.03, 0.18]],
      [0.02, 0.019, 0.016], 8, 8);
    parts.push(f);
  }
  const thumb = varTube(
    [[mirror * 0.06, 0.0, 0.02], [mirror * 0.09, -0.01, 0.07], [mirror * 0.09, -0.02, 0.12]],
    [0.024, 0.021, 0.017], 8, 8);
  parts.push(thumb);
  return mergeGeometries(parts, false);
}
const handL = new THREE.Mesh(buildHand(-1), skinMat);
handL.position.set(-0.06, 1.0, 0.32); handL.rotation.set(-0.55, 0.25, 0.15); handL.castShadow = true;
const handR = new THREE.Mesh(buildHand(1), skinMat);
handR.position.set(0.08, 0.98, 0.34); handR.rotation.set(-0.6, -0.15, -0.1); handR.castShadow = true;
character.add(handL, handR);

/* wristwatch */
const watch = new THREE.Group();
watch.position.set(-0.14, 1.0, 0.28);
const band = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.024, 12, 24), new THREE.MeshStandardMaterial({ color: 0x141319, roughness: 0.5 }));
band.rotation.y = Math.PI / 2; watch.add(band);
const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.025, 24), metalMat);
dial.rotation.z = Math.PI / 2; watch.add(dial);
const wface = new THREE.Mesh(new THREE.CylinderGeometry(0.044, 0.044, 0.028, 24), glassMat);
wface.rotation.z = Math.PI / 2; wface.position.x = 0.004; watch.add(wface);
character.add(watch);

/* ================= FEET / SHOES ================= */
[-1, 1].forEach(s => {
  const shoe = new THREE.Mesh(new THREE.SphereGeometry(0.13, 22, 18), shoeMat);
  shoe.scale.set(1, 0.55, 1.9); shoe.position.set(s * 0.13, 0.06, 0.12);
  shoe.castShadow = true; shoe.receiveShadow = true; character.add(shoe);
});

/* ================= HEAD =================
   Real scanned high-poly male head (Lee Perry-Smith, ~15k tris) with
   colour + normal maps for an accurate face. Falls back to a sculpted
   ovoid head if the asset can't be fetched. */
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.72, 0.02);
character.add(headGroup);

const bar = document.getElementById('barfill');
const setProg = p => { if (bar) bar.style.width = Math.round(p * 100) + '%'; };

const HEAD_TARGET_HEIGHT = 0.30;
const GH = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/LeePerrySmith/';
const texLoader = new THREE.TextureLoader();

function addHair(headRadius) {
  const hair = new THREE.Group();
  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(headRadius * 1.06, 40, 32, 0, Math.PI * 2, 0, Math.PI * 0.6),
    hairMat);
  cap.scale.set(1.0, 1.15, 1.05); cap.position.y = headRadius * 0.28; cap.position.z = -headRadius * 0.05;
  cap.castShadow = true; hair.add(cap);
  const rnd = mulberry32(7);
  for (let i = 0; i < 60; i++) {
    const a = rnd() * Math.PI * 2, t = rnd();
    const r = headRadius * (0.92 + rnd() * 0.14);
    const lock = new THREE.Mesh(new THREE.SphereGeometry(headRadius * (0.13 + rnd() * 0.1), 10, 10), hairMat);
    lock.position.set(Math.cos(a) * r, headRadius * (0.5 + t * 0.62) + rnd() * 0.03, Math.sin(a) * r * 0.9 - headRadius * 0.05);
    if (lock.position.z > headRadius * 0.55 && lock.position.y < headRadius * 0.6) continue; // keep face clear
    lock.scale.set(1, 0.7, 1); lock.castShadow = true; hair.add(lock);
  }
  hair.position.y = headRadius * 0.15;
  headGroup.add(hair);
}

function sculptFallbackHead() {
  const g = new THREE.SphereGeometry(0.15, 48, 48);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.y *= 1.18;                          // elongate
    if (v.y < 0) v.z += -v.y * 0.5;       // jaw forward
    if (v.z < 0) v.z *= 0.85;             // flatten back
    if (v.y < -0.06) { v.x *= 0.82; }     // taper to chin
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  const head = new THREE.Mesh(g, skinMat); head.castShadow = true;
  // nose
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.09, 8), skinMat);
  nose.position.set(0, -0.01, 0.15); nose.rotation.x = Math.PI / 2.1; head.add(nose);
  headGroup.add(head);
  addHair(0.15);
}

const loader = new GLTFLoader();
let headReady = false;
loader.load(GH + 'LeePerrySmith.glb',
  (gltf) => {
    let mesh = null;
    gltf.scene.traverse(o => { if (o.isMesh && !mesh) mesh = o; });
    if (!mesh) { sculptFallbackHead(); finishHead(); return; }
    const geo = mesh.geometry;
    geo.computeBoundingBox();
    const bb = geo.boundingBox, size = new THREE.Vector3(); bb.getSize(size);
    const center = new THREE.Vector3(); bb.getCenter(center);
    const s = HEAD_TARGET_HEIGHT / size.y;

    Promise.allSettled([
      new Promise(res => texLoader.load(GH + 'Map-COL.jpg', t => { t.colorSpace = THREE.SRGBColorSpace; res(t); }, undefined, () => res(null))),
      new Promise(res => texLoader.load(GH + 'Infinite-Level_02_Tangent_SmoothUV.jpg', t => res(t), undefined, () => res(null)))
    ]).then(([col, nrm]) => {
      const m = new THREE.MeshStandardMaterial({ color: 0xd9b493, roughness: 0.62, metalness: 0.0 });
      if (col.value) m.map = col.value;
      if (nrm.value) { m.normalMap = nrm.value; m.normalScale.set(0.7, 0.7); }
      mesh.material = m;
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.geometry.translate(-center.x, -center.y, -center.z);
      mesh.scale.setScalar(s);
      mesh.rotation.y = 0;                 // native facing is toward +Z (camera)
      mesh.position.set(0, 0, 0);
      headGroup.add(mesh);
      addHair(HEAD_TARGET_HEIGHT * 0.5);
      finishHead();
    });
  },
  (e) => { if (e.total) setProg(0.15 + 0.7 * (e.loaded / e.total)); },
  () => { sculptFallbackHead(); finishHead(); }   // network/CORS fallback
);

function finishHead() { headReady = true; setProg(1); hideLoader(); }

/* ============================================================ BACKGROUND set dressing */
const bg = new THREE.Group(); scene.add(bg);
const slab = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 0.3), new THREE.MeshStandardMaterial({ color: 0x1c1a17, roughness: 0.85 }));
slab.position.set(-3.6, 3, -5); slab.receiveShadow = true; bg.add(slab);
const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 8, 0.4), new THREE.MeshStandardMaterial({ color: 0x100f0d, roughness: 0.6, metalness: 0.3 }));
shelf.position.set(4.3, 3, -5.1); bg.add(shelf);
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.5, 12),
    new THREE.MeshStandardMaterial({ color: 0x241808, roughness: 0.3, metalness: 0.2 }));
  b.position.set(3.7 + (i % 3) * 0.4, 1.1 + i * 0.6, -4.6); bg.add(b);
}

/* ============================================================ POST */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.85, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================ UI */
document.getElementById('spin').onchange = e => autoSpin = e.target.checked;
document.getElementById('key').oninput = e => key.intensity = +e.target.value;
document.getElementById('fill').oninput = e => fill.intensity = +e.target.value;
document.getElementById('rim').oninput = e => rim.intensity = +e.target.value;
document.getElementById('exp').oninput = e => renderer.toneMappingExposure = +e.target.value;
let autoSpin = true;

const views = {
  hero: { pos: [1.9, 1.75, 4.4], tgt: [0, 1.45, 0] },
  face: { pos: [0.55, 1.85, 1.9], tgt: [0, 1.72, 0.05] },
  full: { pos: [2.8, 2.2, 6.0], tgt: [0, 1.1, 0] }
};
let wire = false, fly = null;
document.querySelectorAll('.btn[data-view]').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.view;
    if (v === 'wire') {
      wire = !wire;
      scene.traverse(o => { if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = wire; });
      btn.classList.toggle('on', wire); return;
    }
    document.querySelectorAll('.btn[data-view]').forEach(b => { if (b.dataset.view !== 'wire') b.classList.remove('on'); });
    btn.classList.add('on');
    const c = views[v];
    fly = { fromP: camera.position.clone(), toP: new THREE.Vector3(...c.pos),
            fromT: controls.target.clone(), toT: new THREE.Vector3(...c.tgt), t: 0 };
  };
});

/* ============================================================ LOOP */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (autoSpin && !fly) character.rotation.y = Math.sin(t * 0.11) * 0.32;
  character.position.y = FEET_Y + Math.sin(t * 1.1) * 0.004; // breathing
  if (headReady) headGroup.rotation.x = Math.sin(t * 0.5) * 0.02;
  practicalGroup.children.forEach((c, i) => { if (c.isLight) c.intensity = 1.0 + Math.sin(t * 6 + i) * 0.15; });
  if (fly) {
    fly.t = Math.min(1, fly.t + dt * 1.5);
    const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;
    camera.position.lerpVectors(fly.fromP, fly.toP, e);
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.t >= 1) fly = null;
  }
  controls.update();
  composer.render();
}
animate();

/* ============================================================ misc */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let loaderHidden = false;
function hideLoader() {
  if (loaderHidden) return; loaderHidden = true;
  const l = document.getElementById('loading');
  l.style.opacity = 0; setTimeout(() => l.remove(), 700);
}
// safety: never leave the loader stuck
setTimeout(hideLoader, 8000);
</script>
