<meta charset="utf-8" />
<title>Cinematic Character — Mesh Study 01</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---- HUD ---- */
  .hud {
    position: fixed; z-index: 10; color: #d7d2c8; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,.9);
  }
  .title { top: 22px; left: 26px; }
  .title h1 { margin: 0; font-size: 15px; letter-spacing: .28em; font-weight: 600; text-transform: uppercase; color: #ece7dc; }
  .title p  { margin: 6px 0 0; font-size: 11px; letter-spacing: .18em; color: #8a8478; text-transform: uppercase; }

  .hint { bottom: 20px; left: 26px; font-size: 11px; letter-spacing: .12em; color: #6f6a60; }
  .hint b { color: #b8b2a6; font-weight: 600; }

  .panel {
    position: fixed; z-index: 11; top: 20px; right: 20px; width: 210px;
    padding: 14px 16px 16px; border-radius: 14px;
    background: rgba(14,14,16,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
    color: #cfc9bd; font-size: 12px; letter-spacing: .04em;
  }
  .panel h2 { margin: 0 0 12px; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: #7f7a6f; font-weight: 600; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 9px 0; }
  .row label { color: #a49e92; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    cursor: pointer; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03);
    color: #d7d2c8; border-radius: 8px; padding: 6px 9px; font-size: 11px; letter-spacing: .05em;
    transition: background .18s, border-color .18s, transform .05s;
  }
  .btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.22); }
  .btn:active { transform: translateY(1px); }
  .btn.on { background: rgba(214,196,150,.16); border-color: rgba(214,196,150,.5); color: #f0e6cf; }
  input[type=range] { width: 100px; accent-color: #d6c496; }
  .loading {
    position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
    background: #050506; color: #6f6a60; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
    transition: opacity .6s ease; }
</style>

<div id="app"></div>

<div class="hud title">
  <h1>Mesh Study — 01</h1>
  <p>Character · Suit · Cinematic</p>
</div>
<div class="hud hint">
  <b>Drag</b> orbit &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>Right-drag</b> pan
</div>

<div class="panel">
  <h2>Direction</h2>
  <div class="row"><label>Auto-orbit</label><input id="spin" type="checkbox" checked></div>
  <div class="row"><label>Key light</label><input id="key" type="range" min="0" max="8" step="0.1" value="4.2"></div>
  <div class="row"><label>Rim light</label><input id="rim" type="range" min="0" max="12" step="0.1" value="6"></div>
  <div class="row"><label>Exposure</label><input id="exp" type="range" min="0.4" max="2.2" step="0.02" value="1.05"></div>
  <div class="btns">
    <button class="btn on" data-view="hero">Hero</button>
    <button class="btn" data-view="face">Face</button>
    <button class="btn" data-view="full">Full</button>
    <button class="btn" data-view="wire">Wire</button>
  </div>
</div>

<div class="loading" id="loading">Loading scene…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070708);
scene.fog = new THREE.FogExp2(0x070708, 0.028);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.6, 2.2, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.56;
controls.target.set(0, 1.55, 0);

/* ============================================================
   ENVIRONMENT LIGHT (subtle, so PBR materials have something to reflect)
   ============================================================ */
const pmrem = new THREE.PMREMGenerator(renderer);
{
  const envScene = new THREE.Scene();
  const g = new THREE.SphereGeometry(20, 24, 16);
  const m = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
  // vertical gradient env: dark warm floor -> near-black top
  const c = document.createElement('canvas'); c.width = 8; c.height = 128;
  const ctx = c.getContext('2d');
  const grd = ctx.createLinearGradient(0, 0, 0, 128);
  grd.addColorStop(0.0, '#101012');
  grd.addColorStop(0.55, '#1a1712');
  grd.addColorStop(0.8, '#241d13');
  grd.addColorStop(1.0, '#050505');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, 8, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  m.map = tex;
  envScene.add(new THREE.Mesh(g, m));
  scene.environment = pmrem.fromScene(envScene, 0.04).texture;
}

/* ============================================================
   LIGHTING — cinematic low-key, dramatic side key + cool rim
   ============================================================ */
const ambient = new THREE.AmbientLight(0x2a2620, 0.28);
scene.add(ambient);

// KEY — warm, high, camera-left (like the reference's window light)
const key = new THREE.SpotLight(0xffe6c2, 4.2, 30, Math.PI * 0.22, 0.5, 1.4);
key.position.set(-4.2, 6.0, 3.4);
key.target.position.set(-0.2, 1.7, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
scene.add(key, key.target);

// RIM / kicker — cool, behind-right, carves the silhouette
const rim = new THREE.SpotLight(0x9fb6d8, 6.0, 30, Math.PI * 0.3, 0.7, 1.6);
rim.position.set(4.6, 4.4, -3.8);
rim.target.position.set(0, 1.7, 0);
scene.add(rim, rim.target);

// FILL — very soft warm bounce from front-right
const fill = new THREE.PointLight(0xffcf9e, 0.5, 18, 2);
fill.position.set(2.6, 1.6, 3.2);
scene.add(fill);

// Practicals — the amber "bottles / shelf" glow in the background
const practicalGroup = new THREE.Group();
scene.add(practicalGroup);
for (let i = 0; i < 6; i++) {
  const p = new THREE.PointLight(0xff9a3c, 0.9, 5, 2.2);
  p.position.set(3.8 + (i % 2) * 0.5, 0.8 + i * 0.55, -4.2 - (i % 3) * 0.3);
  practicalGroup.add(p);
  const bulb = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffb056 })
  );
  bulb.position.copy(p.position);
  practicalGroup.add(bulb);
}

/* ============================================================
   FLOOR — blank, faintly reflective, catches the shadow
   ============================================================ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(26, 96),
  new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.55, metalness: 0.35 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// faint radial grid to give the "blank canvas floor" some read
{
  const grid = new THREE.PolarGridHelper(9, 8, 8, 64, 0x1c1a16, 0x141311);
  grid.position.y = 0.002;
  grid.material.opacity = 0.28; grid.material.transparent = true;
  scene.add(grid);
}

/* ============================================================
   MATERIALS
   ============================================================ */
const skinMat = new THREE.MeshStandardMaterial({
  color: 0x9c7256, roughness: 0.62, metalness: 0.0,
});
const skinShadowMat = new THREE.MeshStandardMaterial({ color: 0x6b4d3a, roughness: 0.7 });
const hairMat = new THREE.MeshStandardMaterial({ color: 0x120e0a, roughness: 0.45, metalness: 0.1 });
const stubbleMat = new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.9 });
const suitMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a0c, roughness: 0.74, metalness: 0.0, sheen: 0.6,
  sheenColor: new THREE.Color(0x2b2b33), sheenRoughness: 0.55, clearcoat: 0.06,
});
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x090909, roughness: 0.55 });
const tieMat = new THREE.MeshPhysicalMaterial({ color: 0x060606, roughness: 0.4, sheen: 0.8, sheenColor: new THREE.Color(0x333) });
const kerchiefMat = new THREE.MeshStandardMaterial({ color: 0xe9e6df, roughness: 0.7 });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xd8d4cc, roughness: 0.3 });
const irisMat = new THREE.MeshStandardMaterial({ color: 0x2c1d10, roughness: 0.25 });
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.25, metalness: 1.0 });
const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0d12, roughness: 0.05, metalness: 0, transmission: 0.4, thickness: 0.2 });

/* small helper */
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ============================================================
   CHARACTER
   ============================================================ */
const character = new THREE.Group();
scene.add(character);

/* ---------- HEAD ---------- */
const head = new THREE.Group();
head.position.set(0, 2.62, 0);
character.add(head);

// cranium
const skull = mesh(new THREE.SphereGeometry(0.4, 48, 48), skinMat);
skull.scale.set(0.92, 1.05, 0.98);
head.add(skull);

// jaw / lower face — tapered to a defined chin
const jaw = mesh(new THREE.SphereGeometry(0.34, 40, 40), skinMat, 0, -0.2, 0.02);
jaw.scale.set(0.82, 0.9, 0.9);
head.add(jaw);
const chin = mesh(new THREE.SphereGeometry(0.13, 24, 24), skinMat, 0, -0.42, 0.2);
chin.scale.set(1.1, 0.8, 0.9);
head.add(chin);

// cheekbones
[-1, 1].forEach(s => {
  const cheek = mesh(new THREE.SphereGeometry(0.14, 24, 24), skinMat, s * 0.22, -0.06, 0.24);
  cheek.scale.set(1.0, 0.75, 0.7);
  head.add(cheek);
});

// brow ridge
const brow = mesh(new THREE.BoxGeometry(0.5, 0.08, 0.16), skinMat, 0, 0.12, 0.32);
brow.geometry.translate(0, 0, 0.02);
head.add(brow);

// nose — bridge + tip + nostrils
const noseBridge = mesh(new THREE.BoxGeometry(0.08, 0.28, 0.12), skinMat, 0, 0.0, 0.36);
noseBridge.rotation.x = 0.18; head.add(noseBridge);
const noseTip = mesh(new THREE.SphereGeometry(0.07, 20, 20), skinMat, 0, -0.14, 0.44);
head.add(noseTip);
[-1, 1].forEach(s => head.add(mesh(new THREE.SphereGeometry(0.045, 16, 16), skinShadowMat, s * 0.06, -0.16, 0.42)));

// eye sockets (darker), eyes, iris, pupils
const eyes = new THREE.Group(); head.add(eyes);
[-1, 1].forEach(s => {
  const socket = mesh(new THREE.SphereGeometry(0.1, 24, 24), skinShadowMat, s * 0.16, 0.06, 0.3);
  socket.scale.set(1.2, 0.8, 0.6); eyes.add(socket);
  const white = mesh(new THREE.SphereGeometry(0.062, 24, 24), eyeWhiteMat, s * 0.16, 0.06, 0.33);
  white.scale.set(1.1, 0.8, 1); eyes.add(white);
  const iris = mesh(new THREE.SphereGeometry(0.03, 20, 20), irisMat, s * 0.16, 0.055, 0.385);
  eyes.add(iris);
  const pupil = mesh(new THREE.SphereGeometry(0.014, 16, 16), pupilMat, s * 0.16, 0.055, 0.41);
  eyes.add(pupil);
  // upper eyelid
  const lid = mesh(new THREE.SphereGeometry(0.075, 24, 24), skinMat, s * 0.16, 0.1, 0.31);
  lid.scale.set(1.15, 0.55, 0.7); eyes.add(lid);
});

// eyebrows
[-1, 1].forEach(s => {
  const eb = mesh(new THREE.BoxGeometry(0.17, 0.03, 0.05), hairMat, s * 0.17, 0.15, 0.37);
  eb.rotation.z = s * -0.12; head.add(eb);
});

// lips
const upperLip = mesh(new THREE.BoxGeometry(0.16, 0.03, 0.06), skinShadowMat, 0, -0.26, 0.4);
head.add(upperLip);
const lowerLip = mesh(new THREE.SphereGeometry(0.06, 20, 20), skinMat, 0, -0.3, 0.4);
lowerLip.scale.set(1.4, 0.5, 0.7); head.add(lowerLip);

// ears
[-1, 1].forEach(s => {
  const ear = mesh(new THREE.SphereGeometry(0.09, 20, 20), skinMat, s * 0.4, -0.02, 0.0);
  ear.scale.set(0.4, 1.0, 0.7); head.add(ear);
});

// stubble / jawline shadow
const stubble = mesh(new THREE.SphereGeometry(0.345, 32, 32), stubbleMat, 0, -0.22, 0.03);
stubble.scale.set(0.83, 0.62, 0.92);
stubble.material.transparent = true; stubble.material.opacity = 0.5;
head.add(stubble);

/* ---------- HAIR ---------- swept, voluminous, dark ---------- */
const hair = new THREE.Group(); head.add(hair);
const hairCap = mesh(new THREE.SphereGeometry(0.44, 40, 40, 0, Math.PI * 2, 0, Math.PI * 0.62), hairMat, 0, 0.06, -0.02);
hairCap.scale.set(0.98, 1.12, 1.04);
hair.add(hairCap);
// tousled locks — many small displaced spheres for volume
const rng = mulberry32(9);
for (let i = 0; i < 46; i++) {
  const a = rng() * Math.PI * 2;
  const t = rng();
  const r = 0.4 + rng() * 0.06;
  const lock = mesh(new THREE.SphereGeometry(0.06 + rng() * 0.05, 12, 12), hairMat);
  lock.position.set(
    Math.cos(a) * r * (0.8 + t * 0.3),
    0.18 + t * 0.28 + rng() * 0.05,
    Math.sin(a) * r * 0.85 - 0.02
  );
  lock.scale.set(1, 0.7, 1);
  // keep hair off the face
  if (lock.position.z > 0.28 && lock.position.y < 0.28) continue;
  hair.add(lock);
}
// swept front fringe
for (let i = 0; i < 8; i++) {
  const lock = mesh(new THREE.SphereGeometry(0.07, 12, 12), hairMat, -0.22 + i * 0.06, 0.34 - Math.abs(i - 3.5) * 0.02, 0.28);
  lock.scale.set(1.2, 0.6, 0.8); lock.rotation.z = 0.4;
  hair.add(lock);
}

/* ---------- NECK ---------- */
const neck = mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.32, 24), skinMat, 0, 2.34, 0);
neck.scale.set(1, 1, 0.9);
character.add(neck);

/* ---------- TORSO / SUIT ---------- */
const torso = new THREE.Group();
character.add(torso);

// shirt chest (under jacket)
const shirt = mesh(new THREE.CylinderGeometry(0.34, 0.42, 1.0, 32), shirtMat, 0, 1.75, 0.02);
shirt.scale.set(1.1, 1, 0.7); torso.add(shirt);

// collar
[-1, 1].forEach(s => {
  const col = mesh(new THREE.BoxGeometry(0.14, 0.14, 0.04), shirtMat, s * 0.1, 2.16, 0.2);
  col.rotation.z = s * 0.5; col.rotation.y = s * 0.3; torso.add(col);
});

// tie — knot + blade
const knot = mesh(new THREE.BoxGeometry(0.1, 0.12, 0.08), tieMat, 0, 2.1, 0.22);
torso.add(knot);
const tie = mesh(new THREE.BoxGeometry(0.11, 0.7, 0.05), tieMat, 0, 1.68, 0.24);
tie.geometry.translate(0, 0, 0); torso.add(tie);
const tieTip = mesh(new THREE.ConeGeometry(0.08, 0.14, 4), tieMat, 0, 1.3, 0.24);
tieTip.rotation.y = Math.PI / 4; tieTip.rotation.x = Math.PI; torso.add(tieTip);

// jacket body — chest + waist, slightly open
const jacketChest = mesh(new THREE.CylinderGeometry(0.44, 0.5, 1.15, 40), suitMat, 0, 1.72, 0);
jacketChest.scale.set(1.18, 1, 0.82); torso.add(jacketChest);

// shoulders
[-1, 1].forEach(s => {
  const sh = mesh(new THREE.SphereGeometry(0.24, 28, 28), suitMat, s * 0.42, 2.12, 0);
  sh.scale.set(1.1, 0.85, 0.95); torso.add(sh);
});

// lapels — two angled planes framing the shirt opening
[-1, 1].forEach(s => {
  const lap = mesh(new THREE.BoxGeometry(0.22, 0.86, 0.04), suitMat, s * 0.2, 1.86, 0.28);
  lap.rotation.z = s * 0.14; lap.rotation.y = s * -0.28; lap.rotation.x = -0.12;
  torso.add(lap);
  // lapel notch
  const notch = mesh(new THREE.BoxGeometry(0.1, 0.12, 0.045), suitMat, s * 0.3, 2.06, 0.3);
  notch.rotation.z = s * 0.6; torso.add(notch);
});

// jacket front overlap panels
[-1, 1].forEach(s => {
  const panel = mesh(new THREE.BoxGeometry(0.34, 1.0, 0.05), suitMat, s * 0.16, 1.6, 0.3);
  panel.rotation.y = s * -0.12; torso.add(panel);
});

// pocket square (white kerchief)
const pocket = mesh(new THREE.BoxGeometry(0.14, 0.05, 0.02), kerchiefMat, -0.28, 1.86, 0.33);
pocket.rotation.z = 0.05; torso.add(pocket);
for (let i = 0; i < 3; i++) {
  const pk = mesh(new THREE.ConeGeometry(0.018, 0.06, 4), kerchiefMat, -0.32 + i * 0.03, 1.9, 0.34);
  torso.add(pk);
}

// waist / lower jacket
const waist = mesh(new THREE.CylinderGeometry(0.5, 0.44, 0.7, 40), suitMat, 0, 1.05, 0);
waist.scale.set(1.15, 1, 0.85); torso.add(waist);

// buttons
for (let i = 0; i < 2; i++) {
  torso.add(mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.02, 12), metalMat, 0.02, 1.35 - i * 0.28, 0.36).rotateX(Math.PI / 2));
}

/* ---------- ARMS ---------- (folded/crossed low, like the reference) ---------- */
function buildArm(side) {
  const arm = new THREE.Group();
  const s = side;
  // upper arm — out then down
  const upper = mesh(new THREE.CapsuleGeometry(0.16, 0.5, 8, 20), suitMat, s * 0.5, 1.85, 0.05);
  upper.rotation.z = s * 0.25; upper.rotation.x = 0.35; arm.add(upper);
  // elbow
  const elbow = mesh(new THREE.SphereGeometry(0.16, 20, 20), suitMat, s * 0.6, 1.4, 0.25); arm.add(elbow);
  // forearm — crossing toward center-low
  const fore = mesh(new THREE.CapsuleGeometry(0.13, 0.5, 8, 20), suitMat, s * 0.32, 1.15, 0.42);
  fore.rotation.z = s * 1.15; fore.rotation.x = 0.2; arm.add(fore);
  // shirt cuff peeking out
  const cuff = mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.1, 20), shirtMat, s * 0.14, 1.02, 0.5);
  cuff.rotation.z = s * 1.15; arm.add(cuff);
  return arm;
}
const armL = buildArm(-1);
const armR = buildArm(1);
character.add(armL, armR);

/* ---------- HANDS ---------- clasped low center ---------- */
const hands = new THREE.Group();
character.add(hands);
function buildHand(side, x, y, z) {
  const g = new THREE.Group();
  const palm = mesh(new THREE.BoxGeometry(0.14, 0.1, 0.18), skinMat, 0, 0, 0);
  palm.scale.set(1, 1, 1); g.add(palm);
  for (let i = 0; i < 4; i++) {
    const fg = mesh(new THREE.CapsuleGeometry(0.022, 0.11, 4, 8), skinMat, -0.045 + i * 0.03, -0.02, 0.13);
    fg.rotation.x = 0.5 + i * 0.04; g.add(fg);
  }
  const thumb = mesh(new THREE.CapsuleGeometry(0.026, 0.08, 4, 8), skinMat, side * 0.08, 0.0, 0.05);
  thumb.rotation.z = side * 0.9; thumb.rotation.x = 0.4; g.add(thumb);
  g.position.set(x, y, z);
  return g;
}
const handL = buildHand(-1, -0.08, 0.96, 0.56);
handL.rotation.set(-0.5, 0.2, 0.3);
const handR = buildHand(1, 0.12, 0.9, 0.58);
handR.rotation.set(-0.6, -0.1, -0.2);
hands.add(handL, handR);

// wristwatch on left wrist
const watch = new THREE.Group();
watch.position.set(-0.16, 1.0, 0.52);
const band = mesh(new THREE.TorusGeometry(0.11, 0.03, 12, 24), new THREE.MeshStandardMaterial({ color: 0x111014, roughness: 0.5 }));
band.rotation.y = Math.PI / 2; watch.add(band);
const dial = mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.03, 24), metalMat);
dial.rotation.z = Math.PI / 2; watch.add(dial);
const face = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.032, 24), glassMat);
face.rotation.z = Math.PI / 2; face.position.x = 0.005; watch.add(face);
character.add(watch);

/* ---------- LEGS / TROUSERS ---------- */
[-1, 1].forEach(s => {
  const thigh = mesh(new THREE.CapsuleGeometry(0.2, 0.55, 8, 20), suitMat, s * 0.2, 0.5, 0);
  character.add(thigh);
  const shin = mesh(new THREE.CapsuleGeometry(0.16, 0.6, 8, 20), suitMat, s * 0.22, -0.15, 0.02);
  character.add(shin);
  const shoe = mesh(new THREE.SphereGeometry(0.16, 20, 20), new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, roughness: 0.28, clearcoat: 0.6 }), s * 0.22, -0.52, 0.12);
  shoe.scale.set(1, 0.6, 1.7); character.add(shoe);
});

// nudge whole character up so shoes sit on floor
character.position.y = 0.55;

/* ============================================================
   BACKGROUND — faint marble slab + shelf silhouette (reference vibe)
   ============================================================ */
const bg = new THREE.Group(); scene.add(bg);
const slab = mesh(new THREE.BoxGeometry(6, 8, 0.3), new THREE.MeshStandardMaterial({ color: 0x161513, roughness: 0.8 }), -3.5, 3, -5);
bg.add(slab);
const shelf = mesh(new THREE.BoxGeometry(3.4, 8, 0.4), new THREE.MeshStandardMaterial({ color: 0x0c0b0a, roughness: 0.6, metalness: 0.3 }), 4.2, 3, -5.2);
bg.add(shelf);
// bottle silhouettes on the shelf
for (let i = 0; i < 5; i++) {
  const b = mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.5, 12), new THREE.MeshStandardMaterial({ color: 0x1a130a, roughness: 0.3, metalness: 0.2 }), 3.6 + (i % 3) * 0.4, 1.0 + i * 0.6, -4.6);
  bg.add(b);
}

/* ============================================================
   POST-PROCESSING — bloom for the practicals / highlights
   ============================================================ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.9, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ============================================================
   UI WIRING
   ============================================================ */
const ui = {
  spin: document.getElementById('spin'),
  key: document.getElementById('key'),
  rim: document.getElementById('rim'),
  exp: document.getElementById('exp'),
};
let autoSpin = true;
ui.spin.onchange = e => autoSpin = e.target.checked;
ui.key.oninput = e => key.intensity = +e.target.value;
ui.rim.oninput = e => rim.intensity = +e.target.value;
ui.exp.oninput = e => renderer.toneMappingExposure = +e.target.value;

const views = {
  hero: { pos: [2.6, 2.2, 5.6], tgt: [0, 1.55, 0] },
  face: { pos: [0.8, 2.75, 2.4], tgt: [0, 2.62, 0] },
  full: { pos: [3.6, 2.6, 7.4], tgt: [0, 1.3, 0] },
};
let wire = false;
document.querySelectorAll('.btn[data-view]').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.view;
    document.querySelectorAll('.btn[data-view]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    if (v === 'wire') {
      wire = !wire;
      scene.traverse(o => { if (o.isMesh && o.material && 'wireframe' in o.material) o.material.wireframe = wire; });
      if (!wire) btn.classList.remove('on');
      return;
    }
    const cfg = views[v];
    flyTo(new THREE.Vector3(...cfg.pos), new THREE.Vector3(...cfg.tgt));
  };
});

// simple camera tween
let fly = null;
function flyTo(pos, tgt) {
  fly = { fromP: camera.position.clone(), toP: pos, fromT: controls.target.clone(), toT: tgt, t: 0 };
}

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (autoSpin && !fly) character.rotation.y = Math.sin(t * 0.12) * 0.35;

  // subtle breathing
  torso.position.y = Math.sin(t * 1.1) * 0.006;
  head.rotation.x = Math.sin(t * 0.5) * 0.02;

  // flicker practicals
  practicalGroup.children.forEach((c, i) => {
    if (c.isLight) c.intensity = 0.8 + Math.sin(t * 6 + i) * 0.12;
  });

  if (fly) {
    fly.t = Math.min(1, fly.t + dt * 1.6);
    const e = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2; // easeInOut
    camera.position.lerpVectors(fly.fromP, fly.toP, e);
    controls.target.lerpVectors(fly.fromT, fly.toT, e);
    if (fly.t >= 1) fly = null;
  }

  controls.update();
  composer.render();
}

/* deterministic RNG for repeatable hair */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// hide loader once first frame is ready
requestAnimationFrame(() => {
  animate();
  const l = document.getElementById('loading');
  l.style.opacity = 0;
  setTimeout(() => l.remove(), 700);
});
</script>
