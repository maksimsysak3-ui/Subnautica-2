<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CDN = 'https://cdn.jsdelivr.net/gh/maksimsysak3-ui/Subnautica-2@838662242f45b9e492afef1e33c3058593712433/models/';
const LOCAL = './models/';

/* ============ RENDERER / SCENE / CAMERA ============ */

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100); camera.position.set(0, 1.55, -2.8);

/* ============ LIGHTS ============ */
scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x241d15, 0.5));
scene.add(new THREE.AmbientLight(0xffffff, 0.22));
const key = new THREE.SpotLight(0xfff0d8, 6, 40, Math.PI * 0.32, 0.5, 1.2);
key.position.set(-3.4, 5.6, 3.6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.02;
key.shadow.camera.near = 1; key.shadow.camera.far = 20; scene.add(key, key.target);
const rim = new THREE.SpotLight(0xaebfe0, 7, 40, Math.PI * 0.36, 0.7, 1.5); rim.position.set(4.4, 4.4, -3.4); scene.add(rim, rim.target);
const fill = new THREE.PointLight(0xffe0bf, 1.8, 24, 2); fill.position.set(2.8, 1.6, 3.4); scene.add(fill);

/* ============ FLOOR ============ */
const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96), new THREE.MeshStandardMaterial({ color: 0x121216, roughness: 0.5, metalness: 0.35 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.PolarGridHelper(12, 12, 10, 64, 0x26221a, 0x1a1813); grid.position.y = 0.002; grid.material.opacity = 0.26; grid.material.transparent = true; scene.add(grid);

/* ============ LOADERS ============ */
const gltf = new GLTFLoader();
const bar = document.getElementById('barfill'), loadmsg = document.getElementById('loadmsg');
const setProg = p => { if (bar) bar.style.width = Math.round(Math.max(0, Math.min(1, p)) * 100) + '%'; };
function loadGLB(name) { return new Promise((res, rej) => { gltf.load(CDN + name, res, undefined, () => gltf.load(LOCAL + name, res, undefined, rej)); }); }

/* ============ CHARACTER STATE ============ */
const rig = new THREE.Group(); scene.add(rig);
let mixer = null, actions = {}, skinned = null, rightHand = null, faceOffset = 0, groundSamples = [], helper = null;
let locoTarget = 'Idle', oneShot = null, oneShotEnd = 0, slideUntil = 0;

/* ---- custom skeleton (identity-oriented, fitted to the A-pose bind) ---- */
const HIPS_Y = 0.90;
const BONES = [
  ['Hips', 0, 0.90, 0, null], ['Spine', 0, 1.04, 0, 'Hips'], ['Chest', 0, 1.20, 0, 'Spine'],
  ['Neck', 0, 1.36, 0, 'Chest'], ['Head', 0, 1.48, 0, 'Neck'],
  ['LShoulder', 0.05, 1.33, 0, 'Chest'], ['LArm', 0.17, 1.30, 0, 'LShoulder'], ['LForeArm', 0.40, 1.18, -0.01, 'LArm'],
  ['LHand', 0.57, 1.08, -0.03, 'LForeArm'], ['LFingers', 0.64, 1.03, -0.03, 'LHand'], ['LFingerTip', 0.70, 0.99, -0.03, 'LFingers'], ['LThumb', 0.58, 1.06, 0.04, 'LHand'],
  ['RShoulder', -0.05, 1.33, 0, 'Chest'], ['RArm', -0.17, 1.30, 0, 'RShoulder'], ['RForeArm', -0.40, 1.18, -0.01, 'RArm'],
  ['RHand', -0.57, 1.08, -0.03, 'RForeArm'], ['RFingers', -0.64, 1.03, -0.03, 'RHand'], ['RFingerTip', -0.70, 0.99, -0.03, 'RFingers'], ['RThumb', -0.58, 1.06, 0.04, 'RHand'],
  ['LUpLeg', 0.10, 0.88, 0, 'Hips'], ['LLeg', 0.11, 0.48, 0.02, 'LUpLeg'], ['LFoot', 0.11, 0.10, 0, 'LLeg'], ['LToe', 0.11, 0.03, 0.10, 'LFoot'],
  ['RUpLeg', -0.10, 0.88, 0, 'Hips'], ['RLeg', -0.11, 0.48, 0.02, 'RUpLeg'], ['RFoot', -0.11, 0.10, 0, 'RLeg'], ['RToe', -0.11, 0.03, 0.10, 'RFoot'],
];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// influence segments [boneName, A, B]
const SEG = [
  ['Hips', V(-0.13, 0.84, 0), V(0.13, 0.96, 0)], ['Spine', V(0, 0.96, 0), V(0, 1.12, 0)], ['Chest', V(0, 1.12, 0), V(0, 1.30, 0)],
  ['Neck', V(0, 1.30, 0), V(0, 1.40, 0)], ['Head', V(0, 1.40, 0), V(0, 1.66, 0)],
  ['LShoulder', V(0.03, 1.33, 0), V(0.15, 1.31, 0)], ['LArm', V(0.17, 1.30, 0), V(0.40, 1.18, 0)], ['LForeArm', V(0.40, 1.18, 0), V(0.57, 1.08, -0.02)],
  ['LHand', V(0.57, 1.08, -0.03), V(0.64, 1.04, -0.03)], ['LFingers', V(0.64, 1.03, -0.03), V(0.70, 0.99, -0.03)], ['LFingerTip', V(0.70, 0.99, -0.03), V(0.75, 0.96, -0.03)], ['LThumb', V(0.56, 1.07, 0.02), V(0.60, 1.05, 0.07)],
  ['RShoulder', V(-0.03, 1.33, 0), V(-0.15, 1.31, 0)], ['RArm', V(-0.17, 1.30, 0), V(-0.40, 1.18, 0)], ['RForeArm', V(-0.40, 1.18, 0), V(-0.57, 1.08, -0.02)],
  ['RHand', V(-0.57, 1.08, -0.03), V(-0.64, 1.04, -0.03)], ['RFingers', V(-0.64, 1.03, -0.03), V(-0.70, 0.99, -0.03)], ['RFingerTip', V(-0.70, 0.99, -0.03), V(-0.75, 0.96, -0.03)], ['RThumb', V(-0.56, 1.07, 0.02), V(-0.60, 1.05, 0.07)],
  ['LUpLeg', V(0.10, 0.86, 0), V(0.11, 0.50, 0.01)], ['LLeg', V(0.11, 0.48, 0.02), V(0.11, 0.12, 0)], ['LFoot', V(0.11, 0.10, -0.02), V(0.11, 0.05, 0.08)], ['LToe', V(0.11, 0.04, 0.08), V(0.11, 0.03, 0.14)],
  ['RUpLeg', V(-0.10, 0.86, 0), V(-0.11, 0.50, 0.01)], ['RLeg', V(-0.11, 0.48, 0.02), V(-0.11, 0.12, 0)], ['RFoot', V(-0.11, 0.10, -0.02), V(-0.11, 0.05, 0.08)], ['RToe', V(-0.11, 0.04, 0.08), V(-0.11, 0.03, 0.14)],
];
function distSeg(px, py, pz, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z, apx = px - a.x, apy = py - a.y, apz = pz - a.z;
  let t = (apx * abx + apy * aby + apz * abz) / (abx * abx + aby * aby + abz * abz + 1e-9); t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = px - (a.x + abx * t), dy = py - (a.y + aby * t), dz = pz - (a.z + abz * t); return Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function buildCustomRig(srcGeo, material) {
  const geo = srcGeo.clone();
  geo.deleteAttribute('skinIndex'); geo.deleteAttribute('skinWeight');
  const idx = {}; BONES.forEach((b, i) => idx[b[0]] = i);
  const bones = BONES.map(b => { const bone = new THREE.Bone(); bone.name = b[0]; return bone; });
  BONES.forEach((b, i) => {
    const w = new THREE.Vector3(b[1], b[2], b[3]);
    if (b[4] == null) bones[i].position.copy(w);
    else { const p = BONES[idx[b[4]]]; bones[i].position.copy(w.clone().sub(new THREE.Vector3(p[1], p[2], p[3]))); bones[idx[b[4]]].add(bones[i]); }
  });
  // weights
  const pos = geo.attributes.position, N = pos.count;
  const si = new Uint16Array(N * 4), sw = new Float32Array(N * 4), nS = SEG.length, w = new Float64Array(nS);
  for (let i = 0; i < N; i++) {
    const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i);
    for (let s = 0; s < nS; s++) { const d = distSeg(px, py, pz, SEG[s][1], SEG[s][2]); w[s] = 1 / (d * d + 1e-5); }
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, v0 = -1, v1 = -1, v2 = -1, v3 = -1;
    for (let s = 0; s < nS; s++) { const x = w[s];
      if (x > v0) { v3 = v2; b3 = b2; v2 = v1; b2 = b1; v1 = v0; b1 = b0; v0 = x; b0 = s; }
      else if (x > v1) { v3 = v2; b3 = b2; v2 = v1; b2 = b1; v1 = x; b1 = s; }
      else if (x > v2) { v3 = v2; b3 = b2; v2 = x; b2 = s; }
      else if (x > v3) { v3 = x; b3 = s; } }
    let sum = v0 + v1 + v2 + v3; if (sum <= 0) { v0 = sum = 1; }
    si[i * 4] = idx[SEG[b0][0]]; si[i * 4 + 1] = idx[SEG[b1][0]]; si[i * 4 + 2] = idx[SEG[b2][0]]; si[i * 4 + 3] = idx[SEG[b3][0]];
    sw[i * 4] = v0 / sum; sw[i * 4 + 1] = v1 / sum; sw[i * 4 + 2] = v2 / sum; sw[i * 4 + 3] = v3 / sum;
  }
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));
  const sm = new THREE.SkinnedMesh(geo, material);
  sm.castShadow = true; sm.receiveShadow = true; sm.frustumCulled = false;
  sm.add(bones[0]); sm.updateMatrixWorld(true); sm.bind(new THREE.Skeleton(bones)); sm.normalizeSkinWeights();
  return { skinnedMesh: sm, bones, idx };
}

/* ---- animation authoring (identity bones → predictable) ---- */
const _q = new THREE.Quaternion(), _e = new THREE.Euler();
function rotTrack(name, times, eulers) { const vals = []; eulers.forEach(a => { _e.set(a[0], a[1], a[2]); _q.setFromEuler(_e); vals.push(_q.x, _q.y, _q.z, _q.w); }); return new THREE.QuaternionKeyframeTrack(name + '.quaternion', times, vals); }
function posTrack(name, times, vecs) { const vals = []; vecs.forEach(v => vals.push(v[0], v[1], v[2])); return new THREE.VectorKeyframeTrack(name + '.position', times, vals); }
// right hand keeps a grip on the gun in every non-punch clip
function gripR(dur) {
  return [
    rotTrack('RFingers', [0, dur], [[0, 0, -1.0], [0, 0, -1.0]]),
    rotTrack('RFingerTip', [0, dur], [[0, 0, -0.9], [0, 0, -0.9]]),
    rotTrack('RThumb', [0, dur], [[0.3, -0.5, -0.4], [0.3, -0.5, -0.4]]),
  ];
}
function makeClips() {
  const C = [];
  // Idle — head bob + breathing + subtle look
  C.push(new THREE.AnimationClip('Idle', 3.6, [
    posTrack('Hips', [0, 1.8, 3.6], [[0, HIPS_Y, 0], [0, HIPS_Y + 0.012, 0], [0, HIPS_Y, 0]]),
    rotTrack('Spine', [0, 1.8, 3.6], [[0, 0, 0], [0.03, 0, 0], [0, 0, 0]]),
    rotTrack('Chest', [0, 1.8, 3.6], [[0, 0, 0], [0.02, 0.02, 0], [0, 0, 0]]),
    rotTrack('Head', [0, 1.2, 2.4, 3.6], [[0, 0.06, 0], [0.02, -0.03, 0], [0, -0.06, 0], [0, 0.06, 0]]),
    rotTrack('LArm', [0, 1.8, 3.6], [[0, 0, 0.03], [0.03, 0, 0.05], [0, 0, 0.03]]),
    rotTrack('RArm', [0, 1.8, 3.6], [[0, 0, -0.03], [0.03, 0, -0.05], [0, 0, -0.03]]),
    ...gripR(3.6),
  ]));
  // Walk
  C.push(new THREE.AnimationClip('Walk', 1.0, [
    posTrack('Hips', [0, 0.25, 0.5, 0.75, 1.0], [[0, HIPS_Y, 0], [0, HIPS_Y + 0.02, 0], [0, HIPS_Y, 0], [0, HIPS_Y + 0.02, 0], [0, HIPS_Y, 0]]),
    rotTrack('LUpLeg', [0, 0.5, 1.0], [[0.55, 0, 0], [-0.55, 0, 0], [0.55, 0, 0]]),
    rotTrack('RUpLeg', [0, 0.5, 1.0], [[-0.55, 0, 0], [0.55, 0, 0], [-0.55, 0, 0]]),
    rotTrack('LLeg', [0, 0.25, 0.5, 1.0], [[-0.1, 0, 0], [-0.15, 0, 0], [-0.8, 0, 0], [-0.1, 0, 0]]),
    rotTrack('RLeg', [0, 0.5, 0.75, 1.0], [[-0.8, 0, 0], [-0.1, 0, 0], [-0.15, 0, 0], [-0.8, 0, 0]]),
    rotTrack('LArm', [0, 0.5, 1.0], [[-0.35, 0, 0.05], [0.35, 0, 0.05], [-0.35, 0, 0.05]]),
    rotTrack('RArm', [0, 0.5, 1.0], [[0.3, 0, -0.05], [-0.3, 0, -0.05], [0.3, 0, -0.05]]),
    rotTrack('Chest', [0, 0.5, 1.0], [[0.04, 0.05, 0], [0.04, -0.05, 0], [0.04, 0.05, 0]]),
    ...gripR(1.0),
  ]));
  // Run
  C.push(new THREE.AnimationClip('Run', 0.7, [
    posTrack('Hips', [0, 0.175, 0.35, 0.525, 0.7], [[0, HIPS_Y - 0.02, 0], [0, HIPS_Y + 0.03, 0], [0, HIPS_Y - 0.02, 0], [0, HIPS_Y + 0.03, 0], [0, HIPS_Y - 0.02, 0]]),
    rotTrack('LUpLeg', [0, 0.35, 0.7], [[0.95, 0, 0], [-0.85, 0, 0], [0.95, 0, 0]]),
    rotTrack('RUpLeg', [0, 0.35, 0.7], [[-0.85, 0, 0], [0.95, 0, 0], [-0.85, 0, 0]]),
    rotTrack('LLeg', [0, 0.175, 0.35, 0.7], [[-0.3, 0, 0], [-0.4, 0, 0], [-1.2, 0, 0], [-0.3, 0, 0]]),
    rotTrack('RLeg', [0, 0.35, 0.525, 0.7], [[-1.2, 0, 0], [-0.3, 0, 0], [-0.4, 0, 0], [-1.2, 0, 0]]),
    rotTrack('LArm', [0, 0.35, 0.7], [[-0.7, 0.2, 0.1], [0.7, 0.2, 0.1], [-0.7, 0.2, 0.1]]),
    rotTrack('RArm', [0, 0.35, 0.7], [[0.7, -0.2, -0.1], [-0.7, -0.2, -0.1], [0.7, -0.2, -0.1]]),
    rotTrack('Chest', [0, 0.35, 0.7], [[0.18, 0.06, 0], [0.18, -0.06, 0], [0.18, 0.06, 0]]),
    ...gripR(0.7),
  ]));
  // Punch — left jab + left fist (right keeps the gun)
  C.push(new THREE.AnimationClip('Punch', 0.5, [
    rotTrack('LArm', [0, 0.18, 0.32, 0.5], [[0, 0, 0.03], [-1.3, -0.9, 0.1], [-1.3, -0.9, 0.1], [0, 0, 0.03]]),
    rotTrack('LForeArm', [0, 0.18, 0.5], [[-0.3, 0, 0], [-0.05, 0, 0], [-0.3, 0, 0]]),
    rotTrack('LFingers', [0, 0.12, 0.5], [[0, 0, 0], [0, 0, 1.5], [0, 0, 1.5]]),
    rotTrack('LFingerTip', [0, 0.12, 0.5], [[0, 0, 0], [0, 0, 1.4], [0, 0, 1.4]]),
    rotTrack('Chest', [0, 0.18, 0.5], [[0, 0, 0], [0, 0.35, 0], [0, 0, 0]]),
    rotTrack('Hips', [0, 0.5], [[0, HIPS_Y, 0], [0, HIPS_Y, 0]]),
    ...gripR(0.5),
  ]));
  // Kick — right front kick (clean about X on the leg bones)
  C.push(new THREE.AnimationClip('Kick', 0.6, [
    rotTrack('RUpLeg', [0, 0.22, 0.36, 0.6], [[0, 0, 0], [-1.4, 0, 0], [-1.5, 0, 0], [0, 0, 0]]),
    rotTrack('RLeg', [0, 0.22, 0.36, 0.6], [[0, 0, 0], [-0.6, 0, 0], [0, 0, 0], [0, 0, 0]]),
    rotTrack('RFoot', [0, 0.36, 0.6], [[0, 0, 0], [-0.5, 0, 0], [0, 0, 0]]),
    rotTrack('Chest', [0, 0.36, 0.6], [[0, 0, 0], [0.15, 0, 0], [0, 0, 0]]),
    posTrack('Hips', [0, 0.6], [[0, HIPS_Y, 0], [0, HIPS_Y, 0]]),
    ...gripR(0.6),
  ]));
  // Slide — crouch + legs forward + lean (root motion added by controller)
  C.push(new THREE.AnimationClip('Slide', 0.9, [
    posTrack('Hips', [0, 0.15, 0.6, 0.9], [[0, HIPS_Y, 0], [0, 0.5, 0], [0, 0.5, 0], [0, HIPS_Y, 0]]),
    rotTrack('LUpLeg', [0, 0.15, 0.6, 0.9], [[0, 0, 0], [-1.1, 0, 0.1], [-1.1, 0, 0.1], [0, 0, 0]]),
    rotTrack('RUpLeg', [0, 0.15, 0.6, 0.9], [[0, 0, 0], [-0.7, 0, -0.1], [-0.7, 0, -0.1], [0, 0, 0]]),
    rotTrack('RLeg', [0, 0.15, 0.6, 0.9], [[0, 0, 0], [-0.9, 0, 0], [-0.9, 0, 0], [0, 0, 0]]),
    rotTrack('Chest', [0, 0.15, 0.6, 0.9], [[0, 0, 0], [0.3, 0, 0], [0.3, 0, 0], [0, 0, 0]]),
    ...gripR(0.9),
  ]));
  return C;
}

function fitToStage(root) {
  skinned.geometry.computeBoundingBox();
  const box = skinned.geometry.boundingBox, size = new THREE.Vector3(); box.getSize(size);
  const s = 1.8 / (size.y || 1); root.scale.setScalar(s);
  root.position.set(-((box.min.x + box.max.x) / 2) * s, -box.min.y * s, -((box.min.z + box.max.z) / 2) * s);
}

const ORDER = ['Idle', 'Walk', 'Run', 'Punch', 'Kick', 'Slide'];
function buildAnimButtons() {
  const host = document.getElementById('animBtns'); host.innerHTML = '';
  ORDER.filter(n => actions[n]).forEach(nm => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = nm; b.onclick = () => trigger(nm); host.appendChild(b); });
}
const ONESHOT = { Punch: 0.5, Kick: 0.6, Slide: 0.9 };
function trigger(nm) {
  if (ONESHOT[nm]) { oneShot = nm; oneShotEnd = clock.elapsedTime + ONESHOT[nm]; actions[nm].reset(); if (nm === 'Slide') slideUntil = clock.elapsedTime + ONESHOT[nm] * 0.7; }
  else locoTarget = nm;
}

function setupCharacter(base, gunGltf) {
  base.scene.traverse(o => { if (o.isSkinnedMesh) skinned = o; });
  if (!skinned) { loadmsg.textContent = 'No mesh found'; return; }
  const built = buildCustomRig(skinned.geometry, skinned.material);
  skinned = built.skinnedMesh;
  const root = new THREE.Group(); root.add(skinned);
  fitToStage(root); rig.add(root);
  rightHand = built.bones[built.idx['RHand']];
  const n = skinned.geometry.attributes.position.count, step = Math.max(1, Math.floor(n / 240));
  for (let i = 0; i < n; i += step) groundSamples.push(i);
  // skeleton helper (toggle)
  helper = new THREE.SkeletonHelper(skinned); helper.visible = false; scene.add(helper);

  mixer = new THREE.AnimationMixer(skinned);
  makeClips().forEach(c => { const a = mixer.clipAction(c); a.play(); a.setEffectiveWeight(0); actions[c.name] = a; });
  actions.Idle.setEffectiveWeight(1);
  buildAnimButtons();
  setupGun(gunGltf);
  controls.target.set(0, 1.0, 0); camera.position.set(0, 1.55, -2.8);
  finish();
}

/* ============ GUN ============ */
let gun = null, gunBaseScale = 1, muzzle = new THREE.Vector3(), gunFwd = new THREE.Vector3();
const gunOffset = new THREE.Vector3(-0.03, -0.02, 0.05);
let gunScale = 1, barrelToAim = true, holstered = false;
function setupGun(g) {
  const inner = g.scene; inner.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  const box = new THREE.Box3().setFromObject(inner); const size = new THREE.Vector3(); box.getSize(size);
  gunBaseScale = 0.2 / (Math.max(size.x, size.y, size.z) || 1);
  const c = new THREE.Vector3(); box.getCenter(c); inner.position.sub(c);
  gun = new THREE.Group(); gun.add(inner); scene.add(gun);
}
function updateGun() {
  if (!gun || !rightHand) return; gun.visible = !holstered && oneShot !== 'Punch'; if (!gun.visible) return;
  const hp = new THREE.Vector3(), hq = new THREE.Quaternion(); rightHand.getWorldPosition(hp); rightHand.getWorldQuaternion(hq);
  gun.scale.setScalar(gunBaseScale * gunScale * 1.8);
  gun.position.copy(hp).add(gunOffset.clone().applyQuaternion(hq));
  const aim = new THREE.Vector3(); camera.getWorldDirection(aim); aim.y = 0; if (aim.lengthSq() < 1e-5) aim.set(0, 0, 1); aim.normalize(); gunFwd.copy(aim);
  if (barrelToAim) { const up = new THREE.Vector3(0, 1, 0), right = new THREE.Vector3().crossVectors(up, aim).normalize(), up2 = new THREE.Vector3().crossVectors(aim, right).normalize(); gun.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(aim, up2, right)); }
  else { gun.quaternion.copy(hq); gunFwd.set(1, 0, 0).applyQuaternion(gun.quaternion); }
  muzzle.copy(gun.position).add(gunFwd.clone().multiplyScalar(0.24 * gunScale));
}

/* ============ SHOOTING ============ */
const bullets = [], bulletGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.34, 6); bulletGeo.rotateX(Math.PI / 2);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffd27a });
const flash = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), new THREE.MeshBasicMaterial({ color: 0xffe6a0, transparent: true, opacity: 0 })); scene.add(flash);
const flashLight = new THREE.PointLight(0xffcf8a, 0, 6, 2); scene.add(flashLight);
let flashT = 0, recoil = 0, lastShot = 0, audio = null;
function initAudio() { if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }
function gunshot() {
  if (!audio) return; const t = audio.currentTime;
  const buf = audio.createBuffer(1, audio.sampleRate * 0.22, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.5);
  const src = audio.createBufferSource(); src.buffer = buf;
  const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(280, t + 0.16);
  const g = audio.createGain(); g.gain.setValueAtTime(0.85, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2); src.connect(lp).connect(g).connect(audio.destination); src.start(t);
  const o = audio.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.09);
  const g2 = audio.createGain(); g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12); o.connect(g2).connect(audio.destination); o.start(t); o.stop(t + 0.13);
}
function shoot() {
  if (holstered || !gun || oneShot === 'Punch') return;
  const now = performance.now(); if (now - lastShot < 110) return; lastShot = now;
  const b = new THREE.Mesh(bulletGeo, bulletMat); b.position.copy(muzzle);
  b.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), gunFwd.clone().normalize());
  b.userData.vel = gunFwd.clone().multiplyScalar(48); b.userData.life = 1.2; scene.add(b); bullets.push(b);
  flash.position.copy(muzzle); flashT = 1; recoil = 1; flashLight.position.copy(muzzle); initAudio(); gunshot();
}
function updateShooting(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; b.position.addScaledVector(b.userData.vel, dt); b.userData.life -= dt; if (b.userData.life <= 0 || b.position.y < 0) { scene.remove(b); bullets.splice(i, 1); } }
  if (flashT > 0) { flashT = Math.max(0, flashT - dt * 14); flash.material.opacity = flashT; flash.scale.setScalar(0.6 + (1 - flashT) * 1.6); flashLight.intensity = flashT * 6; }
  if (recoil > 0) recoil = Math.max(0, recoil - dt * 6);
}

/* ============ INPUT ============ */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true; initAudio();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyF') shoot();
  if (e.code === 'KeyJ') trigger('Punch');
  if (e.code === 'KeyK') trigger('Kick');
  if (e.code === 'Space') trigger('Slide');
  if (e.code === 'KeyG') holstered = !holstered;
  if (e.code === 'KeyP') faceOffset += Math.PI;
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ============ MOVEMENT + CAMERA ============ */
const WALK = 1.7, RUN = 4.2; let curYaw = 0, followCam = true, wire = false;
function shortAngle(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function updateMovement(dt) {
  if (!mixer) return;
  const t = clock.elapsedTime;
  if (oneShot && t > oneShotEnd) oneShot = null;
  const camF = new THREE.Vector3(); camera.getWorldDirection(camF); camF.y = 0; if (camF.lengthSq() < 1e-5) camF.set(0, 0, 1); camF.normalize();
  const camR = new THREE.Vector3().crossVectors(camF, new THREE.Vector3(0, 1, 0)).normalize();
  const mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const mz = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const move = new THREE.Vector3().addScaledVector(camF, mz).addScaledVector(camR, mx);
  const moving = move.lengthSq() > 1e-6 && !oneShot;
  const running = keys.ShiftLeft || keys.ShiftRight;
  if (t < slideUntil) { const f = new THREE.Vector3(Math.sin(curYaw), 0, Math.cos(curYaw)); rig.position.addScaledVector(f, 5.5 * dt); }
  if (moving) {
    move.normalize(); const yaw = Math.atan2(move.x, move.z);
    curYaw += shortAngle(curYaw, yaw) * Math.min(1, dt * 12); rig.rotation.y = curYaw + faceOffset;
    rig.position.addScaledVector(move, (running ? RUN : WALK) * dt);
    locoTarget = running ? 'Run' : 'Walk';
  } else { rig.rotation.y = curYaw + faceOffset; if (!oneShot) locoTarget = 'Idle'; }
  // weight blend
  ['Idle', 'Walk', 'Run'].forEach(nm => { const a = actions[nm]; if (!a) return; const tgt = (!oneShot && nm === locoTarget) ? 1 : 0; a.setEffectiveWeight(THREE.MathUtils.lerp(a.getEffectiveWeight(), tgt, Math.min(1, dt * 10))); });
  ['Punch', 'Kick', 'Slide'].forEach(nm => { const a = actions[nm]; if (!a) return; const tgt = oneShot === nm ? 1 : 0; a.setEffectiveWeight(THREE.MathUtils.lerp(a.getEffectiveWeight(), tgt, Math.min(1, dt * 16))); });
}
const _gv = new THREE.Vector3();
function groundFeet() {
  if (!skinned || !groundSamples.length) return;
  rig.updateMatrixWorld(true);
  const pos = skinned.geometry.attributes.position, xf = skinned.applyBoneTransform ? 'applyBoneTransform' : (skinned.boneTransform ? 'boneTransform' : null);
  let minY = Infinity;
  for (const i of groundSamples) { _gv.fromBufferAttribute(pos, i); if (xf) skinned[xf](i, _gv); _gv.applyMatrix4(skinned.matrixWorld); if (_gv.y < minY) minY = _gv.y; }
  if (isFinite(minY)) rig.position.y -= minY * 0.5;
  rig.position.y = Math.max(-1.5, Math.min(1.0, rig.position.y));
}
function updateCamera() {
  if (!followCam) { controls.update(); return; }
  const tgt = new THREE.Vector3(rig.position.x, 1.0, rig.position.z);
  camera.position.add(tgt.clone().sub(controls.target)); controls.target.copy(tgt); controls.update();
  if (camera.position.y < 0.45) camera.position.y = 0.45;
}

/* ============ POST ============ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.8, 0.85));
composer.addPass(new OutputPass());

/* ============ UI ============ */
document.getElementById('key').oninput = e => key.intensity = +e.target.value;
document.getElementById('rim').oninput = e => rim.intensity = +e.target.value;
document.getElementById('exp').oninput = e => renderer.toneMappingExposure = +e.target.value;
document.getElementById('follow').onchange = e => followCam = e.target.checked;
document.getElementById('gx').oninput = e => gunOffset.x = +e.target.value;
document.getElementById('gy').oninput = e => gunOffset.y = +e.target.value;
document.getElementById('gz').oninput = e => gunOffset.z = +e.target.value;
document.getElementById('gs').oninput = e => gunScale = +e.target.value;
document.getElementById('gaim').onchange = e => barrelToAim = e.target.checked;
document.querySelectorAll('.btn[data-view]').forEach(btn => btn.onclick = () => {
  const v = btn.dataset.view;
  if (v === 'wire') { wire = !wire; scene.traverse(o => { if (o.isMesh && o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if ('wireframe' in m) m.wireframe = wire; }); }); btn.classList.toggle('on', wire); }
  if (v === 'bones' && helper) { helper.visible = !helper.visible; btn.classList.toggle('on', helper.visible); }
});

/* ============ LOOP ============ */
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if (mixer) mixer.update(dt);
  updateMovement(dt); groundFeet(); updateGun(); updateShooting(dt); updateCamera();
  camera.fov = 42 - recoil * 1.2; camera.updateProjectionMatrix();
  composer.render();
}
animate();

/* ============ BOOT ============ */
let loaderHidden = false;
function finish() { setProg(1); if (!loaderHidden) { loaderHidden = true; const l = document.getElementById('loading'); l.style.opacity = 0; setTimeout(() => l.style.display = 'none', 700); } }
(async function boot() {
  try {
    loadmsg.textContent = 'Loading character…'; setProg(0.15);
    const base = await loadGLB('agent.glb'); setProg(0.6);
    loadmsg.textContent = 'Loading gun…'; const g = await loadGLB('glock.glb'); setProg(0.85);
    loadmsg.textContent = 'Rigging…'; setupCharacter(base, g);
  } catch (err) { console.error(err); loadmsg.textContent = 'Load failed — see console. (Repo may be private for jsdelivr.)'; }
})();
setTimeout(() => { if (!loaderHidden) finish(); }, 30000);
</script>
