<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EA SPORTS FC 26 — Career Simulation</title>
<style>
:root{
  --bg:#05070c; --bg2:#080b12; --panel:#0d1220; --panel2:#111827;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --txt:#eef2ff; --dim:#8b96b0; --dim2:#5b6684;
  --acc:#c6ff2e; --acc2:#00e5ff; --acc3:#ff2e88; --gold:#ffd35a;
  --good:#38e08a; --bad:#ff5d6c; --warn:#ffb648;
  --r:16px; --shadow:0 20px 60px rgba(0,0,0,.55);
  --fast:.18s; --mid:.35s;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  background:radial-gradient(1200px 700px at 80% -10%, #14203a 0%, transparent 55%),
             radial-gradient(900px 600px at -10% 110%, #1a0f2e 0%, transparent 50%),
             var(--bg);
  color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden; user-select:none;
}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:.02em}
button{font-family:inherit; cursor:pointer; color:inherit; border:none; background:none}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-thumb{background:#1e2740; border-radius:20px; border:2px solid transparent; background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#2c3a5e; background-clip:content-box}
.mono{font-variant-numeric:tabular-nums}
.up{text-transform:uppercase; letter-spacing:.14em}
.center{display:flex; align-items:center; justify-content:center}

/* ============ APP SHELL ============ */
#app{position:fixed; inset:0; display:flex; flex-direction:column}
.screen{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity var(--mid) ease}
.screen.on{opacity:1; pointer-events:auto}

/* ============ INTRO ============ */
#intro{background:#04060a; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:34px}
.intro-mark{position:relative; width:min(70vw,520px); text-align:center}
.ea-badge{
  display:inline-flex; align-items:center; gap:14px; padding:10px 20px; border-radius:100px;
  border:1px solid var(--line2); background:rgba(255,255,255,.03); margin-bottom:26px;
  animation:fadeUp .9s .1s both;
}
.ea-badge b{font-size:15px; letter-spacing:.42em; font-weight:800}
.fc-logo{font-size:clamp(64px,15vw,150px); font-weight:900; line-height:.9; letter-spacing:-.04em;
  background:linear-gradient(180deg,#fff, #b9c6 e0 60%, #6d7ba0); -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:fadeUp 1s .25s both; text-shadow:0 0 60px rgba(198,255,46,.14)}
.fc-26{font-size:clamp(64px,15vw,150px); font-weight:900; letter-spacing:-.03em; color:var(--acc);
  text-shadow:0 0 40px rgba(198,255,46,.5); animation:fadeUp 1s .4s both}
.intro-sub{color:var(--dim); letter-spacing:.5em; font-size:12px; animation:fadeUp 1s .6s both}
.intro-bar{width:min(60vw,360px); height:4px; border-radius:10px; background:#141a28; overflow:hidden; animation:fadeUp 1s .7s both}
.intro-bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--acc2)); box-shadow:0 0 20px var(--acc)}
.intro-tip{color:var(--dim2); font-size:12.5px; height:16px; animation:fadeUp 1s .8s both}
.intro-glow{position:absolute; width:900px; height:900px; border-radius:50%; filter:blur(90px); opacity:.22; pointer-events:none;
  background:conic-gradient(from 0deg, var(--acc), var(--acc2), var(--acc3), var(--acc)); animation:spin 18s linear infinite}

/* ============ TOP BAR ============ */
#top{display:flex; align-items:center; gap:18px; padding:12px 22px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(10,14,24,.9),rgba(10,14,24,.55)); backdrop-filter:blur(14px); z-index:20; position:relative}
.brand{display:flex; align-items:baseline; gap:8px; cursor:pointer}
.brand b{font-weight:900; letter-spacing:-.02em; font-size:20px}
.brand .b2{color:var(--acc)}
.crumbs{display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12.5px}
.crumbs .cur{color:var(--txt)}
.top-spacer{flex:1}
.hud{display:flex; align-items:center; gap:10px}
.chip{display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:11px; border:1px solid var(--line);
  background:var(--panel); font-size:12.5px}
.chip .lbl{color:var(--dim); font-size:10px; letter-spacing:.12em; text-transform:uppercase}
.chip .val{font-weight:800}
.chip.club{gap:10px; padding-left:8px}
.mini-crest{width:26px; height:30px}
.icon-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--panel); font-size:16px}
.icon-btn:hover{border-color:var(--line2); background:var(--panel2)}

/* ============ NAV ============ */
#shell{display:flex; flex:1; min-height:0}
#nav{width:78px; border-right:1px solid var(--line); background:linear-gradient(180deg,rgba(12,16,28,.6),rgba(8,11,18,.6));
  display:flex; flex-direction:column; padding:14px 0; gap:4px; z-index:10; transition:width var(--fast)}
#nav:hover{width:214px}
.nav-item{display:flex; align-items:center; gap:14px; padding:12px 0 12px 22px; margin:0 10px; border-radius:12px;
  color:var(--dim); font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; position:relative}
.nav-item .ico{font-size:19px; width:20px; text-align:center; flex:none}
.nav-item .tx{opacity:0; transition:opacity var(--fast)}
#nav:hover .nav-item .tx{opacity:1}
.nav-item:hover{color:var(--txt); background:var(--panel)}
.nav-item.on{color:#05070c; background:linear-gradient(90deg,var(--acc),#a4e01f)}
.nav-item.on .ico{filter:drop-shadow(0 0 6px rgba(0,0,0,.2))}
.nav-sep{height:1px; background:var(--line); margin:8px 16px}

/* ============ MAIN CANVAS ============ */
#main{flex:1; min-width:0; position:relative; overflow:hidden}
.view{position:absolute; inset:0; overflow:auto; padding:26px 30px 40px; opacity:0; transform:translateY(10px);
  pointer-events:none; transition:opacity var(--mid), transform var(--mid)}
.view.on{opacity:1; transform:none; pointer-events:auto}
.view-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px}
.view-head h2{font-size:clamp(24px,3.4vw,38px); letter-spacing:-.02em; line-height:1}
.view-head .sub{color:var(--dim); font-size:13px; margin-top:6px}
.kicker{color:var(--acc); font-weight:800; font-size:12px; letter-spacing:.28em; text-transform:uppercase; margin-bottom:8px}

/* generic */
.card{background:linear-gradient(180deg,var(--panel),rgba(9,12,20,.8)); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.card-pad{padding:18px}
.grid{display:grid; gap:16px}
.btn{display:inline-flex; align-items:center; gap:9px; padding:11px 17px; border-radius:12px; font-weight:800; font-size:13.5px;
  border:1px solid var(--line2); background:var(--panel2); transition:var(--fast)}
.btn:hover{border-color:var(--acc); box-shadow:0 0 0 3px rgba(198,255,46,.08)}
.btn.primary{background:linear-gradient(90deg,var(--acc),#a4e01f); color:#05070c; border:none}
.btn.primary:hover{box-shadow:0 8px 26px rgba(198,255,46,.28)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px; font-size:12px; border-radius:10px}
.btn.acc2{background:linear-gradient(90deg,var(--acc2),#0bb6cf); color:#05070c; border:none}
.badge{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:100px; font-size:11px; font-weight:800;
  border:1px solid var(--line2); background:rgba(255,255,255,.04)}
.badge.good{color:var(--good); border-color:rgba(56,224,138,.4); background:rgba(56,224,138,.08)}
.badge.bad{color:var(--bad); border-color:rgba(255,93,108,.4); background:rgba(255,93,108,.08)}
.badge.gold{color:var(--gold); border-color:rgba(255,211,90,.4); background:rgba(255,211,90,.08)}
.divider{height:1px; background:var(--line); margin:16px 0}

/* rating pill */
.ovr{display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:11px; font-weight:900; font-size:17px;
  background:linear-gradient(180deg,#222c46,#161d30); border:1px solid var(--line2)}
.ovr.t1{background:linear-gradient(180deg,#3a2f00,#241d00); border-color:rgba(255,211,90,.5); color:var(--gold)}
.ovr.t2{background:linear-gradient(180deg,#0f2f26,#0a2119); border-color:rgba(56,224,138,.4); color:#7bf0b6}
.ovr.t3{background:linear-gradient(180deg,#16233d,#101a2e); border-color:var(--line2); color:#a9bbe6}

/* ============ MAIN MENU (HUB) ============ */
#hub{padding:0; overflow:hidden}
.hub-wrap{position:absolute; inset:0; display:flex; flex-direction:column}
.hub-hero{flex:1; display:flex; gap:20px; padding:26px 30px; min-height:0}
.hub-feature{flex:1.5; border-radius:22px; position:relative; overflow:hidden; border:1px solid var(--line2);
  background:linear-gradient(120deg,#0a1428,#12061f); display:flex; flex-direction:column; justify-content:flex-end; padding:34px; cursor:pointer}
.hub-feature .pitch-bg{position:absolute; inset:0; opacity:.5}
.hub-feature .glow{position:absolute; right:-120px; top:-120px; width:420px; height:420px; border-radius:50%; filter:blur(70px); opacity:.35;
  background:radial-gradient(circle,var(--acc),transparent 65%)}
.hub-feature h1{font-size:clamp(30px,5vw,58px); letter-spacing:-.03em; line-height:.95; position:relative}
.hub-feature p{color:var(--dim); max-width:440px; margin:12px 0 20px; position:relative; font-size:14px}
.hub-tiles{flex:1; display:grid; grid-template-rows:repeat(3,1fr); gap:16px; min-width:280px}
.hub-tile{border-radius:18px; border:1px solid var(--line); background:linear-gradient(120deg,var(--panel),rgba(9,12,20,.7));
  padding:20px 22px; display:flex; align-items:center; gap:18px; cursor:pointer; transition:var(--fast); position:relative; overflow:hidden}
.hub-tile:hover{border-color:var(--acc); transform:translateX(4px)}
.hub-tile .em{font-size:30px; width:46px; text-align:center}
.hub-tile h3{font-size:19px}
.hub-tile p{color:var(--dim); font-size:12.5px; margin-top:3px}
.hub-tile .arw{margin-left:auto; color:var(--dim); font-size:20px; transition:var(--fast)}
.hub-tile:hover .arw{color:var(--acc); transform:translateX(4px)}
.hub-strip{display:flex; gap:14px; padding:0 30px 26px}
.hub-mini{flex:1; border-radius:14px; border:1px solid var(--line); background:var(--panel); padding:14px 16px; cursor:pointer; transition:var(--fast)}
.hub-mini:hover{border-color:var(--line2); background:var(--panel2)}
.hub-mini .em{font-size:20px}
.hub-mini h4{margin-top:8px; font-size:14px}
.hub-mini p{color:var(--dim); font-size:11.5px; margin-top:2px}

/* ============ CLUB SELECT ============ */
.league-tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
.ltab{padding:9px 15px; border-radius:11px; border:1px solid var(--line); background:var(--panel); font-weight:800; font-size:12.5px; color:var(--dim);
  display:flex; align-items:center; gap:9px}
.ltab:hover{color:var(--txt)}
.ltab.on{color:var(--txt); border-color:var(--acc); background:rgba(198,255,46,.06)}
.club-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px}
.club-card{border:1px solid var(--line); border-radius:16px; padding:18px; background:linear-gradient(160deg,var(--panel),rgba(9,12,20,.7));
  cursor:pointer; transition:var(--fast); position:relative; overflow:hidden}
.club-card:hover{border-color:var(--acc); transform:translateY(-3px); box-shadow:var(--shadow)}
.club-card .crest{width:54px; height:62px}
.club-card h3{margin-top:12px; font-size:16px}
.club-card .meta{color:var(--dim); font-size:12px; margin-top:4px; display:flex; gap:10px}
.club-card .ovrbar{margin-top:12px; display:flex; align-items:center; gap:8px}
.bar{flex:1; height:6px; border-radius:6px; background:#141c30; overflow:hidden}
.bar>i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,var(--acc),var(--acc2))}

/* ============ DASHBOARD ============ */
.dash{display:grid; grid-template-columns:1.3fr 1fr; gap:16px}
@media(max-width:1100px){.dash{grid-template-columns:1fr}}
.next-match{position:relative; overflow:hidden; padding:24px}
.nm-vs{display:flex; align-items:center; justify-content:space-between; gap:18px; margin:14px 0}
.nm-team{flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center}
.nm-team .crest{width:64px; height:74px}
.nm-team b{font-size:15px}
.nm-mid{text-align:center}
.nm-mid .vs{font-size:34px; font-weight:900; color:var(--dim2)}
.nm-mid .comp{font-size:11px; color:var(--acc); letter-spacing:.2em; text-transform:uppercase}
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.stat-box{background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px}
.stat-box .k{color:var(--dim); font-size:11px; letter-spacing:.1em; text-transform:uppercase}
.stat-box .v{font-size:26px; font-weight:900; margin-top:6px}
.stat-box .v small{font-size:13px; color:var(--dim); font-weight:700}
.form-dots{display:flex; gap:5px; margin-top:8px}
.fdot{width:22px; height:22px; border-radius:7px; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; color:#05070c}
.fdot.W{background:var(--good)} .fdot.D{background:var(--warn)} .fdot.L{background:var(--bad)}
.news-item{display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer}
.news-item:last-child{border-bottom:none}
.news-item:hover .nh{color:var(--acc)}
.news-thumb{width:52px; height:52px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-size:22px;
  background:var(--panel2); border:1px solid var(--line)}
.news-item .nh{font-weight:800; font-size:13.5px; line-height:1.3}
.news-item .nm{color:var(--dim); font-size:11.5px; margin-top:4px}
.news-tag{font-size:9.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--acc2); font-weight:800}

/* ============ SQUAD / PITCH ============ */
.squad-wrap{display:grid; grid-template-columns:1.1fr 1fr; gap:16px}
@media(max-width:1150px){.squad-wrap{grid-template-columns:1fr}}
.pitch{position:relative; border-radius:18px; overflow:hidden; aspect-ratio:.7; border:1px solid var(--line2);
  background:linear-gradient(180deg,#0b3b25,#072a1a)}
.pitch svg{position:absolute; inset:0; width:100%; height:100%}
.pplayer{position:absolute; transform:translate(-50%,-50%); width:64px; text-align:center; cursor:pointer; transition:var(--fast)}
.pplayer:hover{transform:translate(-50%,-50%) scale(1.08)}
.pplayer .face{width:48px; height:48px; margin:0 auto; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.5);
  box-shadow:0 6px 14px rgba(0,0,0,.5); background:#0a0e18}
.pplayer .nm{font-size:10px; font-weight:800; margin-top:3px; text-shadow:0 1px 3px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pplayer .pos{font-size:8.5px; color:var(--acc); font-weight:800}
.pplayer .rt{position:absolute; top:-4px; right:2px; width:20px; height:20px; border-radius:6px; font-size:11px; font-weight:900;
  display:flex; align-items:center; justify-content:center; background:#05070c; border:1px solid var(--line2)}
.formation-pick{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.fpick{padding:7px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-weight:800; font-size:12px; color:var(--dim)}
.fpick.on{color:#05070c; background:var(--acc); border-color:var(--acc)}
.roster{max-height:620px; overflow:auto}
.rrow{display:grid; grid-template-columns:34px 40px 1fr auto; align-items:center; gap:12px; padding:9px 12px; border-radius:12px; cursor:pointer}
.rrow:hover{background:var(--panel2)}
.rrow .face{width:38px; height:38px; border-radius:10px; overflow:hidden; border:1px solid var(--line2); background:#0a0e18}
.rrow .info b{font-size:13.5px} .rrow .info .sub{color:var(--dim); font-size:11px}
.pos-tag{width:34px; text-align:center; font-size:10.5px; font-weight:900; padding:3px 0; border-radius:6px; background:var(--panel2); color:var(--acc2)}
.roster-group{color:var(--dim); font-size:11px; letter-spacing:.14em; text-transform:uppercase; padding:12px 12px 6px; font-weight:800}

/* ============ PLAYER MODAL ============ */
.modal-back{position:fixed; inset:0; background:rgba(3,5,9,.72); backdrop-filter:blur(8px); z-index:100; display:flex;
  align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:var(--fast); padding:24px}
.modal-back.on{opacity:1; pointer-events:auto}
.modal{width:min(920px,96vw); max-height:92vh; overflow:auto; border-radius:22px; border:1px solid var(--line2);
  background:linear-gradient(180deg,#0e1424,#080b12); box-shadow:var(--shadow); transform:scale(.96); transition:var(--fast)}
.modal-back.on .modal{transform:scale(1)}
.pcard-top{display:flex; gap:24px; padding:28px; position:relative; overflow:hidden;
  background:linear-gradient(120deg,rgba(198,255,46,.06),transparent 60%)}
.pcard-glow{position:absolute; right:-80px; top:-80px; width:340px; height:340px; border-radius:50%; filter:blur(70px); opacity:.3; background:var(--acc)}
.big-face{width:150px; height:150px; border-radius:20px; overflow:hidden; border:2px solid var(--line2); flex:none; background:#0a0e18; box-shadow:var(--shadow)}
.pcard-info{flex:1; min-width:0; position:relative}
.pcard-info h2{font-size:30px; letter-spacing:-.02em}
.pcard-info .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; color:var(--dim); font-size:13px; align-items:center}
.big-ovr{position:absolute; top:0; right:0; text-align:center}
.big-ovr .n{font-size:52px; font-weight:900; line-height:.9; color:var(--gold)}
.big-ovr .l{font-size:10px; letter-spacing:.2em; color:var(--dim)}
.attr-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 28px; padding:8px 28px 20px}
.attr{display:flex; align-items:center; gap:12px}
.attr .an{width:96px; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em; font-weight:700}
.attr .av{width:28px; font-weight:900; text-align:right}
.attr .abar{flex:1; height:7px; border-radius:6px; background:#141c30; overflow:hidden}
.attr .abar>i{display:block; height:100%; border-radius:6px}
.radar-wrap{display:flex; gap:24px; padding:0 28px 24px; align-items:center; flex-wrap:wrap}
.play-style{display:flex; gap:8px; flex-wrap:wrap; padding:0 28px 24px}
.ps{padding:6px 11px; border-radius:9px; font-size:11.5px; font-weight:800; border:1px solid rgba(0,229,255,.35); color:var(--acc2); background:rgba(0,229,255,.06)}
.ps.plus{border-color:rgba(255,211,90,.5); color:var(--gold); background:rgba(255,211,90,.07)}

/* ============ TABLES ============ */
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{text-align:left; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.1em; font-weight:800; padding:10px 10px; border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px; border-bottom:1px solid var(--line)}
.tbl tr:hover td{background:rgba(255,255,255,.02)}
.tbl .pos{width:34px; font-weight:900; color:var(--dim)}
.tbl .cl{display:flex; align-items:center; gap:10px; font-weight:800}
.tbl .cl .mini-crest{width:20px; height:23px}
.tbl td.n{text-align:center; font-variant-numeric:tabular-nums}
.tbl .me td{background:rgba(198,255,46,.06)}
.tbl .me .cl{color:var(--acc)}
.zone-ucl{border-left:3px solid var(--acc2)}
.zone-uel{border-left:3px solid var(--acc)}
.zone-rel{border-left:3px solid var(--bad)}

/* ============ TRANSFERS ============ */
.market-head{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; align-items:center}
.search{flex:1; min-width:200px; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel)}
.search input{flex:1; background:none; border:none; outline:none; color:var(--txt); font-size:14px; font-family:inherit}
.filter-sel{padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); font-family:inherit; font-weight:700; font-size:13px}
.market-row{display:grid; grid-template-columns:44px 40px 1.4fr .8fr .7fr .9fr auto; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line)}
.market-row:hover{background:var(--panel2)}
.market-row .face{width:38px; height:38px; border-radius:10px; overflow:hidden; border:1px solid var(--line2); background:#0a0e18}
.flag{width:22px; height:15px; border-radius:3px; object-fit:cover; display:inline-block; border:1px solid rgba(255,255,255,.15)}

/* ============ MATCH SIM ============ */
#matchsim{position:fixed; inset:0; z-index:90; background:radial-gradient(1000px 600px at 50% 0%,#0d2038,#04060a 60%);
  display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:var(--mid)}
#matchsim.on{opacity:1; pointer-events:auto}
.ms-score{display:flex; align-items:center; justify-content:center; gap:30px; padding:30px 20px 16px}
.ms-team{display:flex; flex-direction:column; align-items:center; gap:10px; width:200px}
.ms-team .crest{width:70px; height:80px}
.ms-team b{font-size:16px}
.ms-nums{font-size:64px; font-weight:900; letter-spacing:.05em; display:flex; align-items:center; gap:20px}
.ms-clock{text-align:center; margin-bottom:8px}
.ms-clock .t{font-size:22px; font-weight:900; color:var(--acc)}
.ms-clock .st{font-size:11px; color:var(--dim); letter-spacing:.2em; text-transform:uppercase}
.ms-progress{width:min(760px,90vw); height:6px; margin:10px auto; border-radius:6px; background:#141c30; overflow:hidden}
.ms-progress>i{display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ms-feed{flex:1; overflow:auto; width:min(760px,92vw); margin:12px auto 0; padding:0 6px}
.ms-ev{display:flex; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); animation:slideIn .35s ease}
.ms-ev .mm{font-weight:900; color:var(--acc); width:44px; flex:none; font-variant-numeric:tabular-nums}
.ms-ev .em{width:26px; text-align:center; flex:none}
.ms-ev .tx{font-size:13.5px}
.ms-ev.goal{background:linear-gradient(90deg,rgba(198,255,46,.1),transparent); border-radius:10px; padding:11px 12px; border-bottom:none}
.ms-ev.goal .tx b{color:var(--acc)}
.ms-foot{display:flex; gap:12px; justify-content:center; padding:18px}

/* radar svg text */
.radar-lbl{fill:var(--dim); font-size:10px; font-weight:700}

/* ============ TROPHIES ============ */
.trophy-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:16px}
.trophy{border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; background:linear-gradient(180deg,var(--panel),rgba(9,12,20,.7)); position:relative}
.trophy.won{border-color:rgba(255,211,90,.4); background:linear-gradient(180deg,rgba(255,211,90,.06),rgba(9,12,20,.7))}
.trophy .ic{font-size:44px; filter:grayscale(1) opacity(.4)}
.trophy.won .ic{filter:none; text-shadow:0 0 24px rgba(255,211,90,.5)}
.trophy h4{margin-top:10px; font-size:14px}
.trophy .cnt{color:var(--gold); font-weight:900; margin-top:4px}
.trophy .none{color:var(--dim2); font-size:12px; margin-top:4px}

/* ============ PRESSER ============ */
.presser{max-width:760px; margin:0 auto}
.q-bubble{background:var(--panel2); border:1px solid var(--line); border-radius:16px 16px 16px 4px; padding:16px 18px; margin-bottom:16px; display:flex; gap:14px}
.q-bubble .rep{width:44px; height:44px; border-radius:12px; overflow:hidden; flex:none; border:1px solid var(--line2); background:#0a0e18}
.q-bubble .who{color:var(--acc2); font-weight:800; font-size:12px}
.q-bubble .q{margin-top:5px; font-size:14.5px; line-height:1.4}
.answers{display:grid; gap:10px}
.answer{text-align:left; padding:14px 16px; border-radius:14px; border:1px solid var(--line); background:var(--panel); transition:var(--fast); display:flex; gap:12px; align-items:center}
.answer:hover{border-color:var(--acc); background:var(--panel2)}
.answer .tone{font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; padding:3px 8px; border-radius:6px; flex:none}
.tone-calm{color:var(--acc2); background:rgba(0,229,255,.1)}
.tone-bold{color:var(--acc); background:rgba(198,255,46,.1)}
.tone-fiery{color:var(--acc3); background:rgba(255,46,136,.12)}
.reaction{margin-top:18px; padding:16px; border-radius:14px; border:1px solid var(--line); background:var(--panel2); display:none}
.reaction.show{display:block; animation:fadeUp .4s}

/* meters */
.meters{display:flex; gap:14px; flex-wrap:wrap}
.meter{flex:1; min-width:140px}
.meter .top{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:6px}
.meter .top b{color:var(--txt)}
.meter .track{height:8px; border-radius:8px; background:#141c30; overflow:hidden}
.meter .track>i{display:block; height:100%; border-radius:8px; transition:width .5s}

/* toast */
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); z-index:200;
  padding:13px 22px; border-radius:14px; background:linear-gradient(90deg,#161d30,#0d1220); border:1px solid var(--acc);
  box-shadow:0 10px 40px rgba(0,0,0,.5); font-weight:800; font-size:13.5px; opacity:0; transition:var(--mid); display:flex; gap:10px; align-items:center}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* animations */
@keyframes fadeUp{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes slideIn{from{opacity:0; transform:translateX(-14px)} to{opacity:1; transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5} 50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
.pitch-bg{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px)}
.empty{color:var(--dim); text-align:center; padding:50px; font-size:14px}
.spark{display:inline-block; animation:pulse 1.6s infinite}
.rise{animation:fadeUp .5s both}

/* ===== TEAM MANAGEMENT (screenshot-style) ===== */
.tm-tabs{display:flex; gap:8px; align-items:center}
.tm-tab{padding:8px 16px; border-radius:10px; font-weight:800; font-size:14px; color:var(--dim); border:1px solid transparent}
.tm-tab.on{color:var(--txt); background:var(--panel2); border-color:var(--line2)}
.tm-tab:hover{color:var(--txt)}
.tm-hint{color:var(--dim); font-size:12px; display:flex; align-items:center; gap:8px; margin:2px 0 10px}
.tm-pitch{position:relative; border-radius:18px; overflow:hidden; aspect-ratio:1.24; border:1px solid var(--line2);
  background:linear-gradient(180deg,#0c2f1f,#08281a 60%,#061f14)}
.tm-pitch svg{position:absolute; inset:0; width:100%; height:100%}
.pp{position:absolute; transform:translate(-50%,-50%); width:96px; text-align:center; cursor:pointer; transition:transform var(--fast)}
.pp:hover{transform:translate(-50%,-50%) scale(1.06)}
.pp.sel{filter:drop-shadow(0 0 0 2px var(--acc))}
.pp-top{position:relative; width:52px; height:52px; margin:0 auto}
.pp-face{width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.6); background:#0a0e18; box-shadow:0 6px 16px rgba(0,0,0,.55)}
.pp.sel .pp-face{border-color:var(--acc); box-shadow:0 0 0 3px rgba(198,255,46,.4)}
.pp-ovr{position:absolute; top:-6px; right:-14px; min-width:22px; height:20px; padding:0 4px; border-radius:6px; font-size:12px; font-weight:900;
  display:flex; align-items:center; justify-content:center; background:#05070c; border:1px solid var(--line2); color:#fff}
.pp-bar{height:4px; width:64px; margin:6px auto 4px; border-radius:4px; background:linear-gradient(90deg,#38e08a,#8ef0b6)}
.pp-name{font-size:12px; font-weight:800; text-shadow:0 1px 4px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pp-pos{font-size:9px; font-weight:900; letter-spacing:.08em; color:var(--acc)}
.bench{margin-top:16px}
.bench h4{margin-bottom:12px}
.bench-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px}
.bcard{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:13px; border:1px solid var(--line); background:var(--panel); cursor:pointer; transition:var(--fast); position:relative}
.bcard:hover{border-color:var(--line2); background:var(--panel2)}
.bcard.sel{border-color:var(--acc); box-shadow:0 0 0 2px rgba(198,255,46,.25)}
.bcard .bface{width:40px; height:40px; border-radius:50%; overflow:hidden; border:1px solid var(--line2); flex:none; background:#0a0e18}
.bcard .bpos{position:absolute; top:6px; left:10px; font-size:9px; font-weight:900; color:var(--acc2); display:flex; align-items:center; gap:4px}
.bcard .bpos i{width:6px; height:6px; border-radius:50%; background:var(--acc2); display:inline-block}
.bcard .bnm{font-size:12.5px; font-weight:800; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bcard .bage{color:var(--dim); font-size:10.5px}
.bcard .bovr{margin-left:auto; font-weight:900; font-size:15px}
.pitch-line{stroke:rgba(255,255,255,.16); stroke-width:.4; fill:none}
.anger-track{height:12px; border-radius:8px; background:#141c30; overflow:hidden; border:1px solid var(--line)}
.anger-track>i{display:block; height:100%; transition:width .4s; background:linear-gradient(90deg,#38e08a,#ffb648 55%,#ff5d6c)}
.seg{display:flex; gap:6px; flex-wrap:wrap}
.seg button{padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--panel); font-weight:800; font-size:12px; color:var(--dim)}
.seg button.on{color:#05070c; background:var(--acc); border-color:var(--acc)}
</style>

/* ---------- deterministic RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seeded(seed){return mulberry32(typeof seed==='string'?hashStr(seed):seed)}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function ri(r,a,b){return Math.floor(r()*(b-a+1))+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

  const CITY=['Aldermoor','Brackenford','Castleton','Dunmere','Eastvale','Fallowick','Granholm','Hartcliff','Ironhaven','Joreby','Kelmsford','Lynwood','Marburn','Norwick','Oldcastle','Penford','Queensmere','Ravenna','Stonewell','Thornvale','Underhill','Vinbrook','Westport','Yarborough','Ashenford','Blythmoor','Cindervale','Draymere','Elmsworth','Foxhollow','Greymouth','Holloway','Larkspur','Millvane','Oakenshaw','Portcastle','Redmarsh','Silverton','Tanglewood','Wexmere','Ambleside','Bexmoor','Coldstream','Dellmoor','Everwick','Farnley','Glenmara','Hallowby','Inchford','Kirkwell','Loxbury','Merrivale','Northgate','Ostwick','Pinehurst','Rushden','Selby','Torrance','Whitmore','Ravenhill'];
  const SUF=['United','City','FC','Town','Rovers','Athletic','Albion','County','Wanderers','Vale'];
  const PAL=[['#c8102e','#ffffff'],['#0a5cae','#ffd35a'],['#0f7a3d','#ffffff'],['#141824','#e6b400'],['#5b2c8f','#ffffff'],['#b8481f','#141824'],['#0891b2','#ffffff'],['#7a1030','#ffcc00'],['#1d4ed8','#ffffff'],['#0f6b52','#ffe066'],['#9d1a1a','#e6e6ee'],['#2a3550','#3fd0e6']];
  const usedNames=new Set(), usedShorts=new Set();
  LEAGUES.forEach(l=>l.clubs.forEach(c=>{usedNames.add(c.name);usedShorts.add(c.short)}));
  let ci=0;
  LEAGUES.forEach(l=>{
    const r=seeded('exp-'+l.id);
    while(l.clubs.length<20){
      const city=CITY[ci%CITY.length]; ci++;
      let name=city+' '+SUF[Math.floor(r()*SUF.length)];
      let g=0; while(usedNames.has(name)){ name=city+' '+SUF[(Math.floor(r()*SUF.length)+ ++g)%SUF.length]; if(g>SUF.length)break; }
      usedNames.add(name);
      let short=city.slice(0,3).toUpperCase(), t=0;
      while(usedShorts.has(short)){ short=city.slice(0,2).toUpperCase()+String.fromCharCode(65+((hashStr(name)+t++)%26)); }
      usedShorts.add(short);
      const pal=PAL[Math.floor(r()*PAL.length)];
      l.clubs.push(C(name,short,pal[0],pal[1],clamp(78-Math.floor((l.clubs.length-10))+ri(r,-1,1),67,78)));
    }
  });
})();

   pos:[[50,90],[16,68],[38,72],[62,72],[84,68],[50,58],[32,46],[68,46],[18,20],[50,15],[82,20]]},
};
const FORM_KEYS = Object.keys(FORMATIONS);

const POS_GROUP = {GK:'GK', CB:'DEF',LB:'DEF',RB:'DEF', CDM:'MID',CM:'MID',CAM:'MID',LM:'MID',RM:'MID', LW:'ATT',RW:'ATT',ST:'ATT'};

function attrProfile(r, pos, ovr){
  const base=ovr;
  const v=(lo,hi)=>clamp(Math.round(base+ri(r,lo,hi)),40,99);
  let a;
  if(pos==='GK') a={pace:v(-30,-18),shooting:v(-35,-25),passing:v(-14,-2),dribbling:v(-25,-14),defending:v(-2,6),physical:v(-6,4)};
  else if(POS_GROUP[pos]==='DEF') a={pace:v(-6,6),shooting:v(-24,-10),passing:v(-8,4),dribbling:v(-12,2),defending:v(0,8),physical:v(-2,8)};
  else if(POS_GROUP[pos]==='MID') a={pace:v(-6,6),shooting:v(-8,6),passing:v(0,8),dribbling:v(-4,7),defending:v(-8,6),physical:v(-6,4)};
  else a={pace:v(0,9),shooting:v(0,9),passing:v(-6,5),dribbling:v(-2,8),defending:v(-30,-16),physical:v(-8,4)};
  return a;
}
function genPlayer(clubName, pos, ovr, natKey, forcedName){
  const seed=clubName+'|'+pos+'|'+(forcedName||'')+'|'+ovr+'|'+Math.random().toString(36).slice(2,6);
  const r=seeded(seed);
  const nat = r()<0.5 ? natKey : pick(r, NATION_KEYS);
  const first = pick(r, FIRST_NAMES);
  const last = pick(r, SURNAMES);
  const attrs=attrProfile(r,pos,ovr);
  const age=ri(r,17,35);
  const potential=clamp(ovr + (age<23?ri(r,2,9):ri(r,-1,2)),ovr,99);
  // value model
  const ageF = age<=27?1:Math.max(0.35,1-(age-27)*0.11);
  const ovrF = Math.pow(Math.max(1,ovr-58)/22,3.1);
  let value=Math.round(ovrF*45e6*ageF*(0.7+r()*0.6)/1e5)*1e5;
  value=clamp(value,300e3,220e6);
  const wageV=Math.round(value/1000*(0.05+r()*0.04)/1e3)*1e3;
  // playstyles
  const nps=ri(r,1,4); const ps=[]; const pool=[...PLAYSTYLES];
  for(let i=0;i<nps;i++){const idx=Math.floor(r()*pool.length); ps.push({name:pool.splice(idx,1)[0], plus:ovr>=84&&r()<0.4})}
  const id='P'+hashStr(seed)+Math.floor(r()*9999);
  return {id, name:first+' '+last, first, last, pos, posGroup:POS_GROUP[pos], ovr, potential, age, nat, attrs, value, wage:wageV, ps, club:clubName, form:0, seed};
}

function buildSquad(club){
  const r=seeded('squad-'+club.name);
  const players=[];
  // template of positions for a full squad (23)
  const template=['GK','GK','GK', 'RB','RB','LB','LB','CB','CB','CB','CB', 'CDM','CDM','CM','CM','CM','CAM', 'RW','LW','LM','RM', 'ST','ST'];
  // a handful of headline players rated at/above the club's baseline, then squad depth
  template.forEach((pos,i)=>{
    const spread = i<4 ? ri(r,1,7) : i<11 ? ri(r,-3,3) : ri(r,-10,-2);
    const ovr=clamp(club.ovr+spread,55,95);
    players.push(genPlayer(club.name,pos,ovr,club.nat));
  });
  // sort by ovr
  players.sort((a,b)=>b.ovr-a.ovr);
  return players;
}

const Game = {
  state:{},
  allClubs:{},   // name -> {club, league}
  squads:{},     // name -> [players]
  init(){
    // index clubs & pre-build squads lazily
    LEAGUES.forEach(l=>l.clubs.forEach(c=>{ c.nat=l.nat; this.allClubs[c.name]={club:c,league:l}; }));
  },
  squad(name){ if(!this.squads[name]) this.squads[name]=buildSquad(this.allClubs[name].club); return this.squads[name]; },
  clubOf(name){ return this.allClubs[name].club; },
  leagueOf(name){ return this.allClubs[name].league; },
};

/* ============================================================
   LEAGUE TABLE + FIXTURES
   ============================================================ */
function makeSchedule(teams){ // double round-robin, returns array of rounds (each round = array of [home,away])
  const t=teams.slice(); if(t.length%2)t.push(null);
  const n=t.length, rounds=[];
  const arr=t.slice();
  for(let leg=0;leg<2;leg++){
    const a=t.slice();
    for(let round=0;round<n-1;round++){
      const games=[];
      for(let i=0;i<n/2;i++){
        let h=a[i], aw=a[n-1-i];
        if(h&&aw){ if(leg===1)[h,aw]=[aw,h]; games.push([h,aw]); }
      }
      rounds.push(games);
      a.splice(1,0,a.pop());
    }
  }
  return rounds;
}
function initLeagueTable(league){
  const tbl={};
  league.clubs.forEach(c=>tbl[c.name]={name:c.name,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,form:[]});
  return tbl;
}

/* ============================================================
   MATCH ENGINE
   ============================================================ */
function teamStrength(name){
  const xi=Game.startingXI(name);
  const att=xi.filter(p=>p.posGroup==='ATT').concat(xi.filter(p=>p.posGroup==='MID').slice(0,2));
  const def=xi.filter(p=>p.posGroup==='DEF'||p.posGroup==='GK');
  const avg=a=>a.reduce((s,p)=>s+p.ovr,0)/Math.max(1,a.length);
  return {atk:avg(att.length?att:xi), def:avg(def.length?def:xi), overall:avg(xi), xi};
}
function weightedScorer(r, xi){
  const cand=xi.filter(p=>p.posGroup!=='GK'); if(!cand.length)return xi[0];
  const w=cand.map(p=>{let x=(p.attrs.shooting*0.7+p.ovr*0.3); x*= p.posGroup==='ATT'?2.4:p.posGroup==='MID'?1.15:0.4; return Math.pow(x,1.35);});
  let sum=w.reduce((a,b)=>a+b,0), t=r()*sum;
  for(let i=0;i<cand.length;i++){t-=w[i]; if(t<=0)return cand[i];}
  return cand[cand.length-1];
}
function simMatch(home,away, opts={}){
  const r=seeded(home+'@'+away+'|'+(opts.seed||Math.random()));
  const H=teamStrength(home), A=teamStrength(away);
  const homeAdv=3.2;
  // expected goals
  const diff=(H.atk-A.def)+homeAdv, diff2=(A.atk-H.def);
  const xgH=clamp(1.35+diff*0.05,0.25,4.2), xgA=clamp(1.15+diff2*0.05,0.2,3.8);
  function goals(xg){let g=0;const L=Math.exp(-xg);let p=1,k=0;const u=r();p*=Math.exp(-xg);let cum=Math.exp(-xg);let f=1;while(true){if(u<cum||k>8)break;k++;f*=xg/k;cum+=Math.exp(-xg)*f}return k}
  let gh=goals(xgH), ga=goals(xgA);
  // build events
  const scorers=[];
  const events=[];
  const minutes=[];
  const total=gh+ga;
  for(let i=0;i<total;i++)minutes.push(ri(r,2,90));
  minutes.sort((a,b)=>a-b);
  let hi=0,ai=0;
  // assign each goal to a team preserving order
  const seq=[];for(let i=0;i<gh;i++)seq.push('H');for(let i=0;i<ga;i++)seq.push('A');
  for(let i=seq.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[seq[i],seq[j]]=[seq[j],seq[i]]}
  const xiH=Game.startingXI(home), xiA=Game.startingXI(away);
  const scorerFor=(s)=>weightedScorer(r, s==='H'?xiH:xiA);
  seq.forEach((s,i)=>{
    const scorer=scorerFor(s);
    const assister=weightedScorer(r, s==='H'?xiH:xiA);
    scorers.push({team:s,player:scorer.name,id:scorer.id,assist:(assister&&assister.id!==scorer.id)?assister.name:null,min:minutes[i]});
  });
  // event feed (goals + flavor)
  const flavor=[
    '{p} tests the keeper with a rasping drive.',
    'A crunching tackle from {p} draws a roar from the crowd.',
    '{p} whips in a dangerous cross but no one gambles.',
    'The referee waves away appeals for a penalty.',
    '{p} sees a curling effort clip the outside of the post.',
    'Sustained pressure now — the away end is nervous.',
    '{p} is booked for a cynical foul.',
    'Brilliant save! {p} is denied at point-blank range.',
    'The tempo drops as both sides catch their breath.',
    '{p} spins away from two defenders on the touchline.',
  ];
  const feed=[];
  let sh=0,sa=0;
  const scMap={}; scorers.forEach(s=>{scMap[s.min]=s});
  for(let m=1;m<=90;m++){
    if(scMap[m]){
      const g=scMap[m];
      if(g.team==='H')sh++;else sa++;
      feed.push({min:m,type:'goal',team:g.team,txt:`<b>GOAL!</b> ${g.player} finds the net for ${Game.clubOf(g.team==='H'?home:away).short}${g.assist?` (assist: ${g.assist})`:''}. It's ${sh}–${sa}.`});
    } else if(r()<0.09){
      const t=r()<0.5?'H':'A';
      const p=scorerFor(t);
      const fl=pick(r,flavor).replace('{p}',p.name);
      feed.push({min:m,type:fl.includes('booked')?'card':'chance',team:t,txt:fl});
    }
  }
  return {home,away,gh,ga,scorers,feed,xgH:xgH.toFixed(2),xgA:xgA.toFixed(2)};
}

/* ---------------- LINEUP / XI ---------------- */
Game.slotList=function(){return (FORMATIONS[this.state.formation]||FORMATIONS['4-3-3']).lines.flat()};
Game.buildLineup=function(clubName){
  const sq=Game.squad(clubName).slice();
  const slots=this.slotList();
  const used=new Set();
  const starters=[];
  slots.forEach(slot=>{
    const grp=POS_GROUP[slot];
    let best=null;
    sq.forEach(p=>{ if(used.has(p.id))return; if(POS_GROUP[p.pos]===grp && (!best||p.ovr>best.ovr)) best=p; });
    if(!best) sq.forEach(p=>{ if(used.has(p.id))return; if(!best||p.ovr>best.ovr) best=p; });
    used.add(best.id); starters.push(best.id);
  });
  const subs=sq.filter(p=>!used.has(p.id)).sort((a,b)=>b.ovr-a.ovr).map(p=>p.id);
  return {starters, subs};
};
Game.ensureLineup=function(){
  if(!this.state.lineup) this.state.lineup=this.buildLineup(this.state.club);
  const sq=Game.squad(this.state.club); const ids=new Set(sq.map(p=>p.p||p.id).map(x=>x));
  const valid=new Set(sq.map(p=>p.id));
  const L=this.state.lineup;
  // drop sold/missing, backfill starters
  L.starters=L.starters.filter(id=>valid.has(id));
  L.subs=(L.subs||[]).filter(id=>valid.has(id)&&!L.starters.includes(id));
  const inLineup=new Set([...L.starters,...L.subs]);
  sq.forEach(p=>{ if(!inLineup.has(p.id)) L.subs.push(p.id); });
  while(L.starters.length<11 && L.subs.length){ L.starters.push(L.subs.shift()); }
  return L;
};
Game.startingXI=function(name){
  if(name===this.state.club && this.state.lineup){ return this.ensureLineup().starters.map(id=>this.findPlayer(id)).filter(Boolean); }
  return Game.squad(name).slice(0,11);
};
Game.swapLineup=function(idA,idB){
  const L=this.ensureLineup();
  const si=L.starters.indexOf(idA), ss=L.subs.indexOf(idA);
  const ti=L.starters.indexOf(idB), ts=L.subs.indexOf(idB);
  if(si>=0 && ti>=0){ [L.starters[si],L.starters[ti]]=[L.starters[ti],L.starters[si]]; }         // starter<->starter (swap slots)
  else if(si>=0 && ts>=0){ L.starters[si]=idB; L.subs[ts]=idA; }                                    // starter<->sub
  else if(ss>=0 && ti>=0){ L.starters[ti]=idA; L.subs[ss]=idB; }
  else if(ss>=0 && ts>=0){ [L.subs[ss],L.subs[ts]]=[L.subs[ts],L.subs[ss]]; }
  this._selSquad=null;
};

Game.negotiate=function(id){
  const p=this.findPlayer(id); if(!p||p.club===this.state.club)return;
  const r=seeded('nego-'+id+this.state.playedMatches);
  const prem = p.ovr>=88?0.35:p.ovr>=84?0.22:p.ovr>=80?0.12:0.05;
  const sellerMin = Math.round(p.value*(1+prem)/1e5)*1e5;
  this.nego={ id, min:sellerMin, ask:Math.round(sellerMin*(1.12+r()*0.15)/1e5)*1e5, cash:Math.round(sellerMin*0.7/1e5)*1e5,
    swaps:[], anger:0, rounds:0, preferCash:r()<0.4, msg:'The selling club await your opening bid.', dealOff:false, accepted:false };
  this.renderNego();
};
Game.negoOfferValue=function(){ const n=this.nego; const disc=n.preferCash?0.6:0.82;

Game.negoCash=function(d){ this.nego.cash=clamp(Math.round((this.nego.cash+d)/1e5)*1e5,0,this.state.budget); this.renderNego(); };
Game.negoSwap=function(pid){ const n=this.nego; const i=n.swaps.indexOf(pid); if(i>=0)n.swaps.splice(i,1); else n.swaps.push(pid); this.renderNego(); };
Game.negoSubmit=function(){
  const n=this.nego, p=this.findPlayer(n.id); n.rounds++;
  const r=seeded('negosub-'+n.id+n.rounds+Math.random());
  const offer=this.negoOfferValue();
  const ratio=offer/n.min;
  if(n.preferCash && n.swaps.length){ n.anger=clamp(n.anger+16,0,100); }
  if(ratio>=1.0){
    n.accepted=true; this.state.budget-=n.cash;
    n.swaps.forEach(pid=>{ const sp=Game.squad(this.state.club); const idx=sp.findIndex(x=>x.id===pid); if(idx>=0){const pl=sp.splice(idx,1)[0]; pl.club=p.club; Game.squad(p.club).push(pl);} });
    this.completeTransfer(n.id, n.cash, true);
    return;
  }
  if(ratio>=0.9){ n.anger=clamp(n.anger+12,0,100); n.min=Math.round(n.min*0.98/1e5)*1e5; n.ask=n.min;
    n.msg=`Close. They'll do the deal for <b>${money(n.min)}</b> — meet it and he's yours.`; }
  else if(ratio>=0.72){ n.anger=clamp(n.anger+22,0,100); n.ask=Math.round(n.min*1.03/1e5)*1e5;
    n.msg=`Not enough. They counter at <b>${money(n.ask)}</b> and want more cash in the package.`; }
  else { n.anger=clamp(n.anger+34,0,100); n.msg=`Insulting. That bid is nowhere near their valuation of ${money(n.min)}.`; }
  if(n.anger>=100){ n.dealOff=true; n.msg=`Negotiations collapse — the club have ended talks. Try again after the next match.`; toast('Talks broke down.'); }
  this.renderNego();
};
Game.sellPlayer=function(id){
  const p=this.findPlayer(id); if(!p||p.club!==this.state.club)return;
  const r=seeded('sell-'+id+this.state.playedMatches);
  // find an interested AI club (needs the position, can roughly afford)
  const clubs=[]; LEAGUES.forEach(l=>l.clubs.forEach(c=>{ if(c.name!==this.state.club) clubs.push(c); }));
  const buyer=pick(r,clubs.filter(c=>c.budget>=p.value*0.4).sort((a,b)=>Math.abs(a.ovr-p.ovr)-Math.abs(b.ovr-p.ovr)).slice(0,10)||clubs);
  const bid=Math.round(p.value*(0.78+r()*0.4)/1e5)*1e5;
  this.openModalHTML(`<div style="padding:28px">
    <div class="kicker">Outgoing Transfer</div><h2 style="margin:6px 0 4px">Sell ${p.name}?</h2>
    <div style="color:var(--dim);font-size:13px;margin-bottom:18px">${p.pos} · Age ${p.age} · OVR ${p.ovr} · Valued at ${money(p.value)}</div>

    </div>

};
Game.confirmSale=function(id,buyerName,bid){
  const p=this.findPlayer(id); if(!p)return;
  const sq=Game.squad(this.state.club); const idx=sq.findIndex(x=>x.id===id);
  if(idx<0)return;
  // don't leave XI short — will be backfilled by ensureLineup
  const pl=sq.splice(idx,1)[0]; pl.club=buyerName; Game.squad(buyerName).push(pl);
  this.state.budget+=bid; this._pool=null;
  const L=this.state.lineup; if(L){ L.starters=L.starters.filter(x=>x!==id); L.subs=L.subs.filter(x=>x!==id); }
  this.ensureLineup();
  this.addNews('transfer',`${p.name} departs ${this.clubOf(this.state.club).short} for ${this.clubOf(buyerName).short}`,`The ${p.ovr}-rated ${p.pos} leaves for ${money(bid)}, boosting the transfer kitty.`,'');
  this.closeModal(); toast(`${p.name} sold for ${money(bid)}.`); this.autosave();
  this.go(this.current==='squad'?'squad':'transfers');
};
Game.completeTransfer=function(id,fee,alreadyPaid){
  const p=this.findPlayer(id); if(!p)return;
  if(!alreadyPaid && fee>this.state.budget){toast('Not enough budget.');return}
  // remove from old club, add to yours
  const old=Game.squad(p.club); const idx=old.indexOf(p); if(idx>=0)old.splice(idx,1);
  p.club=this.state.club; Game.squad(this.state.club).unshift(p);
  Game.squad(this.state.club).sort((a,b)=>b.ovr-a.ovr);
  if(!alreadyPaid) this.state.budget-=fee;
  this._pool=null;
  // add newcomer to bench so lineup stays valid
  if(this.state.lineup && !this.state.lineup.starters.includes(p.id) && !this.state.lineup.subs.includes(p.id)) this.state.lineup.subs.unshift(p.id);
  this.state.transfersDone.push({name:p.name,fee,ovr:p.ovr,seed:p.seed});
  this.state.morale=clamp(this.state.morale+3,0,100); this.state.fanHappiness=clamp(this.state.fanHappiness+4,0,100);
  this.addNews('transfer',`${this.clubOf(this.state.club).name} complete the signing of ${p.name}`,`The ${p.ovr}-rated ${p.pos} joins for ${money(fee)} in a statement of intent from the ownership.`,'');
  this.closeModal();
  toast(`${p.name} signed for ${money(fee)}!`); this.autosave();
  this.go('transfers');
};
Game.showMyTransfers=function(){

      <div style="width:44px;height:44px;border-radius:11px;overflow:hidden;border:1px solid var(--line2)">${faceSVG(x.seed,44)}</div>

/* ---------------- PRE / POST MATCH PRESS ---------------- */
Game.matchPress=function(kind,ctx,cb){
  const r=seeded('mp-'+kind+this.state.playedMatches+(ctx.opp||''));
  let q, ans;
  if(kind==='pre'){
    const opp=ctx.opp;
    q=pick(r,[`How do you approach today's clash with ${opp}?`,`${opp} away — is this a must-win?`,`The fans expect three points here. Feeling the pressure?`]);
    ans=[{tone:'calm',t:"We respect them, but we focus on our own game.",m:{morale:2}},
         {tone:'bold',t:"We're going for the win — front foot from minute one.",m:{morale:4,fans:3}},
         {tone:'fiery',t:"If we play our football, they can't live with us.",m:{fans:5,morale:-2}}];
  } else {
    const won=ctx.res>0, drew=ctx.res===0;
    q= won?pick(r,['A big win — what pleased you most?','Another three points. Delighted?'])
        : drew?pick(r,['A share of the spoils — fair result?','A draw. Two points dropped or one gained?'])
        : pick(r,['A tough defeat. Where did it go wrong?','Beaten today — how do you respond?']);
    ans= won?[{tone:'calm',t:"Credit to the players — a professional job.",m:{morale:3,board:2}},{tone:'bold',t:"That's a statement of our ambitions this year.",m:{fans:5,morale:2}},{tone:'fiery',t:"Let the rest of the league take note.",m:{fans:6,board:-2}}]
       : drew?[{tone:'calm',t:"We take the point and move on.",m:{board:1}},{tone:'bold',t:"We should have won it — we'll keep creating chances.",m:{morale:2}},{tone:'fiery',t:"Frankly the officials cost us today.",m:{fans:3,board:-3}}]
       : [{tone:'calm',t:"We'll review it honestly and go again.",m:{board:2,morale:1}},{tone:'bold',t:"My responsibility. We'll bounce back next week.",m:{fans:3,board:1}},{tone:'fiery',t:"That performance was unacceptable and they know it.",m:{morale:-4,board:2}}];
  }
  const idx=Math.floor(r()*1000);
  this.openModalHTML(`<div style="padding:26px">
    <div class="kicker">${kind==='pre'?'Pre-Match Press':'Post-Match Press'}</div>
    <div class="q-bubble" style="margin-top:12px"><div class="rep">${faceSVG('rep'+idx,44)}</div><div><div class="who">Press Room</div><div class="q">${q}</div></div></div>
    <div class="answers" id="mpAns"></div></div>`);
  const box=$('#mpAns');
  ans.forEach(a=>{ const btn=el('button','answer',`<span class="tone tone-${a.tone}">${a.tone}</span><span>${a.t}</span>`);
    btn.onclick=()=>{ if(a.m.morale)this.state.morale=clamp(this.state.morale+a.m.morale,0,100);
      if(a.m.fans)this.state.fanHappiness=clamp(this.state.fanHappiness+a.m.fans,0,100);
      if(a.m.board)this.state.boardConfidence=clamp(this.state.boardConfidence+(a.m.board||0),0,100);
      this.closeModal(); if(cb)cb(); };
    box.appendChild(btn); });
};
/* ---------------- MATCH PLAY ---------------- */
Game.playMatch=function(){
  const fx=this.nextFixture(); if(!fx){toast('No match to play.');return}
  const opp=fx.home===this.state.club?fx.away:fx.home;
  this.matchPress('pre',{opp:this.clubOf(opp).short}, ()=>this.runMatchSim(fx.home,fx.away,true));
};
Game.simMatchQuick=function(){
  const fx=this.nextFixture(); if(!fx)return;
  const res=simMatch(fx.home,fx.away);
  this.applyResult(res); this.advanceWeek();
  this.go('career');
  toast(`Result: ${this.clubOf(fx.home).short} ${res.gh}-${res.ga} ${this.clubOf(fx.away).short}`,'');
};
Game.runMatchSim=function(home,away,userMatch){
  const res=simMatch(home,away);
  this._pendingRes=res; this._pendingUser=userMatch;
  const ms=$('#matchsim'); const lg=this.leagueOf(this.state.club);
  $('#msCrestH').innerHTML=crestSVG(this.clubOf(home),70);
  $('#msCrestA').innerHTML=crestSVG(this.clubOf(away),70);
  $('#msNameH').textContent=this.clubOf(home).short;
  $('#msNameA').textContent=this.clubOf(away).short;
  $('#msComp').textContent=lg.name;
  $('#msScoreH').textContent='0'; $('#msScoreA').textContent='0';
  $('#msFeed').innerHTML=''; $('#msBar').style.width='0';
  $('#msFoot').innerHTML='';
  ms.classList.add('on');
  // animate
  let sh=0,sa=0,fi=0; const feed=res.feed; const feedEl=$('#msFeed');
  const SPD={slow:150,normal:75,fast:32,instant:1};
  const speed= SPD[this.state.simSpeed]||75;
  if(this.state.simSpeed==='instant'){ this._pendingRes=res; this.skipMatch(); return; }
  let minute=0;
  clearInterval(this._matchIv);
  this._matchIv=setInterval(()=>{
    minute++;
    $('#msClock').textContent=minute+"'";
    $('#msBar').style.width=(minute/90*100)+'%';
    while(fi<feed.length && feed[fi].min<=minute){
      const e=feed[fi++];
      if(e.type==='goal'){ if(e.team==='H')sh++;else sa++; $('#msScoreH').textContent=sh; $('#msScoreA').textContent=sa; }
      const row=el('div','ms-ev'+(e.type==='goal'?' goal':''));
      const icon=e.type==='goal'?'<span style="color:var(--acc)">●</span>':e.type==='card'?'<span style="color:var(--warn)">▮</span>':'<span style="color:var(--dim2)">·</span>';
      row.innerHTML=`<span class="mm">${e.min}'</span><span class="em">${icon}</span><span class="tx">${e.txt}</span>`;
      feedEl.appendChild(row); feedEl.scrollTop=feedEl.scrollHeight;
    }
    if(minute>=90){
      clearInterval(this._matchIv);
      const ft=el('div','ms-ev goal'); ft.innerHTML=`<span class="mm">FT</span><span class="em" style="color:var(--acc)">●</span><span class="tx"><b>Full Time.</b> ${this.clubOf(home).short} ${res.gh} – ${res.ga} ${this.clubOf(away).short} · xG ${res.xgH}–${res.xgA}</span>`;
      feedEl.appendChild(ft); feedEl.scrollTop=feedEl.scrollHeight;
      $('#msFoot').innerHTML=`<button class="btn primary" onclick="Game.finishMatch()">Continue →</button>`;
    }
  }, speed);
  // allow skip
  $('#msFoot').innerHTML=`<button class="btn ghost" onclick="Game.skipMatch()">Skip to Result ⏭</button>`;
};
Game.skipMatch=function(){
  clearInterval(this._matchIv);
  const res=this._pendingRes;
  $('#msScoreH').textContent=res.gh; $('#msScoreA').textContent=res.ga; $('#msClock').textContent="90'"; $('#msBar').style.width='100%';
  const feedEl=$('#msFeed'); feedEl.innerHTML='';
  res.feed.forEach(e=>{const row=el('div','ms-ev'+(e.type==='goal'?' goal':''));const icon=e.type==='goal'?'<span style="color:var(--acc)">●</span>':e.type==='card'?'<span style="color:var(--warn)">▮</span>':'<span style="color:var(--dim2)">·</span>';row.innerHTML=`<span class="mm">${e.min}'</span><span class="em">${icon}</span><span class="tx">${e.txt}</span>`;feedEl.appendChild(row)});
  const ft=el('div','ms-ev goal'); ft.innerHTML=`<span class="mm">FT</span><span class="em" style="color:var(--acc)">●</span><span class="tx"><b>Full Time.</b> ${this.clubOf(res.home).short} ${res.gh} – ${res.ga} ${this.clubOf(res.away).short}</span>`; feedEl.appendChild(ft); feedEl.scrollTop=feedEl.scrollHeight;
  $('#msFoot').innerHTML=`<button class="btn primary" onclick="Game.finishMatch()">Continue →</button>`;
};
Game.finishMatch=function(){
  $('#matchsim').classList.remove('on');
  const res=this._pendingRes;
  this.applyResult(res);
  this.advanceWeek();
  // morale reaction if user match
  const me=this.state.club;
  if(res.home===me||res.away===me){
    const myG=res.home===me?res.gh:res.ga, opG=res.home===me?res.ga:res.gh;
    if(myG>opG){this.state.morale=clamp(this.state.morale+5,0,100);this.state.boardConfidence=clamp(this.state.boardConfidence+3,0,100);this.state.fanHappiness=clamp(this.state.fanHappiness+4,0,100)}
    else if(myG<opG){this.state.morale=clamp(this.state.morale-6,0,100);this.state.boardConfidence=clamp(this.state.boardConfidence-4,0,100);this.state.fanHappiness=clamp(this.state.fanHappiness-5,0,100)}
    else{this.state.morale=clamp(this.state.morale+1,0,100)}
    // scorer news
    const scr=res.scorers.filter(s=>(s.team==='H')===(res.home===me));
    if(myG>opG) this.addNews('match',`${this.clubOf(me).short} win ${myG}-${opG}`,`${scr.map(s=>s.player).join(', ')||'A solid team display'} sealed the points. The dressing room is buzzing.`);
    else if(myG<opG) this.addNews('match',`${this.clubOf(me).short} slip to ${opG}-${myG} defeat`,`Questions will be asked after a disappointing result. The manager faces the media.`);
    this.maybeGenerateDrama();
    this.autosave();
    // post-match press, then continue
    this.matchPress('post',{res:myG-opG}, ()=>{ if(!this.nextFixture()) this.endOfLeagueSeason(); else this.go('career'); });
    return;
  }
  this.maybeGenerateDrama();
  this.go('career');
};
/* when the league campaign ends, run continental knockouts before the new season */
Game.endOfLeagueSeason=function(){
  this.simContinental();
};
Game.qualifiers=function(){
  const cont=[], chal=[];
  LEAGUES.forEach(l=>{ const t=Object.values(this.state.tables[l.id]).sort(this.sortTable);
    t.slice(0,4).forEach(x=>cont.push(x.name)); t.slice(4,6).forEach(x=>chal.push(x.name)); });
  return {cont, chal};
};
Game.knockoutClubs=function(field, seed){
  const r=seeded(seed); field=field.slice(0,16);
  const strength=n=>teamStrength(n).overall;
  const play=(a,b)=>{ const ea=strength(a)/(strength(a)+strength(b));
    let sa=Math.max(0,Math.round(ea*2.7+(r()-0.5)*2.2)), sb=Math.max(0,Math.round((1-ea)*2.7+(r()-0.5)*2.2));
    let w,pens=false; if(sa===sb){pens=true;w=r()<ea?a:b} else w=sa>sb?a:b; return {a,b,sa,sb,w,pens}; };
  let round=field.slice(); const stages=['R16','QF','SF','Final']; const ko={}; let si=0;
  while(round.length>1){ const nx=[],g=[]; for(let i=0;i<round.length;i+=2){const m=play(round[i],round[i+1]);g.push(m);nx.push(m.w)} ko[stages[si++]]=g; round=nx; }
  return {champion:round[0], ko};
};
Game.simContinental=function(){
  const q=this.qualifiers();
  const contField=[...q.cont].sort((a,b)=>this.clubOf(b).ovr-this.clubOf(a).ovr).slice(0,16);
  const rest=q.cont.filter(n=>!contField.includes(n));
  const chalField=[...q.chal,...rest].slice(0,16);
  const continental=this.knockoutClubs(contField,'cont-'+this.state.seasonNum);
  const challenger=this.knockoutClubs(chalField,'chal-'+this.state.seasonNum);
  this.state.cl={continental,challenger,contField,chalField,myInCont:contField.includes(this.state.club),myInChal:chalField.includes(this.state.club)};
  if(continental.champion===this.state.club){ this.awardTrophy('Continental Cup'); this.state.budget+=120e6; }
  else if(challenger.champion===this.state.club){ this.awardTrophy('Challenger Cup'); this.state.budget+=45e6; }
  this.addNews('trophy',`${this.clubOf(continental.champion).name} are champions of the Continental Cup`,`Europe's grandest prize is settled under the lights after a dramatic knockout run.`,'');
  this.showContinentalResult();
};
Game.showContinentalResult=function(){
  const cl=this.state.cl; const cC=this.clubOf(cl.continental.champion), cH=this.clubOf(cl.challenger.champion);
  const myRun=(comp,field)=>{ if(!field.includes(this.state.club))return ''; const ko=comp.ko; let out='Group stage';
    ['R16','QF','SF','Final'].forEach(st=>{ if((ko[st]||[]).some(g=>g.a===this.state.club||g.b===this.state.club)){ const g=ko[st].find(g=>g.a===this.state.club||g.b===this.state.club); out= g.w===this.state.club?({R16:'Reached QF',QF:'Reached SF',SF:'Reached Final',Final:'CHAMPIONS'})[st]:({R16:'Out in R16',QF:'Out in QF',SF:'Out in SF',Final:'Runners-up'})[st]; } }); return out; };
  this.openModalHTML(`<div style="padding:28px">
    <div class="kicker">European Nights</div><h2 style="margin:6px 0 18px">Continental Results</h2>
    <div style="display:flex;gap:14px;align-items:center;padding:16px;border:1px solid rgba(255,211,90,.4);border-radius:14px;background:linear-gradient(120deg,rgba(255,211,90,.08),transparent);margin-bottom:12px">
      <div style="width:46px;height:52px">${crestSVG(cC,46)}</div><div><div style="font-size:11px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase">Continental Cup Winners</div><div style="font-weight:900;font-size:18px">${cC.name}</div></div>
      ${cl.myInCont?`<div style="margin-left:auto;text-align:right"><div style="font-size:10px;color:var(--dim)">YOUR RUN</div><b style="color:var(--acc)">${myRun(cl.continental,cl.contField)}</b></div>`:''}</div>
    <div style="display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2)">
      <div style="width:46px;height:52px">${crestSVG(cH,46)}</div><div><div style="font-size:11px;color:var(--acc);letter-spacing:.15em;text-transform:uppercase">Challenger Cup Winners</div><div style="font-weight:900;font-size:18px">${cH.name}</div></div>
      ${cl.myInChal?`<div style="margin-left:auto;text-align:right"><div style="font-size:10px;color:var(--dim)">YOUR RUN</div><b style="color:var(--acc)">${myRun(cl.challenger,cl.chalField)}</b></div>`:''}</div>
    <button class="btn primary" style="margin-top:20px" onclick="Game.closeModal();Game.go('career')">Continue to Summer →</button>
  </div>`);
};
Game.applyResult=function(res){
  const lg=this.leagueOf(res.home);
  const tbl=this.state.tables[lg.id];
  const H=tbl[res.home],A=tbl[res.away];
  H.P++;A.P++;H.GF+=res.gh;H.GA+=res.ga;A.GF+=res.ga;A.GA+=res.gh;
  if(res.gh>res.ga){H.W++;A.L++;H.Pts+=3;H.form.push('W');A.form.push('L')}
  else if(res.gh<res.ga){A.W++;H.L++;A.Pts+=3;A.form.push('W');H.form.push('L')}
  else{H.D++;A.D++;H.Pts++;A.Pts++;H.form.push('D');A.form.push('D')}
  const wi=this.state.weekIndex[lg.id];
  this.state.results[lg.id+':'+wi+':'+res.home]={gh:res.gh,ga:res.ga};
  this.state.playedMatches++;
  // accumulate scorer / assist stats
  const S=this.state.scorers;
  (res.scorers||[]).forEach(sc=>{
    const club=sc.team==='H'?res.home:res.away;
    if(sc.id){ (S[sc.id]=S[sc.id]||{name:sc.player,club,g:0,a:0}).g++; S[sc.id].club=club; }
    if(sc.assist){ const p=this.findByName(club,sc.assist); if(p){(S[p.id]=S[p.id]||{name:p.name,club,g:0,a:0}).a++;} }
  });
};
Game.findByName=function(club,name){return Game.squad(club).find(p=>p.name===name)};
Game.advanceWeek=function(){
  // sim all OTHER matches in the current round of user's league, and advance a round in every league
  const myLg=this.leagueOf(this.state.club);
  LEAGUES.forEach(l=>{
    const wi=this.state.weekIndex[l.id];
    const sched=this.state.schedules[l.id];
    if(wi>=sched.length)return;
    sched[wi].forEach(([h,a])=>{
      const key=l.id+':'+wi+':'+h;
      if(this.state.results[key])return; // already played (user match)
      const res=simMatch(h,a); this.applyResult(res);
    });
    this.state.weekIndex[l.id]++;
  });
};
Game.newSeason=function(){
  const myLg=this.leagueOf(this.state.club);
  const finalTable=Object.values(this.state.tables[myLg.id]).sort(this.sortTable);
  const myPos=finalTable.findIndex(t=>t.name===this.state.club)+1;
  // award league trophies
  LEAGUES.forEach(l=>{
    const champ=Object.values(this.state.tables[l.id]).sort(this.sortTable)[0];
    if(champ.name===this.state.club){ this.awardTrophy(l.name); }
  });
  // season awards (golden boot etc) from stats
  this.computeAwards();
  // player development: young players grow, old decline; boosted by minutes/form
  const r=seeded('dev-'+this.state.seasonNum);
  Game.squad(this.state.club).forEach(p=>{
    p.age++;
    let d=0;
    if(p.age<=21) d=ri(r,1,4); else if(p.age<=25) d=ri(r,0,3); else if(p.age<=29) d=ri(r,-1,1); else d=ri(r,-3,0);
    if(p.ovr<p.potential && d>0) d=Math.min(d,p.potential-p.ovr);
    p.ovr=clamp(p.ovr+d,45,99); p.dev=d;
    if(p.age<24)p.potential=clamp(p.potential+(d>2?1:0),p.ovr,99);
  });
  Game.squads[this.state.club].sort((a,b)=>b.ovr-a.ovr);
  this.state.lineup=this.buildLineup(this.state.club);
  // AI squad development for other clubs
  this.aiTransferWindow(r);
  // budget yield by result
  const c=this.clubOf(this.state.club);
  const posFactor = myPos<=1?1.0 : myPos<=4?0.75 : myPos<=8?0.5 : myPos<=14?0.32 : 0.2;
  const prize = Math.round(c.budget*posFactor + (myPos<=4?60e6:0));
  this.state.budget+=prize;
  this.state.wageBudget=Math.round(c.budget*0.6);
  // roll season
  this.state.seasonNum++; this.state.year++;
  const yr=parseInt(this.state.season.slice(0,4))+1;
  this.state.season=yr+'/'+(yr+1-2000);
  LEAGUES.forEach(l=>{this.state.tables[l.id]=initLeagueTable(l);this.state.schedules[l.id]=makeSchedule(l.clubs.map(c=>c.name));this.state.weekIndex[l.id]=0});
  this.state.results={}; this.state.scorers={}; this.state.cl=null;
  this.addNews('season',`A new season dawns for ${c.name}`,`Finished ${myPos}${ordinal(myPos)} last term. Prize money and TV revenue of ${money(prize)} boosts the war chest to ${money(this.state.budget)}.`,'');
  toast('New season: '+this.state.season+' · +'+money(prize));
  this.autosave();
  this.go('career');
};
Game.computeAwards=function(){
  const top=Object.entries(this.state.scorers).map(([id,s])=>({id,...s})).sort((a,b)=>b.g-a.g);
  const assist=[...top].sort((a,b)=>b.a-a.a);
  if(top[0]) this.state.awards.unshift({season:this.state.season,type:'Golden Boot',name:top[0].name,club:top[0].club,val:top[0].g+' goals'});
  if(assist[0]) this.state.awards.unshift({season:this.state.season,type:'Playmaker',name:assist[0].name,club:assist[0].club,val:assist[0].a+' assists'});
  // Player of the Season: best combined from a top club
  const poy=top.slice(0,20).sort((a,b)=>(b.g*2+b.a)-(a.g*2+a.a))[0];
  if(poy) this.state.awards.unshift({season:this.state.season,type:'Player of the Season',name:poy.name,club:poy.club,val:poy.g+'G '+poy.a+'A'});
};
Game.aiTransferWindow=function(r){
  // each AI club: age squad, develop youth, occasionally reshuffle ratings
  LEAGUES.forEach(l=>l.clubs.forEach(c=>{
    if(c.name===this.state.club || !Game.squads[c.name])return;
    const sq=Game.squads[c.name];
    sq.forEach(p=>{ p.age++; let d = p.age<=22?ri(r,0,3): p.age<=28?ri(r,-1,1): ri(r,-3,0); p.ovr=clamp(p.ovr+d,45,99); });
    // AI "signs" a prospect: replace weakest with a fresh player near club ovr
    if(r()<0.6){ const weak=sq.reduce((a,b)=>a.ovr<b.ovr?a:b); const np=genPlayer(c.name,weak.pos,clamp(c.ovr+ri(r,-2,4),60,90),c.nat); const i=sq.indexOf(weak); sq[i]=np; }
    sq.sort((a,b)=>b.ovr-a.ovr);
  }));
  this._pool=null;
};

Game.simWorldCup=function(){
  const r=seeded('wc-'+Math.random());
  // qualifying: seed all nations by strength, take the 32 who "qualify"
  const strength={}; NATION_KEYS.forEach(k=>strength[k]=Math.round(this.nationSquad(k).reduce((s,p)=>s+p.ovr,0)/11));
  let pool=NATION_KEYS.slice().sort((a,b)=> (strength[b]+ri(r,-3,3)) - (strength[a]+ri(r,-3,3)) );
  const field=pool.slice(0,Math.min(32,pool.length));
  // shuffle then draw into groups of 4
  for(let i=field.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[field[i],field[j]]=[field[j],field[i]]}
  const nGroups=Math.floor(field.length/4);
  const play=(a,b)=>{ const ea=strength[a]/(strength[a]+strength[b]);
    let sa=Math.max(0,Math.round(ea*2.6+(r()-0.5)*2)), sb=Math.max(0,Math.round((1-ea)*2.6+(r()-0.5)*2));
    let w,pens=false; if(sa===sb){pens=true;w=r()<ea?a:b} else w=sa>sb?a:b; return {a,b,sa,sb,w,pens}; };
  const groups=[]; const advancers=[];
  for(let g=0;g<nGroups;g++){
    const teams=field.slice(g*4,g*4+4);
    const tab={}; teams.forEach(t=>tab[t]={t,Pts:0,GD:0,GF:0});
    const fixtures=[];
    for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){ const m=play(teams[i],teams[j]); fixtures.push(m);
      tab[m.a].GF+=m.sa;tab[m.b].GF+=m.sb;tab[m.a].GD+=m.sa-m.sb;tab[m.b].GD+=m.sb-m.sa;
      if(m.sa>m.sb)tab[m.a].Pts+=3; else if(m.sb>m.sa)tab[m.b].Pts+=3; else {tab[m.a].Pts++;tab[m.b].Pts++;} }
    const rank=Object.values(tab).sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF);
    groups.push({letter:String.fromCharCode(65+g), rank, fixtures});
    advancers.push(rank[0].t, rank[1].t);
  }
  // 16-team knockout from group winners/runners-up
  let round=advancers.slice(0,16); const knockout={R16:[],QF:[],SF:[],Final:[]}; const stages=['R16','QF','SF','Final']; let si=0;
  while(round.length>1){ const nx=[],gm=[]; for(let i=0;i<round.length;i+=2){const m=play(round[i],round[i+1]);gm.push(m);nx.push(m.w)} knockout[stages[si++]]=gm; round=nx; }
  const finalG=knockout.Final[0];
  this.state.wc={champion:round[0],runnerUp:finalG.w===finalG.a?finalG.b:finalG.a,finalScore:`${finalG.sa}-${finalG.sb}${finalG.pens?' (pens)':''}`,knockout,groups,year:this.state.year||2026};
  this.addNews('international',`${natName(round[0])} are World Champions!`,`After a group stage and a gruelling knockout run, ${natName(round[0])} lift the trophy.`,'');
  toast('World Cup won by '+natName(round[0]));
  this.go('international');
};
