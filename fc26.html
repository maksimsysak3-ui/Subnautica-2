const DC_STAGES=['R32','R16','QF','SF','Final'];
const DC_NAMES=['Round of 32','Round of 16','Quarter-Final','Semi-Final','Final'];
const DC_SLOTS=[6,11,17,23,31];
Game.setupDomesticCup=function(fx,start){
  const myLg=this.leagueOf(this.state.club);
  const t1 = myLg.tier===1? myLg : LEAGUES.find(l=>l.relegateTo===myLg.id);
  const t2 = t1? LEAGUES.find(l=>l.id===t1.relegateTo) : null;
  let pool = t1? t1.clubs.map(c=>c.name) : [];
  const t2sorted = t2? t2.clubs.slice().sort((a,b)=>b.ovr-a.ovr).map(c=>c.name) : [];
  pool = pool.concat(t2sorted.slice(0,32-pool.length));
  if(!pool.includes(this.state.club)){ pool.pop(); pool.push(this.state.club); }
  const r=seeded('dc-'+this.state.seasonNum+this.state.club);
  let field=pool.slice(0,32);
  for(let i=field.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[field[i],field[j]]=[field[j],field[i]];}
  const pairs=[]; for(let i=0;i<field.length-1;i+=2)pairs.push({hk:field[i],ak:field[i+1]});
  this.state.dc={rounds:{R32:pairs,R16:[],QF:[],SF:[],Final:[]}, stage:'R32', champion:null, alive:true, history:[]};
  this.dcInjectUserFixture(fx,start);
};
Game.dcUserTie=function(){
  const dc=this.state.dc; const ties=dc.rounds[dc.stage]||[];
  return ties.findIndex(t=>!t.done && (t.hk===this.state.club||t.ak===this.state.club));
};
Game.dcInjectUserFixture=function(fx,startOverride){
  const dc=this.state.dc; const idx=this.dcUserTie();
  if(idx<0){ dc.alive=false; this.dcSimRemainder(); return; }
  const t=dc.rounds[dc.stage][idx]; const home=t.hk===this.state.club, opp=home?t.ak:t.hk;
  const stIdx=DC_STAGES.indexOf(dc.stage);
  const start = startOverride || new Date(this.state.calStart);
  const f={id:'DC'+dc.stage,date:addDays(start,14+DC_SLOTS[stIdx]*7+3).getTime(),comp:'Domestic Cup',dcStage:dc.stage,roundName:DC_NAMES[stIdx],oppName:opp,home,played:false};
  if(fx) fx.push(f); else this.addFixture(f);
};
Game.dcFinish=function(f,res){
  const dc=this.state.dc; const stage=f.dcStage; const ties=dc.rounds[stage]; const me=this.state.club;
  const idx=ties.findIndex(t=>!t.done&&(t.hk===me||t.ak===me));
  const finishRest=()=>{
    ties.forEach((t,i)=>{ if(!t.done){ const s=simMatch(t.hk,t.ak,{seed:'dcbg'+stage+i}); let w,pens=false; if(s.gh===s.ga){pens=true;w=(seeded('dcx'+stage+i+this.state.seasonNum)()<0.5)?t.hk:t.ak;} else w=s.gh>s.ga?t.hk:t.ak; Object.assign(t,{hg:s.gh,ag:s.ga,w,pens,done:true}); } });
    const winners=ties.map(t=>t.w);
    const stIdx=DC_STAGES.indexOf(stage);
    if(stage==='Final'){ dc.champion=winners[0]; dc.stage='done'; dc.alive=dc.champion===me;
      if(dc.champion===me)this.awardTrophy('Domestic Cup');
      this.addNews('trophy',`${this.clubOf(dc.champion).name} win the Domestic Cup`,`Silverware secured in a dramatic final.`,''); return; }
    const next=DC_STAGES[stIdx+1]; const nt=[]; for(let i=0;i<winners.length;i+=2)nt.push({hk:winners[i],ak:winners[i+1]});
    dc.rounds[next]=nt; dc.stage=next;
    if(winners.includes(me)){ this.dcInjectUserFixture(null); } else { dc.alive=false; this.dcSimRemainder(); }
  };
  if(idx>=0){
    const t=ties[idx];
    this.resolveKoTie(t,res.gh,res.ga,false,(w,pens)=>{
      Object.assign(t,{hg:res.gh,ag:res.ga,w,pens,done:true});
      const myG=res.home===me?res.gh:res.ga, opG=res.home===me?res.ga:res.gh;
      dc.history.push({round:DC_NAMES[DC_STAGES.indexOf(stage)],opp:f.oppName,myG,opG,win:w===me,pens});
      if(w!==me) this.addNews('match',`${this.clubOf(me).short} knocked out of the Domestic Cup`,`Cup run ends in the ${DC_NAMES[DC_STAGES.indexOf(stage)]}.`,'');
      finishRest();
    });
  } else finishRest();
};
Game.dcSimRemainder=function(){
  const dc=this.state.dc; if(!dc||dc.stage==='done')return;
  let stage=dc.stage, guard=0;
  while(stage && stage!=='done' && guard++<6){
    const ties=dc.rounds[stage];
    ties.forEach((t,i)=>{ if(!t.done){ const s=simMatch(t.hk,t.ak,{seed:'dcrem'+stage+i+this.state.seasonNum}); let w,pens=false; if(s.gh===s.ga){pens=true;w=(seeded('dcy'+stage+i+this.state.seasonNum)()<0.5)?t.hk:t.ak;} else w=s.gh>s.ga?t.hk:t.ak; Object.assign(t,{hg:s.gh,ag:s.ga,w,pens,done:true}); } });
    const winners=ties.map(t=>t.w);
    const stIdx=DC_STAGES.indexOf(stage);
    if(stage==='Final'){ dc.champion=winners[0]; dc.stage='done'; if(dc.champion===this.state.club)this.awardTrophy('Domestic Cup'); break; }
    const next=DC_STAGES[stIdx+1]; const nt=[]; for(let i=0;i<winners.length;i+=2)nt.push({hk:winners[i],ak:winners[i+1]}); dc.rounds[next]=nt; dc.stage=next; stage=next;
  }
};
Game.addFixture=function(f){ this.state.fixtures.push(f); this.state.fixtures.sort((a,b)=>a.date-b.date); };
Game.nextUserFixture=function(){ return (this.state.fixtures||[]).find(f=>!f.played); };
/* ============================================================
   LIVE MATCH ENGINE — minute-by-minute, subs, cards, ratings
   ============================================================ */
const LM_SPD={slow:170,normal:85,fast:36,instant:1};
Game.matchXI=function(name){ return this.startingXI(name); };
Game.matchBench=function(){
  const L=this.ensureLineup(); const onIds=new Set(this.LM?this.LM.xiH.concat(this.LM.xiA).map(p=>p.id):[]);
  return (L.subs||[]).map(id=>this.findPlayer(id)).filter(p=>p && !this.isUnavailable(p));
};
Game.ratingClass=function(r){ return r>=7.5?'rt-hi':r>=6?'rt-mid':'rt-lo'; };
Game.startLiveMatch=function(f){
  const me=this.state.club;
  const home=f.home?me:f.oppName, away=f.home?f.oppName:me;
  // rest recovery before kickoff
  const recov = this.state.training==='fitness'?45:32;
  Game.squad(me).forEach(p=>{ p.energy=clamp((p.energy==null?100:p.energy)+recov,0,100); });
  const xiH=this.matchXI(home), xiA=this.matchXI(away);
  const userSide=f.home?'H':'A';
  const LM=this.LM={ f, comp:f.comp, roundName:f.roundName, home, away, userSide,
    minute:0, sh:0, sa:0, xgH:0, xgA:0, shotsH:0, shotsA:0, sotH:0, sotA:0, corH:0, corA:0, possH:50,
    xiH, xiA, subsUsed:0, maxSubs:5, redH:0, redA:0, feed:[], scorers:[], pdata:{},
    mentality:this.state.mentality, paused:false, finished:false, sel:null,
    r:seeded(home+'@'+away+'|'+this.state.playedMatches+'|'+Math.floor(Math.random()*1e6)) };
  LM.wobble=0.65+LM.r()*0.7; // locked in for the match — some days the form-guide just doesn't show up
  [...xiH,...xiA].forEach(p=>{ if(p.energy==null)p.energy=100; LM.pdata[p.id]={id:p.id,name:p.name,pos:p.pos,seed:p.seed,rating:6.5,mins:0,goals:0,assists:0,yellow:0,red:false,side:xiH.includes(p)?'H':'A'}; });
  // overlay header
  const ms=$('#matchsim'); const H=this.clubOf(home),A=this.clubOf(away);
  $('#msCrestH').innerHTML=crestSVG(H,70); $('#msCrestA').innerHTML=crestSVG(A,70);
  $('#msNameH').textContent=H.short; $('#msNameA').textContent=A.short;
  $('#msComp').textContent=(f.comp==='Champions Cup'?'★ ':'')+f.comp+(f.roundName?' · '+f.roundName:'');
  $('#msScoreH').textContent='0'; $('#msScoreA').textContent='0'; $('#msBar').style.width='0'; $('#msClock').textContent="0'";
  $('#msBody').innerHTML='<div class="ms-pitch" id="msPitch"></div><div class="ms-feed" id="msFeed"></div>'; $('#msManage').classList.remove('on');
  this.renderMsPitch();
  ms.classList.remove('cc-theme','dc-theme','derby-theme','wc-theme');
  if(f.derby) ms.classList.add('derby-theme');
  else if(f.comp==='Champions Cup') ms.classList.add('cc-theme');
  else if(f.comp==='Domestic Cup') ms.classList.add('dc-theme');
  ms.classList.add('on');
  this.lmFoot();
  if(this.state.simSpeed==='instant'){ while(LM.minute<90){LM.minute++;this.lmMinute();} this.lmFullTime(); return; }
  this.lmRun();
};
Game.lmFoot=function(){
  const LM=this.LM;
  $('#msFoot').innerHTML=`<button class="btn primary" onclick="Game.lmManage()">⚙ Manage (${LM.maxSubs-LM.subsUsed} subs)</button>
    <button class="btn" onclick="Game.lmToggleSpeed()">Speed: ${this.state.simSpeed}</button>
    <button class="btn ghost" onclick="Game.lmSkip()">Skip to Result ⏭</button>`;
};
Game.lmToggleSpeed=function(){ const o=['slow','normal','fast']; const i=o.indexOf(this.state.simSpeed); this.state.simSpeed=o[(i+1)%o.length]; this.lmFoot(); if(!this.LM.paused)this.lmRun(); };
Game.lmRun=function(){
  const LM=this.LM; clearInterval(LM.iv);
  LM.iv=setInterval(()=>{
    if(LM.paused||LM.finished)return;
    LM.minute++;
    // energy drain
    [...LM.xiH,...LM.xiA].forEach(p=>{ const d=(p.posGroup==='DEF'||p.posGroup==='GK')?0.5:p.posGroup==='ATT'?0.85:0.68; p.energy=clamp(p.energy-d,0,100); if(LM.pdata[p.id])LM.pdata[p.id].mins++; });
    this.lmMinute(); this.lmUpdateUI();
    if(LM.minute>=90){ clearInterval(LM.iv); this.lmFullTime(); }
  }, LM_SPD[this.state.simSpeed]||85);
};
Game.lmStrength=function(side){
  const LM=this.LM; const xi=side==='H'?LM.xiH:LM.xiA;
  const eff=p=>p.ovr*(0.72+0.28*clamp(p.energy/100,0.35,1));
  const att=xi.filter(p=>p.posGroup==='ATT').concat(xi.filter(p=>p.posGroup==='MID').slice(0,2));
  const def=xi.filter(p=>p.posGroup==='DEF'||p.posGroup==='GK');
  const avg=a=>a.reduce((s,p)=>s+eff(p),0)/Math.max(1,a.length);
  return {atk:avg(att.length?att:xi), def:avg(def.length?def:xi), men:xi.length};
};
Game.lmMinute=function(){
  const LM=this.LM, r=LM.r;
  const H=this.lmStrength('H'), A=this.lmStrength('A');
  const trainAtk = this.state.training==='attack'?0.9: this.state.training==='defense'?-0.4:0;
  const trainDef = this.state.training==='defense'?0.9: this.state.training==='attack'?-0.4:0;
  const mentH=LM.userSide==='H'?[-1.3,-0.6,0,0.9,1.7][LM.mentality]+trainAtk:0;
  const mentA=LM.userSide==='A'?[-1.3,-0.6,0,0.9,1.7][LM.mentality]+trainAtk:0;
  const rate=(atk,defo,adv,ment,menS,menO)=>clamp(0.094+(clamp(atk-defo,-24,24)*LM.wobble+adv+ment)*0.0051,0.038,0.28)*(menS/11)*Math.min(1.4,11/Math.max(menO,7));
  let rH=rate(H.atk,A.def,3,mentH,H.men,A.men), rA=rate(A.atk,H.def,0,mentA,A.men,H.men);
  if(LM.userSide==='H') rA=clamp(rA-trainDef*0.006,0.01,0.35);
  if(LM.userSide==='A') rH=clamp(rH-trainDef*0.006,0.01,0.35);
  // possession drift toward stronger side
  const target=50+clamp((H.atk-A.atk)*1.4,-22,22); LM.possH+=(target-LM.possH)*0.06;
  if(r()<rH) this.lmChance('H',H,A);
  if(r()<rA) this.lmChance('A',A,H);
  if(!LM.paused){
    if(r()<0.0017) this.lmSetPiece('H',H,A,'penalty');
    if(!LM.paused && r()<0.0017) this.lmSetPiece('A',A,H,'penalty');
    if(!LM.paused && r()<0.0028) this.lmSetPiece('H',H,A,'freekick');
    if(!LM.paused && r()<0.0028) this.lmSetPiece('A',A,H,'freekick');
  }
  if(r()<0.013){ this.lmCard(r()<0.55?(LM.userSide==='H'?'A':'H'):(LM.userSide==='H'?'H':'A')); }
  // passive rating drift toward mean
  Object.values(LM.pdata).forEach(d=>{ d.rating += (6.5-d.rating)*0.01; });
};
Game.lmChance=function(side,S,O){
  const LM=this.LM, r=LM.r; const xi=side==='H'?LM.xiH:LM.xiA;
  if(side==='H')LM.shotsH++; else LM.shotsA++;
  const shooter=weightedScorer(r,xi);
  const xgAdd=clamp(0.06+(shooter.attrs.shooting-70)*0.004,0.02,0.35); if(side==='H')LM.xgH+=xgAdd; else LM.xgA+=xgAdd;
  const onTarget=r()<0.42; if(onTarget){ if(side==='H')LM.sotH++; else LM.sotA++; }
  let goalP=clamp(0.315+clamp(S.atk-O.def,-24,24)*0.006*LM.wobble+(shooter.attrs.shooting-72)*0.004,0.13,0.55)*(onTarget?1:0.15);
  if(this.state.training==='setpieces' && side===LM.userSide && (shooter.posGroup==='DEF'||shooter.pos==='CDM')) goalP*=1.28;
  if(r()<goalP){ // GOAL
    if(side==='H')LM.sh++; else LM.sa++;
    const assister=(r()<0.68)?weightedScorer(r,xi.filter(p=>p.id!==shooter.id)):null;
    LM.scorers.push({team:side,player:shooter.name,id:shooter.id,assist:assister?assister.name:null,min:LM.minute});
    if(LM.pdata[shooter.id]){LM.pdata[shooter.id].goals++; LM.pdata[shooter.id].rating=clamp(LM.pdata[shooter.id].rating+1.2,3,10);}
    if(assister&&LM.pdata[assister.id]){LM.pdata[assister.id].assists++; LM.pdata[assister.id].rating=clamp(LM.pdata[assister.id].rating+0.8,3,10);}
    // concede penalties to defenders/GK of the other side
    const other=side==='H'?LM.xiA:LM.xiH; other.filter(p=>p.posGroup==='DEF'||p.posGroup==='GK').forEach(p=>{ if(LM.pdata[p.id])LM.pdata[p.id].rating=clamp(LM.pdata[p.id].rating-0.18,3,10); });
    this.lmFeed('goal',side,`<b>GOAL!</b> ${shooter.name} scores for ${this.clubOf(side==='H'?LM.home:LM.away).short}${assister?` (assist ${assister.name})`:''} — ${LM.sh}–${LM.sa}`);
  } else {
    if(LM.pdata[shooter.id])LM.pdata[shooter.id].rating=clamp(LM.pdata[shooter.id].rating+0.06,3,10);
    if(r()<0.3) this.lmFeed('chance',side,`${onTarget?'Saved! ':''}${shooter.name} ${onTarget?'forces a stop':'drags it wide'} for ${this.clubOf(side==='H'?LM.home:LM.away).short}.`);
  }
};
Game.lmSetPiece=function(side,S,O,kind){
  const LM=this.LM, r=LM.r; if(LM.paused||LM.finished)return;
  const xi=side==='H'?LM.xiH:LM.xiA, oxi=side==='H'?LM.xiA:LM.xiH;
  if(side==='H')LM.shotsH++; else LM.shotsA++;
  const shooter=weightedScorer(r,xi);
  const keeper=oxi.find(p=>p.posGroup==='GK');
  const xgAdd=kind==='penalty'?0.76:0.26; if(side==='H')LM.xgH+=xgAdd; else LM.xgA+=xgAdd;
  const finalize=(scored)=>{
    if(scored){
      if(side==='H')LM.sh++; else LM.sa++;
      LM.scorers.push({team:side,player:shooter.name,id:shooter.id,assist:null,min:LM.minute});
      if(LM.pdata[shooter.id]){LM.pdata[shooter.id].goals++; LM.pdata[shooter.id].rating=clamp(LM.pdata[shooter.id].rating+1.2,3,10);}
      this.lmFeed('goal',side,`<b>${kind==='penalty'?'PENALTY SCORED!':'FREE KICK GOAL!'}</b> ${shooter.name} makes no mistake — ${LM.sh}–${LM.sa}`);
    } else {
      if(LM.pdata[shooter.id])LM.pdata[shooter.id].rating=clamp(LM.pdata[shooter.id].rating+0.06,3,10);
      this.lmFeed('chance',side,`${kind==='penalty'?'Penalty saved!':'Free kick comes to nothing.'} ${shooter.name} can't convert.`);
    }
  };
  const isUser=side===LM.userSide;
  if(isUser && this.state.simSpeed!=='instant'){
    LM.paused=true;
    const scoreLine=`${this.clubOf(LM.home).short} ${LM.sh} – ${LM.sa} ${this.clubOf(LM.away).short}`;
    this.showSetPieceMoment({kind, takerName:shooter.name, keeperName:keeper?keeper.name:'The Keeper', keeperOvr:keeper?keeper.ovr:72, shootingAttr:shooter.attrs.shooting, scoreLine},(res)=>{
      finalize(res.result==='goal');
      LM.paused=false; this.lmUpdateUI();
      if(!LM.finished && LM.minute<90) this.lmRun();
    });
  } else {
    const base=kind==='penalty'?0.76:0.30;
    const adj=((shooter.attrs.shooting-72)*0.004)-(keeper?((keeper.ovr-72)*0.003):0);
    finalize(r()<clamp(base+adj,0.12,0.9));
  }
};
Game.lmCard=function(side){
  const LM=this.LM, r=LM.r; const xi=side==='H'?LM.xiH:LM.xiA;
  const cand=xi.filter(p=>p.posGroup!=='GK'); if(!cand.length)return; const p=pick(r,cand);
  const d=LM.pdata[p.id]; if(!d)return;
  const straightRed=r()<0.08;

    d.red=true; d.rating=clamp(d.rating-1.3,3,10);
    if(side==='H'){LM.redH++; LM.xiH=LM.xiH.filter(x=>x.id!==p.id);} else {LM.redA++; LM.xiA=LM.xiA.filter(x=>x.id!==p.id);}

  } else { d.yellow++; d.rating=clamp(d.rating-0.4,3,10); this.lmFeed('yellow',side,`<span class="card-y">■</span> ${p.name} is booked.`); }
};
Game.lmFeed=function(type,side,txt){ const LM=this.LM; LM.feed.push({min:LM.minute,type,side,txt});

  const row=el('div','ms-ev'+(type==='goal'?' goal':type==='sub'?' sub':'')); row.innerHTML=`<span class="mm">${LM.minute}'</span><span class="em">${icon}</span><span class="tx">${txt}</span>`;
  fe.appendChild(row); const body=$('#msBody'); if(body)body.scrollTop=body.scrollHeight;

Game.spTakeShot=function(){
  const sel=this._spSel; if(sel.zone==null)return;
  const opts=this._spOpts||{}; const zone=SP_ZONES[sel.zone];
  const btn=$('#spTakeBtn'); if(btn)btn.disabled=true;
  document.querySelectorAll('.sp-zone').forEach(b=>b.style.pointerEvents='none');
  const ball=$('#spBall'), keeper=$('#spKeeper'), box=$('#spGoalBox');
  // keeper reads the placement correctly more often than not, otherwise dives the wrong way
  const readChance=0.55; const keeperTargetX = Math.random()<readChance? zone.x : (20+Math.random()*60);
  if(keeper){ keeper.style.left=keeperTargetX+'%'; keeper.style.top=(zone.y<40?'34%':'46%'); }
  const base=opts.kind==='freekick'?0.34:opts.kind==='penalty'?0.78:0.76;
  const shootBonus=((opts.shootingAttr||70)-70)*0.006;
  const placementAdj = zone.corner? 0.10 : (zone.id===1||zone.id===4||zone.id===7)? -0.15 : -0.03;
  const powerAdj={soft:{save:0.07,miss:0.015},firm:{save:0,miss:0.045},power:{save:-0.10,miss:0.11}}[sel.power];
  const spinBonus= sel.spin==='straight'?0:0.045;
  const spinMiss= sel.spin==='straight'?0:0.022;
  const keeperOvr=opts.keeperOvr||72;
  const keeperAdj=(72-keeperOvr)*0.005;
  const missChance=clamp(0.03+ (zone.corner?0.05:0) +powerAdj.miss+spinMiss-((opts.shootingAttr||70)-70)*0.0018,0.015,0.32);

    outcome = Math.random()<successP ? 'goal':'save';
  }
  if(ball){ ball.style.left=zone.x+'%'; ball.style.top=(outcome==='miss'?clamp(zone.y-16,2,98):zone.y)+'%'; ball.style.transform='translate(-50%,-50%) scale(.7)'; }

  const fitnessMult = this.state.training==='fitness'?0.55:1;
  xi.forEach(p=>{ const e=p.energy==null?100:p.energy; const injChance=(0.014+(e<45?0.03:0))*fitnessMult; if(Math.random()<injChance){ p.injWeeks=1+Math.floor(Math.random()*8);
    this.addNews('drama',`Injury blow: ${p.name} out for ${p.injWeeks} match${p.injWeeks>1?'es':''}`,`The ${p.pos} picked up a knock and faces a spell on the sidelines.`,'');
    this.pushMail('Medical Team',`${p.name} injured`,`${p.name} will be out for approximately ${p.injWeeks} match${p.injWeeks>1?'es':''}. We'll manage his recovery.`); } });
  const w= myG>opG?1: myG<opG?-1:0;
  const perNudge = (p)=>{ const mult=p&&p.personality==='Volatile'?1.5:p&&p.personality==='Professional'?0.65:1; return mult; };
  this.state.morale=clamp(this.state.morale+(w>0?4:w<0?-5:1),0,100);
  // individual player morale: those who played feel the result (scaled by personality); rotation-starved subs sulk a little
  xi.forEach(p=>{ if(p.morale==null)p.morale=70; const base=w>0?3:w<0?-4:0; p.morale=clamp(p.morale+base*perNudge(p),0,100); });
  Game.squad(me).forEach(p=>{ if(!xi.includes(p)){ if(p.morale==null)p.morale=70; if((this.state.apps[p.id]||0)<(this.state.playedMatches*0.2)) p.morale=clamp(p.morale-0.6*perNudge(p),0,100); } });
  if(f.comp==='League'){ this.applyResult(res); this.advanceWeek(); this.checkDeadlineDay();
    this.state.lossStreak = w<0 ? (this.state.lossStreak||0)+1 : 0;
    const streakPenalty = this.state.lossStreak>=3 ? (this.state.lossStreak-2)*2 : 0;
    const derbyMult = f.derby?1.8:1;
    if(w>0){this.state.boardConfidence=clamp(this.state.boardConfidence+2*derbyMult,0,100);this.state.fanHappiness=clamp(this.state.fanHappiness+3*derbyMult,0,100);}
    else if(w<0){this.state.boardConfidence=clamp(this.state.boardConfidence-(3+streakPenalty)*derbyMult,0,100);this.state.fanHappiness=clamp(this.state.fanHappiness-(4+streakPenalty)*derbyMult,0,100);}
    if(f.derby){ const oppShort=this.clubOf(f.oppName).short;
      if(w>0) this.addNews('match',`Derby delight! ${this.clubOf(me).short} beat ${oppShort} ${myG}-${opG}`,`Bragging rights secured in style. The fans will be talking about this one for weeks.`,'');
      else if(w<0) this.addNews('drama',`Derby disaster: ${this.clubOf(me).short} beaten ${opG}-${myG} by ${oppShort}`,`A painful day for the club. Rival fans will not let this be forgotten quickly.`,'');
      else this.addNews('match',`Derby stalemate: ${this.clubOf(me).short} ${myG}-${opG} ${oppShort}`,`Honours even in a tense local derby.`,'');
    } else if(w>0)this.addNews('match',`${this.clubOf(me).short} win ${myG}-${opG}`,`${res.scorers.filter(s=>(s.team==='H')===(res.home===me)).map(s=>s.player).join(', ')||'A solid display'} did the damage.`);
    else if(this.state.lossStreak>=3) this.addNews('drama',`Crisis club? ${this.clubOf(me).short} slump to ${this.state.lossStreak} defeats in a row`,`Pressure is mounting on the manager after a miserable run of form.`,'');
  } else if(f.comp==='Champions Cup'){ this.ccFinish(f,res); }
  else if(f.comp==='Domestic Cup'){ this.dcFinish(f,res); }
  // unhappy players may demand a transfer
  Game.squad(me).forEach(p=>{ if(p.morale<20 && Math.random()<0.05 && !(this.state.transferList||[]).includes(p.id)){
    this.state.transferList=this.state.transferList||[]; this.state.transferList.push(p.id);
    this.pushMail('Player Concerns',`${p.name} unsettled`,`${p.name} has told staff he is unhappy and would consider a move. He's been added to the transfer list.`); } });
  this.maybeGenerateDrama(); this.autosave();
  if(quick){ this.go(this.state.playerMode?'mycareer':'career'); toast(`${COMP_SHORT[f.comp]}: ${this.clubOf(me).short} ${myG}-${opG} ${this.clubOf(f.oppName).short}`);
    if(!this.state.playerMode){ if(this._deadlineDayPending){ this._deadlineDayPending=false; this.deadlineDayEvent(); } this.checkSackRisk(); }
    return; }
  const doPost=()=>{
    const cont=()=>this.afterUserFixture();
    const afterSack=()=>{ if(!this.state.playerMode && this.nextUserFixture()&&Math.random()<0.28)this.seasonDecision(cont); else cont(); };
    const afterDeadline=()=>{ if(!this.state.playerMode && this.checkSackRisk()) return; afterSack(); };
    if(!this.state.playerMode && this._deadlineDayPending){ this._deadlineDayPending=false; this.deadlineDayEvent(afterDeadline); } else afterDeadline();
  };
  if(this.state.playerMode) doPost(); else this.matchPress('post',{res:w},doPost);
};

Game.checkSackRisk=function(){
  if(this.state.playerMode) return false;
  const bc=this.state.boardConfidence;
  if(bc<=10){ this.getSacked('a catastrophic loss of faith from the boardroom after a dismal run of results'); return true; }
  if(bc<=28 && !this.state.sackWarned){
    this.state.sackWarned=true;
    this.pushMail('Club Board','Your position is under scrutiny',`Results have not met the board's expectations this season (target: ${this.state.objective}). Turn things around soon, or your position will be reviewed.`);
    toast('Board confidence is low — your job may be at risk.');
  }
  if(bc>42) this.state.sackWarned=false;
  return false;
};

  months.sort((a,b)=>a.y-b.y||a.m-b.m);
  if(this.calMonth==null){ const nf=this.nextUserFixture(); const nd=nf?new Date(nf.date):start; this.calMonth=nd.getFullYear()+'-'+nd.getMonth(); }

  const tabs=el('div','cal-months');
  months.forEach(mm=>{const b=el('button',(mm.y+'-'+mm.m===(cur.y+'-'+cur.m))?'on':'',new Date(mm.y,mm.m,1).toLocaleString('en',{month:'long'}));b.onclick=()=>{this.calMonth=mm.y+'-'+mm.m;this.go('calendar')};tabs.appendChild(b);});

  }

Game.runMatchSim=function(home,away,userMatch,opts){
  opts=opts||{};
  const res=simMatch(home,away);
  this._pendingRes=res; this._pendingUser=userMatch;
  this._onMatchFinish=opts.onFinish||null;
  const ms=$('#matchsim');
  const H=this.clubOf(home),A=this.clubOf(away);
  const crest=(c)=>c.isNation?`<div style="font-size:56px;line-height:1">${flagEmoji(c.natKey)}</div>`:crestSVG(c,70);
  $('#msCrestH').innerHTML=crest(H);
  $('#msCrestA').innerHTML=crest(A);
  $('#msNameH').textContent=H.isNation?natName(H.natKey):H.short;
  $('#msNameA').textContent=A.isNation?natName(A.natKey):A.short;
  $('#msComp').textContent=opts.comp||this.leagueOf(this.state.club).name;
  $('#msScoreH').textContent='0'; $('#msScoreA').textContent='0';
  $('#msFeed').innerHTML=''; $('#msBar').style.width='0';
  $('#msFoot').innerHTML='';
  ms.classList.remove('cc-theme','dc-theme','derby-theme','wc-theme');
  if(opts.wc) ms.classList.add('wc-theme');
  ms.classList.add('on');
  // animate
  let sh=0,sa=0,fi=0; const feed=res.feed; const feedEl=$('#msFeed');

  const speed= SPD[this.state.simSpeed]||75;
  if(this.state.simSpeed==='instant'){ this._pendingRes=res; this.skipMatch(); return; }
  let minute=0;
  clearInterval(this._matchIv);
  this._matchIv=setInterval(()=>{
    minute++;
    $('#msClock').textContent=minute+"'";
    $('#msBar').style.width=(minute/90*100)+'%';
    while(fi<feed.length && feed[fi].min<=minute){
      const e=feed[fi++];
      if(e.type==='goal'){ if(e.team==='H')sh++;else sa++; $('#msScoreH').textContent=sh; $('#msScoreA').textContent=sa; }
      const row=el('div','ms-ev'+(e.type==='goal'?' goal':''));
      const icon=e.type==='goal'?'<span style="color:var(--acc)">●</span>':e.type==='card'?'<span style="color:var(--warn)">▮</span>':'<span style="color:var(--dim2)">·</span>';

      clearInterval(this._matchIv);

      feedEl.appendChild(ft); feedEl.scrollTop=feedEl.scrollHeight;
      $('#msFoot').innerHTML=`<button class="btn primary" onclick="Game.finishMatch()">Continue →</button>`;
    }

Game.qualifiers=function(){
  const cont=[], chal=[];
  LEAGUES.forEach(l=>{ const t=Object.values(this.state.tables[l.id]).sort(this.sortTable);
    t.slice(0,4).forEach(x=>cont.push(x.name)); t.slice(4,6).forEach(x=>chal.push(x.name)); });
  return {cont, chal};
};
Game.knockoutClubs=function(field, seed){
  const r=seeded(seed); field=field.slice(0,16);
  const strength=n=>teamStrength(n).overall;
  const play=(a,b)=>{ const ea=strength(a)/(strength(a)+strength(b));
    let sa=Math.max(0,Math.round(ea*2.7+(r()-0.5)*2.2)), sb=Math.max(0,Math.round((1-ea)*2.7+(r()-0.5)*2.2));
    let w,pens=false; if(sa===sb){pens=true;w=r()<ea?a:b} else w=sa>sb?a:b; return {a,b,sa,sb,w,pens}; };
  let round=field.slice(); const stages=['R16','QF','SF','Final']; const ko={}; let si=0;
  while(round.length>1){ const nx=[],g=[]; for(let i=0;i<round.length;i+=2){const m=play(round[i],round[i+1]);g.push(m);nx.push(m.w)} ko[stages[si++]]=g; round=nx; }
  return {champion:round[0], ko};
};
Game.simContinental=function(){
  const q=this.qualifiers();
  const contField=[...q.cont].sort((a,b)=>this.clubOf(b).ovr-this.clubOf(a).ovr).slice(0,16);
  const rest=q.cont.filter(n=>!contField.includes(n));
  const chalField=[...q.chal,...rest].slice(0,16);
  const continental=this.knockoutClubs(contField,'cont-'+this.state.seasonNum);
  const challenger=this.knockoutClubs(chalField,'chal-'+this.state.seasonNum);
  this.state.cl={continental,challenger,contField,chalField,myInCont:contField.includes(this.state.club),myInChal:chalField.includes(this.state.club)};
  if(continental.champion===this.state.club){ this.awardTrophy('Continental Cup'); this.state.budget+=120e6; }
  else if(challenger.champion===this.state.club){ this.awardTrophy('Challenger Cup'); this.state.budget+=45e6; }
  this.addNews('trophy',`${this.clubOf(continental.champion).name} are champions of the Continental Cup`,`Europe's grandest prize is settled under the lights after a dramatic knockout run.`,'');

    const cand=clubs.filter(c=>c.ovr>=p.ovr-5); const buyer=pick(r,(cand.length?cand:clubs).slice(0,25));
    const bid=Math.round(p.value*((keen?0.95:0.82)+r()*0.45)/1e5)*1e5;
    bids.push({id:p.id,name:p.name,ovr:p.ovr,seed:p.seed,pos:p.pos,buyer:buyer.name,bid,listed:keen}); };
  // listed players get 1-2 keen bids each
  listed.forEach(id=>{ const p=sq.find(x=>x.id===id); if(p){ addBid(p,true); if(r()<0.5){ const c2=clubs.filter(c=>c.ovr>=p.ovr-5); if(c2.length){bids.push({id:p.id+'#2',id0:p.id,name:p.name,ovr:p.ovr,seed:p.seed,pos:p.pos,buyer:pick(r,c2.slice(0,20)).name,bid:Math.round(p.value*(0.9+r()*0.4)/1e5)*1e5,listed:true});} } } });
  const nBids=ri(r,1,3);
  for(let i=0;i<nBids;i++){ addBid(sq[ri(r,0,Math.min(7,sq.length-1))],false); }
  const jobs=[]; const myOvr=this.clubOf(this.state.club).ovr;
  if(this.state.boardConfidence>58 && r()<0.75){
    const better=clubs.filter(c=>c.ovr>=myOvr-1 && c.ovr<=myOvr+7); if(better.length){ const c=pick(r,better); jobs.push({type:'club',club:c.name,ovr:c.ovr}); } }

Game.acceptBid=function(i){

Game.maybeMidSeasonBid=function(){

Game.applyResult=function(res){
  const lg=this.leagueOf(res.home);
  const tbl=this.state.tables[lg.id];
  const H=tbl[res.home],A=tbl[res.away];
  H.P++;A.P++;H.GF+=res.gh;H.GA+=res.ga;A.GF+=res.ga;A.GA+=res.gh;
  if(res.gh>res.ga){H.W++;A.L++;H.Pts+=3;H.form.push('W');A.form.push('L')}
  else if(res.gh<res.ga){A.W++;H.L++;A.Pts+=3;A.form.push('W');H.form.push('L')}
  else{H.D++;A.D++;H.Pts++;A.Pts++;H.form.push('D');A.form.push('D')}
  const wi=this.state.weekIndex[lg.id];
  this.state.results[lg.id+':'+wi+':'+res.home]={gh:res.gh,ga:res.ga};
  this.state.playedMatches++;
  // accumulate scorer / assist stats
  const S=this.state.scorers;
  (res.scorers||[]).forEach(sc=>{
    const club=sc.team==='H'?res.home:res.away;
    if(sc.id){ (S[sc.id]=S[sc.id]||{name:sc.player,club,g:0,a:0}).g++; S[sc.id].club=club; }
    if(sc.assist){ const p=this.findByName(club,sc.assist); if(p){(S[p.id]=S[p.id]||{name:p.name,club,g:0,a:0}).a++;} }
  });
};
Game.findByName=function(club,name){return Game.squad(club).find(p=>p.name===name)};
Game.advanceWeek=function(){
  // sim all OTHER matches in the current round of user's league, and advance a round in every league
  const myLg=this.leagueOf(this.state.club);
  LEAGUES.forEach(l=>{
    const wi=this.state.weekIndex[l.id];
    const sched=this.state.schedules[l.id];
    if(wi>=sched.length)return;
    sched[wi].forEach(([h,a])=>{
      const key=l.id+':'+wi+':'+h;
      if(this.state.results[key])return; // already played (user match)
      const res=simMatch(h,a); this.applyResult(res);
    });
    this.state.weekIndex[l.id]++;
  });
  this.maybeMidSeasonBid();
};
Game.promoRelegation=function(){
  const N=3; // clubs swapped each way
  const byId={}; LEAGUES.forEach(l=>byId[l.id]=l);
  LEAGUES.filter(l=>l.tier===1 && l.relegateTo && byId[l.relegateTo]).forEach(t1=>{
    const t2=byId[t1.relegateTo];
    const t1rank=Object.values(this.state.tables[t1.id]).sort(this.sortTable).map(x=>x.name);
    const t2rank=Object.values(this.state.tables[t2.id]).sort(this.sortTable).map(x=>x.name);
    const down=t1rank.slice(-N), up=t2rank.slice(0,N);
    // move objects between the clubs arrays
    down.forEach(name=>{ const i=t1.clubs.findIndex(c=>c.name===name); if(i>=0){ const c=t1.clubs.splice(i,1)[0]; t2.clubs.push(c); this.allClubs[name].league=t2; } });
    up.forEach(name=>{ const i=t2.clubs.findIndex(c=>c.name===name); if(i>=0){ const c=t2.clubs.splice(i,1)[0]; t1.clubs.push(c); this.allClubs[name].league=t1; } });
    // user news
    if(down.includes(this.state.club)){ this.addNews('season',`Relegation heartbreak for ${this.clubOf(this.state.club).short}`,`Dropping into the ${t2.name}. A rebuild — and a promotion push — awaits.`,''); this.pushMail('Club Board','Relegation','A difficult season ends in relegation. The board expects an immediate return to the top flight.'); }
    if(up.includes(this.state.club)){ this.addNews('season',`Promotion! ${this.clubOf(this.state.club).short} go up`,`Sealing promotion to the ${t1.name}. The big time beckons.`,''); this.pushMail('Club Board','Promotion secured','Congratulations on promotion. Let\'s establish ourselves at this level.');
      this.trophyCutscene({title:'PROMOTED',subtitle:`${this.clubOf(this.state.club).name} promoted to the ${t1.name}`,crestHtml:`<div style="width:70px;height:80px;margin:0 auto">${crestSVG(this.clubOf(this.state.club),70)}</div>`}); }
  });
};
Game.newSeason=function(){
  const myLg=this.leagueOf(this.state.club);
  const finalTable=Object.values(this.state.tables[myLg.id]).sort(this.sortTable);
  const myPos=finalTable.findIndex(t=>t.name===this.state.club)+1;
  // award league trophies (top-flight only)
  LEAGUES.forEach(l=>{
    const champ=Object.values(this.state.tables[l.id]).sort(this.sortTable)[0];
    if(champ.name===this.state.club){ this.awardTrophy(l.name); }
  });
  this.promoRelegation();
  // season awards (golden boot etc) from stats
  this.computeAwards();
  // player development + retirement (applies to the whole world so values/ratings track)
  const r=seeded('dev-'+this.state.seasonNum);
  const retiredNames=[]; const expiredFree=[];
  this.returnLoans(r);
  LEAGUES.forEach(l=>l.clubs.forEach(c=>{
    const sq=Game.squad(c.name); const mine=c.name===this.state.club;
    for(let i=sq.length-1;i>=0;i--){ const p=sq[i]; p.age++;
      // retirement chance rises steeply with age
      if(p.age>=34 && r() < (p.age-33)*0.14){ if(mine)retiredNames.push(p.name); sq.splice(i,1);
        // replace with an academy prospect so squads stay full
        sq.push(genPlayer(c.name,p.pos,clamp(c.ovr+ri(r,-8,-2),58,80),c.nat)); continue; }
      let d=0;
      if(p.age<=21) d=ri(r,1,4); else if(p.age<=25) d=ri(r,0,3); else if(p.age<=28) d=ri(r,-1,1); else if(p.age<=31) d=ri(r,-2,0); else d=ri(r,-4,-1);
      if(p.ovr<p.potential && d>0) d=Math.min(d,p.potential-p.ovr);
      p.ovr=clamp(p.ovr+d,45,99); p.dev=d;
      if(p.age<24)p.potential=clamp(p.potential+(d>2?1:0),p.ovr,99);
      // value tracks rating & age: improving young players get more expensive
      const ageF=p.age<=27?1:Math.max(0.3,1-(p.age-27)*0.11);
      const ovrF=Math.pow(Math.max(1,p.ovr-58)/22,3.1);
      p.value=clamp(Math.round(ovrF*45e6*ageF/1e5)*1e5,300e3,260e6);
      // contracts: decrement; AI mostly self-renews, user's players expire onto the free market unresigned
      if(p.contractYrs==null)p.contractYrs=ri(r,1,4);
      p.contractYrs--;
      if(p.contractYrs<=0){
        if(mine){ sq.splice(i,1); expiredFree.push(p.name); p.club='Free Agent'; p.contractYrs=0; this.state.freeAgents.push(p);
          sq.push(genPlayer(c.name,p.pos,clamp(c.ovr+ri(r,-6,0),55,85),c.nat)); }
        else if(r()<0.72){ p.contractYrs=ri(r,2,4); p.wage=Math.round(p.wage*(1.03+r()*0.07)/1e3)*1e3; } // AI renews
        else { sq.splice(i,1); p.club='Free Agent'; this.state.freeAgents.push(p); sq.push(genPlayer(c.name,p.pos,clamp(c.ovr+ri(r,-6,0),55,85),c.nat)); }
      } else if(mine && p.contractYrs===1){
        this.pushMail('Contracts Dept',`${p.name}'s contract expires this season`,`${p.name} (${p.pos}, ${p.ovr}) enters the final year of his deal. Negotiate a new contract or he'll leave for free at season's end.`);
      }
    }
    sq.sort((a,b)=>b.ovr-a.ovr);
  }));
  // trim the free agent pool so it doesn't grow forever, keep the most useful
  this.state.freeAgents=this.state.freeAgents.filter(p=>p.age<=38).sort((a,b)=>b.ovr-a.ovr).slice(0,40);
  if(retiredNames.length) this.addNews('season',`${retiredNames.length} veteran${retiredNames.length>1?'s':''} retire at ${this.clubOf(this.state.club).short}`,`${retiredNames.join(', ')} hang up their boots. Time to rebuild.`,'');
  if(expiredFree.length){ this.addNews('transfer',`Contracts expire at ${this.clubOf(this.state.club).short}`,`${expiredFree.join(', ')} leave on free transfers as their deals ran down.`,'');
    this.pushMail('Contracts Dept','Players departed on free transfers',`${expiredFree.join(', ')} left the club for nothing as their contracts expired. Keep an eye on renewal dates in future.`); }
  this._natSquads={}; // rebuild national squads next time from updated players
  this.refreshAcademy(r);
  this.state.lineup=this.buildLineup(this.state.club);
  this.state.window={};
  this._pool=null;
  // AI transfer activity for other clubs
  this.aiTransferWindow(r);
  // budget yield by result
  const c=this.clubOf(this.state.club);
  const posFactor = myPos<=1?1.0 : myPos<=4?0.75 : myPos<=8?0.5 : myPos<=14?0.32 : 0.2;
  const prize = Math.round(c.budget*posFactor + (myPos<=4?60e6:0));
  this.state.budget+=prize;
  this.state.wageBudget=Math.round(c.budget*0.6);
  // roll season
  this.state.seasonNum++; this.state.year++;
  const yr=parseInt(this.state.season.slice(0,4))+1;
  this.state.season=yr+'/'+(yr+1-2000);
  const shuf=seeded('sched-'+this.state.seasonNum);
  LEAGUES.forEach(l=>{ this.state.tables[l.id]=initLeagueTable(l);
    const names=l.clubs.map(c=>c.name); for(let i=names.length-1;i>0;i--){const j=Math.floor(shuf()*(i+1));[names[i],names[j]]=[names[j],names[i]];}
    this.state.schedules[l.id]=makeSchedule(names); this.state.weekIndex[l.id]=0; });
  this.state.results={}; this.state.scorers={}; this.state.apps={}; this.state.cl=null;
  this.state.lastPos=myPos;
  this.buildUserSeason();
  this.addNews('season',`A new season dawns for ${c.name}`,`Finished ${myPos}${ordinal(myPos)} last term. Prize money and TV revenue of ${money(prize)} boosts the war chest to ${money(this.state.budget)}.`,'');
  toast('New season: '+this.state.season+' · +'+money(prize));
  this.autosave();
  this.go(this.state.playerMode?'mycareer':'career');
  if(!this.state.playerMode) this.offseasonInbox();
};
Game.computeAwards=function(){
  const top=Object.entries(this.state.scorers).map(([id,s])=>({id,...s})).sort((a,b)=>b.g-a.g);
  const assist=[...top].sort((a,b)=>b.a-a.a);
  if(top[0]) this.state.awards.unshift({season:this.state.season,type:'Golden Boot',name:top[0].name,club:top[0].club,val:top[0].g+' goals'});
  if(assist[0]) this.state.awards.unshift({season:this.state.season,type:'Playmaker',name:assist[0].name,club:assist[0].club,val:assist[0].a+' assists'});
  // Player of the Season: best combined from a top club
  const poy=top.slice(0,20).sort((a,b)=>(b.g*2+b.a)-(a.g*2+a.a))[0];
  if(poy) this.state.awards.unshift({season:this.state.season,type:'Player of the Season',name:poy.name,club:poy.club,val:poy.g+'G '+poy.a+'A'});
};
Game.aiTransferWindow=function(r){
  // Smarter AI: each club upgrades its weakest starting position toward/above its level,
  // sometimes by signing a real free agent, sometimes by buying an actual player from
  // another club (a genuine transfer, not a reskin), and otherwise via fresh recruitment.
  const allClubs=[]; LEAGUES.forEach(l=>l.clubs.forEach(c=>{ if(c.name!==this.state.club && Game.squads[c.name]) allClubs.push(c); }));
  allClubs.forEach(c=>{
    const sq=Game.squads[c.name];
    const moves = c.ovr>=85?3 : c.ovr>=80?2 : 1;
    for(let m=0;m<moves;m++){
      if(r()>0.75) continue;
      // find weakest position group among the first XI and reinforce it
      const xi=sq.slice(0,11); const byGrp={};
      xi.forEach(p=>{(byGrp[p.posGroup]=byGrp[p.posGroup]||[]).push(p);});
      let worst=null,worstAvg=999;
      Object.entries(byGrp).forEach(([g,arr])=>{const a=arr.reduce((s,p)=>s+p.ovr,0)/arr.length; if(a<worstAvg){worstAvg=a;worst=arr;}});
      const target=worst?worst.reduce((a,b)=>a.ovr<b.ovr?a:b):sq[sq.length-1];
      const roll=r();
      let signed=null;
      if(roll<0.16 && this.state.freeAgents.length){
        // sign an actual free agent whose position roughly fits
        const cand=this.state.freeAgents.filter(p=>POS_GROUP[p.pos]===POS_GROUP[target.pos] && p.ovr>=c.ovr-14);
        if(cand.length){ const pick0=pick(r,cand); const fi=this.state.freeAgents.indexOf(pick0);
          this.state.freeAgents.splice(fi,1); pick0.club=c.name; pick0.contractYrs=ri(r,2,4); signed=pick0; }
      }
      if(!signed && roll<0.34){
        // a real transfer: buy an actual player from another AI club
        const sellers=allClubs.filter(x=>x.name!==c.name && Game.squads[x.name] && Game.squads[x.name].length>16);
        if(sellers.length){ const seller=pick(r,sellers); const ssq=Game.squads[seller.name];
          const cand=ssq.slice(11).filter(p=>POS_GROUP[p.pos]===POS_GROUP[target.pos]);
          if(cand.length){ const bought=pick(r,cand); const bi=ssq.indexOf(bought);
            ssq.splice(bi,1); ssq.push(genPlayer(seller.name,bought.pos,clamp(seller.ovr+ri(r,-6,0),55,85),seller.nat)); ssq.sort((a,b)=>b.ovr-a.ovr);
            bought.club=c.name; bought.contractYrs=ri(r,2,4); signed=bought; }
        }
      }
      if(!signed) signed=genPlayer(c.name,target.pos,clamp(c.ovr+ri(r,-1,5),63,93),c.nat);
      const i=sq.indexOf(target); if(i>=0)sq[i]=signed; else sq.push(signed);
    }
    sq.sort((a,b)=>b.ovr-a.ovr);
  });
  // a few marquee poaches: strong clubs buy a gem from a weaker club (real transfer)
  const strong=allClubs.filter(c=>c.ovr>=83);
  strong.forEach(c=>{ if(r()<0.4){
    const weaker=allClubs.filter(x=>x.ovr<=c.ovr-5); if(!weaker.length)return;
    const from=pick(r,weaker); const fsq=Game.squads[from.name];
    const gem=fsq.slice(1,6)[Math.floor(r()*4)]; if(!gem)return;
    const gi=fsq.indexOf(gem); if(gi<0)return;
    fsq.splice(gi,1); fsq.push(genPlayer(from.name,gem.pos,clamp(from.ovr+ri(r,-4,1),58,84),from.nat)); fsq.sort((a,b)=>b.ovr-a.ovr);
    gem.club=c.name; gem.contractYrs=ri(r,2,4); Game.squads[c.name].push(gem); Game.squads[c.name].sort((a,b)=>b.ovr-a.ovr); Game.squads[c.name].pop();
  }});
  this._pool=null;
};
Game.awardTrophy=function(name){
  this.state.trophies[name]=(this.state.trophies[name]||0)+1;
  const isIntl = name==='World Cup' || name==='Continental Championship';
  if(isIntl){
    const k=this.state.natJob;
    this.addNews('trophy',`CHAMPIONS! ${natName(k)} win the ${name}`,`Glory on the international stage! Scenes of jubilation back home.`,'');
    toast(`${natName(k)} win the ${name}!`);
    this.trophyCutscene({title:'CHAMPIONS',subtitle:`${natName(k)} win the ${name}`,crestHtml:`<div style="font-size:64px">${flagEmoji(k)}</div>`});
    return;
  }
  const c=this.clubOf(this.state.club);
  this.addNews('trophy',`CHAMPIONS! ${c.name} win the ${name}`,`Glory! The trophy returns to the cabinet after a memorable campaign. Scenes of jubilation among the fans.`,'');
  this.state.boardConfidence=clamp(this.state.boardConfidence+15,0,100);
  this.state.fanHappiness=clamp(this.state.fanHappiness+18,0,100);
  toast('You won the '+name+'!');
  this.trophyCutscene({title:'CHAMPIONS',subtitle:`${c.name} win the ${name}`,crestHtml:`<div style="width:70px;height:80px;margin:0 auto">${crestSVG(c,70)}</div>`});
};
Game.trophyCutscene=function(opts){
  const cs=$('#cutscene'), stage=$('#cutStage');
  cs.classList.add('on');
  this._skipCut=()=>cs.classList.remove('on');
  let conf=''; for(let i=0;i<50;i++){const clr=['#ffd35a','#ffffff','#ffb648','#c6ff2e'][i%4]; conf+=`<div class="confetti" style="left:${Math.random()*100}%;background:${clr};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*1.2}s"></div>`;}

  stage.innerHTML=`${conf}${flashes}<div class="cut-trophy">

/* ---------------- STANDINGS ---------------- */
Game.sortTable=function(a,b){return b.Pts-a.Pts || (b.GF-b.GA)-(a.GF-a.GA) || b.GF-a.GF || a.name.localeCompare(b.name)};
Game.clubRank=function(name){ const lg=this.leagueOf(name); const rows=Object.values(this.state.tables[lg.id]).sort(this.sortTable); return rows.findIndex(t=>t.name===name)+1; };
/* ---------------- RIVALRIES & DERBIES ---------------- */
Game.rivalOf=function(name){
  const lg=this.leagueOf(name); if(!lg)return null;
  const idx=lg.clubs.findIndex(c=>c.name===name); if(idx<0)return null;
  const pairIdx = idx%2===0?idx+1:idx-1;
  const partner=lg.clubs[pairIdx]; return partner?partner.name:null;
};
Game.clubRankLabel=function(name){ const p=this.clubRank(name); const played=this.state.tables[this.leagueOf(name).id][name].P; return played>0?`${p}${ordinal(p)}`:'Preseason'; };

// national squad = the real players from clubs who hold that nationality, best first
Game.natEligiblePool=function(k){
  const pool=[];
  LEAGUES.forEach(l=>l.clubs.forEach(c=>{ Game.squad(c.name).forEach(p=>{ if(p.nat===k) pool.push(p); }); }));
  (this.state.freeAgents||[]).forEach(p=>{ if(p.nat===k) pool.push(p); });
  pool.sort((a,b)=>b.ovr-a.ovr);
  return pool;
};
Game.nationSquad=function(k,rebuild){
  this._natSquads=this._natSquads||{};
  const picks=this.state.natSquadPicks&&this.state.natSquadPicks[k];
  if(picks&&picks.length>=16){
    const squad=picks.map(id=>this.findPlayer(id)).filter(p=>p&&p.nat===k);
    if(squad.length>=16){
      this._natSquads[k]=squad; this._natCache=this._natCache||{}; squad.forEach(p=>this._natCache[p.id]=p);
      // prune ids that no longer resolve (retired, etc.) so the "X/23" count stays honest
      if(squad.length<picks.length) this.state.natSquadPicks[k]=squad.map(p=>p.id);
      return squad;
    }
    // fell below 16 live players — the saved picks are stale; drop them and fall through to auto-pick
    delete this.state.natSquadPicks[k];
  }
  if(this._natSquads[k]&&!rebuild)return this._natSquads[k];
  const pool=this.natEligiblePool(k);
  // guarantee positional cover: 3 GK, then best outfield
  const gks=pool.filter(p=>p.posGroup==='GK').slice(0,3);
  const out=pool.filter(p=>p.posGroup!=='GK');
  let squad=gks.concat(out).slice(0,23);
  if(squad.length<16){ const r=seeded('natfill-'+k); const posT=['GK','CB','RB','LB','CDM','CM','RW','LW','ST','CM','CB']; const need=16-squad.length;
    for(let i=0;i<need;i++){ squad.push(genPlayer('National '+natName(k),posT[i%posT.length],ri(r,70,82),k)); } }
  this._natSquads[k]=squad;
  this._natCache=this._natCache||{}; squad.forEach(p=>this._natCache[p.id]=p);
  return squad;
};
Game.natPicksFor=function(k){
  this.state.natSquadPicks=this.state.natSquadPicks||{};
  if(!this.state.natSquadPicks[k]) this.state.natSquadPicks[k]=this.nationSquad(k,true).map(p=>p.id);
  return this.state.natSquadPicks[k];
};
Game.natAddPick=function(k,id){

  picks.push(id); delete this._natSquads[k];

Game.nationXI=function(k){
  const sq=this.nationSquad(k);
  const slots=['GK','LB','CB','CB','RB','CDM','CM','CM','LW','ST','RW'];
  const used=new Set(), xi=[];
  slots.forEach(slot=>{ const grp=POS_GROUP[slot]; let best=null;
    sq.forEach(p=>{ if(used.has(p.id))return; if(POS_GROUP[p.pos]===grp&&(!best||p.ovr>best.ovr))best=p; });
    if(!best) sq.forEach(p=>{ if(used.has(p.id))return; if(!best||p.ovr>best.ovr)best=p; });
    if(best){used.add(best.id);xi.push(best);} });
  return xi;
};

  return nm;
};
Game.buildNationLineup=function(k){
  const sq=this.nationSquad(k); const slots=this.slotList();
  const used=new Set(), starters=[];
  slots.forEach(slot=>{ const grp=POS_GROUP[slot]; let best=null;
    sq.forEach(p=>{if(used.has(p.id))return;if(POS_GROUP[p.pos]===grp&&(!best||p.ovr>best.ovr))best=p;});
    if(!best)sq.forEach(p=>{if(used.has(p.id))return;if(!best||p.ovr>best.ovr)best=p;});
    if(best){used.add(best.id);starters.push(best.id);} });
  const subs=sq.filter(p=>!used.has(p.id)).map(p=>p.id);
  return {starters,subs};
};

Game.startWorldCup=function(userNat){
  this.closeModal();
  this.state.natJob=userNat;
  const r=seeded('wcT-'+this.state.seasonNum+userNat);
  const strength={}; NATION_KEYS.forEach(k=>strength[k]=this.nationXI(k).reduce((x,p)=>x+p.ovr,0)/11);
  let field=NATION_KEYS.slice().sort((a,b)=>(strength[b]+ri(r,-3,3))-(strength[a]+ri(r,-3,3))).slice(0,32);
  if(!field.includes(userNat)) field[field.length-1]=userNat;
  for(let i=field.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[field[i],field[j]]=[field[j],field[i]]}
  field.forEach(k=>this.registerNation(k));
  const groups=[];
  for(let g=0;g<8;g++){ const teams=field.slice(g*4,g*4+4);
    const table={}; teams.forEach(t=>table[t]={t,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
    const md=[[[teams[0],teams[1]],[teams[2],teams[3]]],[[teams[0],teams[2]],[teams[3],teams[1]]],[[teams[3],teams[0]],[teams[1],teams[2]]]];
    groups.push({letter:String.fromCharCode(65+g),teams,table,md,done:[false,false,false]});
  }
  const ug=groups.findIndex(g=>g.teams.includes(userNat));
  this.state.wcT={userNat,groups,userGroupIdx:ug,round:'group',matchday:0,knockout:{},koStageIdx:0,koTie:null,eliminated:false,champion:null,
    lineup:this.buildNationLineup(userNat)};
  toast('World Cup: managing '+natName(userNat));
  this.go('wc');
};

Game.wcApplyGroup=function(res){
  const wc=this.state.wcT; const g=wc.groups[wc.userGroupIdx];
  // record all matches this matchday (user's already in res); sim the rest
  g.md[wc.matchday].forEach(pair=>{
    let mr;
    if(res && ((this.natTeamName(pair[0])===res.home))) mr={hk:pair[0],ak:pair[1],hg:res.gh,ag:res.ga};
    else { const s=simMatch(this.natTeamName(pair[0]),this.natTeamName(pair[1])); mr={hk:pair[0],ak:pair[1],hg:s.gh,ag:s.ag||s.ga}; }
    this.wcGroupRow(g.table,mr);
  });
  // sim ALL other groups' matchday
  wc.groups.forEach((gr,gi)=>{ if(gi===wc.userGroupIdx)return;
    gr.md[wc.matchday].forEach(pair=>{ const s=simMatch(this.natTeamName(pair[0]),this.natTeamName(pair[1])); this.wcGroupRow(gr.table,{hk:pair[0],ak:pair[1],hg:s.gh,ag:s.ga}); });
  });
  wc.matchday++;
  if(wc.matchday>=3){ this.wcBuildKnockout(); }
  this.autosave(); this.go('wc');
};
Game.wcGroupRow=function(table,m){
  const H=table[m.hk],A=table[m.ak]; H.P++;A.P++;H.GF+=m.hg;H.GA+=m.ag;A.GF+=m.ag;A.GA+=m.hg;
  if(m.hg>m.ag){H.W++;A.L++;H.Pts+=3;} else if(m.ag>m.hg){A.W++;H.L++;A.Pts+=3;} else {H.D++;A.D++;H.Pts++;A.Pts++;}
};
Game.wcGroupRank=function(g){return Object.values(g.table).sort((x,y)=>y.Pts-x.Pts||(y.GF-y.GA)-(x.GF-x.GA)||y.GF-x.GF)};
Game.wcBuildKnockout=function(){
  const wc=this.state.wcT;
  const winners=[],runners=[];
  wc.groups.forEach(g=>{const r=this.wcGroupRank(g);winners.push(r[0].t);runners.push(r[1].t);});
  // standard cross pairing A1-B2, C1-D2 ...
  const r16=[];
  for(let i=0;i<8;i+=2){ r16.push([winners[i],runners[i+1]]); r16.push([winners[i+1],runners[i]]); }
  wc.knockout={R16:r16.map(p=>({hk:p[0],ak:p[1]})),QF:[],SF:[],Final:[]};
  wc.round='ko'; wc.koStage='R16';
  wc.eliminated=!(winners.includes(wc.userNat)||runners.includes(wc.userNat));
  this.setWcUserTie();
};

Game.koPlay=function(hk,ak,seed){ const s=simMatch(this.natTeamName(hk),this.natTeamName(ak),{seed});
  let hg=s.gh,ag=s.ga,pens=false,w; if(hg===ag){pens=true;w=(seeded(seed+'p')()<0.5)?hk:ak;} else w=hg>ag?hk:ak; return {hk,ak,hg,ag,pens,w,done:true}; };
/* ---------------- INTERACTIVE PENALTY SHOOTOUT (user's own knockout ties) ---------------- */
Game.resolveKoTie=function(t,hg,ag,isNation,cb){
  if(hg!==ag){ cb(hg>ag?t.hk:t.ak,false); return; }
  this.startPenaltyShootout({hk:t.hk,ak:t.ak,isNation},(winner)=>cb(winner,true));
};
Game.startPenaltyShootout=function(ctx,cb){
  const isNation=!!ctx.isNation, hk=ctx.hk, ak=ctx.ak;
  const shortOf=k=>isNation?natName(k):this.clubOf(k).short;
  const xiOf=k=>isNation?this.nationXI(k):this.startingXI(k);
  const userKey=isNation?this.state.natJob:this.state.club;
  const mkTakers=k=>{ const xi=(xiOf(k)||[]).filter(p=>p&&p.posGroup!=='GK'); return xi.slice().sort((a,b)=>(b.attrs.shooting)-(a.attrs.shooting)); };
  const gkOf=k=>{ const xi=xiOf(k)||[]; return xi.find(p=>p.posGroup==='GK')||null; };
  const takers={H:mkTakers(hk),A:mkTakers(ak)}, gk={H:gkOf(hk),A:gkOf(ak)};
  const tIdx={H:0,A:0}, score={H:0,A:0};
  const sp=$('#setpiece'), stage=$('#spStage');
  let kicksLeft=[]; for(let i=0;i<5;i++){kicksLeft.push('H');kicksLeft.push('A');}
  let taken=0;
  const nextTaker=(side)=>{ const arr=takers[side]; if(!arr.length)return{name:shortOf(side==='H'?hk:ak)+' player',attrs:{shooting:65}}; const t=arr[tIdx[side]%arr.length]; tIdx[side]++; return t; };
  const roundLabelFor=(n)=> n<=10? `Kick ${n} of 10` : `Sudden Death ${n-10}`;
  const showAiKick=(taker,scored,roundInfo,scoreLine,cont)=>{
    if(sp){ sp.classList.add('on'); if(stage) stage.innerHTML=`<div class="sp-wrap">
      <div class="kicker" style="color:var(--acc2)">PENALTY SHOOTOUT · ${roundInfo}</div>
      <h2 style="margin:10px 0 4px">${taker.name}</h2>
      <div class="sp-result ${scored?'goal':'miss'}" style="margin-top:6px">${scored?'⚽ GOAL':'✗ MISSED'}</div>
      <div style="color:var(--dim);margin-top:10px">${scoreLine}</div></div>`; }
    setTimeout(cont,900);
  };
  const finish=()=>{
    if(sp)sp.classList.remove('on');
    const winner=score.H===score.A?(Math.random()<0.5?hk:ak):(score.H>score.A?hk:ak);
    cb(winner,score.H,score.A);
  };
  const takeOne=(side,cont)=>{
    taken++;
    const taker=nextTaker(side);
    const defSide=side==='H'?'A':'H'; const keeper=gk[defSide];
    const takerKey=side==='H'?hk:ak;
    const isUserKick=takerKey===userKey;
    const roundInfo=roundLabelFor(taken);
    if(isUserKick && this.state.simSpeed!=='instant'){
      const scoreLine=`${shortOf(hk)} ${score.H} – ${score.A} ${shortOf(ak)}`;
      this.showSetPieceMoment({kind:'shootout',takerName:taker.name,keeperName:keeper?keeper.name:'The Keeper',keeperOvr:keeper?keeper.ovr:72,shootingAttr:(taker.attrs&&taker.attrs.shooting)||65,scoreLine,roundInfo},res=>{ if(res.result==='goal')score[side]++; cont(); });
    } else {
      const base=0.76+(((taker.attrs&&taker.attrs.shooting)||65)-70)*0.006-((keeper?keeper.ovr:72)-72)*0.004;
      const scored=Math.random()<clamp(base,0.45,0.92);
      if(scored) score[side]++;
      const scoreLine=`${shortOf(hk)} ${score.H} – ${score.A} ${shortOf(ak)}`;
      showAiKick(taker,scored,roundInfo,scoreLine,cont);
    }
  };
  const regStep=()=>{
    if(!kicksLeft.length){ if(score.H!==score.A){finish();return;} suddenStep(); return; }
    const side=kicksLeft.shift();
    takeOne(side,regStep);
  };
  const suddenStep=()=>{ takeOne('H',()=>{ takeOne('A',()=>{ if(score.H!==score.A)finish(); else suddenStep(); }); }); };
  regStep();
};
Game.wcApplyKo=function(res){
  const wc=this.state.wcT; const st=wc.koStage; const ties=wc.knockout[st];
  const finishRest=()=>{
    // sim remaining ties this stage
    ties.forEach((t,i)=>{ if(!t.done){ Object.assign(t,this.koPlay(t.hk,t.ak,'ko-'+st+i+this.state.seasonNum)); } });
    // advance stage
    const winners=ties.map(t=>t.w);
    const order=['R16','QF','SF','Final'];
    const ni=order.indexOf(st)+1;
    if(st==='Final'){ wc.champion=winners[0]; wc.round='done';
      if(wc.champion===wc.userNat){ this.awardTrophy('World Cup'); }
      this.autosave(); this.go('wc'); return;
    }
    const next=order[ni]; const nt=[]; for(let i=0;i<winners.length;i+=2)nt.push({hk:winners[i],ak:winners[i+1]});
    wc.knockout[next]=nt; wc.koStage=next;
    if(wc.eliminated){ /* stays eliminated */ } else { this.setWcUserTie(); if(wc.koTie<0)wc.eliminated=true; }
    this.autosave(); this.go('wc');
  };
  // user's tie result
  if(!wc.eliminated && wc.koTie>=0){
    const t=ties[wc.koTie];
    this.resolveKoTie(t,res.gh,res.ga,true,(w,pens)=>{ Object.assign(t,{hg:res.gh,ag:res.ga,pens,w,done:true}); finishRest(); });
  } else finishRest();
};

Game.wcPick=function(id){
  if(this._wcSel && this._wcSel!==id){ const L=this.state.wcT.lineup;
    const si=L.starters.indexOf(this._wcSel), ss=L.subs.indexOf(this._wcSel), ti=L.starters.indexOf(id), ts=L.subs.indexOf(id);
    if(si>=0&&ti>=0)[L.starters[si],L.starters[ti]]=[L.starters[ti],L.starters[si]];
    else if(si>=0&&ts>=0){L.starters[si]=id;L.subs[ts]=this._wcSel;}
    else if(ss>=0&&ti>=0){L.starters[ti]=this._wcSel;L.subs[ss]=id;}
    else if(ss>=0&&ts>=0)[L.subs[ss],L.subs[ts]]=[L.subs[ts],L.subs[ss]];
    this._wcSel=null; this.wcManageSquad(); return; }
  if(this._wcSel===id){ this._wcSel=null; this.wcManageSquad(); return; }
  this._wcSel=id; this.wcManageSquad();
};
/* ============================================================
   CONTINENTAL CHAMPIONSHIP — 16-nation group+knockout, held on the
   even years between World Cups so national managers have a real
   competition to play (not just friendlies) every other season.
   ============================================================ */
Game.startContinental=function(userNat){
  this.closeModal();
  const r=seeded('contT-'+this.state.seasonNum+userNat);
  const strength={}; NATION_KEYS.forEach(k=>strength[k]=this.nationXI(k).reduce((x,p)=>x+p.ovr,0)/11);
  let field=NATION_KEYS.slice().sort((a,b)=>(strength[b]+ri(r,-3,3))-(strength[a]+ri(r,-3,3))).slice(0,16);
  if(!field.includes(userNat)) field[field.length-1]=userNat;
  for(let i=field.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[field[i],field[j]]=[field[j],field[i]]}
  field.forEach(k=>this.registerNation(k));
  const groups=[];
  for(let g=0;g<4;g++){ const teams=field.slice(g*4,g*4+4);
    const table={}; teams.forEach(t=>table[t]={t,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0});
    const md=[[[teams[0],teams[1]],[teams[2],teams[3]]],[[teams[0],teams[2]],[teams[3],teams[1]]],[[teams[3],teams[0]],[teams[1],teams[2]]]];
    groups.push({letter:String.fromCharCode(65+g),teams,table,md,done:[false,false,false]});
  }
  const ug=groups.findIndex(g=>g.teams.includes(userNat));
  this.state.contT={userNat,groups,userGroupIdx:ug,round:'group',matchday:0,knockout:{},koTie:null,eliminated:false,champion:null,
    lineup:this.buildNationLineup(userNat)};
  toast('Continental Championship: managing '+natName(userNat));
  this.go('continental');
};

  return {home:this.natTeamName(pair[0]),away:this.natTeamName(pair[1]),hk:pair[0],ak:pair[1]};
};
Game.contApplyGroup=function(res){
  const ct=this.state.contT; const g=ct.groups[ct.userGroupIdx];
  g.md[ct.matchday].forEach(pair=>{
    let mr;
    if(res && (this.natTeamName(pair[0])===res.home)) mr={hk:pair[0],ak:pair[1],hg:res.gh,ag:res.ga};
    else { const s=simMatch(this.natTeamName(pair[0]),this.natTeamName(pair[1])); mr={hk:pair[0],ak:pair[1],hg:s.gh,ag:s.ga}; }
    this.wcGroupRow(g.table,mr);
  });
  ct.groups.forEach((gr,gi)=>{ if(gi===ct.userGroupIdx)return;
    gr.md[ct.matchday].forEach(pair=>{ const s=simMatch(this.natTeamName(pair[0]),this.natTeamName(pair[1])); this.wcGroupRow(gr.table,{hk:pair[0],ak:pair[1],hg:s.gh,ag:s.ga}); });
  });
  ct.matchday++;
  if(ct.matchday>=3){ this.contBuildKnockout(); }
  this.autosave(); this.go('continental');
};
Game.contBuildKnockout=function(){
  const ct=this.state.contT;
  const winners=[],runners=[];
  ct.groups.forEach(g=>{const r=this.wcGroupRank(g);winners.push(r[0].t);runners.push(r[1].t);});
  const qf=[]; for(let i=0;i<4;i+=2){ qf.push([winners[i],runners[i+1]]); qf.push([winners[i+1],runners[i]]); }
  ct.knockout={QF:qf.map(p=>({hk:p[0],ak:p[1]})),SF:[],Final:[]};
  ct.round='ko'; ct.koStage='QF';
  ct.eliminated=!(winners.includes(ct.userNat)||runners.includes(ct.userNat));
  this.setContUserTie();
};
Game.setContUserTie=function(){
  const ct=this.state.contT; const st=ct.koStage; const ties=ct.knockout[st]||[];
  ct.koTie=ties.findIndex(t=>!t.done && (t.hk===ct.userNat||t.ak===ct.userNat));
};

Game.simWorldCup=function(){
  const r=seeded('wc-'+Math.random());
  // qualifying: seed all nations by strength, take the 32 who "qualify"
  const strength={}; NATION_KEYS.forEach(k=>strength[k]=Math.round(this.nationXI(k).reduce((s,p)=>s+p.ovr,0)/11));
  let pool=NATION_KEYS.slice().sort((a,b)=> (strength[b]+ri(r,-3,3)) - (strength[a]+ri(r,-3,3)) );
  const field=pool.slice(0,Math.min(32,pool.length));
  // shuffle then draw into groups of 4
  for(let i=field.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[field[i],field[j]]=[field[j],field[i]]}
  const nGroups=Math.floor(field.length/4);
  const play=(a,b)=>{ const ea=strength[a]/(strength[a]+strength[b]);
    let sa=Math.max(0,Math.round(ea*2.6+(r()-0.5)*2)), sb=Math.max(0,Math.round((1-ea)*2.6+(r()-0.5)*2));
    let w,pens=false; if(sa===sb){pens=true;w=r()<ea?a:b} else w=sa>sb?a:b; return {a,b,sa,sb,w,pens}; };
  const groups=[]; const advancers=[];
  for(let g=0;g<nGroups;g++){
    const teams=field.slice(g*4,g*4+4);
    const tab={}; teams.forEach(t=>tab[t]={t,Pts:0,GD:0,GF:0});
    const fixtures=[];
    for(let i=0;i<teams.length;i++)for(let j=i+1;j<teams.length;j++){ const m=play(teams[i],teams[j]); fixtures.push(m);
      tab[m.a].GF+=m.sa;tab[m.b].GF+=m.sb;tab[m.a].GD+=m.sa-m.sb;tab[m.b].GD+=m.sb-m.sa;
      if(m.sa>m.sb)tab[m.a].Pts+=3; else if(m.sb>m.sa)tab[m.b].Pts+=3; else {tab[m.a].Pts++;tab[m.b].Pts++;} }
    const rank=Object.values(tab).sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||y.GF-x.GF);
    groups.push({letter:String.fromCharCode(65+g), rank, fixtures});
    advancers.push(rank[0].t, rank[1].t);
  }
  // 16-team knockout from group winners/runners-up
  let round=advancers.slice(0,16); const knockout={R16:[],QF:[],SF:[],Final:[]}; const stages=['R16','QF','SF','Final']; let si=0;
  while(round.length>1){ const nx=[],gm=[]; for(let i=0;i<round.length;i+=2){const m=play(round[i],round[i+1]);gm.push(m);nx.push(m.w)} knockout[stages[si++]]=gm; round=nx; }
  const finalG=knockout.Final[0];
  this.state.wc={champion:round[0],runnerUp:finalG.w===finalG.a?finalG.b:finalG.a,finalScore:`${finalG.sa}-${finalG.sb}${finalG.pens?' (pens)':''}`,knockout,groups,year:this.state.year||2026};
  this.addNews('international',`${natName(round[0])} are World Champions!`,`After a group stage and a gruelling knockout run, ${natName(round[0])} lift the trophy.`,'');
  toast('World Cup won by '+natName(round[0]));
  this.go('international');
};

/* ---------------- SAVE SYSTEM (multi-slot, gzip-compressed) ---------------- */
Game.SAVE_SLOTS=[1,2,3];
Game.slotKey=function(n){ return 'fc26save_'+n; };
Game.slotMetaKey=function(n){ return 'fc26save_'+n+'_meta'; };
// localStorage only holds a few MB per origin, and a fully-loaded game world (~120 clubs
// x 23 players) serializes to several MB — compress so three slots comfortably coexist.
Game._compress=async function(str){
  if(typeof CompressionStream==='undefined') return 'raw:'+str;
  const enc=new TextEncoder().encode(str);
  const cs=new CompressionStream('gzip');
  const writer=cs.writable.getWriter(); writer.write(enc); writer.close();
  const buf=await new Response(cs.readable).arrayBuffer();
  const bytes=new Uint8Array(buf); let bin=''; const CH=0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return 'gz:'+btoa(bin);
};
Game._decompress=async function(str){
  if(str.startsWith('raw:')) return str.slice(4);
  if(!str.startsWith('gz:')) return str; // legacy uncompressed save, pre-dates this format
  const bin=atob(str.slice(3)); const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip');
  const writer=ds.writable.getWriter(); writer.write(bytes); writer.close();
  const buf=await new Response(ds.readable).arrayBuffer();
  return new TextDecoder().decode(buf);
};
Game.migrateLegacySave=function(){
  try{
    if(localStorage.getItem('fc26save') && !localStorage.getItem(this.slotKey(1))){
      const raw=localStorage.getItem('fc26save');
      localStorage.setItem(this.slotKey(1), raw);
      try{ const data=JSON.parse(raw); const st=data.state||{};
        if(st.club){ const c=this.allClubs[st.club];
          localStorage.setItem(this.slotMetaKey(1), JSON.stringify({club:c?c.club.short:st.club, season:st.season, manager:st.manager&&st.manager.name})); }
      }catch(e){}
    }
  }catch(e){}
};
Game.slotMeta=function(n){
  this.migrateLegacySave();
  try{ const raw=localStorage.getItem(this.slotMetaKey(n)); return raw?JSON.parse(raw):null; }catch(e){ return null; }
};
Game.hasSave=function(slot){
  this.migrateLegacySave();
  if(slot) return !!localStorage.getItem(this.slotKey(slot));
  return this.SAVE_SLOTS.some(n=>!!localStorage.getItem(this.slotKey(n)));
};
Game.saveGame=function(manual, slot){
  slot=slot||this._slot||1; this._slot=slot;
  try{
    const data={state:this.state, squads:Game.squads, natSquads:this._natSquads||{}, v:3};
    const json=JSON.stringify(data);
    const meta={club:this.state.internationalOnly?('🌍 '+natName(this.state.natJob)):((this.allClubs[this.state.club]&&this.allClubs[this.state.club].club.short)||this.state.club), season:this.state.season, manager:this.state.manager&&this.state.manager.name};
    this._compress(json).then(packed=>{
      try{
        localStorage.setItem(this.slotKey(slot), packed);
        localStorage.setItem(this.slotMetaKey(slot), JSON.stringify(meta));
        if(manual){ toast('Career saved to Slot '+slot+'.'); if(this.current==='settings')this.go('settings'); }
      }catch(e){ toast('Save failed (storage full).'); }
    }).catch(()=>{ toast('Save failed.'); });
  }catch(e){ toast('Save failed.'); }
};
Game.autosave=function(){ if((this.state.club||this.state.internationalOnly) && this.state.autosave!==false) this.saveGame(false); };
Game.loadGame=function(slot){
  slot=slot||this._slot||1;
  const raw=localStorage.getItem(this.slotKey(slot)); if(!raw){toast('No save in that slot.');return}
  this._decompress(raw).then(json=>{
    try{
      const data=JSON.parse(json);
      Game.squads=data.squads||{}; this._natSquads=data.natSquads||{}; this._natCache={};
      Object.values(this._natSquads).forEach(arr=>arr.forEach(p=>this._natCache[p.id]=p));
      this.state=data.state; this._pool=null; this.manager=this.state.manager||this.manager; this._slot=slot;
      this.closeModal(); toast('Career loaded from Slot '+slot+'.'); this.go(this.state.internationalOnly?'international':'career');
    }catch(e){ toast('Load failed.'); }
  }).catch(()=>{ toast('Load failed.'); });
};
Game.deleteSlot=function(n){
  const fromSettings=this.current==='settings';
  this.confirmModal('Delete Save', `Delete the career saved in Slot ${n}? This cannot be undone.`, ()=>{
    localStorage.removeItem(this.slotKey(n));
    localStorage.removeItem(this.slotMetaKey(n));
    toast('Slot '+n+' cleared.');
    if(fromSettings)this.go('settings'); else this.openSlotPicker();
  }, ()=>{ if(!fromSettings)this.openSlotPicker(); });
};

  const rows=this.SAVE_SLOTS.map(n=>{

    return `<div class="market-row" style="grid-template-columns:1fr auto">

        <div style="color:var(--dim);font-size:12px">${m?`${m.manager?m.manager+' · ':''}${m.club} · ${m.season}`:'Empty'}</div></div>
      <div style="display:flex;gap:6px">
        ${m?`<button class="btn sm primary" onclick="Game.loadGame(${n})">Load</button><button class="btn sm ghost" style="color:var(--bad)" onclick="Game.deleteSlot(${n})">Delete</button>`:'<span style="color:var(--dim);font-size:11px">No career</span>'}
      </div></div>`;
  }).join('');
  this.openModalHTML(`<div style="padding:26px;max-width:480px">
    <div class="kicker" style="color:var(--acc2)">Save Slots</div>
    <h2 style="margin:6px 0 14px">Load a Career</h2>
    ${rows}
    <button class="btn ghost" style="margin-top:16px" onclick="Game.closeModal()">Cancel</button>
  </div>`);

Game.exportSave=function(){
  const data={state:this.state, squads:Game.squads, natSquads:this._natSquads||{}, v:2};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fc26-career.json'; a.click();
  toast('Save exported.');
};
Game.importSave=function(file){ if(!file)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result); Game.squads=data.squads||{}; this._natSquads=data.natSquads||{}; this._natCache={};
    Object.values(this._natSquads).forEach(arr=>arr.forEach(p=>this._natCache[p.id]=p));
    this.state=data.state; this._pool=null; this.manager=this.state.manager||this.manager; toast('Save imported.'); this.go(this.state.internationalOnly?'international':'career'); }catch(e){ toast('Invalid file.'); } };
  rd.readAsText(file);
};

Game.openPlayer=function(id){
  let p=this.findPlayer(id) || (this._natCache&&this._natCache[id]);
  if(!p)return;
  const a=p.attrs;
  const attrList=[['Pace',a.pace],['Shooting',a.shooting],['Passing',a.passing],['Dribbling',a.dribbling],['Defending',a.defending],['Physical',a.physical]];
  const radar=radarSVG(attrList.map(x=>x[1]),['PAC','SHO','PAS','DRI','DEF','PHY']);
  const isFree = p.club==='Free Agent';
  const isMine = p.club===this.state.club;
  const isAcademy = p.academy===true;
  const onLoanElsewhere = p.isLoan && !isMine;
  const onLoanToUs = p.isLoan && isMine;
  const canBuy = !isMine && !isFree && !onLoanElsewhere && !isAcademy;
  const rr=this.state.ratings&&this.state.ratings[p.id];
  const avgRating = rr&&rr.n? (rr.sum/rr.n).toFixed(1) : null;
  const apps = (this.state.apps&&this.state.apps[p.id]) || 0;
  const scr = this.state.scorers&&this.state.scorers[p.id];
  const statusBadges=[];
  if(this.isInjured(p)) statusBadges.push(`<span class="badge bad">Injured · ${p.injWeeks} wk${p.injWeeks>1?'s':''}</span>`);
  if(p.suspended>0) statusBadges.push(`<span class="badge bad">Suspended · ${p.suspended} match${p.suspended>1?'es':''}</span>`);
  if(onLoanToUs) statusBadges.push(`<span class="badge">On loan from ${this.clubOf(p.parentClub)?this.clubOf(p.parentClub).short:p.parentClub}</span>`);
  if(onLoanElsewhere) statusBadges.push(`<span class="badge">On loan at ${this.clubOf(p.club)?this.clubOf(p.club).short:p.club}</span>`);
  this.openModalHTML(`
    <div class="pcard-top"><div class="pcard-glow"></div>
      <div class="big-face">${faceSVG(p.seed,150)}</div>
      <div class="pcard-info">
        <div class="kicker">${isFree?'Free Agent':this.clubOf(p.club)?this.clubOf(p.club).name:p.club} · ${p.pos}</div>
        <h2>${p.name}</h2>
        <div class="row">${span(flagSVG(p.nat,22))} ${natName(p.nat)} <span>·</span> Age ${p.age} <span>·</span> ${isFree?'Free Transfer':money(p.value)} <span>·</span> ${wage(p.wage)}</div>
        <div class="row"><span class="badge gold">POT ${p.academy&&!p.scouted?this.potRange(p).join('–'):p.potential}</span> ${p.age<23?'<span class="badge good">Wonderkid</span>':''} ${p.ovr>=88?'<span class="badge gold">World Class</span>':''} ${p.trial?'<span class="badge">Unsigned Trialist</span>':''} ${statusBadges.join(' ')}</div>
        <div class="big-ovr"><div class="n">${p.ovr}</div><div class="l">OVERALL</div></div>
      </div>
    </div>
    <div class="radar-wrap"><div style="flex:none">${radar}</div>
      <div style="flex:1;min-width:220px"><div class="attr-grid" style="padding:0">
        ${attrList.map(([n,val])=>`<div class="attr"><span class="an">${n}</span><span class="av" style="color:${attrColor(val)}">${val}</span><div class="abar"><i style="width:${val}%;background:${attrColor(val)}"></i></div></div>`).join('')}
      </div></div>
    </div>
    <div class="play-style">${p.ps.map(s=>`<span class="ps ${s.plus?'plus':''}">${s.plus?' ':''}${s.name}${s.plus?'+':''}</span>`).join('')}</div>
    <div class="stat-row" style="grid-template-columns:repeat(5,1fr);padding:0 28px 6px">
      <div class="stat-box"><div class="k">This Season</div><div class="v" style="font-size:16px">${apps} apps</div></div>
      <div class="stat-box"><div class="k">Goals / Assists</div><div class="v" style="font-size:16px">${scr?scr.g:0} / ${scr?scr.a:0}</div></div>
      <div class="stat-box"><div class="k">Avg Rating</div><div class="v" style="font-size:16px;color:${avgRating?attrColor(avgRating*10):'var(--dim)'}">${avgRating||'—'}</div></div>
      <div class="stat-box"><div class="k">Contract</div><div class="v" style="font-size:16px">${p.contractYrs!=null?p.contractYrs+' yr'+(p.contractYrs===1?'':'s'):'—'}</div></div>
      <div class="stat-box"><div class="k">Personality</div><div class="v" style="font-size:14px">${p.personality||'—'}</div></div>
    </div>
    <div style="padding:6px 28px 6px">
      <div class="meters">
        ${meter('Morale',p.morale!=null?p.morale:70,(p.morale||70)>=60?'var(--good)':(p.morale||70)>=35?'var(--warn)':'var(--bad)')}
        ${meter('Energy',p.energy!=null?p.energy:100,(p.energy||100)>=55?'var(--good)':(p.energy||100)>=30?'var(--warn)':'var(--bad)')}
      </div>
    </div>
    <div style="display:flex;gap:10px;padding:16px 28px 28px;flex-wrap:wrap">
      ${isFree?`<button class="btn primary" onclick='Game.signFreeAgent("${p.id}")'>Sign on a Free</button>`
       :onLoanElsewhere?`<span class="badge" style="padding:10px 16px">Out on loan — not for permanent sale</span>`
       :isAcademy&&p.trial?`<span class="badge" style="padding:10px 16px">Unsigned Trialist</span><button class="btn primary" onclick='Game.closeModal();Game.signTrialist("${p.id}")'>Sign to Academy</button>${p.scouted?'':`<button class="btn" onclick='Game.scoutProspect("${p.id}");Game.openPlayer("${p.id}")'>Scout — ${money(this.scoutCost(p))}</button>`}`
       :isAcademy?`<span class="badge good" style="padding:10px 16px">Academy Prospect</span><button class="btn primary" onclick='Game.closeModal();Game.promoteYouth("${p.id}")'>Promote to First Team</button>${p.scouted?'':`<button class="btn" onclick='Game.scoutProspect("${p.id}");Game.openPlayer("${p.id}")'>Scout — ${money(this.scoutCost(p))}</button>`}`
       :canBuy?`<button class="btn primary" onclick='Game.negotiate("${p.id}")'>Make an Offer — ${money(p.value)}</button>`
       :onLoanToUs?`<span class="badge good" style="padding:10px 16px">On Loan Squad Member</span>`
       :`<span class="badge good" style="padding:10px 16px">Your Player</span>
         <button class="btn" style="color:var(--acc)" onclick='Game.offerResign("${p.id}")'>Offer New Contract</button>
         <button class="btn" style="color:var(--acc2)" onclick='Game.loanOut("${p.id}")'>Loan Out</button>
         ${(this.state.transferList||[]).includes(p.id)?`<button class="btn" style="color:var(--gold);border-color:rgba(255,211,90,.4)" onclick='Game.toggleTransferList("${p.id}")'>On Transfer List ✕</button>`:`<button class="btn" onclick='Game.toggleTransferList("${p.id}")'>List for Transfer</button>`}
         <button class="btn" style="color:var(--bad);border-color:rgba(255,93,108,.4)" onclick='Game.sellPlayer("${p.id}")'>Sell Now</button>`}
      <button class="btn ghost" onclick="Game.closeModal()">Close</button>
    </div>`);
};
function radarSVG(vals, labels){
  const cx=110,cy=110,R=80,N=vals.length;
  function pt(i,r){const ang=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]}
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{let pts='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*f);pts+=x+','+y+' '}rings+=`<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`});
  let spokes='';for(let i=0;i<N;i++){const[x,y]=pt(i,R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`}
  let poly='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*(vals[i]/99));poly+=x+','+y+' '}
  let dots='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*(vals[i]/99));dots+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--acc)"/>`}
  let labs='';for(let i=0;i<N;i++){const[x,y]=pt(i,R+16);labs+=`<text x="${x}" y="${y+3}" text-anchor="middle" class="radar-lbl">${labels[i]}</text>`}
  return `<svg viewBox="0 0 220 220" width="220" height="220">${rings}${spokes}<polygon points="${poly}" fill="rgba(198,255,46,.18)" stroke="var(--acc)" stroke-width="2"/>${dots}${labs}</svg>`;
}
Game.openModalHTML=function(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('on')};
Game.closeModal=function(){$('#modalBack').classList.remove('on')};
Game.confirmModal=function(title,body,onYes,onNo){
  this._confirmYes=()=>{ this.closeModal(); onYes(); };
  this._confirmNo=()=>{ this.closeModal(); if(onNo)onNo(); };
  this.openModalHTML(`<div style="padding:28px;max-width:420px;text-align:center">
    <div class="kicker" style="color:var(--bad)">${title}</div>
    <p style="color:var(--dim);font-size:13.5px;margin:12px 0 22px">${body}</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn primary" style="background:var(--bad)" onclick="Game._confirmYes()">Yes, Continue</button>
      <button class="btn ghost" onclick="Game._confirmNo()">Cancel</button>
    </div>
  </div>`);
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')Game.closeModal()});
</script>
</body>
</html>
