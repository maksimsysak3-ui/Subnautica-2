      {tone:'bold',t:"We're here to win. Every trophy is the target this year.",m:{fans:6,board:1},r:"The fans love the ambition — the pressure is on now."},
      {tone:'fiery',t:"Ask the other clubs if they're worried. They should be.",m:{fans:8,board:-3},r:"A viral soundbite — thrilling for fans, less so for the boardroom."}]},
  {who:'BBC Sport',q:"Some fans are frustrated with recent results. Your response?",
   a:[{tone:'calm',t:"I understand the frustration. We're working hard to turn it around.",m:{fans:3,board:2},r:"A measured answer that buys you goodwill."},
      {tone:'bold',t:"Judge us at the end of the season, not week to week.",m:{board:3,fans:-2},r:"The board backs your long-term vision."},
      {tone:'fiery',t:"If they think they can do better, the door's open.",m:{fans:-6,board:-2},r:"That won't go down well with the supporters."}]},
  {who:'The Athletic',q:"Rumours link your star man with a big-money move abroad. True?",
   a:[{tone:'calm',t:"He's happy here. There's nothing in those stories.",m:{fans:4,morale:3},r:"You've calmed the speculation for now."},
      {tone:'bold',t:"He's not for sale at any price. End of story.",m:{fans:6,morale:4},r:"A powerful message of intent to rivals."},
      {tone:'fiery',t:"Every player has a price if the offer is stupid enough.",m:{fans:-4,morale:-5},r:"That comment might unsettle the dressing room."}]},
  {who:'Local Press',q:"How do you assess the tactical shift you've made recently?",
   a:[{tone:'calm',t:"It's about balance. We've become harder to beat.",m:{board:2},r:"Analysts nod along approvingly."},
      {tone:'bold',t:"We want to entertain. Attack is the best form of defence.",m:{fans:5},r:"The fans are excited by the philosophy."},
      {tone:'fiery',t:"I don't explain my tactics to the press.",m:{board:-3,fans:-1},r:"A frosty exchange in the press room."}]},
];
Game.renderPresser=function(v){
  this.setCrumbs('Media','Press Conference');
  const idx=this.presserIdx||0; const p=PRESSERS[idx%PRESSERS.length];
  const r=seeded('rep-'+idx);
  v.innerHTML=`<div class="view-head"><div><div class="kicker">Media Duties</div><h2>Press Conference</h2><div class="sub">Your words shape morale, fan sentiment and the board's patience.</div></div></div>`;
  const wrap=el('div','presser');
  const meters=el('div','card card-pad'); meters.style.marginBottom='18px';
  meters.innerHTML=`<div class="meters">${meter('Board Confidence',this.state.boardConfidence,'var(--acc2)')}${meter('Squad Morale',this.state.morale,'var(--acc)')}${meter('Fan Happiness',this.state.fanHappiness,'var(--gold)')}</div>`;
  wrap.appendChild(meters);
  const q=el('div','q-bubble');
  q.innerHTML=`<div class="rep">${faceSVG('reporter'+idx,44)}</div><div><div class="who">${p.who}</div><div class="q">${p.q}</div></div>`;
  wrap.appendChild(q);
  const ans=el('div','answers');
  p.a.forEach((a,i)=>{
    const b=el('button','answer');
    b.innerHTML=`<span class="tone tone-${a.tone}">${a.tone}</span><span>${a.t}</span>`;
    b.onclick=()=>this.answerPress(idx,i);
    ans.appendChild(b);
  });
  wrap.appendChild(ans);
  const react=el('div','reaction'); react.id='pressReact';
  wrap.appendChild(react);
  v.appendChild(wrap);
};
Game.answerPress=function(idx,ai){
  const p=PRESSERS[idx%PRESSERS.length]; const a=p.a[ai];
  const m=a.m;
  if(m.board)this.state.boardConfidence=clamp(this.state.boardConfidence+m.board,0,100);
  if(m.fans)this.state.fanHappiness=clamp(this.state.fanHappiness+m.fans,0,100);
  if(m.morale)this.state.morale=clamp(this.state.morale+m.morale,0,100);
  const react=$('#pressReact');
  react.innerHTML=`<div style="display:flex;gap:12px;align-items:center"><div style="color:var(--acc);flex:none">${ic(ICONS.press,24)}</div><div><b>${a.r}</b><div style="color:var(--dim);font-size:12px;margin-top:6px">${Object.entries(m).map(([k,val])=>`<span class="badge ${val>0?'good':'bad'}" style="margin-right:6px">${{board:'Board',fans:'Fans',morale:'Morale'}[k]} ${val>0?'+':''}${val}</span>`).join('')}</div></div>
    <button class="btn primary sm" style="margin-left:auto" onclick="Game.nextPresser()">Next Question →</button></div>`;
  react.classList.add('show');
  document.querySelectorAll('.answer').forEach(x=>x.style.pointerEvents='none');
};
Game.nextPresser=function(){this.presserIdx=(this.presserIdx||0)+1;this.go('presser')};

/* ---------------- STATS & AWARDS ---------------- */
Game.renderStats=function(v){
  this.setCrumbs('Competitions','Stats & Awards');
  const tab=this.statsTab||'scorers';
  v.innerHTML=`<div class="view-head"><div><div class="kicker">Season ${this.state.season}</div><h2>Stats & Awards</h2><div class="sub">Golden Boot race, playmakers and end-of-season honours.</div></div>
    <div class="seg">${[['scorers','Top Scorers'],['assists','Assists'],['awards','Awards']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="Game.setStatsTab('${t[0]}')">${t[1]}</button>`).join('')}</div></div>`;
  const arr=Object.entries(this.state.scorers).map(([id,s])=>({id,...s}));
  const card=el('div','card card-pad');
  if(tab==='awards'){
    card.innerHTML=this.state.awards.length? `<table class="tbl"><thead><tr><th>Season</th><th>Award</th><th>Player</th><th>Club</th><th>Return</th></tr></thead><tbody>
      ${this.state.awards.map(a=>`<tr><td>${a.season}</td><td><b style="color:var(--gold)">${a.type}</b></td><td>${a.name}</td><td>${this.clubOf(a.club)?this.clubOf(a.club).short:a.club}</td><td>${a.val}</td></tr>`).join('')}</tbody></table>`
      : '<div class="empty">Awards are handed out at the end of each season. Play a full campaign to see the winners.</div>';
  } else {
    const key=tab==='assists'?'a':'g';
    const list=arr.filter(x=>x[key]>0).sort((a,b)=>b[key]-a[key]).slice(0,25);
    card.innerHTML=list.length? `<table class="tbl"><thead><tr><th class="pos">#</th><th>Player</th><th>Club</th><th class="n">${tab==='assists'?'Assists':'Goals'}</th></tr></thead><tbody>
      ${list.map((p,i)=>{const c=this.clubOf(p.club);const me=p.club===this.state.club;return `<tr class="${me?'me':''}"><td class="pos">${i+1}</td>
        <td class="cl" style="cursor:pointer" onclick='Game.openPlayer("${p.id}")'>${p.name}</td>
        <td><div class="cl"><span class="mini-crest">${crestSVG(c,20)}</span>${c.short}</div></td>
        <td class="n"><b>${p[key]}</b></td></tr>`}).join('')}</tbody></table>`
      : '<div class="empty">No goals recorded yet. Play some matches to build the charts.</div>';
  }
  v.appendChild(card);
};
Game.setStatsTab=function(t){this.statsTab=t;this.go('stats')};

/* ---------------- SETTINGS ---------------- */
Game.renderSettings=function(v){
  this.setCrumbs('Settings');
  const s=this.state;
  const hasSave=!!localStorage.getItem('fc26save');
  const speeds=[['slow','Slow'],['normal','Normal'],['fast','Fast'],['instant','Instant']];
  v.innerHTML=`<div class="view-head"><div><div class="kicker">Configuration</div><h2>Settings</h2><div class="sub">Save your career, tune match simulation and manage your game.</div></div></div>`;
  const grid=el('div','grid'); grid.style.gridTemplateColumns='1fr 1fr';
  const sim=el('div','card card-pad');
  sim.innerHTML=`<h4 style="margin-bottom:14px">Match Simulation</h4>
    <div style="color:var(--dim);font-size:12.5px;margin-bottom:10px">How fast matches play out minute-by-minute.</div>
    <div class="seg">${speeds.map(sp=>`<button class="${(s.simSpeed||'normal')===sp[0]?'on':''}" onclick="Game.setSimSpeed('${sp[0]}')">${sp[1]}</button>`).join('')}</div>
    <div class="divider"></div>
    <h4 style="margin-bottom:10px">Autosave</h4>
    <label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dim)"><input type="checkbox" id="autosaveChk" ${s.autosave!==false?'checked':''} onchange="Game.state.autosave=this.checked;Game.toastMsg('Autosave '+(this.checked?'on':'off'))"> Save automatically after each match & season</label>`;
  grid.appendChild(sim);
  const save=el('div','card card-pad');
  save.innerHTML=`<h4 style="margin-bottom:14px">Save & Load</h4>
    <div style="color:var(--dim);font-size:12.5px;margin-bottom:14px">Your career is stored in this browser. ${hasSave?'<span style="color:var(--good)">A save exists.</span>':'No save yet.'}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn primary" onclick="Game.saveGame(true)">Save Career</button>
      <button class="btn" ${hasSave?'':'style="opacity:.4;pointer-events:none"'} onclick="Game.loadGame()">Load Career</button>
      <button class="btn ghost" onclick="Game.exportSave()">Export to File</button>
      <button class="btn ghost" onclick="document.getElementById('importSave').click()">Import File</button>
      <input type="file" id="importSave" accept=".json" style="display:none" onchange="Game.importSave(this.files[0])">
    </div>
    <div class="divider"></div>
    <button class="btn ghost" style="color:var(--bad);border-color:rgba(255,93,108,.4)" onclick="if(confirm('Abandon this career and return to the main menu?')){Game.state={};localStorage.removeItem('fc26save');Game.go('hub')}">Abandon Career</button>`;
  grid.appendChild(save);
  v.appendChild(grid);
  const info=el('div','card card-pad'); info.style.marginTop='16px';
  info.innerHTML=`<h4 style="margin-bottom:12px">Career Summary</h4><div class="stat-row">
    <div class="stat-box"><div class="k">Club</div><div class="v" style="font-size:18px">${this.clubOf(s.club).short}</div></div>
    <div class="stat-box"><div class="k">Season</div><div class="v" style="font-size:18px">${s.season}</div></div>
    <div class="stat-box"><div class="k">Matches</div><div class="v">${s.playedMatches}</div></div>
    <div class="stat-box"><div class="k">Trophies</div><div class="v">${Object.values(s.trophies).reduce((a,b)=>a+b,0)}</div></div>
  </div>`;
  v.appendChild(info);
};
Game.setSimSpeed=function(sp){this.state.simSpeed=sp;this.go('settings');toast('Match speed: '+sp)};
Game.toastMsg=function(m){toast(m)};

/* ---------------- SAVE SYSTEM ---------------- */
Game.saveGame=function(manual){
  try{
    const data={state:this.state, squads:Game.squads, natSquads:this._natSquads||{}, v:2};
    localStorage.setItem('fc26save', JSON.stringify(data));
    if(manual)toast('Career saved.');
  }catch(e){ toast('Save failed (storage full).'); }
};
Game.autosave=function(){ if(this.state.club && this.state.autosave!==false) this.saveGame(false); };
Game.hasSave=function(){ try{return !!localStorage.getItem('fc26save')}catch(e){return false} };
Game.loadGame=function(){
  try{
    const raw=localStorage.getItem('fc26save'); if(!raw){toast('No save found.');return}
    const data=JSON.parse(raw);
    Game.squads=data.squads||{}; this._natSquads=data.natSquads||{}; this._natCache={};
    Object.values(this._natSquads).forEach(arr=>arr.forEach(p=>this._natCache[p.id]=p));
    this.state=data.state; this._pool=null;
    toast('Career loaded.'); this.go('career');
  }catch(e){ toast('Load failed.'); }
};
Game.exportSave=function(){
  const data={state:this.state, squads:Game.squads, natSquads:this._natSquads||{}, v:2};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='fc26-career.json'; a.click();
  toast('Save exported.');
};
Game.importSave=function(file){ if(!file)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result); Game.squads=data.squads||{}; this._natSquads=data.natSquads||{}; this._natCache={};
    Object.values(this._natSquads).forEach(arr=>arr.forEach(p=>this._natCache[p.id]=p));
    this.state=data.state; this._pool=null; toast('Save imported.'); this.go('career'); }catch(e){ toast('Invalid file.'); } };
  rd.readAsText(file);
};

/* ============================================================
   PLAYER MODAL (full card w/ radar)
   ============================================================ */
Game.openPlayer=function(id){
  let p=this.findPlayer(id) || (this._natCache&&this._natCache[id]);
  if(!p)return;
  const a=p.attrs;
  const attrList=[['Pace',a.pace],['Shooting',a.shooting],['Passing',a.passing],['Dribbling',a.dribbling],['Defending',a.defending],['Physical',a.physical]];
  const radar=radarSVG(attrList.map(x=>x[1]),['PAC','SHO','PAS','DRI','DEF','PHY']);
  const canBuy = p.club!==this.state.club;
  this.openModalHTML(`
    <div class="pcard-top"><div class="pcard-glow"></div>
      <div class="big-face">${faceSVG(p.seed,150)}</div>
      <div class="pcard-info">
        <div class="kicker">${this.clubOf(p.club)?this.clubOf(p.club).name:p.club} · ${p.pos}</div>
        <h2>${p.name}</h2>
        <div class="row">${span(flagSVG(p.nat,22))} ${natName(p.nat)} <span>·</span> Age ${p.age} <span>·</span> ${money(p.value)} <span>·</span> ${wage(p.wage)}</div>
        <div class="row"><span class="badge gold">POT ${p.potential}</span> ${p.age<23?'<span class="badge good">Wonderkid</span>':''} ${p.ovr>=88?'<span class="badge gold">World Class</span>':''}</div>
        <div class="big-ovr"><div class="n">${p.ovr}</div><div class="l">OVERALL</div></div>
      </div>
    </div>
    <div class="radar-wrap"><div style="flex:none">${radar}</div>
      <div style="flex:1;min-width:220px"><div class="attr-grid" style="padding:0">
        ${attrList.map(([n,val])=>`<div class="attr"><span class="an">${n}</span><span class="av" style="color:${attrColor(val)}">${val}</span><div class="abar"><i style="width:${val}%;background:${attrColor(val)}"></i></div></div>`).join('')}
      </div></div>
    </div>
    <div class="play-style">${p.ps.map(s=>`<span class="ps ${s.plus?'plus':''}">${s.plus?' ':''}${s.name}${s.plus?'+':''}</span>`).join('')}</div>
    <div style="display:flex;gap:10px;padding:0 28px 28px">
      ${canBuy?`<button class="btn primary" onclick='Game.negotiate("${p.id}")'>Make an Offer — ${money(p.value)}</button>`
        :`<span class="badge good" style="padding:10px 16px">Your Player</span><button class="btn" style="color:var(--bad);border-color:rgba(255,93,108,.4)" onclick='Game.sellPlayer("${p.id}")'>Sell / Offload</button>`}
      <button class="btn ghost" onclick="Game.closeModal()">Close</button>
    </div>`);
};
function radarSVG(vals, labels){
  const cx=110,cy=110,R=80,N=vals.length;
  function pt(i,r){const ang=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(ang)*r, cy+Math.sin(ang)*r]}
  let rings='';
  [0.25,0.5,0.75,1].forEach(f=>{let pts='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*f);pts+=x+','+y+' '}rings+=`<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`});
  let spokes='';for(let i=0;i<N;i++){const[x,y]=pt(i,R);spokes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.08)"/>`}
  let poly='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*(vals[i]/99));poly+=x+','+y+' '}
  let dots='';for(let i=0;i<N;i++){const[x,y]=pt(i,R*(vals[i]/99));dots+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--acc)"/>`}
  let labs='';for(let i=0;i<N;i++){const[x,y]=pt(i,R+16);labs+=`<text x="${x}" y="${y+3}" text-anchor="middle" class="radar-lbl">${labels[i]}</text>`}
  return `<svg viewBox="0 0 220 220" width="220" height="220">${rings}${spokes}<polygon points="${poly}" fill="rgba(198,255,46,.18)" stroke="var(--acc)" stroke-width="2"/>${dots}${labs}</svg>`;
}
Game.openModalHTML=function(html){$('#modal').innerHTML=html;$('#modalBack').classList.add('on')};
Game.closeModal=function(){$('#modalBack').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')Game.closeModal()});
</script>
