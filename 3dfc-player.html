<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D FC Player</title>
<style>
  :root {
    --bg0: #3a3d45; --bg1: #1d1e23; --bg2: #121317;
    --panel: rgba(22, 24, 30, 0.72); --line: rgba(255,255,255,0.09);
    --text: #e9ebf1; --muted: #9298a6; --accent: #4f6bff; --accent2: #2b3c9e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 80% 70% at 50% 42%, var(--bg0) 0%, var(--bg1) 55%, var(--bg2) 100%);
    color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background 0.6s;
    -webkit-user-select: none; user-select: none;
  }
  body.pitch { --bg0: #24402c; --bg1: #12201a; --bg2: #090f0c; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .brand { position: fixed; top: 18px; left: 20px; pointer-events: none; }
  .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.06em; font-weight: 800; }
  .brand h1 span { color: var(--accent); }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

  .hint { position: fixed; top: 20px; right: 20px; color: var(--muted); font-size: 12px; text-align: right; pointer-events: none; }
  .hint kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--text); }

  .dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: center;
    padding: 10px 14px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }
  .group { display: flex; align-items: center; gap: 6px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-right: 2px; }
  .seg { display: flex; background: rgba(255,255,255,0.05); border-radius: 9px; padding: 2px; }
  button {
    font: inherit; color: var(--text); background: transparent; border: 0; cursor: pointer;
    padding: 6px 10px; border-radius: 7px; white-space: nowrap; transition: background 0.15s, color 0.15s;
  }
  button:hover { background: rgba(255,255,255,0.08); }
  button[aria-pressed="true"] { background: var(--accent2); color: #fff; }
  .toggle { border: 1px solid var(--line); }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  .speedval { color: var(--muted); font-size: 11px; width: 42px; }
  .sep { width: 1px; height: 24px; background: var(--line); }

  #err { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

  @media (max-width: 720px) {
    .hint { display: none; }
    .brand { top: 12px; left: 16px; }
    .dock { bottom: 10px; gap: 8px 10px; padding: 8px 10px; }
    .sep { display: none; }
    button { padding: 6px 8px; }
    input[type=range] { width: 90px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="brand">
  <h1>3D <span>FC</span></h1>
  <p>Player model · No. 10</p>
</div>
<div class="hint">Drag to orbit · scroll to zoom<br><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> mode · <kbd>Space</kbd> pause · <kbd>W</kbd> wireframe</div>

<div class="dock" role="toolbar" aria-label="Viewer controls">
  <div class="group">
    <span class="label">Mode</span>
    <div class="seg" data-group="mode">
      <button data-v="run" aria-pressed="true">Run</button>
      <button data-v="idle" aria-pressed="false">Idle</button>
      <button data-v="ref" aria-pressed="false">A-Pose</button>
    </div>
  </div>

    <span class="label">Pace</span>
    <input id="speed" type="range" min="0" max="1" step="0.01" value="0.35" aria-label="Running pace">
    <span class="speedval" id="speedval">Jog</span>
  </div>
  <div class="sep"></div>
  <div class="group">
    <span class="label">View</span>

      <button data-v="back" aria-pressed="false">Back</button>
      <button data-v="face" aria-pressed="false">Face</button>
      <button data-v="tv" aria-pressed="false">TV</button>
      <button data-v="goal" aria-pressed="false">Goal</button>
      <button data-v="stadium" aria-pressed="false">Pitch</button>
    </div>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="toggle" id="t-slow" aria-pressed="false">Slow-mo</button>
    <button class="toggle" id="t-pause" aria-pressed="false">Pause</button>
    <button class="toggle" id="t-wire" aria-pressed="false">Wireframe</button>
    <button class="toggle" id="t-spin" aria-pressed="false">Turntable</button>
    <button class="toggle" id="t-hq" aria-pressed="true" title="Ambient occlusion, bloom, colour grade">HQ</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

window.__fcBooted = true;

/* =====================================================================
   0. Small helpers
   ===================================================================== */
const DEG = Math.PI / 180;
const TAU = Math.PI * 2;
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));

// Deterministic per-position noise: identical positions (shared seams) get identical jitter,
// so faceting irregularity never opens cracks in the mesh.
function hash3(x, y, z) {
  let s = (Math.round(x * 4000) * 73856093) ^ (Math.round(y * 4000) * 19349663) ^ (Math.round(z * 4000) * 83492791);
  const r = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1; };
  return [r(), r(), r()];
}
function mulberry(a) { return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function jitter(geo, amount) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const [a, b, c] = hash3(p.getX(i), p.getY(i), p.getZ(i));
    p.setXYZ(i, p.getX(i) + a * amount, p.getY(i) + b * amount, p.getZ(i) + c * amount);
  }
  return geo;
}

/* =====================================================================
   1. Palette (sampled from the reference sheet)
   ===================================================================== */
const HEX = {
  skin: '#d99b6c', skinShade: '#c4835a', hair: '#4e2f1e', brow: '#2c1a11',
  jersey: '#2b3c9e', trim: '#1a2466', shorts: '#26368f',
  white: '#f1f1ee', sock: '#ecece8', navyBand: '#24348c',
  shoe: '#f3f3f1', sole: '#26272b', stud: '#3a3b40', shoeStripe: '#3a3d47',
  eye: '#141210', sclera: '#f4f1ec', mouth: '#7a3f30', lip: '#c27c62',
};
const COL = Object.fromEntries(Object.entries(HEX).map(([k, v]) => [k, new THREE.Color(v)]));

/* =====================================================================
   2. Skeleton (bind pose = the reference A-pose; all bind rotations are identity)
   ===================================================================== */
const ARM_ANGLE = 17 * DEG;                       // A-pose abduction from vertical
const ARM_DIR = { L: V3(Math.sin(ARM_ANGLE), -Math.cos(ARM_ANGLE), 0), R: V3(-Math.sin(ARM_ANGLE), -Math.cos(ARM_ANGLE), 0) };
// Elbow hinge axis: perpendicular to the arm inside the frontal plane, so flexion is a clean forward fold.
const ELBOW_AXIS = { L: V3(Math.cos(ARM_ANGLE), Math.sin(ARM_ANGLE), 0), R: V3(Math.cos(ARM_ANGLE), -Math.sin(ARM_ANGLE), 0) };
const UPPER_ARM = 0.27, FOREARM = 0.235, PALM = 0.085;

const J = {}; // joint world positions in bind pose
J.hips = V3(0, 0.93, 0);
J.spine = V3(0, 1.02, 0);
J.chest = V3(0, 1.17, 0);
J.neck = V3(0, 1.40, -0.005);
J.head = V3(0, 1.475, 0);
for (const s of ['L', 'R']) {
  const m = s === 'L' ? 1 : -1, d = ARM_DIR[s];
  J['upperArm' + s] = V3(0.205 * m, 1.355, 0);
  J['foreArm' + s] = J['upperArm' + s].clone().addScaledVector(d, UPPER_ARM);
  J['hand' + s] = J['foreArm' + s].clone().addScaledVector(d, FOREARM);
  J['fingers' + s] = J['hand' + s].clone().addScaledVector(d, PALM);
  J['tips' + s] = J['fingers' + s].clone().addScaledVector(d, 0.037);
  J['thigh' + s] = V3(0.095 * m, 0.90, 0);
  J['shin' + s] = V3(0.10 * m, 0.50, 0.004);
  J['foot' + s] = V3(0.10 * m, 0.095, -0.004);
  J['toe' + s] = V3(0.10 * m, 0.03, 0.11);
}
const BONE_TREE = [
  ['hips', null], ['spine', 'hips'], ['chest', 'spine'], ['neck', 'chest'], ['head', 'neck'],
  ...['L', 'R'].flatMap(s => [
    ['upperArm' + s, 'chest'], ['foreArm' + s, 'upperArm' + s], ['hand' + s, 'foreArm' + s], ['fingers' + s, 'hand' + s], ['tips' + s, 'fingers' + s],
    ['thigh' + s, 'hips'], ['shin' + s, 'thigh' + s], ['foot' + s, 'shin' + s], ['toe' + s, 'foot' + s],
  ]),
];
const B = {}, BI = {}, boneList = [];
for (const [name, parent] of BONE_TREE) {
  const b = new THREE.Bone(); b.name = name;
  const pp = parent ? J[parent] : V3(0, 0, 0);
  b.position.copy(J[name]).sub(pp);
  if (parent) B[parent].add(b);
  B[name] = b; BI[name] = boneList.length; boneList.push(b);
}

/* ---------- skin-weight builders ---------- */
const rigid = (bone) => () => [[BI[bone], 1]];
// Chain blend: walk down a limb; each joint fades weight from the previous bone to the next one
// across a band of +-width around the joint plane. Weights telescope, so they always sum to 1.
function chain(root, joints) {
  const bones = [BI[root], ...joints.map(j => BI[j.bone])];
  const tmp = new THREE.Vector3();
  return (p) => {
    const ts = joints.map(j => smoothstep(-j.w, j.w, tmp.subVectors(p, j.at).dot(j.dir)));
    const out = []; let acc = 1;
    for (let k = 0; k < bones.length; k++) {
      const tNext = k < ts.length ? ts[k] : 0;
      const w = acc * (1 - tNext);
      if (w > 1e-4) out.push([bones[k], w]);
      acc *= tNext;
    }
    return out;
  };
}
const DOWN = V3(0, -1, 0), UP = V3(0, 1, 0), FWD = V3(0, 0, 1);

/* =====================================================================
   3. Geometry generators
   ===================================================================== */
// Loft: rings of superellipses stacked along axis A. U is the ring's "x"; V = U x A.
// Faces wind outward for the (U, A, V) right-handed frame.
function loft(rings, { seg = 10, n = 2.2, rot = 0, U = V3(1, 0, 0), A = UP, capStart = false, capEnd = false } = {}) {
  const V = new THREE.Vector3().crossVectors(U, A).normalize();
  const e = 2 / n, se = v => Math.sign(v) * Math.pow(Math.abs(v), e);
  const pos = [], idx = [];
  for (const r of rings) {
    for (let j = 0; j < seg; j++) {
      const a = rot + (j / seg) * TAU;
      const lx = r.rx * se(Math.cos(a)), lz = r.rz * se(Math.sin(a));
      pos.push(r.c.x + U.x * lx + V.x * lz, r.c.y + U.y * lx + V.y * lz, r.c.z + U.z * lx + V.z * lz);
    }
  }
  for (let i = 0; i < rings.length - 1; i++) for (let j = 0; j < seg; j++) {
    const a = i * seg + j, b = i * seg + (j + 1) % seg, c = (i + 1) * seg + j, d = (i + 1) * seg + (j + 1) % seg;
    idx.push(a, c, b, b, c, d);
  }
  if (capStart) {
    const ci = pos.length / 3, r = rings[0]; pos.push(r.c.x, r.c.y, r.c.z);
    for (let j = 0; j < seg; j++) idx.push(ci, j, (j + 1) % seg);
  }
  if (capEnd) {
    const ci = pos.length / 3, r = rings[rings.length - 1], base = (rings.length - 1) * seg; pos.push(r.c.x, r.c.y, r.c.z);
    for (let j = 0; j < seg; j++) idx.push(ci, base + (j + 1) % seg, base + j);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
// Rings from a list along a straight segment: [t, rx, rz, offset?]
function ringsAlong(start, dir, list, offFn) {
  return list.map(([t, rx, rz, ox = 0, oy = 0, oz = 0]) => ({ c: start.clone().addScaledVector(dir, t).add(V3(ox, oy, oz)), rx, rz }));
}
// Perpendicular frame vector for a limb direction lying in the XY plane.
const perpXY = (d) => V3(-d.y, d.x, 0).multiplyScalar(Math.sign(-d.y) || 1).normalize();

function ellipsoid(c, rx, ry, rz, ws = 8, hs = 6, quat) {
  const g = new THREE.SphereGeometry(1, ws, hs);
  g.scale(rx, ry, rz);
  if (quat) g.applyQuaternion(quat);
  g.translate(c.x, c.y, c.z);
  return g;
}
function box(c, sx, sy, sz, quat) {
  const g = new THREE.BoxGeometry(sx, sy, sz);
  if (quat) g.applyQuaternion(quat);
  g.translate(c.x, c.y, c.z);
  return g;
}
const qEuler = (x, y, z, o = 'XYZ') => new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z, o));

/* =====================================================================
   4. Texture atlases (box-projected: front / back / outer sides + flat swatches)
   ===================================================================== */
function makeAtlas({ X, Y, Z, ppu, swatches, paint }) {
  const wX = (X[1] - X[0]) * ppu, wZ = (Z[1] - Z[0]) * ppu, swW = 48;
  const W = Math.ceil(2 * wX + 2 * wZ + swW), H = Math.ceil((Y[1] - Y[0]) * ppu);
  // h = horizontal coordinate as seen by a viewer looking at that side.
  const regions = {
    front: { px0: 0, hmin: X[0], w: wX, h: p => p.x },
    back: { px0: wX, hmin: -X[1], w: wX, h: p => -p.x },
    right: { px0: 2 * wX, hmin: -Z[1], w: wZ, h: p => -p.z }, // +x side
    left: { px0: 2 * wX + wZ, hmin: Z[0], w: wZ, h: p => p.z }, // -x side
  };
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const toPx = (r, h, y) => [regions[r].px0 + (h - regions[r].hmin) * ppu, (Y[1] - y) * ppu];
  for (const r of Object.keys(regions)) {
    ctx.save();
    ctx.beginPath(); ctx.rect(regions[r].px0, 0, regions[r].w, H); ctx.clip();
    paint(ctx, r, (h, y) => toPx(r, h, y), ppu, H);
    ctx.restore();
  }
  const sw = {}; const names = Object.keys(swatches); const sh = H / names.length;
  names.forEach((k, i) => {
    ctx.fillStyle = swatches[k]; ctx.fillRect(W - swW, i * sh, swW, sh + 1);
    sw[k] = [(W - swW / 2) / W, 1 - ((i + 0.5) * sh) / H];
  });
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return {
    tex, swatch: sw,
    uv(region, p) {
      const R = regions[region]; const [px, py] = toPx(region, R.h(p), p.y);
      return [px / W, 1 - py / H];
    },
  };
}
function drawNumber(ctx, P, ppu, str, h, y, height, color = HEX.white) {
  const [px, py] = P(h, y);
  const size = (height * ppu) / 0.72;
  ctx.save();
  ctx.fillStyle = color;
  ctx.font = `900 ${size}px "Arial Black", "Helvetica Neue", Arial, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${size * 0.02}px`;
  ctx.fillText(str, px, py + (height * ppu) / 2);
  ctx.restore();
}
function tonalStripes(ctx, P, ppu, H) {
  // Subtle diagonal knit pattern like the reference kit.
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 0.011 * ppu;
  const [x0] = P(-1, 0);
  for (let i = -40; i < 80; i++) {
    const x = x0 + i * 0.032 * ppu;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + H * 0.6, H); ctx.stroke();
  }
  ctx.restore();
}

const jerseyAtlas = makeAtlas({
  X: [-0.22, 0.22], Y: [0.84, 1.44], Z: [-0.15, 0.16], ppu: 1300,
  swatches: { base: HEX.jersey, trim: HEX.trim },
  paint(ctx, r, P, ppu, H) {
    ctx.fillStyle = HEX.jersey; ctx.fillRect(0, 0, ctx.canvas.width, H);
    if (r === 'front' || r === 'back') tonalStripes(ctx, P, ppu, H);
    // collar band (top of both front and back)
    ctx.fillStyle = HEX.trim;
    { const [, y] = P(0, 1.4065); ctx.fillRect(0, 0, ctx.canvas.width, y); }
    if (r === 'front') {
      // V-neck: skin inside, dark trim along the V
      const poly = [[-0.078, 1.45], [0, 1.332], [0.078, 1.45]].map(([h, y]) => P(h, y));
      ctx.fillStyle = HEX.skin;
      ctx.beginPath(); ctx.moveTo(...poly[0]); ctx.lineTo(...poly[1]); ctx.lineTo(...poly[2]); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = HEX.trim; ctx.lineWidth = 0.017 * ppu; ctx.lineJoin = 'miter';
      ctx.beginPath(); ctx.moveTo(...poly[0]); ctx.lineTo(...poly[1]); ctx.lineTo(...poly[2]); ctx.stroke();
      // small generic kit-maker mark (viewer's left chest)
      ctx.fillStyle = HEX.white;
      const [mx, my] = P(-0.088, 1.302), u = 0.0105 * ppu;
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(mx - 1.3 * u, my + i * 0.85 * u);
        ctx.lineTo(mx, my - 0.9 * u + i * 0.85 * u);
        ctx.lineTo(mx + 1.3 * u, my + i * 0.85 * u);
        ctx.lineTo(mx + 1.3 * u, my + 0.45 * u + i * 0.85 * u);
        ctx.lineTo(mx, my - 0.45 * u + i * 0.85 * u);
        ctx.lineTo(mx - 1.3 * u, my + 0.45 * u + i * 0.85 * u);
        ctx.closePath(); ctx.fill();
      }
      drawNumber(ctx, P, ppu, '10', 0, 1.218, 0.082);
    }
    if (r === 'back') drawNumber(ctx, P, ppu, '10', 0, 1.165, 0.165);
  },
});

const shortsAtlas = makeAtlas({
  X: [-0.24, 0.24], Y: [0.6, 1.06], Z: [-0.15, 0.15], ppu: 1300,
  swatches: { base: HEX.shorts },
  paint(ctx, r, P, ppu, H) {
    ctx.fillStyle = HEX.shorts; ctx.fillRect(0, 0, ctx.canvas.width, H);
    if (r === 'front') drawNumber(ctx, P, ppu, '10', 0.122, 0.695, 0.056);
    if (r === 'left' || r === 'right') {
      ctx.fillStyle = HEX.white;
      for (const c of [-0.0095, 0.0095]) {
        const [x0, y0] = P(c - 0.0048, 1.06), [x1, y1] = P(c + 0.0048, 0.6);
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  },
});

/* =====================================================================
   5. Build the character parts
   ===================================================================== */
const buckets = { body: [], features: [], jersey: [], shorts: [] };
const add = (bucket, geo, opts) => buckets[bucket].push({ geo, ...opts });

/* ---------- Head ---------- */
const HC = V3(0, 1.615, 0.012);               // head centre
const HR = V3(0.126, 0.152, 0.133);            // head radii
// Side/front profile of the skull, sampled by latitude (y on the unit sphere).
// W = half-width, Df/Db = front/back depth, Yv = vertical position. The kink at y=-0.62 is the jaw corner.
const HEAD_PROFILE = [

/* =====================================================================
   6. Bake parts into skinned buffers (flat-shaded, per-face colour / atlas UV)
   ===================================================================== */
function bake(list, atlas) {
  const P = [], C = [], UVs = [], SI = [], SW = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ctr = new THREE.Vector3(), nrm = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), v = new THREE.Vector3();
  for (const part of list) {
    const g = part.geo.index ? part.geo.toNonIndexed() : part.geo;
    const pa = g.attributes.position;
    for (let f = 0; f < pa.count; f += 3) {
      a.fromBufferAttribute(pa, f); b.fromBufferAttribute(pa, f + 1); c.fromBufferAttribute(pa, f + 2);
      ctr.copy(a).add(b).add(c).divideScalar(3);
      nrm.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
      if (nrm.lengthSq() < 1e-14) continue; // drop degenerate (pole) triangles
      nrm.normalize();
      const col = typeof part.color === 'function' ? part.color(ctr, nrm) : part.color;
      let region = null, sw = null;
      if (atlas) {
        const mode = typeof part.uv === 'function' ? part.uv(ctr, nrm) : part.uv;
        if (mode !== 'atlas') sw = atlas.swatch[mode];
        else {
          const ax = Math.abs(nrm.x), ay = Math.abs(nrm.y), az = Math.abs(nrm.z);
          if (ax > az && ax > ay * 0.8) region = (Math.sign(nrm.x) === Math.sign(ctr.x) && Math.abs(ctr.x) > 0.12) ? (nrm.x > 0 ? 'right' : 'left') : null;
          else region = (ay > az ? ctr.z : nrm.z) >= 0 ? 'front' : 'back';
          if (!region) sw = atlas.swatch.base;
        }
      }
      for (const vi of [f, f + 1, f + 2]) {
        v.fromBufferAttribute(pa, vi);
        P.push(v.x, v.y, v.z);
        if (col) C.push(col.r, col.g, col.b);
        if (atlas) UVs.push(...(region ? atlas.uv(region, v) : sw));
        const w = part.weights(v).sort((x, y) => y[1] - x[1]).slice(0, 4);
        const sum = w.reduce((s, x) => s + x[1], 0) || 1;
        for (let k = 0; k < 4; k++) { SI.push(w[k] ? w[k][0] : 0); SW.push(w[k] ? w[k][1] / sum : 0); }
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  if (C.length) geo.setAttribute('color', new THREE.Float32BufferAttribute(C, 3));
  if (UVs.length) geo.setAttribute('uv', new THREE.Float32BufferAttribute(UVs, 2));
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(SI, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(SW, 4));
  geo.computeVertexNormals(); // non-indexed -> exact per-face normals (crisp low-poly facets, skinned correctly)
  geo.computeBoundingSphere();
  return geo;
}

  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform vec3 uSun, uZenith, uMid, uHorizonSun, uHorizonAway, uFog; uniform float uTime;
    varying vec3 vDir;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return v; }

      vec3 d = normalize(vDir);
      float h = max(d.y, 0.0);
      float sunAmt = max(dot(d, uSun), 0.0);

      col += vec3(1.0, 0.62, 0.3) * pow(sunAmt, 8.0) * 0.45;          // wide warm glow
      col += vec3(1.0, 0.8, 0.55) * pow(sunAmt, 90.0) * 0.9;          // tight halo
      // Clouds: fbm on a virtual cloud layer, lit from the sun side with bright rims.
      vec2 cp = d.xz / (max(d.y, 0.0) + 0.08) * 1.4 + vec2(uTime * 0.012, uTime * 0.004);

      gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));

   ===================================================================== */
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); return new THREE.CanvasTexture(c); }
const MOW = 5.5; // mowing stripe width (m), stripes run parallel to the goal line
const MOW_GLSL = `float mowStripe(float z){ return mix(0.84, 1.08, mod(floor(z / ${MOW.toFixed(2)}), 2.0)); }`;

const turfTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b7a34'; g.fillRect(0, 0, w, h);
  const rnd = mulberry(7);
  for (let i = 0; i < 9000; i++) {
    const x = rnd() * w, y = rnd() * h, l = 2 + rnd() * 5, light = rnd();
    g.fillStyle = light > 0.5 ? `rgba(150,210,110,${0.06 + rnd() * 0.08})` : `rgba(10,40,10,${0.08 + rnd() * 0.1})`;
    for (const [ox, oy] of [[0, 0], [-w, 0], [0, -h], [-w, -h]]) g.fillRect(x + ox, y + oy, 1.5, l); // wrap for seamless tiling
  }
});
turfTex.colorSpace = THREE.SRGBColorSpace;
turfTex.wrapS = turfTex.wrapT = THREE.RepeatWrapping;
turfTex.anisotropy = aniso;
// Regulation pitch: 105 x 68 m. Goal lines at z = 0 and z = 105, touchlines at x = +-34.
const FIELD = { len: 105, half: 34 };
const GROUND = 1200;
turfTex.repeat.set(GROUND / 2.5, GROUND / 2.5);
const turfMat = new THREE.MeshStandardMaterial({ map: turfTex, roughness: 0.95, metalness: 0, envMapIntensity: 0.35 });
turfMat.onBeforeCompile = (sh) => {
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;\n${MOW_GLSL}`)
    .replace('#include <map_fragment>', `#include <map_fragment>
  float inField = step(abs(vWPos.x), ${FIELD.half + 3}.0) * step(-4.0, vWPos.z) * step(vWPos.z, ${FIELD.len + 4}.0);
  diffuseColor.rgb *= mix(0.8, mowStripe(vWPos.z), inField);`);
};
const turf = new THREE.Mesh(new THREE.PlaneGeometry(GROUND, GROUND), turfMat);
turf.rotation.x = -Math.PI / 2; turf.position.z = FIELD.len / 2; turf.receiveShadow = true;
scene.add(turf);

// Line markings (real dimensions, metres)
{
  const lineMat = new THREE.MeshStandardMaterial({ color: '#eef1ea', roughness: 0.9, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  const LW = 0.12, Y = 0.004;
  const lay = (geo, x, z, rotY = 0) => { const m = new THREE.Mesh(geo, lineMat); m.rotation.set(-Math.PI / 2, 0, rotY); m.position.set(x, Y, z); m.receiveShadow = true; scene.add(m); };
  const strip = (cx, cz, w, l) => lay(new THREE.PlaneGeometry(w, l), cx, cz);
  const ring = (r, x, z, start, len) => lay(new THREE.RingGeometry(r - LW / 2, r + LW / 2, 96, 1, start, len), x, z);
  const H = FIELD.half, Lz = FIELD.len;
  for (const m of [1, -1]) strip(m * H, Lz / 2, LW, Lz + LW);        // touchlines
  for (const z of [0, Lz]) strip(0, z, 2 * H + LW, LW);             // goal lines
  strip(0, Lz / 2, 2 * H, LW);                                       // halfway line
  ring(9.15, 0, Lz / 2, 0, TAU);                                     // centre circle
  lay(new THREE.CircleGeometry(0.15, 24), 0, Lz / 2);                // centre spot
  const a = Math.asin(5.5 / 9.15);
  for (const [z0, dir] of [[0, 1], [Lz, -1]]) {
    const Z = (z) => z0 + dir * z;
    for (const m of [1, -1]) { strip(m * 20.16, Z(8.25), LW, 16.5); strip(m * 9.16, Z(2.75), LW, 5.5); }
    strip(0, Z(16.5), 40.32 + LW, LW);                                // penalty area
    strip(0, Z(5.5), 18.32 + LW, LW);                                 // goal area
    lay(new THREE.CircleGeometry(0.11, 20), 0, Z(11));                // penalty spot
    // The "D": part of the 9.15 m circle around the spot outside the box (ring is laid in XZ, angle 0 = +x, PI/2 = -z)
    ring(9.15, 0, Z(11), dir > 0 ? Math.PI + a : a, Math.PI - 2 * a);
  }
  // Corner arcs (1 m) - quarter circles inside the field
  ring(1, H, 0, Math.PI, Math.PI / 2); ring(1, -H, 0, 1.5 * Math.PI, Math.PI / 2);
  ring(1, H, Lz, Math.PI / 2, Math.PI / 2); ring(1, -H, Lz, 0, Math.PI / 2);
}

// 3D grass: instanced blades in a patch that travels with the player (blades stay fixed in the
// world and are wrapped on the GPU), shrinking to nothing at the patch edge.
const GRASS = { half: 7, count: 42000 };
const grassUniforms = {
  uCenter: { value: new THREE.Vector2() }, uHalf: { value: GRASS.half }, uTime: { value: 0 },
  uRoot: { value: new THREE.Color('#1d4519') }, uTip: { value: new THREE.Color('#71ad4c') },
};
{
  const geo = new THREE.InstancedBufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([-0.0105, 0, 0, 0.0105, 0, 0, 0, 1, 0], 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
  const rnd = mulberry(3), off = new Float32Array(GRASS.count * 2), prm = new Float32Array(GRASS.count * 4);
  for (let i = 0; i < GRASS.count; i++) {
    off[i * 2] = (rnd() * 2 - 1) * GRASS.half; off[i * 2 + 1] = (rnd() * 2 - 1) * GRASS.half;
    prm.set([0.022 + rnd() * 0.032, rnd() * TAU, 0.15 + rnd() * 0.45, 0.78 + rnd() * 0.4], i * 4);
  }
  geo.setAttribute('aOff', new THREE.InstancedBufferAttribute(off, 2));
  geo.setAttribute('aPrm', new THREE.InstancedBufferAttribute(prm, 4));
  geo.instanceCount = GRASS.count;
  const mat = new THREE.MeshStandardMaterial({ roughness: 0.9, side: THREE.DoubleSide, envMapIntensity: 0.3 });
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, grassUniforms);
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
attribute vec2 aOff; attribute vec4 aPrm;
uniform vec2 uCenter; uniform float uHalf; uniform float uTime;
varying float vTip; varying float vShade; varying float vZ;`)
      .replace('#include <beginnormal_vertex>', 'vec3 objectNormal = vec3(0.0, 1.0, 0.0);')
      .replace('#include <begin_vertex>', `
  vec3 transformed = position;
  float t = position.y;
  transformed.y *= aPrm.x;
  vec2 rel = mod(aOff - uCenter + uHalf, 2.0 * uHalf) - uHalf;
  vec2 wp = uCenter + rel;
  float wind = sin(uTime * 1.6 + wp.x * 0.7 + wp.y * 0.9) * 0.5 + 0.5;
  transformed.z += (aPrm.z + wind * 0.35) * t * t * aPrm.x;
  float c = cos(aPrm.y), s = sin(aPrm.y);
  transformed.xz = mat2(c, s, -s, c) * transformed.xz;
  transformed *= 1.0 - smoothstep(uHalf * 0.55, uHalf * 0.95, length(rel));
  transformed.xz += wp;
  vTip = t; vShade = aPrm.w; vZ = wp.y;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
uniform vec3 uRoot; uniform vec3 uTip; varying float vTip; varying float vShade; varying float vZ;
${MOW_GLSL}`)
      .replace('#include <color_fragment>', '#include <color_fragment>\ndiffuseColor.rgb = mix(uRoot, uTip, vTip) * vShade * mowStripe(vZ);')
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\nnormal = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);');
  };
  const grass = new THREE.Mesh(geo, mat);
  grass.frustumCulled = false; grass.receiveShadow = true;
  scene.add(grass);
}

    p['fing' + side] = 14 * DEG; p['tip' + side] = 22 * DEG;
    p['thAbd' + side] = (1.5 - m * 1.2 * sway) * DEG; p['thF' + side] = 2 * DEG; p['kn' + side] = (3 + m * 2 * sway) * DEG;
    p['ank' + side] = p['thF' + side] - p['kn' + side];
  }
  return p;
}
const poseRef = () => ({});

function blendPoses(list) {
  const out = {};
  for (const [pose, w] of list) { if (w < 1e-4) continue; for (const k in pose) out[k] = (out[k] || 0) + pose[k] * w; }
  return out;
}
const eul = new THREE.Euler();
const setRot = (bone, x, y, z) => bone.quaternion.setFromEuler(eul.set(x, y, z, 'XYZ'));
function applyPose(p) {
  const g = k => p[k] || 0;
  B.hips.position.set(J.hips.x + g('hipsTx'), J.hips.y, J.hips.z);
  setRot(B.hips, g('hipsX'), g('hipsY'), g('hipsZ'));
  setRot(B.spine, g('spineX'), g('spineY'), 0);
  setRot(B.chest, g('chestX'), g('chestY'), g('chestZ'));
  setRot(B.neck, g('neckX'), g('neckY'), 0);
  setRot(B.head, g('headX'), g('headY'), g('headZ'));
  for (const [s, m] of [['L', 1], ['R', -1]]) {
    setRot(B['upperArm' + s], -g('shF' + s), -m * g('shInt' + s), m * g('shAbd' + s));
    B['foreArm' + s].quaternion.setFromAxisAngle(ELBOW_AXIS[s], -g('elb' + s));
    B['hand' + s].quaternion.setFromAxisAngle(ELBOW_AXIS[s], -g('wrist' + s));
    B['fingers' + s].quaternion.setFromAxisAngle(FWD, -m * g('fing' + s));
    B['tips' + s].quaternion.setFromAxisAngle(FWD, -m * g('tip' + s));
    setRot(B['thigh' + s], -g('thF' + s), -m * g('thInt' + s), m * g('thAbd' + s));
    setRot(B['shin' + s], g('kn' + s), 0, 0);
    setRot(B['foot' + s], g('ank' + s), 0, 0);
    setRot(B['toe' + s], -g('toe' + s), 0, 0);
  }
}
// Ground lock (character-local): lowest sole point sits on y=0; flight phases add lift.
// The planted contact point's backward slide gives the true running speed for root motion.
const mp = new THREE.Vector3();
const markerLocal = (o) => character.worldToLocal(o.getWorldPosition(mp));
let lastContact = -1, lastContactZ = 0, groundSpeed = 0;
function groundLock(lift, dt) {
  character.updateMatrixWorld(true);
  let minY = Infinity, idx = -1;
  soleMarkers.forEach((o, i) => { const y = markerLocal(o).y; if (y < minY) { minY = y; idx = i; } });
  B.hips.position.y += -minY + lift;
  character.updateMatrixWorld(true);
  const z = markerLocal(soleMarkers[idx]).z;
  if (dt > 0 && lift < 0.002 && idx === lastContact) groundSpeed = damp(groundSpeed, Math.max(0, (lastContactZ - z) / dt), 3, dt);
  lastContact = idx; lastContactZ = z;
}

/* ---------- Running track: laps of a stadium-shaped loop inside the penalty area ---------- */
const TRACK = { x: 5, z0: 7, z1: 15, r: 4 };
const TRACK_LEN = 4 * TRACK.x + 2 * Math.PI * TRACK.r;
function trackAt(s) {
  s = ((s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
  const L = 2 * TRACK.x, A = Math.PI * TRACK.r, cz = (TRACK.z0 + TRACK.z1) / 2;
  const arc = (cx, a) => ({ p: V3(cx + TRACK.r * Math.cos(a), 0, cz + TRACK.r * Math.sin(a)), h: V3(-Math.sin(a), 0, Math.cos(a)), k: -1 / TRACK.r });
  if (s < L) return { p: V3(-TRACK.x + s, 0, TRACK.z0), h: V3(1, 0, 0), k: 0 };
  if ((s -= L) < A) return arc(TRACK.x, -Math.PI / 2 + s / TRACK.r);
  if ((s -= A) < L) return { p: V3(TRACK.x - s, 0, TRACK.z1), h: V3(-1, 0, 0), k: 0 };
  return arc(-TRACK.x, Math.PI / 2 + (s - L) / TRACK.r);
}
const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

/* =====================================================================
   11. UI, state, camera rig
   ===================================================================== */
const state = {
  mode: 'run', pace: 0.35, slow: false, paused: false,
  phase: 0, idleT: 0, weights: { run: 1, idle: 0, ref: 0 },
  s: 2 * TRACK.x + Math.PI * TRACK.r * 0.5 - 3, lean: 0, yaw: 0, time: 0,
};
// Follow views are in the player's frame; TV tracks him from the touchline; Goal is a fixed net close-up.
const VIEWS = {
  three: { follow: true, pos: V3(2.1, 1.35, 3.2), tgt: V3(0, 0.92, 0) },
  front: { follow: true, pos: V3(0, 1.05, 3.7), tgt: V3(0, 0.92, 0) },
  side: { follow: true, pos: V3(-3.7, 1.05, 0), tgt: V3(0, 0.92, 0) },
  back: { follow: true, pos: V3(0, 1.05, -3.7), tgt: V3(0, 0.92, 0) },
  face: { follow: true, pos: V3(0.12, 1.66, 0.78), tgt: V3(0, 1.6, 0) },
  tv: { track: true, pos: V3(32, 11, 22) },
  stadium: { pos: V3(28, 24, 98), tgt: V3(0, 0, 48) },
  goal: { pos: V3(5.2, 1.7, 4.6), tgt: V3(0, 1.15, -0.8) },
};
const rig = { pos: new THREE.Vector3(), yaw: 0 };
const toWorld = (v) => v.clone().applyAxisAngle(UP, rig.yaw).add(rig.pos);
const toLocal = (v) => v.clone().sub(rig.pos).applyAxisAngle(UP, -rig.yaw);
const trackTarget = () => character.position.clone().add(V3(0, 0.95, 0));
let view = VIEWS.three, camTween = null;
function setView(name, instant = false) {
  view = VIEWS[name];
  const from = view.follow ? [toLocal(camera.position), toLocal(controls.target)] : [camera.position.clone(), controls.target.clone()];
  camTween = { t: instant ? 1 : 0, fromP: from[0], fromT: from[1] };
}
function updateCamera(dt, real) {
  // Carry the camera with the player (position + heading) in follow views.
  const dyaw = angleDiff(state.yaw, rig.yaw);
  if (view.follow) for (const v of [camera.position, controls.target]) v.sub(rig.pos).applyAxisAngle(UP, dyaw).add(character.position);
  rig.pos.copy(character.position); rig.yaw = state.yaw;
  const toT = view.tgt ? view.tgt.clone() : trackTarget().sub(view.follow ? rig.pos : V3(0, 0, 0));
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + real / 0.9);
    const e = camTween.t < 0.5 ? 4 * camTween.t ** 3 : 1 - (-2 * camTween.t + 2) ** 3 / 2;
    const P = camTween.fromP.clone().lerp(view.pos, e), T = camTween.fromT.clone().lerp(toT, e);
    camera.position.copy(view.follow ? toWorld(P) : P);
    controls.target.copy(view.follow ? toWorld(T) : T);
    if (camTween.t >= 1) camTween = null;
  } else if (view.track) controls.target.lerp(trackTarget(), 1 - Math.exp(-4 * real));
}

function pressGroup(group, value) {
  document.querySelectorAll(`[data-group="${group}"] button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === value)));
}
function setMode(m) { state.mode = m; pressGroup('mode', m); }
const toggle = (id, on) => document.getElementById(id).setAttribute('aria-pressed', String(on));
document.querySelector('[data-group="mode"]').addEventListener('click', e => { const v = e.target.dataset?.v; if (v) setMode(v); });
document.querySelector('[data-group="view"]').addEventListener('click', e => { const v = e.target.dataset?.v; if (v) { pressGroup('view', v); setView(v); } });
const speedEl = document.getElementById('speed'), speedVal = document.getElementById('speedval');
const paceLabel = v => v < 0.3 ? 'Jog' : v < 0.7 ? 'Run' : 'Sprint';
speedEl.addEventListener('input', () => { state.pace = +speedEl.value; speedVal.textContent = paceLabel(state.pace); });
speedVal.textContent = paceLabel(state.pace);
const actions = {
  slow: () => { state.slow = !state.slow; toggle('t-slow', state.slow); },
  pause: () => { state.paused = !state.paused; toggle('t-pause', state.paused); },
  wire: () => { const on = !wireMeshes[0].visible; wireMeshes.forEach(w => w.visible = on); toggle('t-wire', on); },
  spin: () => { controls.autoRotate = !controls.autoRotate; toggle('t-spin', controls.autoRotate); },
  hq: () => { quality.high = !quality.high; toggle('t-hq', quality.high); key.shadow.mapSize.setScalar(quality.high ? 4096 : 2048); key.shadow.map?.dispose(); key.shadow.map = null; resize(); },
};
for (const k of Object.keys(actions)) document.getElementById('t-' + k).addEventListener('click', actions[k]);
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '1') setMode('run'); else if (e.key === '2') setMode('idle'); else if (e.key === '3') setMode('ref');
  else if (e.key === ' ') { e.preventDefault(); actions.pause(); }
  else if (e.key.toLowerCase() === 'w') actions.wire();
});
controls.addEventListener('start', () => { camTween = null; });

/* ---------- Post-processing: GTAO, bloom, tone mapping, grade/vignette/grain ---------- */
const quality = { high: !matchMedia('(pointer: coarse)').matches };
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.blendIntensity = 0.9;
gtao.updateGtaoMaterial({ radius: 0.45, distanceExponent: 1.4, thickness: 1.2, scale: 1.25, samples: 12 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
// Objects whose shading is done in custom vertex/alpha code would be wrong in GTAO's override pass.
const aoHidden = [sky, ...scene.children.filter(o => o.isMesh && (o.material === netMat || o.geometry?.isInstancedBufferGeometry))];
scene.traverse(o => { if (o.isMesh && o.material === netMat) aoHidden.push(o); });
{
  const base = gtao.render.bind(gtao);
  gtao.render = (...args) => { const vis = aoHidden.map(o => o.visible); aoHidden.forEach(o => o.visible = false); base(...args); aoHidden.forEach((o, i) => o.visible = vis[i]); };
}
composer.addPass(gtao);
// Guard: never let a stray NaN/Inf pixel reach the bloom blur (it would smear across the screen).
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; varying vec2 vUv; void main(){ vec4 c = texture2D(tDiffuse, vUv); bvec3 bad = isnan(c.rgb); if (bad.x || bad.y || bad.z || any(isinf(c.rgb))) c.rgb = vec3(0.0); gl_FragColor = vec4(clamp(c.rgb, 0.0, 64.0), 1.0); }',
}));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.38, 0.6, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      vec3 col = c.rgb;
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, 1.12);                                   // a touch more saturation
      col = mix(col, col * col * (3.0 - 2.0 * col), 0.22);              // gentle S-curve
      col += vec3(0.028, 0.012, -0.012) * smoothstep(0.45, 1.0, l);    // warm highlights
      col += vec3(-0.008, 0.0, 0.02) * (1.0 - smoothstep(0.0, 0.35, l)); // cool shadows
      vec2 q = vUv - 0.5; col *= 1.0 - dot(q, q) * 0.6;                // vignette
      float n = fract(sin(dot(vUv * uRes + fract(uTime) * 91.7, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) * 0.016;                                         // fine film grain
      gl_FragColor = vec4(clamp(col, 0.0, 1.0), c.a);
    }`,
});
composer.addPass(grade);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 44 : 32; // keep the whole player in frame on tall screens
  camera.updateProjectionMatrix();
  const dpr = Math.min(window.devicePixelRatio, quality.high ? 2 : 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(dpr);
  composer.setSize(w, h);
  grade.uniforms.uRes.value.set(w * dpr, h * dpr);
}
window.addEventListener('resize', resize);
resize();

function placeCharacter(dt) {
  const tr = trackAt(state.s);
  state.yaw = Math.atan2(tr.h.x, tr.h.z);
  // Lean into the bend: tan(lean) = v^2 * curvature / g
  state.lean = damp(state.lean, -Math.atan((groundSpeed ** 2 * tr.k) / 9.81), 4, dt);
  character.position.copy(tr.p);
  character.rotation.set(0, state.yaw, state.lean, 'YXZ');
}
placeCharacter(0);
rig.pos.copy(character.position); rig.yaw = state.yaw;
setView('three', true);
updateCamera(0, 0);
toggle('t-hq', quality.high);
if (!quality.high) key.shadow.mapSize.setScalar(2048);

/* =====================================================================
   12. Loop
   ===================================================================== */
const clock = new THREE.Clock();
function frame() {
  const real = Math.min(clock.getDelta(), 0.05);
  const dt = state.paused ? 0 : real * (state.slow ? 0.25 : 1);
  state.time += dt;

  for (const k of ['run', 'idle', 'ref']) state.weights[k] = damp(state.weights[k], state.mode === k ? 1 : 0, 6, dt);
  const sum = state.weights.run + state.weights.idle + state.weights.ref;
  const cadence = lerp(1.32, 1.62, state.pace); // strides per second (one stride = two steps)
  state.phase = (state.phase + dt * cadence) % 1;
  state.idleT += dt;

  const pose = blendPoses([
    [poseRun(state.phase, state.pace), state.weights.run / sum],
    [poseIdle(state.idleT), state.weights.idle / sum],
    [poseRef(), state.weights.ref / sum],
  ]);
  applyPose(pose);
  groundLock(pose.lift || 0, dt);

  // Root motion: advance along the track exactly as fast as the planted foot pushes back.
  state.s += groundSpeed * dt;
  placeCharacter(dt);
  updateCamera(dt, real);

  grassUniforms.uCenter.value.set(character.position.x, character.position.z);
  grassUniforms.uTime.value = state.time;
  updateNet(state.time);
  key.position.copy(character.position).add(KEY_OFFSET);
  key.target.position.copy(character.position);
  sky.position.copy(camera.position);
  skyUniforms.uTime.value = state.time;

  controls.update(real);
  stadiumTime.value = state.time;
  for (const t of ledBoards) t.offset.x = (state.time * 0.04) % 1;
  if (quality.high) { grade.uniforms.uTime.value = state.time; composer.render(real); } else renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// Test hook: lets automated checks freeze specific poses/views.
window.__fc = { quality, composer, state, setMode, setView, camera, controls, character, triCount, placeCharacter, updateCamera };
requestAnimationFrame(frame);
</script>
