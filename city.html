/*── ROAD MESH ───────────────────────────────────────────────────────────────
  Carriageway, kerbs, footways, lane markings, crossings and properly shaped
  junction polygons are all rebuilt into one mesh whenever the network edits. */
const ASPH=[.128,.132,.142], ASPH2=[.138,.142,.152], KERB=[.50,.50,.49],
      WALK=[.375,.375,.368], LINE=[.86,.86,.82], LINEY=[.84,.70,.16],
      VERGE=[.198,.246,.140];
/* Junction solver.  A junction is not a disc: its corners are where the outer
   edges of neighbouring approaches actually intersect.  Solving those lines
   gives a plate that matches the carriageway exactly — for two perpendicular
   11 m streets it is an 11 m square, not a blob — and tells each approach how
   far back to stop. */
function nodeDirs(n){
  const out=[];
  for(const id of n.e){const e=edges.get(id);if(!e)continue;
    const at=e.a===n.id, t=edgeTan(e,at?0:1);
    const dx=at?t.x:-t.x, dz=at?t.z:-t.z;
    out.push({e,dx,dz,hw:RTYPE[e.type].w/2,sw:RTYPE[e.type].sw,vg:RTYPE[e.type].verge,
              ang:Math.atan2(dz,dx)});}
  out.sort((a,b)=>a.ang-b.ang);
  return out;
}
function shouldCap(n){
  if(n.e.length>2)return true;
  if(n.e.length===2){const d=nodeDirs(n);
    return d[0].dx*d[1].dx+d[0].dz*d[1].dz>-0.965;}
  return false;
}
// corner where approach i's left edge meets approach j's right edge
function edgeCorner(n,a,b,pad){
  const pax=-a.dz,paz=a.dx, pbx=-b.dz,pbz=b.dx;
  const w1=a.hw+(pad||0), w2=b.hw+(pad||0);
  const p1x=n.x+pax*w1, p1z=n.z+paz*w1;
  const p2x=n.x-pbx*w2, p2z=n.z-pbz*w2;
  const den=a.dx*b.dz-a.dz*b.dx;
  if(Math.abs(den)<0.14){                        // (anti)parallel — no true corner
    return {x:(p1x+p2x)/2+a.dx*w1*0.5, z:(p1z+p2z)/2+a.dz*w1*0.5};
  }
  const t=((p2x-p1x)*b.dz-(p2z-p1z)*b.dx)/den;
  const tc=clamp(t,-Math.max(w1,w2)*3.2,Math.max(w1,w2)*3.2);
  return {x:p1x+a.dx*tc, z:p1z+a.dz*tc};
}
const JUNC=new Map();                            // nodeId → {pts, outer, trim}
function solveJunctions(){
  JUNC.clear();
  for(const n of nodes.values()){
    if(!shouldCap(n)){for(const id of n.e){}
      JUNC.set(n.id,{pts:null,outer:null,trim:new Map(n.e.map(id=>[id,0]))});continue;}
    const D=nodeDirs(n), m=D.length, pts=[], outer=[], trim=new Map();
    for(let i=0;i<m;i++){
      const a=D[i], b=D[(i+1)%m];
      pts.push(edgeCorner(n,a,b,0));
      outer.push(edgeCorner(n,a,b,Math.max(a.sw+a.vg,b.sw+b.vg)));
    }
    for(let i=0;i<m;i++){                        // stop each approach behind its corners
      const d=D[i], c0=pts[(i-1+m)%m], c1=pts[i];
      const t0=(c0.x-n.x)*d.dx+(c0.z-n.z)*d.dz;
      const t1=(c1.x-n.x)*d.dx+(c1.z-n.z)*d.dz;
      trim.set(d.e.id,Math.max(0.2,Math.max(t0,t1)));
    }
    JUNC.set(n.id,{pts,outer,trim,dirs:D});
  }
}
function nodeRadius(n){                          // still handy for prop placement
  const j=JUNC.get(n.id); if(!j||!j.pts)return RTYPE.street.w*0.5;
  let r=0; for(const p of j.pts)r=Math.max(r,dist(p.x,p.z,n.x,n.z));
  return r;
}
function buildRoadMesh(){
  const mb=new MeshBuilder(), um=new MeshBuilder();
  const strip=(pts,off0,off1,y,col,rg,ao)=>{
    let prev=null;
    for(const p of pts){
      const nx=-p.tz,nz=p.tx;
      const aI=mb.vert(p.x+nx*off0,p.y+y,p.z+nz*off0,0,1,0,col,ao===undefined?1:ao,0,rg,0,0);
      const bI=mb.vert(p.x+nx*off1,p.y+y,p.z+nz*off1,0,1,0,col,ao===undefined?1:ao,0,rg,0,0);
      if(prev)mb.quad(prev[0],aI,bI,prev[1]);
      prev=[aI,bI];}
  };
  solveJunctions();
  const trimOf=(n,e)=>{const j=JUNC.get(n.id);return j?(j.trim.get(e.id)||0):0;};

  for(const e of edges.values()){
    const T=RTYPE[e.type], hw=T.w/2, sw=T.sw, vg=T.verge;
    const A=nodes.get(e.a),B=nodes.get(e.b);
    const t0=trimOf(A,e),t1=trimOf(B,e);
    if(e.len-t0-t1<0.6)continue;
    const N=Math.max(2,Math.round((e.len-t0-t1)/3.0)+1), P=[];
    for(let i=0;i<N;i++)P.push(edgeAtLen(e,t0+(e.len-t0-t1)*i/(N-1)));
    strip(P,-hw,hw,0.05,ASPH,.93);                                  // carriageway
    for(const s of[-1,1]){
      strip(P,s*hw,s*(hw+0.16),0.05,KERB,.72,.62);                  // kerb face (vertical-ish)
      strip(P,s*(hw+0.02),s*(hw+0.30),0.19,KERB,.68,.9);            // kerb top
      strip(P,s*(hw+0.30),s*(hw+sw),0.185,WALK,.90);                // footway
      strip(P,s*(hw+sw),s*(hw+sw+vg),0.16,VERGE,.98,.9);            // grass verge
    }
    // lane markings
    if(T.lanes>2){
      if(T.median){                                                 // raised central median
        strip(P,-T.median/2,T.median/2,0.05,KERB,.7,.72);
        strip(P,-T.median/2+0.12,T.median/2-0.12,0.19,VERGE,.98,.92);
        for(const s of[-1,1])strip(P,s*(T.median/2-0.02),s*(T.median/2+0.12),0.19,KERB,.68,.9);
      }
      for(const s of[-1,1]){                                        // lane divider, dashed
        let d=t0+1.5;
        while(d<e.len-t1-1.5){
          const q0=edgeAtLen(e,d),q1=edgeAtLen(e,Math.min(d+3.0,e.len-t1-1.5));
          strip([q0,q1],s*(T.w/4)-0.09,s*(T.w/4)+0.09,0.056,LINE,.7); d+=6.4;}
      }
    } else {
      let d=t0+1.5;                                                 // dashed centre line
      while(d<e.len-t1-1.5){
        const q0=edgeAtLen(e,d),q1=edgeAtLen(e,Math.min(d+2.8,e.len-t1-1.5));
        strip([q0,q1],-0.10,0.10,0.056,LINE,.7); d+=6.0;}
    }
    for(const s of[-1,1])strip(P,s*(hw-0.42),s*(hw-0.26),0.056,LINE,.7);   // edge lines
    // stop bars + zebra crossings at junctions
    for(const [nd,tt,sign] of [[A,t0,1],[B,e.len-t1,-1]]){
      if(!shouldCap(nd))continue;
      // zebra sits hard against the junction box; the stop bar goes behind it
      const nz=Math.max(4,Math.round(T.w/2.1));
      for(let k=0;k<nz;k++){
        const a=edgeAtLen(e,tt+sign*(0.35+k*0.80)),b=edgeAtLen(e,tt+sign*(0.35+k*0.80+0.40));
        strip([a,b],-hw+0.35,hw-0.35,0.057,LINE,.7);}
      const sb=0.35+nz*0.80+0.55;
      const q=edgeAtLen(e,tt+sign*sb), q2=edgeAtLen(e,tt+sign*(sb+0.52));
      strip([q,q2],sign>0?0.16:-hw+0.3,sign>0?hw-0.3:-0.16,0.057,LINE,.7);
    }
    if(e.pipe){
      let prev=null;
      for(const p of e.pts){const nx=-p.tz,nz=p.tx;
        const a=um.vert(p.x-nx*1.1,p.y+0.30,p.z-nz*1.1,0,1,0,[.25,.62,.95],1,.5,.4,0,0);
        const b=um.vert(p.x+nx*1.1,p.y+0.30,p.z+nz*1.1,0,1,0,[.25,.62,.95],1,.5,.4,0,0);
        if(prev)um.quad(prev[0],a,b,prev[1]); prev=[a,b];}
    }
  }
  // Convex ground polygon, wound by descending bearing about its centroid so
  // the surface normal always points up. Used for junction plates and corners.
  const flatFan=(pts,yOff,col,ao,rg)=>{
    if(pts.length<3)return;
    let cx=0,cz=0; for(const p of pts){cx+=p.x;cz+=p.z;} cx/=pts.length;cz/=pts.length;
    const ord=pts.slice().sort((a,b)=>
      Math.atan2(b.z-cz,b.x-cx)-Math.atan2(a.z-cz,a.x-cx));
    const ci=mb.vert(cx,groundY(cx,cz)+yOff,cz,0,1,0,col,ao,0,rg,0,0);
    const ri=ord.map(p=>mb.vert(p.x,groundY(p.x,p.z)+yOff,p.z,0,1,0,col,ao,0,rg,0,0));
    for(let k=0;k<ri.length;k++)mb.tri(ci,ri[k],ri[(k+1)%ri.length]);
  };
  for(const n of nodes.values()){
    const j=JUNC.get(n.id); if(!j||!j.pts)continue;
    flatFan(j.pts,0.05,ASPH2,1,.93);
    const D=j.dirs, m=D.length;
    for(let i=0;i<m;i++){
      const a=D[i], b=D[(i+1)%m];
      if(a.dx*b.dx+a.dz*b.dz<-0.86)continue;         // straight through: no corner
      const P=j.pts[i], O=j.outer[i];
      const ta=j.trim.get(a.e.id), tb=j.trim.get(b.e.id);
      const pax=-a.dz,paz=a.dx, pbx=-b.dz,pbz=b.dx;
      // footway ends of each approach, plus the solved outer corner between them
      const Fa={x:n.x+a.dx*ta+pax*(a.hw+a.sw+a.vg), z:n.z+a.dz*ta+paz*(a.hw+a.sw+a.vg)};
      const Fb={x:n.x+b.dx*tb-pbx*(b.hw+b.sw+b.vg), z:n.z+b.dz*tb-pbz*(b.hw+b.sw+b.vg)};
      const Ka={x:n.x+a.dx*ta+pax*a.hw, z:n.z+a.dz*ta+paz*a.hw};
      const Kb={x:n.x+b.dx*tb-pbx*b.hw, z:n.z+b.dz*tb-pbz*b.hw};
      flatFan([P,Ka,Fa,O,Fb,Kb],0.19,WALK,.92,.92);
      flatFan([P,Ka,Fa,O,Fb,Kb],0.05,KERB,.72,.8);   // kerb face under the pavement
    }
  }
  return {road:mb.build(),util:um.build()};
}

/*── ZONE OVERLAY MESH ───────────────────────────────────────────────────────*/
function buildZoneMesh(showEmpty){
  const mb=new MeshBuilder();
  for(const l of lots.values()){
    if(!l.zone&&!showEmpty)continue;
    if(l.zone&&l.lvl>0&&!showEmpty)continue;
    const c=l.zone?ZCOL[l.zone]:[.55,.60,.66];
    const a=l.zone?1:.55;
    const w=LOT_W*0.92,d=LOT_D*0.92;
    const cy=Math.cos(l.yaw),sy=Math.sin(l.yaw);
    const q=(lx,lz)=>[l.x+lx*cy+lz*sy, l.z-lx*sy+lz*cy];
    const P=[q(-w/2,-d/2),q(w/2,-d/2),q(w/2,d/2),q(-w/2,d/2)];
    const idc=P.map(p=>mb.vert(p[0],groundY(p[0],p[1])+0.10,p[1],0,1,0,
      mixc(c,[0,0,0],.55),1,a*0.30,.9,0,0));
    mb.quad(idc[0],idc[1],idc[2],idc[3]);
    const bw=0.42;                                    // bright border
    for(let i=0;i<4;i++){
      const p0=P[i],p1=P[(i+1)%4];
      const dx=p1[0]-p0[0],dz=p1[1]-p0[1],L=Math.hypot(dx,dz);
      const nx=-dz/L*bw,nz=dx/L*bw;
      const v=[[p0[0],p0[1]],[p1[0],p1[1]],[p1[0]+nx,p1[1]+nz],[p0[0]+nx,p0[1]+nz]]
        .map(p=>mb.vert(p[0],groundY(p[0],p[1])+0.11,p[1],0,1,0,c,1,a*0.85,.9,0,0));
      mb.quad(v[0],v[1],v[2],v[3]);}
  }
  return mb.build();
}
/*═══════ SIMULATION ═══════════════════════════════════════════════════════*/
const SIM={
  cash:120000, t:0, day:0, hour:8, speed:1, month:0, year:1,
  pop:0, popCap:0, jobs:0, jobsFilled:0, unemp:0, homeless:0,
  powProd:0, powUse:0, watProd:0, watUse:0, sewCap:0, sewUse:0,
  demand:{r:.85,c:.35,i:.45}, happy:.72, income:0, upkeep:0, netIncome:0,
  tax:{r:.09,c:.09,i:.10}, built:0, abandoned:0, traffic:0, avgValue:.3, avgPoll:0,
  edu:.4, health:.5, tier:'HAMLET', history:[]
};
const LVLPOP=[0,4,7,11,16,22], LVLJOB_C=[0,5,9,14,20,28], LVLJOB_I=[0,8,14,22,32,44];
const TIERS=[[0,'HAMLET'],[350,'VILLAGE'],[1200,'TOWN'],[3500,'BOROUGH'],[9000,'CITY'],[20000,'METROPOLIS'],[45000,'MEGALOPOLIS']];

//──── growth / decay of zoned parcels ───────────────────────────────────────
function lotDemand(z){return z===1?SIM.demand.r:z===2?SIM.demand.c:SIM.demand.i;}
function lotServices(l){
  const e=edges.get(l.e); if(!e)return false;
  return l.pow&&l.wat&&l.sew;
}
function updateLotUtilities(){
  // a parcel draws power from the road grid it fronts and water from the pipe
  // under that same road — precisely the Cities-style coupling.
  const powRoots=new Set(), watRoots=new Set(), sewRoots=new Set();
  SIM.powProd=0;SIM.watProd=0;SIM.sewCap=0;
  for(const s of services.values()){
    if(!s.on||s.node==null)continue;
    const d=s.def;
    if(d.power){ let out=d.power;
      if(s.kind==='wind')out=d.power*(0.45+sat((groundY(s.x,s.z)-2)/26)*0.85);
      SIM.powProd+=out; powRoots.add(roadComp.get(s.node)); }
    if(d.water){ SIM.watProd+=d.water;
      const pc=pipeComp.get(s.node); if(pc!==undefined)watRoots.add(pc);
      // a source only pressurises pipe if its own frontage has pipe laid
      }
    if(d.sewage){ SIM.sewCap+=d.sewage;
      const pc=pipeComp.get(s.node); if(pc!==undefined)sewRoots.add(pc); }
  }
  const powOK=SIM.powProd>=SIM.powUse*0.985, watOK=SIM.watProd>=SIM.watUse*0.985,
        sewOK=SIM.sewCap>=SIM.sewUse*0.985;
  for(const l of lots.values()){
    const e=edges.get(l.e); if(!e){l.pow=l.wat=l.sew=false;continue;}
    const rc=roadComp.get(e.a);
    l.pow=powOK&&powRoots.has(rc);
    const pcc=e.pipe?pipeComp.get(e.a):undefined;
    l.wat=watOK&&pcc!==undefined&&watRoots.has(pcc);
    l.sew=sewOK&&pcc!==undefined&&sewRoots.has(pcc);
  }
}
function growthTick(dt){
  const cand=[]; let starving=0;
  for(const l of lots.values()){
    if(l.grow>0&&l.grow<1){l.grow=Math.min(1,l.grow+dt*0.9);}
    if(!l.zone)continue;
    const svc=lotServices(l);
    if(!svc){ l.tPend+=dt;
      if(l.lvl>0&&l.tPend>26){l.lvl=0;l.grow=0;l.abandoned=true;l.pop=0;l.jobs=0;l.filled=0;dirty.zone=1;dirty.build=1;}
      starving++; continue; }
    l.tPend=0;l.abandoned=false;
    if(l.lvl===0)cand.push(l);
    else{ // slow upgrade toward what the land value supports
      l.age+=dt;
      const target=1+Math.floor(sat(l.value*1.35+lotDemand(l.zone)*0.30)*4.4);
      if(l.age>10&&l.lvl<Math.min(5,target)&&lotDemand(l.zone)>0.24){
        l.lvl++;l.age=0;l.grow=0.35;l.mesh=-1;dirty.build=1;}
    }
  }
  SIM.starving=starving;
  if(!cand.length)return;
  // build at a rate proportional to demand — never more than a few per tick
  for(const z of [1,2,3]){
    const d=lotDemand(z); if(d<0.12)continue;
    let budget=Math.ceil(d*7.0);
    for(let k=0;k<cand.length&&budget>0;k++){
      const l=cand[(Math.random()*cand.length)|0];
      if(l.zone!==z||l.lvl>0)continue;
      l.lvl=1+((Math.random()*sat(l.value*2.2)*2.2)|0);
      l.lvl=clamp(l.lvl,1,5); l.grow=0.02; l.mesh=-1; l.age=0;
      SIM.built++; budget--; dirty.build=1; dirty.zone=1;
    }
  }
}

//──── fields: land value, pollution, noise ─────────────────────────────────
function fieldTick(){
  F.poll.fill(0); F.noise.fill(0);
  for(const s of services.values()){
    if(!s.on)continue;
    const k=gidx(s.x,s.z);
    F.poll[k]+=s.def.poll*0.5; F.noise[k]+=s.def.noise*0.4;
  }
  for(const l of lots.values()){
    if(!l.lvl)continue;
    const k=gidx(l.x,l.z);
    if(l.zone===3){F.poll[k]+=1.6+l.lvl*0.55;F.noise[k]+=1.1+l.lvl*0.3;}
    else if(l.zone===2)F.noise[k]+=0.5+l.lvl*0.18;
  }
  for(const e of edges.values()){
    const k=gidx((nodes.get(e.a).x+nodes.get(e.b).x)/2,(nodes.get(e.a).z+nodes.get(e.b).z)/2);
    F.noise[k]+=e.cong*2.4; F.poll[k]+=e.cong*0.9;
  }
  for(let i=0;i<3;i++){diffuse(F.poll,.62,.985);diffuse(F.noise,.55,.972);}
  // land value: amenity from water/greenery, penalised by pollution & noise
  let vs=0,vn=0,ps=0;
  for(let j=0;j<GN;j++)for(let i=0;i<GN;i++){
    const k=j*GN+i, x=-HALF+i*GC+GC/2, z=-HALF+j*GC+GC/2;
    const gy=groundY(x,z);
    let v=0.26+sat((gy-1)/26)*0.13;
    let nearWater=0;
    for(let s=1;s<=4;s++){ if(groundY(x+s*14,z+s*14)<WATER_Y+0.5){nearWater=1-s/5;break;} }
    v+=nearWater*0.26;
    v+=sat(F.value[k])*0.0;
    v-=sat(F.poll[k]*0.055)*0.42;
    v-=sat(F.noise[k]*0.05)*0.16;
    F.value[k]=clamp(v,0.02,1);
    vs+=F.value[k];vn++;ps+=F.poll[k];
  }
  SIM.avgValue=vs/vn; SIM.avgPoll=ps/vn;
  for(const l of lots.values()){
    const k=gidx(l.x,l.z);
    let v=F.value[k];
    if(l.zone===2)v+=0.06;                             // commercial likes footfall
    if(l.zone===3)v=Math.max(0.12,v*0.7+0.10);         // industry cares less
    l.value=lerp(l.value,clamp(v,0.02,1),0.25);
    l.poll=F.poll[k];
  }
}

//──── monthly economy ──────────────────────────────────────────────────────
function statsTick(){
  let pop=0,cap=0,jobs=0,pw=0,wt=0,sw=0,rTax=0,cTax=0,iTax=0,hs=0,hn=0,built=0,ab=0;
  for(const l of lots.values()){
    if(!l.lvl){if(l.abandoned)ab++;continue;}
    built++;
    const q=l.grow>=1?1:l.grow;
    if(l.zone===1){
      const c=LVLPOP[l.lvl]*q; cap+=c; l.pop=c; pop+=c;
      pw+=c*3.1; wt+=c*2.3; sw+=c*2.0;
      rTax+=c*11*SIM.tax.r*(0.55+l.value);
      hs+=l.happy*c; hn+=c;
    }else if(l.zone===2){
      const j=LVLJOB_C[l.lvl]*q; jobs+=j; l.jobs=j;
      pw+=j*4.4; wt+=j*2.9; sw+=j*2.4;
      cTax+=j*15*SIM.tax.c*(0.5+l.value);
    }else{
      const j=LVLJOB_I[l.lvl]*q; jobs+=j; l.jobs=j;
      pw+=j*7.2; wt+=j*5.1; sw+=j*4.6;
      iTax+=j*13*SIM.tax.i*(0.6+l.value*0.5);
    }
  }
  SIM.popCap=cap; SIM.pop=Math.round(lerp(SIM.pop,cap,0.42));
  SIM.jobs=jobs; SIM.built=built; SIM.abandoned=ab;
  SIM.jobsFilled=Math.min(jobs,Math.round(SIM.pop*0.55));
  const wf=Math.max(1,SIM.pop*0.55);
  SIM.unemp=clamp(1-SIM.jobsFilled/wf,0,1);
  SIM.powUse=pw; SIM.watUse=wt; SIM.sewUse=sw;

  let up=0;
  for(const e of edges.values())up+=e.len*RTYPE[e.type].cost*0.035;
  for(const s of services.values())if(s.on)up+=s.def.up;
  SIM.income=rTax+cTax+iTax; SIM.upkeep=up;
  SIM.netIncome=SIM.income-SIM.upkeep;

  // happiness: services, congestion, pollution, employment
  let hap=0.52;
  hap+=0.16*(SIM.powProd>=SIM.powUse?1:-1.4);
  hap+=0.13*(SIM.watProd>=SIM.watUse?1:-1.5);
  hap+=0.11*(SIM.sewCap>=SIM.sewUse?1:-1.5);
  hap-=SIM.traffic*0.22;
  hap-=sat(SIM.avgPoll*0.06)*0.24;
  hap-=SIM.unemp*0.26;
  hap+=sat(SIM.avgValue-0.3)*0.24;
  SIM.happy=clamp(lerp(SIM.happy,clamp(hap,0,1),0.3),0,1);
  for(const l of lots.values())if(l.zone===1&&l.lvl)
    l.happy=clamp(SIM.happy*0.7+l.value*0.4-sat(l.poll*0.05)*0.4,0,1);

  // demand model — the RCI engine
  const jobsPer=SIM.pop>0?SIM.jobs/Math.max(1,SIM.pop*0.55):2;
  SIM.demand.r=clamp(0.28+sat(jobsPer-0.72)*0.9+SIM.happy*0.35-sat(SIM.pop/(SIM.popCap+1)-0.94)*0.2
                     -sat(SIM.unemp-0.1)*1.1,0,1);
  SIM.demand.c=clamp(sat(SIM.pop/900)*0.35+0.16+sat(0.85-jobsPer)*0.55*sat(SIM.pop/220)
                     -sat(SIM.unemp-0.16)*0.5,0,1);
  SIM.demand.i=clamp(0.20+SIM.demand.c*0.55+sat(SIM.unemp-0.05)*0.85-sat(SIM.avgValue-0.55)*0.4,0,1);
  const tp=TIERS.filter(t=>SIM.pop>=t[0]); SIM.tier=tp[tp.length-1][1];
  SIM.history.push({p:SIM.pop,c:SIM.cash,h:SIM.happy}); if(SIM.history.length>240)SIM.history.shift();
}

/*═══════ AGENTS ═══════════════════════════════════════════════════════════
  Two-tier design: aggregate maths drive the economy, while a bounded pool of
  individually-pathed vehicles and pedestrians provides the visible city and
  feeds congestion back into it. Pool size is the perf dial, not population. */
const MAXVEH=1400, MAXPED=1100;
const VEH={n:0,edge:new Int32Array(MAXVEH),s:new Float32Array(MAXVEH),dir:new Int8Array(MAXVEH),
  spd:new Float32Array(MAXVEH),tgt:new Float32Array(MAXVEH),lane:new Float32Array(MAXVEH),
  kind:new Uint8Array(MAXVEH),tint:new Uint8Array(MAXVEH*3),path:[],pi:new Int32Array(MAXVEH),
  wait:new Float32Array(MAXVEH),home:new Int32Array(MAXVEH),dest:new Int32Array(MAXVEH),
  x:new Float32Array(MAXVEH),z:new Float32Array(MAXVEH),y:new Float32Array(MAXVEH),
  yaw:new Float32Array(MAXVEH),brake:new Float32Array(MAXVEH)};
const PED={n:0,edge:new Int32Array(MAXPED),s:new Float32Array(MAXPED),dir:new Int8Array(MAXPED),
  spd:new Float32Array(MAXPED),side:new Int8Array(MAXPED),path:[],pi:new Int32Array(MAXPED),
  tint:new Uint8Array(MAXPED*3),ph:new Float32Array(MAXPED),seedv:new Uint8Array(MAXPED),

//──── A* over the road graph, with an LRU path cache ───────────────────────
const pathCache=new Map(); const PC_MAX=4000;
function findPath(sn,tn){
  if(sn===tn)return [];
  const key=sn*100003+tn; const hit=pathCache.get(key);
  if(hit!==undefined){pathCache.delete(key);pathCache.set(key,hit);return hit;}
  const T=nodes.get(tn); if(!T)return null;
  const open=[sn], g=new Map([[sn,0]]), f=new Map([[sn,0]]), from=new Map();
  const seen=new Set(); let guard=0;
  while(open.length&&guard++<9000){
    let bi=0,bf=1e18;
    for(let i=0;i<open.length;i++){const v=f.get(open[i]);if(v<bf){bf=v;bi=i;}}
    const cur=open.splice(bi,1)[0];
    if(cur===tn){
      const out=[];let c=cur;
      while(from.has(c)){const p=from.get(c);out.push(p.e);c=p.n;}
      out.reverse();
      if(pathCache.size>=PC_MAX)pathCache.delete(pathCache.keys().next().value);
      pathCache.set(key,out);return out;}
    seen.add(cur);
    const N=nodes.get(cur); if(!N)continue;
    for(const eid of N.e){
      const e=edges.get(eid); if(!e)continue;
      const nx=e.a===cur?e.b:e.a;
      if(seen.has(nx))continue;
      const T2=RTYPE[e.type];
      const cost=e.len/T2.speed*(1+e.cong*2.4);
      const ng=g.get(cur)+cost;
      if(g.has(nx)&&ng>=g.get(nx))continue;
      g.set(nx,ng); from.set(nx,{n:cur,e:eid});
      const NN=nodes.get(nx);
      f.set(nx,ng+dist(NN.x,NN.z,T.x,T.z)/16);
      if(!open.includes(nx))open.push(nx);}
  }
  if(pathCache.size>=PC_MAX)pathCache.delete(pathCache.keys().next().value);
  pathCache.set(key,null); return null;
}
function lotNode(l){const e=edges.get(l.e);if(!e)return null;
  return l.s<e.len/2?e.a:e.b;}

//──── spawn / despawn ──────────────────────────────────────────────────────
let resLots=[],workLots=[];
function refreshLotIndex(){
  resLots=[];workLots=[];
  for(const l of lots.values()){
    if(!l.lvl||l.grow<0.9)continue;
    if(l.zone===1)resLots.push(l); else workLots.push(l);}
}
function spawnVehicle(){
  if(VEH.n>=MAXVEH||!resLots.length||!workLots.length)return;
  const a=resLots[(Math.random()*resLots.length)|0], b=workLots[(Math.random()*workLots.length)|0];
  const na=lotNode(a),nb=lotNode(b); if(na==null||nb==null||na===nb)return;
  const p=findPath(na,nb); if(!p||!p.length)return;
  const i=VEH.n++;
  VEH.path[i]=p; VEH.pi[i]=0;
  const e=edges.get(p[0]); if(!e){VEH.n--;return;}
  VEH.edge[i]=p[0]; VEH.dir[i]=e.a===na?1:-1; VEH.s[i]=0;
  const kind=Math.random()<0.055?4:Math.random()<0.09?5:(Math.random()*4)|0;
  VEH.kind[i]=kind;
  const c=PAL.car[(Math.random()*PAL.car.length)|0];
  VEH.tint[i*3]=(c>>16)&255;VEH.tint[i*3+1]=(c>>8)&255;VEH.tint[i*3+2]=c&255;
  VEH.spd[i]=0; VEH.tgt[i]=RTYPE[e.type].speed*(0.82+Math.random()*0.3);
  VEH.lane[i]=1; VEH.wait[i]=0; VEH.brake[i]=0; VEH.dest[i]=nb; VEH.home[i]=na;
}
function killVeh(i){
  const n=--VEH.n; if(i===n){VEH.path[n]=null;return;}
  for(const k of['edge','s','dir','spd','tgt','lane','kind','pi','wait','home','dest','x','z','y','yaw','brake'])
    VEH[k][i]=VEH[k][n];
  VEH.tint[i*3]=VEH.tint[n*3];VEH.tint[i*3+1]=VEH.tint[n*3+1];VEH.tint[i*3+2]=VEH.tint[n*3+2];
  VEH.path[i]=VEH.path[n]; VEH.path[n]=null;
}
function spawnPed(){
  if(PED.n>=MAXPED)return;
  const pool=resLots.length?resLots:workLots; if(!pool.length)return;
  const a=pool[(Math.random()*pool.length)|0];
  const e=edges.get(a.e); if(!e)return;
  const i=PED.n++;
  const dst=(Math.random()<.5?workLots:resLots);
  const b=dst.length?dst[(Math.random()*dst.length)|0]:a;
  const na=lotNode(a),nb=lotNode(b);
  let p=(na!=null&&nb!=null&&na!==nb)?findPath(na,nb):null;
  if(!p||!p.length){PED.edge[i]=a.e;PED.dir[i]=Math.random()<.5?1:-1;PED.path[i]=null;}
  else{PED.path[i]=p;PED.pi[i]=0;PED.edge[i]=p[0];
    const e0=edges.get(p[0]);PED.dir[i]=e0.a===na?1:-1;}
  PED.s[i]=Math.random()*e.len; PED.side[i]=Math.random()<.5?1:-1;
  PED.spd[i]=1.15+Math.random()*0.55; PED.ph[i]=Math.random()*TAU;
  PED.seedv[i]=(Math.random()*32)|0;
  const shirts=[0xd94f4f,0x4f7fd9,0x53b06a,0xd9b24f,0x8a5fd9,0xe0e0e2,0x2f3540,0xd97f3f];
  const c=shirts[(Math.random()*shirts.length)|0];
  PED.tint[i*3]=(c>>16)&255;PED.tint[i*3+1]=(c>>8)&255;PED.tint[i*3+2]=c&255;
}
function killPed(i){
  const n=--PED.n; if(i===n){PED.path[n]=null;return;}
  for(const k of['edge','s','dir','spd','side','pi','ph','seedv','x','z','y','yaw'])PED[k][i]=PED[k][n];
  PED.tint[i*3]=PED.tint[n*3];PED.tint[i*3+1]=PED.tint[n*3+1];PED.tint[i*3+2]=PED.tint[n*3+2];
  PED.path[i]=PED.path[n];PED.path[n]=null;
}

//──── traffic step ─────────────────────────────────────────────────────────
const edgeVeh=new Map();                              // edgeId|dir → sorted indices
function trafficTick(dt){
  edgeVeh.clear();
  for(let i=0;i<VEH.n;i++){
    const k=VEH.edge[i]*2+(VEH.dir[i]>0?0:1);
    let a=edgeVeh.get(k); if(!a){a=[];edgeVeh.set(k,a);} a.push(i);}
  for(const a of edgeVeh.values())a.sort((p,q)=>VEH.s[p]-VEH.s[q]);

  // per-edge congestion from occupancy (decays so it reads as a rolling average)
  for(const e of edges.values()){e.load=0;}
  for(let i=0;i<VEH.n;i++){const e=edges.get(VEH.edge[i]);if(e)e.load++;}
  let tot=0,cnt=0;
  for(const e of edges.values()){
    const cap=Math.max(2,e.len/9*RTYPE[e.type].lanes);
    e.cong=lerp(e.cong,sat(e.load/cap),0.10); tot+=e.cong;cnt++;}
  SIM.traffic=cnt?tot/cnt:0;

  for(const n of nodes.values()){
    if(n.busy>0)n.busy-=dt;
    if(n.e.length>2){n.phT=(n.phT||0)+dt; if(n.phT>11){n.phT=0;n.ph=((n.ph||0)+1)%2;}}
  }
  for(let i=VEH.n-1;i>=0;i--){
    const e=edges.get(VEH.edge[i]);
    if(!e){killVeh(i);continue;}
    const T=RTYPE[e.type];
    let tgt=VEH.tgt[i];
    // car following inside the same edge+direction
    const arr=edgeVeh.get(VEH.edge[i]*2+(VEH.dir[i]>0?0:1));
    if(arr){const k=arr.indexOf(i);
      if(k>=0&&k<arr.length-1){const j=arr[k+1],gap=VEH.s[j]-VEH.s[i];
        const need=5.5+VEH.spd[i]*0.85;
        if(gap<need)tgt=Math.min(tgt,Math.max(0,VEH.spd[j]*(gap/need)-(need-gap)*0.55));}}
    // junction control at the far end
    const rem=e.len-VEH.s[i];
    const endNode=VEH.dir[i]>0?e.b:e.a;
    if(rem<7){
      const N=nodes.get(endNode);
      let stop=false;
      if(N&&N.e.length>2){
        const grp=(N.e.indexOf(e.id))%2;
        if(grp!==(N.ph||0))stop=true;
        if(!stop&&N.busy>0)stop=true;
      } else if(N&&N.busy>0)stop=true;
      if(stop&&rem<4.5)tgt=0;
      else if(stop)tgt=Math.min(tgt,rem*0.7);
      else tgt=Math.min(tgt,4+rem);
    }
    const acc=tgt>VEH.spd[i]?3.4:9.5;
    VEH.spd[i]=Math.max(0,VEH.spd[i]+clamp(tgt-VEH.spd[i],-acc*dt*4,acc*dt));
    VEH.brake[i]=tgt<VEH.spd[i]-0.4?1:lerp(VEH.brake[i],0,dt*5);
    VEH.s[i]+=VEH.spd[i]*dt;
    if(VEH.s[i]>=e.len){
      const N=nodes.get(endNode);
      const p=VEH.path[i]; VEH.pi[i]++;
      if(!p||VEH.pi[i]>=p.length){ // arrived: re-target so the pool stays busy
        const b=Math.random()<0.5?resLots:workLots;
        if(b.length){const dl=b[(Math.random()*b.length)|0],nb=lotNode(dl);
          const np=nb!=null&&nb!==endNode?findPath(endNode,nb):null;
          if(np&&np.length){VEH.path[i]=np;VEH.pi[i]=0;
            const ne=edges.get(np[0]);VEH.edge[i]=np[0];VEH.dir[i]=ne.a===endNode?1:-1;
            VEH.s[i]=0;VEH.tgt[i]=RTYPE[ne.type].speed*(0.82+Math.random()*0.3);
            if(N)N.busy=0.55; continue;}}
        killVeh(i);continue;}
      const ne=edges.get(p[VEH.pi[i]]);
      if(!ne){killVeh(i);continue;}
      VEH.edge[i]=ne.id; VEH.dir[i]=ne.a===endNode?1:-1; VEH.s[i]=0;
      VEH.tgt[i]=RTYPE[ne.type].speed*(0.82+Math.random()*0.3);
      if(N)N.busy=0.5;
    }
    // world transform
    const s=VEH.dir[i]>0?VEH.s[i]:e.len-VEH.s[i];
    const p=edgeAtLen(e,clamp(s,0,e.len));
    const off=(T.lanes>2?T.w*0.25:T.w*0.24)*VEH.dir[i];
    VEH.x[i]=p.x-p.tz*off; VEH.z[i]=p.z+p.tx*off; VEH.y[i]=p.y+0.06;
    VEH.yaw[i]=Math.atan2(p.tx*VEH.dir[i],p.tz*VEH.dir[i]);
  }
  // pedestrians
  for(let i=PED.n-1;i>=0;i--){
    const e=edges.get(PED.edge[i]); if(!e){killPed(i);continue;}
    PED.s[i]+=PED.spd[i]*dt;
    PED.ph[i]+=PED.spd[i]*dt*2.6;
    if(PED.s[i]>=e.len){
      const endNode=PED.dir[i]>0?e.b:e.a, N=nodes.get(endNode);
      const p=PED.path[i];
      if(p){PED.pi[i]++;
        if(PED.pi[i]<p.length){const ne=edges.get(p[PED.pi[i]]);
          if(ne){PED.edge[i]=ne.id;PED.dir[i]=ne.a===endNode?1:-1;PED.s[i]=0;continue;}}
      }
      if(N&&N.e.length){                              // wander onward
        const nid=N.e[(Math.random()*N.e.length)|0], ne=edges.get(nid);
        if(ne){PED.edge[i]=nid;PED.dir[i]=ne.a===endNode?1:-1;PED.s[i]=0;PED.path[i]=null;
               if(Math.random()<0.5)PED.side[i]*=-1; continue;}}
      killPed(i);continue;}
    const s=PED.dir[i]>0?PED.s[i]:e.len-PED.s[i];
    const p=edgeAtLen(e,clamp(s,0,e.len));
    const T=RTYPE[e.type], off=(T.w/2+T.sw*0.55)*PED.side[i];
    PED.x[i]=p.x-p.tz*off; PED.z[i]=p.z+p.tx*off; PED.y[i]=p.y+0.20;
    PED.yaw[i]=Math.atan2(p.tx*PED.dir[i],p.tz*PED.dir[i]);
  }
  // keep the pool sized to what the city can support
  const wantV=clamp(Math.round(SIM.pop*0.16+SIM.jobs*0.06),0,MAXVEH);
  const wantP=clamp(Math.round(SIM.pop*0.13),0,MAXPED);
  let budget=14;
  while(VEH.n<wantV&&budget-->0)spawnVehicle();
  budget=14;
  while(PED.n<wantP&&budget-->0)spawnPed();
  while(VEH.n>wantV+30)killVeh(VEH.n-1);
  while(PED.n>wantP+30)killPed(PED.n-1);
}

// cash settles monthly; everything else refreshes continuously
function budgetTick(months){
  SIM.cash+=SIM.netIncome*months;
  if(SIM.cash<0&&!SIM.warnedBroke){SIM.warnedBroke=1;toast('Treasury in the red — raise taxes or cut upkeep','e','₡');}
  if(SIM.cash>0)SIM.warnedBroke=0;
}

function refreshDyn(){dynBatches=allBatches.filter(b=>b!==A.road&&b!==A.util&&b!==A.zone&&b!==A.prop.pool&&A.terr.indexOf(b)<0);}

function buildAssets(step){
  const tasks=[];
  for(let lvl=1;lvl<=5;lvl++){
    tasks.push(()=>{A.house[lvl]=[];for(let v=0;v<VARIANTS;v++)
      A.house[lvl].push(mkBatch(genHouse(lvl*977+v*131+7,lvl),420));});

      A.shop[lvl].push(mkBatch(genShop(lvl*613+v*241+3,lvl),320));});
    tasks.push(()=>{A.ind[lvl]=[];for(let v=0;v<VARIANTS;v++)
      A.ind[lvl].push(mkBatch(genIndustry(lvl*449+v*317+5,lvl),260));});
  }
  tasks.push(()=>{for(let k=0;k<4;k++)A.veh.push(mkBatch(genCar(1000+k*77,k),MAXVEH));
    A.veh.push(mkBatch(genTruck(2001),300)); A.veh.push(mkBatch(genBus(3001),200));});
  tasks.push(()=>{for(let p=0;p<4;p++)for(let v=0;v<2;v++)
    A.ped.push(mkBatch(genPed(500+v*91,p),MAXPED));});
  tasks.push(()=>{
    A.prop.lamp=mkBatch(genStreetlight(),2600);
    A.prop.tl=mkBatch(genTrafficLight(),900);
    A.prop.pole=mkBatch(genPole(),1400);
    A.prop.hyd=mkBatch(genHydrant(),900);
    const tm=[0,1,2].map(k=>{const mb=new MeshBuilder();tree(mb,0,0,0,1.15+k*0.22,rng(90+k*13),k===2?1:0);return mb.build();});
    A.prop.tree=tm.map(m=>mkBatch(m,3200));
  });
  tasks.push(()=>{
    A.svc.coal=mkBatch(genPowerPlant(),12);
    A.svc.pump=mkBatch(genWaterPump(),24);
    A.svc.tower=mkBatch(genWaterTower(),40);
    A.svc.sewer=mkBatch(genSewage(),20);
    A.svc.wind=[];for(let i=0;i<6;i++)A.svc.wind.push(mkBatch(genWindTurbine(i/6*TAU/3),90));
  });
  tasks.push(()=>{A.terr=buildTerrain().map(m=>{
    const b=mkBatch(m,1);b.push(0,0,0,0,1,1,1,.5,.5,.5,0,0);b.flush();return b;});});
  let i=0;
  return function next(){
    if(i>=tasks.length)return true;
    tasks[i++](); step(i/tasks.length);
    return false;};
}

/*═══════ CAMERA ═══════════════════════════════════════════════════════════*/
const CAM={tx:0,tz:0,ty:0,dist:150,yaw:0.7,pitch:0.92,
  dTx:0,dTz:0,dDist:150,dYaw:0.7,dPitch:0.92,
  ex:0,ey:0,ez:0,fov:47*D2R,near:1.2,far:1900,
  vp:M4.id(),view:M4.id(),proj:M4.id(),invVP:M4.id(),invP:M4.id(),fr:new Frustum()};
function camUpdate(dt){
  CAM.dist=clamp(CAM.dist,14,760);
  CAM.pitch=clamp(CAM.pitch,0.16,1.50);
  CAM.tx=clamp(CAM.tx,-HALF+30,HALF-30); CAM.tz=clamp(CAM.tz,-HALF+30,HALF-30);
  const k=1-Math.exp(-16*dt);
  CAM.dTx=lerp(CAM.dTx,CAM.tx,k); CAM.dTz=lerp(CAM.dTz,CAM.tz,k);
  CAM.dDist=lerp(CAM.dDist,CAM.dist,k); CAM.dYaw=angLerp(CAM.dYaw,CAM.yaw,k);
  CAM.dPitch=lerp(CAM.dPitch,CAM.pitch,k);
  CAM.ty=lerp(CAM.ty,groundY(CAM.dTx,CAM.dTz),1-Math.exp(-6*dt));
  const cp=Math.cos(CAM.dPitch),sp=Math.sin(CAM.dPitch);
  CAM.ex=CAM.dTx+Math.sin(CAM.dYaw)*cp*CAM.dDist;
  CAM.ey=CAM.ty+sp*CAM.dDist;
  CAM.ez=CAM.dTz+Math.cos(CAM.dYaw)*cp*CAM.dDist;
  CAM.near=clamp(CAM.dDist*0.02,0.4,7); CAM.far=CAM.dDist*8+2200;
  M4.persp(CAM.proj,CAM.fov,cv.width/cv.height,CAM.near,CAM.far);
  M4.look(CAM.view,CAM.ex,CAM.ey,CAM.ez,CAM.dTx,CAM.ty,CAM.dTz,0,1,0);
  M4.mul(CAM.vp,CAM.proj,CAM.view);
  M4.inv(CAM.invVP,CAM.vp); M4.inv(CAM.invP,CAM.proj);
  CAM.fr.set(CAM.vp);
}
function screenRay(mx,my){
  const nx=mx/cv.clientWidth*2-1, ny=1-my/cv.clientHeight*2;
  const p=[nx,ny,1,1], o=new Float32Array(4);
  for(let i=0;i<4;i++)o[i]=CAM.invVP[i]*p[0]+CAM.invVP[4+i]*p[1]+CAM.invVP[8+i]*p[2]+CAM.invVP[12+i]*p[3];
  const wx=o[0]/o[3],wy=o[1]/o[3],wz=o[2]/o[3];
  let dx=wx-CAM.ex,dy=wy-CAM.ey,dz=wz-CAM.ez;const l=Math.hypot(dx,dy,dz);
  return {ox:CAM.ex,oy:CAM.ey,oz:CAM.ez,dx:dx/l,dy:dy/l,dz:dz/l};
}
function rayGround(r){                                 // march the heightfield, then refine
  let t=0.1,pt=0,ph=0;
  const maxT=CAM.far;
  let py=r.oy-groundY(r.ox,r.oz);
  for(let i=0;i<220;i++){
    const step=Math.max(1.6,t*0.035);
    const nt=t+step;
    const x=r.ox+r.dx*nt,y=r.oy+r.dy*nt,z=r.oz+r.dz*nt;
    if(Math.abs(x)>HALF+80||Math.abs(z)>HALF+80||nt>maxT)break;
    const h=groundY(x,z), d=y-h;
    if(d<0){
      let lo=t,hi=nt;
      for(let k=0;k<24;k++){const m=(lo+hi)/2;
        const mx2=r.ox+r.dx*m,my=r.oy+r.dy*m,mz=r.oz+r.dz*m;
        if(my-groundY(mx2,mz)<0)hi=m;else lo=m;}
      const m=(lo+hi)/2;
      return {x:r.ox+r.dx*m,y:r.oy+r.dy*m,z:r.oz+r.dz*m,hit:true};}
    t=nt;
  }
  if(Math.abs(r.dy)>1e-4){const m=(0-r.oy)/r.dy;
    if(m>0)return{x:r.ox+r.dx*m,y:0,z:r.oz+r.dz*m,hit:false};}
  return null;
}

/*═══════ SKY / LIGHTING ═══════════════════════════════════════════════════*/
const SUN={dir:new Float32Array(3),col:new Float32Array(3),sky:new Float32Array(3),
  gnd:new Float32Array(3),fog:new Float32Array(3),zen:new Float32Array(3),hor:new Float32Array(3),night:0};
function updateSun(hour){
  const a=(hour/24)*TAU-PI/2;
  const el=Math.sin(a)*0.92+0.06;
  const az=hour*0.26+0.7;
  const d=[Math.cos(az)*Math.max(0.001,Math.cos(a))*0.7, Math.max(-0.35,el), Math.sin(az)*Math.max(0.001,Math.cos(a))*0.7];
  const L=Math.hypot(d[0],d[1],d[2]);
  SUN.dir[0]=d[0]/L;SUN.dir[1]=Math.max(0.045,d[1]/L);SUN.dir[2]=d[2]/L;
  const night=sat((0.10-el)*3.4);
  SUN.night=night;
  const dusk=sat(1-Math.abs(el-0.10)*6.5);
  const day=[2.72,2.55,2.24], gold=[3.10,1.52,0.68], moon=[0.20,0.26,0.46];
  let c=mixc(day,gold,dusk); c=mixc(c,moon,night);
  SUN.col.set(c);
  const zenD=[0.24,0.44,0.86], zenN=[0.020,0.032,0.075];
  const horD=[0.66,0.78,0.93], horN=[0.045,0.060,0.115], horDusk=[0.95,0.55,0.32];
  let z=mixc(zenD,zenN,night), h=mixc(mixc(horD,horDusk,dusk*0.85),horN,night);
  SUN.zen.set(z);SUN.hor.set(h);
  SUN.sky.set(mixc(mixc([0.47,0.58,0.78],[0.56,0.40,0.33],dusk*0.6),[0.21,0.25,0.36],night));
  SUN.gnd.set(mixc([0.27,0.26,0.22],[0.13,0.13,0.15],night));
  SUN.fog.set(mixc(mixc([0.60,0.70,0.85],[0.82,0.56,0.42],dusk*0.7),[0.04,0.05,0.09],night));
}

/*── static prop & vegetation placement ─────────────────────────────────────*/
let props=[], forest=null, forestN=0;
function buildProps(){
  props=[];
  for(const e of edges.values()){
    const T=RTYPE[e.type], hw=T.w/2;
    const nLamp=Math.max(0,Math.floor(e.len/32));
    for(let i=0;i<=nLamp;i++){
      const s=(i+0.5)*(e.len/(nLamp+1)); if(s<6||s>e.len-6)continue;
      const p=edgeAtLen(e,s), sd=(i%2)?1:-1;
      const off=hw+T.sw*0.52;
      props.push({t:0,x:p.x-p.tz*off*sd,y:p.y+0.20,z:p.z+p.tx*off*sd,
        yaw:Math.atan2(p.tz*sd,p.tx*sd)+PI});
    }
    if(e.len>50){const p=edgeAtLen(e,e.len*0.5),off=hw+T.sw*0.35;
      props.push({t:3,x:p.x+p.tz*off,y:p.y+0.2,z:p.z-p.tx*off,yaw:0});}
    // street trees in the verge — every 11 m, both sides, staggered
    const nT=Math.max(0,Math.floor(e.len/11));
    for(let i=0;i<=nT;i++){
      const s=(i+0.5)*(e.len/(nT+1)); if(s<6||s>e.len-6)continue;
      for(const sd of[-1,1]){
        const p=edgeAtLen(e,s), off=(hw+T.sw+T.verge*0.55)*sd;
        const j=(hash2(i*31+(sd>0?7:3),e.id)-0.5)*1.6;
        props.push({t:4,x:p.x-p.tz*off+p.tx*j,y:p.y+0.16,z:p.z+p.tx*off+p.tz*j,
          yaw:hash2(i,sd)*TAU,v:((hash2(i*7,sd*3+e.id)*3)|0)%3,
          sc:0.52+hash2(i*13,sd)*0.30});
      }
    }
  }
  for(const n of nodes.values()){
    if(n.e.length<3)continue;
    const r=nodeRadius(n)+1.4;
    for(const d of nodeDirs(n)){
      const T=RTYPE[d.e.type],hw=T.w/2;
      const px=-d.dz,pz=d.dx;
      props.push({t:1,x:n.x+d.dx*r-px*(hw+T.sw*0.6),y:n.y+0.2,z:n.z+d.dz*r-pz*(hw+T.sw*0.6),
        yaw:Math.atan2(-d.dx,-d.dz)});
    }
  }
}
function buildForest(){
  const list=[];
  for(let i=0;i<9000;i++){
    const x=(Math.random()-0.5)*(MAP-24), z=(Math.random()-0.5)*(MAP-24);
    const y=groundY(x,z); if(y<1.6)continue;
    const d=fbm(x*0.0055+7,z*0.0055+3,4);
    if(Math.random()>d*1.5-0.28)continue;
    list.push(x,y,z,Math.random()*TAU,0.62+Math.random()*0.62,(Math.random()*3)|0);
  }
  forest=new Float32Array(list); forestN=list.length/6;
}
function forestBlocked(x,z){
  for(const e of edges.values()){
    for(const p of e.pts)if(dist2(p.x,p.z,x,z)<420)return true;}
  return false;
}
function pruneForest(){
  const out=[];
  for(let i=0;i<forestN;i++){
    const x=forest[i*6],z=forest[i*6+2];
    let blocked=false;
    for(const l of lots.values())if(dist2(l.x,l.z,x,z)<(LOT_W*0.72)**2){blocked=true;break;}
    if(!blocked)for(const e of edges.values()){
      if(dist2(nodes.get(e.a).x,nodes.get(e.a).z,x,z)>(e.len+40)**2)continue;
      for(const p of e.pts)if(dist2(p.x,p.z,x,z)<340){blocked=true;break;}
      if(blocked)break;}
    if(!blocked)for(const s of services.values())
      if(Math.abs(s.x-x)<s.def.w/2+3&&Math.abs(s.z-z)<s.def.d/2+3){blocked=true;break;}
    if(!blocked)for(let k=0;k<6;k++)out.push(forest[i*6+k]);
  }
  forest=new Float32Array(out); forestN=out.length/6;
}

/*── per-frame instancing (cull + LOD) ──────────────────────────────────────*/
let selLot=null, selSvc=null, hoverLot=null;
const LOD_BLD=340, PED_D=170, VEH_D=520, LAMP_D=300, TREE_D=560;
function ovValue(kind,o){
  switch(overlay){
    case 'power':  return o.pow?1:0;
    case 'water':  return o.wat?1:0;
    case 'sewage': return o.sew?1:0;
    case 'value':  return o.value||0;
    case 'pollution': return sat((o.poll||0)*0.055);
    case 'traffic':return o.cong||0;
    default:return 0;}
}
function populate(dt,timeSec){
  for(const b of dynBatches)b.reset();
  if(A.prop.pool)A.prop.pool.reset();
  const fr=CAM.fr, ex=CAM.ex,ey=CAM.ey,ez=CAM.ez;
  // ── buildings ──
  for(const l of lots.values()){
    if(!l.lvl)continue;
    const d=Math.hypot(l.x-ex,l.z-ez);
    const rad=LOT_W*0.9+8;
    if(!fr.sphere(l.x,l.y+5,l.z,rad))continue;
    const lib=l.zone===1?A.house:l.zone===2?A.shop:A.ind;
    const set=lib[l.lvl]; if(!set)continue;
    if(l.mesh<0)l.mesh=(l.seed>>>3)%set.length;
    const b=set[l.mesh];
    const g=l.grow>=1?1:smooth(sat(l.grow));
    const sy=0.14+g*0.86, sxz=0.55+g*0.45;
    const sel=(selLot===l)?0.45:0;
    const f=ovValue(0,l);
    let t=[0.5,0.5,0.5];
    if(l.abandoned)t=[0.33,0.30,0.28];
    b.push(l.x,l.y,l.z,l.yaw,sxz,sy,sxz,t[0],t[1],t[2],f,sel);
  }
  // ── vehicles ──
  for(let i=0;i<VEH.n;i++){
    const d=Math.hypot(VEH.x[i]-ex,VEH.z[i]-ez);
    if(d>VEH_D)continue;
    if(!fr.sphere(VEH.x[i],VEH.y[i]+1,VEH.z[i],4.6))continue;
    const b=A.veh[VEH.kind[i]]; if(!b)continue;
    b.push(VEH.x[i],VEH.y[i],VEH.z[i],VEH.yaw[i],1,1,1,
      VEH.tint[i*3]/510,VEH.tint[i*3+1]/510,VEH.tint[i*3+2]/510,
      overlay==='traffic'?(edges.get(VEH.edge[i])||{cong:0}).cong:0,
      VEH.brake[i]>0.5?0.12:0);
  }
  // ── citizens ──
  for(let i=0;i<PED.n;i++){
    const d=Math.hypot(PED.x[i]-ex,PED.z[i]-ez);
    if(d>PED_D)continue;
    if(!fr.sphere(PED.x[i],PED.y[i]+0.9,PED.z[i],1.4))continue;
    const pose=((PED.ph[i]/(PI/2))|0)&3;
    const b=A.ped[pose*2+(PED.seedv[i]&1)];
    const bob=Math.abs(Math.sin(PED.ph[i]))*0.035;
    b.push(PED.x[i],PED.y[i]+bob,PED.z[i],PED.yaw[i],1,1,1,
      PED.tint[i*3]/510,PED.tint[i*3+1]/510,PED.tint[i*3+2]/510,0,0);
  }
  // ── props ──
  const lampOn=sat((SUN.night-0.30)*3.0);
  // warm pools of light under the lamps, drawn additively after the opaque pass
  if(lampOn>0.01&&A.prop.pool){
    for(const p of props){
      if(p.t!==0)continue;
      const d=Math.hypot(p.x-ex,p.z-ez); if(d>LAMP_D)continue;
      if(!fr.sphere(p.x,p.y,p.z,11))continue;
      A.prop.pool.push(p.x,p.y+0.02,p.z,p.yaw,1,1,1,.5,.5,.5,0,lampOn*0.052);
    }
  }
  for(const p of props){
    const d=Math.hypot(p.x-ex,p.z-ez);
    if(p.t===4){ if(d>TREE_D)continue; if(!fr.sphere(p.x,p.y+3,p.z,5))continue;
      A.prop.tree[p.v].push(p.x,p.y,p.z,p.yaw,p.sc,p.sc,p.sc,.5,.5,.5,0,0); continue;}
    if(d>LAMP_D)continue;
    if(!fr.sphere(p.x,p.y+4,p.z,9))continue;
    const b=p.t===0?A.prop.lamp:p.t===1?A.prop.tl:p.t===2?A.prop.pole:A.prop.hyd;
    b.push(p.x,p.y,p.z,p.yaw,1,1,1,.5,.5,.5,0,0);
  }
  // ── ambient forest ──
  for(let i=0;i<forestN;i++){
    const x=forest[i*6],y=forest[i*6+1],z=forest[i*6+2];
    const d=Math.hypot(x-ex,z-ez); if(d>TREE_D)continue;
    if(!fr.sphere(x,y+4,z,7))continue;
    const s=forest[i*6+4];
    A.prop.tree[forest[i*6+5]|0].push(x,y,z,forest[i*6+3],s,s,s,.5,.5,.5,0,0);
  }
  // ── service buildings ──
  for(const s of services.values()){
    if(!fr.sphere(s.x,s.y+10,s.z,Math.max(s.def.w,s.def.d)*0.8+22))continue;
    const sel=(selSvc===s)?0.4:0;
    if(s.kind==='wind'){
      const idx=((timeSec*1.9+s.seed*0.37)|0)%6;
      A.svc.wind[idx].push(s.x,s.y,s.z,s.yaw,1,1,1,.5,.5,.5,0,sel);
    }else A.svc[s.kind].push(s.x,s.y,s.z,s.yaw,1,1,1,.5,.5,.5,0,sel);
  }
}

/*── frame ──────────────────────────────────────────────────────────────────*/
function renderScene(pass){
  const isShadow=pass==='shadow';
  const p=isShadow?P.shadow:P.main;
  gl.useProgram(p);
  if(isShadow)gl.uniformMatrix4fv(p.u.uVP,false,lightVP);
  else{
    gl.uniformMatrix4fv(p.u.uVP,false,CAM.vp);
    gl.uniformMatrix4fv(p.u.uLightVP,false,lightVP);
    gl.uniform3f(p.u.uEye,CAM.ex,CAM.ey,CAM.ez);
    gl.uniform3fv(p.u.uSunDir,SUN.dir); gl.uniform3fv(p.u.uSunCol,SUN.col);
    gl.uniform3fv(p.u.uSkyCol,SUN.sky); gl.uniform3fv(p.u.uGndCol,SUN.gnd);
    gl.uniform3fv(p.u.uFogCol,SUN.fog);
    gl.uniform1f(p.u.uFogD,FOGD());
    gl.uniform1f(p.u.uNight,SUN.night); gl.uniform1f(p.u.uTime,STAT.time||0);
    gl.uniform1i(p.u.uOverlay,overlay==='none'?0:1);
    const oc=OVCOL[overlay]||OVCOL.none;
    gl.uniform3fv(p.u.uOvA,oc[0]); gl.uniform3fv(p.u.uOvB,oc[1]);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.shadowT);
    gl.uniform1i(p.u.uShadow,0);
    gl.uniform2f(p.u.uShadowTx,1/SHADOW_SZ,1/SHADOW_SZ);
  }
  if(!isShadow){
    gl.uniform1i(p.u.uOverlay,0);
    drawBatches(A.terr,p);
    if(A.road)drawBatches([A.road],p);
    if(A.zone)drawBatches([A.zone],p);
    if(A.util&&(overlay==='water'||overlay==='sewage'))drawBatches([A.util],p);
    gl.uniform1i(p.u.uOverlay,overlay==='none'?0:1);
  }
  drawBatches(dynBatches,p);
}

//──── snapping / picking ──────────────────────────────────────────────────
function snapPoint(x,z,ignoreAngleFrom){
  let best=null,bd=64;
  for(const n of nodes.values()){const d=dist2(n.x,n.z,x,z);if(d<bd){bd=d;best=n;}}
  if(best)return {x:best.x,z:best.z,node:best};
  // snap onto an existing carriageway → the road gets split there
  let se=null,sbd=1e9,st=0;
  for(const e of edges.values()){
    for(let i=0;i<e.pts.length;i++){const p=e.pts[i];
      const d=dist2(p.x,p.z,x,z);
      if(d<sbd&&d<Math.pow(RTYPE[e.type].w*0.6,2)){sbd=d;se=e;st=p.s;}}}
  if(se)return {x:0,z:0,split:se,s:st,...edgeAtLen(se,st)};
  if(ignoreAngleFrom&&IN.shift){
    const a=Math.atan2(z-ignoreAngleFrom.z,x-ignoreAngleFrom.x);
    const L=dist(x,z,ignoreAngleFrom.x,ignoreAngleFrom.z);
    const q=Math.round(a/(PI/12))*(PI/12);
    return {x:ignoreAngleFrom.x+Math.cos(q)*L,z:ignoreAngleFrom.z+Math.sin(q)*L};
  }
  return {x:Math.round(x/2)*2,z:Math.round(z/2)*2};
}
function pickLot(x,z){
  let best=null,bd=(LOT_W*0.62)**2;
  for(const l of lots.values()){const d=dist2(l.x,l.z,x,z);if(d<bd){bd=d;best=l;}}
  return best;
}
function pickEdge(x,z){
  let best=null,bd=1e9;
  for(const e of edges.values()){
    const w=Math.pow(RTYPE[e.type].w*0.7,2);
    for(const p of e.pts){const d=dist2(p.x,p.z,x,z);if(d<bd&&d<w){bd=d;best=e;}}}
  return best;
}
function pickSvc(x,z){
  for(const s of services.values()){
    const c=Math.cos(-s.yaw),si=Math.sin(-s.yaw);
    const dx=x-s.x,dz=z-s.z;
    const lx=dx*c+dz*si, lz=-dx*si+dz*c;
    if(Math.abs(lx)<s.def.w/2&&Math.abs(lz)<s.def.d/2)return s;}
  return null;
}

//──── road commit ─────────────────────────────────────────────────────────
function roadCost(a,b,ctrl,type){
  let L=0;
  if(ctrl){let px=a.x,pz=a.z;
    for(let i=1;i<=12;i++){const t=i/12,it=1-t;
      const x=a.x*it*it+ctrl.x*2*it*t+b.x*t*t, z=a.z*it*it+ctrl.z*2*it*t+b.z*t*t;
      L+=dist(px,pz,x,z);px=x;pz=z;}}
  else L=dist(a.x,a.z,b.x,b.z);
  return {len:L,cost:Math.round(L*RTYPE[type].cost)};
}
function commitRoad(){
  const T=TOOLS[tool];
  const a=IN.a,b=IN.b,ctrl=IN.ctrl;
  const {len,cost}=roadCost(a,b,ctrl,T.type);
  if(len<9){toast('Segment too short','w','▲');return;}
  if(cost>SIM.cash){toast('Insufficient funds — need '+money(cost),'e','✕');return;}
  const na=a.node||(a.split?splitEdgeAtLen(a.split,a.s):addNode(a.x,a.z));
  const nb=b.node||(b.split?splitEdgeAtLen(b.split,b.s):addNode(b.x,b.z));
  if(!na||!nb||na===nb){toast('Invalid segment','w','▲');return;}
  const made=addRoad(na,nb,T.type,ctrl);
  if(!made.length){toast('A road already runs there','w','▲');return;}
  SIM.cash-=cost;
  dirty.road=dirty.zone=dirty.net=dirty.props=1;
  pathCache.clear();
}

    for(let i=PED.n-1;i>=0;i--)if(PED.edge[i]===e.id)killPed(i);

function onDown(ev){
  cv.setPointerCapture(ev.pointerId);
  IN.down=true;IN.btn=ev.button;IN.dragged=false;IN.lx=ev.clientX;IN.ly=ev.clientY;
  if(ev.button===2||ev.button===1){IN.rot=(ev.button===2);IN.pan=(ev.button===1);return;}
  updateHover(); if(!IN.valid)return;
  const T=TOOLS[tool];
  if(T.cat==='zone'){paintZone();}
  else if(T.cat==='pipe'){paintPipe();}
}
function onMove(ev){
  const dx=ev.clientX-IN.lx, dy=ev.clientY-IN.ly;
  IN.mx=ev.clientX;IN.my=ev.clientY;
  if(IN.down&&(Math.abs(dx)+Math.abs(dy)>3))IN.dragged=true;
  if(IN.down&&IN.rot){
    CAM.yaw-=dx*0.0056; CAM.pitch=clamp(CAM.pitch+dy*0.0042,0.16,1.50);
    IN.lx=ev.clientX;IN.ly=ev.clientY;return;}
  if(IN.down&&IN.pan){
    const k=CAM.dDist*0.0016, c=Math.cos(CAM.dYaw),s=Math.sin(CAM.dYaw);
    CAM.tx-=(dx*c-dy*s)*k; CAM.tz+=(dx*s+dy*c)*k;
    IN.lx=ev.clientX;IN.ly=ev.clientY;return;}
  updateHover();
  if(IN.down&&IN.btn===0&&IN.valid){
    const T=TOOLS[tool];
    if(T.cat==='zone')paintZone();
    else if(T.cat==='pipe')paintPipe();
    else if(T.cat==='bull'&&IN.dragged)bulldoze();
    else if(T.cat==='select'&&IN.dragged){
      const k=CAM.dDist*0.0016,c=Math.cos(CAM.dYaw),s=Math.sin(CAM.dYaw);
      CAM.tx-=(dx*c-dy*s)*k;CAM.tz+=(dx*s+dy*c)*k;
      IN.lx=ev.clientX;IN.ly=ev.clientY;}
  }
}
function onUp(ev){
  const wasDrag=IN.dragged;
  IN.down=false;IN.rot=false;IN.pan=false;
  if(ev.button!==0){
    if(ev.button===2&&!wasDrag&&IN.stage>0){IN.stage=0;IN.a=IN.b=IN.ctrl=null;}
    return;}
  if(!IN.valid)return;
  const T=TOOLS[tool];
  if(T.cat==='road'){
    if(IN.stage===0){IN.a=snapPoint(IN.gx,IN.gz);IN.stage=1;IN.b=IN.a;}
    else if(IN.stage===1){IN.b=snapPoint(IN.gx,IN.gz,IN.a);
      if(T.curve){IN.ctrl={x:(IN.a.x+IN.b.x)/2,z:(IN.a.z+IN.b.z)/2};IN.stage=2;}
      else{commitRoad();IN.a=IN.b?{x:IN.b.x,z:IN.b.z,node:nodes.get(IN.b.node?IN.b.node.id:-1)||null}:null;
        IN.a=snapPoint(IN.b.x,IN.b.z);IN.stage=1;}}
    else{commitRoad();IN.a=snapPoint(IN.b.x,IN.b.z);IN.b=IN.a;IN.ctrl=null;IN.stage=1;}
    return;}
  if(T.cat==='svc'&&!wasDrag){placeSvcAt();return;}
  if(T.cat==='bull'&&!wasDrag){bulldoze();return;}
  if(T.cat==='select'&&!wasDrag){
    const s=pickSvc(IN.gx,IN.gz);
    if(s){selSvc=s;selLot=null;openInspector();return;}
    const l=pickLot(IN.gx,IN.gz);
    if(l){selLot=l;selSvc=null;openInspector();return;}
    const e=pickEdge(IN.gx,IN.gz);
    if(e){selLot=null;selSvc=null;selEdge=e;openInspector();return;}
    selLot=selSvc=selEdge=null;closeInspector();}
}

function camKeys(dt){
  const k=IN.keys, sp=CAM.dDist*1.3*dt*(k.ShiftLeft?2.2:1);
  const c=Math.cos(CAM.dYaw),s=Math.sin(CAM.dYaw);
  let fx=0,fz=0;
  if(k.KeyW||k.ArrowUp)fz-=1; if(k.KeyS||k.ArrowDown)fz+=1;
  if(k.KeyA||k.ArrowLeft)fx-=1; if(k.KeyD||k.ArrowRight)fx+=1;
  if(fx||fz){const l=Math.hypot(fx,fz);fx/=l;fz/=l;
    CAM.tx+=(fx*c-fz*s)*sp; CAM.tz+=(-fx*s-fz*c)*sp;}
  if(k.KeyQ&&toolCat!=='road')CAM.yaw-=dt*1.1;
  if(k.KeyE&&toolCat!=='sewage')CAM.yaw+=dt*1.1;
}

function lightPool(){
  // radial falloff baked into vertex colour so an additive quad reads as a
  // soft pool of lamplight without any per-pixel light maths.
  const mb=new MeshBuilder(), R=4.6, seg=18, warm=[1,.82,.52];
  const c=mb.vert(1.06,0,0,0,1,0,warm,1,0,.9,0,0);
  const ring=[];
  for(let i=0;i<seg;i++){const a=i/seg*TAU;
    ring.push(mb.vert(1.06+Math.cos(a)*R,0,Math.sin(a)*R,0,1,0,[0,0,0],1,0,.9,0,0));}
  for(let i=0;i<seg;i++)mb.tri(c,ring[(i+1)%seg],ring[i]);
  return mb.build();
}

      const {len,cost}=roadCost(a,b,ctrl,T.type);

    const d=SDEF[T.kind], ok=d.cost<=SIM.cash;
    const c=ok?[0.35,1,0.65]:[1,0.3,0.3];
    const cy=Math.cos(svcYaw),sy=Math.sin(svcYaw);
    for(let i=0;i<=10;i++){const t=i/10-0.5;
      for(const s of[-1,1]){
        let lx=t*d.w, lz=s*d.d/2;
        put(IN.gx+lx*cy+lz*sy,IN.gz-lx*sy+lz*cy,1.2,1.2,0.3,c,0.7,svcYaw);
        lx=s*d.w/2; lz=t*d.d;
        put(IN.gx+lx*cy+lz*sy,IN.gz-lx*sy+lz*cy,1.2,1.2,0.3,c,0.7,svcYaw);}}
    PREV.msg=d.name+' · '+money(d.cost);
  } else if((T.cat==='zone'||T.cat==='bull')&&hoverLot){
    const l=hoverLot, c=T.cat==='bull'?[1,.35,.3]:ZCOL[T.z||0];
    const cy=Math.cos(l.yaw),sy=Math.sin(l.yaw);
    for(let i=0;i<=6;i++){const t=i/6-0.5;
      for(const s of[-1,1]){
        let lx=t*LOT_W,lz=s*LOT_D/2;
        put(l.x+lx*cy+lz*sy,l.z-lx*sy+lz*cy,1.1,1.1,0.25,c,0.75,l.yaw);
        lx=s*LOT_W/2;lz=t*LOT_D;
        put(l.x+lx*cy+lz*sy,l.z-lx*sy+lz*cy,1.1,1.1,0.25,c,0.75,l.yaw);}}
  } else if(T.cat==='pipe'&&IN.valid){
    const e=pickEdge(IN.gx,IN.gz);
    if(e)for(const p of e.pts)put(p.x,p.z,2.0,2.0,0.2,T.rm?[1,.4,.3]:[.3,.75,1],0.7);
  }
  if(selLot){const l=selLot,cy=Math.cos(l.yaw),sy=Math.sin(l.yaw);
    for(let i=0;i<=8;i++){const t=i/8-0.5;
      for(const s of[-1,1]){
        let lx=t*LOT_W,lz=s*LOT_D/2;
        put(l.x+lx*cy+lz*sy,l.z-lx*sy+lz*cy,0.9,0.9,0.2,[1,1,1],0.9,l.yaw);
        lx=s*LOT_W/2;lz=t*LOT_D;
        put(l.x+lx*cy+lz*sy,l.z-lx*sy+lz*cy,0.9,0.9,0.2,[1,1,1],0.9,l.yaw);}}}
}

/*═══════ RESIZE ═══════════════════════════════════════════════════════════*/
let renderScale=1;
function resize(){
  const dpr=clamp(window.devicePixelRatio||1,1,2);
  const w=Math.max(2,Math.round(cv.clientWidth*dpr*renderScale));
  const h=Math.max(2,Math.round(cv.clientHeight*dpr*renderScale));
  if(cv.width===w&&cv.height===h)return;
  cv.width=w;cv.height=h;allocRT(w,h);
}
window.addEventListener('resize',()=>{cv.width=0;resize();});

/*═══════ STARTER SETTLEMENT ═══════════════════════════════════════════════*/
function starterCity(){
  const cx=-60,cz=-70;
  const mk=(x1,z1,x2,z2,ty)=>addRoad(addNode(x1,z1),addNode(x2,z2),ty);
  mk(cx-158,cz,cx+158,cz,'avenue');                     // the spine
  for(let i=-2;i<=2;i++)mk(cx+i*63,cz-126,cx+i*63,cz+126,'street');
  for(const zz of[-126,-63,63,126])mk(cx-126,cz+zz,cx+126,cz+zz,'street');
  // service spurs, anchored on nodes that already exist
  mk(cx+158,cz,cx+212,cz+92,'street');
  mk(cx+126,cz-126,cx+164,cz-160,'street');
  for(const e of edges.values()){e.pipe=true;rebuildLots(e);}
  rebuildNetworks();
  placeService('coal',cx+224,cz+112,0.7);
  placeService('tower',cx-20,cz-140,0);
  placeService('sewer',cx+176,cz-176,0.7);
  // find real shoreline and run a spur out to a pumping station
  let sh=null,sd=1e9;
  for(let a=0;a<420;a++){
    const x=-HALF+20+Math.random()*(MAP-40), z=-HALF+20+Math.random()*(MAP-40);
    const y=groundY(x,z);
    if(y<1.0||y>3.2)continue;
    let coast=false;
    for(let k=0;k<8;k++)if(groundY(x+Math.cos(k/8*TAU)*24,z+Math.sin(k/8*TAU)*24)<WATER_Y){coast=true;break;}
    if(!coast)continue;
    const d=dist(x,z,cx,cz); if(d<sd){sd=d;sh=[x,z];}
  }
  if(sh){
    let best=null,bd=1e9;
    for(const n of nodes.values()){const d=dist2(n.x,n.z,sh[0],sh[1]);if(d<bd){bd=d;best=n;}}
    if(best){
      const dx=sh[0]-best.x,dz=sh[1]-best.z,L=Math.hypot(dx,dz)||1;
      const ex=sh[0]-dx/L*16, ez=sh[1]-dz/L*16;
      addRoad(best,addNode(ex,ez),'street');
      for(const e of edges.values()){e.pipe=true;rebuildLots(e);}
      rebuildNetworks();
      placeService('pump',sh[0]-dx/L*6,sh[1]-dz/L*6,Math.atan2(dx,dz));
    }
  }
  rebuildNetworks();
  // zoning: commerce on the spine, industry east, housing everywhere else
  for(const l of lots.values()){
    const e=edges.get(l.e);
    if(l.x>cx+100)l.zone=3;                       // industry to the east
    else if(e&&e.type==='avenue')l.zone=2;        // commerce fronts the spine only
    else l.zone=1;
  }
  SIM.cash=140000;
  CAM.tx=cx;CAM.tz=cz;CAM.dTx=cx;CAM.dTz=cz;CAM.dist=230;CAM.dDist=230;
}

/*═══════ BOOT ════════════════════════════════════════════════════════════*/
const lbf=document.getElementById('lbf'), lt=document.getElementById('lt');
let assetStep=null, booted=false;
function boot(){
  resize();
  buildToolbar(); wire();
  lt.textContent='forging assets…';
  assetStep=buildAssets(p=>{lbf.style.width=(p*76)+'%';});
  requestAnimationFrame(bootStep);
}
function bootStep(){
  const t0=performance.now();
  let done=false;
  while(performance.now()-t0<26&&!done)done=assetStep();
  if(!done){requestAnimationFrame(bootStep);return;}
  lt.textContent='planting terrain…'; lbf.style.width='82%';
  requestAnimationFrame(()=>{
    buildForest();
    lt.textContent='surveying the valley…'; lbf.style.width='90%';
    requestAnimationFrame(()=>{
      A.prop.marker=mkBatch(unitBox(),4200);
      A.prop.pool=mkBatch(lightPool(),2600);
      starterCity();
      rebuildRoadBatch(); rebuildZoneBatch(false); buildProps(); pruneForest();
      rebuildNetworks(); updateLotUtilities(); refreshLotIndex();
      refreshDyn();
      lt.textContent='ready'; lbf.style.width='100%';
      setTimeout(()=>{document.getElementById('load').classList.add('off');
        toast('Welcome to your settlement. Zone, connect, and grow.','g','◆');
        setTimeout(()=>hint('<b>Roads</b> <kbd>Q</kbd> · <b>Zoning</b> <kbd>Z</kbd> · <b>Power</b> <kbd>P</kbd> · <b>Water</b> <kbd>W</kbd> · <b>Sewage</b> <kbd>E</kbd> · <b>Bulldoze</b> <kbd>B</kbd>'),1400);
      },260);
      booted=true; requestAnimationFrame(frame);
    });
  });
}

/*═══════ FRAME ═══════════════════════════════════════════════════════════*/
let prevT=performance.now(), acc=0, fps=60, frames=0, fpsT=0, simAcc=0, monthAcc=0, budgetAcc=0;
let gpuAvg=16;
function frame(now){
  const raw=Math.min(0.1,(now-prevT)/1000); prevT=now;
  frames++; fpsT+=raw;
  if(fpsT>0.5){fps=frames/fpsT;frames=0;fpsT=0;
    // adaptive resolution keeps big cities smooth without touching the sim
    if(fps<44&&renderScale>0.68){renderScale=Math.max(0.68,renderScale-0.07);cv.width=0;resize();}
    else if(fps>58&&renderScale<1){renderScale=Math.min(1,renderScale+0.05);cv.width=0;resize();}}
  const dt=raw;
  STAT.time=(STAT.time||0)+dt;
  camKeys(dt); camUpdate(dt);
  if(!IN.down)updateHover();

  // ── simulation clock: 1 real second ≈ 1 in-game hour at speed 1 ──
  const mul=[0,1,3,9][SIM.speed]||0;
  const sdt=dt*mul;
  if(mul>0){
    SIM.hour+=sdt;
    while(SIM.hour>=24){SIM.hour-=24;SIM.day++;
      if(SIM.day%30===0){SIM.month++;if(SIM.month%12===0)SIM.year++;}}
    simAcc+=sdt;
    if(simAcc>0.5){                                   // sub-daily systems
      growthTick(simAcc*1.0); simAcc=0;
      refreshLotIndex();}
    monthAcc+=sdt;
    if(monthAcc>2){                                   // every two in-game hours
      fieldTick(); updateLotUtilities(); statsTick();
      budgetAcc+=monthAcc; monthAcc=0;
      if(budgetAcc>=720){budgetTick(budgetAcc/720);budgetAcc=0;}}
    trafficTick(Math.min(0.05,dt*Math.min(mul,3)));
  }
  updateSun(SIM.hour);

  // ── deferred rebuilds (never more than one heavy job per frame) ──
  if(dirty.road){rebuildRoadBatch();buildProps();refreshDyn();dirty.road=0;dirty.zone=1;}
  else if(dirty.net){rebuildNetworks();updateLotUtilities();dirty.net=0;}
  else if(dirty.zone){rebuildZoneBatch(toolCat==='zone');refreshDyn();dirty.zone=0;}
  else if(dirty.props){pruneForest();dirty.props=0;}

  populate(dt,STAT.time);
  drawPreview();
  STAT.draws=0;STAT.tris=0;STAT.inst=0;

  // ── shadow ──
  setLightMatrix();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.shadowF);
  gl.viewport(0,0,SHADOW_SZ,SHADOW_SZ);
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.depthFunc(gl.LESS);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE);gl.cullFace(gl.FRONT);
  renderScene('shadow');
  gl.cullFace(gl.BACK);

  // ── main ──
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.colF);
  gl.viewport(0,0,RW,RH);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  // sky
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.CULL_FACE);
  gl.useProgram(P.sky);
  gl.uniformMatrix4fv(P.sky.u.uInvVP,false,CAM.invVP);
  gl.uniform3f(P.sky.u.uEye,CAM.ex,CAM.ey,CAM.ez);
  gl.uniform3fv(P.sky.u.uSunDir,SUN.dir);gl.uniform3fv(P.sky.u.uSunCol,SUN.col);
  gl.uniform3fv(P.sky.u.uZen,SUN.zen);gl.uniform3fv(P.sky.u.uHor,SUN.hor);
  gl.uniform3fv(P.sky.u.uGnd,SUN.gnd);
  gl.uniform1f(P.sky.u.uNight,SUN.night);gl.uniform1f(P.sky.u.uTime,STAT.time);
  drawQuad();
  gl.enable(gl.DEPTH_TEST);gl.depthMask(true);gl.enable(gl.CULL_FACE);
  renderScene('main');
  // additive light pools (lamps at night)
  if(A.prop.pool&&A.prop.pool.count){
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE);gl.depthMask(false);
    gl.useProgram(P.main);
    gl.uniform1i(P.main.u.uOverlay,0);
    A.prop.pool.flush();STAT.tris+=A.prop.pool.draw();STAT.draws++;
    gl.depthMask(true);gl.disable(gl.BLEND);
  }
  // water
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.disable(gl.CULL_FACE);
  gl.useProgram(P.water);
  gl.uniformMatrix4fv(P.water.u.uVP,false,CAM.vp);
  gl.uniform3f(P.water.u.uEye,CAM.ex,CAM.ey,CAM.ez);
  gl.uniform3fv(P.water.u.uSunDir,SUN.dir);gl.uniform3fv(P.water.u.uSunCol,SUN.col);
  gl.uniform3fv(P.water.u.uSkyCol,SUN.sky);gl.uniform3fv(P.water.u.uFogCol,SUN.fog);
  gl.uniform3f(P.water.u.uDeep,0.020,0.075,0.105);
  gl.uniform3f(P.water.u.uShallow,0.075,0.24,0.26);
  gl.uniform1f(P.water.u.uTime,STAT.time);gl.uniform1f(P.water.u.uLvl,WATER_Y);
  gl.uniform1f(P.water.u.uFogD,FOGD());
  gl.uniform2f(P.water.u.uOfs,CAM.dTx,CAM.dTz);
  gl.bindVertexArray(waterVAO);gl.drawArrays(gl.TRIANGLES,0,6);
  gl.disable(gl.BLEND);gl.enable(gl.CULL_FACE);

  // ── post ──
  gl.disable(gl.DEPTH_TEST);gl.depthMask(false);gl.disable(gl.CULL_FACE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.aoF);gl.viewport(0,0,AOW,AOH);
  gl.useProgram(P.ao);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.depT);
  gl.uniform1i(P.ao.u.uDepth,0);
  gl.uniformMatrix4fv(P.ao.u.uInvP,false,CAM.invP);
  gl.uniform2f(P.ao.u.uRes,AOW,AOH);
  gl.uniform1f(P.ao.u.uRad,26);gl.uniform1f(P.ao.u.uNear,CAM.near);gl.uniform1f(P.ao.u.uFar,CAM.far);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b0F);gl.viewport(0,0,BW,BH);
  gl.useProgram(P.bright);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.colT);
  gl.uniform1i(P.bright.u.uT,0);gl.uniform1f(P.bright.u.uThr,1.35);
  drawQuad();
  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b1F);
    gl.useProgram(P.blur);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.b0T);
    gl.uniform1i(P.blur.u.uT,0);gl.uniform2f(P.blur.u.uDir,1.4/BW,0);drawQuad();
    gl.bindFramebuffer(gl.FRAMEBUFFER,RT.b0F);
    gl.bindTexture(gl.TEXTURE_2D,RT.b1T);gl.uniform2f(P.blur.u.uDir,0,1.4/BH);drawQuad();}
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.ldrF);gl.viewport(0,0,RW,RH);
  gl.useProgram(P.comp);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.colT);gl.uniform1i(P.comp.u.uCol,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,RT.aoT);gl.uniform1i(P.comp.u.uAO,1);
  gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,RT.b0T);gl.uniform1i(P.comp.u.uBloom,2);
  gl.uniform2f(P.comp.u.uRes,RW,RH);
  gl.uniform1f(P.comp.u.uExp,0.80+SUN.night*0.50);
  gl.uniform1f(P.comp.u.uNight,SUN.night);
  gl.uniform1f(P.comp.u.uAOStr,0.80);
  gl.uniform1f(P.comp.u.uBloomStr,0.34+SUN.night*0.62);
  gl.uniform1f(P.comp.u.uTime,STAT.time);
  drawQuad();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cv.width,cv.height);
  gl.useProgram(P.fxaa);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,RT.ldrT);
  gl.uniform1i(P.fxaa.u.uT,0);gl.uniform2f(P.fxaa.u.uRes,RW,RH);
  drawQuad();

  // ── HUD ──
  if(now-lastHud>240){lastHud=now;updateHUD();
    document.getElementById('perf').innerHTML=
      '<b>'+fps.toFixed(0)+'</b> fps · '+(renderScale*100|0)+'% · '+STAT.draws+' draws<br>'+
      fmt(STAT.tris)+' tris · '+fmt(STAT.inst)+' instances<br>'+
      VEH.n+' vehicles · '+PED.n+' citizens<br>'+
      fmt(lots.size)+' parcels · '+edges.size+' segments';
  }
  if(PREV.msg&&(TOOLS[tool].cat==='road'||TOOLS[tool].cat==='svc')&&IN.stage>0){}
  requestAnimationFrame(frame);
}
boot();
