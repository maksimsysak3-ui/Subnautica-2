<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Bloop — Character Creator</title>
<style>
:root{
  --bg1:#f4f1ec; --bg2:#e6e1d8; --ink:#1d1d2b; --muted:#6c6a75; --card:#ffffff;
  --line:#e4dfd6; --accent:#ff7a2e; --blue:#3b82f6; --sel:#2f6bff; --panel:#fbf9f6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none}
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;
  background:radial-gradient(120% 90% at 50% 38%,#fffdf9 0%,var(--bg1) 45%,var(--bg2) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#c.drag{cursor:grabbing}
#logo{position:absolute;left:22px;top:14px;font-size:54px;font-weight:900;letter-spacing:-1px;line-height:1;
  transform:rotate(-4deg);text-shadow:0 3px 0 #fff;pointer-events:none}
#logo small{display:block;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0;margin:6px 0 0 6px;transform:rotate(2deg)}
#topbar{position:absolute;right:14px;top:14px;display:flex;gap:8px}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:14px;padding:8px 12px;
  font:inherit;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#emotes{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  max-width:calc(100% - 24px)}
#emotes .btn{padding:7px 10px;font-size:13px}
#bubble{position:absolute;left:0;top:0;pointer-events:none;background:#fff;border:2.5px solid var(--ink);border-radius:18px;
  padding:8px 14px;font-weight:800;font-size:15px;white-space:nowrap;transform:translate(-50%,-100%) scale(0);transform-origin:50% 120%;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);box-shadow:0 3px 0 var(--ink)}
#bubble.show{transform:translate(-50%,-100%) scale(1)}
#bubble:after{content:"";position:absolute;left:50%;bottom:-10px;width:14px;height:14px;background:#fff;border:2.5px solid var(--ink);
  border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
#hint{position:absolute;left:22px;bottom:70px;font-size:12px;color:var(--muted);font-weight:700;pointer-events:none}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-weight:800}
aside{width:400px;flex:none;background:var(--panel);border-left:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 12px 8px}
.tab{border:2px solid transparent;background:#fff;border-radius:12px;padding:9px 2px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:800;
  color:var(--muted);box-shadow:0 2px 0 var(--line)}
.tab.on{border-color:var(--ink);box-shadow:0 3px 0 var(--ink);color:var(--ink)}
#head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 16px 8px}
#head h2{margin:0;font-size:24px;font-weight:900}
#head span{font-size:12px;color:var(--muted);font-weight:700}
#grid{flex:1;overflow:auto;padding:4px 12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.item{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px 4px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .1s,border-color .1s;font:inherit;color:var(--ink)}
.item:hover{transform:translateY(-2px) rotate(-1deg);border-color:#cfc8bb}
.item.on{border-color:var(--sel);box-shadow:0 0 0 3px #2f6bff33;background:#f3f6ff}
.item .th{width:100%;max-width:120px;aspect-ratio:1;display:block}
.item .sw{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);box-shadow:inset -5px -6px 0 #0002}
.item .nm{font-size:12px;padding:0 2px;font-weight:800;text-align:center;line-height:1.15}
#bottom{display:flex;gap:8px;padding:10px 12px 14px;border-top:2px solid var(--line)}
#bottom .btn{flex:1}
@media (max-width:760px){
  #app{flex-direction:column}
  #stage{flex:none;height:54%}
  aside{width:100%;flex:1;border-left:0;border-top:2px solid var(--line)}
  #logo{font-size:36px;left:14px;top:10px}
  #logo small{font-size:11px}
  #topbar{top:10px;right:10px;gap:6px}
  #topbar .btn{padding:6px 9px;font-size:13px}
  #emotes{bottom:8px;gap:4px}
  #emotes .btn{padding:5px 7px;font-size:12px;box-shadow:0 2px 0 var(--ink)}
  #hint{display:none}
  #tabs{grid-template-columns:repeat(5,1fr);gap:4px;padding:8px}
  .tab{font-size:11px;padding:6px 1px}
  #grid{grid-template-columns:repeat(4,1fr);gap:8px}
  #bottom{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="logo">Bloop<small>small bean. big vibes.</small></div>
    <div id="topbar">
      <button class="btn" id="bRand" title="Randomize">Random</button>
      <button class="btn" id="bShot" title="Save a picture">Photo</button>
      <button class="btn" id="bMute" title="Sound">Sound on</button>
    </div>
    <div id="bubble"></div>
    <div id="hint">drag to spin · scroll to zoom · poke Bloop</div>
    <div id="emotes"></div>
    <div id="err"></div>
  </div>
  <aside>
    <nav id="tabs"></nav>
    <div id="head"><h2 id="tabTitle"></h2><span id="tabCount"></span></div>
    <div id="grid"></div>
    <div id="bottom">
      <button class="btn" id="bReset">Classic Bloop</button>
      <button class="btn" id="bRand2">Surprise me</button>
    </div>
  </aside>
</div>
<script>
"use strict";
// =====================================================================
//  Math
// =====================================================================
const TAU = Math.PI * 2, PI = Math.PI;
const V = {
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  cross: (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
};
const M4 = {
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
    return o;
  },
  persp(f, asp, n, fr) { const t = 1/Math.tan(f/2); return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,(fr+n)/(n-fr),-1, 0,0,2*fr*n/(n-fr),0]); },
  ortho(s, n, f) { return new Float32Array([1/s,0,0,0, 0,1/s,0,0, 0,0,-2/(f-n),0, 0,0,-(f+n)/(f-n),1]); },
  lookAt(e, c, u) {
    const z = V.norm(V.sub(e, c)), x = V.norm(V.cross(u, z)), y = V.cross(z, x);
    return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -V.dot(x,e),-V.dot(y,e),-V.dot(z,e),1]);
  },
  // T * Ry * Rx * Rz * S
  trs(p, r, s) {
    const cx = Math.cos(r[0]), sx = Math.sin(r[0]), cy = Math.cos(r[1]), sy = Math.sin(r[1]), cz = Math.cos(r[2]), sz = Math.sin(r[2]);
    const r00 = cy*cz + sy*sx*sz, r01 = -cy*sz + sy*sx*cz, r02 = sy*cx;
    const r10 = cx*sz,            r11 = cx*cz,             r12 = -sx;
    const r20 = -sy*cz + cy*sx*sz, r21 = sy*sz + cy*sx*cz,  r22 = cy*cx;
    return new Float32Array([r00*s[0], r10*s[0], r20*s[0], 0, r01*s[1], r11*s[1], r21*s[1], 0, r02*s[2], r12*s[2], r22*s[2], 0, p[0], p[1], p[2], 1]);
  },
  normalMat(m) {
    const a = [m[0],m[1],m[2]], b = [m[4],m[5],m[6]], c = [m[8],m[9],m[10]];
    const bc = V.cross(b, c), ca = V.cross(c, a), ab = V.cross(a, b), d = V.dot(a, bc) || 1;
    return new Float32Array([bc[0]/d,bc[1]/d,bc[2]/d, ca[0]/d,ca[1]/d,ca[2]/d, ab[0]/d,ab[1]/d,ab[2]/d]);
  },
  xform(m, p) {
    const x = m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12], y = m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],
          z = m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14], w = m[3]*p[0]+m[7]*p[1]+m[11]*p[2]+m[15];
    return [x/w, y/w, z/w];
  },
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sp = (x, e) => Math.sign(x) * Math.pow(Math.abs(x), e);
const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
function hex(c) {
  if (Array.isArray(c)) return c;
  const n = parseInt(c.slice(1), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}
function hsl(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}

// =====================================================================
//  Procedural geometry: everything is a parametric surface
// =====================================================================
// f(u,v) -> [x,y,z]; normals by finite differences, oriented away from inside(u,v).
function surf(nu, nv, f, inside) {
  const data = new Float32Array((nu+1)*(nv+1)*6), idx = new Uint32Array(nu*nv*6), e = 1e-3;
  let k = 0;
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
    const u = i/nu, v = j/nv, p = f(u, v), vv = clamp(v, .004, .996);
    const q = f(u, vv);
    let n = V.cross(V.sub(f(u+e, vv), f(u-e, vv)), V.sub(f(u, vv+e), f(u, vv-e)));
    const out = V.sub(q, inside ? inside(u, vv) : [0, 0, 0]);
    if (Math.hypot(n[0], n[1], n[2]) < 1e-12) n = out;
    n = V.norm(n);
    if (V.dot(n, out) < 0) n = [-n[0], -n[1], -n[2]];
    data.set(p, k); data.set(n, k+3); k += 6;
  }
  k = 0;
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j*(nu+1)+i, b = a+1, c = a+nu+1, d = c+1;
    idx.set([a, c, b, b, c, d], k); k += 6;
  }
  return { data, idx };
}
function superE(e1, e2, u0 = 0, u1 = 1, v0 = 0, v1 = 1, nu = 48, nv = 32) {
  return surf(nu, nv, (u, v) => {
    const th = (u0 + (u1-u0)*u) * TAU, ph = (v0 + (v1-v0)*v) * PI, s = sp(Math.sin(ph), e1);
    return [s*sp(Math.cos(th), e2), sp(Math.cos(ph), e1), s*sp(Math.sin(th), e2)];
  });
}
// prof(v) -> [r, y, zScale]
function lathe(prof, nu = 48, nv = 40, u0 = 0, u1 = 1) {
  return surf(nu, nv, (u, v) => {
    const th = (u0 + (u1-u0)*u) * TAU, [r, y, zs = 1] = prof(v);
    return [r*Math.cos(th), y, r*Math.sin(th)*zs];
  }, (u, v) => [0, prof(v)[1] * 0.5, 0]);
}
function torusGeo(rr, u0 = 0, u1 = 1) {
  const th = u => (u0 + (u1-u0)*u) * TAU;
  return surf(56, 18, (u, v) => {
    const t = th(u), ph = v*TAU, R = 1 + rr*Math.cos(ph);
    return [R*Math.cos(t), rr*Math.sin(ph), R*Math.sin(t)];
  }, u => [Math.cos(th(u)), 0, Math.sin(th(u))]);
}

// ---- Bloop's bean body ----
const DZ = 0.9; // front-to-back squish
function bodyProfile(t) {
  const ph = t * PI, s = Math.sin(ph), c = Math.cos(ph);
  const y = c >= 0 ? 1.12 * sp(c, .8) : 0.98 * sp(c, .55);
  return [0.84 * sp(s, .8) * (1 - 0.07 * y), y];
}
const PROF = []; for (let i = 0; i <= 400; i++) { const t = i/400; PROF.push([t, ...bodyProfile(t)]); }
function bodyT(y) { // profile y is monotonic decreasing in t
  for (let i = 1; i < PROF.length; i++) if (PROF[i][2] <= y) {
    const a = PROF[i-1], b = PROF[i], f = (a[2] - y) / ((a[2] - b[2]) || 1);
    return lerp(a[0], b[0], f);
  }
  return 1;
}
const bodyR = y => bodyProfile(bodyT(clamp(y, -0.979, 1.119)))[0];
// point on body surface at angle th (PI/2 = front), height y, lifted along normal
function at(th, y, lift = 0) {
  const r = bodyR(y), nx = Math.cos(th), nz = Math.sin(th) / DZ, rotY = Math.atan2(nx, nz);
  const drdy = (bodyR(y + .01) - bodyR(y - .01)) / .02, rotX = clamp(Math.atan(drdy), -1.2, 1.2);
  const nl = Math.hypot(nx, nz), c = Math.cos(rotX);
  return { pos: [r*Math.cos(th) + lift*nx/nl*c, y - lift*Math.sin(rotX), r*Math.sin(th)*DZ + lift*nz/nl*c], rot: [rotX, rotY, 0] };
}
const thx = (x, y) => Math.acos(clamp(x / bodyR(y), -0.999, 0.999)); // front angle for a given x
const front = (x, y, lift = 0) => at(thx(x, y), y, lift);

// =====================================================================
//  WebGL2 renderer
// =====================================================================
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: false });

const VS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm;
uniform mat4 uModel, uVP, uLVP; uniform mat3 uNM;
out vec3 vN, vW, vL; out vec4 vS;
void main(){ vec4 w=uModel*vec4(aPos,1.); vW=w.xyz; vL=aPos; vN=uNM*aNrm; vS=uLVP*w; gl_Position=uVP*w; }`;
const FS = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vN, vW, vL; in vec4 vS;
uniform vec3 uColor, uCam, uLight; uniform float uEmit, uAlpha, uGloss, uGrain;
uniform sampler2DShadow uShadow;
out vec4 o;
float h3(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float nz(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float shade(float nl){
  vec3 p=vS.xyz/vS.w*.5+.5;
  if(p.x<0.||p.x>1.||p.y<0.||p.y>1.||p.z>1.) return 1.;
  vec2 tx=1.5/vec2(textureSize(uShadow,0)); float b=.0006+.0025*(1.-clamp(nl,0.,1.)), s=0.;
  for(int x=-2;x<=2;x++) for(int y=-2;y<=2;y++) s+=texture(uShadow,vec3(p.xy+vec2(x,y)*tx,p.z-b));
  return s/25.;
}
void main(){
  vec3 n=normalize(vN);
  vec3 v=normalize(uCam-vW), l=normalize(uLight), base=pow(uColor,vec3(2.2));
  float g=nz(vL*22.)*.6+nz(vL*55.)*.4; base*=1.+uGrain*(g-.5)*.16;
  float nl=dot(n,l), sh=shade(nl);
  vec3 amb=mix(vec3(.42,.36,.34),vec3(.62,.68,.82),n.y*.5+.5)*.62;
  vec3 key=vec3(1.,.95,.86)*smoothstep(-.15,1.,nl)*sh*1.05;
  vec3 col=base*(amb+key);
  float spec=pow(max(dot(n,normalize(l+v)),0.),18.+uGloss*30.)*(.06+uGloss*.22)*sh;
  float rim=pow(1.-max(dot(n,v),0.),3.)*.22;
  col+=spec+rim*mix(vec3(.8,.85,1.),base,.4)*(.4+.6*sh);
  col=mix(col,base*1.15,uEmit);
  col=col/(1.+col*.18);
  col=pow(col,vec3(1./2.2));
  o=vec4(col*uAlpha,uAlpha);
}`;
const DVS = `#version 300 es
layout(location=0) in vec3 aPos; uniform mat4 uModel, uVP; void main(){ gl_Position=uVP*uModel*vec4(aPos,1.); }`;
const DFS = `#version 300 es
precision mediump float; void main(){}`;

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
  return { p, u };
}

const meshCache = new Map();
function M(key, gen) {
  let m = meshCache.get(key);
  if (!m) {
    const g = gen(), vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, g.data, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, g.idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    m = { vao, n: g.idx.length }; meshCache.set(key, m);
  }
  return m;
}
// mesh library
const sph   = () => M('sph', () => superE(1, 1));
const hemi  = (u0 = 0, u1 = 1) => M('hemi' + u0 + u1, () => superE(1, 1, u0, u1, 0, .5, 48, 18));
const bot   = () => M('bot', () => superE(1, 1, 0, 1, .5, 1, 48, 18));
const cyl   = () => M('cyl', () => superE(.2, 1));
const box   = () => M('box', () => superE(.2, .2));
const soft  = () => M('soft', () => superE(.5, .5));
const pill  = () => M('pill', () => superE(.6, 1));
const disk  = () => M('disk', () => superE(.3, 1));
const cone  = () => M('cone', () => lathe(v => v < .92 ? [v/.92, 1 - 2*v/.92] : [(1-v)/.08 * 1, -1], 40, 30));
const tor   = (rr = .12, u0 = 0, u1 = 1) => M(`tor${rr}_${u0}_${u1}`, () => torusGeo(rr, u0, u1));
const bodyM = () => M('body', () => lathe(v => [...bodyProfile(v), DZ], 64, 64));
const shell = (y0, y1, inf = 1.04, u0 = 0, u1 = 1) => M(`sh${y0}_${y1}_${inf}_${u0}_${u1}`, () => {
  const t0 = bodyT(y0), t1 = bodyT(y1);
  return lathe(v => { const [r, y] = bodyProfile(lerp(t0, t1, v)); return [r * inf, y, DZ]; }, 56, 20, u0, u1);
});
const tube = (rin, rout, h) => M(`tube${rin}${rout}${h}`, () => lathe(v => {
  const s = v * 4, k = Math.floor(Math.min(s, 3.999)), f = s - k;
  return [[ [rin, h], [rout, h] ], [ [rout, h], [rout, 0] ], [ [rout, 0], [rin, 0] ], [ [rin, 0], [rin, h] ]][k]
    .reduce((a, b) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f)]);
}, 48, 32));

// scene nodes
function N(o) { return Object.assign({ mesh: null, color: [1, 1, 1], pos: [0, 0, 0], rot: [0, 0, 0], scl: [1, 1, 1], kids: [], alpha: 1, emit: 0, gloss: .6, grain: 1 }, o); }
const S3 = s => typeof s === 'number' ? [s, s, s] : s;
const R3 = r => Array.isArray(r) ? r : [0, 0, 0];
function P(mesh, col, pos = [0, 0, 0], scl = 1, rot = [0, 0, 0], o = {}) {

// smooth tube along a polyline (radius r0 -> r1). nrm: optional per-point "outward" hint, flat < 1 squashes along it (straps)
function tubeGeo(pts, r0, r1, nrm, flat = 1) {
  const n = pts.length, F = [];

  for (let i = 0; i < n; i++) {
    const t = V.norm(V.sub(pts[Math.min(i+1, n-1)], pts[Math.max(i-1, 0)]));
    let N = nrm ? nrm[i] : prev || (Math.abs(t[1]) < .9 ? [0, 1, 0] : [1, 0, 0]);
    const d = V.dot(N, t); N = V.norm([N[0] - t[0]*d, N[1] - t[1]*d, N[2] - t[2]*d]); prev = N;
    F.push([N, V.cross(t, N)]);

    const L = (a, b) => [lerp(a[0], b[0], f), lerp(a[1], b[1], f), lerp(a[2], b[2], f)];
    return [L(pts[k], pts[k+1]), L(F[k][0], F[k+1][0]), L(F[k][1], F[k+1][1]), lerp(r0, r1, clamp(v, 0, 1))]; };
  return surf(14, Math.max(8, n * 2), (u, v) => { const [c, N, B, r] = at(v), a = u * TAU, x = Math.cos(a) * r * flat, y = Math.sin(a) * r;
    return [c[0] + N[0]*x + B[0]*y, c[1] + N[1]*x + B[1]*y, c[2] + N[2]*x + B[2]*y]; }, (u, v) => at(v)[0]);
}

    P(sph(), col, pts[0], r0, 0, o), P(sph(), col, pts[pts.length - 1], r1, 0, o)]);

function strap(cp, w, col, lift = .035, thick = .3) {

// smooth curve through control points (Catmull-Rom) -> points
function curve(cp, n = 24) {

function glasses(lens, frame, noArms) {

  for (const s of [-1, 1]) { const a = front(s*.28, .43, .17); k.push(Grp([lens(s)], a.pos, a.rot)); }
  const b = front(0, .48, .14);
  k.push(P(pill(), frame, b.pos, [.025, .06, .025], [0, 0, PI/2]));
  if (!noArms) for (const s of [-1, 1]) { const a = front(s*.62, .47, .06); k.push(P(pill(), frame, [a.pos[0], a.pos[1], a.pos[2] - .18], [.02, .25, .02], [PI/2, a.rot[1] * .7, 0])); }
  return Grp(k);
}
function mustache(col, y = .2) {
  return Grp([-1, 1].map(s => coil(curve([[0, y + .02, .8], [s*.12, y, .8], [s*.25, y - .02, .77], [s*.33, y - .1, .72]], 14), .075, .035, col, 16, { grain: 2 })));
}
function collar(col, y = -.22) { return P(tor(.06), col, [0, y, 0], [bodyR(y) * 1.035, 1, bodyR(y) * 1.035 * DZ]); }
function shirt(col, extras = [], top = -.22) { return Grp([P(shell(top, -.9, 1.035), col), collar(col, top), P(tor(.05), col, [0, -.9, 0], [bodyR(-.9) * 1.035, 1, bodyR(-.9) * 1.035 * DZ]), ...extras]); }
function bowtie(col, y) { const a = front(0, y, .05); return Grp([-1, 1].map(s => P(cone(), col, [s*.1, 0, 0], [.07, .1, .04], [0, 0, s*PI/2])).concat([P(sph(), col, [0, 0, .01], .045)]), a.pos, a.rot); }
function cape(col, short) {
  const len = short ? 1.05 : 1.3;
  return Grp([
    P(M('cape' + len, () => surf(24, 16, (u, v) => {
      const y = .05 - v * len, th = -PI/2 + (u - .5) * (1.4 + v * .9), r = bodyR(Math.max(y, -.97)) + .06 + v * .14 + Math.sin(u * TAU * 2) * v * .03;

const bloop = { eyes: [], pupils: [], look: [0, 0], blink: 0 };
function buildFace(ex) {
  const k = []; bloop.eyes = []; bloop.pupils = [];
  const MOUTH = '#4a1020', TONGUE = '#ff6f8e';
  for (const s of [-1, 1]) {
    const a = front(s*.28, .42, -.05), eye = Grp([], a.pos, a.rot);
    const big = ex === 'shock' ? 1.1 : 1;
    eye.kids.push(P(sph(), '#ffffff', [0, 0, 0], [.24*big, .28*big, .15], 0, { gloss: 1.6, grain: 0 }));
    const pup = Grp([], [0, 0, 0]);
    let pk = ex === 'shock' ? .55 : ex === 'angry' ? .85 : 1, off = [0, 0];
    if (ex === 'derp') { pk = s < 0 ? 1.1 : .7; off = [-s * .07, s * .04]; }
    if (ex === 'love') pup.kids.push(Grp([heart('#ff2d55', { gloss: 2.5, emit: .15 })], [0, -.01, .14], 0, [.17, .17, .1], { upd: (n, t) => { const p = 1 + Math.max(0, Math.sin(t * 7)) * .18; n.scl = [.17*p, .17*p, .1]; } }));
    else if (ex === 'starry') pup.kids.push(Grp([star(C.gold, { gloss: 3, emit: .2 })], [0, 0, .14], 0, [.15, .15, .1], { upd: (n, t) => { n.rot[2] = Math.sin(t * 3) * .3; } }));
    else {
      pup.kids.push(P(sph(), '#15151c', [off[0], off[1], .1], [.145*pk, .17*pk, .07], 0, { gloss: 2.5, grain: 0 }));
      pup.kids.push(P(sph(), '#ffffff', [off[0] + .045*pk, off[1] + .06*pk, .165], [.035*pk, .035*pk, .02], 0, { emit: .7, grain: 0 }));
    }
    eye.kids.push(pup); bloop.pupils.push(pup);
    if (ex === 'sleepy' || ex === 'smug') eye.kids.push(P(hemi(), 'body', [0, 0, 0], [.255, .3, .165], [ex === 'sleepy' ? 1.25 : .95, 0, 0]));
    if (ex === 'grin') eye.kids.push(P(bot(), 'body', [0, -.03, 0], [.255, .26, .165], [-.75, 0, 0]));
    if (ex === 'angry') eye.kids.push(P(hemi(), 'body', [0, 0, 0], [.255, .3, .165], [.8, 0, s * .45]));
    k.push(eye); bloop.eyes.push(eye);
  }
  // brows
  if (ex === 'angry') for (const s of [-1, 1]) k.push(beads(arc(s*.12, s*.42, .72 - .04, 0, 7, s * -.06), .045, '#1d2a52'));
  if (ex === 'cry' || ex === 'shock') for (const s of [-1, 1]) k.push(beads(arc(s*.14, s*.4, ex === 'cry' ? .77 : .82, -.03, 7, ex === 'cry' ? s*.05 : 0), .035, '#1d2a52'));
  // mouth
  const mouthD = (w, h, tongueOut) => { const a = front(0, .03, -.035); return Grp([
    P(bot(), MOUTH, [0, 0, 0], [w, h, .09], 0, { gloss: 1.5 }),
    P(sph(), TONGUE, tongueOut ? [.08, -h * .95, .05] : [0, -h * .62, .045], tongueOut ? [.1, .14, .06] : [w * .55, h * .32, .05], [0, 0, tongueOut ? .3 : 0]),
  ], a.pos, a.rot); };
  if (ex === 'happy') k.push(mouthD(.2, .21));
  else if (ex === 'starry') k.push(mouthD(.22, .25));
  else if (ex === 'derp') k.push(mouthD(.18, .16, true));
  else if (ex === 'grin' || ex === 'love') k.push(beads(arc(-.2, .2, .07, .1, 13), .035, MOUTH));
  else if (ex === 'smug') k.push(beads(arc(-.16, .2, .05, .05, 11, .045), .032, MOUTH));
  else if (ex === 'angry' || ex === 'cry') k.push(beads(arc(-.15, .15, -.04, -.07, 11), .035, MOUTH));
  else if (ex === 'shock') { const a = front(0, .0, -.03); k.push(P(sph(), MOUTH, a.pos, [.1, .14, .09], a.rot)); }
  else if (ex === 'sleepy') { const a = front(.03, .04, -.02); k.push(P(sph(), MOUTH, a.pos, [.06, .045, .06], a.rot));
    k.push(Grp([0, 1, 2].map(i => Grp([P(soft(), '#7a8bb5', [0, .06, 0], [.06, .012, .012]), P(soft(), '#7a8bb5', [0, 0, 0], [.012, .07, .012], [0, 0, -.75]), P(soft(), '#7a8bb5', [0, -.06, 0], [.06, .012, .012])],
      [0, 0, 0], 0, 1, { upd: (n, t) => { const p = (t * .35 + i / 3) % 1; n.pos = [.5 + p * .5 + Math.sin(p * 8) * .05, .9 + p * .9, .3]; const s = Math.sin(p * PI) * 1.4; n.scl = [s, s, s]; } })))); }
  if (ex === 'cry') for (const s of [-1, 1]) for (let i = 0; i < 3; i++) {
    const a = front(s*.3, .2, .03);
    k.push(P(sph(), '#7cc7ff', a.pos, .05, 0, { alpha: .8, gloss: 4, noShadow: true, upd: (n, t) => { const p = (t * .9 + i / 3) % 1;
      n.pos = [a.pos[0] + s * p * .08, a.pos[1] - p * 1.1, a.pos[2] + .05 + p * .1]; const z = Math.sin(p * PI) * .07; n.scl = [z, z * 1.3, z]; } }));
  }

}

const BODY_Y = 1.32, HIP_Y = BODY_Y - .82;
function makeBloop() {
  const slots = {}; for (const c of ['hat', 'eyes', 'face', 'outfit', 'back', 'hand']) slots[c] = Grp([]);
  slots.hat.pos = [0, HAT_Y, 0];
  const face = Grp([]);
  const arm = s => Grp([P(pill(), 'body', [0, -.2, 0], [.17, .29, .17]), ...(s < 0 ? [Grp([slots.hand], [0, -.43, 0])] : [])], [s*.74, -.05, 0], [0, 0, s*.35]);
  const armL = arm(1), armR = arm(-1);
  const inner = Grp([P(bodyM(), 'body'), face, armL, armR, slots.outfit, slots.back, slots.eyes, slots.face, slots.hat], [0, 1.0, 0]);
  const body = Grp([inner], [0, BODY_Y - 1.0, 0]);
  const shoeL = Grp([]), shoeR = Grp([]);
  const leg = (s, sh) => Grp([P(pill(), 'body', [0, -.24, .02], [.25, .3, .26]), sh], [s*.34, HIP_Y, 0]);
  const legL = leg(1, shoeL), legR = leg(-1, shoeR);
  const root = Grp([legL, legR, body]);
  Object.assign(bloop, { root, body, inner, face, armL, armR, legL, legR, slots, shoeL, shoeR });
}

function apply(cat) {
  if (cat === 'expr' || !cat) { bloop.face.kids = [buildFace(state.expr)]; }
  for (const c of ['hat', 'eyes', 'face', 'outfit', 'back', 'hand']) if (!cat || cat === c) {
    const it = find(c, state[c]); bloop.slots[c].kids = it.build ? [it.build()] : [];
  }
  if (!cat || cat === 'shoes') {
    const it = find('shoes', state.shoes);
    bloop.shoeL.kids = it.build ? [it.build()(1)] : []; bloop.shoeR.kids = it.build ? [it.build()(-1)] : [];
  }
  const col = find('color', state.color);
  bloop.gloss = col.gloss || .6; bloop.alpha = col.alpha || 1;
  // body-colored parts pick up the material of the chosen color
  const walk = n => { if (n.bodyCol) { n.gloss = bloop.gloss; n.alpha = bloop.alpha; } n.kids.forEach(walk); };
  walk(bloop.root);
}
function bodyColor(t) {
  const c = find('color', state.color).c;
  return c === 'rainbow' ? hsl((t * .12) % 1, .85, .6) : hex(c);
}

const EMOTES = [
  { id: 'wave', name: 'Wave', dur: 2.2, quip: "Heyyy bestie!" },
  { id: 'dance', name: 'Dance', dur: 4, quip: "Bean boogie!" },
  { id: 'jump', name: 'Jump', dur: 1.1, quip: "Boing!" },
  { id: 'spin', name: 'Spin', dur: 1.2, quip: "Wheeeee!" },
  { id: 'cheer', name: 'Cheer', dur: 2, quip: "LET'S GOOOO!" },
  { id: 'wiggle', name: 'Wiggle', dur: 1.6, quip: "Jiggle jiggle." },
  { id: 'trip', name: 'Trip', dur: 3, quip: "I'm okay!! I'm okay." },
];
let emote = null, emoteT = 0, boing = 0, boingV = 0;
function playEmote(id) { emote = EMOTES.find(e => e.id === id); emoteT = 0; say(emote.quip); sfx.boop(emote.id === 'trip' ? 180 : 420, emote.id === 'jump' ? 1.8 : 1.3); }
function poseAt(t, dt) {
  const p = { y: 0, rx: 0, ry: 0, rz: 0, sq: 0, aL: .35, aR: -.35, axL: 0, axR: 0, lL: 0, lR: 0, lean: 0 };
  // idle
  p.sq = Math.sin(t * 2.2) * .018; p.aL += Math.sin(t * 1.7) * .06; p.aR -= Math.sin(t * 1.7 + 1) * .06; p.lean = Math.sin(t * .9) * .025;
  if (!emote) return p;
  emoteT += dt;
  const e = emote, T = emoteT, q = T / e.dur, w = Math.min(1, T / .15, (e.dur - T) / .2);
  if (q >= 1) { emote = null; return p; }
  const o = { ...p };
  switch (e.id) {
    case 'wave': o.aR = -2.55 + Math.sin(T * 13) * .35; o.rz = .08; o.aL = .5; o.lean = -.05; break;
    case 'dance': { const b = T * 7.5; o.y = Math.abs(Math.sin(b)) * .18; o.sq = -Math.abs(Math.sin(b)) * .05 + .03; o.rz = Math.sin(b) * .14; o.ry = Math.sin(b * .5) * .5;
      o.aL = 1.2 + Math.sin(b) * 1.0; o.aR = -1.2 + Math.sin(b) * 1.0; o.lL = Math.max(0, Math.sin(b)) * -.6; o.lR = Math.max(0, -Math.sin(b)) * -.6; break; }
    case 'jump': { if (T < .22) { o.sq = T / .22 * .18; } else { const a = (T - .22) / .65; o.y = a < 1 ? Math.sin(a * PI) * 1.3 : 0; o.sq = a < 1 ? -.12 * Math.sin(a * PI) : .18 * Math.max(0, 1 - (a - 1) * 4); o.aL = 2.5; o.aR = -2.5; o.lL = o.lR = -.3; } break; }
    case 'spin': { const a = ease(Math.min(1, T / 1)); o.ry = a * TAU; o.y = Math.sin(a * PI) * .35; o.aL = 1.3; o.aR = -1.3; break; }
    case 'cheer': { const b = T * 9; o.aL = 2.6 + Math.sin(b) * .3; o.aR = -2.6 - Math.sin(b) * .3; o.y = Math.abs(Math.sin(b * .5)) * .25; o.sq = Math.sin(b) * .04; break; }
    case 'wiggle': { o.sq = Math.sin(T * 28) * .09 * (1 - q); o.rz = Math.sin(T * 19) * .1; o.ry = Math.sin(T * 13) * .25; break; }
    case 'trip': {
      const fall = clamp(T / .35, 0, 1), up = clamp((T - 2.2) / .5, 0, 1), f = ease(fall) * (1 - ease(up));
      o.rx = f * 1.45; o.y = f * .78 + Math.sin(up * PI) * .3; o.aL = .35 + f * 2.4; o.aR = -.35 - f * 2.4;
      if (T > .35 && T < 2.2) { o.lL = Math.sin(T * 16) * .6 * f; o.lR = -Math.sin(T * 16) * .6 * f; o.sq = Math.sin(T * 30) * .02; }
      break; }
  }
  for (const k in p) p[k] = lerp(p[k], o[k], k === 'ry' && e.id === 'spin' ? 1 : w);
  return p;
}
function animate(t, dt) {
  const p = poseAt(t, dt);
  // springy "boing" when items change
  boingV += (-boing * 180 - boingV * 9) * dt; boing += boingV * dt;
  const sq = p.sq + boing;
  const b = bloop;
  b.root.pos = [0, p.y, 0]; b.root.rot = [p.rx, p.ry, p.rz];
  b.body.scl = [1 + sq * .55, 1 - sq, 1 + sq * .55]; b.body.rot = [0, 0, p.lean];
  b.armL.rot = [p.axL, 0, p.aL]; b.armR.rot = [p.axR, 0, p.aR];
  b.legL.rot = [p.lL, 0, 0]; b.legR.rot = [p.lR, 0, 0];
  // blink
  b.blink -= dt; if (b.blink < -.14) b.blink = 1.8 + Math.random() * 3.2;
  const bl = b.blink < 0 ? .12 : 1;
  for (const e of b.eyes) e.scl = [1, state.expr === 'love' || state.expr === 'starry' ? 1 : bl, 1];
  // pupils follow cursor
  for (const pp of b.pupils) pp.pos = [b.look[0] * .055, b.look[1] * .05, 0];
}

// =====================================================================
//  Camera + main loop
// =====================================================================
const cam = { yaw: .38, pitch: .1, dist: 6.4, target: [0, 1.3, 0], vyaw: 0, vp: null, eye: null };
const LIGHT = V.norm([.45, 1.0, .85]);
let lastT = performance.now() / 1000, clock = 0;
const stageEl = document.getElementById('stage');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), r = stageEl.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
}
const pedestal = Grp([
  P(cyl(), '#f3ebe0', [0, -.16, 0], [2.3, .16, 2.3], 0, { gloss: .3 }),
  P(tor(.05), '#e8ddcf', [0, -.03, 0], [2.3, 1, 2.3], 0, { gloss: .3 }),
]);
function frame() {
  const now = performance.now() / 1000, dt = Math.min(.05, now - lastT); lastT = now; clock += dt;
  if (!dragging) { cam.yaw += cam.vyaw * dt; cam.vyaw *= Math.pow(.04, dt); }
  animate(clock, dt);
  const W = canvas.width, H = canvas.height, asp = W / H;
  const dist = cam.dist * (asp < 1 ? Math.min(1.7, 1 / asp * .9) : 1);
  const cp = Math.cos(cam.pitch);
  cam.eye = [cam.target[0] + Math.sin(cam.yaw) * cp * dist, cam.target[1] + Math.sin(cam.pitch) * dist + .4, cam.target[2] + Math.cos(cam.yaw) * cp * dist];
  cam.vp = M4.mul(M4.persp(.55, asp, .1, 60), M4.lookAt(cam.eye, cam.target, [0, 1, 0]));
  const list = [], I = M4.trs([0, 0, 0], [0, 0, 0], [1, 1, 1]);
  const bc = bodyColor(clock);
  renderThumbs(clock, LIGHT);
  gather(pedestal, I, list, clock, dt, bc);
  gather(bloop.root, I, list, clock, dt, bc);
  render(list, cam, LIGHT);
  positionBubble();
  if (pendingShot) { pendingShot(); pendingShot = null; }
  requestAnimationFrame(frame);
}

// =====================================================================
//  Item thumbnails: Bloop wearing each item, rendered with the same engine
// =====================================================================
const THUMB = 160, thumbCache = new Map(), thumbQ = [];
const THUMB_VIEW = { // target, distance, yaw, pitch
  hat: [[0, 2.35, 0], 3.3, .45, .12], eyes: [[0, 1.78, 0], 2.3, .35, .02], face: [[0, 1.6, 0], 2.5, .35, .02], expr: [[0, 1.7, 0], 2.5, .3, .02],
  outfit: [[0, 1.25, 0], 4.6, .4, .05], back: [[0, 1.35, 0], 4.6, PI + .7, .1], shoes: [[0, .35, 0], 2.8, .7, .25], hand: [[-.85, .95, .2], 3.0, -.5, .05],
};
function requestThumb(cat, id, cv) {
  const key = cat + ':' + id, done = thumbCache.get(key);
  if (done) { cv.getContext('2d').drawImage(done, 0, 0); return; }
  thumbQ.push({ cat, id, cv, key });
}
function renderThumbs(t, light) {
  if (!thumbQ.length || canvas.height < THUMB || canvas.width < THUMB) return;
  const touched = new Set(), saved = { ...state };
  const I = M4.trs([0, 0, 0], [0, 0, 0], [1, 1, 1]);
  const pose = { pos: bloop.root.pos, rot: bloop.root.rot }; bloop.root.pos = [0, 0, 0]; bloop.root.rot = [0, 0, 0];
  for (let n = 0; n < 6 && thumbQ.length; n++) {
    const job = thumbQ.shift();
    state[job.cat] = job.id; apply(job.cat); touched.add(job.cat);
    for (const e of bloop.eyes) e.scl = [1, 1, 1];
    for (const p of bloop.pupils) p.pos = [0, 0, 0];
    const [tg, d, yaw, pitch] = THUMB_VIEW[job.cat], cp = Math.cos(pitch);
    const eye = [tg[0] + Math.sin(yaw)*cp*d, tg[1] + Math.sin(pitch)*d, tg[2] + Math.cos(yaw)*cp*d];
    const list = []; gather(bloop.root, I, list, t, 0, bodyColor(t));
    render(list, { eye, vp: M4.mul(M4.persp(.6, 1, .1, 60), M4.lookAt(eye, tg, [0, 1, 0])) }, light, THUMB, THUMB);
    const c = document.createElement('canvas'); c.width = c.height = THUMB;
    c.getContext('2d').drawImage(canvas, 0, canvas.height - THUMB, THUMB, THUMB, 0, 0, THUMB, THUMB);
    thumbCache.set(job.key, c);
    if (job.cv.isConnected) job.cv.getContext('2d').drawImage(c, 0, 0);
  }
  Object.assign(state, saved); for (const c of touched) apply(c);
  bloop.root.pos = pose.pos; bloop.root.rot = pose.rot;
}

// =====================================================================
//  Speech bubble, sound
// =====================================================================
const bubble = document.getElementById('bubble');
let bubbleTimer = 0;
function say(text) {
  bubble.textContent = text; bubble.classList.add('show');
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 2400);
}
function headScreen() {
  const m = M4.mul(cam.vp, M4.trs([0, 0, 0], [0, 0, 0], [1, 1, 1]));
  const top = bloop.root.pos[1] + BODY_Y + 1.15 + (state.hat !== 'none' ? .45 : .1);
  const p = M4.xform(m, [0, top, 0]), r = canvas.getBoundingClientRect();
  return [(p[0] * .5 + .5) * r.width, (1 - (p[1] * .5 + .5)) * r.height];
}
function positionBubble() { const [x, y] = headScreen(); bubble.style.left = clamp(x, 120, stageEl.clientWidth - 120) + 'px'; bubble.style.top = Math.max(y, 70) + 'px'; }

const sfx = (() => {
  let ac = null, muted = false;
  try { muted = localStorage.getItem('bloop.mute') === '1'; } catch (e) {}
  const ctx = () => { if (!ac) { const A = window.AudioContext || window.webkitAudioContext; if (A) ac = new A(); } return ac; };
  const tone = (f0, f1, dur, type = 'sine', vol = .15) => {
    if (muted) return; const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
  };
  return {
    boop: (f = 520, r = 1.5) => tone(f, f * r, .14, 'sine', .18),
    pop: () => { tone(900, 300, .08, 'triangle', .12); },
    squeak: () => { tone(700, 1400, .1, 'square', .05); setTimeout(() => tone(1300, 600, .12, 'square', .05), 90); },
    get muted() { return muted; }, set muted(v) { muted = v; try { localStorage.setItem('bloop.mute', v ? '1' : '0'); } catch (e) {} },
  };
})();

// =====================================================================
//  UI
// =====================================================================
const TABS = [
  { id: 'hat', name: 'Hats' }, { id: 'eyes', name: 'Eyewear' }, { id: 'face', name: 'Face' },
  { id: 'outfit', name: 'Outfits' }, { id: 'back', name: 'Back' }, { id: 'shoes', name: 'Shoes' },
  { id: 'hand', name: 'Holding' }, { id: 'color', name: 'Color' }, { id: 'expr', name: 'Mood' },
  { id: 'emote', name: 'Emotes' },
];
let tab = 'hat';
try { const t = localStorage.getItem('bloop.tab'); if (TABS.some(x => x.id === t)) tab = t; } catch (e) {}
const $ = id => document.getElementById(id);
function renderTabs() {
  $('tabs').innerHTML = '';
  for (const t of TABS) {
    const b = document.createElement('button'); b.className = 'tab' + (t.id === tab ? ' on' : ''); b.title = t.name;
    b.textContent = t.name;
    b.onclick = () => { tab = t.id; try { localStorage.setItem('bloop.tab', tab); } catch (e) {} sfx.pop(); renderTabs(); renderGrid(); };
    $('tabs').appendChild(b);
  }
}
function renderGrid() {
  const t = TABS.find(x => x.id === tab), g = $('grid'), list = tab === 'emote' ? EMOTES : ITEMS[tab];
  thumbQ.length = 0;
  $('tabTitle').textContent = t.name; $('tabCount').textContent = tab === 'emote' ? 'tap to play' : tab === 'color' ? `${list.length} colors` : `${list.length} items`;
  g.innerHTML = '';
  for (const it of list) {
    const b = document.createElement('button'); b.className = 'item' + (state[tab] === it.id ? ' on' : '');
    const ic = tab === 'emote' ? '' : tab === 'color'
      ? `<div class="sw" style="background:${it.c === 'rainbow' ? 'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)' : it.c};${it.alpha ? 'opacity:.55' : ''}"></div>`
      : `<canvas class="th" width="${THUMB}" height="${THUMB}"></canvas>`;
    b.innerHTML = `${ic}<div class="nm">${it.name}</div>`;
    b.onclick = () => choose(tab, it.id);
    g.appendChild(b);
    if (THUMB_VIEW[tab]) requestThumb(tab, it.id, b.querySelector('canvas'));
  }
}
function choose(cat, id) {
  if (cat === 'emote') { playEmote(id); return; }
  state[cat] = id; save(); apply(cat);
  boingV = -2.2; sfx.boop(380 + Math.random() * 300);
  say(find(cat, id).quip || '');
  renderGrid();
}
function randomize() {
  const pick = (c, noneOdds) => { const l = ITEMS[c]; if (l[0].id === 'none' && Math.random() < noneOdds) return 'none'; return l[1 + Math.floor(Math.random() * (l.length - 1))]?.id || l[0].id; };
  state = { color: ITEMS.color[Math.floor(Math.random() * ITEMS.color.length)].id, hat: pick('hat', .1), eyes: pick('eyes', .45), face: pick('face', .55),
    outfit: pick('outfit', .3), back: pick('back', .35), shoes: pick('shoes', .3), hand: pick('hand', .35), expr: ITEMS.expr[Math.floor(Math.random() * ITEMS.expr.length)].id };
  save(); apply(); boingV = -3; sfx.squeak();
  say(['New bean, who dis?', 'I am... beautiful?', 'Fashion is my passion!', 'Chaos mode engaged!', "Mom said it's my turn on the outfit."][Math.floor(Math.random() * 5)]);
  renderGrid();
}
$('bRand').onclick = randomize; $('bRand2').onclick = randomize;
$('bReset').onclick = () => { state = { ...DEFAULT }; save(); apply(); boingV = -2.5; sfx.boop(); say("Let's make some friendslop!"); renderGrid(); };
const muteLabel = () => { $('bMute').textContent = sfx.muted ? 'Sound off' : 'Sound on'; };
$('bMute').onclick = () => { sfx.muted = !sfx.muted; muteLabel(); };
muteLabel();
let pendingShot = null;
$('bShot').onclick = () => {
  pendingShot = () => { // composite the transparent render over the stage background
    const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
    const x = c.getContext('2d'), gr = x.createRadialGradient(c.width/2, c.height*.38, 0, c.width/2, c.height*.38, Math.max(c.width, c.height) * .75);
    gr.addColorStop(0, '#fffdf9'); gr.addColorStop(.5, '#f4f1ec'); gr.addColorStop(1, '#e6e1d8'); x.fillStyle = gr; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(canvas, 0, 0);
    const a = document.createElement('a'); a.download = 'bloop.png'; a.href = c.toDataURL('image/png'); a.click();
  };
  sfx.squeak(); say('Say cheese!');
};
for (const e of EMOTES) {
  const b = document.createElement('button'); b.className = 'btn'; b.textContent = e.name; b.onclick = () => playEmote(e.id);
  $('emotes').appendChild(b);
}

// orbit + poke
let dragging = false, lastX = 0, lastY = 0, moved = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove', e => {
  const r = canvas.getBoundingClientRect();
  bloop.look = [clamp(((e.clientX - r.left) / r.width - .5) * 2.4, -1, 1), clamp(-((e.clientY - r.top) / r.height - .4) * 2.4, -1, 1)];
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  cam.yaw -= dx * .008; cam.vyaw = -dx * .5; cam.pitch = clamp(cam.pitch + dy * .005, -.25, .9);
});
const endDrag = e => {
  if (!dragging) return; dragging = false; canvas.classList.remove('drag');
  if (moved < 6) { // poke!
    const r = canvas.getBoundingClientRect(), m = cam.vp;
    const c = M4.xform(m, [0, BODY_Y + bloop.root.pos[1], 0]), tp = M4.xform(m, [0, BODY_Y + 1.2 + bloop.root.pos[1], 0]);
    const cx = (c[0] * .5 + .5) * r.width, cy = (1 - (c[1] * .5 + .5)) * r.height, rad = Math.abs((1 - (tp[1] * .5 + .5)) * r.height - cy);
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (Math.hypot((x - cx) * 1.3, y - cy) < rad * 1.1) {
      const ids = ['jump', 'wiggle', 'spin', 'wave', 'trip', 'cheer', 'dance'];
      playEmote(ids[Math.floor(Math.random() * ids.length)]); boingV = -3;
      say(["Hey! That tickles!", "Boop!", "Wanna be friends?", "I'm squishy!", "Do that again!", "Let's make some friendslop!"][Math.floor(Math.random() * 6)]);
    }
  }
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { bloop.look = [0, 0]; });
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * .001), 3.6, 11); }, { passive: false });
canvas.addEventListener('dblclick', () => { cam.yaw = .38; cam.pitch = .1; cam.dist = 6.4; cam.vyaw = 0; });

// =====================================================================
//  Boot
// =====================================================================
try {
  if (!gl) throw new Error('WebGL2 is not available in this browser.');
  initGL(); makeBloop(); apply();
  renderTabs(); renderGrid();
  new ResizeObserver(resize).observe(stageEl); resize();
  requestAnimationFrame(frame);
  setTimeout(() => say("Let's make some friendslop!"), 500);
  window.__bloop = { state, ITEMS, choose, playEmote, cam };
} catch (err) {
  $('err').style.display = 'flex'; $('err').textContent = 'Bloop could not load: ' + err.message;
  console.error(err);
}
</script>
