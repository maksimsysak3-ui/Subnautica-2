<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recess Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1a;--bg2:#12152b;--card:#171b36;--line:#262b52;--txt:#e8eaff;--mut:#8b90c0;--acc:#7c5cff;--acc2:#22d3ee;--good:#34d399;--bad:#f43f5e;--gold:#fbbf24;--disp:'Russo One',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a1f6b55,transparent),radial-gradient(900px 500px at 110% 10%,#0e5a6b44,transparent),var(--bg);background-attachment:fixed;color:var(--txt);font:15px/1.5 Inter,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}
kbd{font:600 11px var(--mono);background:#0005;border:1px solid #fff3;border-radius:5px;padding:1px 6px}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:12px 28px;background:#0b0d1acc;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--disp);font-size:22px;letter-spacing:1px}.logo span{color:var(--acc2)}
.chips{margin-left:auto;display:flex;gap:10px;align-items:center}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.lv{background:linear-gradient(135deg,var(--acc),#b05cff);color:#fff;border-radius:8px;padding:0 7px;font-family:var(--disp);font-size:13px}
.xpbar{width:90px;height:6px;background:#0008;border-radius:9px;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .6s}
.coin::before{content:'';width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--gold) 50%,#b7791f);display:inline-block;margin-right:6px;vertical-align:-2px}
.iconbtn{background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:16px}

/* home */
main{max-width:1120px;margin:0 auto;padding:28px 20px 40px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;background:linear-gradient(135deg,#1c1846,#10213a);border:1px solid var(--line);border-radius:24px;padding:32px;overflow:hidden}
.hero .kick{color:var(--mut);font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.hero h1{font-family:var(--disp);font-size:40px;line-height:1.15;margin:6px 0 8px}
.hero p{color:var(--mut)}
.name{font:inherit;color:var(--acc2);background:transparent;border:0;border-bottom:2px dashed #22d3ee55;outline:none;min-width:3ch;max-width:14ch}
.name:focus{border-bottom-color:var(--acc2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.stat{background:#0b0d1a80;border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--disp);font-size:22px}
.stat small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.showroom{height:190px;position:relative;border-radius:18px;background:radial-gradient(300px 120px at 50% 100%,#7c5cff33,transparent),#0d1022;border:1px solid var(--line);overflow:hidden}
.showroom .asph{position:absolute;left:0;right:0;bottom:0;height:62px;background:#151936}
.showroom .strip{position:absolute;left:0;right:0;bottom:28px;height:4px;background:repeating-linear-gradient(90deg,#fff5 0 40px,transparent 40px 80px);animation:roll .5s linear infinite}
@keyframes roll{to{background-position:-80px 0}}
.showroom .car{position:absolute;left:50%;bottom:40px;width:190px;transform:translateX(-50%);animation:bob .35s ease-in-out infinite alternate}
.showroom .car svg{width:100%;display:block}
@keyframes bob{to{transform:translateX(-50%) translateY(-2px)}}
.showroom .lbl{position:absolute;top:12px;left:14px;font-size:11px;letter-spacing:.14em;color:var(--mut);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:end;margin:38px 0 14px}
.sec h2{font-family:var(--disp);font-size:24px}.sec span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.game{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.game:hover,.game:focus-visible{transform:translateY(-4px);border-color:#7c5cff99;box-shadow:0 18px 40px -18px #7c5cffcc;outline:none}
.art{height:140px;display:grid;place-items:center;position:relative;overflow:hidden;font:700 26px var(--mono);color:#fff;text-shadow:0 2px 12px #0006}
.art::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 4px);pointer-events:none}
.a1{background:linear-gradient(135deg,#ff3d6e,#7c5cff)}.a2{background:linear-gradient(135deg,#f59e0b,#ef4444)}
.a3{background:linear-gradient(135deg,#0ea5e9,#6366f1)}.a4{background:linear-gradient(135deg,#10b981,#0e7490)}
.caret{display:inline-block;width:3px;height:1em;background:#fff;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fall{position:absolute;font-size:15px;padding:3px 9px;background:#0005;border-radius:7px;animation:drop 3s linear infinite}
@keyframes drop{from{transform:translateY(-70px)}to{transform:translateY(80px)}}
.gbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.gbody h3{font-family:var(--disp);font-size:20px;font-weight:400}
.gbody p{color:var(--mut);font-size:14px;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{white-space:nowrap;font-size:12px;color:var(--mut);background:#0b0d1a;border:1px solid var(--line);padding:3px 9px;border-radius:999px}
.best{white-space:nowrap;font-size:12px;font-weight:700;color:var(--gold)}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;cursor:pointer;transition:border-color .15s}
.slot:hover{border-color:#7c5cff88}
.slot.sel{border-color:var(--acc2);box-shadow:0 0 0 2px #22d3ee33 inset}
.slot svg{width:100%;height:46px}
.slot b{display:block;margin-top:6px;font-size:14px}
.slot small{display:block;color:var(--mut);font-weight:600;font-size:12px}
.slot.locked svg{filter:saturate(.3) brightness(.7)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 20px 40px}
.btn{font-weight:600;font-size:14px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;color:#fff;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,var(--acc),#b05cff)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}

/* play overlay */
#play{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
#play.on{display:flex}
.pbar{display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.pbar h2{font-family:var(--disp);font-size:18px;font-weight:400}
#hud{margin-left:auto;font:600 14px var(--mono);color:var(--mut);display:flex;gap:18px}
#hud b{color:var(--txt)}
#stage{position:relative;flex:1;overflow:auto;padding:24px 20px;max-width:980px;width:100%;margin:0 auto}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:14px}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:120px;color:#fff;text-shadow:0 0 40px var(--acc);pointer-events:none;z-index:4}
.count.pop{animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(1.7);opacity:0}30%{opacity:1}to{transform:scale(1)}}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* race */
.track{display:flex;flex-direction:column;gap:8px;background:#0d1022;border:1px solid var(--line);border-radius:18px;padding:14px}
.lane{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px}
.who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:10px;letter-spacing:.12em;color:var(--mut);font-weight:600}
.lane.me .who b{color:var(--acc2)}
.road{position:relative;height:44px;background:#171b36;border-radius:10px}
.lane.me .road{background:#1d2250;box-shadow:0 0 0 1px #22d3ee33 inset}
.road::before{content:'';position:absolute;left:8px;right:16px;top:50%;border-top:2px dashed #ffffff12}
.road::after{content:'';position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/10px 10px;border-radius:0 10px 10px 0;opacity:.85}
.road .car{position:absolute;left:0;top:8px;width:60px;transition:left .1s linear}
.road .car svg{display:block;width:100%}
.car.boost::before{content:'';position:absolute;left:-20px;top:14px;width:22px;height:7px;border-radius:8px;background:linear-gradient(90deg,transparent,#22d3ee,#fff);animation:flick .08s infinite alternate}
@keyframes flick{to{opacity:.45;width:14px;left:-12px}}
.passage{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;font:500 22px/1.75 var(--mono);color:#5d6296;user-select:none}
.passage .ok{color:var(--txt)}
.passage .cur{background:var(--acc2);color:#0b0d1a;border-radius:3px}
.passage .cur.bad{background:var(--bad);color:#fff}
.mathbox{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
.qn{color:var(--mut);font-size:13px;font-weight:600;letter-spacing:.1em}
.q{font:700 56px var(--mono);letter-spacing:2px;margin:4px 0}
.mathbox input{width:220px;font:700 36px var(--mono);text-align:center;background:#0b0d1a;color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:8px;outline:none}
.mathbox input:focus{border-color:var(--acc)}
.combo{height:28px;margin-top:10px;font-family:var(--disp);color:var(--gold);font-size:18px}

/* siege + quiz */
.arena{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.arena canvas{display:block}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}
.tbar{height:8px;background:#0b0d1a;border-radius:9px;overflow:hidden;margin-bottom:26px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--acc2))}
.quiz small{color:var(--mut);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.country{font-family:var(--disp);font-size:44px;margin:4px 0 24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#0b0d1a;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-weight:600;font-size:18px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--acc)}
.opt.good{background:#34d39926;border-color:var(--good)}
.opt.bad{background:#f43f5e26;border-color:var(--bad)}

/* day trader */
.a5{background:linear-gradient(135deg,#0f172a,#1e3a5f 55%,#065f46)}
.game.feat{grid-column:span 2}.game.feat .art{height:150px}
#stage.wide{max-width:1400px}
.btn.sm{padding:7px 12px;font-size:13px}
.up{color:var(--good)}.dn{color:var(--bad)}
.tr{display:flex;flex-direction:column;gap:12px}
.trtop{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 12px;min-width:96px}
.kpi small{display:block;color:var(--mut);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.kpi b{font:700 15px var(--mono)}
.trctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.seg{display:flex;background:#0b0d1a;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;padding:6px 10px;border-radius:7px;cursor:pointer;color:var(--mut);font-weight:700;font-size:13px}
.seg button.on{background:var(--acc);color:#fff}
#tSide button[data-v=buy].on{background:#059669}#tSide button[data-v=sell].on{background:#e11d48}
#tSide button[data-v=short].on{background:#ea580c}#tSide button[data-v=cover].on{background:#2563eb}
#tSide button.dis:not(.on){opacity:.4}
.trmain{display:grid;grid-template-columns:200px minmax(0,1fr) 270px;gap:12px}
.trbot{display:grid;grid-template-columns:1.15fr .85fr 1.3fr;gap:12px}
.pnl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.pnl h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.wrow{display:grid;grid-template-columns:1fr auto;padding:7px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.wrow:hover{background:#0b0d1a}.wrow.sel{border-color:var(--acc);background:#7c5cff17}
.wrow b{font:700 14px var(--mono)}.wrow small{grid-column:1;color:var(--mut);font-size:11px}
.wrow .px{grid-row:span 2;text-align:right;font:600 13px/1.35 var(--mono)}
.wrow em{font:700 10px var(--mono);font-style:normal;margin-left:6px;padding:1px 5px;border-radius:4px;vertical-align:1px}
.lg{background:#34d39926;color:var(--good)}.sh{background:#f43f5e26;color:var(--bad)}
.chead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.chead h3{font:700 20px var(--mono)}
.chead .qt{font:500 13px var(--mono);color:var(--mut)}.chead .qt b{font-weight:700}
.ptag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#7c5cff2e;color:#c4b5fd}
.how{font-size:12px;color:#fde68a;margin:4px 0 8px}
#tChart canvas{display:block;width:100%}
.ticket label{display:block;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 4px}
.tin{width:100%;background:#0b0d1a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--txt);font:600 15px var(--mono);outline:none}
.tin:focus{border-color:var(--acc)}
.qbtns{display:flex;gap:4px;margin-top:6px}
.qbtns button{flex:1;background:#0b0d1a;border:1px solid var(--line);border-radius:8px;padding:4px 0;font-size:11px;font-weight:600;cursor:pointer;color:var(--mut)}
.qbtns button:hover{color:var(--txt);border-color:var(--acc)}
.est{font-size:12px;color:var(--mut);margin:10px 0;line-height:1.65}.est b{color:var(--txt);font-family:var(--mono)}
.est .th{margin-top:6px;padding:7px 9px;background:#0b0d1a;border-radius:8px;line-height:1.45}
.submit{width:100%}.s-buy{background:#059669}.s-sell{background:#e11d48}.s-short{background:#ea580c}.s-cover{background:#2563eb}
.err{color:#fda4af;font-size:12px;min-height:18px;margin-top:6px;line-height:1.4}
.pnl table{width:100%;border-collapse:collapse;font:500 12px var(--mono)}
.pnl th{color:var(--mut);font:700 10px Inter,sans-serif;text-transform:uppercase;letter-spacing:.08em;text-align:right;padding:4px}
.pnl td{padding:5px 4px;text-align:right;border-top:1px solid var(--line)}
.pnl th:first-child,.pnl td:first-child{text-align:left}
.xbtn{background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--mut);cursor:pointer;padding:2px 7px;font:600 11px Inter,sans-serif}
.xbtn:hover{color:var(--txt);border-color:var(--bad)}
.sd{font-weight:700;font-size:10px}.sd.buy,.sd.cover{color:var(--good)}.sd.sell,.sd.short{color:var(--bad)}
.sum{font-size:12px;color:var(--mut);margin-top:8px}.sum b{font-family:var(--mono)}
.empty{color:var(--mut);font-size:12px;padding:6px 0}
.cal{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.cal div{font-size:12px;display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border:1px dashed var(--line);border-radius:8px}
.cal .done{opacity:.5}
.feed{max-height:240px;overflow:auto;display:flex;flex-direction:column;gap:5px}
.ni{font-size:13px;line-height:1.4;padding:6px 8px;border-radius:8px;background:#0b0d1a;border-left:3px solid transparent}
.ni time{font:600 11px var(--mono);color:var(--mut);margin-right:6px}
.ni .tk{font:700 11px var(--mono);background:#7c5cff33;padding:1px 6px;border-radius:5px;margin-right:6px}
.ni.fill{border-left-color:var(--acc2)}.ni.big{border-left-color:var(--gold)}.ni.new{animation:rise .35s}
.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d1acc;backdrop-filter:blur(6px);z-index:30;animation:fade .25s}
.mcard{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:24px 28px;width:min(660px,94vw);max-height:90vh;overflow:auto;animation:rise .3s}
.mcard .kick{color:var(--acc2);font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase}
.mcard h2{font-family:var(--disp);font-weight:400;font-size:26px;margin:4px 0 10px}
.mcard p,.mcard li{color:#c7cbef;font-size:14.5px;line-height:1.6;margin-bottom:8px}
.mcard ul{padding-left:20px}.mcard b{color:#fff}.mcard .up{color:var(--good)}.mcard .dn{color:var(--bad)}
.mh{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.ill{background:#0b0d1a;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;display:flex;justify-content:center;overflow-x:auto}
.note{background:#fbbf2414;border:1px solid #fbbf2455;border-radius:12px;padding:10px 12px;font-size:13px;color:#fde68a;margin:10px 0;line-height:1.5}
.tnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--acc2)}
.spr{display:flex;gap:8px;align-items:stretch;text-align:center;font-size:12px}
.spr div{padding:10px 16px;border-radius:10px;background:var(--card)}.spr b{font:700 20px var(--mono);display:block}
.spr .gap{background:transparent;color:var(--mut);align-self:center}
.lay{display:grid;grid-template-columns:1fr 2.4fr 1.2fr;grid-template-rows:70px 46px;gap:6px;width:100%;max-width:440px;font-size:11px;font-weight:700;color:var(--mut)}
.lay div{background:var(--card);border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;text-align:center}
.lay .w{grid-column:1/-1;grid-row:2}
.ttab{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.ttab td,.ttab th{border-top:1px solid var(--line);padding:6px;text-align:left;vertical-align:top;color:#c7cbef}
.ttab th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.coachlist{text-align:left;margin:4px 0 14px;padding-left:18px;font-size:13px;color:#c7cbef}.coachlist li{margin-bottom:6px}
.dline{font-size:12px;color:var(--mut);margin-bottom:10px}.dline b{color:var(--txt);font-family:var(--mono)}
@media (max-width:1100px){.trmain,.trbot{grid-template-columns:1fr}.trctl{margin-left:0}}
@media (max-width:560px){.game.feat{grid-column:auto}}

/* results + toasts */
.results{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d1ab3;backdrop-filter:blur(6px);z-index:25;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.res-card{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px 32px;text-align:center;width:min(510px,94%);box-shadow:0 30px 80px -20px #000;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.place{font-family:var(--disp);font-size:56px;line-height:1.1;background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.place.p2{background-image:linear-gradient(135deg,#f1f5f9,#94a3b8)}.place.p3{background-image:linear-gradient(135deg,#fdba74,#b45309)}.place.p4{background-image:linear-gradient(135deg,#94a3b8,#475569)}
.res-card h2{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--mut)}

@media (max-width:760px){
  .top{padding:10px 14px}.xpbar{display:none}
  .hero{grid-template-columns:1fr;padding:22px}.hero h1{font-size:30px}

  .lane{grid-template-columns:72px 1fr}

}

<body>
<header class="top">
  <div class="logo">RECESS<span>.</span>ARCADE</div>
  <div class="chips">
    <div class="chip" title="Level progress"><span class="lv" id="lv">1</span><span class="xpbar"><i id="xpfill"></i></span></div>
    <div class="chip coin" id="coins" title="Coins">0</div>
    <button class="iconbtn" id="snd" title="Toggle sound" aria-label="Toggle sound">🔊</button>
  </div>
</header>

<main>
  <section class="hero">
    <div>
      <div class="kick">Welcome back</div>
      <h1>Ready to race,<br><input class="name" id="name" maxlength="14" spellcheck="false" aria-label="Your racer name"></h1>
      <p>Quick rounds, real skill, no downloads. Every game earns XP and coins you can spend in the garage.</p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="showroom"><span class="lbl">YOUR RIDE</span><div class="asph"></div><div class="strip"></div><div class="car" id="showcar"></div></div>
  </section>

  <div class="sec"><h2>Games</h2><span>Each round takes 1–2 minutes</span></div>
  <div class="grid" id="games"></div>

  <div class="sec"><h2>Garage</h2><span>Spend coins on new paint</span></div>
  <div class="garage" id="garage"></div>
</main>
<footer>Progress saves in this browser · Press <kbd>Esc</kbd> to leave any game</footer>

<div id="play">
  <div class="pbar">
    <button class="btn ghost" id="back">← Arcade</button>
    <h2 id="ptitle"></h2>
    <div id="hud"></div>
  </div>
  <div id="stage"></div>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- data ---------- */
const PASSAGES = [
  "The quick brown fox jumps over the lazy dog, but the dog does not care because it is having a very good nap in the sun.",
  "Every great racer started as a beginner who refused to quit. Keep your eyes on the next word and let your fingers do the rest.",
  "Octopuses have three hearts and blue blood. Two hearts move blood to the gills, while the third pumps it to the rest of the body.",
  "The bell rang, the hallway flooded with students, and somewhere in the chaos a single pencil rolled slowly under a locker.",
  "Honey never spoils. Archaeologists have found pots of honey in ancient tombs that are thousands of years old and still perfectly edible.",
  "A day on Venus is longer than a year on Venus. The planet spins so slowly that it finishes an orbit around the sun first.",
  "Practice does not make perfect; practice makes progress. Type a little faster today than you did yesterday and you are winning.",
  "The lunch line stretched past the trophy case, but nobody minded, because the rumor was true: it was pizza day again.",
  "Sharks existed before trees. They have been swimming in the oceans for around four hundred million years, long before any forest grew.",
  "Your keyboard is a racetrack and every letter is a turn. Stay smooth, stay accurate, and speed will show up on its own.",
  "Bananas are berries, but strawberries are not. Botany has strange rules, and they rarely match what you find in the grocery store.",
  "The moon drifts about four centimeters farther from Earth every year, which is roughly as fast as your fingernails grow."
];
const WORDS = ("apple river storm pixel rocket laser cloud tiger quiet brave light dream orbit comet flame frost ghost jungle knight lemon magic ninja ocean piano quest robot shadow spark thunder unity vivid whale xenon yacht zebra anchor bridge castle dragon engine forest galaxy hammer island jacket kettle ladder marble needle oyster planet quartz rabbit saddle tunnel velvet walnut yellow zipper blanket captain dolphin eclipse falcon gravity harvest iceberg journey kingdom lantern monster nebula octopus penguin quantum rainbow sandwich tornado unicorn volcano warrior asteroid backpack chemistry dinosaur elephant fountain gigantic hurricane invisible labyrinth mountain notebook parachute satellite telescope umbrella waterfall adventure boomerang crocodile dimension explosion microscope playground skateboard thunderstorm").split(' ');
const CAPS = [["France","Paris"],["Japan","Tokyo"],["Canada","Ottawa"],["Australia","Canberra"],["Brazil","Brasília"],["Egypt","Cairo"],["Germany","Berlin"],["Italy","Rome"],["Spain","Madrid"],["Mexico","Mexico City"],["India","New Delhi"],["China","Beijing"],["Russia","Moscow"],["Argentina","Buenos Aires"],["Kenya","Nairobi"],["Nigeria","Abuja"],["South Korea","Seoul"],["Turkey","Ankara"],["Greece","Athens"],["Norway","Oslo"],["Sweden","Stockholm"],["Finland","Helsinki"],["Poland","Warsaw"],["Portugal","Lisbon"],["Ireland","Dublin"],["Netherlands","Amsterdam"],["Belgium","Brussels"],["Switzerland","Bern"],["Austria","Vienna"],["Ukraine","Kyiv"],["Peru","Lima"],["Chile","Santiago"],["Colombia","Bogotá"],["Cuba","Havana"],["Thailand","Bangkok"],["Vietnam","Hanoi"],["Indonesia","Jakarta"],["Philippines","Manila"],["Pakistan","Islamabad"],["Iran","Tehran"],["Saudi Arabia","Riyadh"],["Israel","Jerusalem"],["Morocco","Rabat"],["South Africa","Pretoria"],["Ethiopia","Addis Ababa"],["New Zealand","Wellington"],["Iceland","Reykjavík"],["Hungary","Budapest"],["Czechia","Prague"],["Denmark","Copenhagen"],["Mongolia","Ulaanbaatar"],["Nepal","Kathmandu"],["Jamaica","Kingston"],["Ghana","Accra"],["Venezuela","Caracas"],["Malaysia","Kuala Lumpur"]];
const PAINTS = [["Crimson","#ff3d6e",0],["Cyan","#22d3ee",100],["Lime","#a3e635",150],["Tangerine","#fb923c",200],["Gold","#fbbf24",300],["Violet","#a78bfa",350],["Arctic","#e2e8f0",450],["Midnight","#334155",600]];
const BOT_NAMES = ["TurboTaco","xX_Speedy_Xx","Mr. Keys","NitroNate","LateBus","PencilPusher","HallMonitor","QuietKid","SubZero","CapsLock","GlueStick","RecessKing"];
const BOT_COLORS = ["#f59e0b","#10b981","#6366f1","#ec4899","#94a3b8","#ef4444"];

/* ---------- save state ---------- */
const KEY = 'recess-arcade-v1';
const DEF = { name: 'Player', xp: 0, coins: 0, car: '#ff3d6e', owned: ['#ff3d6e'], best: { type: 0, math: 0, siege: 0, caps: 0, trade: 0 }, plays: 0, sound: true,
  trade: { eq: 10000, days: 0, wins: 0, total: 0, tut: false, coach: true } };
let S;
try { const raw = JSON.parse(localStorage.getItem(KEY)) || {}; S = Object.assign(JSON.parse(JSON.stringify(DEF)), raw); S.best = Object.assign({}, DEF.best, raw.best); S.trade = Object.assign({}, DEF.trade, raw.trade); }
catch (e) { S = JSON.parse(JSON.stringify(DEF)); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

function levelOf(xp) { let l = 1, need = 100; while (xp >= need) { xp -= need; l++; need = Math.round(need * 1.25); } return { l, cur: xp, need }; }
function grant(xp, coins) {
  const before = levelOf(S.xp).l;
  S.xp += xp; S.coins += coins; S.plays++; save(); renderHeader();
  const after = levelOf(S.xp).l;
  if (after > before) { toast(`⬆ Level up! You're now level ${after}`); beep(523, .12, 'triangle', .06); setTimeout(() => beep(784, .2, 'triangle', .06), 120); }
}
function toast(msg, ms = 2600, cls = '') { const t = el('div', 'toast ' + cls, esc(msg)); $('#toasts').appendChild(t); setTimeout(() => t.remove(), ms); }

/* ---------- sound ---------- */
let AC;
function beep(f = 440, d = .06, type = 'square', v = .04) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* ---------- shared helpers ---------- */
function carSVG(c) {
  return `<svg viewBox="0 0 64 30" aria-hidden="true"><ellipse cx="33" cy="28" rx="28" ry="2" fill="#0007"/><path d="M3 21 L7 13 Q9 10 15 10 L29 9 Q35 9 41 14 L55 16 Q61 17 61 21 V24 H3 Z" fill="${c}"/><path d="M3 21 H61 V24 H3Z" fill="#0003"/><path d="M16 12 L27 11.5 L27 15 L12.5 15 Z M30 11.5 Q34 11.5 38 15 L30 15 Z" fill="#cfeaff" opacity=".85"/><circle cx="16" cy="24" r="4.5" fill="#111" stroke="#777" stroke-width="2"/><circle cx="48" cy="24" r="4.5" fill="#111" stroke="#777" stroke-width="2"/><rect x="57" y="17.5" width="4" height="2" rx="1" fill="#ffe08a"/></svg>`;
}
// Tracks every listener/timer/frame a game creates so leaving the game cleans up completely.
function scope() {
  const fns = [];
  return {
    on(t, ev, f, o) { t.addEventListener(ev, f, o); fns.push(() => t.removeEventListener(ev, f, o)); },
    timeout(f, ms) { const id = setTimeout(f, ms); fns.push(() => clearTimeout(id)); },
    raf(f) { let id; const loop = ts => { if (f(ts) !== false) id = requestAnimationFrame(loop); }; id = requestAnimationFrame(loop); fns.push(() => cancelAnimationFrame(id)); },
    stop() { fns.forEach(f => f()); fns.length = 0; }
  };
}
const hud = html => { $('#hud').innerHTML = html; };
function countdown(sc, stage, go) {
  const c = el('div', 'count'); stage.appendChild(c);
  ['3', '2', '1', 'GO!'].forEach((s, i) => sc.timeout(() => {
    c.textContent = s; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    beep(i < 3 ? 440 : 880, .15, 'sine', .07);
  }, i * 700));
  sc.timeout(() => { c.remove(); go(); }, 2500);
}
function makeBots(paceMs) { // times relative to your personal-best pace: rookie slower, rival even, pro faster
  const names = shuffle(BOT_NAMES), cols = shuffle(BOT_COLORS);
  return [[1.35, 'ROOKIE'], [1.0, 'RIVAL'], [.86, 'PRO']].map(([k, label], i) =>
    ({ name: names[i], color: cols[i], label, time: paceMs * k * (.93 + Math.random() * .14), ph: Math.random() * 6 }));
}
function track(stage, bots) {
  const racers = [{ name: S.name || 'You', color: S.car, me: 1 }, ...bots];
  const wrap = el('div', 'track', racers.map(r =>
    `<div class="lane${r.me ? ' me' : ''}"><div class="who"><b>${esc(r.name)}</b><small>${r.me ? 'YOU' : r.label}</small></div><div class="road"><div class="car">${carSVG(r.color)}</div></div></div>`).join(''));
  stage.appendChild(wrap);
  const cars = [...wrap.querySelectorAll('.car')];
  const place = (c, p) => { c.style.left = `calc(${(p * 100).toFixed(2)}% - ${(p * 70).toFixed(1)}px)`; };
  return {
    me: cars[0],
    set(pp, t) {
      place(cars[0], pp);
      bots.forEach((b, i) => { const p = t / b.time; place(cars[i + 1], p >= 1 ? 1 : Math.max(0, p + .01 * Math.sin(t / 450 + b.ph))); });
    },
    placeOf: tp => 1 + bots.filter(b => b.time < tp).length
  };
}
function results(sc, stage, o) {
  const r = el('div', 'results', `<div class="res-card">
    ${o.place ? `<div class="place p${o.place}">${['1st', '2nd', '3rd', '4th'][o.place - 1]}</div>` : ''}
    <h2>${esc(o.title)}</h2>
    <div class="res-stats">${o.stats.map(([k, v]) => `<div><b>${v}</b><small>${k}</small></div>`).join('')}</div>
    ${o.extra || ''}
    ${o.best ? '<div class="newbest">★ New personal best!</div>' : ''}
    <div class="rewards"><span>+${o.xp} XP</span><span class="coin">+${o.coins}</span></div>
    <div class="res-btns"><button class="btn primary" data-a>Play again <kbd>Enter</kbd></button><button class="btn ghost" data-b>Back to arcade</button></div>
  </div>`);
  stage.appendChild(r);
  grant(o.xp, o.coins);
  if (o.place === 1 || o.best) { beep(660, .1, 'triangle', .06); setTimeout(() => beep(990, .18, 'triangle', .06), 110); }
  $('[data-a]', r).onclick = o.again;
  $('[data-b]', r).onclick = closeGame;
  sc.timeout(() => sc.on(window, 'keydown', e => { if (e.key === 'Enter') { e.preventDefault(); o.again(); } }), 500);
}

/* ---------- games ---------- */
const GAMES = {
  type: {
    name: 'Nitro Keys', cls: 'a1', tag: 'Typing race', desc: 'Race three rivals by typing a passage. Mistakes stall you until fixed.',
    art: 'the qui<span class="caret"></span>', best: () => S.best.type ? `${S.best.type} WPM` : '',
    start(stage, again) {
      const sc = scope(), text = pick(PASSAGES), n = text.length;
      const pace = (n / 5) / (S.best.type || 35) * 60000;
      const T = track(stage, makeBots(pace));
      const box = el('div', 'passage', [...text].map(c => `<span>${esc(c)}</span>`).join(''));
      stage.appendChild(box);
      stage.appendChild(el('div', 'hint', 'Just start typing when you see GO. Wrong keys turn red, so fix them to keep moving.'));
      const spans = [...box.children];
      let i = 0, err = 0, t0 = 0, running = false, done = false;
      spans[0].className = 'cur';
      hud('<span><b id="hw">0</b> WPM</span><span><b id="ha">100</b>%</span><span><b id="ht">0.0</b>s</span>');
      countdown(sc, stage, () => { running = true; t0 = performance.now(); });
      sc.on(window, 'keydown', e => {
        if (!running || done || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
        e.preventDefault();
        if (e.key === text[i]) {
          spans[i].className = 'ok'; i++;
          if (i < n) spans[i].className = 'cur'; else finish();
        } else {
          err++; spans[i].classList.add('bad'); beep(160, .05, 'square', .03);
          box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        }
      });
      sc.raf(() => {
        if (!running) return;
        const t = performance.now() - t0;
        T.set(i / n, t);
        $('#hw').textContent = Math.round(i / 5 / Math.max(t / 60000, .05));
        $('#ha').textContent = Math.round(i / Math.max(1, i + err) * 100);
        $('#ht').textContent = (t / 1000).toFixed(1);
        return !done;
      });
      function finish() {
        done = true;
        const t = performance.now() - t0; T.set(1, t);
        const wpm = Math.round(n / 5 / (t / 60000)), acc = Math.round(n / (n + err) * 100), place = T.placeOf(t);
        const best = wpm > S.best.type; if (best) S.best.type = wpm;
        results(sc, stage, { place, title: 'Race finished', best, again,
          stats: [['WPM', wpm], ['Accuracy', acc + '%'], ['Time', (t / 1000).toFixed(1) + 's']],
          xp: Math.round(wpm * acc / 100) + [40, 25, 15, 5][place - 1], coins: [50, 30, 20, 10][place - 1] });
      }
      return sc;
    }
  },
  math: {
    name: 'Math Drift', cls: 'a2', tag: 'Mental math race', desc: 'Every right answer pushes your car forward. Chain answers to hit NITRO.',
    art: '7 × 8 = ?', best: () => S.best.math ? `${S.best.math} APM` : '',
    start(stage, again) {
      const sc = scope(), N = 15, hard = Math.min(levelOf(S.xp).l, 8);
      const T = track(stage, makeBots(N / (S.best.math || 16) * 60000));
      const box = el('div', 'mathbox', '<div class="qn" id="qn"></div><div class="q" id="q">…</div><input id="ans" inputmode="numeric" autocomplete="off" disabled aria-label="Answer"><div class="combo" id="combo"></div>');
      stage.appendChild(box);
      stage.appendChild(el('div', 'hint', 'Answers submit automatically. No Enter needed. Problems get harder as you level up.'));
      const inp = $('#ans'), qEl = $('#q');
      let q, solved = 0, err = 0, combo = 0, lastHit = 0, t0 = 0, running = false, done = false;
      function gen() {
        const ops = hard < 2 ? ['+', '-'] : ['+', '-', '×', '÷'], op = pick(ops); let a, b, ans;
        if (op === '+') { a = rnd(2, 10 + hard * 5); b = rnd(2, 10 + hard * 5); ans = a + b; }
        else if (op === '-') { a = rnd(6, 15 + hard * 6); b = rnd(1, a); ans = a - b; }
        else if (op === '×') { a = rnd(2, 5 + hard); b = rnd(2, 12); ans = a * b; }
        else { b = rnd(2, 12); ans = rnd(2, 5 + hard); a = b * ans; }
        q = { s: `${a} ${op} ${b}`, ans: String(ans) };
        qEl.textContent = q.s; $('#qn').textContent = `PROBLEM ${solved + 1} / ${N}`;
      }
      sc.on(inp, 'input', () => {
        if (!running || done) return;
        const v = inp.value.replace(/\D/g, ''); inp.value = v;
        if (v === q.ans) {
          solved++; const now = performance.now();
          combo = now - lastHit < 3500 ? combo + 1 : 1; lastHit = now;
          beep(500 + Math.min(combo, 10) * 45, .06, 'triangle', .05);
          $('#combo').textContent = combo >= 3 ? `NITRO ×${combo}` : '';
          T.me.classList.toggle('boost', combo >= 3);
          inp.value = '';
          if (solved === N) finish(); else gen();
        } else if (v.length >= q.ans.length) {
          err++; combo = 0; $('#combo').textContent = ''; T.me.classList.remove('boost'); beep(150, .08, 'sawtooth', .03);
          box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); inp.value = '';
        }
      });
      sc.on(stage, 'click', () => { if (running && !done) inp.focus(); });
      hud('<span><b id="hs">0</b>/15</span><span><b id="ht">0.0</b>s</span>');
      countdown(sc, stage, () => { running = true; t0 = performance.now(); inp.disabled = false; inp.focus(); gen(); });
      sc.raf(() => {
        if (!running) return;
        const t = performance.now() - t0;
        T.set(solved / N, t); $('#hs').textContent = solved; $('#ht').textContent = (t / 1000).toFixed(1);
        return !done;
      });
      function finish() {
        done = true; inp.disabled = true; T.me.classList.remove('boost');
        const t = performance.now() - t0; T.set(1, t);
        const apm = Math.round(N / (t / 60000)), acc = Math.round(N / (N + err) * 100), place = T.placeOf(t);
        const best = apm > S.best.math; if (best) S.best.math = apm;
        results(sc, stage, { place, title: 'Drift complete', best, again,
          stats: [['Answers / min', apm], ['Accuracy', acc + '%'], ['Time', (t / 1000).toFixed(1) + 's']],
          xp: Math.round(apm * 2 * acc / 100) + [40, 25, 15, 5][place - 1], coins: [50, 30, 20, 10][place - 1] });
      }
      return sc;
    }
  },
  siege: {
    name: 'Word Siege', cls: 'a3', tag: 'Typing survival', desc: 'Words fall toward your wall. Type them to blast them before they break through.',
    art: '<span class="fall" style="left:22%">comet</span><span class="fall" style="left:58%;animation-delay:-1.4s">laser</span><span class="fall" style="left:40%;animation-delay:-2.3s">orbit</span>',
    best: () => S.best.siege ? `${S.best.siege} pts` : '',
    start(stage, again) {
      const sc = scope();
      const wrap = el('div', 'arena'), cv = document.createElement('canvas'); wrap.appendChild(cv); stage.appendChild(wrap);
      stage.appendChild(el('div', 'hint', 'Type any word to lock on, then finish it to fire. Every 5-word streak raises your multiplier.'));
      const W = wrap.clientWidth, H = Math.max(340, Math.min(540, innerHeight - 230)), dpr = window.devicePixelRatio || 1;
      cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      const g = cv.getContext('2d'); g.scale(dpr, dpr);
      const FONT = '600 20px "JetBrains Mono", ui-monospace, monospace', GROUND = H - 46, TX = W / 2;
      const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * GROUND, s: Math.random() * 1.6 + .3 }));
      let words = [], parts = [], target = null, score = 0, lives = 3, combo = 0, kills = 0, keys = 0, misses = 0;
      let t = 0, spawnAt = 0, laser = null, shake = 0, running = false, over = false, last = 0, shownWave = 0;
      const wave = () => 1 + Math.floor(t / 25000);
      const updHud = () => hud(`<span>Score <b>${score}</b></span><span>Wave <b>${wave()}</b></span><span>×<b>${1 + Math.floor(combo / 5)}</b></span><span style="color:var(--bad)">${'♥'.repeat(lives)}${'♡'.repeat(3 - lives)}</span>`);
      function spawn() {
        const maxLen = Math.min(4 + wave(), 12); let w;
        for (let k = 0; k < 20 && !w; k++) { const c = pick(WORDS); if (c.length <= maxLen && !words.some(o => o.w[0] === c[0])) w = c; }
        if (!w) return;
        g.font = FONT; const tw = g.measureText(w).width;
        words.push({ w, typed: 0, tw, x: 14 + Math.random() * (W - tw - 28), y: -12, v: 16 + wave() * 6 + Math.random() * 12 });
      }
      function miss() { misses++; combo = 0; beep(140, .08, 'sawtooth', .03); updHud(); }
      function kill(o) {

    stage.innerHTML = `<div class="tr">

          <div class="qbtns" id="tQb"><button data-q="10">10</button><button data-q="50">50</button><button data-q="100">100</button><button data-q="half">½ max</button><button data-q="max">Max</button></div>
          <div id="tPxWrap" hidden><label id="tPxLbl">Price</label><input class="tin" id="tPx" type="number" step="0.01" min="0.01"></div>

        <div class="pnl"><h4>News &amp; calendar</h4><div class="cal" id="tCal"></div><div class="feed" id="tFeed"></div></div>
      </div></div>`;
    const E = id => document.getElementById(id);
    const cv = $('#tChart canvas'), g = cv.getContext('2d');

    /* ----- account math ----- */
    const pos = sym => P[sym] || (P[sym] = { q: 0, avg: 0, t0: 0 });
    const equity = () => cash + st.reduce((a, s) => a + pos(s.sym).q * s.p, 0);
    const gross = () => st.reduce((a, s) => a + Math.abs(pos(s.sym).q) * s.p, 0);

    const dirOf = sd => sd === 'buy' || sd === 'cover' ? 1 : -1;
    function quote(s) {
      const hs = s.spread * (1 + 2.5 * Math.exp(-t / 8) + (s.near ? 1.2 : 0));

    }
    function takeImp(o) { let sum = 0; o.imps = o.imps.filter(im => { const part = im.left * .3; sum += part; im.left -= part; return Math.abs(im.left) > 1e-5; }); return sum; }

    /* ----- feed, news, coach ----- */
    function feed(sym, html, c) {
      const d = el('div', 'ni new ' + (c || ''), `<time>${clock(Math.min(t, 390))}</time>${sym && sym !== '*' ? `<span class="tk">${sym}</span>` : ''}${html}`);
      E('tFeed').prepend(d); while (E('tFeed').children.length > 60) E('tFeed').lastChild.remove();
    }
    const coach = msg => { if (T.coach) toast('💡 ' + msg, 5500, 'coach'); };
    function news(s, text, imp, c) {

      if (!coached.has(s.sym)) { coached.add(s.sym); coach(`${s.sym} (${s.type}): ${s.how}`); }
    }
    function randomNews() {
      let r = Math.random() * st.reduce((a, s) => a + s.w, 0), s = st[0];
      for (const x of st) { if ((r -= x.w) < 0) { s = x; break; } }
      const up = Math.random() < .52, rumor = Math.random() < (s.type === 'Meme' ? .45 : .12);
      const imp = (up ? 1 : -1) * s.mag * (.5 + Math.random() * .9) * (rumor ? .8 : 1);
      news(s, fmtNews(pick(rumor ? (up ? NEWS_T.rumorUp : NEWS_T.rumorDn) : (up ? NEWS_T.up : NEWS_T.dn)), s), imp, Math.abs(imp) > s.mag * 1.1 ? 'big' : '');
      if (rumor && Math.random() < .55) pendingDeny.push({ t: t + rnd(8, 25), s, imp: -imp * .85 });

    }
    function fireEvent(ev) {

        let text, imp;
        if (Math.random() * 100 < ev.odds) { text = 'Fed holds rates steady, as expected'; imp = .0025; ev.res = '● hold'; }
        else if (Math.random() < .5) { text = 'SURPRISE: Fed cuts rates by 0.25%'; imp = .011; ev.res = '▲ cut'; }
        else { text = 'SURPRISE: Fed raises rates by 0.25%'; imp = -.013; ev.res = '▼ hike'; }
        idx.imps.push({ left: imp }); feed('*', '🏛 ' + text, 'big');
      } else {
        const good = Math.random() * 100 < ev.odds; ev.res = good ? '▲' : '▼';
        news(bySym[ev.sym], ev.txt[good ? 0 : 1], (good ? 1 : -1) * ev.mag * (.7 + Math.random() * .6), 'big');
      }
    }

    /* ----- simulation: one step = one market minute ----- */
    function step() {
      // intraday volatility "smile": wild open, quiet lunch, busier close
      const U = 1 + 1.1 * Math.exp(-t / 20) + .5 * Math.exp(-(389 - t) / 25) - .3 * Math.exp(-(((t - 165) / 55) ** 2));
      for (const ev of events) {

        else if (!ev.done && ev.t - t === 10) { feed(ev.sym, `⏰ Coming up at ${clock(ev.t)}: ${ev.name}`, ''); coach(`${ev.name} in 10 minutes. Spreads widen and prices get jumpy before scheduled events.`); }
      }
      pendingDeny.filter(d => d.t === t).forEach(d => news(d.s, fmtNews(pick(NEWS_T.deny), d.s), d.imp, 'big'));
      pendingDeny = pendingDeny.filter(d => d.t > t);

      const m = gauss() * .00045 * U + idx.drift + takeImp(idx);

    /* ----- orders & fills ----- */
    function fill(sym, qty, px, verb) {

      feed(sym, `${verb} ${Math.abs(qty)} @ ${px.toFixed(2)}${pnl != null ? ` · <b class="${cls(pnl)}">${money(pnl, 1)}</b>` : ''}`, 'fill');

    function execute(sd, sym, qty, px) {

      else if (sd === 'cover') { qty = Math.min(qty, Math.max(0, -p.q)); if (!qty) return 'Nothing left to cover.'; fill(sym, qty, px, 'Covered'); }

        if (qty * px > bp() + .005) return `Not enough buying power (need ${money(qty * px)}).`;

        else { if (d > 0 && q.ask >= o.px) px = q.ask; if (d < 0 && q.bid <= o.px) px = q.bid; }

    function closeAll() {

    }
    function marginCheck() {
      const e = equity(), gr = gross();

    function submit() {

      const qty = Math.floor(+E('tQty').value);

        if (type === 'stp' && d > 0 && px <= q.ask) return err(`A ${side} stop must be above the ask (${q.ask.toFixed(2)}). To buy lower, use a Limit.`);

    }

    /* ----- rendering ----- */
    function render() { renderTop(); renderWL(); renderHead(); drawChart(); renderPos(); renderOrd(); renderCal(); renderTicket(); }
    function renderTop() {

      E('tEq').textContent = money(e); E('tPnl').textContent = money(pnl, 1); E('tPnl').className = cls(pnl); E('tBp').textContent = money(bp());

    function renderHead() {
      const q = quote(sel), ch = sel.p / sel.prev - 1;

        <span class="qt">Bid <b class="dn">${q.bid.toFixed(2)}</b> · Ask <b class="up">${q.ask.toFixed(2)}</b> · spread ${(q.ask - q.bid).toFixed(2)}</span>
        <span class="qt">Last <b>${sel.p.toFixed(2)}</b> <b class="${cls(ch * 100)}">${pct(ch)}</b></span><span class="qt">Range ${sel.lo.toFixed(2)}–${sel.hi.toFixed(2)} · Vol ${fmtVol(sel.dayV)}</span>`;

    }
    function drawChart() {
      const s = sel, W = E('tChart').clientWidth, H = 340, dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + 'px'; }
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
      const L = 4, R = W - 62, TOP = 10, PB = H - 92, VT = H - 84, VB = H - 22, cw = (R - L) / 78, cs = s.candles.filter(Boolean);
      const p = pos(s.sym), myOrd = orders.filter(o => o.sym === s.sym && o.px);

      };

      g.textBaseline = 'alphabetic';

        const x = L + m / 5 * cw; g.strokeStyle = '#ffffff08'; g.beginPath(); g.moveTo(x, TOP); g.lineTo(x, VB); g.stroke(); g.fillStyle = '#8b90c0'; g.fillText(l, x - 15, H - 6);
      });
      events.filter(e => e.sym === s.sym || e.sym === '*').forEach(e => {
        const x = L + e.t / 5 * cw; g.strokeStyle = '#fbbf2466'; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(x, TOP); g.lineTo(x, VB); g.stroke(); g.setLineDash([]);
        g.fillStyle = '#fbbf24'; g.font = '600 10px Inter, sans-serif'; g.fillText(e.sym === '*' ? 'FED' : 'EVENT', x + 3, TOP + 10);

        g.fillStyle = col; g.fillRect(x - bw / 2, y(Math.max(c.o, c.c)), bw, Math.max(1, Math.abs(y(c.o) - y(c.c))));
      });
      if (cs.length > 1) { g.strokeStyle = '#fb923c'; g.lineWidth = 1.5; g.beginPath(); s.candles.forEach((c, i) => { if (c) { const x = L + (i + .5) * cw; i ? g.lineTo(x, y(c.vw)) : g.moveTo(x, y(c.vw)); } }); g.stroke(); }
      if (p.q) hline(p.avg, '#22d3ee', `${p.q > 0 ? 'LONG' : 'SHORT'} ${Math.abs(p.q)} @ ${p.avg.toFixed(2)}`);
      myOrd.forEach(o => hline(o.px, o.type === 'stp' ? '#fbbf24' : dirOf(o.side) > 0 ? '#34d399' : '#f43f5e', `${SIDE_N[o.side]} ${TYPE_N[o.type]} ${o.qty} @ ${o.px.toFixed(2)}`));

      if (!cs.length) { g.fillStyle = '#8b90c0'; g.font = '600 14px Inter, sans-serif'; g.textAlign = 'center'; g.fillText(opened ? '' : 'Market opens at 9:30 AM', (L + R) / 2, (TOP + PB) / 2); g.textAlign = 'left'; }
    }
    function renderPos() {
      const rows = st.filter(s => pos(s.sym).q).map(s => {
        const p = pos(s.sym), u = p.q * (s.p - p.avg);
        return `<tr><td>${s.sym}</td><td class="${p.q > 0 ? 'up' : 'dn'}">${p.q > 0 ? '+' : ''}${p.q}</td><td>${p.avg.toFixed(2)}</td><td>${s.p.toFixed(2)}</td><td class="${cls(u)}">${money(u, 1)}</td><td><button class="xbtn" data-close="${s.sym}">Close</button></td></tr>`;
      });
      const real = closed.reduce((a, c) => a + c.pnl, 0), unr = st.reduce((a, s) => a + pos(s.sym).q * (s.p - pos(s.sym).avg), 0);
      E('tPos').innerHTML = (rows.length ? `<table><tr><th>Sym</th><th>Qty</th><th>Avg</th><th>Last</th><th>P&amp;L</th><th></th></tr>${rows.join('')}</table>`
        : '<div class="empty">No open positions. Pick a stock and use the order ticket.</div>')
        + `<div class="sum">Realized <b class="${cls(real)}">${money(real, 1)}</b> · Unrealized <b class="${cls(unr)}">${money(unr, 1)}</b> · Spread paid <b>${money(spreadPaid)}</b></div>`;
    }
    function renderOrd() {
      E('tOrd').innerHTML = orders.length ? `<table><tr><th>Order</th><th>Qty</th><th>Type</th><th>Price</th><th></th></tr>${orders.map(o =>
        `<tr><td><span class="sd ${o.side}">${o.side.toUpperCase()}</span> ${o.sym}</td><td>${o.qty}</td><td>${TYPE_N[o.type]}</td><td>${o.px ? o.px.toFixed(2) : '—'}</td><td><button class="xbtn" data-cancel="${o.id}">✕</button></td></tr>`).join('')}</table>`
        : '<div class="empty">No working orders. Limit and stop orders wait here until they trigger.</div>';
    }
    const calRows = () => events.map(e => `<div class="${e.done ? 'done' : ''}"><span><b>${clock(e.t)}</b> ${e.name}</span><span>${e.done ? e.res : e.sym === '*' ? `hold expected (${e.odds}%)` : `${e.odds}% odds positive`}</span></div>`).join('');
    function renderCal() { E('tCal').innerHTML = calRows(); }
    function renderTicket() {
      const q = quote(sel), p = pos(sel.sym), qty = Math.max(0, Math.floor(+E('tQty').value || 0)), d = dirOf(side);
      const px = type === 'mkt' ? (d > 0 ? q.ask : q.bid) : (+E('tPx').value || 0);
      [...E('tSide').children].forEach(b => {
        const v = b.dataset.v; b.classList.toggle('on', v === side);
        b.classList.toggle('dis', (v === 'buy' && p.q < 0) || (v === 'short' && p.q > 0) || (v === 'sell' && p.q <= 0) || (v === 'cover' && p.q >= 0));
      });
      [...E('tType').children].forEach(b => b.classList.toggle('on', b.dataset.v === type));
      E('tPxWrap').hidden = type === 'mkt'; E('tPxLbl').textContent = type === 'lmt' ? 'Limit price' : 'Stop price';
      const lines = [`Est. ${d > 0 ? 'cost' : 'proceeds'}: <b>${money(qty * px)}</b>`, `Position: <b>${p.q ? `${p.q > 0 ? 'Long' : 'Short'} ${Math.abs(p.q)} @ ${p.avg.toFixed(2)}` : 'none'}</b>`, `Max shares: <b>${maxQty()}</b>`];
      if (p.q && px && ((side === 'sell' && p.q > 0) || (side === 'cover' && p.q < 0))) { const r = (px - p.avg) * Math.min(qty, Math.abs(p.q)) * Math.sign(p.q); lines.push(`${type === 'stp' ? 'If stopped' : 'If filled'}: <b class="${cls(r)}">${money(r, 1)}</b>`); }
      E('tEst').innerHTML = lines.join('<br>') + `<div class="th">${TYPE_HELP[type][side]}</div>`;
      E('tGo').textContent = `${SIDE_N[side]} ${qty || ''} ${sel.sym} ${type === 'mkt' ? 'at market' : `${TYPE_N[type].toLowerCase()} @ ${px ? px.toFixed(2) : '…'}`}`;
      E('tGo').className = 'btn submit s-' + side;
    }

    /* ----- modals: pre-market & tutorial ----- */
    function showModal(html, kind) { closeModal(); modal = el('div', 'modal', `<div class="mcard">${html}</div>`); modal.dataset.kind = kind; $('#play').appendChild(modal); return modal; }
    function closeModal() { if (modal) modal.remove(); modal = null; }
    function tutorial(done) {
      let i = 0;
      const page = () => {
        const [h, body] = TUT[i], m = showModal(`<div class="kick">Tutorial · ${i + 1} / ${TUT.length}</div><h2>${h}</h2>${body}
          <div class="tnav"><button class="btn ghost sm" data-skip>${i === TUT.length - 1 ? 'Close' : 'Skip tutorial'}</button><div class="dots">${TUT.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
          <div style="display:flex;gap:8px">${i ? '<button class="btn ghost sm" data-prev>← Back</button>' : ''}<button class="btn primary sm" data-next>${i === TUT.length - 1 ? 'Start trading' : 'Next →'}</button></div></div>`, 'tut');
        const finish = () => { T.tut = true; save(); closeModal(); if (done) done(); };
        $('[data-skip]', m).onclick = finish;
        $('[data-next]', m).onclick = () => { if (i < TUT.length - 1) { i++; page(); } else finish(); };
        if (i) $('[data-prev]', m).onclick = () => { i--; page(); };
        m.tutNav = k => { if (k === 'ArrowRight') $('[data-next]', m).click(); if (k === 'ArrowLeft' && i) { i--; page(); } if (k === 'Escape') finish(); };
      };
      page();
    }
    function premarket() {
      const blown = T.eq < 100;
      const m = showModal(`<div class="kick">Pre-market · Day ${T.days + 1}</div><h2>Good morning, ${esc(S.name)}</h2>
        <div class="res-stats"><div><b>${money(T.eq)}</b><small>Account</small></div><div><b class="${cls(T.total)}">${money(T.total, 1)}</b><small>Career P&amp;L</small></div><div><b>${T.days ? Math.round(T.wins / T.days * 100) + '%' : '—'}</b><small>Green days</small></div></div>
        <div class="mh">Today's calendar</div><div class="cal">${calRows()}</div>
        <div class="mh">Pre-market mover</div><div class="ni big"><span class="tk">${gs.sym}</span>${gapText} · <b class="${cls(gap * 100)}">${pct(gap)}</b></div>
        <p class="hint" style="text-align:left">Plan before the bell: which stock fits today's news and events? How much will you risk per trade?</p>
        ${blown ? '<div class="note">Your account is blown. Reset it to start a new career with $10,000.</div>' : ''}
        <div class="res-btns"><button class="btn primary" data-open ${blown ? 'disabled style="opacity:.5"' : ''}>🔔 Open the market</button><button class="btn ghost" data-tut>Tutorial</button><button class="btn ghost" data-reset>Reset account</button></div>`, 'pre');
      $('[data-open]', m).onclick = () => {
        if (blown) return;
        closeModal(); opened = true; speed = 1; last = 0;
        feed('*', '🔔 Opening bell. Spreads are widest in the first few minutes.', 'big'); feed(gs.sym, 'Pre-market: ' + gapText, 'big');
        render();
      };
      $('[data-tut]', m).onclick = () => tutorial(premarket);
      $('[data-reset]', m).onclick = () => {
        if (!confirm('Reset your trading career to $10,000? Your career stats will be cleared.')) return;
        Object.assign(T, { eq: 10000, days: 0, wins: 0, total: 0 }); save(); startEq = cash = 10000; render(); premarket();
      };
    }

    /* ----- end of day ----- */
    function endDay() {
      ended = true; speed = 0;
      if (st.some(s => pos(s.sym).q)) feed('*', '🔔 Closing bell: open positions were closed at market.', 'big');
      closeAll(); render();
      const e = equity(), pnl = e - startEq, ret = pnl / startEq;
      T.eq = Math.round(e * 100) / 100; T.days++; if (pnl > 0) T.wins++; T.total += pnl;
      const best = pnl > S.best.trade; if (best) S.best.trade = Math.round(pnl);
      const wins = closed.filter(c => c.pnl > 0), losses = closed.filter(c => c.pnl <= 0);
      const avgW = wins.length ? wins.reduce((a, c) => a + c.pnl, 0) / wins.length : 0, avgL = losses.length ? -losses.reduce((a, c) => a + c.pnl, 0) / losses.length : 0;
      const worst = closed.reduce((a, c) => !a || c.pnl < a.pnl ? c : a, null), tips = [];
      if (!closed.length) tips.push("You didn't trade today. Watching is fine, but next time try one small, planned trade with a stop-loss.");
      else {
        if (losses.length && avgL > avgW * 1.5) tips.push(`Your average loss (${money(avgL)}) is much bigger than your average win (${money(avgW)}). Cut losers sooner with stop orders and let winners run.`);
        if (worst && worst.pnl < -.03 * startEq) tips.push(`One ${worst.sym} trade lost ${money(-worst.pnl)}, more than 3% of your account. Size positions so one stop-out costs 1–2%.`);
        if (closed.length >= 12 && spreadPaid > Math.abs(pnl) * .5) tips.push(`You made ${closed.length} trades and paid ${money(spreadPaid)} in spreads. Overtrading quietly drains accounts, so wait for clearer setups.`);
        if (marginCalls) tips.push('You got margin-called. Leverage cuts both ways, so use less of your buying power.');
        if (pnl > 0 && wins.length / closed.length < .45) tips.push('Low win rate but still profitable. That is what "let winners run" looks like.');
      }
      if (!tips.length) tips.push(pnl > 0 ? 'Solid, disciplined day. Keep your sizing consistent and repeat the process.' : 'Red days happen to everyone. Review your entries: were they planned, or just reactions?');
      if (T.eq < 100) tips.unshift('Your account is blown. Reset it from the pre-market screen to start over.');
      const extra = `<div class="dline">Account <b>${money(T.eq)}</b> · Trades closed <b>${closed.length}</b> · Spread paid <b>${money(spreadPaid)}</b> · Career <b class="${cls(T.total)}">${money(T.total, 1)}</b></div>
        <div class="mh" style="text-align:left">Coach review</div><ul class="coachlist">${tips.slice(0, 3).map(x => `<li>${x}</li>`).join('')}</ul>`;
      const p100 = ret * 100;
      results(sc, stage, { title: `Day ${T.days} · closing bell`, best, again, extra,
        stats: [['Day P&L', `<span class="${cls(pnl)}">${money(pnl, 1)}</span>`], ['Return', pct(ret)], ['Win rate', closed.length ? Math.round(wins.length / closed.length * 100) + '%' : '—']],
        xp: 20 + Math.max(0, Math.min(150, Math.round(p100 * 25))) + Math.min(20, closed.length * 2), coins: pnl > 0 ? 15 + Math.min(100, Math.round(p100 * 20)) : 5 });
    }

    /* ----- input wiring ----- */
    const setSpeed = v => { if (!opened || ended) return; speed = v; if (v) lastSpeed = v; last = 0; renderTop(); };
    const select = s => { sel = s; if (type !== 'mkt') E('tPx').value = s.p.toFixed(2); E('tErr').textContent = ''; render(); };
    sc.on(E('tSpeed'), 'click', e => { const b = e.target.closest('button'); if (b) setSpeed(+b.dataset.s); });
    // pointerdown: these panels re-render every tick, so a click could land on a replaced element
    sc.on(E('tWl'), 'pointerdown', e => { const r = e.target.closest('.wrow'); if (r) select(st[+r.dataset.i]); });
    sc.on(E('tPos'), 'pointerdown', e => {
      const b = e.target.closest('[data-close]'); if (!b || !opened || ended) return;
      const s = bySym[b.dataset.close], p = pos(s.sym), q = quote(s);
      if (!speed) { orders.push({ id: ++oid, side: p.q > 0 ? 'sell' : 'cover', type: 'mkt', sym: s.sym, qty: Math.abs(p.q), px: null }); feed(s.sym, 'Close order queued. It fills when trading resumes.', 'fill'); }
      else execute(p.q > 0 ? 'sell' : 'cover', s.sym, Math.abs(p.q), p.q > 0 ? q.bid : q.ask);
      render();
    });
    sc.on(E('tOrd'), 'pointerdown', e => { const b = e.target.closest('[data-cancel]'); if (b) { orders = orders.filter(o => o.id !== +b.dataset.cancel); render(); } });
    sc.on(E('tFlat'), 'click', () => { if (!opened || ended) return; if (!speed) { toast('Resume the market to close everything.'); return; } closeAll(); render(); });
    sc.on(E('tSide'), 'click', e => { const b = e.target.closest('button'); if (b) { side = b.dataset.v; E('tErr').textContent = ''; renderTicket(); } });
    sc.on(E('tType'), 'click', e => {
      const b = e.target.closest('button'); if (!b) return; type = b.dataset.v;
      if (type !== 'mkt') E('tPx').value = sel.p.toFixed(2);
      E('tErr').textContent = ''; renderTicket(); if (type !== 'mkt') E('tPx').select();
    });
    sc.on(E('tQb'), 'click', e => {
      const b = e.target.closest('button'); if (!b) return; const k = b.dataset.q, mx = maxQty();
      E('tQty').value = k === 'max' ? mx : k === 'half' ? Math.floor(mx / 2) : k; renderTicket();
    });
    ['tQty', 'tPx'].forEach(id => { sc.on(E(id), 'input', renderTicket); sc.on(E(id), 'keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } }); });
    sc.on(E('tGo'), 'click', submit);
    sc.on(E('tHelp'), 'click', () => tutorial(opened ? null : premarket));
    sc.on(E('tCoach'), 'click', () => { T.coach = !T.coach; save(); renderTop(); });
    sc.on(window, 'resize', drawChart);
    // capture phase so modal keys run before the arcade's global Esc handler
    sc.on(document, 'keydown', e => {
      if (modal) { if (modal.tutNav && ['ArrowRight', 'ArrowLeft', 'Escape'].includes(e.key)) { e.stopPropagation(); e.preventDefault(); modal.tutNav(e.key); } return; }
      if (!opened || ended || e.target.closest?.('input')) return;
      if (e.key === ' ') { e.preventDefault(); setSpeed(speed ? 0 : lastSpeed); }
      else if (/^[1-5]$/.test(e.key)) select(st[+e.key - 1]);
    }, true);

    sc.raf(ts => {
      const dt = last ? Math.min(.1, (ts - last) / 1000) : 0; last = ts;
      if (!opened || ended || modal || !speed) return;
      acc += dt * speed * 3; let n = 0;
      while (acc >= 1 && t < 390) { step(); acc--; n++; }
      if (n) render();
      if (t >= 390) { endDay(); return false; }
    });

    hud('');
    render();
    if (T.tut) premarket(); else tutorial(premarket);
    // leaving mid-day settles the day at market so quitting can't erase losses
    return { stop() { if (opened && !ended) { closeAll(); T.eq = Math.round(equity() * 100) / 100; T.total += T.eq - startEq; T.days++; if (T.eq > startEq) T.wins++; save(); } closeModal(); sc.stop(); } };
  }
};

/* ---------- navigation ---------- */
let cur = null, curId = null;
function launch(id) {
  if (cur) cur.stop();
  const st = $('#stage'); st.innerHTML = ''; st.className = GAMES[id].wide ? 'wide' : ''; hud('');
  curId = id; cur = GAMES[id].start(st, () => launch(id));
}
function openGame(id) {
  $('#ptitle').textContent = GAMES[id].name; $('#play').classList.add('on'); document.body.style.overflow = 'hidden';
  launch(id);
}
function closeGame() {
  if (cur) cur.stop(); cur = null;
  $('#stage').innerHTML = ''; $('#play').classList.remove('on'); document.body.style.overflow = '';
  renderHome();
}
$('#back').onclick = closeGame;
window.addEventListener('keydown', e => { if (e.key === 'Escape' && cur) closeGame(); });

/* ---------- home ---------- */
function renderHeader() {
  const L = levelOf(S.xp);
  $('#lv').textContent = 'LV ' + L.l; $('#xpfill').style.width = (L.cur / L.need * 100) + '%';
  $('#xpfill').parentElement.parentElement.title = `${L.cur} / ${L.need} XP to level ${L.l + 1}`;
  $('#coins').textContent = S.coins.toLocaleString();
  $('#snd').textContent = S.sound ? '🔊' : '🔇';
}
function renderHome() {
  renderHeader();
  const nm = $('#name'); if (document.activeElement !== nm) nm.value = S.name; nm.style.width = Math.max(3, nm.value.length + 1) + 'ch';
  $('#showcar').innerHTML = carSVG(S.car);
  $('#stats').innerHTML = [['Best WPM', S.best.type || '—'], ['Math APM', S.best.math || '—'], ['Trading acct', money(S.trade.eq)], ['Games played', S.plays]]
    .map(([k, v]) => `<div class="stat"><b>${v}</b><small>${k}</small></div>`).join('');
  $('#games').innerHTML = Object.entries(GAMES).map(([id, g]) => `
    <button class="game${g.feat ? ' feat' : ''}" data-g="${id}"><div class="art ${g.cls}"><div>${g.art}</div></div>
      <div class="gbody"><h3>${g.name}</h3><p>${g.desc}</p>
      <div class="meta"><span class="tag">${g.tag}</span><span class="best">${g.best() ? '★ ' + g.best() : 'Not played yet'}</span></div></div></button>`).join('');
  $('#garage').innerHTML = PAINTS.map(([n, c, price]) => {
    const own = S.owned.includes(c);
    return `<div class="slot${S.car === c ? ' sel' : ''}${own ? '' : ' locked'}" data-c="${c}" role="button" tabindex="0">${carSVG(c)}<b>${n}</b><small>${S.car === c ? 'Equipped' : own ? 'Owned · click to equip' : `<span class="coin">${price}</span>`}</small></div>`;
  }).join('');
}
$('#games').onclick = e => { const b = e.target.closest('.game'); if (b) openGame(b.dataset.g); };
function garageAct(e) {
  const s = e.target.closest('.slot'); if (!s) return;
  const c = s.dataset.c, [n, , price] = PAINTS.find(p => p[1] === c);
  if (!S.owned.includes(c)) {
    if (S.coins < price) { toast(`Need ${price - S.coins} more coins for ${n}`); beep(150, .1, 'sawtooth', .03); return; }
    S.coins -= price; S.owned.push(c); toast(`Unlocked ${n} paint!`); beep(880, .12, 'triangle', .05);
  }
  S.car = c; save(); renderHome();
}
$('#garage').onclick = garageAct;
$('#garage').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); garageAct(e); } };
$('#name').oninput = e => { e.target.style.width = Math.max(3, e.target.value.length + 1) + 'ch'; };
$('#name').onchange = e => { S.name = e.target.value.trim().slice(0, 14) || 'Player'; e.target.value = S.name; save(); };
$('#name').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
$('#snd').onclick = () => { S.sound = !S.sound; save(); renderHeader(); };
renderHome();
</script>
