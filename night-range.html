<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608; --panel:rgba(14,16,20,.92); --line:rgba(255,255,255,.08); --text:#e7e9ee; --dim:#8b919c;
  --accent:#c9a45c; --accent2:#7f8a4a; --danger:#e0533d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;letter-spacing:.3em;color:var(--dim);font-size:14px;text-align:center;padding:16px}

/* ---------- customize ---------- */
#topbar{position:fixed;left:20px;top:16px;z-index:5;pointer-events:none}
#topbar h1{margin:0;font-size:30px;letter-spacing:.18em;font-weight:700}
#topbar p{margin:2px 0 0;color:var(--dim);letter-spacing:.2em;font-size:12px}
#poses{position:fixed;left:20px;bottom:20px;z-index:5;display:flex;gap:6px;flex-wrap:wrap}
#poses .chip{background:rgba(14,16,20,.8)}
#panel{position:fixed;right:0;top:0;bottom:0;width:360px;background:var(--panel);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;backdrop-filter:blur(6px)}
#panel header{padding:18px 18px 10px;border-bottom:1px solid var(--line)}
#panel header .t{font-size:13px;letter-spacing:.3em;color:var(--accent)}
#panel header .n{font-size:22px;font-weight:700;letter-spacing:.08em}
#tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:1px solid transparent;color:var(--dim);padding:5px 9px;border-radius:4px;font-size:14px;font-weight:600;letter-spacing:.06em}
.tab:hover{color:var(--text)}
.tab.on{color:#111;background:var(--accent)}
#controls{flex:1;overflow-y:auto;padding:12px 18px 24px}
.ctl{margin:14px 0}
.ctl label{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;margin-bottom:7px}
.ctl label b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);padding:6px 10px;border-radius:4px;font-size:14px;font-weight:600}
.chip:hover{border-color:rgba(255,255,255,.25)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(201,164,92,.1)}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.12);padding:0}
.sw button.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,164,92,.35)}
.sw input[type=color]{width:30px;height:28px;border:none;background:none;padding:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent)}
#panel footer{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);padding:10px;border-radius:5px;font-weight:700;letter-spacing:.12em;font-size:14px}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.primary{grid-column:1/-1;background:var(--accent);color:#14120c;border-color:var(--accent);font-size:17px;padding:13px}
.btn.primary:hover{filter:brightness(1.1)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#xhair{position:absolute;left:50%;top:50%;width:0;height:0}
#xhair i{position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
#xhair i.t,#xhair i.b{width:2px;height:9px;left:-1px}
#xhair i.l,#xhair i.r{height:2px;width:9px;top:-1px}
#xhair b{position:absolute;width:3px;height:3px;left:-1.5px;top:-1.5px;background:#fff;border-radius:50%;box-shadow:0 0 2px #000}
#hitmark{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hitmark i{position:absolute;width:10px;height:2px;background:#fff;left:-5px;top:-1px;box-shadow:0 0 3px #000}
#hitmark i:nth-child(1){transform:rotate(45deg) translateX(-11px)}
#hitmark i:nth-child(2){transform:rotate(45deg) translateX(11px)}
#hitmark i:nth-child(3){transform:rotate(-45deg) translateX(-11px)}
#hitmark i:nth-child(4){transform:rotate(-45deg) translateX(11px)}
#hitmark.show{animation:hm .28s ease-out}
#hitmark.steel i{background:#ffd27a}
@keyframes hm{0%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1)}}
#ammo{position:absolute;right:28px;bottom:24px;text-align:right}
#ammo .mag{font-size:64px;font-weight:700;line-height:1;letter-spacing:.02em}
#ammo .mag small{font-size:26px;color:var(--dim);margin-left:2px}
#ammo .res{font-size:20px;color:var(--dim);letter-spacing:.1em}
#ammo .mode{display:inline-block;margin-top:6px;font-size:14px;letter-spacing:.25em;border:1px solid rgba(255,255,255,.25);padding:2px 8px;border-radius:3px}
#ammo.low .mag{color:var(--danger)}
#rbar{width:180px;height:3px;background:rgba(255,255,255,.12);margin:8px 0 0 auto;opacity:0}
#rbar i{display:block;height:100%;width:0;background:var(--accent)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:18px;letter-spacing:.25em;color:var(--accent);text-shadow:0 0 8px #000}
#stats{position:absolute;left:24px;top:20px;font-size:15px;letter-spacing:.14em;color:var(--dim);line-height:1.5}
#stats b{color:var(--text);font-size:18px}
#feed{position:absolute;left:24px;top:132px;font-size:15px;letter-spacing:.06em;line-height:1.45}
#feed div{animation:fd 4s forwards;text-shadow:0 0 6px #000}
@keyframes fd{0%,80%{opacity:1}100%{opacity:0}}
#feed .s{color:#ffd27a}#feed .p{color:#d9c49a}#feed .m{color:var(--dim)}
#keys{position:absolute;left:24px;bottom:20px;font-size:13px;letter-spacing:.1em;color:rgba(255,255,255,.4);max-width:520px;line-height:1.6}
#keys b{color:rgba(255,255,255,.7);font-weight:600}

/* ---------- pause ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(4,5,7,.72);backdrop-filter:blur(4px)}
.card{width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:10px}
.card h2{margin:0 0 6px;letter-spacing:.3em;font-size:22px;text-align:center}
.card .row{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.1em;color:var(--dim)}
.card .btn{width:100%}

@media (max-width:760px){
  #panel{top:auto;width:100%;height:48vh;border-left:none;border-top:1px solid var(--line)}
  #poses{bottom:calc(48vh + 10px);left:12px}
  #topbar{left:16px}
  #topbar h1{font-size:22px}
}
</style>
</head>

  <header><div class="t">LOADOUT</div><div class="n">OPERATOR</div></header>

  <div id="controls"></div>
  <footer>
    <button class="btn" id="bRandom">RANDOMIZE</button>
    <button class="btn" id="bRef">REFERENCE LOOK</button>
    <button class="btn primary" id="bEnter">ENTER RANGE</button>
  </footer>
</aside>

<div id="hud" class="hidden">
  <div id="xhair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><b></b></div>
  <div id="hitmark"><i></i><i></i><i></i><i></i></div>

  <div id="keys"><b>WASD</b> move · <b>SHIFT</b> sprint · <b>C</b> crouch · <b>RMB</b> aim · <b>LMB</b> fire · <b>R</b> reload · <b>B</b> fire mode · <b>V</b> 1st/3rd person · <b>T</b> reset range · <b>ESC</b> menu</div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <h2>PAUSED</h2>
    <button class="btn primary" id="bResume">RESUME</button>
    <button class="btn" id="bCustom">CUSTOMIZE OPERATOR</button>
    <button class="btn" id="bReset">RESET RANGE</button>
    <div class="row"><span>SENSITIVITY</span><input type="range" id="sens" min="0.4" max="2.5" step="0.05" value="1" style="width:55%"></div>
    <div class="row"><span>INFINITE RESERVE</span><input type="checkbox" id="infAmmo" checked></div>
    <div class="row"><span>VOLUME</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" style="width:55%"></div>
  </div>
</div>

<script>

</script>

    const pw = d.chestW * 1.55, ph = d.torso * 0.52, py = d.torso * 0.56, pz = d.front + 0.022;
    M(box(pw, ph, 0.05), S.vest, spine, 0, py, pz);
    M(box(pw, ph * 1.05, 0.05), S.vest, spine, 0, py, -pz);
    for (let i = 0; i < 3; i++) M(box(pw * 0.9, 0.012, 0.006), S.vestDark, spine, 0, py + ph * 0.32 - i * 0.04, pz + 0.027);
    for (const sx of [1, -1]) {
      M(box(0.075, 0.035, d.front * 2 + 0.07), S.vest, spine, sx * d.chestW * 0.52, d.torso * 0.86, 0);
      M(box(0.045, d.torso * 0.3, d.front * 1.5), S.vestDark, spine, sx * (d.chestW + 0.012), d.torso * 0.42, 0);
    }
    for (let i = 0; i < 3; i++) {
      const x = (i - 1) * 0.078;
      M(box(0.07, 0.12, 0.05), S.vest, spine, x, d.torso * 0.32, pz + 0.045);
      M(box(0.072, 0.035, 0.054), S.vestDark, spine, x, d.torso * 0.32 + 0.055, pz + 0.045, -0.1);
    }
    M(box(0.16, 0.07, 0.03), S.vestDark, spine, 0, py + ph * 0.18, pz + 0.035);
    pouchAnchor = anchor(spine, 0.078, d.torso * 0.36, pz + 0.12);
  } else if (c.vest === 'rig') {
    for (const sx of [1, -1]) M(box(0.04, d.torso * 0.6, 0.01), S.vestDark, spine, sx * d.chestW * 0.45, d.torso * 0.62, d.front + 0.01, 0, 0, sx * 0.15);
    M(box(d.chestW * 1.7, 0.16, 0.06), S.vest, spine, 0, d.torso * 0.4, d.front + 0.03);
    for (let i = 0; i < 4; i++) M(box(0.06, 0.04, 0.066), S.vestDark, spine, (i - 1.5) * 0.068, d.torso * 0.4 + 0.07, d.front + 0.032);
    pouchAnchor = anchor(spine, 0.1, d.torso * 0.42, d.front + 0.14);
  } else {
    pouchAnchor = anchor(pelvis, d.hipW * 0.8, d.waistY - 0.02, d.hipW * d.depth * 0.6 + 0.08);
    if (c.belt) M(box(0.06, 0.1, 0.035), S.strap, pelvis, d.hipW * 0.8, d.waistY - 0.07, d.hipW * d.depth * 0.6 + 0.02);
  }

  // ---- backpack ----
  if (c.pack !== 'none') {
    const big = c.pack === 'assault';
    const bw = d.chestW * (big ? 1.4 : 1.0), bh = d.torso * (big ? 0.66 : 0.55), bd = big ? 0.15 : 0.07;
    const bz = -(d.front + vestT + 0.015 + bd / 2), by = d.torso * 0.5;
    M(box(bw, bh, bd), S.pack, spine, 0, by, bz);
    if (big) {
      M(box(bw * 1.02, 0.06, bd * 1.08), S.packDark, spine, 0, by + bh / 2 - 0.02, bz, -0.08);
      M(box(bw * 0.7, bh * 0.45, 0.045), S.pack, spine, 0, by - bh * 0.15, bz - bd / 2 - 0.02);
      for (const sx of [1, -1]) {
        M(box(0.045, bh * 0.5, bd * 0.75), S.packDark, spine, sx * (bw / 2 + 0.02), by - bh * 0.1, bz);
        M(box(0.025, bh * 0.75, 0.008), S.strap, spine, sx * bw * 0.28, by, bz - bd / 2 - 0.045);
      }
    } else {
      M(new THREE.CylinderGeometry(0.008, 0.008, bh, 5), S.strap, spine, bw * 0.4, by + 0.05, bz + 0.04, 0, 0, 0.4);
    }
    if (c.vest === 'none') for (const sx of [1, -1]) M(box(0.05, 0.03, d.front * 2 + 0.06), S.strap, spine, sx * d.chestW * 0.5, d.torso * 0.88, 0);
  }

  // ---- arms ----
  const sleeveR = covered ? 0.012 : 0;
  const mkArm = (side) => {
    const upper = new THREE.Group(), fore = new THREE.Group(), hand = new THREE.Group();
    root.add(upper, fore, hand);
    const uaMat = covered && top !== 'tank' ? S.top : S.skin;
    M(tube(d.rUA, d.rUA * 0.82, d.upper), S.skin, upper);
    if (top === 'tshirt') M(tube(d.rUA + 0.016, d.rUA + 0.012, d.upper, 0, 0.55), S.top, upper);
    else if (sleeved) M(tube(d.rUA + sleeveR + (top === 'jacket' ? 0.008 : 0), d.rUA * 0.82 + sleeveR, d.upper), uaMat, upper);
    M(ball(d.rUA * 0.84), sleeved ? S.top : S.skin, fore);
    M(tube(d.rFA, d.rFA * 0.72, d.fore), S.skin, fore);
    if (sleeved) {
      if (c.sleeves === 'rolled') {
        M(tube(d.rFA + 0.012, d.rFA + 0.008, d.fore, 0, 0.32), S.top, fore);
        M(tube(d.rFA + 0.026, d.rFA + 0.022, d.fore, 0.3, 0.42), S.topDark, fore);
      } else {
        M(tube(d.rFA + 0.012, d.rFA * 0.72 + 0.012, d.fore, 0, 0.9), S.top, fore);
        M(tube(d.rFA * 0.72 + 0.018, d.rFA * 0.72 + 0.016, d.fore, 0.86, 1), S.topDark, fore);
      }
    }
    // hand (block style, wrist at origin, fingers along +Y)
    const gl = c.gloves;
    const palmMat = gl === 'none' ? S.skin : S.glove;
    const fingMat = gl === 'full' ? S.glove : S.skin;
    const hw = d.rFA * 1.9, ht = d.rFA * 1.15;
    M(box(hw, d.hand * 0.6, ht), palmMat, hand, 0, d.hand * 0.3, 0);
    if (gl === 'fingerless') M(box(hw * 1.02, d.hand * 0.18, ht * 0.92), S.glove, hand, 0, d.hand * 0.66, 0.002);
    M(box(hw * 0.96, d.hand * 0.42, ht * 0.85), fingMat, hand, 0, d.hand * 0.82, 0.006, 0.35);
    M(box(ht * 0.55, d.hand * 0.45, ht * 0.6), palmMat, hand, side * hw * 0.45, d.hand * 0.4, ht * 0.35, 0.3, 0, -side * 0.5);
    if (gl !== 'none') M(tube(d.rFA * 0.75 + 0.008, d.rFA * 0.75 + 0.008, 0.04, 0, 1, 7), S.glove, hand, 0, -0.03, 0);
    return { upper, fore, hand, side };
  };

  // ---- legs ----
  const mkLeg = (side) => {
    const thigh = new THREE.Group(), shin = new THREE.Group(), foot = new THREE.Group();
    root.add(thigh, shin, foot);
    M(ball(d.rTh * 0.98), legsFull || c.bottom === 'shorts' ? S.pants : S.skin, thigh);
    M(tube(d.rTh, d.rTh * 0.74, d.thigh), S.skin, thigh);
    const pr = baggy;
    if (legsFull) M(tube(d.rTh + pr, d.rTh * 0.74 + pr, d.thigh), S.pants, thigh);
    else M(tube(d.rTh + 0.016, d.rTh * 0.85 + 0.02, d.thigh, 0, 0.62), S.pants, thigh);
    if (c.bottom === 'cargo') {
      // cargo pocket on the outside of the thigh (local -X faces the body's left for the left leg)
      const ox = -side * (d.rTh * 0.86 + pr);
      M(box(0.03, d.thigh * 0.32, d.rTh * 1.15), S.pantsDark, thigh, ox, d.thigh * 0.52, 0);
      M(box(0.034, 0.03, d.rTh * 1.2), S.pants, thigh, ox, d.thigh * 0.36, 0, 0);
    }
    M(ball(d.rTh * 0.74 + (legsFull ? pr : 0)), legsFull ? S.pants : S.skin, shin);
    M(tube(d.rSh, d.rSh * 0.68, d.shin), S.skin, shin);
    if (legsFull) {
      const cuffR = c.bottom === 'joggers' ? d.rSh * 0.7 + 0.008 : d.rSh * 0.72 + pr + 0.008;
      M(tube(d.rSh + pr + 0.004, cuffR, d.shin, 0, 0.88), S.pants, shin);
      if (c.bottom === 'joggers') M(tube(cuffR + 0.004, cuffR + 0.004, d.shin, 0.84, 0.94), S.pantsDark, shin);
      if (c.bottom === 'cargo') M(tube(cuffR + 0.012, cuffR + 0.006, d.shin, 0.72, 0.9), S.pants, shin);
    }
    if (c.kneepads) {
      M(box(d.rSh * 1.6, 0.13, 0.04), S.knee, shin, 0, 0.035, d.rTh * 0.74 + pr + 0.012);
      M(box(d.rSh * 1.65, 0.015, 0.03), S.strap, shin, 0, 0.11, d.rTh * 0.4);
    }
    // footwear: ankle at origin, foot extends +Z; toes taper narrower and slope down
    const fw = 0.1 * d.s, a = d.ankle, boots = c.shoes === 'boots';
    const sole = boots ? 0.034 : 0.03, len = (boots ? 0.27 : 0.26) * d.s, zc = 0.065 * d.s;
    M(footGeo(fw * 1.06, sole, len + 0.012, 0.78, 0.75), S.sole, foot, 0, -a + sole / 2, zc);
    const uh = a + (boots ? 0.03 : 0.0);
    M(footGeo(fw, uh, len, 0.74, 0.3), S.shoe, foot, 0, -a + sole + uh / 2 - 0.004, zc - 0.004);
    if (boots) {
      M(tube(d.rSh * 0.72 + 0.022, d.rSh * 0.72 + 0.026, 0.14 * d.s, 0, 1, 8), S.shoe, foot, 0, -0.01, 0.0);
    }
    for (let i = 0; i < 3; i++) M(box(fw * 0.42, 0.007, 0.012), S.lace, foot, 0, -a + sole + uh * 0.82 - i * 0.012, zc + 0.02 - i * 0.03, 0.45);
    return { thigh, shin, foot, side };
  };

  const ch = {
    cfg: c, d, root, pelvis, spine, neck, head,
    armL: mkArm(1), armR: mkArm(-1), legL: mkLeg(1), legR: mkLeg(-1),
    shL, shR,
    hipL: anchor(pelvis, d.hipX, 0, 0), hipR: anchor(pelvis, -d.hipX, 0, 0),
    eye: anchor(head, 0, d.hh * 0.5, d.hd * 0.5 + 0.02),
    pouch: pouchAnchor,
    mount: anchor(spine, -d.shX * 0.62, d.shY - 0.035, d.front + vestT * 0.8 + 0.02),
    lowMount: anchor(spine, -d.shX * 0.35, d.torso * 0.58, d.front + vestT + 0.1),
  };
  root.traverse((o) => { if (o.isMesh) o.userData.player = true; });
  return ch;
}

//  Rifle (gun-local: origin at trigger, +Z = muzzle, +Y = up, -X = ejection side)

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const reticleTex = {
  holo: canvasTex(128, 128, (g, w) => {
    g.strokeStyle = '#ff2a1a'; g.fillStyle = '#ff2a1a'; g.shadowColor = '#ff2a1a'; g.shadowBlur = 6; g.lineWidth = 4;
    g.beginPath(); g.arc(w / 2, w / 2, 44, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(w / 2, w / 2, 4, 0, Math.PI * 2); g.fill();
    for (const [x, y] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) g.fillRect(w / 2 + x * 44 - 2 - (x ? x * 4 : 0), w / 2 + y * 44 - 2 - (y ? y * 4 : 0), 4 + Math.abs(x) * 4, 4 + Math.abs(y) * 4);
  }),
  reddot: canvasTex(128, 128, (g, w) => {
    g.fillStyle = '#ff2a1a'; g.shadowColor = '#ff2a1a'; g.shadowBlur = 10;
    g.beginPath(); g.arc(w / 2, w / 2, 7, 0, Math.PI * 2); g.fill();
  }),
};

const GUN_SCALE = 1.2; // stylized proportions to match the concept sheet
function buildGun(c) {
  const S = SLOT, g = new THREE.Group();
  const B = S.gun, F = S.furn, D = S.gunDark;
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, p = g) => M(geo, mat, p, x, y, z, rx, ry, rz);
  // lower receiver
  add(box(0.034, 0.05, 0.19), B, 0, 0.012, 0.03);
  add(box(0.037, 0.046, 0.075), B, 0, -0.03, 0.078);
  add(box(0.006, 0.006, 0.075), B, 0, -0.036, 0.0);
  add(box(0.004, 0.024, 0.006), D, 0, -0.018, 0.006, -0.2);
  add(box(0.028, 0.105, 0.04), F, 0, -0.072, -0.05, 0.38);
  add(box(0.008, 0.012, 0.03), D, 0.018, 0.02, -0.02); // safety selector
  add(box(0.006, 0.03, 0.012), D, 0.018, 0.0, 0.05);  // bolt catch
  // upper receiver + rail
  add(box(0.032, 0.046, 0.21), B, 0, 0.059, 0.035);
  add(box(0.022, 0.008, 0.21), B, 0, 0.086, 0.035);
  for (let i = 0; i < 13; i++) add(box(0.025, 0.005, 0.007), D, 0, 0.0915, -0.055 + i * 0.0145);
  add(box(0.002, 0.016, 0.052), D, -0.0162, 0.06, 0.045);
  const bolt = add(box(0.003, 0.011, 0.04), S.bolt, -0.0172, 0.06, 0.045);
  add(box(0.012, 0.014, 0.022), B, -0.019, 0.073, -0.01);
  const chg = new THREE.Group(); chg.position.set(0, 0.078, -0.07); g.add(chg);
  add(box(0.05, 0.008, 0.012), B, 0, 0, -0.008, 0, 0, 0, chg);
  add(box(0.012, 0.008, 0.035), B, 0, 0, 0.012, 0, 0, 0, chg);
  // buffer tube + adjustable stock
  add(cylZ(0.015, 0.19, 10), B, 0, 0.052, -0.165);
  add(box(0.042, 0.052, 0.12), F, 0, 0.052, -0.228);
  add(box(0.034, 0.07, 0.05), F, 0, 0.004, -0.262, -0.35);
  add(box(0.044, 0.135, 0.024), S.rubber, 0, 0.03, -0.298);
  add(box(0.012, 0.03, 0.05), D, 0, 0.018, -0.21);
  add(box(0.03, 0.01, 0.07), F, 0, 0.082, -0.24);
  // handguard (octagonal, M-LOK)
  const hgLen = 0.32, hgZ = 0.135 + hgLen / 2;
  const hgGeo = cylZ(0.029, hgLen, 8); hgGeo.rotateZ(Math.PI / 8);
  add(hgGeo, B, 0, 0.056, hgZ);
  add(box(0.022, 0.008, hgLen), B, 0, 0.088, hgZ);
  for (let i = 0; i < 20; i++) add(box(0.025, 0.005, 0.007), D, 0, 0.0935, 0.14 + i * 0.0155);
  for (let i = 0; i < 5; i++) {
    for (const sx of [1, -1]) add(box(0.003, 0.009, 0.03), D, sx * 0.0275, 0.056, 0.17 + i * 0.058);
    add(box(0.009, 0.003, 0.03), D, 0, 0.0275, 0.17 + i * 0.058);
    for (const sx of [1, -1]) add(box(0.003, 0.009, 0.03), D, sx * 0.0195, 0.0355, 0.17 + i * 0.058, 0, 0, sx * Math.PI / 4);
  }
  // barrel + muzzle device
  add(cylZ(0.0088, 0.13, 8), D, 0, 0.056, 0.52);
  let muzzleZ = 0.64;
  if (c.muzzle === 'flash') {
    add(cylZ(0.0115, 0.06, 8), D, 0, 0.056, 0.61);
    for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4; add(box(0.004, 0.004, 0.035), S.rubber, Math.cos(a) * 0.0105, 0.056 + Math.sin(a) * 0.0105, 0.62); }
  } else if (c.muzzle === 'brake') {
    add(box(0.028, 0.024, 0.06), D, 0, 0.056, 0.61);
    for (let i = 0; i < 3; i++) add(box(0.03, 0.008, 0.008), S.rubber, 0, 0.056, 0.592 + i * 0.016);
  } else {
    add(cylZ(0.0195, 0.18, 10), D, 0, 0.056, 0.67);
    muzzleZ = 0.765;
  }
  // optic
  let eyeY = 0.128, reticle = null;
  if (c.optic === 'holo') {
    add(box(0.036, 0.016, 0.09), B, 0, 0.099, 0.06);
    for (const sx of [1, -1]) add(box(0.004, 0.046, 0.06), B, sx * 0.018, 0.128, 0.075);
    add(box(0.04, 0.008, 0.062), B, 0, 0.153, 0.075);
    add(box(0.03, 0.022, 0.02), D, 0, 0.115, 0.03);
    add(box(0.008, 0.008, 0.012), D, 0.022, 0.112, 0.045);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.032, 0.038), S.glass); glass.position.set(0, 0.129, 0.104); g.add(glass);
  } else if (c.optic === 'reddot') {
    eyeY = 0.13;
    add(box(0.022, 0.03, 0.04), B, 0, 0.105, 0.06);
    const tubeG = cylZ(0.019, 0.07, 12, true);
    add(tubeG, new THREE.MeshStandardMaterial({ color: SLOT.gun.color, roughness: 0.45, metalness: 0.55, side: THREE.DoubleSide, flatShading: true }), 0, eyeY, 0.06);
    add(cylZ(0.008, 0.02, 8), D, 0.022, eyeY, 0.06);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.018, 12), S.glass); glass.position.set(0, eyeY, 0.094); g.add(glass);
  } else {
    eyeY = 0.112;
    add(box(0.028, 0.026, 0.024), B, 0, 0.104, -0.04);
    add(box(0.006, 0.01, 0.006), D, 0, 0.117, -0.04);
    add(box(0.022, 0.03, 0.02), B, 0, 0.104, 0.43);
    add(box(0.004, 0.024, 0.004), D, 0, 0.122, 0.43);
  }
  if (c.optic !== 'irons') {
    reticle = new THREE.Mesh(new THREE.PlaneGeometry(0.03, 0.03), new THREE.MeshBasicMaterial({
      map: reticleTex[c.optic], transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false, side: THREE.DoubleSide }));
    reticle.position.set(0, eyeY, 0.085); g.add(reticle);
  }
  // foregrip
  let support = { wrist: new V3(0.004, -0.02, 0.245), palm: new V3(0, 0.02, 0.31) };
  if (c.grip === 'vertical') {
    add(new THREE.CylinderGeometry(0.014, 0.016, 0.085, 8), F, 0, -0.015, 0.31);
    support = { wrist: new V3(0, -0.035, 0.265), palm: new V3(0, -0.02, 0.31) };
  } else if (c.grip === 'angled') {
    add(box(0.026, 0.032, 0.07), F, 0, 0.014, 0.27, 0.45);
    support = { wrist: new V3(0, -0.03, 0.22), palm: new V3(0, 0.0, 0.28) };
  }
  // magazine
  const mag = new THREE.Group(); mag.position.set(0, -0.045, 0.078); g.add(mag);
  add(box(0.024, 0.09, 0.062), F, 0, -0.045, 0, 0, 0, 0, mag);
  add(box(0.024, 0.075, 0.06), F, 0, -0.118, 0.01, -0.22, 0, 0, mag);
  add(box(0.028, 0.012, 0.068), F, 0, -0.158, 0.019, -0.22, 0, 0, mag);
  for (let i = 0; i < 3; i++) add(box(0.026, 0.004, 0.05), S.rubber, 0, -0.03 - i * 0.03, 0, -0.07 * i, 0, 0, mag);
  g.scale.setScalar(GUN_SCALE);
  g.traverse((o) => { if (o.isMesh) o.userData.player = true; });
  return {
    group: g, mag, bolt, chg, reticle,
    muzzle: new V3(0, 0.056, muzzleZ), eye: new V3(0, eyeY, -0.17), sightH: eyeY - 0.056,
    gripWrist: new V3(-0.003, -0.035, -0.105), gripPalm: new V3(0, -0.06, -0.035),
    support, butt: new V3(0, 0.035, -0.31), port: new V3(-0.02, 0.06, 0.045),
    magwell: new V3(0, -0.235, 0.1), magLow: new V3(0.02, -0.36, 0.07), boltCatch: new V3(0.04, 0.0, 0.03),
    suppressed: c.muzzle === 'suppressor', brake: c.muzzle === 'brake',
  };
}

const keys = {};
function spring(o, x, v, k, c, dt) { o[v] += (-k * o[x] - c * o[v]) * dt; o[x] += o[v] * dt; }

function updateRange(dt, time) {
  // movement
  const fwd = T.a.set(-Math.sin(P.yaw), 0, -Math.cos(P.yaw)), right = T.b.set(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  const ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), iz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const sprint = (keys.ShiftLeft || keys.ShiftRight) && iz > 0 && !P.ads && !P.reload;
  if (sprint && P.crouch) P.crouch = false;
  const spd = sprint ? 5.6 : P.crouch ? 1.5 : P.ads ? 1.8 : 3.1;
  const wish = T.c.copy(fwd).multiplyScalar(iz).addScaledVector(right, ix);
  if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(spd);
  P.vel.lerp(wish, 1 - Math.exp(-10 * dt));
  P.pos.addScaledVector(P.vel, dt);
  P.pos.x = clamp(P.pos.x, -40, 40); P.pos.z = clamp(P.pos.z, -160, 30);

  P.adsT = damp(P.adsT, P.ads && !sprint && !P.reload ? 1 : 0, 14, dt);
  P.sprintT = damp(P.sprintT, sprint ? 1 : 0, 8, dt);
  P.lowT = damp(P.lowT, sprint ? 1 : 0, 9, dt);
  P.crouchT = damp(P.crouchT, P.crouch ? 1 : 0, 9, dt);
  P.fpT = damp(P.fpT, P.fp ? 1 : 0, 10, dt);
  P.bloom = Math.max(0, P.bloom - dt * 5);
  for (let i = 0; i < 2; i++) {
    const h = dt / 2;
    spring(P.kick, 'z', 'vz', 380, 28, h); spring(P.kick, 'rx', 'vrx', 300, 24, h); spring(P.kick, 'ry', 'vry', 300, 24, h);
    spring(P.cr, 'p', 'vp', 90, 16, h); spring(P.cr, 'y', 'vy', 90, 16, h);
  }
  if (P.reload) {
    const r = P.reload, t0 = r.t;
    r.t += dt;
    for (const [t, e] of r.def.ev) if (t > t0 && t <= r.t) reloadEvent(e);
  }

  // camera orientation (breathing sway while aiming)
  const sw = P.adsT * (1 - 0.5 * P.crouchT);
  const pitch = clamp(P.pitch + P.cr.p + Math.sin(time * 1.3) * 0.0012 * sw, -1.4, 1.4);
  const yaw = P.yaw + P.cr.y + Math.sin(time * 0.83) * 0.0009 * sw;
  _e1.set(pitch, yaw, 0, 'YXZ'); T.camQ.setFromEuler(_e1);
  T.camFwd.set(0, 0, -1).applyQuaternion(T.camQ);

  // body
  ch.root.position.copy(P.pos);
  ch.root.rotation.set(0, P.yaw + Math.PI, 0);
  const lv = T.d.copy(P.vel).applyAxisAngle(UP, -(P.yaw + Math.PI));
  poseBody(dt, time, { localVel: lv, bladed: 1 - P.lowT, lean: 0.22 * P.sprintT + 0.12 * P.crouchT - 0.3 * pitch * (1 - P.lowT), lookPitch: pitch * (1 - P.lowT * 0.5), crouchT: P.crouchT, sprintT: P.sprintT });
  ch.head.visible = P.fpT < 0.5;

  // camera base position
  const eyeW = ch.eye.getWorldPosition(T.e);
  P.camY = damp(P.camY, eyeW.y, 12, dt);
  const off = T.a.set(lerp(0.78, 0.66, P.adsT), lerp(0.24, 0.1, P.adsT), lerp(2.7, 1.5, P.adsT)).applyQuaternion(T.camQ);
  const tp = T.b.set(P.pos.x, P.camY + 0.05, P.pos.z).add(off);
  T.camBase.copy(tp).lerp(eyeW, P.fpT);

  // aim point from the camera centre
  ray.set(T.camBase, T.camFwd); ray.near = 0.5; ray.far = 400;
  const hits = ray.intersectObjects(hitList, false);
  if (hits.length) T.aim.copy(hits[0].point);
  else if (T.camFwd.y < -0.01) T.aim.copy(T.camBase).addScaledVector(T.camFwd, Math.min(400, -T.camBase.y / T.camFwd.y));
  else T.aim.copy(T.camBase).addScaledVector(T.camFwd, 400);
  const mountW = ch.mount.getWorldPosition(T.c);
  const dirW = T.d.subVectors(T.aim, mountW).normalize().lerp(T.camFwd, P.fpT * P.adsT).normalize();
  const dirRoot = dirW.applyQuaternion(_q2.copy(ch.root.quaternion).invert());
  poseGun(dt, dirRoot, P.lowT, false);

  // final camera: through the optic in first person ADS
  camera.quaternion.copy(T.camQ);
  const k = P.fpT * P.adsT;
  if (k > 0.001) camera.position.copy(T.camBase).lerp(gun.group.localToWorld(T.a.copy(gun.eye)), k);
  else camera.position.copy(T.camBase);
  const fovT = lerp(68, P.fp ? 46 : 52, P.adsT) + P.sprintT * 4;
  if (Math.abs(camera.fov - fovT) > 0.01) { camera.fov = fovT; camera.updateProjectionMatrix(); }

  trigger(time);
  updateHud();
}

function updateCustom(dt, time) {
  if (turntable) orbit.tyaw += dt * 0.35;
  orbit.yaw = damp(orbit.yaw, orbit.tyaw, 10, dt);
  orbit.pitch = damp(orbit.pitch, orbit.tpitch, 10, dt);

  P.vel.set(0, 0, 0); P.adsT = 0; P.lowT = 0; P.crouchT = 0; P.sprintT = 0; P.fpT = 0;
  P.kick.z = P.kick.rx = P.kick.ry = 0;
  for (const kk of ['vz', 'vrx', 'vry']) P.kick[kk] = 0;
  ch.root.position.copy(P.pos);
  ch.root.rotation.set(0, 0, 0);
  ch.head.visible = true;
  const relaxed = pose === 'relaxed';
  poseBody(dt, time, { localVel: T.d.set(0, 0, 0), bladed: pose === 'aim' ? 1 : pose === 'ready' ? 0.35 : 0, lean: 0, lookPitch: 0, crouchT: 0, sprintT: 0 });

  const tgt = T.a.set(P.pos.x, P.pos.y + h, P.pos.z);

    tgt.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist,
    tgt.y + Math.sin(orbit.pitch) * orbit.dist,
    tgt.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist);

  const narrow = innerWidth <= 760;
  camera.setViewOffset(innerWidth, innerHeight, narrow ? 0 : 180, narrow ? innerHeight * 0.2 : 0, innerWidth, innerHeight);

    case 'KeyB': P.mode = (P.mode + 1) % MODES.length; P.burst = 0; audio.switchMode(); break;
    case 'KeyV': P.fp = !P.fp; break;
