<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<!--BEGIN-->
<title>Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: full-bleed canvas world; HTML overlays for HUD and menus, anchored to safe-area edges. Single dark look by design. */
:root{
  --void:#05060b; --ink:#ece6d6; --dim:rgba(236,230,214,.58); --faint:rgba(236,230,214,.14);
  --gold:#ffd08a; --teal:#86f2df; --ember:#ff5d73; --glass:rgba(8,8,16,.78);
  --display:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --ui:'Jost','Futura','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.55) 100%)}
#hurt{background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(255,40,70,.42) 100%);opacity:0}
#grain{inset:-60px;opacity:.055;animation:grain .8s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-23px,14px)}40%{transform:translate(17px,-29px)}60%{transform:translate(-31px,-9px)}80%{transform:translate(9px,27px)}}

button{font:inherit;color:inherit}
.btn{background:none;border:0;padding:10px 0;cursor:pointer;display:flex;align-items:center;gap:16px;
  font:500 13px/1 var(--ui);letter-spacing:.34em;text-transform:uppercase;color:var(--dim);transition:color .25s}
.btn::before{content:"";width:22px;height:1px;background:currentColor;opacity:.45;transition:width .3s,opacity .3s}
.btn:hover,.btn:focus-visible,.btn.sel{color:var(--gold);outline:none}
.btn:hover::before,.btn:focus-visible::before,.btn.sel::before{width:46px;opacity:1}
.btn kbd{font:400 10px var(--ui);letter-spacing:.1em;color:var(--faint);border:1px solid var(--faint);padding:3px 6px;border-radius:2px}

.screen{position:fixed;inset:0;display:flex}
/* Title */
#title{align-items:flex-end;padding:0 max(28px,env(safe-area-inset-right)) max(44px,calc(env(safe-area-inset-bottom) + 28px)) max(28px,calc(env(safe-area-inset-left) + 4vw))}
.tblock{display:flex;flex-direction:column;gap:22px;max-width:640px}
.logo{font:300 clamp(64px,12vw,160px)/.85 var(--display);letter-spacing:.3em;margin:0 -.3em 0 0;
  color:#fff7e6;text-shadow:0 0 28px rgba(255,208,138,.45),0 0 90px rgba(255,208,138,.18);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{text-shadow:0 0 40px rgba(255,208,138,.6),0 0 120px rgba(255,208,138,.26)}}
.tag{font:italic 300 clamp(20px,2.4vw,28px)/1.3 var(--display);color:var(--dim);margin:0}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;font:400 11px/1.6 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:rgba(236,230,214,.36)}
.legend b{font-weight:500;color:var(--dim)}
.best{font:400 11px var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);opacity:.75}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.xp{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,208,138,.08)}
.xp i{position:absolute;inset:0;background:linear-gradient(90deg,#c98a3a,var(--gold),#fff3d6);transform-origin:0 50%;transform:scaleX(0);box-shadow:0 0 12px rgba(255,208,138,.7);transition:transform .15s}
.htop{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;
  padding:max(14px,calc(env(safe-area-inset-top) + 10px)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left))}
.lab{font:500 10px var(--ui);letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
.val{font:400 22px/1.1 var(--display);font-variant-numeric:tabular-nums;color:var(--ink)}
.hl{display:flex;flex-direction:column;gap:3px}
.hr{display:flex;flex-direction:column;gap:3px;align-items:flex-end;text-align:right}
.hc{display:flex;flex-direction:column;align-items:center;gap:8px}
#hTime{font:400 36px/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;color:#fff4de;text-shadow:0 0 18px rgba(255,208,138,.35)}
#boss{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(520px,64vw)}
#boss .lab{color:var(--ember);letter-spacing:.5em}
.bbar{width:100%;height:3px;background:rgba(255,93,115,.14);position:relative}
.bbar i{position:absolute;inset:0;background:linear-gradient(90deg,#8a1630,var(--ember));transform-origin:0 50%;box-shadow:0 0 10px rgba(255,93,115,.6)}
.hbot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  padding:0 max(20px,env(safe-area-inset-right)) max(16px,calc(env(safe-area-inset-bottom) + 12px)) max(20px,env(safe-area-inset-left))}
#inv{display:flex;flex-wrap:wrap;gap:10px;max-width:60vw}
.slot{width:30px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--gold)}
.slot.p{color:var(--teal)}
.slot svg{width:22px;height:22px;filter:drop-shadow(0 0 6px currentColor)}
.pips{display:flex;gap:2px}
.pips i{width:4px;height:4px;transform:rotate(45deg);background:currentColor;opacity:.2}
.pips i.on{opacity:1}
.light{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lbar{width:150px;height:2px;background:rgba(255,208,138,.12);position:relative}
.lbar i{position:absolute;inset:0;background:var(--gold);transform-origin:100% 50%;box-shadow:0 0 10px rgba(255,208,138,.8)}
#announce{position:absolute;left:0;right:0;top:27%;text-align:center;pointer-events:none;padding:0 16px}
#announce .a1{font:italic 300 clamp(30px,4.6vw,54px)/1.1 var(--display);color:#fff3dc;letter-spacing:.04em;text-shadow:0 0 30px rgba(255,208,138,.35)}
#announce .a2{margin-top:10px;font:500 11px var(--ui);letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
#announce.show{animation:ann 3.4s ease forwards}
#announce.red .a1{color:#ffd5db;text-shadow:0 0 30px rgba(255,93,115,.55)}
@keyframes ann{0%{opacity:0;transform:translateY(8px);filter:blur(6px)}14%{opacity:1;transform:none;filter:none}78%{opacity:1}100%{opacity:0;filter:blur(4px)}}
#dashBtn{position:fixed;pointer-events:auto;right:max(26px,calc(env(safe-area-inset-right) + 18px));bottom:max(70px,calc(env(safe-area-inset-bottom) + 60px));
  width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,208,138,.35);background:rgba(255,208,138,.06);
  font:500 10px var(--ui);letter-spacing:.3em;color:var(--gold);text-transform:uppercase;padding-left:.3em}

/* Overlays */
.veil{position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(ellipse at 50% 45%,rgba(5,6,11,.55),rgba(5,6,11,.92));padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));overflow-y:auto}
.vh{text-align:center;display:flex;flex-direction:column;gap:8px}
.vh h2{margin:0;font:300 clamp(36px,5vw,58px)/1 var(--display);letter-spacing:.06em;color:#fff3dc;text-shadow:0 0 30px rgba(255,208,138,.35);text-wrap:balance}
.vh p{margin:0;font:500 11px var(--ui);letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
.cards{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.card{position:relative;width:228px;min-height:250px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;
  padding:24px 22px 22px;background:linear-gradient(180deg,rgba(24,21,36,.94),rgba(8,8,16,.96));
  border:1px solid rgba(255,208,138,.16);border-radius:2px;transition:transform .22s ease,border-color .22s,box-shadow .22s;
  animation:cardIn .45s cubic-bezier(.2,.8,.2,1) backwards}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}}
.card:hover,.card.sel,.card:focus-visible{transform:translateY(-6px);border-color:rgba(255,208,138,.62);box-shadow:0 0 48px rgba(255,208,138,.13),inset 0 0 30px rgba(255,208,138,.05);outline:none}
.card.p:hover,.card.p.sel,.card.p:focus-visible{border-color:rgba(134,242,223,.6);box-shadow:0 0 48px rgba(134,242,223,.12),inset 0 0 30px rgba(134,242,223,.05)}
.cards.lock .card{pointer-events:none}
.card .ic{width:46px;height:46px;color:var(--gold)}
.card.p .ic{color:var(--teal)}
.card .ic svg{width:100%;height:100%;filter:drop-shadow(0 0 8px currentColor)}
.card .kind{font:500 10px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
.card .kind em{font-style:normal;color:var(--teal)}
.card .nm{font:500 30px/1 var(--display);color:#fff3dc}
.card .ds{font:300 15px/1.5 var(--ui);color:rgba(236,230,214,.8)}
.card .pips{margin-top:auto;color:var(--gold)}
.card.p .pips{color:var(--teal)}
.card .pips i{width:6px;height:6px;margin-right:3px}
.card .key{position:absolute;top:14px;right:16px;font:400 11px var(--ui);color:var(--faint)}
.vmenu{display:flex;flex-direction:column;gap:2px}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:10px 44px;text-align:center}
.stats div{display:flex;flex-direction:column;gap:6px}
.stats .val{font-size:34px}
@media (max-width:760px){
  .cards{flex-direction:column;align-items:center;gap:10px}
  .card{width:min(100%,440px);min-height:0;display:grid;grid-template-columns:40px 1fr;column-gap:16px;row-gap:4px;padding:16px 18px}
  .card .ic{width:36px;height:36px;grid-row:span 4}
  .card .nm{font-size:24px}.card .ds{font-size:14px}.card .key{display:none}
  .stats{grid-template-columns:repeat(2,auto)}
  #hTime{font-size:28px}.val{font-size:18px}
  .lbar{width:96px}
}
@media (prefers-reduced-motion:reduce){#grain,.logo{animation:none}.card{animation:none}}
</style>

<canvas id="cv" tabindex="0" aria-label="Lumen game view"></canvas>
<div id="grain" class="fx"></div>
<div id="vig" class="fx"></div>
<div id="hurt" class="fx"></div>

<div id="hud" hidden>
  <div class="xp"><i id="xpFill"></i></div>
  <div class="htop">
    <div class="hl"><span class="lab">Level</span><span class="val" id="hLvl">1</span></div>
    <div class="hc"><span id="hTime">00:00</span>
      <div id="boss" hidden><span class="lab">The Hollow</span><div class="bbar"><i id="bossFill"></i></div></div>
    </div>
    <div class="hr"><span class="lab">Banished</span><span class="val" id="hKills">0</span></div>
  </div>
  <div id="announce"><div class="a1" id="a1"></div><div class="a2" id="a2"></div></div>
  <div class="hbot">
    <div id="inv"></div>
    <div class="light"><span class="lab">Light</span><div class="lbar"><i id="lightFill"></i></div></div>
  </div>
  <button id="dashBtn" hidden>Dash</button>
</div>

<section id="title" class="screen">
  <div class="tblock">
    <h1 class="logo">LUMEN</h1>
    <p class="tag">The dark is endless. Your light is not.</p>
    <div class="menu">
      <button class="btn sel" id="bStart">Begin <kbd>Enter</kbd></button>
      <button class="btn" id="bSound">Sound · On</button>
    </div>
    <div class="legend"><span><b>WASD</b> move</span><span><b>Space</b> dash</span><span><b>Esc</b> pause</span><span>Your weapons fire on their own</span></div>
    <div class="best" id="bestLine" hidden></div>
  </div>
</section>

<section id="levelup" class="screen veil" hidden>
  <div class="vh"><p>Level <span id="luLvl">2</span></p><h2>The light grows</h2></div>
  <div class="cards" id="cards"></div>
  <div class="legend"><span><b>1 2 3</b> or <b>click</b> to choose</span></div>
</section>

<section id="pause" class="screen veil" hidden>
  <div class="vh"><p>Paused</p><h2>Breathe</h2></div>
  <div class="vmenu">
    <button class="btn sel" id="bResume">Resume <kbd>Esc</kbd></button>
    <button class="btn" id="bRestart">Restart run</button>
    <button class="btn" id="bSound2">Sound · On</button>
    <button class="btn" id="bQuit">Return to title</button>
  </div>
</section>

<section id="end" class="screen veil" hidden>
  <div class="vh"><p id="endSub">You were consumed</p><h2 id="endTitle">The light fades</h2></div>
  <div class="stats">
    <div><span class="lab">Survived</span><span class="val" id="sTime">0</span></div>
    <div><span class="lab">Level</span><span class="val" id="sLvl">0</span></div>
    <div><span class="lab">Banished</span><span class="val" id="sKills">0</span></div>
    <div><span class="lab">Best</span><span class="val" id="sBest">0</span></div>
  </div>
  <div class="vmenu">
    <button class="btn sel" id="bAgain">Rise again <kbd>Enter</kbd></button>
    <button class="btn" id="bTitle">Return to title</button>
  </div>
</section>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function hash2(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

/* ============================== AUDIO (all synthesized) ============================== */
const AU={c:null,m:null,sfx:null,mus:null,rev:null,nb:null,muted:!!store.get('lumen.muted',false),last:Object.create(null),
  init(){
    if(this.c){if(this.c.state==='suspended')this.c.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    let c;try{c=this.c=new AC();}catch(e){return;}
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.2;comp.connect(c.destination);
    this.m=c.createGain();this.m.gain.value=this.muted?0:0.85;this.m.connect(comp);
    this.sfx=c.createGain();this.sfx.gain.value=1;this.sfx.connect(this.m);
    this.mus=c.createGain();this.mus.gain.value=0.6;this.mus.connect(this.m);
    const len=Math.floor(c.sampleRate*3.2),ir=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8);}
    this.rev=c.createConvolver();this.rev.buffer=ir;const rg=c.createGain();rg.gain.value=0.42;this.rev.connect(rg);rg.connect(this.m);
    const nl=Math.floor(c.sampleRate*1.5);this.nb=c.createBuffer(1,nl,c.sampleRate);const nd=this.nb.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
    MUS.start();
  },
  setMuted(v){this.muted=v;store.set('lumen.muted',v);if(this.m)this.m.gain.setTargetAtTime(v?0:0.85,this.c.currentTime,0.05);},
  gate(k,ms){const n=performance.now();if(this.last[k]&&n-this.last[k]<ms)return false;this.last[k]=n;return true;},
  tone(f,d,o){o=o||{};const c=this.c;if(!c||this.muted)return;const t=c.currentTime+(o.at||0);
    const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.to),t+d);if(o.det)os.detune.value=o.det;
    const g=c.createGain();const v=o.v||0.1,a=o.a||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(d,a+0.02));
    let n=os;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);n=fl;}
    n.connect(g);g.connect(o.bus||this.sfx);if(o.rev){const s=c.createGain();s.gain.value=o.rev;g.connect(s);s.connect(this.rev);}
    os.start(t);os.stop(t+Math.max(d,a)+0.06);},
  noise(d,o){o=o||{};const c=this.c;if(!c||this.muted)return;const t=c.currentTime+(o.at||0);
    const s=c.createBufferSource();s.buffer=this.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=o.ft||'bandpass';fl.frequency.setValueAtTime(o.f||1000,t);
    if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+d);fl.Q.value=o.q||0.8;
    const g=c.createGain();const v=o.v||0.1;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.a||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(o.bus||this.sfx);if(o.rev){const r=c.createGain();r.gain.value=o.rev;g.connect(r);r.connect(this.rev);}
    s.start(t,Math.random());s.stop(t+d+0.06);}
};
const PENTA=[0,3,5,7,10];
const SFX={
  shoot(){if(AU.gate('sh',50))AU.tone(rand(1250,1450),0.08,{type:'triangle',to:620,v:0.022});},
  hit(){if(AU.gate('hit',32))AU.noise(0.045,{ft:'highpass',f:3200,v:0.05});},
  kill(n){if(!AU.gate('k',34))return;const s=PENTA[n%5]+12*(Math.floor(n/5)%3);AU.tone(mtof(69+s),0.42,{v:0.04,rev:0.55});AU.tone(mtof(81+s),0.16,{v:0.012,type:'triangle'});},
  pick(n){if(!AU.gate('p',24))return;const s=PENTA[n%5]+12*Math.min(2,Math.floor(n/5));AU.tone(mtof(81+s),0.1,{v:0.022,rev:0.3});},
  level(){[0,4,7,11,14,19].forEach((s,i)=>AU.tone(mtof(69+s),1.4,{at:i*0.075,v:0.055,rev:0.75,type:i%2?'triangle':'sine'}));},
  select(){AU.tone(mtof(81),0.2,{v:0.05,rev:0.4});AU.tone(mtof(88),0.5,{at:0.06,v:0.04,rev:0.6});},
  hurt(){AU.tone(170,0.42,{to:42,v:0.32});AU.noise(0.28,{ft:'lowpass',f:900,v:0.16});},
  dash(){AU.noise(0.26,{f:500,fto:2800,q:2.2,v:0.11});AU.tone(520,0.18,{to:1040,v:0.015,type:'triangle'});},
  nova(){if(!AU.gate('nv',120))return;AU.tone(120,0.6,{to:42,v:0.2});AU.noise(0.55,{ft:'lowpass',f:1600,fto:180,v:0.07,rev:0.4});},
  arc(){if(!AU.gate('arc',70))return;AU.noise(0.14,{f:4200,q:5,v:0.06});AU.tone(1900,0.1,{type:'square',to:280,v:0.01});},
  fly(){if(AU.gate('fly',120))AU.tone(rand(1800,2200),0.12,{to:2600,v:0.012,rev:0.3});},
  beat(){AU.tone(66,0.2,{to:38,v:0.32});AU.tone(66,0.2,{at:0.24,to:38,v:0.22});},
  spit(){if(AU.gate('sp',90))AU.tone(320,0.22,{type:'sawtooth',to:110,v:0.028,lp:900});},
  heal(){AU.tone(mtof(76),0.6,{v:0.05,rev:0.6});AU.tone(mtof(83),0.8,{at:0.08,v:0.04,rev:0.7});},
  roar(){[41,41*1.498,41*1.01].forEach(f=>AU.tone(f,2.6,{type:'sawtooth',to:f*0.55,v:0.13,lp:420,a:0.5,rev:0.6}));AU.noise(2.2,{ft:'lowpass',f:300,fto:60,v:0.2,a:0.4});},
  boom(){AU.tone(58,2.2,{to:22,v:0.5});AU.noise(2,{ft:'lowpass',f:2400,fto:70,v:0.28,rev:0.7});},
  dawn(){[57,64,69,73,76,81,88].forEach((m,i)=>AU.tone(mtof(m),4.5,{at:i*0.16,v:0.05,rev:0.9,a:0.3,type:i%2?'triangle':'sine'}));},
  fade(){AU.tone(220,2.4,{to:55,v:0.12,rev:0.8,a:0.05});AU.tone(330,2.4,{to:82,v:0.06,rev:0.8,type:'triangle'});},

  for(const e of S.enemies){if(e.dead)continue;const k=hkey(Math.floor(e.x/CELL),Math.floor(e.y/CELL));let a=HASH.get(k);if(!a){a=[];HASH.set(k,a);}a.push(e);}
  if(HASH.size>4000){for(const [k,a] of HASH)if(!a.length)HASH.delete(k);}}
function near(x,y,r){NB.length=0;const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=HASH.get(hkey(cx,cy));if(a)for(const e of a)if(!e.dead)NB.push(e);}return NB;}

  showOnly('levelup');SFX.level();setTimeout(()=>wrap.classList.remove('lock'),380);}
function setSel(i){S.sel=(i+3)%3;[...$('cards').children].forEach((c,j)=>c.classList.toggle('sel',j===S.sel));}
function pick(i){if(S.mode!=='level'||performance.now()-S.lvAt<380)return;const k=S.opts[i];
  if(k==='mend')P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*0.5);
  else{const was=ST.maxHp;S.inv[k]=(S.inv[k]||0)+1;stats();if(k==='radiance')P.hp+=ST.maxHp-was;}
  SFX.select();buildInv();S.pending--;
  if(S.pending>0){openLevel();return;}
  showOnly(null);S.mode='play';cv.focus({preventScroll:true});
  S.rings.push({x:P.x,y:P.y,r:0,max:240,l:0.6,ml:0.6,col:'gold',w:2});
  for(const e of S.enemies){const ddx=e.x-P.x,ddy=e.y-P.y,d=Math.hypot(ddx,ddy)||1;if(d<240&&!e.boss){e.kx+=ddx/d*380;e.ky+=ddy/d*380;}}}
function buildInv(){const el=$('inv');el.innerHTML='';for(const k in ITEMS){const l=L(k);if(!l)continue;const d=document.createElement('div');d.className='slot'+(ITEMS[k].t==='p'?' p':'');
  let p='<div class="pips">';for(let j=0;j<MAXLV;j++)p+=`<i class="${j<l?'on':''}"></i>`;d.innerHTML=svg(k)+p+'</div>';d.title=ITEMS[k].name;el.appendChild(d);}}
function refreshSound(){const t='Sound · '+(AU.muted?'Off':'On');$('bSound').textContent=t;$('bSound2').textContent=t;}
function toggleMute(){AU.setMuted(!AU.muted);refreshSound();}

/* ============================== SIMULATION ============================== */
function viewHalf(){return{hw:W/2/Z,hh:H/2/Z};}
function spawnRing(){const {hw,hh}=viewHalf();return Math.hypot(hw,hh)+70;}
function spawnEnemy(type,x,y,o){const T=ETYPE[type],t=S.t,mul=1+t/95+(t>240?(t-240)/55:0);
  const e={type,x,y,kx:0,ky:0,hp:T.hp*mul,max:T.hp*mul,r:T.r,spd:T.spd*rand(0.92,1.08),dmg:T.dmg,xp:T.xp,T,seed:rand(0,100),flash:0,haloT:0,spawnT:0,atk:rand(1.5,3),dead:false,elite:false,ang:0};
  if(o&&o.elite){e.elite=true;e.hp*=5;e.max=e.hp;e.r*=1.35;e.xp*=12;e.dmg*=1.4;}
  S.enemies.push(e);return e;}
function pickType(t){const r=Math.random();
  if(t>175&&r<0.11)return'splitter';if(t>140&&r<0.18)return'brute';if(t>105&&r<0.28)return'spitter';if(t>40&&r<0.5)return'lurker';return'shade';}
function spawner(dt){const t=S.t;let rate=1.15+t*0.032+(t>240?(t-240)*0.045:0);rate=Math.min(rate,11.5);if(S.boss)rate*=0.35;
  S.spawnAcc+=rate*dt;const R=spawnRing();
  while(S.spawnAcc>=1){S.spawnAcc-=1;if(S.enemies.length>=300)break;const a=Math.random()*TAU;
    spawnEnemy(pickType(t),P.x+Math.cos(a)*R,P.y+Math.sin(a)*R,{elite:t>100&&Math.random()<0.012});}
  const ev=(id,at,fn)=>{if(t>=at&&!S.ev[id]){S.ev[id]=1;fn();}};
  ev('open',0,()=>{for(let i=0;i<7;i++){const a=i/7*TAU+rand(-.2,.2);spawnEnemy('shade',P.x+Math.cos(a)*R*0.62,P.y+Math.sin(a)*R*0.62);}});
  ev('ring1',88,()=>{announce('They circle','Break through');const n=30;for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy('shade',P.x+Math.cos(a)*R*0.9,P.y+Math.sin(a)*R*0.9);}});
  ev('rush',150,()=>{announce('A stampede','From the dark, at speed');const a=Math.random()*TAU,px=-Math.sin(a),py=Math.cos(a);
    for(let i=0;i<26;i++){const o=(i-13)*30;const e=spawnEnemy('lurker',P.x+Math.cos(a)*R+px*o,P.y+Math.sin(a)*R+py*o);e.spd*=1.25;}});
  ev('ring2',212,()=>{announce('They circle','Tighter now');const n=40;for(let i=0;i<n;i++){const a=i/n*TAU;spawnEnemy(i%8===0?'brute':'shade',P.x+Math.cos(a)*R*0.85,P.y+Math.sin(a)*R*0.85);}});
  ev('boss',300,()=>{const a=Math.random()*TAU;const b=spawnEnemy('shade',P.x+Math.cos(a)*R,P.y+Math.sin(a)*R);
    Object.assign(b,{type:'hollow',boss:true,hp:9000,max:9000,r:62,spd:54,dmg:24,xp:0,atk:3,pat:0,spiral:0,spT:0,T:{n:14,amp:0.13,sx:1,eye:'red'}});
    S.boss=b;MUS.boss=true;announce('The Hollow wakes','Banish it before dawn',true);SFX.roar();shake(14);});}

function hit(e,dmg,kx,ky,kb){if(e.dead)return;const crit=Math.random()<ST.crit;const d=dmg*ST.dmgMul*(crit?2:1);
  e.hp-=d;e.flash=0.09;const res=e.boss?0.04:e.T.heavy?0.3:1;e.kx+=kx*kb*res;e.ky+=ky*kb*res;
  text(e.x+rand(-8,8),e.y-e.r-4,Math.round(d),crit);SFX.hit();if(e.hp<=0)kill(e);}
function kill(e){if(e.dead)return;e.dead=true;S.kills++;S.combo++;S.comboT=1.2;SFX.kill(S.combo);
  const ec=GL[e.elite?'gold':e.T.eye||'red'];
  for(let i=0;i<(e.boss?40:6+e.r*0.4);i++){const a=Math.random()*TAU,v=rand(20,90+e.r*2);smoke(e.x+Math.cos(a)*e.r*0.4,e.y+Math.sin(a)*e.r*0.4,Math.cos(a)*v,Math.sin(a)*v,rand(0.4,0.9),e.r*rand(0.5,0.9));}
  burst(e.x,e.y,e.boss?60:5+Math.floor(e.r/4),ec,120+e.r*4,7,0.6);burst(e.x,e.y,3,GL.white,80,6,0.35);flash(e.x,e.y,60+e.r*2,0.28);
  if(e.boss){startDawn(e);return;}
  if(e.xp>0)dropShard(e.x,e.y,e.xp);
  if(Math.random()<(e.elite?1:0.012))S.shards.push({x:e.x,y:e.y,v:0,heal:true,vx:0,vy:0,pull:false,t:0});
  if(e.T.split)for(let i=0;i<2;i++){const m=spawnEnemy('mite',e.x+rand(-8,8),e.y+rand(-8,8));m.spawnT=0.4;const a=Math.random()*TAU;m.kx=Math.cos(a)*240;m.ky=Math.sin(a)*240;}
  if(e.T.heavy||e.elite){shake(7);S.hitstop=0.045;}}
function dropShard(x,y,v){if(S.shards.length>240){const s=S.shards[(Math.random()*S.shards.length)|0];if(!s.heal){s.v+=v;return;}}
  const a=Math.random()*TAU;S.shards.push({x,y,v,vx:Math.cos(a)*60,vy:Math.sin(a)*60,pull:false,t:0});}
function hurt(dmg){if(P.iframes>0||P.dashT>0||S.mode!=='play')return;P.hp-=dmg;P.iframes=0.8;shake(12);S.hurtFx=1;SFX.hurt();
  burst(P.x,P.y,14,GL.red,200,8,0.5);
  for(const e of near(P.x,P.y,100)){const ddx=e.x-P.x,ddy=e.y-P.y,d=Math.hypot(ddx,ddy)||1;if(!e.boss){e.kx+=ddx/d*420;e.ky+=ddy/d*420;}}
  if(P.hp<=0){P.hp=0;die();}}
function startDawn(b){S.mode='dawn';S.dawnT=0;S.boss=null;MUS.target=0.2;MUS.boss=false;SFX.boom();SFX.dawn();shake(24);S.hitstop=0.25;
  for(let i=0;i<5;i++)S.rings.push({x:b.x,y:b.y,r:0,max:400+i*260,l:1.2+i*0.25,ml:1.2+i*0.25,col:i%2?'white':'gold',w:3});}

function inputVec(){let x=0,y=0;
  if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)y-=1;if(keys.KeyS||keys.ArrowDown)y+=1;
  if(stick.on){const sx=stick.x-stick.ox,sy=stick.y-stick.oy,d=Math.hypot(sx,sy);if(d>6){const m=Math.min(1,d/56);x+=sx/d*m;y+=sy/d*m;}}
  if(pad.x||pad.y){x+=pad.x;y+=pad.y;}
  const d=Math.hypot(x,y);if(d>1){x/=d;y/=d;}return{x,y};}

function step(dt){S.t+=dt;const t=S.t;
  // ---- player
  const iv=inputVec();
  if(iv.x||iv.y){const d=Math.hypot(iv.x,iv.y);P.fx=iv.x/d;P.fy=iv.y/d;}
  P.dashCd-=dt;P.iframes-=dt;
  if(wantDash&&P.dashCd<=0){P.dashT=0.17;P.dashCd=1.15;SFX.dash();shake(3);
    for(let i=0;i<10;i++)part(P.x,P.y,rand(-60,60)-P.fx*120,rand(-60,60)-P.fy*120,0.5,9,GL.gold,4);}
  wantDash=false;
  let spd=ST.speed;
  if(P.dashT>0){P.dashT-=dt;P.vx=P.fx*spd*3.4;P.vy=P.fy*spd*3.4;part(P.x,P.y,0,0,0.35,16,GL.gold,1);}
  else{const k=1-Math.exp(-dt*14);P.vx=lerp(P.vx,iv.x*spd,k);P.vy=lerp(P.vy,iv.y*spd,k);}
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.hp=Math.min(ST.maxHp,P.hp+ST.regen*dt);
  P.trailT-=dt;const mv=Math.hypot(P.vx,P.vy);if(P.trailT<=0&&mv>20){P.trailT=0.035;part(P.x+rand(-4,4),P.y+rand(-4,4),-P.vx*0.15+rand(-10,10),-P.vy*0.15+rand(-10,10),rand(0.5,0.9),rand(3,6),GL.gold,1.5,-18);}
  const ratio=P.hp/ST.maxHp;
  if(ratio<0.3){S.beatT-=dt;if(S.beatT<=0){SFX.beat();S.beatT=0.5+ratio*2;}}
  // ---- camera
  const ck=1-Math.exp(-dt*6);cam.x=lerp(cam.x,P.x+P.vx*0.12,ck);cam.y=lerp(cam.y,P.y+P.vy*0.12,ck);
  MUS.target=S.boss?1:Math.min(1,0.15+t/210);
  buildHash();
  weapons(dt);
  spawner(dt);
  updateEnemies(dt);
  // ---- enemy bullets
  for(const b of S.ebul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    const ddx=b.x-P.x,ddy=b.y-P.y;if(ddx*ddx+ddy*ddy<(b.r+P.r-2)**2){b.l=0;hurt(b.dmg);burst(b.x,b.y,6,GL.violet,100,6,0.3);}}
  S.ebul=S.ebul.filter(b=>b.l>0);
  // ---- shards
  const mg=ST.magnet;
  for(const s of S.shards){s.t+=dt;const ddx=P.x-s.x,ddy=P.y-s.y,d=Math.hypot(ddx,ddy)||1;
    if(d<mg||s.pull){s.pull=true;const a=900+s.t*200;s.vx+=ddx/d*a*dt;s.vy+=ddy/d*a*dt;const sp=Math.hypot(s.vx,s.vy),mx=520+mg;if(sp>mx){s.vx*=mx/sp;s.vy*=mx/sp;}}
    else{s.vx*=Math.exp(-dt*4);s.vy*=Math.exp(-dt*4);if(d<650){s.x+=ddx/d*38*dt;s.y+=ddy/d*38*dt;}}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(d<P.r+10){s.dead=true;
      if(s.heal){P.hp=Math.min(ST.maxHp,P.hp+ST.maxHp*0.3);SFX.heal();S.rings.push({x:P.x,y:P.y,r:0,max:110,l:0.5,ml:0.5,col:'amber',w:2});text(P.x,P.y-24,'+light',true);}
      else{S.xp+=s.v;P.hp=Math.min(ST.maxHp,P.hp+0.25*s.v);S.pickN++;S.pickT=0.5;SFX.pick(S.pickN);part(P.x,P.y,rand(-30,30),rand(-30,30),0.3,10,s.v>=10?GL.violet:s.v>=3?GL.teal:GL.gold,3);}}}
  S.shards=S.shards.filter(s=>!s.dead);
  decayAwake(dt);S.pickT-=dt;if(S.pickT<=0)S.pickN=0;S.comboT-=dt;if(S.comboT<=0)S.combo=0;
  while(S.xp>=S.xpNext){S.xp-=S.xpNext;S.level++;S.xpNext=xpFor(S.level);S.pending++;}
  if(S.pending>0&&S.mode==='play')openLevel();}

function weapons(dt){const cdm=ST.cdMul;let l;
  if(L('lance')){S.cd.lance-=dt;if(S.cd.lance<=0){const tg=nearest(P.x,P.y,430);if(tg){const s=W_('lance');const a=Math.atan2(tg.y-P.y,tg.x-P.x);
    for(let i=0;i<s.n;i++){const aa=a+(i-(s.n-1)/2)*0.13;S.projs.push({k:'lance',x:P.x,y:P.y,vx:Math.cos(aa)*780,vy:Math.sin(aa)*780,dmg:s.dmg,pierce:s.pierce,l:0.85,r:7,hits:null});}
    S.cd.lance=s.cd*cdm;SFX.shoot();}}}
  S.motes.length=0;
  if((l=L('halo'))){const s=W_('halo');for(let i=0;i<s.n;i++){const a=S.t*s.spd+i*TAU/s.n;const mx=P.x+Math.cos(a)*s.rad,my=P.y+Math.sin(a)*s.rad;S.motes.push({x:mx,y:my,a,rad:s.rad,spd:s.spd});
    for(const e of near(mx,my,12+30)){const ddx=e.x-mx,ddy=e.y-my;if(ddx*ddx+ddy*ddy<(e.r+11)**2&&e.haloT<=0){e.haloT=0.42;const d=Math.hypot(e.x-P.x,e.y-P.y)||1;hit(e,s.dmg,(e.x-P.x)/d,(e.y-P.y)/d,140);burst(mx,my,2,GL.teal,90,6,0.3);}}}}
  if(L('nova')){S.cd.nova-=dt;if(S.cd.nova<=0){const s=W_('nova');S.cd.nova=s.cd*cdm;SFX.nova();shake(4);
    S.rings.push({x:P.x,y:P.y,r:0,max:s.rad,l:0.5,ml:0.5,col:'gold',w:4,dmgR:true});flash(P.x,P.y,s.rad*1.3,0.3);
    for(const e of near(P.x,P.y,s.rad+30)){const ddx=e.x-P.x,ddy=e.y-P.y,d=Math.hypot(ddx,ddy)||1;if(d<s.rad+e.r)hit(e,s.dmg,ddx/d,ddy/d,380);}}}
  if(L('seekers')){S.cd.seekers-=dt;if(S.cd.seekers<=0&&S.enemies.length){const s=W_('seekers');S.cd.seekers=s.cd*cdm;SFX.fly();
    for(let i=0;i<s.n;i++){const a=Math.random()*TAU;S.projs.push({k:'fly',x:P.x,y:P.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,dmg:s.dmg,pierce:0,l:3,r:6,tg:null,tr:[],ph:rand(0,TAU)});}}}
  if(L('arc')){S.cd.arc-=dt;const s=W_('arc');if(S.cd.arc<=0){if(fireArc(s)){S.cd.arc=s.cd*cdm;if(s.strikes>1)S.cd.arc2=0.16;}}
    if(S.cd.arc2>0){S.cd.arc2-=dt;if(S.cd.arc2<=0){S.cd.arc2=-1;fireArc(s);}}}
  // projectiles
  for(const p of S.projs){p.l-=dt;
    if(p.k==='fly'){if(!p.tg||p.tg.dead)p.tg=nearest(p.x,p.y,700);
      if(p.tg){const ddx=p.tg.x-p.x,ddy=p.tg.y-p.y,d=Math.hypot(ddx,ddy)||1;const acc=1500;p.vx+=ddx/d*acc*dt;p.vy+=ddy/d*acc*dt;}
      p.ph+=dt*9;const sp=Math.hypot(p.vx,p.vy),mx=430;if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp;}
      p.tr.push(p.x,p.y);if(p.tr.length>16)p.tr.splice(0,2);}
    p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.l<=0)continue;
    for(const e of near(p.x,p.y,p.r+40)){if(p.hits&&p.hits.has(e))continue;const ddx=e.x-p.x,ddy=e.y-p.y;
      if(ddx*ddx+ddy*ddy<(e.r+p.r)**2){const sp=Math.hypot(p.vx,p.vy)||1;hit(e,p.dmg,p.vx/sp,p.vy/sp,p.k==='lance'?110:60);
        burst(p.x,p.y,3,p.k==='lance'?GL.gold:GL.violet,140,6,0.25);
        if(p.pierce>0){p.pierce--;(p.hits||(p.hits=new Set())).add(e);}else{p.l=0;break;}}}}
  S.projs=S.projs.filter(p=>p.l>0);}
function fireArc(s){const pts=[{x:P.x,y:P.y}],seen=new Set();let cur=nearest(P.x,P.y,400),n=0;
  while(cur&&n<s.leaps){seen.add(cur);pts.push({x:cur.x,y:cur.y});hit(cur,s.dmg,0,0,0);flash(cur.x,cur.y,50,0.15);n++;
    let best=null,bd=210*210;for(const e of S.enemies){if(e.dead||seen.has(e))continue;const ddx=e.x-cur.x,ddy=e.y-cur.y,d=ddx*ddx+ddy*ddy;if(d<bd){bd=d;best=e;}}cur=best;}
  if(pts.length<2)return false;S.bolts.push({pts,l:0.22,ml:0.22});SFX.arc();return true;}

function updateEnemies(dt){const R=spawnRing();
  for(const e of S.enemies){if(e.dead)continue;e.spawnT+=dt;e.flash-=dt;e.haloT-=dt;
    let ddx=P.x-e.x,ddy=P.y-e.y;const d=Math.hypot(ddx,ddy)||1;let mx=ddx/d,my=ddy/d;e.ang=Math.atan2(my,mx);
    if(e.T.ranged){e.atk-=dt;if(d<230){mx=-mx;my=-my;}else if(d<330){const tx=-my,ty=mx;mx=tx*0.55;my=ty*0.55;}
      if(e.atk<=0&&d<560){e.atk=2.9;const sp=175;S.ebul.push({x:e.x,y:e.y,vx:ddx/d*sp,vy:ddy/d*sp,r:7,l:5,dmg:9,col:'violet'});SFX.spit();burst(e.x,e.y,4,GL.violet,60,6,0.3);}}
    if(e.boss)bossAI(e,dt,d,ddx,ddy);
    const sp=e.spd*(e.spawnT<0.5?0.35:1);
    e.x+=(mx*sp+e.kx)*dt;e.y+=(my*sp+e.ky)*dt;const kd=Math.exp(-dt*7);e.kx*=kd;e.ky*=kd;
    for(const o of near(e.x,e.y,e.r+30)){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,dd=ox*ox+oy*oy,rr=(e.r+o.r)*0.9;
      if(dd<rr*rr&&dd>0.0001){const dl=Math.sqrt(dd),push=(rr-dl)*(o.r/(e.r+o.r))*0.5;if(!e.boss){e.x+=ox/dl*push;e.y+=oy/dl*push;}}}
    if(d<e.r+P.r)hurt(e.dmg);
    if(d>R*1.7&&!e.boss){const a=Math.atan2(P.vy,P.vx)+rand(-0.8,0.8),hasV=Math.hypot(P.vx,P.vy)>20,aa=hasV?a:Math.random()*TAU;e.x=P.x+Math.cos(aa)*R;e.y=P.y+Math.sin(aa)*R;e.spawnT=0;}}
  let j=0;for(const e of S.enemies)if(!e.dead)S.enemies[j++]=e;S.enemies.length=j;}
function bossAI(b,dt,d,ddx,ddy){b.atk-=dt;const enr=b.hp<b.max*0.5;
  if(b.atk<=0){b.atk=enr?2.0:2.8;const pat=b.pat++%4,base=Math.atan2(ddy,ddx);shake(5);flash(b.x,b.y,200,0.3);
    if(pat===0){const n=enr?26:18,off=Math.random()*TAU;for(let i=0;i<n;i++){const a=off+i/n*TAU;S.ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,r:8,l:7,dmg:12,col:'red'});}SFX.spit();}
    else if(pat===1){const n=enr?7:5;for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*0.16;S.ebul.push({x:b.x,y:b.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:8,l:5,dmg:12,col:'red'});}SFX.spit();}
    else if(pat===2){for(let i=0;i<(enr?9:6);i++){const a=i/6*TAU;const m=spawnEnemy('lurker',b.x+Math.cos(a)*90,b.y+Math.sin(a)*90);m.kx=Math.cos(a)*200;m.ky=Math.sin(a)*200;}SFX.roar();}
    else{b.spiral=enr?2.4:1.7;}}

function updateFx(dt){
  for(const p of S.parts){p.l-=dt;const k=Math.exp(-dt*p.drag);p.vx*=k;p.vy*=k;p.x+=p.vx*dt;p.y+=(p.vy+p.up)*dt;}
  S.parts=S.parts.filter(p=>p.l>0);
  for(const p of S.smoke){p.l-=dt;const k=Math.exp(-dt*3);p.vx*=k;p.vy*=k;p.x+=p.vx*dt;p.y+=p.vy*dt-8*dt;}
  S.smoke=S.smoke.filter(p=>p.l>0);
  for(const t of S.texts){t.l-=dt;t.y-=34*dt;}S.texts=S.texts.filter(t=>t.l>0);
  for(const r of S.rings){r.l-=dt;r.r=r.max*(1-Math.pow(1-(1-r.l/r.ml),3));}S.rings=S.rings.filter(r=>r.l>0);
  for(const b of S.bolts)b.l-=dt;S.bolts=S.bolts.filter(b=>b.l>0);
  for(const f of S.flashes)f.l-=dt;S.flashes=S.flashes.filter(f=>f.l>0);
  S.shake*=Math.exp(-dt*9);S.hurtFx=Math.max(0,S.hurtFx-dt*1.6);}

function lightRadius(){const fl=1+0.018*Math.sin(S.rt*13.1)+0.012*Math.sin(S.rt*7.3);
  switch(S.mode){case'title':return 290+14*Math.sin(S.rt*1.2);
    case'dying':return Math.max(0,170*(1-S.deathT/1.7))*fl;
    case'dawn':return 390+Math.pow(S.dawnT,2.2)*900;
    default:return(150+250*clamp(P.hp/ST.maxHp,0,1))*fl;}}

/* ============================== FRAME ============================== */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  pollPad();S.rt+=dt;
  switch(S.mode){
    case'play':if(S.hitstop>0){S.hitstop-=dt;break;}step(dt);updateFx(dt);break;
    case'dying':{S.deathT+=dt;const sd=dt*0.35;buildHash();updateEnemies(sd);for(const b of S.ebul){b.x+=b.vx*sd;b.y+=b.vy*sd;}updateFx(sd);if(S.deathT>2.3)endRun(false);break;}
    case'dawn':{if(S.hitstop>0){S.hitstop-=dt;break;}S.dawnT+=dt;S.darkA=0.965*clamp(1-S.dawnT/2.6,0,1);
      const n=Math.min(S.enemies.length,Math.ceil(dt*90));for(let i=0;i<n;i++){const e=S.enemies[i];if(!e.dead){e.xp=0;e.T={...e.T,split:false};kill(e);}}
      S.enemies=S.enemies.filter(e=>!e.dead);S.ebul.length=0;
      const k=1-Math.exp(-dt*3);cam.x=lerp(cam.x,P.x,k);cam.y=lerp(cam.y,P.y,k);
      if(Math.random()<dt*30)part(P.x+rand(-600,600),P.y+rand(-400,400),0,0,rand(1,2),rand(4,9),GL.gold,0.5,-30);
      updateFx(dt);if(S.dawnT>4.2)endRun(true);break;}
    case'title':{updateFx(dt);P.x=0;P.y=Math.sin(S.rt*0.9)*8;const off=W>860?-W*0.17/Z:0;cam.x=lerp(cam.x,off,0.05);cam.y=0;
      if(Math.random()<dt*14)part(P.x+rand(-5,5),P.y+rand(-5,5),rand(-14,14),rand(-14,4),rand(0.8,1.6),rand(3,6),GL.gold,1,-20);
      for(const e of S.eyes){e.blink-=dt;if(e.blink<-0.16)e.blink=rand(2.5,7);e.a+=dt*0.05;}break;}
  }
  render();updHud();
  $('hurt').style.opacity=S.hurtFx.toFixed(3);}

/* ============================== RENDER ============================== */
const PX=new Float32Array(40),PY=new Float32Array(40);
function blob(c,x,y,r,seed,t,n,amp,sx,ang){const ca=Math.cos(ang),sa=Math.sin(ang);
  for(let i=0;i<n;i++){const a=i/n*TAU;const rr=r*(1+amp*Math.sin(t*3.1+seed+i*2.3)+amp*0.6*Math.sin(t*1.7+seed*2+i*1.3));
    const lx=Math.cos(a)*rr*sx,ly=Math.sin(a)*rr;PX[i]=x+lx*ca-ly*sa;PY[i]=y+lx*sa+ly*ca;}
  c.beginPath();c.moveTo((PX[n-1]+PX[0])/2,(PY[n-1]+PY[0])/2);
  for(let i=0;i<n;i++){const j=(i+1)%n;c.quadraticCurveTo(PX[i],PY[i],(PX[i]+PX[j])/2,(PY[i]+PY[j])/2);}c.closePath();}
const TIPS=[];
function drawGround(hw,hh,R){const cs=150,x0=Math.floor((cam.x-hw)/cs)-1,x1=Math.floor((cam.x+hw)/cs)+1,y0=Math.floor((cam.y-hh)/cs)-1,y1=Math.floor((cam.y+hh)/cs)+1;
  TIPS.length=0;const t=S.rt,aw=S.awake;
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const h=hash2(cx,cy);
    const bx=cx*cs+hash2(cx+11,cy-3)*cs,by=cy*cs+hash2(cx-7,cy+5)*cs;
    if(h<0.3){const k=3+Math.floor(hash2(cx-5,cy+9)*3),d=Math.hypot(bx-P.x,by-P.y),key=hkey(cx,cy);
      let a=aw.get(key)||0;if(d<R*0.7)a=1;if(a>0)aw.set(key,a);
      ctx.strokeStyle='rgba(60,120,112,.55)';ctx.lineWidth=1.3;ctx.beginPath();
      for(let j=0;j<k;j++){const ang=-Math.PI/2+(j-(k-1)/2)*0.42+Math.sin(t*0.9+h*40+j)*0.08,len=16+hash2(cx+j,cy-j)*24;
        const tx=bx+Math.cos(ang)*len,ty=by+Math.sin(ang)*len;ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+Math.cos(ang)*len*0.3,by-len*0.6,tx,ty);TIPS.push(tx,ty,a,h*40+j);}
      ctx.stroke();ctx.fillStyle='rgba(10,20,22,.8)';ctx.beginPath();ctx.ellipse(bx,by+1,7,2.5,0,0,TAU);ctx.fill();}
    else if(h<0.4){const s=8+hash2(cx+3,cy+3)*16,ang=Math.atan2(P.y-by,P.x-bx);
      ctx.fillStyle='rgba(70,64,64,.55)';ctx.beginPath();ctx.ellipse(bx+Math.cos(ang)*1.6,by+Math.sin(ang)*1.6,s,s*0.62,h*20,0,TAU);ctx.fill();
      ctx.fillStyle='#0c0c12';ctx.beginPath();ctx.ellipse(bx,by,s,s*0.62,h*20,0,TAU);ctx.fill();}
    else if(h>0.986){ctx.strokeStyle='rgba(255,208,138,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bx,by,46,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(bx,by,34,0,TAU);ctx.stroke();
      for(let i=0;i<12;i++){const a=i/12*TAU+h;ctx.beginPath();ctx.moveTo(bx+Math.cos(a)*36,by+Math.sin(a)*36);ctx.lineTo(bx+Math.cos(a)*44,by+Math.sin(a)*44);ctx.stroke();}}}
  if(aw.size>600){for(const [k,v] of aw)if(v<0.05)aw.delete(k);}}
function decayAwake(dt){for(const [k,v] of S.awake){const n=v-dt*0.12;if(n<=0)S.awake.delete(k);else S.awake.set(k,n);}}

function drawEnemyBodies(){const t=S.rt;
  for(const e of S.enemies){if(e.dead)continue;const T=e.T,fade=clamp(e.spawnT/0.5,0,1);if(fade<=0)continue;
    const rx=Math.cos(e.ang)*2.2,ry=Math.sin(e.ang)*2.2,ang=e.ang,sx=T.sx||1;
    ctx.globalAlpha=fade;
    ctx.fillStyle=e.elite?'rgba(255,208,138,.55)':'rgba(255,214,160,.30)';blob(ctx,e.x+rx,e.y+ry,e.r,e.seed,t,T.n,T.amp,sx,ang);ctx.fill();

      for(let i=0;i<9;i++){const a=i/9*TAU+Math.sin(t*0.7+i)*0.3,L1=e.r*0.8,L2=e.r*1.9+Math.sin(t*2+i*1.7)*14;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*L1,e.y+Math.sin(a)*L1);

function drawEyes(){const t=S.rt;
  for(const e of S.enemies){if(e.dead)continue;const fade=clamp(e.spawnT/0.25,0,1);const spr=GL[e.elite?'gold':e.T.eye||'red'];
    const ca=Math.cos(e.ang),sa=Math.sin(e.ang);
    if(e.boss){const pulse=0.6+0.4*Math.sin(t*3);gl(GL.red,e.x,e.y,e.r*2.2,0.25*pulse);
      for(let i=0;i<7;i++){const a=e.ang+(i-3)*0.32,rr=e.r*(0.35+0.12*(i%2));const ex=e.x+Math.cos(a)*rr,ey=e.y+Math.sin(a)*rr;const blink=Math.sin(t*1.3+i*2.1)>0.97?0.1:1;
        gl(GL.red,ex,ey,13,0.9*blink);gl(GL.white,ex,ey,3.5,0.9*blink);}continue;}
    const off=e.r*0.38,sep=e.r*0.3,ex=e.x+ca*off,ey=e.y+sa*off,size=e.r<12?6:e.r>24?11:8;

      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=0.9;ctx.fillStyle='#ff8a9a';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-6,-8);ctx.lineTo(-2,0);ctx.lineTo(-6,8);ctx.closePath();ctx.fill();ctx.restore();}}
  if(stick.on&&S.mode==='play'){ctx.globalAlpha=0.25;ctx.strokeStyle='#ffd08a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(stick.ox,stick.oy,56,0,TAU);ctx.stroke();
    const sx=stick.x-stick.ox,sy=stick.y-stick.oy,d=Math.hypot(sx,sy),m=Math.min(d,56)/(d||1);ctx.globalAlpha=0.5;ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.arc(stick.ox+sx*m,stick.oy+sy*m,14,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;}
const DUST=[];for(let i=0;i<70;i++)DUST.push({x:rand(0,4000),y:rand(0,4000),z:rand(0.15,0.6),vx:rand(-6,6),vy:rand(-10,-2),s:rand(1.5,4),a:rand(0.04,0.14),p:rand(0,TAU)});

/* ============================== HUD ============================== */
let hudCache={};
function setT(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function setX(id,v,origin){const s=v.toFixed(3);if(hudCache[id]!==s){hudCache[id]=s;$(id).style.transform=`scaleX(${s})`;}}
function updHud(){if(!S||S.mode==='title'||S.mode==='over')return;
  setT('hTime',fmt(S.t));setT('hLvl',String(S.level));setT('hKills',S.kills.toLocaleString());
  setX('xpFill',clamp(S.xp/S.xpNext,0,1));setX('lightFill',clamp(P.hp/ST.maxHp,0,1));
  const bh=!S.boss;if(hudCache.bossH!==bh){hudCache.bossH=bh;$('boss').hidden=bh;}
  if(S.boss)setX('bossFill',clamp(S.boss.hp/S.boss.max,0,1));
}

/* ============================== INPUT ============================== */
const pad={x:0,y:0,prev:[]};
function pollPad(){pad.x=pad.y=0;let gp=null;try{const g=navigator.getGamepads?navigator.getGamepads():[];for(const p of g)if(p){gp=p;break;}}catch(e){}
  if(!gp)return;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;const m=Math.hypot(ax,ay);if(m>0.22){pad.x=ax;pad.y=ay;}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),edge=i=>b(i)&&!pad.prev[i];
  if(gp.buttons[12]&&b(12))pad.y=-1;if(b(13))pad.y=1;if(b(14))pad.x=-1;if(b(15))pad.x=1;
  if(S.mode==='play'){if(edge(0)||edge(5)||edge(7))wantDash=true;if(edge(9))pause();}
  else if(S.mode==='pause'){if(edge(9)||edge(1))resume();if(edge(0))document.activeElement&&document.activeElement.click();}
  else if(S.mode==='title'){if(edge(0)||edge(9))start();}
  else if(S.mode==='over'){if(edge(0)||edge(9))start();}
  else if(S.mode==='level'){const lx=edge(14)||(ax<-0.6&&!pad.lx),rx=edge(15)||(ax>0.6&&!pad.rx);if(lx)setSel(S.sel-1);if(rx)setSel(S.sel+1);if(edge(0))pick(S.sel);}
  pad.lx=ax<-0.6;pad.rx=ax>0.6;pad.prev=gp.buttons.map(x=>x.pressed);}
const MOVE=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
window.addEventListener('keydown',e=>{const k=e.code;if(MOVE.includes(k)&&S.mode!=='pause')e.preventDefault();
  if(e.repeat&&!MOVE.includes(k))return;keys[k]=true;
  if(k==='KeyM'){toggleMute();return;}
  if(k==='KeyF'&&!e.repeat){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});}catch(_){}return;}
  switch(S.mode){
    case'title':if(k==='Enter'||k==='Space'){e.preventDefault();start();}break;
    case'play':if(k==='Escape'||k==='KeyP')pause();else if((k==='Space'||k==='ShiftLeft'||k==='ShiftRight')&&!e.repeat)wantDash=true;break;
    case'pause':if(k==='Escape'||k==='KeyP')resume();break;
    case'level':{if(e.repeat)return;const n={Digit1:0,Digit2:1,Digit3:2,Numpad1:0,Numpad2:1,Numpad3:2}[k];
      if(n!==undefined)pick(n);else if(k==='ArrowLeft'||k==='KeyA'||k==='ArrowUp'||k==='KeyW'){setSel(S.sel-1);SFX.ui();}else if(k==='ArrowRight'||k==='KeyD'||k==='ArrowDown'||k==='KeyS'){setSel(S.sel+1);SFX.ui();}
      else if(k==='Enter'||k==='Space'){e.preventDefault();pick(S.sel);}break;}
    case'over':if(k==='Enter'){e.preventDefault();start();}else if(k==='Escape')toTitle();break;}});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;stick.on=false;pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
cv.addEventListener('pointerdown',e=>{AU.init();if(S.mode!=='play')return;
  if(e.pointerType==='mouse')return;
  if(e.clientX<W*0.6&&!stick.on){stick.on=true;stick.id=e.pointerId;stick.ox=stick.x=e.clientX;stick.oy=stick.y=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}}
  else wantDash=true;});
cv.addEventListener('pointermove',e=>{if(stick.on&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;}});
const endStick=e=>{if(e.pointerId===stick.id){stick.on=false;stick.id=null;}};
cv.addEventListener('pointerup',endStick);cv.addEventListener('pointercancel',endStick);
$('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();wantDash=true;});
$('bStart').addEventListener('click',start);
$('bSound').addEventListener('click',()=>{AU.init();toggleMute();});
$('bSound2').addEventListener('click',toggleMute);
$('bResume').addEventListener('click',resume);
$('bRestart').addEventListener('click',start);
$('bQuit').addEventListener('click',toTitle);
$('bAgain').addEventListener('click',start);
$('bTitle').addEventListener('click',toTitle);
document.addEventListener('pointerdown',()=>AU.init(),{once:true});
for(const b of document.querySelectorAll('.btn'))b.addEventListener('pointerenter',()=>{SFX.ui();});

/* ============================== BOOT ============================== */
toTitle();requestAnimationFrame(t=>{last=t;frame(t);});
window.LUMEN_DEBUG={get S(){return S;},get P(){return P;},start,setTime(t){S.t=t;},grant(k,n){S.inv[k]=n;stats();buildInv();},kill(){for(const e of S.enemies)kill(e);}};
})();
</script>
