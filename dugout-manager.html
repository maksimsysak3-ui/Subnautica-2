<title>Dugout Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
@property --ang{syntax:'<angle>';inherits:true;initial-value:0deg}
/* Layout: stadium-night manager console. Nav rail on the left (bottom bar on phones), sticky command bar, card-led screens. */
:root{
  color-scheme:dark;
  --bg:#0c1423;--bg-2:#101a2c;--panel:#142035;--panel-2:#1a2942;--line:#243756;--line-2:#31486f;
  --text:#e8eefa;--muted:#91a2c3;--dim:#62759b;
  --accent:#ffb43a;--accent-2:#ffd27f;--accent-ink:#2b1900;--cyan:#52d6ff;
  --win:#3ad68a;--draw:#b9c3d6;--loss:#ff5a6d;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --chamfer:polygon(13% 0,100% 0,100% 91%,87% 100%,0 100%,0 9%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 520px at 88% -12%,rgba(82,214,255,.10),transparent 60%),radial-gradient(760px 420px at -5% 108%,rgba(255,180,58,.08),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;margin:0;text-wrap:balance}
h3{font-size:18px;text-transform:uppercase;letter-spacing:.06em}
small{color:var(--muted)}
.tab{font-variant-numeric:tabular-nums}

#app{position:relative;z-index:1;display:grid;grid-template-columns:88px minmax(0,1fr);min-height:100vh}
#app.onb{grid-template-columns:minmax(0,1fr)}
#app.onb .rail,#app.onb #top{display:none}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;padding-left:max(8px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:linear-gradient(180deg,#0f192b,#0a1120)}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px;font:800 12px/1 var(--f-display);letter-spacing:.22em;color:var(--accent)}
.brand svg{width:40px;height:40px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:10px 4px;border-radius:12px;color:var(--muted);font:700 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;position:relative}
.nav-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav-btn[aria-current="page"]{color:var(--accent);background:rgba(255,180,58,.10)}
.nav-btn .dot{position:absolute;top:7px;right:16px;width:8px;height:8px;border-radius:50%;background:var(--loss);box-shadow:0 0 0 2px var(--bg)}
main{min-width:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:0 56px}
#app.onb main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0 16px;background:linear-gradient(var(--bg) 78%,rgba(12,20,35,0))}
.top-club{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.top-club .crest{width:40px;height:48px;flex:none}
.top-club b{display:block;font:700 22px/1.05 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-club small{font-size:13px}
.top-stats{display:flex;gap:22px}
.top-stats div{display:flex;flex-direction:column}
.top-stats small{font:600 11px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.top-stats b{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.top-stats i{font-style:normal;color:var(--dim);font-size:15px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);font:700 15px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 20px -8px rgba(255,180,58,.7)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.big{padding:15px 22px;font-size:18px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.link{color:var(--cyan);font:600 13px var(--f-body)}
.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;background:rgba(255,90,109,.15);color:#ff9aa6;font:700 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase}

.panel{background:linear-gradient(180deg,var(--panel),#121c30);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font:700 12px/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line)}
.seg button{padding:7px 12px;border-radius:7px;color:var(--muted);font:700 14px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font:700 13px/1 var(--f-display);letter-spacing:.08em}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:rgba(255,180,58,.08)}
select,input[type=search]{background:var(--bg-2);color:var(--text);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;font:500 14px var(--f-body)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.toolbar .grow{flex:1}
.toolbar label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}

/* chips & tokens */
.mface{--club:#345;display:inline-block;width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--club) 55%,#ffffff 0%),color-mix(in srgb,var(--club) 70%,#000));box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.mface svg{width:100%;height:100%;display:block}
.flag{width:24px;height:16px;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.crest{display:inline-block;vertical-align:middle}
.pos-chip{display:inline-block;min-width:34px;text-align:center;padding:3px 6px;border-radius:6px;font:700 12px/1.1 var(--f-display);letter-spacing:.06em;background:var(--g,#2a3a5a);color:#fff}
.g-GK{--g:#a07a12}.g-DEF{--g:#2563c9}.g-MID{--g:#139a6b}.g-ATT{--g:#c2364c}
.ovr{display:inline-grid;place-items:center;min-width:34px;height:26px;padding:0 6px;border-radius:6px;font:800 16px/1 var(--f-display);font-variant-numeric:tabular-nums;color:#1a1206}
.ovr.bronze{background:linear-gradient(135deg,#e6ad7b,#a8693c)}
.ovr.silver{background:linear-gradient(135deg,#f3f6fb,#9aa4b4)}
.ovr.gold{background:linear-gradient(135deg,#ffe592,#d19a21)}
.ovr.elite{background:linear-gradient(135deg,#d9c0ff,#7b4dff);color:#fff}
.ovr.legend{background:linear-gradient(135deg,#ff6aa8,#ffd23f,#3dffb5,#2fb7ff);color:#14081e}
.ovr.rising{background:linear-gradient(135deg,#7cffc4,#00c8ff);color:#03202a}
.fchip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:800 12px/1 var(--f-display);color:#0b1220}
.fchip.W{background:var(--win)}.fchip.D{background:var(--draw)}.fchip.L{background:var(--loss)}

/* ======== PLAYER CARD ======== */
.cw{container-type:inline-size;width:100%}
.card{--club:#335;--club2:#fff;position:relative;width:100%;aspect-ratio:13/18.6;font-size:calc(100cqw / 13);color:var(--ct);transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.9,.25,1);filter:drop-shadow(0 .8em 1em rgba(0,0,0,.55));cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.card.is-tilting{transition:transform .07s linear}
.card-in{position:absolute;inset:0;clip-path:var(--chamfer);background:var(--metal);overflow:hidden}
.card-bg{position:absolute;inset:.28em;clip-path:var(--chamfer);background:var(--field);overflow:hidden;isolation:isolate}
.card-bg::before{content:"";position:absolute;inset:-20% -45%;background:linear-gradient(118deg,transparent 40%,color-mix(in srgb,var(--club) 85%,transparent) 40% 53%,transparent 53% 56.5%,color-mix(in srgb,var(--club2) 55%,transparent) 56.5% 59.5%,transparent 59.5%);opacity:.5;mix-blend-mode:screen}
.card-bg::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 .12em,transparent .12em .45em),radial-gradient(70% 45% at 62% 30%,rgba(255,255,255,.16),transparent 70%)}
.card-art{position:absolute;left:2.3em;right:-.3em;top:.6em;height:11.7em;transform:translate3d(var(--tx,0),var(--ty,0),0);-webkit-mask-image:linear-gradient(#000 78%,transparent 99%);mask-image:linear-gradient(#000 78%,transparent 99%)}
.card-art svg{width:100%;height:100%;display:block}
.card-ovr{position:absolute;left:.95em;top:1.25em;width:2.6em;display:flex;flex-direction:column;align-items:center;text-shadow:0 .08em .25em rgba(0,0,0,.45)}
.card-ovr b{font:800 3.1em/.86 var(--f-display);letter-spacing:-.02em}
.card-ovr span{font:700 1.1em/1 var(--f-display);letter-spacing:.08em;margin-top:.15em}
.card-ids{position:absolute;left:1.1em;top:5.75em;width:2.3em;display:flex;flex-direction:column;align-items:center;gap:.5em}
.card-ids .flag{width:2.1em;height:1.4em;border-radius:.14em}
.card-ids .crest{width:2em;height:2.4em;filter:drop-shadow(0 .08em .15em rgba(0,0,0,.5))}
.card-pot{position:absolute;right:1.1em;top:1.1em;padding:.22em .5em;border-radius:.3em;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px currentColor;font:800 .8em/1 var(--f-display);letter-spacing:.08em}
.card-name{position:absolute;left:.6em;right:.6em;top:12.05em;text-align:center}
.card-name span{display:block;font:800 1.55em/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .06em .2em rgba(0,0,0,.5)}
.card-name::after{content:"";display:block;width:62%;height:1px;margin:.4em auto 0;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.55}
.card-stats{position:absolute;left:1em;right:1em;top:14.15em;display:grid;grid-template-columns:repeat(3,1fr);gap:.3em .5em}
.card-stats div{display:flex;align-items:baseline;justify-content:center;gap:.28em}
.card-stats b{font:800 1.3em/1 var(--f-display);font-variant-numeric:tabular-nums}
.card-stats span{font:600 .8em/1 var(--f-display);letter-spacing:.06em;opacity:.78}
.card-tier{position:absolute;left:0;right:0;bottom:.75em;text-align:center;font:700 .62em/1 var(--f-display);letter-spacing:.32em;opacity:.6}
.card-foil{position:absolute;inset:0;pointer-events:none;opacity:var(--foil,0);mix-blend-mode:color-dodge;background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.4),transparent 48%),repeating-linear-gradient(110deg,#ff2a8a 0%,#ffd23f 5%,#3dffb5 10%,#2fb7ff 15%,#a54bff 20%,#ff2a8a 25%);background-size:100% 100%,300% 300%;background-position:center,var(--px,50%) var(--py,50%);transition:opacity .3s}
.card-foil::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 .04em,transparent .1em);background-size:.85em 1.05em;opacity:.45;mix-blend-mode:overlay}
.card.is-tilting .card-foil{opacity:calc(var(--foil,0) + .22)}
.card-glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.6),rgba(255,255,255,0) 44%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s}
.card.is-tilting .card-glare{opacity:1}
.card-in::after{content:"";position:absolute;inset:-60%;background:linear-gradient(105deg,transparent 46%,rgba(255,255,255,.4) 50%,transparent 54%);transform:translateX(-70%);mix-blend-mode:overlay;pointer-events:none;opacity:0}
.t-gold .card-in::after,.t-elite .card-in::after,.t-legend .card-in::after,.t-rising .card-in::after{opacity:1;animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,62%{transform:translateX(-70%)}100%{transform:translateX(70%)}}
.t-bronze{--metal:linear-gradient(135deg,#7a4a28,#e7b07e 28%,#6a3f20 52%,#c58b5b 78%,#5a3418);--field:linear-gradient(165deg,#5e3d24,#2a1a10 72%);--ct:#f8dfc6;--foil:0}
.t-silver{--metal:linear-gradient(135deg,#7f8896,#f4f7fb 28%,#626b78 52%,#d2d8e2 78%,#57606c);--field:linear-gradient(165deg,#4d586b,#1d232e 72%);--ct:#f1f5fb;--foil:.08}
.t-gold{--metal:linear-gradient(135deg,#9a6f12,#ffe48f 28%,#7c5a0c 52%,#f3cd60 78%,#6a4c08);--field:radial-gradient(120% 80% at 30% 0%,#7f5d14,#2a1d05 72%);--ct:#fff2c9;--foil:.14}
.t-elite{--metal:linear-gradient(135deg,#ffd27a,#7b4dff 25%,#1a0f3d 50%,#c9a6ff 75%,#ffcf6a);--field:radial-gradient(110% 80% at 30% 0%,#4f2699,#12082a 65%,#070312);--ct:#f6edff;--foil:.3}
.t-legend{--metal:conic-gradient(from var(--ang),#ff3d8b,#ffd23f,#3dffb5,#2fb7ff,#a54bff,#ff3d8b);--field:radial-gradient(120% 90% at 50% 0%,#20306a,#0a0f22 60%,#05070f);--ct:#fff;--foil:.5;animation:spin 6s linear infinite;filter:drop-shadow(0 .8em 1em rgba(0,0,0,.55)) drop-shadow(0 0 .7em rgba(255,90,180,.35))}
.t-rising{--metal:conic-gradient(from var(--ang),#00f0ff,#2d6bff,#7cffc4,#00f0ff);--field:radial-gradient(120% 90% at 50% 0%,#07485a,#03151d 60%,#010a0f);--ct:#dcfcff;--foil:.38;animation:spin 5s linear infinite;filter:drop-shadow(0 .8em 1em rgba(0,0,0,.55)) drop-shadow(0 0 .7em rgba(0,240,255,.3))}
.t-legend .card-foil,.t-rising .card-foil{animation:foil 8s linear infinite}
.card.is-tilting .card-foil{animation:none}
@keyframes spin{to{--ang:360deg}}
@keyframes foil{to{background-position:center,300% 60%}}

/* ======== START ======== */
.start{max-width:1240px;margin:0 auto;padding-block:28px 40px}
.start-hero{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.start-hero svg{width:64px;height:64px;flex:none}
.start-hero h1{font-size:clamp(40px,7vw,68px);line-height:.9;letter-spacing:.14em;font-weight:800}
.start-hero p{margin:6px 0 0;color:var(--muted);max-width:52ch}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.resume b{display:block;font:700 18px var(--f-display)}
.start-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.club-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:560px){.club-pick{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.pick{padding:14px 6px 12px}.pick .crest{width:56px;height:67px}.pick b{font-size:14px}}
.pick{--club:#345;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 14px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--club) 22%,var(--panel)),var(--panel));transition:transform .15s,border-color .15s;overflow:hidden}
.pick:hover{transform:translateY(-2px);border-color:var(--line-2)}
.pick.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 30px -14px color-mix(in srgb,var(--club) 70%,#000)}
.pick .crest{width:72px;height:86px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.pick b{font:700 17px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.rep{display:block;width:70%;height:4px;border-radius:9px;background:var(--line)}
.rep i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.pick-detail{position:sticky;top:20px}
.pd-head{display:flex;gap:16px;align-items:center}
.pd-head .crest{width:96px;height:115px;flex:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.pd-head h2{font-size:30px;line-height:1}
.pd-head p{margin:6px 0 0;color:var(--muted)}
.kits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.kits figure{margin:0;text-align:center}
.kits figcaption{font:700 12px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kit{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4))}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0 0 18px}
.facts div{min-width:0}
.facts dt{font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:2px 0 0;font:600 16px var(--f-body)}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}

/* ======== HOME ======== */
.home{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.home .next{grid-column:span 7}.home .mini-table{grid-column:span 5}.home .stars{grid-column:span 7}.home .inbox{grid-column:span 5}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:16px 0}
.team-block{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.team-block .crest{width:96px;height:115px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5))}
.team-block b{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.team-block small{font-size:13px}
.vs-mid{text-align:center}
.vs-mid span{display:block;font:800 34px/1 var(--f-display);color:var(--dim);letter-spacing:.08em}
.vs-mid small{display:block;margin-top:4px;font-size:12px;max-width:12ch}
.fchips{display:flex;gap:4px;justify-content:center}
.next-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.cmp{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;min-width:240px;flex:1;font-size:12px}
.cmp b{font:700 14px var(--f-display);font-variant-numeric:tabular-nums}
.cmp .bar{position:relative;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.cmp .bar i{position:absolute;inset:0 auto 0 0;background:var(--cyan)}
.cmp .bar i+i{inset:0 0 0 auto;background:var(--accent)}
.cmp span{grid-column:1/-1;text-align:center;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:-3px}
.stars-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.msg-list{display:flex;flex-direction:column}
.msg{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 6px;border-top:1px solid var(--line);border-radius:6px}
.msg:first-child{border-top:0}
.msg:hover{background:rgba(255,255,255,.03)}
.msg i{width:8px;height:8px;border-radius:50%;background:transparent}
.msg.unread i{background:var(--accent)}
.msg b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.unread b{color:#fff}
.msg small{font-size:12px}
.msg span{min-width:0}
.mini{width:100%;border-collapse:collapse;font-size:14px}
.mini td{padding:7px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.mini tr:first-child td{border-top:0}
.mini .me td{background:rgba(255,180,58,.08);color:#fff}
.mini .crest{width:20px;height:24px;margin-right:8px}
.mini td:last-child{text-align:right;font-weight:700}

/* ======== SQUAD ======== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{position:sticky;top:0;text-align:left;font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:10px 10px;background:var(--panel-2)}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:rgba(255,255,255,.03)}
.tbl .who{display:flex;align-items:center;gap:10px}
.tbl .who b{font-weight:600}
.tbl .num{text-align:right}
.tbl tr.me td{background:rgba(255,180,58,.08)}
.tbl .crest{width:22px;height:26px}

/* ======== TACTICS ======== */
.tactics{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
.tac-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.pitch{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:68/100;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(0deg,#1c6638 0 8.33%,#1f7240 8.33% 16.66%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.pitch>svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:86px;padding:4px 0;border-radius:10px;transition:background .15s}
.slot .mface{width:46px;height:46px;box-shadow:0 0 0 2px var(--fit,#fff),0 6px 12px rgba(0,0,0,.45)}
.slot.fit-good{--fit:var(--win)}.slot.fit-ok{--fit:var(--accent)}.slot.fit-bad{--fit:var(--loss)}
.slot.sel .mface{box-shadow:0 0 0 3px #fff,0 0 22px 4px rgba(255,255,255,.55)}
.slot-n{font:700 12px/1.05 var(--f-display);letter-spacing:.04em;text-transform:uppercase;max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.slot-r{position:absolute;top:0;right:12px;min-width:22px;padding:1px 3px;border-radius:5px;background:#0b1220;font:800 12px/1.2 var(--f-display);box-shadow:0 0 0 1px var(--fit)}
.slot-p{font:700 10px/1 var(--f-display);letter-spacing:.1em;color:rgba(255,255,255,.75)}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 0}
.tac-side{display:flex;flex-direction:column;gap:18px}
.rbar{display:grid;grid-template-columns:80px 1fr 34px;gap:10px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.rbar .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.rbar .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--accent))}
.rbar b{color:var(--text);font:700 16px var(--f-display);text-align:right}
.ctl{margin-top:14px}
.ctl>small{display:block;font:600 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.ctl .seg{display:flex}
.ctl .seg button{flex:1;padding:8px 6px;font-size:13px}
.bench-list{display:flex;flex-direction:column;gap:2px;max-height:430px;overflow:auto;margin-top:8px}
.brow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:9px;text-align:left}
.brow:hover{background:rgba(255,255,255,.04)}
.brow.sel{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px #fff}
.brow .mface{width:32px;height:32px}
.brow .bn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ======== TRANSFERS ======== */
.tr-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;margin-bottom:18px}
.scout{display:flex;gap:18px;align-items:center;background:radial-gradient(120% 140% at 100% 0%,rgba(0,240,255,.14),transparent 60%),linear-gradient(180deg,var(--panel),#121c30)}
.scout p{margin:6px 0 12px;color:var(--muted);font-size:14px}
.scout-art{flex:none;width:92px}
.budget b{display:block;font:800 40px/1 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}

/* ======== LEAGUE ======== */
.league{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.league-side{display:flex;flex-direction:column;gap:18px}
.fx{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.fx:first-of-type{border-top:0}
.fx .t{display:flex;align-items:center;gap:8px;min-width:0}
.fx .t:last-child{justify-content:flex-end;text-align:right}
.fx .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx .crest{width:22px;height:26px;flex:none}
.fx .sc{font:800 17px var(--f-display);min-width:54px;text-align:center;padding:2px 8px;border-radius:6px;background:var(--bg-2);font-variant-numeric:tabular-nums}
.fx.me{background:rgba(255,180,58,.07);border-radius:8px}
.md-nav{display:flex;align-items:center;gap:8px}
.md-nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2)}
.scorer{display:grid;grid-template-columns:22px auto 1fr auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.scorer:first-of-type{border-top:0}
.scorer .mface{width:30px;height:30px}
.scorer b{font:800 18px var(--f-display)}

/* ======== CLUB ======== */
.club-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:28px;overflow:hidden;position:relative}
.club-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 120% at 0% 50%,color-mix(in srgb,var(--club) 45%,transparent),transparent 70%);pointer-events:none}
.club-hero .crest{position:relative;width:170px;height:204px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.club-hero h1{position:relative;font-size:clamp(34px,5vw,56px);line-height:.95;text-transform:uppercase}
.club-hero p{position:relative;color:var(--muted);margin:8px 0 16px}
.swatches{position:relative;display:flex;gap:8px}
.swatches i{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.club-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.kit-flip{perspective:900px}
.kit-flip .inner{position:relative;transition:transform .7s cubic-bezier(.2,.9,.25,1);transform-style:preserve-3d}
.kit-flip.back .inner{transform:rotateY(180deg)}
.kit-flip .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.kit-flip .face.b{position:absolute;inset:0;transform:rotateY(180deg)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.wall div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:700 12px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.wall .crest{width:54px;height:65px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}

/* ======== MATCH ======== */
.match{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:14px}
.sb-team{display:flex;align-items:center;gap:12px;min-width:0}
.sb-team:last-child{flex-direction:row-reverse;text-align:right}
.sb-team .crest{width:48px;height:58px;flex:none}
.sb-team b{font:700 22px/1 var(--f-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-mid{text-align:center}
.sb-score{font:800 46px/1 var(--f-display);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.sb-clock{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line-2);font:700 14px var(--f-display);letter-spacing:.08em;color:var(--accent)}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#06101c;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted);font-size:14px}
.stage-hud{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;background:rgba(5,10,20,.72);backdrop-filter:blur(6px);font:800 16px/1 var(--f-display);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.stage-hud .crest{width:18px;height:22px}
.stage-hud em{font-style:normal;color:var(--accent);margin-left:6px;font-size:14px}
.stage-cam{position:absolute;right:10px;top:10px}
.stage-cam .seg{background:rgba(5,10,20,.72)}
.flash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.flash b{font:800 clamp(48px,12vw,120px)/1 var(--f-display);letter-spacing:.08em;color:#fff;text-shadow:0 0 30px var(--fc,#ffb43a),0 6px 0 rgba(0,0,0,.4);transform:scale(.6)}
.flash.on{animation:flash 2.2s ease-out}
.flash.on b{animation:flashb 2.2s cubic-bezier(.2,1.4,.3,1)}
@keyframes flash{0%{opacity:0;background:rgba(255,255,255,.35)}8%{opacity:1}75%{opacity:1;background:transparent}100%{opacity:0}}
@keyframes flashb{0%{transform:scale(.4)}25%{transform:scale(1.08)}100%{transform:scale(1)}}
.mctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.feed{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.feed li{display:grid;grid-template-columns:38px 1fr;gap:8px;padding:8px 4px;border-top:1px solid var(--line);font-size:14px;animation:feedIn .35s ease-out}
.feed li:first-child{border-top:0}
.feed li b{font:700 14px var(--f-display);color:var(--dim)}
.feed .ev-goal{background:linear-gradient(90deg,rgba(255,180,58,.18),transparent);border-radius:6px}
.feed .ev-goal span{color:#fff;font-weight:600}
.feed .ev-goal b{color:var(--accent)}
.feed .ev-card span::before{content:"";display:inline-block;width:9px;height:12px;border-radius:2px;background:#ffd400;margin-right:6px;vertical-align:-1px}
.feed .ev-whistle span{font-weight:600;color:var(--cyan)}
@keyframes feedIn{from{opacity:0;transform:translateY(-6px)}}
.stats{display:grid;gap:9px}
.srow{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center;font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.srow span:last-child{text-align:right}
.srow div{text-align:center;font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.srow .bar{grid-column:1/-1;display:flex;height:5px;border-radius:9px;overflow:hidden;background:var(--line);margin-top:-3px}
.srow .bar i{background:var(--cyan)}.srow .bar i+i{background:var(--accent)}
.sheets{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sheet li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.sheet ul{list-style:none;margin:10px 0 0;padding:0}
.sheet .mface{width:30px;height:30px}
.post{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.rating{display:inline-grid;place-items:center;min-width:38px;padding:3px 6px;border-radius:6px;font:800 14px var(--f-display);color:#0b1220}
.goals-list{display:flex;justify-content:space-between;gap:20px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.goals-list div:last-child{text-align:right}

/* ======== MODAL / REVEAL / TOAST ======== */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(3,7,15,.72);backdrop-filter:blur(6px);overflow:auto}
.modal-box{position:relative;width:min(920px,100%);max-height:calc(100vh - 40px);overflow:auto;background:linear-gradient(180deg,#17243c,#111b2e);border:1px solid var(--line-2);border-radius:18px;padding:24px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7)}
.modal-box.sm{width:min(520px,100%)}
.modal .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:10px;font-size:22px;color:var(--muted);z-index:2}
.modal .x:hover{background:rgba(255,255,255,.06);color:#fff}
.pm{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px}
.pm-head h2{font-size:30px;line-height:1;font-weight:600}
.pm-head h2 b{font-weight:800;text-transform:uppercase}
.pm-head p{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;color:var(--muted);font-size:14px}
.pm-head .crest{width:20px;height:24px}
.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;margin:18px 0}
.attr{display:grid;grid-template-columns:1fr 30px;gap:2px 8px;align-items:center;font-size:13px;color:var(--muted)}
.attr b{text-align:right;font:700 16px var(--f-display);color:var(--text)}
.attr .bar{grid-column:1/-1;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.attr .bar i{display:block;height:100%;border-radius:9px}
.pm-low{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:18px;align-items:center}
.pm-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.bid{width:100%;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--bg-2);border:1px solid var(--line)}
.bid label{display:flex;justify-content:space-between;font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.bid output{color:var(--accent);font-size:20px}
.bid input{width:100%;accent-color:var(--accent)}
.bid-msg{margin:0;font-size:14px;min-height:1.4em}
.bid-msg.ok{color:var(--win)}.bid-msg.bad{color:#ff8b99}
.row{display:flex;gap:10px;flex-wrap:wrap}
.msg-full h2{font-size:26px;margin:4px 0 4px}
.msg-full .from{color:var(--muted);font-size:13px}
.msg-full .body{margin-top:14px;line-height:1.6}
.msg-full .body p{margin:0 0 10px}

.reveal{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;background:#02040a}
.rv-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rv) 32%,#000) 0%,#02040a 62%);opacity:0;transition:opacity .6s}
.s1 .rv-bg{opacity:1}
.rv-beams i{position:absolute;left:50%;bottom:-8%;width:16vmin;height:150vmax;transform-origin:50% 100%;background:linear-gradient(to top,color-mix(in srgb,var(--rv) 75%,transparent),transparent 65%);filter:blur(8px);opacity:0;transform:translateX(-50%) rotate(calc((var(--i) - 4) * 12deg)) scaleY(0);transition:transform 1.1s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 45ms),opacity .6s}
.s1 .rv-beams i{opacity:.5;transform:translateX(-50%) rotate(calc((var(--i) - 4) * 12deg)) scaleY(1);animation:sway 3.5s ease-in-out infinite alternate calc(var(--i) * -.4s)}
@keyframes sway{to{transform:translateX(-50%) rotate(calc((var(--i) - 4) * 12deg + 4deg)) scaleY(1)}}
.rv-stage{position:relative;width:min(300px,68vw,calc((100vh - 230px) * .7));aspect-ratio:13/18.6;flex:none}
.rv-step{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;transform:scale(.6);transition:opacity .35s,transform .55s cubic-bezier(.2,1.4,.3,1)}
.rv-flag .flag{width:150px;height:100px;border-radius:6px;box-shadow:0 14px 50px rgba(0,0,0,.7)}
.rv-flag span,.rv-pos{font:800 34px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 30px var(--rv)}
.rv-pos{font-size:clamp(40px,11vw,72px);text-align:center}
.rv-club .crest{width:150px;height:180px;filter:drop-shadow(0 0 34px var(--rv))}
.s2 .rv-flag{opacity:1;transform:none}.s3 .rv-flag{opacity:0;transform:scale(1.5)}
.s3 .rv-pos{opacity:1;transform:none}.s4 .rv-pos{opacity:0;transform:translateY(-40px)}
.s4 .rv-club{opacity:1;transform:none}.s5 .rv-club{opacity:0;transform:scale(.3)}
.rv-card{position:absolute;inset:0;opacity:0;perspective:1200px;transition:opacity .2s}
.s5 .rv-card{opacity:1}
.rv-flip{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(540deg) scale(.4);transition:transform 1.2s cubic-bezier(.2,1.1,.3,1)}
.s5 .rv-flip{transform:rotateY(0) scale(1)}
.rv-front,.rv-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.rv-back{transform:rotateY(180deg);clip-path:var(--chamfer);background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rv) 40%,#0b1220),#05080f 70%);display:grid;place-items:center}
.rv-back svg{width:45%}
.rv-burst i{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--rv);box-shadow:0 0 10px var(--rv);opacity:0}
.s5 .rv-burst i{animation:burst 1.4s cubic-bezier(.1,.8,.3,1) .35s forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4)}}
.rv-actions{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;opacity:0;transform:translateY(20px);transition:opacity .4s,transform .4s;pointer-events:none}
.s6 .rv-actions{opacity:1;transform:none;pointer-events:auto}
.rv-title{margin:0;font:800 24px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--rv);text-shadow:0 0 20px var(--rv);text-align:center}
.rv-skip{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px 14px;border-radius:9px;background:rgba(255,255,255,.08);font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.s6 .rv-skip{display:none}
#toast{position:fixed;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 16px));transform:translate(-50%,30px);z-index:120;padding:12px 18px;border-radius:12px;background:#0b1220;border:1px solid var(--line-2);box-shadow:0 20px 40px rgba(0,0,0,.5);font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){
  .home .next,.home .mini-table,.home .stars,.home .inbox{grid-column:1/-1}
  .tactics,.league,.match,.post,.club-grid,.tr-top{grid-template-columns:minmax(0,1fr)}
  .start-grid{grid-template-columns:minmax(0,1fr)}
  .pick-detail{position:static}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:50;flex-direction:row;justify-content:space-around;gap:0;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);background:rgba(10,17,32,.96);backdrop-filter:blur(10px)}
  .brand{display:none}
  .nav-btn{width:auto;flex:1;padding:7px 2px;font-size:10px;letter-spacing:.06em}
  .nav-btn .dot{right:calc(50% - 16px)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:100px}
  #top{gap:10px;padding:10px 0 12px}
  .top-club .crest{width:32px;height:38px}
  .top-club b{font-size:18px}
  .top-club small{display:none}
  .top-stats{gap:14px;order:3;width:100%;justify-content:space-between}
  .top-stats b{font-size:18px}
  .btn.go{padding:9px 12px;font-size:13px}
  .stars-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}

function bestXI(club,form){

 const order=slots.map((_,i)=>i).sort((a,b)=>PRI[slots[a][0]]-PRI[slots[b][0]]);

}

  const add=(acc,w)=>{if(w){acc[0]+=e*w;acc[1]+=w}};add(a,ATT_W[pos]);add(m,MID_W[pos]);add(d,DEF_W[pos])});

function sendBid(id){
 const p=S.players[id],fee=+$('#bid-fee').value,msg=$('#bid-msg'),key=id+':'+S.season+':'+S.md;
 const say=(t,ok)=>{msg.textContent=t;msg.className='bid-msg '+(ok?'ok':'bad')};
 if(fee>S.budget)return say(`That's more than your budget of ${money(S.budget)}.`);
 if(S.squads[S.user].length>=32)return say('Your squad is full (32 players). Sell someone first.');
 if((ui.bidCount[key]||0)>=2)return say(`${CLUBS[p.club].short} have ended talks until the next matchday.`);
 ui.bidCount[key]=(ui.bidCount[key]||0)+1;
 const key3=squadOf(p.club).sort((a,b)=>b.ovr-a.ovr).slice(0,3).some(x=>x.id===id);
 let pa=1/(1+Math.exp(-(fee/p.value-1.06)*9));if(key3)pa*=.72;
 if(G.f()<pa){
  const from=p.club;moveP(id,S.user,fee);
  mail('Director of Football',`${p.last} signs from ${CLUBS[from].short}`,`<p>${esc(p.first+' '+p.last)} has joined for <b>${money(fee)}</b> and will wear number ${p.num}.</p>`);
  save();closeModal();render();toast(`${p.first} ${p.last} signed for ${money(fee)}`);
 }else{
  const want=Math.round(p.value*(key3?1.35:1.12)/1e5)*1e5;
  say(fee/p.value<.85?`Rejected. ${CLUBS[p.club].short} called it derisory. They want around ${money(want)}.`:`Rejected. ${CLUBS[p.club].short} want closer to ${money(want)}.`);
 }
}
function moveP(id,to,fee){

 S.squads[from]=S.squads[from].filter(x=>x!==id);p.club=to;p.num=assignNum(to,p.pos);S.squads[to].push(id);
 if(from===S.user){S.budget+=fee;S.tac.xi=S.tac.xi.map(x=>x===id?null:x);ensureXI()}
 if(to===S.user)S.budget-=fee;
}

 <div class="pitch">${PITCH_SVG}${slots.map(([pos,x,y],i)=>{const p=S.players[T.xi[i]],ft=p?fit(p,pos):0;return`<button class="slot ${ui.tSel===i?'sel':''} fit-${ft>=1?'good':ft>=.9?'ok':'bad'}" style="left:${x}%;top:${y}%" data-act="slot" data-i="${i}" aria-label="${pos}: ${p?esc(p.last):'empty'}">${p?miniFace(p):'<span class="mface"></span>'}<span class="slot-r">${p?Math.round(p.ovr*ft):'–'}</span><span class="slot-n">${p?esc(p.last):'Empty'}</span><span class="slot-p">${pos}</span></button>`}).join('')}</div>

/* ================= match engine ================= */
const LINES={
 goal:['{p} drills it low into the corner!','{p} curls a beauty into the top corner!','{p} rises highest and powers a header home!','{p} keeps a cool head and slots it past {k}!','{p} smashes it in off the underside of the bar!','{p} taps in at the far post!','{p} lashes it in from the edge of the box!'],
 assist:[' Lovely ball from {a}.',' {a} with the assist.',' Great work from {a} to set it up.'],
 save:['{k} gets down well to deny {p}.','Big save from {k}! {p} thought that was in.','{p} tests {k}, who holds on.',"{k} tips {p}'s effort over the bar.",'{k} stands tall and blocks {p}.'],
 miss:['{p} drags it wide.','{p} blazes over from the edge of the box.','{p} snatches at it and the chance is gone.','{p} hits the post!','{p} fires straight at a defender.','{p} heads over from a corner.'],
 corner:['Corner to {t}.','{t} win a corner on the {s}.'],
 foul:['Free kick. {p} catches an opponent late.','{p} is penalised for a push.','{p} goes through the back of an opponent.'],
 card:['Yellow card for {p}.','{p} goes into the book after a cynical foul.'],
};
let THREE=null,threeP=null,SC=null,matchTimer=0,ftTimer=0;
const sceneLive=()=>!!(SC&&SC.ready&&!document.hidden);
function createMatch(){ensureXI();const[h,a]=userFixture();return{h,a,H:sideFor(h),A:sideFor(a),min:0,added:G.i(1,5),hg:0,ag:0,feed:[],shown:0,st:{sh:[0,0],sot:[0,0],xg:[0,0],cor:[0,0],fl:[0,0],yc:[0,0],ps:[0,0]},goals:[],perf:{},phase:'pre',speed:1,paused:false,pH:.5,seq:null,ko:0,koSide:0,rat:null,ht:false}}
const pname=id=>S.players[id].last;
function clockText(){if(!M)return'';if(M.phase==='pre')return'Kick-off';if(M.phase==='done')return'Full-time';if(M.min===45&&M.ht)return'Half-time';return M.min>90?`90+${M.min-90}'`:`${M.min}'`}
function ev(type,side,text){M.feed.push({m:M.phase==='live'?clockText():'',type,side,text})}
function perf(id){return M.perf[id]||(M.perf[id]={g:0,a:0,sv:0,yc:0})}
function startTicker(){clearInterval(matchTimer);matchTimer=setInterval(tick,430/(M.speed||1))}
function tick(){
 if(!M||M.phase!=='live'||M.paused)return;
 if(M.seq){if(M.fast||!sceneLive()||performance.now()-M.seq.t0>8000/M.speed)resolveSeq();else return}
 M.min++;
 const rH=ratings(M.H.xi,M.H.form),rA=ratings(M.A.xi,M.A.form),xH=expG(rH,rA,true,M.H.tac,M.A.tac),xA=expG(rA,rH,false,M.A.tac,M.H.tac);
 const pH=M.pH=clamp(Math.pow(rH.mid,4)/(Math.pow(rH.mid,4)+Math.pow(rA.mid,4))+(M.H.tac.ment-M.A.tac.ment)*.025,.28,.72);
 M.st.ps[0]+=pH;M.st.ps[1]+=1-pH;
 if(G.f()<xH/.105/90)shot(0);else if(G.f()<xA/.105/90)shot(1);
 if(G.f()<.05){const s=G.f()<pH?0:1;M.st.cor[s]++;ev('corner',s,fill(G.pick(LINES.corner),{t:CLUBS[s?M.a:M.h].short,s:G.pick(['left','right'])}))}
 if(G.f()<.09){const s=G.f()<pH?1:0,id=(s?M.A:M.H).xi[G.i(1,10)];if(id!=null){M.st.fl[s]++;if(G.f()<.22){M.st.yc[s]++;perf(id).yc++;ev('card',s,fill(G.pick(LINES.card),{p:pname(id)}))}else if(G.f()<.4)ev('foul',s,fill(G.pick(LINES.foul),{p:pname(id)}))}}
 if(M.min===45&&!M.ht){M.ht=true;ev('whistle',-1,`Half-time: ${CLUBS[M.h].short} ${M.hg} – ${M.ag} ${CLUBS[M.a].short}.`);M.ko++;M.koSide=1}
 if(M.min>=90+M.added){ev('whistle',-1,`Full-time: ${CLUBS[M.h].short} ${M.hg} – ${M.ag} ${CLUBS[M.a].short}.`);fullTime();return}
 if(!M.fast)updateLive();
}
function shot(s){
 const T=s?M.A:M.H,O=s?M.H:M.A,sh=scorerFrom(T),kp=O.xi[0],p=S.players[sh];
 const q=Math.min(.72,-Math.log(1-G.f())*.105*(.85+(p.st[1]-60)/200)),r=G.f();
 const outcome=r<q?'goal':r<q+(1-q)*.33?'save':'miss',ast=outcome==='goal'?assistFrom(T,sh):null;
 M.seq={s,shooter:sh,outcome,t0:performance.now(),apply(){
  M.st.sh[s]++;M.st.xg[s]+=q;const o={p:pname(sh),k:kp!=null?pname(kp):'the keeper'};
  if(outcome==='goal'){M.st.sot[s]++;s?M.ag++:M.hg++;perf(sh).g++;if(ast!=null){perf(ast).a++;o.a=pname(ast)}
   M.goals.push({s,pid:sh,ast,min:M.min});ev('goal',s,`GOAL! ${CLUBS[M.h].short} ${M.hg} – ${M.ag} ${CLUBS[M.a].short}. `+fill(G.pick(LINES.goal),o)+(ast!=null?fill(G.pick(LINES.assist),o):''));M.ko++;M.koSide=s?0:1;if(!M.fast)flashGoal(s)}
  else if(outcome==='save'){M.st.sot[s]++;if(kp!=null)perf(kp).sv++;ev('save',s,fill(G.pick(LINES.save),o))}
  else ev('miss',s,fill(G.pick(LINES.miss),o));
 }};
 if(M.fast||!sceneLive())resolveSeq();
}
function resolveSeq(){const q=M&&M.seq;if(!q)return;M.seq=null;q.apply();if(!M.fast)updateLive()}
function rateAll(){M.rat={};[[M.H,0],[M.A,1]].forEach(([T,s])=>{const gf=s?M.ag:M.hg,ga=s?M.hg:M.ag;T.xi.forEach((id,i)=>{if(id==null)return;const pos=FORMS[T.form][i][0],pf=M.perf[id]||{};let r=6.3+(gf>ga?.45:gf<ga?-.35:0)+G.n(0,.35)+(pf.g||0)*1.05+(pf.a||0)*.6+(pf.sv||0)*.18-(pf.yc||0)*.3;if(['GK','CB','LB','RB'].includes(pos))r+=ga===0?.6:-ga*.15;M.rat[id]=+clamp(r,4.5,10).toFixed(1)})})}
function fullTime(){
 M.phase='done';M.seq=null;clearInterval(matchTimer);rateAll();
 if(M.fast||!sceneLive()){render();return}
 updateLive();clearTimeout(ftTimer);ftTimer=setTimeout(()=>{if(view==='match'&&M&&M.phase==='done')render()},1800);
}
function skipToEnd(){if(!M||M.phase!=='live')return;M.fast=true;M.paused=false;if(M.seq)resolveSeq();let guard=0;while(M&&M.phase==='live'&&guard++<200)tick()}
function finishMatchday(){
 if(!M||M.phase!=='done')return;
 const res={md:S.md,h:M.h,a:M.a,hg:M.hg,ag:M.ag,goals:M.goals.map(g=>({s:g.s,p:g.pid,a:g.ast,m:g.min}))};S.results.push(res);
 [M.H,M.A].forEach(T=>T.xi.forEach(id=>{if(id==null)return;const p=S.players[id];p.apps++;if(p.club===S.user){p.rs+=M.rat[id]||6.5;p.form=[...(p.form||[]),M.rat[id]].slice(-5)}}));

function kickoffReset(sc,side){

function seqUpdate(sc,dt){

function step3D(sc,dt,rdt){
