 body.ingame{display:block}
 #bar{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:6px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid #1c1c1f}
 .sb-top{padding:0}.sb-top .logo span,.sb-club small,.sb-next,.sb-subs{display:none}
 .sb-club{grid-template-columns:28px;padding:4px;margin:0;border:0;background:none}.sb-club .crest{width:24px;height:29px}.sb-club span{display:none}
 .sb-nav{flex-direction:row}.sb-item{padding:8px 10px;white-space:nowrap}.sb-item[aria-current="page"]::before{left:8px;right:8px;top:auto;bottom:-8px;width:auto;height:2px}
 body.ingame main{padding:0 14px 50px}
 .pghead{margin:0 -14px 14px;padding:12px 14px 0;top:54px}.pg-date{display:none}
}

/* player profile v2 */
.pp2-hero{position:relative;display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:6px 22px;align-items:center;padding:20px 22px 0;margin-bottom:14px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:radial-gradient(70% 160% at 0% 30%,color-mix(in srgb,var(--cc) 34%,transparent),transparent 70%),linear-gradient(180deg,#17171a,#121214)}
.pp2-kit .kit{width:124px;height:auto;filter:drop-shadow(0 12px 20px rgba(0,0,0,.6))}
.pp2-club{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.pp2-club .crest{width:20px;height:24px}
.pp2-main h1{font:400 clamp(30px,3.6vw,48px)/1 var(--fd);letter-spacing:.01em;margin:6px 0 10px}.pp2-main h1 b{font-weight:800;text-transform:uppercase}
.pp2-meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:#c9c7c0;align-items:center}.pp2-meta span{display:flex;align-items:center;gap:6px}.pp2-meta small{color:var(--dim)}
.pp2-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip.warn{color:#ffd27f;border-color:rgba(255,207,74,.4)}
.pp2-rate{display:flex;flex-direction:column;gap:10px;align-items:flex-end;text-align:right}.pp2-rate small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}.pp2-rate b{font:800 24px var(--fd)}
.pp2-tabs{grid-column:1/-1;display:flex;gap:2px;margin-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.pp2-tabs button{padding:11px 16px;font:500 13.5px var(--fb);color:var(--muted);border-bottom:2px solid transparent}.pp2-tabs button:hover{color:#fff}.pp2-tabs button[aria-selected="true"]{color:#fff;font-weight:600;border-bottom-color:var(--cc)}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sw div{display:flex;flex-direction:column;gap:6px}.sw small{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.sw span{display:flex;justify-content:space-between;font-size:13px}.sw b{font:700 15px var(--fd)}
.pp2-per b{font:700 20px var(--fd);text-transform:uppercase}.pp2-per p{margin:4px 0 0;color:var(--muted)}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tf{padding:9px 10px;border:1px solid var(--line2);border-radius:4px;text-align:left;font-size:13px;color:#cfcdc6}.tf:hover{border-color:#4a4a50}.tf.on{border-color:var(--accent);background:rgba(255,180,58,.08);color:#fff}
.neg-f{margin:0 0 14px}.neg-f label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}.neg-f label b{color:#fff;font:700 16px var(--fd)}.neg-f input[type=range]{width:100%}
.ren-msg{padding:10px 12px;border-left:3px solid var(--accent);background:rgba(255,180,58,.07);font-size:13.5px}
@media (max-width:900px){.pp2-hero{grid-template-columns:84px minmax(0,1fr);padding:14px 14px 0}.pp2-kit .kit{width:80px}.pp2-rate{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;text-align:left}}

/* scouting, academy, development */
.grade{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:4px;font:800 13px var(--fd)}.gA{background:#38d184;color:#032}.gB{background:#9fd36b;color:#132}.gC{background:#e6c35a;color:#320}.gD{background:#7a7a80;color:#111}
.unc{opacity:.75;font-size:13px!important;letter-spacing:-.02em}.unc-stars{font:700 14px var(--fd);color:#e8c25a}.unc-stars i{font-style:normal;margin-left:2px}
.btnchip{cursor:pointer;border-style:dashed}.btnchip:hover{border-color:var(--accent);color:#fff}
.acad-top{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acad-lvl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2)}.acad-lvl b{display:block;font-size:14px}.acad-lvl small{color:var(--muted);font-size:12px}
.acad-bars{display:flex;gap:3px}.acad-bars i{width:14px;height:18px;border-radius:2px;background:#26262a}.acad-bars i.on{background:var(--accent)}
.acad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:12px}
.acad-card{padding:12px;border:1px solid var(--line2);border-radius:4px;background:linear-gradient(180deg,#19191c,#141416);display:flex;flex-direction:column;gap:8px}
.acad-h{display:flex;align-items:center;gap:8px}.acad-h b{flex:1;font-size:14px}.acad-h small{display:flex;align-items:center;gap:5px;color:var(--muted)}
.acad-r{display:flex;justify-content:space-between}.acad-r small{display:block;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:900px){.acad-top{grid-template-columns:1fr}.acad-lvl{grid-template-columns:1fr}}

/* competition-themed scoreboards */
.ov-sbug .sb-logo{display:grid;place-items:center;padding:0 6px;background:var(--s1)}.ov-sbug .sb-logo svg{width:22px;height:22px}
.sbv-crown{border-top:2px solid var(--s2)}.sbv-crown b{background:var(--s2);color:var(--s1)}.sbv-crown i{background:var(--s1);color:var(--s2)}
.sbv-slant{transform:skewX(-12deg);transform-origin:left}.sbv-slant>*{transform:skewX(12deg)}.sbv-slant .sb-t{background:var(--s1)}.sbv-slant b{background:#fff;color:var(--s1)}.sbv-slant i{background:var(--s2);color:#111}
.sbv-block{height:34px!important;line-height:34px!important;font-size:16px!important}.sbv-block .sb-t{background:#0c0c0e;border-left-width:6px!important;min-width:56px;text-align:center}.sbv-block b{background:var(--s1);color:#fff;font-size:18px}.sbv-block i{background:#fff;color:#111}
.sbv-pill{border-radius:20px;overflow:hidden;background:linear-gradient(90deg,var(--s1),color-mix(in srgb,var(--s1) 60%,#000))}.sbv-pill .sb-t{background:transparent}.sbv-pill b{background:rgba(255,255,255,.92);color:var(--s1);border-radius:14px;margin:3px 0;line-height:24px}.sbv-pill i{background:transparent;color:var(--s2)}
.sbv-line{box-shadow:none!important;background:rgba(10,10,12,.7);border-bottom:2px solid var(--s2)}.sbv-line .sb-t,.sbv-line b,.sbv-line i,.sbv-line .sb-logo{background:transparent!important;color:#fff}.sbv-line b{font-weight:600}.sbv-line i{color:var(--s2)}
.sbv-tab{flex-direction:row}.sbv-tab .sb-t{background:#141414}.sbv-tab b{background:var(--s1);color:#fff}.sbv-tab i{background:var(--s1);color:var(--s2);margin-left:0;border-radius:0 0 8px 0;align-self:flex-start;height:24px;line-height:24px;transform:translateY(30px);position:absolute;left:0}
.sbv-cup{border:1px solid var(--s2)}.sbv-cup .sb-t{background:color-mix(in srgb,var(--s1) 70%,#000)}.sbv-cup b{background:linear-gradient(180deg,#f6dd8a,#c9a227);color:#2a1d00}.sbv-cup i{background:#0e0e10;color:#e8c25a}
.sbv-star{border:1px solid rgba(223,229,240,.5);box-shadow:0 0 24px -6px rgba(125,143,191,.6)!important}.sbv-star .sb-t{background:var(--s1)}.sbv-star b{background:linear-gradient(180deg,#f2f5fb,#b9c3d8);color:var(--s1)}.sbv-star i{background:#0b1430;color:#dfe5f0}

/* press conferences */
.press-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}.press-h small{color:var(--dim)}
.press-mic{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(255,180,58,.12);color:var(--accent)}.press-mic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.press-q{margin:0 0 16px;padding:14px 16px;border-left:3px solid var(--accent);background:rgba(255,255,255,.03);font:600 clamp(18px,2vw,22px)/1.35 var(--fb)}
.press-opts{display:flex;flex-direction:column;gap:8px}
.press-opt{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--bg2);transition:border-color .15s,background .15s}
.press-opt:hover{border-color:var(--accent);background:rgba(255,180,58,.06)}.press-opt em{font-style:normal;font:700 11px var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2)}.press-opt span{font-size:14px;color:#e6e4dd}
.press-f{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.press-dots{display:flex;gap:6px}.press-dots i{width:8px;height:8px;border-radius:50%;background:#2c2c30}.press-dots i.on{background:var(--accent)}.press-dots i.done{background:#8a6a2a}
.press-fx{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.press-fx b{font:700 16px var(--fd)}
@media (max-width:600px){.press-opt{grid-template-columns:1fr;gap:4px}}
.stage canvas.mini{position:absolute;right:14px;bottom:14px;width:210px;height:136px;border-radius:3px;box-shadow:0 8px 20px -8px rgba(0,0,0,.8);pointer-events:none;z-index:2}
@media (max-width:700px){.stage canvas.mini{width:120px;height:78px;right:8px;bottom:8px}}

/* steppers */
.stp-wrap{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.stp{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:stretch;border:1px solid var(--line2);border-radius:4px;background:#101012;overflow:hidden;max-width:360px}
.stp-b{font:600 20px/1 var(--fb);color:#d6d4cd;background:#18181b;transition:background .12s}.stp-b:hover:not(:disabled){background:#232327;color:#fff}.stp-b:disabled{opacity:.3}
.stp-v{display:grid;place-items:center;padding:9px 6px;font:700 20px var(--fd);letter-spacing:.02em;font-variant-numeric:tabular-nums;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.stp-chips{display:flex;gap:4px;flex-wrap:wrap}.stp-chips button{padding:4px 9px;border:1px solid var(--line2);border-radius:3px;font:500 12px var(--fb);color:var(--muted)}.stp-chips button:hover{color:#fff;border-color:#4a4a50}.stp-chips button[aria-pressed="true"]{color:#111;background:#ecebe6;border-color:#ecebe6}
.neg-lbl small{color:var(--dim);font-weight:400;margin-left:6px}
/* phone */
.phone{position:relative;width:min(360px,100%);margin:0 auto;border-radius:34px;padding:12px 12px 74px;background:linear-gradient(180deg,#1b1b1f,#0f0f11);border:1px solid #2c2c31;box-shadow:0 30px 60px -20px rgba(0,0,0,.9),inset 0 0 0 6px #0a0a0b}
.ph-top{display:flex;justify-content:space-between;padding:4px 14px 8px;font:600 12px var(--fb);color:#cfcdc6}.ph-net{display:flex;gap:2px;align-items:flex-end}.ph-net i{width:3px;background:#cfcdc6;border-radius:1px}.ph-net i:nth-child(1){height:4px}.ph-net i:nth-child(2){height:6px}.ph-net i:nth-child(3){height:8px}.ph-net i:nth-child(4){height:10px}
.ph-call{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:rgba(255,255,255,.05);margin:0 4px 10px}
.ph-call b{display:block;font-size:14px}.ph-call small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-av{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#2a2a30;overflow:hidden}.ph-av .crest{width:30px;height:36px}.ph-ini{font:700 15px var(--fb);color:#fff}
.ph-dur{font:600 12px var(--fb);color:#38d184;font-variant-numeric:tabular-nums}
.ph-msgs{display:flex;flex-direction:column;gap:8px;padding:6px 8px;max-height:300px;overflow-y:auto}
.ph-m{align-self:flex-start;max-width:86%;padding:9px 12px;border-radius:16px 16px 16px 4px;background:#26262b;font-size:13.5px;line-height:1.4;animation:pkIn .3s ease-out}
.ph-m.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:#2f6fed;color:#fff}
.ph-replies{display:flex;flex-direction:column;gap:6px;padding:10px 6px 0}
.ph-r{padding:10px 12px;border-radius:12px;border:1px solid #34343a;background:#16161a;text-align:left;font-size:13.5px;color:#e6e4dd}.ph-r:hover{border-color:#5a5a62;background:#1d1d22}.ph-r.pri{background:#ecebe6;color:#111;border-color:#ecebe6;font-weight:600}
.ph-extra{padding:10px 6px 0;display:flex;flex-direction:column;gap:8px}.ph-extra small{color:var(--muted);font-size:12px}
.ph-hang{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;background:#e5383b;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(229,56,59,.6)}.ph-hang svg{width:26px;height:26px;fill:#fff}
.nr-body.call{align-items:start}.oc{padding:6px 0}

/* tactical fit */
.tf-rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tf-rows small{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.tf-rows b{font:800 24px var(--fd)}
.tf-bar{height:5px;border-radius:3px;background:#26262a;margin-top:4px;overflow:hidden}.tf-bar i{display:block;height:100%}
.tf-txt{font-size:13.5px;margin:12px 0 8px;line-height:1.55}
.tf-parts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tf-parts small{width:100%;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.tf-parts span{font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:3px;color:#cfcdc6}.tf-parts b{color:var(--accent2)}
.rfit{font-style:normal;font:700 11px var(--fd);margin-left:4px;opacity:.9}.rcx{font-style:normal;font-size:9px;color:var(--accent2);margin-left:3px}

/* trophies */
.tr2{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:24px;max-width:720px}
.tr2-rays{position:absolute;left:50%;top:120px;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c2) 18%,transparent) 0 6deg,transparent 6deg 18deg);border-radius:50%;mask:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);animation:trSpin 30s linear infinite;pointer-events:none;z-index:-1}
@keyframes trSpin{to{transform:rotate(360deg)}}
.tr2-cup{animation:trLift 1.4s cubic-bezier(.2,.8,.2,1.15) both;filter:drop-shadow(0 0 40px rgba(255,214,120,.45)) drop-shadow(0 20px 30px rgba(0,0,0,.7))}
@keyframes trLift{0%{transform:translateY(80px) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
.tr2-crest{margin-top:-6px;animation:awIn .6s .8s both}
.tr2 h1{font:800 clamp(38px,6vw,68px)/1 var(--fd);letter-spacing:.05em;text-transform:uppercase;margin:0;text-shadow:0 0 30px color-mix(in srgb,var(--c2) 60%,transparent)}
.tr2-sub{margin:0 0 10px;color:#d6d4cd;font-size:15px}
.parade{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;width:min(900px,96vw)}
.parade h1{font:800 clamp(36px,6vw,64px)/1 var(--fd);text-transform:uppercase;letter-spacing:.05em;margin:0}
.pd-street{position:relative;width:100%;height:190px;border-radius:6px;overflow:hidden;background:linear-gradient(180deg,#1b2230 0,#1b2230 50%,#2b2b30 50%,#232328 100%)}
.pd-crowd{position:absolute;left:0;right:0;top:46%;height:40px}
.pd-crowd i{position:absolute;width:9px;height:14px;border-radius:5px 5px 2px 2px;animation:pdWave .7s ease-in-out infinite alternate}
@keyframes pdWave{to{transform:translateY(-6px)}}
.pd-bus{position:absolute;bottom:8px;left:-300px;animation:pdDrive 9s linear infinite;display:flex;flex-direction:column;align-items:center}
.pd-cups{position:absolute;top:-34px;display:flex;gap:4px}.pd-cups .trophy{width:34px;height:auto}
@keyframes pdDrive{to{left:110%}}
.troom-tally{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.troom-tally span{font-size:13px;padding:4px 10px;border:1px solid rgba(232,194,90,.35);border-radius:3px;color:#e8d8a8}.troom-tally b{color:#e8c25a}
.troom{display:flex;flex-direction:column;gap:18px;padding:14px;border-radius:6px;background:radial-gradient(60% 80% at 50% 0%,rgba(255,226,150,.08),transparent 70%),linear-gradient(180deg,#141210,#0d0c0b)}
.tshelf-items{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:0 10px}
.tslot{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.tslot .trophy{filter:drop-shadow(0 10px 14px rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(255,214,120,.18))}
.tslot b{font:700 12px var(--fd);text-transform:uppercase;letter-spacing:.06em;color:#e8d8a8}.tslot small{font-size:11px;color:var(--dim)}
.tshelf-plank{height:12px;margin-top:6px;border-radius:2px;background:linear-gradient(180deg,#5a4026,#3a2816);box-shadow:0 8px 14px -6px rgba(0,0,0,.8);position:relative}.tshelf-plank span{position:absolute;left:50%;top:14px;transform:translateX(-50%);font:700 11px var(--fd);letter-spacing:.18em;color:#a08a6a}
.tshelf{padding-bottom:16px}
@media (prefers-reduced-motion:reduce){.tr2-rays,.pd-bus,.pd-crowd i{animation:none}}

.ov-cel{left:50%;top:4%;transform:translate(-50%,-14px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;pointer-events:none}
.ov-cel.on{transform:translate(-50%,0);pointer-events:auto}
.ov-cel small{font:700 12px var(--fd);letter-spacing:.3em;color:#ffd56a}
.ov-cel b{font:800 clamp(26px,4vw,50px)/1 var(--fd);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 28px rgba(255,200,90,.7),0 4px 0 rgba(0,0,0,.4)}
.ov-cel span{font:600 14px var(--fb);color:#e6e4dd;text-shadow:0 2px 8px #000}
.ov-cel button{margin-top:8px;padding:6px 14px;background:rgba(12,12,14,.8);border:1px solid rgba(255,214,120,.5);color:#ffe2a0;font:700 12px var(--fd);letter-spacing:.14em;text-transform:uppercase}

/* home strip, derbies, vision, achievements */
.home-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.hk{background:var(--panel);padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}.hk small{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hk b{font:700 17px var(--fd);letter-spacing:.02em}.hk span{font-size:11px;color:var(--dim)}
.hk-bar{display:block;height:3px;border-radius:2px;background:#26262a;margin:3px 0 1px;overflow:hidden}.hk-bar i{display:block;height:100%;background:var(--tc,var(--accent))}
@media (max-width:1100px){.home-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:600px){.home-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.derby-tag{display:inline-block;padding:2px 7px;border-radius:3px;background:#c62f3a;color:#fff;font:700 10.5px var(--fd);letter-spacing:.14em;text-transform:uppercase}
.derby-note{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px 0 0;font-size:12.5px;color:#e6c6c8;flex-wrap:wrap;text-align:center}
.vis .vis-ic{font-weight:800;color:var(--dim)}.vis.done .vis-ic{color:var(--win)}.vis.fail .vis-ic{color:var(--loss)}.vis.done b{color:#cfe9d9}.vis.fail b{text-decoration:line-through;color:var(--dim)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.ach{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line2);border-radius:4px;opacity:.55}.ach.on{opacity:1;border-color:rgba(232,194,90,.45);background:linear-gradient(180deg,rgba(232,194,90,.07),transparent)}
.ach-ic{font-size:20px;line-height:1;color:#e8c25a}.ach b{display:block;font-size:13.5px}.ach small{color:var(--muted);font-size:12px}.ach em{display:block;font-style:normal;font-size:11px;color:#e8c25a;margin-top:3px}

/* ================= top navigation (replaces the sidebar) ================= */
body.ingame.topnav{display:block}

<script>

   Real kits are mostly plain or one traditional pattern; away and third kits are simpler still. Checks,
   diagonal stripes, chevrons, quarters and gradients read as fancy dress, so they are re-picked once per
   save (deterministically from the club name), and patterns whose two colours are too close are made plain. */
const KIT_REAL={home:[['plain',13],['stripes',3],['hoops',1],['pinstripe',2],['band',1],['yoke',1],['panels',1],['centre',1],['halves',1],['sash',1],['hoopsthin',1]],

function realKits(c){
 for(const w of ['home','away','third']){const k=c.kits[w];if(!k)continue;
  const L=KIT_REAL[w],tot=L.reduce((a,x)=>a+x[1],0);let r=strHash(c.name+w)%tot;
  for(const[p,n]of L){if(r<n){k.pattern=p;break}r-=n}
  if(k.pattern!=='plain'&&contrast(k.base,k.alt)<1.25)k.pattern='plain';
  if(contrast(k.trim,k.base)<1.15)k.trim=contrast(k.alt,k.base)>=1.15?k.alt:ink(k.base);
  // An away kit must not clash with the home kit at a glance.
  if(w==='away'&&contrast(c.kits.home.base,k.base)<1.6){k.base=lum(c.kits.home.base)>.4?'#151b2b':'#f2f1ec';k.alt=c.colors[0];if(contrast(k.alt,k.base)<1.25)k.alt=ink(k.base)}
 }
 c.kitsV=2;
}

function setShape(tm){tm.slots=FORMATIONS[tm.tac.form];tm.slotsIn=FORMATIONS[tm.tac.formIn||tm.tac.form];tm.inMap=shapeMap(tm.tac.form,tm.tac.formIn)}

 if(f<1)for(const k of['pos','dec','mar','tck','vis','cro'])a[k]*=f;
 if(s===0)for(const k of['pas','dec','pos','fin','fir','cmp'])a[k]=Math.min(1,a[k]*1.035);
 return{i,s,slot,pid:po.id,num:po.num,name:po.ln,pos,role:tm.tac.roles[slot]||ROLES[pos][0][0],a,x:0,y:0,vx:0,vy:0,tx:0,ty:0,

function ev(E,type,s,i,d){const m=clockSec(E);const e=Object.assign({t:E.t,min:m,type,s,i,pid:i!=null&&i>=0?E.P[i].pid:null},d||{});E.events.push(e);return e}

/* ---------- main step ---------- */

 }

 {const m=Math.floor(clockSec(E)/60),mo=E.mom[m]||(E.mom[m]=[0,0]);mo[E.poss]+=threat(fX(E.poss,b.x),fY(E.poss,b.y))*DT;

/* ---------- team shape ---------- */

// Pressing, marking, chasing loose balls, receivers and runs: overrides on top of the shape.

/* ---------- movement ---------- */

function placeBall(c,b){const sp=Math.hypot(c.vx,c.vy);let dx,dy;if(sp>.4){dx=c.vx/sp;dy=c.vy/sp}else{dx=c.s?-1:1;dy=0}b.x=c.x+dx*.55;b.y=c.y+dy*.55;b.z=.11;b.vx=c.vx;b.vy=c.vy;b.vz=0}

/* ---------- ball carrier ---------- */
function carrier(E,c){

/* ================= save slots =================
   Careers live in IndexedDB (gzip-compressed where the browser supports it), one record per slot plus a small
   metadata record for the menu. Falls back to localStorage if IndexedDB is unavailable. */
const SLOTS=3;
const DB={
 p:null,fallback:false,
 open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('dugout-saves',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}).catch(e=>{this.fallback=true;return null});return this.p},
 async put(k,v){const db=await this.open();if(!db){localStorage.setItem('dugout:'+k,typeof v==='string'?v:JSON.stringify(v));return}
  return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 async get(k){const db=await this.open();if(!db){const v=localStorage.getItem('dugout:'+k);if(v==null)return null;try{return k[0]==='m'?JSON.parse(v):v}catch(e){return v}}
  return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej(r.error)})},
 async del(k){const db=await this.open();if(!db){localStorage.removeItem('dugout:'+k);return}
  return new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})},
};
async function pack(str){if(DB.fallback||typeof CompressionStream==='undefined')return str;return new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).blob()}
async function unpack(v){if(v==null)return null;if(typeof v==='string')return v;return new Response(v.stream().pipeThrough(new DecompressionStream('gzip'))).text()}
function slotMeta(){
 const c=clubOf(S.user),lg=S.leagues[c.league],played=S.results[c.league].length;
 return{slot:S.slot,savedAt:Date.now(),club:{id:c.id,name:c.name,short:c.short,abbr:c.abbr,colors:c.colors,crest:c.crest,est:c.est},league:lg.name,season:seasonLabel(),md:S.md,
  pos:played?posIn(table(c.league),S.user):null,rec:[S.mgr.w,S.mgr.d,S.mgr.l],trophies:S.mgr.trophies.filter(t=>!t.minor).length,seasons:S.mgr.seasons};
}
let saveTimer=0,savePending=null;
function save(){
 if(!S||!S.slot)return false;
 clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,350);return true;
}
async function flushSave(){
 clearTimeout(saveTimer);if(!S||!S.slot)return;
 const slot=S.slot,json=JSON.stringify(S),meta=slotMeta();
 // Chain writes so a slower, older save can never land after a newer one.
 savePending=(savePending||Promise.resolve()).then(async()=>{try{await DB.put('d'+slot,await pack(json));await DB.put('m'+slot,DB.fallback?JSON.stringify(meta):meta)}
  catch(e){if(typeof toast==='function'&&!save.warned){save.warned=1;toast('Could not save: browser storage is full or blocked')}}});
 return savePending;
}
async function loadSlot(n){const raw=await unpack(await DB.get('d'+n));if(!raw)return null;const s=JSON.parse(raw);if(!s||s.v!==3)return null;s.slot=n;return s}
async function readMetas(){const out=[];for(let n=1;n<=SLOTS;n++){let m=await DB.get('m'+n);if(typeof m==='string')try{m=JSON.parse(m)}catch(e){m=null}out.push(m||null)}return out}
async function deleteSlot(n){await DB.del('d'+n);await DB.del('m'+n)}
// One-time move of a pre-slot career (single localStorage save) into slot 1.
async function migrateLegacy(){
 try{const t=localStorage.getItem(KEY);if(!t)return;const s=JSON.parse(t);if(!s||s.v!==3||s.user<0)return;
  const metas=await readMetas();if(metas[0])return;
  const prev=S;S=s;S.slot=1;await flushSave();await savePending;S=prev;localStorage.removeItem(KEY)}catch(e){}
}

const TALKS=[['calm','Stay calm','Keep your heads.'],['motivate','Motivate','Go out and enjoy it.'],['demand','Demand more','I expect better than this.'],['praise','Praise','Brilliant, keep it going.']];
function talkEffect(kind,diff,half){
 // diff = our goals minus theirs at the time of the talk
 const t={calm:diff<0?.01:.015,motivate:half?(diff<=0?.03:.01):.025,demand:diff<0?.045:diff===0?.02:-.03,praise:diff>0?.03:diff===0?0:-.035}[kind];
 return t+(G.f()-.5)*.02;
}
function applyTalk(E,s,delta){for(const p of E.T[s].pl){if(p.off)continue;for(const k of['dec','cmp','wor','fin','pas','pos'])p.a[k]=clamp(p.a[k]*(1+delta),.05,1)}}
const talkWord=d=>d>.025?'The players look fired up.':d>.008?'The players respond well.':d>-.008?'The message has little effect.':'The players look rattled by your words.';
function talkHTML(half){const E=M&&M.E,diff=E?E.score[M.us]-E.score[1-M.us]:0;
 return`<div class="talk"><div class="eyebrow">${half?'Half-time team talk':'Pre-match team talk'}</div><h2>${half?`${M.score[0]}–${M.score[1]} at the break`:'Final words before kick-off'}</h2><p class="muted">${half?(diff>0?'You are ahead. Keep them focused.':diff<0?'You are behind. They need a reaction.':'All square. Push them on.'):'Set the tone for the match.'}</p>

function trophyInfo(t){
 // t: a trophy record {t:name, key?, season, club, minor?}
 let key=t.key;
 if(!key){if(t.t===CONT_NAME)key='cont';else{const dk=Object.entries(CUP_NAMES).find(([,n])=>n===t.t);if(dk)key='dom-'+dk[0];else{const lg=S.leagues.find(l=>t.t.includes(l.name));key=lg?'lg:'+lg.id:'lg:0'}}}
 if(key==='cont'){const st=cupStyle('cont');return{key,kind:'cont',metal:'silver',c1:st.c1,c2:'#9fb4e8',name:CONT_NAME}}
 if(key.startsWith('dom-')){const n=key.slice(4),[c1,c2]=COMP_STYLE[n];return{key,kind:'jug',metal:'gold',c1,c2,name:CUP_NAMES[n]}}
 const lid=+key.slice(3),lg=S.leagues[lid]||S.leagues[0],st=compStyle(lg.id);
 return{key,kind:t.minor||lg.tier?'plate':'league',metal:lg.tier||t.minor?'silver':'gold',c1:st.c1,c2:st.c2,name:t.minor?t.t:lg.name};
}

 const defs=`<defs><linearGradient id="${id}m" x1="0" x2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset=".42" stop-color="${g[1]}"/><stop offset=".6" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/></linearGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c32"/><stop offset="1" stop-color="#121214"/></linearGradient></defs>`;

 else if(info.kind==='jug')body=`<path d="M40 22h40c2 18 8 28 8 42 0 18-14 26-28 26S32 82 32 64c0-14 6-24 8-42z" fill="${sw}"/><path d="M34 34c-22-4-26 34-4 38M86 34c22-4 26 34 4 38" fill="none" stroke="${sw}" stroke-width="5.5"/><ellipse cx="60" cy="22" rx="20" ry="5" fill="${g[1]}"/><path d="M53 90h14v12H53z" fill="${sw}"/><path d="M42 102h36l4 26H38z" fill="${sw}"/><rect x="42" y="108" width="36" height="7" fill="${info.c1}"/><rect x="42" y="115" width="36" height="3" fill="${info.c2}"/>`;
 else if(info.kind==='cont')body=`<path d="M46 30h28c0 22 6 30 6 46 0 12-10 18-20 20-10-2-20-8-20-20 0-16 6-24 6-46z" fill="${sw}"/><path d="M42 38c-16-10-28 8-18 24 6 10 16 10 20 8M78 38c16-10 28 8 18 24-6 10-16 10-20 8" fill="none" stroke="${sw}" stroke-width="6"/><polygon points="${starPts(60,16,10,4)}" fill="${sw}"/><ellipse cx="60" cy="30" rx="15" ry="4" fill="${g[1]}"/><path d="M55 96h10v8H55z" fill="${sw}"/><path d="M44 104h32l4 24H40z" fill="${sw}"/>${Array.from({length:5},(_,k)=>`<circle cx="${46+k*7}" cy="116" r="1.8" fill="#dfe5f0"/>`).join('')}`;
 else body=`<circle cx="60" cy="58" r="34" fill="${sw}"/><circle cx="60" cy="58" r="27" fill="none" stroke="${dk}" stroke-width="1.5" opacity=".6"/><circle cx="60" cy="58" r="16" fill="${info.c1}" opacity=".9"/><polygon points="${starPts(60,58,9,3.6)}" fill="${g[1]}"/><path d="M54 92h12v10H54z" fill="${sw}"/><path d="M44 102h32l4 26H40z" fill="${sw}"/>`;

/* ---------- contract renewal ---------- */
function renewDemand(p){const role=squadRole(p),k={key:1.35,first:1.2,rot:1.05,back:.95,youth:.9}[role]||1;return Math.round(Math.max(p.wage*1.05,wageOf(p))*k*(p.age<=24?1.08:1)/100)*100}
function openRenew(pid){const p=S.players[pid];ui.ren={pid,wage:renewDemand(p),years:p.age>=31?2:p.age<=23?5:4,role:squadRole(p),tries:0,msg:''};renderRenew()}
function renderRenew(){
 const r=ui.ren,p=S.players[r.pid],d=renewDemand(p),room=clubOf(S.user).wageBudget-wageBill(S.user)+p.wage,max=Math.max(p.wage,Math.min(room,Math.round(d*1.6/100)*100));
 openModal(`<div class="eyebrow">Contract talks · ${esc(p.fn+' '+p.ln)}</div><h2 style="font-size:26px;margin:6px 0 4px">Offer a new contract</h2><p class="muted" style="margin:0 0 14px">Currently ${money(p.wage)} p/w until June ${2027+S.season+p.con-1}. His agent is looking for around <b>${money(d)}</b> p/w${p.age>=31?' and the security of a longer deal':''}.</p>
 <div class="neg-f"><label>Weekly wage</label>${stepper('ren','wage',r.wage,{min:0,max:9e12,label:'Weekly wage',suffix:' p/w',chips:[['His demand',d],['−5%',nice(d*.95,100)],['+5%',nice(d*1.05,100)],['Current',p.wage]]})}</div>
 <div class="neg-f"><label>Length</label><div class="seg" role="group">${[1,2,3,4,5].map(y=>`<button data-act="ren-y" data-v="${y}" aria-pressed="${r.years===y}">${y} yr${y>1?'s':''}</button>`).join('')}</div></div>
 <div class="neg-f"><label>Squad status promised</label><div class="seg" role="group">${PROMISES.filter(x=>x[0]!=='youth'||p.age<=21).map(([k,l])=>`<button data-act="ren-r" data-v="${k}" aria-pressed="${r.role===k}">${l}</button>`).join('')}</div></div>
 ${r.msg?`<p class="ren-msg">${esc(r.msg)}</p>`:''}<p class="muted" style="font-size:12px">Wage room after this deal: ${money(room-r.wage)} p/w</p>
 <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="close">Walk away</button><button class="btn pri" data-act="ren-offer">Submit offer</button></div>`);
}
function renewOffer(){
 const r=ui.ren,p=S.players[r.pid],d=renewDemand(p),cur=squadRole(p),roleRank=k=>['back','youth','rot','first','key'].indexOf(k);
 const roleBonus=(roleRank(r.role)-roleRank(cur))*.06,yearsOk=p.age>=31?r.years>=2:p.age<=22?r.years<=5:true,need=d*(1-roleBonus)*(p.mor<50?1.1:1);
 const room=clubOf(S.user).wageBudget-wageBill(S.user)+p.wage;
 if(r.wage>room){r.msg='That would take you over the wage budget. Free up wages or ask the board for more.';return renderRenew()}
 if(roleRank(r.role)>roleRank(cur)+1){r.msg=`His agent doesn't believe the promise: "He knows where he stands in the squad. Be realistic."`;return renderRenew()}
 if(r.wage>=need&&yearsOk){p.wage=r.wage;p.con=r.years;p.prom=r.role;p.mor=clamp(p.mor+10,25,98);p.compl=0;closeModal();save();render();
  mail('Director of Football',`${p.ln} signs a new contract`,`<p>${esc(p.fn+' '+p.ln)} has agreed a new ${r.years}-year deal worth <b>${money(r.wage)}</b> a week, as a ${promName(r.role).toLowerCase()}.</p>`,null,'transfer',{att:{t:'player',pid:p.id,note:'New contract'},links:[['View player','player',p.id,1]]});toast(`${p.ln} has signed a new contract`);return}
 r.tries++;p.mor=clamp(p.mor-3,25,98);
 if(r.tries>=4){closeModal();toast(`${p.ln}'s agent has ended talks for now`);p.noTalks=S.md+6;save();render();return}
 r.msg=!yearsOk?(p.age>=31?'"At his age he wants security. At least two years."':'"He wants a long-term deal."'):`"We're not there yet. He's looking for something closer to ${money(Math.round(need/100)*100)} a week."`;renderRenew();
}

/* ---------- happiness and contract expiry, run each matchday ---------- */
function squadMood(){
 const xi=new Set(clubOf(S.user).tac.xi);
 for(const p of squadOf(S.user)){
  if(xi.has(p.id))p.benched=0;else p.benched=(p.benched||0)+1;
  const want=p.prom||squadRole(p),lim=want==='key'?3:want==='first'?5:99;
  if(p.benched>=lim){p.mor=clamp(p.mor-4,25,98);if(!p.compl||S.md-p.compl>8){p.compl=S.md;
   mail(p.fn+' '+p.ln,'Playing time',`<p>Boss, I was told I'd be a ${promName(want).toLowerCase()} here, but I haven't started for ${p.benched} matches. I want to be playing.</p>`,null,'staff',{att:{t:'player',pid:p.id},links:[['View player','player',p.id,1],['Tactics','nav','tactics']]})}}
 }
 if(S.md===24){const exp=squadOf(S.user).filter(p=>p.con<=1);if(exp.length)mail('Director of Football','Contracts expiring this summer',`<p>${exp.length} player${exp.length>1?'s are':' is'} out of contract at the end of the season and will leave on a free unless we agree new terms: ${exp.map(p=>esc(p.fn+' '+p.ln)).join(', ')}.</p>`,null,'transfer',{att:{t:'players',pids:exp.map(p=>p.id)},links:exp.slice(0,3).map(p=>[`Talk to ${p.ln}`,'player',p.id,1])})}
}
// At season end, the user's players whose contracts have run out leave on a free transfer.
function contractExits(){
 const gone=[];
 for(const p of squadOf(S.user).slice()){if(p.con>1)continue;if(squadOf(S.user).length<=18)break;
  const to=S.clubs.filter(c=>c.id!==S.user&&Math.abs(repToOvr(c.rep)-p.ovr)<8&&c.squad.length<30).sort(()=>G.f()-.5)[0];if(!to)continue;
  moveP(p.id,to.id,0);p.con=G.i(2,4);gone.push(p);news(`${p.fn} ${p.ln} joins ${to.name} on a free transfer after his contract with ${clubOf(S.user).name} expired.`,'transfer',[to.id,S.user])}
 if(gone.length)mail('Director of Football','Players released',`<p>These players left on free transfers when their contracts expired: ${gone.map(p=>esc(p.fn+' '+p.ln)).join(', ')}.</p>`,null,'transfer');
}

/* ---------- knowledge: how well the club knows a player ---------- */
function know(p){
 if(!p||p.club===S.user||(S.acad||[]).includes(p.id))return 100;
 const c=clubOf(p.club),uc=clubOf(S.user),base=c.league===uc.league?55:c.nation===uc.nation?35:15;
 return Math.min(100,base+((S.know||{})[p.id]||0));
}
function attrShown(p,a){
 const v=at20(p.at[AIX[a]]),k=know(p);if(k>=95)return{v,t:String(v)};
 const sp=Math.max(1,Math.round((100-k)/24)),off=((p.id*7+AIX[a]*13)%3)-1,lo=clamp(v-sp+off,1,20),hi=clamp(v+sp+off,1,20);
 return{v:(lo+hi)/2,t:lo===hi?String(lo):`${lo}–${hi}`,unc:true};
}
function potShown(p){const k=know(p);if(k>=80)return starHTML(stars(p.pot));const s=stars(p.pot),sp=k<40?1:.5;return`<span class="unc-stars">${Math.max(.5,s-sp)}–${Math.min(5,s+sp)}<i>★</i></span>`}

/* ---------- scouting ---------- */
function gradeOf(p){
 const uc=S.user,peers=squadOf(uc).filter(q=>GROUP[q.pos]===GROUP[p.pos]).sort((a,b)=>b.ovr-a.ovr),bar=(peers[1]||peers[0]||{ovr:60}).ovr;
 if(p.ovr>=bar+2||p.age<=21&&p.pot>=bar+8)return'A';if(p.ovr>=bar-2||p.age<=23&&p.pot>=bar+3)return'B';if(p.ovr>=bar-7)return'C';return'D';
}
const GRADE_TXT={A:'Would improve the first team. Strongly recommended.',B:'Could compete for a starting place.',C:'Squad depth at best.',D:'Not good enough for us.'};
function addReport(pid){const p=S.players[pid];if(!p||p.club===S.user)return;S.reports=(S.reports||[]).filter(r=>r.pid!==pid);S.reports.unshift({pid,grade:gradeOf(p),md:S.md,season:S.season});if(S.reports.length>80)S.reports.length=80}
function scoutTick(){
 S.know=S.know||{};const fresh=[];
 for(const pid of S.scoutQ||[]){S.know[pid]=100;addReport(pid);fresh.push(pid)}S.scoutQ=[];
 const a=S.scout;
 if(a){const pool=Object.values(S.players).filter(p=>p.club!==S.user&&p.club>=0&&(a.region==='all'||clubOf(p.club).nation===a.region)&&(a.pos==='all'||GROUP[p.pos]===a.pos)&&p.age<=a.age&&know(p)<90);
  for(const p of shuffled(pool).sort((x,y)=>y.pot-x.pot).slice(0,30).sort(()=>G.f()-.5).slice(0,7)){S.know[p.id]=(S.know[p.id]||0)+38;if(know(p)>=70&&gradeOf(p)<='B'){addReport(p.id);fresh.push(p.id)}}}
 if(fresh.length){const ps=fresh.map(id=>S.players[id]).filter(Boolean).sort((x,y)=>gradeOf(x).localeCompare(gradeOf(y)));
  mail('Chief Scout',`Scouting update: ${fresh.length} new report${fresh.length>1?'s':''}`,`<p>${ps.slice(0,4).map(p=>`<b>${esc(p.fn+' '+p.ln)}</b> (${p.pos}, ${p.age}, ${esc(clubOf(p.club).short)}): grade ${gradeOf(p)}. ${GRADE_TXT[gradeOf(p)]}`).join('<br>')}</p>`,null,'transfer',{att:{t:'players',pids:ps.slice(0,2).map(p=>p.id)},links:[['Scouting centre','goto','transfers/scouting']]})}
}

// Every club has one local rival: the nearest-reputation club from the same country, paired deterministically.
function rivalOf(cid){
 const c=clubOf(cid),pool=S.clubs.filter(x=>x.id!==cid&&x.nation===c.nation);if(!pool.length)return null;
 const h=x=>(Math.imul(Math.min(cid,x.id)*131+Math.max(cid,x.id),2654435761)>>>0)%7;
 return pool.slice().sort((a,b)=>(Math.abs(a.rep-c.rep)+h(a))-(Math.abs(b.rep-c.rep)+h(b)))[0].id;
}
const isDerby=(a,b)=>rivalOf(a)===b||rivalOf(b)===a;
function h2hRecord(opp){const r=(S.h2h||{})[opp]||{w:0,d:0,l:0};return r}
function recordH2H(opp,gf,ga){S.h2h=S.h2h||{};const r=S.h2h[opp]=S.h2h[opp]||{w:0,d:0,l:0};r[gf>ga?'w':gf<ga?'l':'d']++}

const VISION_POOL=[
 {k:'pos',t:o=>`Finish ${ordinal(o.v)} or higher in the league`,mk:c=>({v:Math.max(1,targetPos(c.id)-1),y:2})},
 {k:'cont',t:()=>'Qualify for the Continental Elite Cup',mk:c=>({v:1,y:3}),ok:c=>c.rep>=72},
 {k:'cup',t:()=>'Reach a domestic cup semi-final',mk:()=>({v:1,y:2})},

function ensureVision(){
 if(S.vision&&S.vision.club===S.user)return;
 const c=clubOf(S.user),pool=VISION_POOL.filter(g=>!g.ok||g.ok(c));
 const pick=[pool.find(g=>g.k==='pos')||pool[0],...shuffled(pool.filter(g=>g.k!=='pos')).slice(0,2)];
 S.vision={club:S.user,set:S.season,goals:pick.map(g=>Object.assign({k:g.k,done:false,failed:false,prog:0},g.mk(c),{due:S.season+g.mk(c).y-1}))};
}
const visionText=g=>(VISION_POOL.find(x=>x.k===g.k)||{t:()=>g.k}).t(g);
// Evaluated at season end (before the table resets).
function visionReview(){
 ensureVision();const c=clubOf(S.user),out=[];
 const pos=S.lastRow?posIn(table(c.league),S.user):null;
 for(const g of S.vision.goals){if(g.done||g.failed)continue;
  if(g.k==='pos'&&pos&&pos<=g.v)g.done=true;
  if(g.k==='title'&&pos===1)g.done=true;
  if(g.k==='promo'&&S.leagues[c.league].tier===1&&pos<=DROP)g.done=true;
  if(g.k==='cont'&&contQualifiers(true).includes(S.user))g.done=true;
  if(g.k==='cup'&&S.cups){for(const k of Object.values(S.cups))if(k.key.startsWith('dom')&&k.rounds[3]&&k.rounds[3].some(t=>t.h===S.user||t.a===S.user))g.done=true}
  if(g.k==='youth'){g.prog=squadOf(S.user).filter(p=>p.youth&&p.s.ap>0).length+(g.prog||0);if(g.prog>=g.v)g.done=true}
  if(g.k==='young'){const n=clubOf(S.user).tac.xi.map(id=>S.players[id]).filter(p=>p&&p.age<=23).length;g.prog=n;if(n>=g.v)g.done=true}
  if(g.k==='wages'){if(wageBill(S.user)>c.wageBudget)g.failed=true;else if(S.season>=g.due)g.done=true}
  if(!g.done&&S.season>=g.due)g.failed=true;
  if(g.done){S.board=clamp(S.board+8,5,100);c.budget+=Math.round(budgetOf(c.rep)*.15/1e5)*1e5;out.push(['done',g])}
  if(g.failed){S.board=clamp(S.board-10,5,100);out.push(['fail',g])}}
 if(out.length)mail('Board of Directors','Club vision: end-of-season review',`<p>${out.map(([s,g])=>`${s==='done'?'Achieved':'Missed'}: <b>${esc(visionText(g))}</b>.`).join('<br>')}</p><p>${out.some(x=>x[0]==='done')?'The board has added a bonus to the transfer budget.':''}</p>`,null,'board',{links:[['Board room','goto','office/board']]});
 // when every goal is resolved, the board sets a new vision
 if(S.vision.goals.every(g=>g.done||g.failed))S.vision=null;
}

// After each of the user's matches (from the full engine).
function achMatch(E,us,tie){
 const gf=E.score[us],ga=E.score[1-us],opp=E.T[1-us].club,mg=S.mgr;
 if(gf>ga)unlock('first');if(gf-ga>=5)unlock('five');
 S.run=gf>=ga?(S.run||0)+1:0;if(S.run>=10)unlock('unbeaten10');
 if(gf>ga&&isDerby(S.user,opp))unlock('derby');if(gf>ga&&clubOf(opp).rep>=clubOf(S.user).rep+10)unlock('giant');
 if(ga===0)S.cs=(S.cs||0)+1;if((S.cs||0)>=15)unlock('cs');
 const ht=E.events.find(e=>e.type==='ht'),htg=ht?E.events.filter(e=>e.type==='goal'&&e.t<ht.t):[];if(gf>ga&&htg.filter(e=>e.s!==us).length>htg.filter(e=>e.s===us).length)unlock('comeback');
 const games=mg.w+mg.d+mg.l+1;if(games>=100)unlock('m100');if(games>=300)unlock('m300');
 if((clubOf(S.user).tac.fam||0)>=100)unlock('fam');if((S.reports||[]).length>=25)unlock('scout');
 if(M&&M.pens&&M.pens[us]>M.pens[1-us])unlock('pens');
 if(isDerby(S.user,opp))recordH2H(opp,gf,ga);
}

 if(tr.some(t=>!t.minor&&t.key&&t.key.startsWith('lg:')))unlock('title');if(tr.some(t=>t.key&&t.key.startsWith('dom-')))unlock('cup');if(tr.some(t=>t.key==='cont'))unlock('cont');
 if(tr.filter(t=>!t.minor).length>=2&&tr.some(t=>t.key&&t.key.startsWith('lg:')&&!t.minor))unlock('double');if(tr.some(t=>t.minor))unlock('promo');

 M.E=createMatch({seed:(S.seed^(S.season*1000+S.md*17+h*3))>>>0,getP:id=>S.players[id],teams:[team(h),team(a)],weather:M.wx});

 if(M.preTalk){const d=talkEffect(M.preTalk,0,false);applyTalk(M.E,M.us,d);setTimeout(()=>toast(talkWord(d)),400)}

const clockAt=(E,t)=>{const c=t<E.h1?Math.min(t,E.h1):2700+(t-E.h1);const m=Math.floor(c/60);if(t<E.h1&&c>=2700)return`45+${Math.floor((c-2700)/60)+1}'`;if(c>=5400)return`90+${Math.floor((c-5400)/60)+1}'`;return`${m+1}'`};
function evText(e){
 const E=M.E,nm=pid=>pid!=null&&S.players[pid]?S.players[pid].ln:'',team=s=>s>=0?clubOf(E.T[s].club).short:'';
 switch(e.type){
  case'goal':return`GOAL! ${team(e.s)} ${e.score[0]}–${e.score[1]}. ${nm(e.pid)} ${e.pen?'converts the penalty':e.head?'heads it in':['finishes calmly','drills it into the corner','fires it past the keeper','slots it home','smashes it in'][e.pid%5]}${e.astPid!=null?`. Assist: ${nm(e.astPid)}`:''}.`;
  case'save':return`${nm(e.gkPid)} saves from ${nm(e.pid)}${e.x>.25?'. What a stop!':'.'}`;
  case'miss':return e.x>.25?`Big chance! ${nm(e.pid)} misses from close range.`:`${nm(e.pid)} ${['shoots wide','fires over the bar','drags it past the post'][e.pid%3]}.`;
  case'block':return`${nm(e.pid)}'s ${e.cross?'cross':'shot'} is blocked.`;
  case'corner':return`Corner to ${team(e.s)}.`;
  case'foul':return e.card===1?`Yellow card for ${nm(e.pid)}.`:e.card===2?'':`Free kick: foul by ${nm(e.pid)}.`;

  case'weather':return{rain:'Rain is falling now.',storm:'The rain is getting heavier. Conditions are treacherous.',cloudy:'The weather is clearing up.',snow:'Snow is starting to fall.',clear:'The sun is out.',wind:'The wind is picking up.',heat:'It is getting hot out there.'}[e.wx]||'';
  case'ht':return`Half-time: ${team(0)} ${M.score[0]}–${M.score[1]} ${team(1)}.`;

 }

const evClass=e=>e.type==='weather'?'whistle':e.type==='goal'?'goal':e.type==='red'?'card red':e.type==='foul'&&e.card?'card':e.type==='ht'||e.type==='ft'?'whistle':'';
function scanEvents(){
 const E=M.E;
 for(;M.scan<E.events.length;M.scan++){const e=E.events[M.scan];
  // Key highlights keep only real chances; extended shows every shot plus set pieces and cards.
  if(e.type==='shot'&&(e.out==='goal'||e.x>=(M.mode==='ext'?.04:.11)||M.mode==='ext'&&e.out==='save'))M.wins.push([e.t-7,e.t+2]);
  if(e.type==='goal')M.wins.push([e.t-1,e.t+6.5]);

 }
}

function nextWin(t){let n=Infinity;for(const w of M.wins)if(w[0]>t&&w[0]<n)n=w[0];return n}
function surface(){

 while(M.shown<E.events.length&&E.events[M.shown].t<=M.pt+1e-6){
  const e=E.events[M.shown++],ss=M.ss;

  if(e.type==='ht')SND.whistle(2,true);if(e.type==='ft')SND.whistle(3,true);if(e.type==='red'||e.type==='pen')SND.swell(.7,1.6);
  if(e.type==='ht'&&!M.htDone){M.htDone=true;M.paused=true;const b=$('#m-pause');if(b)b.textContent='Resume';openModal(talkHTML(true))}

  if(e.type==='corner')ss.cor[e.s]++;if(e.type==='foul'){ss.fo[e.s]++;if(e.card)ss.yc[e.s]++}if(e.type==='offside')ss.off[e.s]++;

  case'menu-new':menuNew(v?+v:null,t.dataset.over);break;
  case'menu-cancel':ui.slotIntent=null;render();break;
  case'menu-help':openModal(HELP);break;

  case'sub':sub=v;render();window.scrollTo(0,0);break;
  case'back':{const b=ui.back||['home','overview'];go(b[0],b[1]);break}
  case'continue':closeModal();onContinue();break;
  case'player':closeModal();openPlayer(id);break;
  case'msg':openMsg(id);break;
  case'an-tab':ui.anTab=v;refreshAn();break;
  case'an-side':ui.anSide=+v;refreshAn();break;
  case'an-player':{const p=M&&M.E&&M.E.P.concat(M.E.old).find(q=>q.pid===id);if(p){ui.anPid=id;ui.anSide=p.s;ui.anTab='heat';refreshAn();document.querySelector('.an')?.scrollIntoView({behavior:'smooth',block:'nearest'})}break}
  case'cal-m':ui.calM=(ui.calM??null)===null?null:ui.calM;{const cur=document.querySelector('.cal-months [aria-pressed=true]');ui.calM=(cur?+cur.dataset.v:0)+ +t.dataset.d}render();break;
  case'cal-go':ui.calM=+v;render();break;
  case'p-tab':ui.pTab=v;render();break;
  case'renew':{const p=S.players[id];if(p.noTalks&&S.md<p.noTalks){toast(`${p.ln}'s agent is not ready to talk again yet`);break}openRenew(id);break}
  case'ren-y':ui.ren.years=+v;renderRenew();break;
  case'ren-r':ui.ren.role=v;renderRenew();break;
  case'ren-offer':renewOffer();break;
  case'tlist':{const p=S.players[id];p.tl=!p.tl;save();render();toast(p.tl?`${p.ln} has been transfer listed`:`${p.ln} removed from the transfer list`);break}
  case'tfocus':{const p=S.players[id];p.tf=v==='none'?null:v;save();render();break}
  case'sc-pos':ui.sc.pos=v;render();break;
  case'sc-start':S.scout=Object.assign({},ui.sc);save();render();toast('Scouts are on the road');break;
  case'sc-stop':S.scout=null;save();render();break;
  case'scout-p':(S.scoutQ=S.scoutQ||[]).includes(id)||S.scoutQ.push(id);save();render();toast('A scout will report after the next match');break;
  case'acad-up':{ensureAcademy();const k=v,cost=ACAD_COST[S.academy[k]],c=clubOf(S.user);if(c.budget<cost)break;c.budget-=cost;S.academy[k]++;save();render();toast('Academy upgraded');break}
  case'acad-promote':{unlock('grad');S.acad=S.acad.filter(x=>x!==id);const c=clubOf(S.user),p=S.players[id];c.squad.push(id);p.num=assignNum(S.user,p.pos);save();render();toast(`${p.ln} promoted to the first team`);break}
  case'acad-release':{const p=S.players[id];S.acad=S.acad.filter(x=>x!==id);delete S.players[id];save();render();toast(`${p.ln} released`);break}
  case'loan-out':loanOut(id);break;
  case'press-pre':openPress('pre');break;
  case'press-post':openPress('post');break;
  case'press-a':answerPress(+v);break;
  case'press-skip':if(ui.press&&M)M['press_'+ui.press.kind]=true;ui.press=null;closeModal();render();toast('Your assistant handled the media');break;
  case'press-done':closeModal();render();break;
  case'stp':stepApply(t.dataset.t,t.dataset.k,+t.dataset.d,null);break;
  case'stp-set':stepApply(t.dataset.t,t.dataset.k,0,+v);break;
  case'neg-sellon':ui.neg.sellOn=+v;renderNeg();break;
  case'call-q':callAsk(v);break;
  case'call-terms':{const n=ui.neg,p=S.players[n.pid];n.stage='terms';n.wage=nice(termsNeed(n,p),500);n.log.push({who:'agent',t:`Send me the offer. ${p.ln} wants ${money(nice(termsNeed(n,p),500))} a week.`});renderNeg();break}
  case'oc-open':offerCall(id);break;
  case'oc-accept':offerCallAct('accept');break;
  case'oc-counter':offerCallAct('counter');break;
  case'oc-name':offerCallAct('name');break;
  case'oc-nfs':offerCallAct('nfs');break;
  case'oc-reject':offerCallAct('reject');break;
  case'cel-skip':endCelebration();break;
  case'dd':ui.dd=ui.dd===v?null:v;renderBar();break;
  case'ddgo':{const[g,sb]=v.split('/');ui.dd=null;closeModal();go(g,sb||undefined);break}
  case'goto':{const[g,sb]=v.split('/');closeModal();go(g,sb);break}
  case'mailf':ui.mailF=v;ui.msg=null;render();break;
  case'mail-read-all':S.inbox.forEach(m=>m.read=true);save();render();renderBar();break;
  case'offer-yes':case'offer-no':{const m=S.inbox.find(x=>x.id===id),o=m&&m.action;if(!o||o.done)break;const p=S.players[o.pid];
   if(a==='offer-yes'){const why=canSell(p);if(p.club!==S.user){toast('He is no longer at the club.');break}if(why){toast(why);break}moveP(p.id,o.club,o.fee);S.fin.sales+=o.fee;logDeal(p.id,S.user,o.club,o.fee);o.done='yes';news(`${p.fn} ${p.ln} joins ${clubOf(o.club).name} from ${clubOf(S.user).name} for ${money(o.fee)}.`,'transfer',[o.club,S.user]);toast(`${p.ln} sold for ${money(o.fee)}`)}else{o.done='no';toast('Offer rejected')}
   save();closeModal();render();break}
  case'sort':{const k=t.dataset.k,cur=ui.sort[k];ui.sort[k]=[v,cur[0]===v?-cur[1]:-1];if(view==='transfers'&&sub==='search')renderSearch();else render();break}
  case'group':ui.group=v;render();break;
  case'negotiate':openNegotiation(id);break;
  case'neg-bid':negBid();break;
  case'neg-terms':negTerms();break;
  case'neg-years':ui.neg.years=+v;renderNeg();break;
  case'neg-role':ui.neg.role=v;renderNeg();break;
  case'neg-accept-counter':ui.neg.fee=ui.neg.counter;ui.neg.counter=null;negBid();break;
  case'pickComp':ui.lg=/^\d+$/.test(v)?+v:v;ui.lgMd=null;render();break;
  case'board-req':{const c=clubOf(S.user);S.boardReq=S.season;if(S.board>=62){const g=Math.round(c.budget*.2/1e5)*1e5+5e6;c.budget+=g;toast(`The board has added ${money(g)} to your transfer budget`)}else{S.board=Math.max(5,S.board-3);toast('The board turned down your request')}save();render();break}
  case'split-apply':{const c=clubOf(S.user),w=ui.split?ui.split.w:c.wageBudget,total=c.budget+c.wageBudget*WAGE_TO_FEE;c.wageBudget=w;c.budget=Math.max(0,Math.round((total-w*WAGE_TO_FEE)/1e5)*1e5);save();render();toast('Budgets updated');break}
  case'sell':sellUI(id);break;
  case'sell-yes':{const s=ui.sell;if(!s)break;const p=S.players[s.pid];moveP(s.pid,s.buyer,s.fee);S.fin.sales+=s.fee;logDeal(s.pid,S.user,s.buyer,s.fee);news(`${p.fn} ${p.ln} joins ${clubOf(s.buyer).name} from ${clubOf(S.user).name} for ${money(s.fee)}.`,'transfer',[s.buyer,S.user]);save();toast(`${p.ln} sold for ${money(s.fee)}`);ui.sell=null;go('squad');break}
  case'shortlist':{const i=S.shortlist.indexOf(id);if(i>=0)S.shortlist.splice(i,1);else S.shortlist.push(id);save();render();break}
  case'slot':ui.tSel=+t.dataset.i;render();break;
  case'assign':assignToSlot(id);break;
  case'role':tac.roles[ui.tSel??9]=v;save();render();break;
  case'ins':tac.ins[t.dataset.k]=+v;save();if(view==='match')pressOne(t);else render();break;
  case'autoxi':tac.xi=pickXI(S.user,tac.form);tac.bench=pickBench(S.user,tac.xi);save();render();toast('Best XI selected');break;
  case'md':ui.lgMd=clamp((ui.lgMd??Math.min(S.md,MDAYS-1))+ +t.dataset.d,0,MDAYS-1);render();break;
  case'kitflip':ui.kitBack=!ui.kitBack;render();break;
  case'new-season':{closeModal();endSeason();M=null;go('home');const ls=S.lastSeason;fxQueue.push(()=>awardsCeremony());
   if(ls&&(ls.champ||ls.promoted)){const rec=S.mgr.trophies.slice().reverse().find(t=>t.club===ls.club&&(ls.champ?!t.minor&&t.key&&t.key.startsWith('lg:'):t.minor));fxQueue.push(()=>celebrateTrophy(ls.champ?`${ls.league} champions`:`Promoted from ${ls.league}`,`${S.hist[0]?S.hist[0].season:seasonLabel()} · ${clubOf(ls.club).name}`,ls.club,rec))}
   {const prev=S.hist[0]&&S.hist[0].season,won=S.mgr.trophies.filter(t=>t.season===prev&&!t.minor);if(won.length)fxQueue.push(()=>paradeOverlay(won))}
   if(S.youth&&S.youth.length)fxQueue.push(()=>revealYouth(S.youth));
   if(S.offers&&S.offers.length)fxQueue.push(()=>jobsModal(S.offers,'Job offers','Your reputation is growing',false));
   if(fxQueue.length)fxQueue.shift()();else toast(`Season ${seasonLabel()} has begun`);break}
  case'kickoff':kickOff();render();break;
  case'instant':instantResult();break;
  case'match-finish':finishMatchday();break;
  case'mmode':M.mode=v;M.scan=0;M.wins=[];scanEvents();render();break;
  case'mspeed':if(M.mode==='full')M.fs=+v;else M.hs=+v;pressOne(t);break;
  case'mview':M.viewMode=v;render();break;
  case'mcam':M.camMode=v;if(VIEW)VIEW.setCam(v);pressOne(t);break;
  case'mpause':M.paused=!M.paused;t.textContent=M.paused?'Resume':'Pause';M.paused?SND.stop():SND.resume();break;
  case'mskip':endIntro();break;
  case'mskiprep':endReplay();break;
  case'msound':SND.on=!SND.on;if(SND.on){SND.init();SND.setCrowd(.4)}t.textContent=SND.on?'Sound on':'Sound off';t.setAttribute('aria-pressed',SND.on);break;
  case'mfull':{const st=$('#stage');if(document.fullscreenElement)document.exitFullscreen();else if(st&&st.requestFullscreen)st.requestFullscreen().catch(()=>toast('Full screen is not available here'));break}
  case'mtab2':M.tab2=v;pressOne(t);$('#m-side').innerHTML=v==='team'?lineupHTML():quickTacHTML();break;
  case'msel':{const i=+t.dataset.i;M.sel=M.sel===i?null:i;$('#m-side').innerHTML=lineupHTML();break}
  case'msub':{const E=M.E,tm=E.T[M.us],p=E.P[M.sel];if(p&&!p.off&&substitute(E,tm,p,id)){toast(`${S.players[id].ln} is coming on`)}M.sel=null;$('#m-side').innerHTML=lineupHTML();break}
 }
});
document.addEventListener('change',e=>{
 const k=e.target.dataset.change;if(!k)return;const v=e.target.value,tac=S&&S.user>=0?clubOf(S.user).tac:null;
 if(k==='lg'){ui.lg=+v;ui.lgMd=null;render()}
 else if(k==='form'){tac.form=v;tac.roles=defaultRoles(v);tac.xi=pickXI(S.user,v);tac.bench=pickBench(S.user,tac.xi);ui.tSel=9;save();render()}
 else if(k==='formIn'){tac.formIn=v;save();render()}
 else if(k==='formInLive'){tac.formIn=v;if(M&&M.E)setShape(M.E.T[M.us]);save()}
 else if(['trPos','trLeague','trMax','trAge','trMin','trNat'].includes(k)){ui[k]=['trPos','trLeague','trNat'].includes(k)?v:+v;renderSearch()}
 else if(k==='trExp'){ui.trExp=e.target.checked;renderSearch()}
 else if(k==='negInst'){ui.neg.inst=e.target.checked;renderNeg()}
 else if(k==='negClause'){ui.neg.clause=e.target.checked;renderNeg()}
 else if(k==='dealLeague'){ui.dealLeague=v;render()}
});
document.addEventListener('input',e=>{const k=e.target.dataset.input,v=+e.target.value;
 if(k==='neg'){const key=e.target.dataset.k;ui.neg[key]=v;const o=document.getElementById(e.target.id+'-o');if(o)o.textContent=key==='sellOn'?v+'%':money(v);negLive()}
 else if(k==='split'){const c=clubOf(S.user),total=c.budget+c.wageBudget*WAGE_TO_FEE;$('#sp-w').textContent=money(v)+'/w';$('#sp-t').textContent=money(Math.max(0,total-v*WAGE_TO_FEE))}
 else if(k==='trq'){ui.trQ=e.target.value;renderSearch()}
 else if(k==='an-pid'){ui.anPid=v;refreshAn()}
 else if(k==='sc-region'){ui.sc.region=e.target.value}
 else if(k==='sc-age'){ui.sc.age=v;const l=e.target.closest('.neg-f');if(l)l.querySelector('b').textContent=v}
 else if(k==='ren-w'){ui.ren.wage=v;const o=document.getElementById('rw-o');if(o)o.textContent=money(v)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('#modal').hidden)closeModal();
 if(e.key===' '&&view==='match'&&M&&M.phase==='live'&&!/INPUT|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();M.paused=!M.paused;M.paused?SND.stop():SND.resume();const b=$('#m-pause');if(b)b.textContent=M.paused?'Resume':'Pause'}
});
async function boot(data){
 if(data&&data.S&&data.S.slot){S=data.S;ensureCalendar();ui.mode='game';view='home';sub='overview';render();return}
 render();await migrateLegacy();await refreshMetas();if(!S)render();
}
// Write the pending save before the tab closes or is hidden (mobile browsers rarely fire unload).
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S)flushSave()});
window.addEventListener('pagehide',()=>{if(S)flushSave()});
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
// Test hook, only with #dbg in the address: jump a live match to full time and force a trophy celebration.
if(location.hash==='#dbg')window.__dg={sample(){return S.clubs.slice(0,48).map(c=>`<div style="text-align:center;color:#999;font-size:10px">${crestSVG(c,{size:64})}<div style="width:70px;margin:auto">${kitSVG(c,'home')}</div><div style="width:50px;margin:auto">${kitSVG(c,'away')}</div>${esc(c.short)} ${crestStyle(c)}</div>`).join('')},finishWithTrophy(){if(!M||M.phase!=='live')return false;M.intro=null;runToEnd(M.E);M.pt=M.E.t;M.shown=M.E.events.length;M.repQ=null;M.forceCel=true;return true}};
})();
</script>
