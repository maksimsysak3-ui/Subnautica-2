<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>BLACK MERIDIAN</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070a; color: #d8e2ea;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas#game { display: block; width: 100%; height: 100%; }
  #ui-root { position: fixed; inset: 0; pointer-events: none; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #05070a; z-index: 999; transition: opacity .6s ease;
  }
  #boot .inner { text-align: center; }
  #boot h1 {
    font-size: clamp(28px, 6vw, 64px); letter-spacing: .5em; font-weight: 500;
    text-indent: .5em; color: #e6edf3;
  }
  #boot .sub { margin-top: 14px; font-size: 12px; letter-spacing: .35em; color: #5d6f7e; }
  #boot .bar { margin: 34px auto 0; width: min(420px, 70vw); height: 2px; background: #16202a; }
  #boot .bar > i { display: block; height: 100%; width: 0%; background: #c8a355; transition: width .25s ease; }
  #boot .status { margin-top: 12px; font-size: 11px; letter-spacing: .2em; color: #46586a; height: 14px; }
  #boot.hidden { opacity: 0; pointer-events: none; }
  #fatal {
    position: fixed; inset: 0; z-index: 1000; display: none; place-items: center;
    background: #0a0406; padding: 40px;
  }
  #fatal pre {
    max-width: 900px; max-height: 70vh; overflow: auto; font-size: 12px;
    color: #ff8a8a; white-space: pre-wrap; line-height: 1.6;
  }
</style>
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="ui-root"></div>
  </div>

  <div id="boot">
    <div class="inner">
      <h1>BLACK MERIDIAN</h1>
      <div class="sub">TACTICAL OPERATIONS COMMAND</div>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="status" id="boot-status">INITIALISING</div>
    </div>
  </div>

  <div id="fatal"><pre id="fatal-msg"></pre></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
