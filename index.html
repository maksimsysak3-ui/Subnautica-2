    const a0 = (k / seg) * TAU, a1 = ((k + 1) / seg) * TAU;
    const r0 = 0.86, r1 = 1.0;
    mb.quad(
      [Math.cos(a0) * r0, 0, Math.sin(a0) * r0],
      [Math.cos(a0) * r1, 0, Math.sin(a0) * r1],
      [Math.cos(a1) * r1, 0, Math.sin(a1) * r1],
      [Math.cos(a1) * r0, 0, Math.sin(a1) * r0], [1, 1, 1], MAT.GLOW);
  }
  return mb;
}
function buildSelectionBox() {
  const mb = new MB();
  const t = 0.06;
  for (const s of [-0.5, 0.5]) {
    mb.push(); mb.translate(s, 0, 0); mb.box(t, t, 1.0, [1, 1, 1], MAT.GLOW, { bottom: true }); mb.pop();
    mb.push(); mb.translate(0, 0, s); mb.box(1.0, t, t, [1, 1, 1], MAT.GLOW, { bottom: true }); mb.pop();
  }
  return mb;
}
/* ==========================================================================
   SECTION 5B — ASSET WORKSHOP: THE ARCHITECTURE
   Every zoned building is composed by hand from masses, setbacks, cornices,
   balconies, canopies, plant rooms and roof clutter. Facade fenestration is
   resolved in the fragment shader from object-space coordinates, so a single
   instanced mesh yields hundreds of unique lit windows after dark.
   ========================================================================== */

const BCLASS = ["rlow", "rhigh", "clow", "chigh", "off", "ind"];
const CATALOG = { rlow: [], rhigh: [], clow: [], chigh: [], off: [], ind: [], farm: [], mine: [] };

/* curated wall palettes */
const WALLS = {
  house: [[0.88, 0.86, 0.80], [0.82, 0.78, 0.70], [0.74, 0.66, 0.56], [0.60, 0.40, 0.32],
  [0.86, 0.82, 0.72], [0.68, 0.72, 0.70], [0.78, 0.74, 0.62], [0.52, 0.46, 0.42]],
  roof: [[0.42, 0.24, 0.19], [0.30, 0.30, 0.32], [0.24, 0.26, 0.30], [0.36, 0.30, 0.26],
  [0.20, 0.22, 0.24], [0.46, 0.34, 0.24]],
  apt: [[0.76, 0.73, 0.68], [0.66, 0.62, 0.58], [0.58, 0.50, 0.44], [0.70, 0.66, 0.60],
  [0.50, 0.52, 0.55], [0.80, 0.76, 0.70]],
  com: [[0.84, 0.82, 0.78], [0.72, 0.70, 0.72], [0.62, 0.58, 0.60], [0.88, 0.84, 0.76]],
  off: [[0.34, 0.42, 0.50], [0.30, 0.38, 0.42], [0.40, 0.42, 0.46], [0.26, 0.32, 0.40], [0.44, 0.40, 0.36]],
  ind: [[0.62, 0.62, 0.60], [0.54, 0.56, 0.58], [0.66, 0.60, 0.50], [0.48, 0.50, 0.52]]
};

function pick(arr, r) { return arr[Math.floor(r * arr.length) % arr.length]; }

/* ---- shared detail helpers ---------------------------------------------- */
function rooftopClutter(mb, w, d, y, rnd, scale) {
  const s = scale || 1;
  const grey = [0.55, 0.56, 0.58];
  /* stair bulkhead */
  mb.push();
  mb.translate((rnd() - 0.5) * w * 0.35, y, (rnd() - 0.5) * d * 0.35);
  mb.box(2.2 * s, 2.5 * s, 2.6 * s, [0.60, 0.60, 0.59], MAT.PLAIN);
  mb.pop();
  /* plant units */
  const n = 2 + ((rnd() * 3) | 0);
  for (let k = 0; k < n; k++) {
    mb.push();
    mb.translate((rnd() - 0.5) * w * 0.72, y, (rnd() - 0.5) * d * 0.72);
    mb.rotateY(rnd() * TAU);
    const bw = (0.9 + rnd() * 1.2) * s, bh = (0.5 + rnd() * 0.7) * s, bd = (0.8 + rnd() * 1.0) * s;
    mb.box(bw, bh, bd, grey, MAT.METAL);
    mb.translate(0, bh, 0);
    mb.cylinder(bw * 0.28, bw * 0.28, 0.12 * s, 8, [0.32, 0.33, 0.35], MAT.METAL, { bottom: true });
    mb.pop();
  }
  /* vents */
  for (let k = 0; k < 3; k++) {
    mb.push();
    mb.translate((rnd() - 0.5) * w * 0.8, y, (rnd() - 0.5) * d * 0.8);
    mb.cylinder(0.24 * s, 0.24 * s, (0.6 + rnd() * 0.7) * s, 7, [0.45, 0.46, 0.48], MAT.METAL, { bottom: true });
    mb.pop();
  }
}
function parapet(mb, w, d, y, h, col) {
  const t = 0.22;
  mb.push(); mb.translate(0, y, 0);
  mb.box(w, h, t, col, MAT.PLAIN, { y0: 0 });
  mb.pop();
  mb.push(); mb.translate(0, y, 0);
  for (const s of [-1, 1]) {
    mb.push(); mb.translate(0, 0, s * (d / 2 - t / 2)); mb.box(w, h, t, col, MAT.PLAIN); mb.pop();
    mb.push(); mb.translate(s * (w / 2 - t / 2), 0, 0); mb.box(t, h, d, col, MAT.PLAIN); mb.pop();
  }
  mb.pop();
}
function cornice(mb, w, d, y, over, th, col) {
  mb.push(); mb.translate(0, y, 0);
  mb.box(w + over * 2, th, d + over * 2, col, MAT.PLAIN, { bottom: true });
  mb.pop();
}
function balconyBand(mb, w, d, y, depth, col, face) {
  /* face: 1 = +z, 2 = -z, 4 = +x, 8 = -x */
  const rail = [0.34, 0.36, 0.38];
  if (face & 1) {
    mb.push(); mb.translate(0, y, d / 2 + depth / 2);
    mb.box(w * 0.82, 0.14, depth, col, MAT.PLAIN, { bottom: true });
    mb.translate(0, 0.14, depth / 2 - 0.05);
    mb.box(w * 0.82, 0.85, 0.08, rail, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  if (face & 2) {
    mb.push(); mb.translate(0, y, -(d / 2 + depth / 2));
    mb.box(w * 0.82, 0.14, depth, col, MAT.PLAIN, { bottom: true });
    mb.translate(0, 0.14, -(depth / 2 - 0.05));
    mb.box(w * 0.82, 0.85, 0.08, rail, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  if (face & 4) {
    mb.push(); mb.translate(w / 2 + depth / 2, y, 0);
    mb.box(depth, 0.14, d * 0.82, col, MAT.PLAIN, { bottom: true });
    mb.translate(depth / 2 - 0.05, 0.14, 0);
    mb.box(0.08, 0.85, d * 0.82, rail, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  if (face & 8) {
    mb.push(); mb.translate(-(w / 2 + depth / 2), y, 0);
    mb.box(depth, 0.14, d * 0.82, col, MAT.PLAIN, { bottom: true });
    mb.translate(-(depth / 2 - 0.05), 0.14, 0);
    mb.box(0.08, 0.85, d * 0.82, rail, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
}
function entranceCanopy(mb, w, z, y, col) {
  mb.push(); mb.translate(0, y, z);
  mb.box(w, 0.20, 2.2, col, MAT.PLAIN, { bottom: true });
  for (const s of [-1, 1]) {
    mb.push(); mb.translate(s * (w / 2 - 0.25), -y + 0.0, 0.9);
    mb.box(0.16, y, 0.16, [0.42, 0.43, 0.45], MAT.METAL, { bottom: true });
    mb.pop();
  }
  mb.pop();
}
function groundRetail(mb, w, d, h, rnd) {
  /* recessed shopfront with a coloured awning and a fascia sign */
  const awn = hsl2rgb(rnd(), 0.5, 0.42);
  for (const [ax, az, rot, len] of [[0, d / 2, 0, w], [0, -d / 2, Math.PI, w], [w / 2, 0, Math.PI / 2, d], [-w / 2, 0, -Math.PI / 2, d]]) {
    if (rnd() < 0.42) continue;
    mb.push();
    mb.translate(ax, h * 0.72, az);
    mb.rotateY(rot);
    mb.translate(0, 0, 0.5);
    mb.rotateX(-0.34);
    mb.box(len * 0.66, 0.07, 1.15, awn, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  mb.push(); mb.translate(0, h * 0.96, d / 2 + 0.06);
  mb.box(w * 0.5, 0.42, 0.10, [0.92, 0.86, 0.62], MAT.GLOW, { bottom: true });
  mb.pop();
}

/* ==========================================================================
   RESIDENTIAL — LOW DENSITY
   ========================================================================== */
function makeHouse(rnd, level) {
  const mb = new MB();
  const wall = pick(WALLS.house, rnd());
  const roofc = pick(WALLS.roof, rnd());
  const floors = level <= 1 ? 1 : (level >= 4 ? 2 : (rnd() < 0.5 ? 1 : 2));
  const fh = 2.95;
  const w = 5.2 + rnd() * 1.1 + level * 0.16;
  const d = 5.0 + rnd() * 1.2 + level * 0.14;
  const h = floors * fh;

  /* plot: lawn, path, kerbside driveway */
  mb.push(); mb.translate(0, 0.02, 0);
  mb.box(7.6, 0.05, 7.6, [0.30, 0.40, 0.22], MAT.PLAIN);
  mb.pop();
  mb.push(); mb.translate(-1.0, 0.05, 2.6);
  mb.box(1.2, 0.04, 3.0, [0.62, 0.60, 0.56], MAT.PLAIN);
  mb.pop();
  if (level >= 2) {
    mb.push(); mb.translate(2.05, 0.05, 2.2);
    mb.box(2.5, 0.04, 4.0, [0.28, 0.28, 0.29], MAT.PLAIN);
    mb.pop();
  }

  /* main mass */
  mb.push(); mb.translate(0, 0.08, -0.4);
  mb.box(w + 0.3, 0.34, d + 0.3, [0.52, 0.50, 0.47], MAT.PLAIN);   /* plinth */
  mb.translate(0, 0.34, 0);
  mb.box(w, h, d, wall, MAT.FACADE, { noTop: true });
  /* roof */
  mb.translate(0, h, 0);
  const style = rnd();
  if (style < 0.45) mb.gableRoof(w, 1.9 + rnd() * 0.8, d, roofc, MAT.PLAIN, 0.38);
  else if (style < 0.82) mb.hipRoof(w, 1.7 + rnd() * 0.7, d, roofc, MAT.PLAIN, 0.36, 0.4);
  else { mb.box(w + 0.5, 0.36, d + 0.5, roofc, MAT.PLAIN, { bottom: true }); }
  mb.pop();

  /* chimney */
  if (rnd() < 0.7) {
    mb.push(); mb.translate(w * 0.28, 0.42 + h, -0.4 + d * 0.16);
    mb.box(0.62, 1.7 + rnd() * 0.7, 0.62, pick([[0.46, 0.34, 0.30], [0.55, 0.53, 0.50]], rnd()), MAT.PLAIN);
    mb.translate(0, 1.7 + rnd() * 0.7, 0);
    mb.box(0.76, 0.12, 0.76, [0.35, 0.34, 0.33], MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  /* porch and door */
  mb.push(); mb.translate(-1.0, 0.42, -0.4 + d / 2 + 0.02);
  mb.box(1.0, 2.2, 0.10, [0.36, 0.26, 0.20], MAT.PLAIN, { bottom: true });
  mb.pop();
  if (level >= 2 || rnd() < 0.5) {
    mb.push(); mb.translate(-1.0, 0.42, -0.4 + d / 2 + 0.75);
    mb.box(2.6, 0.16, 1.6, wall, MAT.PLAIN, { bottom: true, y0: 2.5 });
    for (const s of [-1, 1]) {
      mb.push(); mb.translate(s * 1.1, 0, 0.65);
      mb.box(0.14, 2.5, 0.14, [0.86, 0.84, 0.80], MAT.PLAIN, { bottom: true });
      mb.pop();
    }
    mb.pop();
  }
  /* garage */
  if (level >= 3) {
    mb.push(); mb.translate(w / 2 + 1.35, 0.34, 0.5);
    mb.box(2.7, 2.5, 4.2, wall, MAT.PLAIN);
    mb.translate(0, 2.5, 0);
    mb.gableRoof(2.7, 0.75, 4.2, roofc, MAT.PLAIN, 0.24);
    mb.pop();
    mb.push(); mb.translate(w / 2 + 1.35, 0.4, 2.62);
    mb.box(2.2, 2.0, 0.10, [0.72, 0.72, 0.70], MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  /* garden: hedge, shrubs, fence */
  for (let k = 0; k < 4 + ((rnd() * 4) | 0); k++) {
    const gx = (rnd() - 0.5) * 6.6, gz = 1.4 + rnd() * 2.4;
    mb.push(); mb.translate(gx, 0.06, gz); mb.scale(1, 0.72, 1);
    mb.sphere(0.34 + rnd() * 0.3, 6, 4, tone(PAL.foliageC, rnd(), 0.25), MAT.FOLIAGE);
    mb.pop();
  }
  if (rnd() < 0.55) {
    for (const sx of [-1, 1]) {
      mb.push(); mb.translate(sx * 3.7, 0.04, 0);
      mb.box(0.10, 0.95, 7.4, [0.72, 0.70, 0.66], MAT.PLAIN, { bottom: true });
      mb.pop();
    }
  }
  if (level >= 4 && rnd() < 0.6) {
    /* rear extension */
    mb.push(); mb.translate(0, 0.34, -0.4 - d / 2 - 1.2);
    mb.box(w * 0.6, fh, 2.4, wall, MAT.FACADE, { noTop: true });
    mb.translate(0, fh, 0);
    mb.box(w * 0.6 + 0.3, 0.22, 2.6, roofc, MAT.PLAIN, { bottom: true });
    mb.pop();
  }
  return { mb, h: h + 2.6, floors, lot: 1 };
}

/* ==========================================================================
   RESIDENTIAL — HIGH DENSITY
   ========================================================================== */
function makeApartment(rnd, level) {
  const mb = new MB();
  const wall = pick(WALLS.apt, rnd());
  const accent = shadeRGB(wall, 0.72);
  const floors = [4, 6, 9, 13, 18][clamp(level - 1, 0, 4)] + ((rnd() * 3) | 0);
  const fh = 3.05;
  const w = 11.5 + rnd() * 2.2;
  const d = 11.0 + rnd() * 2.4;
  const podium = 4.2;
  const bodyH = floors * fh;

  /* plot deck */
  mb.push(); mb.translate(0, 0.03, 0);
  mb.box(15.4, 0.06, 15.4, [0.46, 0.47, 0.46], MAT.PLAIN);
  mb.pop();
  for (let k = 0; k < 6; k++) {
    mb.push();
    mb.translate((rnd() - 0.5) * 14, 0.06, (rnd() - 0.5) * 14);
    mb.scale(1, 0.7, 1);
    mb.sphere(0.42 + rnd() * 0.4, 6, 4, tone(PAL.foliageB, rnd(), 0.24), MAT.FOLIAGE);
    mb.pop();
  }

  /* podium */
  mb.push(); mb.translate(0, 0, 0);
  mb.box(w + 1.6, podium, d + 1.6, accent, MAT.FACADE, { noTop: true });
  mb.translate(0, podium, 0);
  mb.box(w + 2.0, 0.30, d + 2.0, shadeRGB(accent, 0.8), MAT.PLAIN, { bottom: true });
  mb.pop();

  /* tower with a setback partway up */
  const setAt = Math.floor(floors * (0.55 + rnd() * 0.25));
  const lower = setAt * fh;
  const upper = bodyH - lower;
  mb.push(); mb.translate(0, podium + 0.30, 0);
  mb.box(w, lower, d, wall, MAT.FACADE, { noTop: true });
  mb.pop();
  mb.push(); mb.translate(-w * 0.06, podium + 0.30 + lower, d * 0.04);
  mb.box(w * 0.84, upper, d * 0.86, wall, MAT.FACADE, { noTop: true });
  mb.pop();

  /* stair / lift core expressed on one flank */
  mb.push(); mb.translate(w / 2 - 0.6, podium + 0.30, -d * 0.18);
  mb.box(2.4, bodyH + 1.6, 3.0, accent, MAT.PLAIN);
  mb.pop();

  /* balconies */
  const bcol = shadeRGB(wall, 1.06);
  for (let f = 1; f < setAt; f++) {
    balconyBand(mb, w, d, podium + 0.30 + f * fh, 1.25, bcol, rnd() < 0.5 ? 1 : 5);
  }
  for (let f = setAt + 1; f < floors; f++) {
    balconyBand(mb, w * 0.84, d * 0.86, podium + 0.30 + f * fh, 1.15, bcol, 1);
  }

  /* crowns */
  parapet(mb, w * 0.84 + 0.4, d * 0.86 + 0.4, podium + 0.30 + bodyH, 1.0, accent);
  cornice(mb, w * 0.84, d * 0.86, podium + 0.30 + lower, 0.36, 0.26, accent);
  rooftopClutter(mb, w * 0.7, d * 0.7, podium + 0.30 + bodyH, rnd, 1.0);
  /* water tank on a frame */
  mb.push();
  mb.translate((rnd() - 0.5) * 3, podium + 0.30 + bodyH, (rnd() - 0.5) * 3);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    mb.push(); mb.translate(sx * 0.7, 0, sz * 0.7); mb.box(0.13, 1.7, 0.13, [0.4, 0.4, 0.42], MAT.METAL, { bottom: true }); mb.pop();
  }
  mb.translate(0, 1.7, 0);
  mb.cylinder(1.05, 1.05, 1.5, 10, [0.52, 0.50, 0.46], MAT.METAL, { bottom: true });
  mb.pop();

  entranceCanopy(mb, 5.0, d / 2 + 1.9, 3.2, accent);
  if (level >= 3) groundRetail(mb, w + 1.6, d + 1.6, podium, rnd);
  return { mb, h: podium + bodyH + 3.0, floors, lot: 2 };
}

/* ==========================================================================
   COMMERCIAL — LOW DENSITY
   ========================================================================== */
function makeShop(rnd, level) {
  const mb = new MB();
  const wall = pick(WALLS.com, rnd());
  const floors = level <= 2 ? 1 : (level <= 4 ? 2 : 3);
  const fh = 3.5;
  const w = 6.0 + rnd() * 0.9;
  const d = 5.6 + rnd() * 1.0;
  const h = floors * fh;

  mb.push(); mb.translate(0, 0.02, 0);
  mb.box(7.7, 0.05, 7.7, [0.50, 0.50, 0.49], MAT.PLAIN);
  mb.pop();
  /* forecourt paving with a kerb line */
  mb.push(); mb.translate(0, 0.05, 3.0);
  mb.box(7.7, 0.03, 1.6, [0.58, 0.58, 0.56], MAT.PLAIN);
  mb.pop();

  mb.push(); mb.translate(0, 0.06, -0.3);
  mb.box(w, h, d, wall, MAT.FACADE, { noTop: true });
  /* fascia band above the shopfront */
  mb.translate(0, 3.05, 0);
  mb.box(w + 0.24, 0.62, d + 0.24, shadeRGB(wall, 0.62), MAT.PLAIN, { bottom: true });
  mb.pop();

  /* flat roof with parapet and plant */
  mb.push(); mb.translate(0, 0.06 + h, -0.3);
  mb.box(w + 0.3, 0.30, d + 0.3, shadeRGB(wall, 0.7), MAT.PLAIN, { bottom: true });
  mb.pop();
  parapet(mb, w + 0.3, d + 0.3, 0.36 + h, 0.55, shadeRGB(wall, 0.66));
  rooftopClutter(mb, w * 0.7, d * 0.7, 0.36 + h, rnd, 0.8);

  /* awning over the pavement */
  const awn = hsl2rgb(rnd(), 0.55, 0.40);
  mb.push(); mb.translate(0, 3.0, -0.3 + d / 2 + 0.7);
  mb.rotateX(-0.30);
  mb.box(w * 0.86, 0.08, 1.5, awn, MAT.PLAIN, { bottom: true });
  mb.pop();
  /* projecting sign */
  mb.push(); mb.translate(w / 2 - 0.4, 3.9, -0.3 + d / 2 + 0.05);
  mb.box(0.10, 1.1, 1.4, [0.9, 0.84, 0.58], MAT.GLOW, { bottom: true });
  mb.pop();
  /* fascia lettering plate */
  mb.push(); mb.translate(0, 3.22, -0.3 + d / 2 + 0.16);
  mb.box(w * 0.72, 0.44, 0.08, hsl2rgb(rnd(), 0.6, 0.5), MAT.GLOW, { bottom: true });
  mb.pop();
  /* bollards and a bin */
  for (const s of [-1, 1]) {
    mb.push(); mb.translate(s * 2.4, 0.05, 3.2);
    mb.cylinder(0.11, 0.10, 0.85, 7, [0.30, 0.31, 0.33], MAT.METAL, { bottom: true });
    mb.pop();
  }
  mb.push(); mb.translate(2.9, 0.05, 2.4);
  mb.cylinder(0.34, 0.30, 0.95, 8, [0.26, 0.30, 0.28], MAT.PLAIN, { bottom: true });
  mb.pop();
  if (level >= 4) {
    mb.push(); mb.translate(0, 0.06 + fh, -0.3 + d / 2 + 0.6);
    balconyBand(mb, w, d, 0, 1.0, shadeRGB(wall, 1.05), 1);
    mb.pop();
  }
  return { mb, h: h + 1.4, floors, lot: 1 };
}

/* ==========================================================================
   COMMERCIAL — HIGH DENSITY (mixed use, hotels, department stores)
   ========================================================================== */
function makeCommercialTower(rnd, level) {
  const mb = new MB();
  const wall = pick(WALLS.com, rnd());
  const glass = pick([PAL.glassBlue, PAL.glassGreen, PAL.glassBronze], rnd());
  const floors = [4, 6, 9, 13, 18][clamp(level - 1, 0, 4)] + ((rnd() * 3) | 0);
  const fh = 3.6;
  const w = 12.0 + rnd() * 2.0, d = 11.4 + rnd() * 2.0;
  const podiumH = 7.6;
  const bodyH = floors * fh;
  const curtain = rnd() < 0.55;

  mb.push(); mb.translate(0, 0.03, 0);
  mb.box(15.4, 0.06, 15.4, [0.52, 0.52, 0.51], MAT.PLAIN);
  mb.pop();

  /* two-storey retail podium, fully glazed */
  mb.push();
  mb.box(w + 2.6, podiumH, d + 2.6, glass, MAT.CURTAIN, { noTop: true });
  mb.translate(0, podiumH, 0);
  mb.box(w + 3.0, 0.42, d + 3.0, shadeRGB(wall, 0.66), MAT.PLAIN, { bottom: true });
  mb.pop();
  groundRetail(mb, w + 2.6, d + 2.6, podiumH * 0.5, rnd);

  /* tower */
  mb.push(); mb.translate(0, podiumH + 0.42, 0);
  if (curtain) mb.chamferBox(w, bodyH, d, 0.9, glass, MAT.CURTAIN);
  else mb.box(w, bodyH, d, wall, MAT.FACADE, { noTop: true });
  mb.pop();

  /* vertical fin expressing the circulation core */
  mb.push(); mb.translate(-w / 2 - 0.25, podiumH + 0.42, 0);
  mb.box(0.65, bodyH + 2.2, d * 0.5, shadeRGB(wall, 0.55), MAT.PLAIN);
  mb.pop();

  /* crown, signage and mast */
  const topY = podiumH + 0.42 + bodyH;
  parapet(mb, w + 0.5, d + 0.5, topY, 1.3, shadeRGB(wall, 0.6));
  cornice(mb, w, d, topY, 0.5, 0.34, shadeRGB(wall, 0.7));
  rooftopClutter(mb, w * 0.7, d * 0.7, topY, rnd, 1.1);
  mb.push(); mb.translate(0, topY + 1.3, d / 2 - 0.2);
  mb.box(w * 0.62, 1.5, 0.22, hsl2rgb(rnd(), 0.62, 0.55), MAT.GLOW, { bottom: true });
  mb.pop();
  mb.push(); mb.translate(w * 0.28, topY + 1.3, 0);
  mb.cylinder(0.14, 0.08, 5.5 + rnd() * 4, 7, [0.5, 0.51, 0.53], MAT.METAL, { bottom: true });
  mb.translate(0, 5.5 + rnd() * 4, 0);
  mb.box(0.3, 0.3, 0.3, [1.0, 0.18, 0.14], MAT.LAMP, { bottom: true });
  mb.pop();
  entranceCanopy(mb, 6.4, d / 2 + 2.4, 4.2, shadeRGB(wall, 0.6));
  return { mb, h: topY + 6, floors, lot: 2 };
}

/* ==========================================================================
   OFFICE — the skyline makers
   ========================================================================== */
function makeOfficeTower(rnd, level) {
  const mb = new MB();
  const glass = pick([PAL.glassBlue, PAL.glassGreen, PAL.glassBronze, [0.22, 0.30, 0.38]], rnd());
  const stone = pick(WALLS.off, rnd());
  const floors = [5, 8, 13, 19, 28][clamp(level - 1, 0, 4)] + ((rnd() * 4) | 0);
  const fh = 3.9;
  const bodyH = floors * fh;
  const w = 11.5 + rnd() * 2.6, d = 11.0 + rnd() * 2.6;
  const form = rnd();

  /* plaza with planters and a water feature */
  mb.push(); mb.translate(0, 0.03, 0);
  mb.box(15.6, 0.06, 15.6, [0.60, 0.60, 0.59], MAT.PLAIN);
  mb.pop();
  for (let k = 0; k < 3; k++) {
    mb.push();
    mb.translate((rnd() - 0.5) * 13, 0.06, 5.0 + (rnd() - 0.5) * 3);
    mb.box(1.8, 0.5, 1.8, [0.48, 0.48, 0.47], MAT.PLAIN);
    mb.translate(0, 0.5, 0); mb.scale(1, 0.7, 1);
    mb.sphere(0.85, 6, 4, tone(PAL.foliageB, rnd(), 0.2), MAT.FOLIAGE);
    mb.pop();
  }
  mb.push(); mb.translate(4.6, 0.06, -4.4);
  mb.cylinder(1.9, 1.9, 0.42, 14, [0.55, 0.56, 0.56], MAT.PLAIN);
  mb.translate(0, 0.42, 0);
  mb.cylinder(1.7, 1.7, 0.05, 14, [0.13, 0.32, 0.40], MAT.PLAIN, { bottom: true });
  mb.pop();

  /* base — a taller, expressed lobby */
  const baseH = 6.4;
  mb.push();
  mb.box(w + 2.2, baseH, d + 2.2, stone, MAT.CURTAIN, { noTop: true });
  mb.translate(0, baseH, 0);
  mb.box(w + 2.7, 0.5, d + 2.7, shadeRGB(stone, 0.62), MAT.PLAIN, { bottom: true });
  mb.pop();
  /* lobby colonnade */
  for (let k = -2; k <= 2; k++) {
    mb.push(); mb.translate(k * ((w + 2.2) / 5), 0, (d + 2.2) / 2 + 0.6);
    mb.box(0.42, baseH, 0.42, shadeRGB(stone, 0.8), MAT.PLAIN, { bottom: true });
    mb.pop();
  }

  const y0 = baseH + 0.5;
  if (form < 0.34) {
    /* stepped: three diminishing masses */
    const seg = [0.46, 0.34, 0.20];
    let y = y0, sw = w, sd = d;
    for (let k = 0; k < 3; k++) {
      const hh = bodyH * seg[k];
      mb.push(); mb.translate(0, y, 0);
      mb.chamferBox(sw, hh, sd, 0.7, glass, MAT.CURTAIN);
      mb.pop();
      cornice(mb, sw, sd, y + hh, 0.30, 0.26, shadeRGB(stone, 0.7));
      y += hh; sw *= 0.80; sd *= 0.80;
    }
    rooftopClutter(mb, sw * 0.7, sd * 0.7, y, rnd, 1.0);
    mb.push(); mb.translate(0, y, 0);
    mb.cylinder(0.5, 0.16, 10 + rnd() * 9, 8, [0.55, 0.56, 0.58], MAT.METAL, { bottom: true });
    mb.pop();
    mb.push(); mb.translate(0, y + 10 + rnd() * 9, 0);
    mb.box(0.34, 0.34, 0.34, [1.0, 0.2, 0.15], MAT.LAMP, { bottom: true });
    mb.pop();
    return { mb, h: y + 22, floors, lot: 2 };
  } else if (form < 0.68) {
    /* slab with a slit and a sculpted top */
    mb.push(); mb.translate(0, y0, 0);
    mb.chamferBox(w, bodyH, d, 0.6, glass, MAT.CURTAIN);
    mb.pop();
    for (const s of [-1, 1]) {
      mb.push(); mb.translate(s * (w / 2 + 0.18), y0, 0);
      mb.box(0.5, bodyH + 3.0, d * 0.9, shadeRGB(stone, 0.55), MAT.PLAIN);
      mb.pop();
    }
    /* horizontal shadow bands every four floors */
    for (let f = 4; f < floors; f += 4) {
      cornice(mb, w, d, y0 + f * fh, 0.22, 0.16, shadeRGB(stone, 0.5));
    }
    const topY = y0 + bodyH;
    mb.push(); mb.translate(0, topY, 0);
    mb.box(w * 0.9, 3.6, d * 0.9, shadeRGB(stone, 0.6), MAT.PLAIN);
    mb.pop();
    rooftopClutter(mb, w * 0.6, d * 0.6, topY + 3.6, rnd, 1.1);
    parapet(mb, w * 0.9, d * 0.9, topY + 3.6, 1.0, shadeRGB(stone, 0.5));
    mb.push(); mb.translate(-w * 0.24, topY + 3.6, 0);
    mb.lattice(9 + rnd() * 7, 0.42, 5, [0.5, 0.5, 0.52], MAT.METAL);
    mb.pop();
    mb.push(); mb.translate(-w * 0.24, topY + 3.6 + 9 + rnd() * 7, 0);
    mb.box(0.3, 0.3, 0.3, [1.0, 0.2, 0.15], MAT.LAMP, { bottom: true });
    mb.pop();
    return { mb, h: topY + 18, floors, lot: 2 };
  }
  /* cylindrical / faceted tower */
  const r = Math.min(w, d) * 0.55;
  mb.push(); mb.translate(0, y0, 0);
  mb.cylinder(r, r * 0.94, bodyH, 16, glass, MAT.CURTAIN, { smooth: false });
  mb.pop();
  for (let f = 6; f < floors; f += 6) {
    mb.push(); mb.translate(0, y0 + f * fh, 0);
    mb.cylinder(r * 1.03, r * 1.03, 0.30, 16, shadeRGB(stone, 0.55), MAT.PLAIN, { smooth: false, bottom: true });
    mb.pop();
  }
  const topY2 = y0 + bodyH;
  mb.push(); mb.translate(0, topY2, 0);
  mb.cylinder(r * 0.94, r * 0.62, 4.4, 16, shadeRGB(stone, 0.62), MAT.PLAIN, { smooth: false });
  mb.translate(0, 4.4, 0);
  mb.cylinder(0.4, 0.12, 12 + rnd() * 8, 8, [0.56, 0.57, 0.6], MAT.METAL, { bottom: true });
  mb.pop();
  mb.push(); mb.translate(0, topY2 + 4.4 + 12 + rnd() * 8, 0);
  mb.box(0.34, 0.34, 0.34, [1.0, 0.2, 0.15], MAT.LAMP, { bottom: true });
  mb.pop();
  return { mb, h: topY2 + 24, floors, lot: 2 };
}

/* ==========================================================================
   INDUSTRY
   ========================================================================== */
function makeIndustry(rnd, level) {
  const mb = new MB();
  const wall = pick(WALLS.ind, rnd());
  const trim = pick([[0.30, 0.42, 0.55], [0.55, 0.34, 0.22], [0.35, 0.45, 0.36]], rnd());
  const smoke = [];
  const W = 13.2, D = 12.6;

  /* yard */
  mb.push(); mb.translate(0, 0.03, 0);
  mb.box(15.5, 0.06, 15.5, [0.32, 0.32, 0.33], MAT.PLAIN);
  mb.pop();
  /* perimeter fence */
  for (const s of [-1, 1]) {
    mb.push(); mb.translate(s * 7.7, 0.06, 0); mb.box(0.09, 2.0, 15.4, [0.42, 0.44, 0.46], MAT.METAL, { bottom: true }); mb.pop();
    mb.push(); mb.translate(0, 0.06, s * 7.7); mb.box(15.4, 2.0, 0.09, [0.42, 0.44, 0.46], MAT.METAL, { bottom: true }); mb.pop();
  }

  if (level <= 1) {
    /* light industrial shed */
    const h = 5.6;
    mb.push(); mb.translate(0, 0.06, -1.0);
    mb.box(W, h, D * 0.72, wall, MAT.FACADE, { noTop: true });
    mb.translate(0, h, 0);
    mb.gableRoof(W, 1.5, D * 0.72, [0.40, 0.42, 0.44], MAT.METAL, 0.35);
    mb.pop();
    /* roller doors */
    for (const x of [-3.4, 0, 3.4]) {
      mb.push(); mb.translate(x, 0.08, -1.0 + D * 0.36 + 0.06);
      mb.box(2.5, 3.4, 0.12, trim, MAT.PLAIN, { bottom: true });
      mb.pop();
    }
    /* loading dock and pallets */
    mb.push(); mb.translate(0, 0.06, 4.6); mb.box(W, 0.9, 2.6, [0.42, 0.42, 0.43], MAT.PLAIN); mb.pop();
    for (let k = 0; k < 5; k++) {
      mb.push();
      mb.translate((rnd() - 0.5) * 11, 0.96, 3.6 + rnd() * 1.4);
      mb.rotateY(rnd() * 0.6);
      mb.box(1.1, 0.9, 1.1, tone([0.55, 0.42, 0.28], rnd(), 0.25), MAT.PLAIN, { bottom: true });
      mb.pop();
    }
    return { mb, h: h + 2.4, floors: 1, lot: 2, smoke };
  }

  /* heavier plant: sawtooth hall, silos, stack, tanks, pipe rack */
  const hallH = level >= 3 ? 9.2 : 7.4;
  mb.push(); mb.translate(-1.4, 0.06, -1.2);
  mb.box(W * 0.82, hallH, D * 0.72, wall, MAT.FACADE, { noTop: true });
  mb.pop();
  /* sawtooth roof: alternating slopes with north-light glazing */
  const bays = 4;
  for (let k = 0; k < bays; k++) {
    const bw = (W * 0.82) / bays;
    const x = -1.4 - (W * 0.82) / 2 + bw * (k + 0.5);
    mb.push(); mb.translate(x, 0.06 + hallH, -1.2);
    mb.rotateX(-0.42);
    mb.box(bw * 0.98, 0.22, D * 0.78, [0.40, 0.42, 0.44], MAT.METAL, { bottom: true });
    mb.pop();
    mb.push(); mb.translate(x + bw * 0.42, 0.06 + hallH + 0.4, -1.2);
    mb.box(bw * 0.18, 1.5, D * 0.72, [0.35, 0.48, 0.55], MAT.VGLASS, { bottom: true });
    mb.pop();
  }
  /* silos */
  for (let k = 0; k < 3; k++) {
    const sx = 4.4 + (k % 2) * 2.9, sz = -5.2 + Math.floor(k / 2) * 3.2;
    mb.push(); mb.translate(sx, 0.06, sz);
    mb.cylinder(1.35, 1.35, 9.5 + rnd() * 2.5, 12, [0.72, 0.72, 0.70], MAT.METAL, { bottom: true });
    mb.translate(0, 9.5 + rnd() * 2.5, 0);
    mb.cylinder(1.35, 0.2, 1.4, 12, [0.58, 0.58, 0.56], MAT.METAL);
    mb.pop();
  }
  /* chimney with a smoke source */
  const chH = level >= 3 ? 22 : 15;
  mb.push(); mb.translate(5.6, 0.06, 4.4);
  mb.cylinder(1.35, 0.95, chH, 12, [0.66, 0.62, 0.58], MAT.PLAIN, { bottom: true });
  for (let k = 1; k < 4; k++) {
    mb.push(); mb.translate(0, (chH * k) / 4, 0);
    mb.cylinder(1.28 - k * 0.1, 1.28 - k * 0.1, 0.4, 12, [0.52, 0.30, 0.24], MAT.PLAIN);
    mb.pop();
  }
  mb.translate(0, chH, 0);
  mb.cylinder(1.0, 1.0, 0.5, 12, [0.30, 0.30, 0.30], MAT.PLAIN);
  mb.pop();
  smoke.push({ x: 5.6, y: chH + 0.8, z: 4.4, r: 0.9, rate: 1.0 });
  /* storage tanks */
  for (let k = 0; k < 2; k++) {
    mb.push(); mb.translate(-5.8 + k * 3.4, 0.06, 5.4);
    mb.cylinder(1.6, 1.6, 3.2, 12, [0.60, 0.62, 0.60], MAT.METAL, { bottom: true });
    mb.translate(0, 3.2, 0);
    mb.sphere(1.6, 12, 5, [0.56, 0.58, 0.56], MAT.METAL, 0, 0.5);
    mb.pop();
  }
  /* pipe rack */
  mb.push(); mb.translate(0, 4.2, 6.6);
  for (const yy of [0, 0.5]) {
    mb.push(); mb.translate(0, yy, 0); mb.rotateZ(Math.PI / 2);
    mb.cylinder(0.20, 0.20, 12.0, 8, [0.62, 0.60, 0.55], MAT.METAL, { y0: -6.0 });
    mb.pop();
  }
  mb.pop();
  for (const px of [-5, 0, 5]) {
    mb.push(); mb.translate(px, 0.06, 6.6); mb.box(0.24, 4.2, 0.24, [0.5, 0.5, 0.5], MAT.METAL, { bottom: true }); mb.pop();
  }
  /* office annex */
  mb.push(); mb.translate(-5.0, 0.06, 5.6);
  mb.box(4.6, 6.2, 3.4, trim, MAT.FACADE, { noTop: true });
  mb.translate(0, 6.2, 0); mb.box(5.0, 0.26, 3.8, [0.36, 0.37, 0.38], MAT.PLAIN, { bottom: true });
  mb.pop();
  if (level >= 3) {
    smoke.push({ x: 2.0, y: hallH + 2.4, z: -1.2, r: 0.6, rate: 0.5 });
    mb.push(); mb.translate(2.0, 0.06 + hallH, -1.2);
    mb.cylinder(0.55, 0.5, 2.4, 9, [0.5, 0.5, 0.5], MAT.METAL, { bottom: true });
    mb.pop();
  }
  return { mb, h: chH + 3, floors: 2, lot: 2, smoke };
}

/* ==========================================================================

function makeFarm(rnd) {

function makeMine(rnd) {

  for (let k = 0; k < 3; k++) {

    mb.pop();
  }

  mb.push(); mb.translate(4.6, 0.06, -4.2);

  mb.translate(0, 11.5, 0);
  mb.rotateZ(Math.PI / 2);
  mb.cylinder(1.5, 1.5, 0.4, 12, [0.34, 0.35, 0.36], MAT.METAL, { bottom: true });

  /* conveyor */
  mb.push(); mb.translate(0.4, 3.4, -1.0); mb.rotateZ(0.28);
  mb.box(9.0, 0.5, 1.2, [0.46, 0.46, 0.46], MAT.METAL, { bottom: true });

  /* spoil heaps */
  for (let k = 0; k < 3; k++) {

  mb.push(); mb.translate(-5.4, 0.06, -5.6);
  mb.box(5.4, 5.2, 4.6, [0.56, 0.56, 0.54], MAT.FACADE, { noTop: true });
  mb.translate(0, 5.2, 0); mb.box(5.8, 0.24, 5.0, [0.38, 0.39, 0.40], MAT.PLAIN, { bottom: true });
  mb.pop();
  return { mb, h: 13, floors: 1, lot: 2, smoke: [{ x: -5.4, y: 6.2, z: -5.6, r: 0.5, rate: 0.35 }] };
}

/* ==========================================================================
   CATALOG ASSEMBLY
   ========================================================================== */
function buildCatalog(onStep) {
  const VARIANTS = 3;
  const gens = {
    rlow: makeHouse, rhigh: makeApartment, clow: makeShop,
    chigh: makeCommercialTower, off: makeOfficeTower, ind: makeIndustry
  };
  let seedBase = 1000;
  for (const cls of BCLASS) {
    for (let lv = 1; lv <= 5; lv++) {
      if (cls === "ind" && lv > 3) { CATALOG.ind[lv - 1] = CATALOG.ind[2]; continue; }
      const list = [];
      for (let v = 0; v < VARIANTS; v++) {
        const rnd = mulberry32(seedBase++);
        const out = gens[cls](rnd, lv);
        const name = cls + lv + "_" + v;
        regMesh(name, out.mb);
        list.push({ name, h: out.h, floors: out.floors, lot: out.lot, smoke: out.smoke || [] });
      }
      CATALOG[cls][lv - 1] = list;
      if (onStep) onStep();
    }
  }
  for (let v = 0; v < 2; v++) {
    let out = makeFarm(mulberry32(7000 + v));
    regMesh("farm_" + v, out.mb);
    CATALOG.farm.push({ name: "farm_" + v, h: out.h, floors: 1, lot: 2, smoke: out.smoke });
    out = makeMine(mulberry32(7100 + v));
    regMesh("mine_" + v, out.mb);
    CATALOG.mine.push({ name: "mine_" + v, h: out.h, floors: 1, lot: 2, smoke: out.smoke });
  }
  if (onStep) onStep();
}
/* ==========================================================================
   SECTION 5C — ASSET WORKSHOP: CIVIC WORKS
   Power, water, waste, safety, health, education, parks and the landmarks.
   Each is a distinct hand-modelled structure with its own footprint.

/* a paved lot with kerb, used as the base of every civic plot */
function civicPad(mb, w, d, col, kerb) {
  mb.push(); mb.translate(0, 0.02, 0);
  mb.box(w, 0.06, d, col || [0.54, 0.54, 0.53], MAT.PLAIN);
  mb.pop();
  if (kerb !== false) {
    for (const s of [-1, 1]) {
      mb.push(); mb.translate(s * (w / 2 - 0.15), 0.02, 0); mb.box(0.3, 0.14, d, [0.62, 0.62, 0.60], MAT.PLAIN); mb.pop();
      mb.push(); mb.translate(0, 0.02, s * (d / 2 - 0.15)); mb.box(w, 0.14, 0.3, [0.62, 0.62, 0.60], MAT.PLAIN); mb.pop();
    }
  }
}
function parkedCars(mb, x, z, n, dir, rnd) {
  for (let k = 0; k < n; k++) {
    mb.push();
    mb.translate(x + (dir === 0 ? k * 2.6 : 0), 0.08, z + (dir === 0 ? 0 : k * 2.6));
    mb.rotateY(dir === 0 ? 0 : Math.PI / 2);
    const c = hsl2rgb(rnd(), 0.18 + rnd() * 0.35, 0.30 + rnd() * 0.45);
    mb.box(1.75, 0.72, 4.2, c, MAT.PAINT, { bottom: true });
    mb.translate(0, 0.72, -0.2);
    mb.box(1.55, 0.52, 2.1, [0.10, 0.13, 0.17], MAT.VGLASS, { bottom: true });
    mb.pop();
  }
}
function flagPole(mb, x, z, h, col) {
  mb.push(); mb.translate(x, 0.06, z);
  mb.cylinder(0.10, 0.07, h, 7, [0.72, 0.72, 0.70], MAT.METAL, { bottom: true });
  mb.translate(0.02, h - 1.4, 0);
  mb.box(0.04, 0.85, 1.35, col || [0.72, 0.20, 0.20], MAT.PLAIN, { bottom: true });
  mb.pop();
}
function treeRow(mb, x0, z0, dx, dz, n, rnd) {
  for (let k = 0; k < n; k++) {
    mb.push();
    mb.translate(x0 + dx * k, 0.06, z0 + dz * k);
    mb.cylinder(0.18, 0.13, 2.2, 6, PAL.trunk, MAT.PLAIN, { bottom: true });
    mb.translate(0, 2.6, 0); mb.scale(1, 0.85, 1);
    mb.sphere(1.1 + rnd() * 0.3, 7, 5, tone(PAL.foliageB, rnd(), 0.2), MAT.FOLIAGE);
    mb.pop();
  }
}

/* ---------------- POWER ---------------- */
function makeCoalPlant(rnd) {
  const mb = new MB(), smoke = [];
  civicPad(mb, 32, 24, [0.36, 0.36, 0.36]);
  /* turbine hall */

  City.stats = { built: 0, demolished: 0, roadsKm: 0, maxPop: 0, fires: 0, crimes: 0 };
  City.history = { pop: [], money: [], happy: [], traffic: [], income: [], expense: [] };
  for (const k of POLICY_DEFS) City.policies[k.key] = false;
  const layers = ["road", "mask", "zone", "dens", "pline", "powered", "watered"];
  for (const l of layers) City[l].fill(0);
  City.occ.fill(-1);
  City.netId.fill(-1);
  for (const l of ["land", "pollution", "noise", "crime", "fireRisk", "covPolice", "covFire", "covHealth",
    "covEdu", "covPark", "covTransit", "traffic", "trafficSmooth"]) City[l].fill(0);
  generateTerrain(seed, mapType);
  buildTerrainMesh();
  City.visualDirty = true;
  City.fieldsDirty = true;
  City.netDirty = true;
  computeBaseLandValue();
}

function computeBaseLandValue() {
  /* intrinsic desirability: water views, gentle ground, moderate elevation */
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      if (World.water[i]) { City.land[i] = 0; City.baseLand[i] = 0; continue; }
      let v = 0.24;
      const h = World.cellH[i];
      v += clamp01((h - 1) / 22) * 0.16;
      v -= clamp01((h - 46) / 40) * 0.22;
      v -= clamp01((World.cellSlope[i] - 0.18) / 0.5) * 0.20;
      /* proximity to water is worth a great deal */
      let wd = 999;
      for (let r = 1; r <= 6 && wd === 999; r++) {
        for (let a = -r; a <= r && wd === 999; a++) {
          const pts = [[x + a, z - r], [x + a, z + r], [x - r, z + a], [x + r, z + a]];
          for (const p of pts) if (inGrid(p[0], p[1]) && World.water[idxC(p[0], p[1])]) { wd = r; break; }
        }
      }
      if (wd < 999) v += (1 - wd / 7) * 0.26;
      if (World.resource[i] === 1) v += 0.04;
      City.baseLand[i] = clamp01(v);
      City.land[i] = clamp01(v);
    }
  }
}

function roadTypeAt(x, z) { return inGrid(x, z) ? City.road[idxC(x, z)] - 1 : -1; }
function hasRoad(x, z) { return inGrid(x, z) && City.road[idxC(x, z)] > 0; }

function updateMask(x, z) {
  if (!inGrid(x, z)) return;
  const i = idxC(x, z);
  if (!City.road[i]) { City.mask[i] = 0; return; }
  let m = 0;
  for (const d of DIRS) if (hasRoad(x + d.dx, z + d.dz)) m |= d.bit;
  City.mask[i] = m;
}
function updateMaskArea(x, z) {
  updateMask(x, z);
  for (const d of DIRS) updateMask(x + d.dx, z + d.dz);
}

function canPlaceRoad(x, z) {
  if (!inGrid(x, z)) return false;
  const i = idxC(x, z);
  if (World.water[i]) return false;
  if (World.cellSlope[i] > 0.72) return false;
  const b = City.occ[i];
  if (b >= 0 && City.buildings[b] && City.buildings[b].kind === 1) return false;
  return true;
}

function placeRoad(x, z, type, free) {
  if (!canPlaceRoad(x, z)) return 0;
  const i = idxC(x, z);
  const existing = City.road[i] - 1;
  if (existing === type) return 0;
  let cost = ROAD_TYPES[type].cost;
  if (existing >= 0) cost = Math.max(0, cost - ROAD_TYPES[existing].cost * 0.5);
  if (!free && City.money < cost) return 0;
  /* clear whatever occupied the cell */
  if (City.occ[i] >= 0) demolishBuilding(City.occ[i], true);
  City.road[i] = type + 1;
  City.zone[i] = 0;
  clearScatter(x, z);
  /* engineer the ground flat under the carriageway */
  const target = Math.max(World.cellH[i], SEA + 0.35);
  flattenCell(x, z, target, 0.88);
  refreshCellsAround(x, z, 1);
  updateMaskArea(x, z);
  if (!free) City.money -= cost;
  City.visualDirty = true;
  City.netDirty = true;
  City.fieldsDirty = true;
  World.dirtyTerrain = true;
  if (typeof Grow !== "undefined") Grow.timer = 0;
  return cost;
}

function removeRoad(x, z) {
  if (!inGrid(x, z)) return 0;
  const i = idxC(x, z);
  if (!City.road[i]) return 0;
  City.road[i] = 0;
  City.mask[i] = 0;
  updateMaskArea(x, z);
  City.visualDirty = true;
  City.netDirty = true;
  City.fieldsDirty = true;
  return 12;
}

function clearScatter(cx, cz) {
  const i = idxC(cx, cz);
  let changed = false;
  for (const s of World.scatter) {
    if (s.cell === i && !s.gone) { s.gone = 1; changed = true; }
  }
  if (changed) City.visualDirty = true;
}

/* --------------------------------------------------------------------------
   zoning
   -------------------------------------------------------------------------- */
function zoneCell(x, z, type, dens, free) {
  if (!inGrid(x, z)) return 0;
  const i = idxC(x, z);
  if (World.water[i] || City.road[i] || World.cellSlope[i] > 0.55) return 0;
  if (City.occ[i] >= 0 && City.buildings[City.occ[i]].kind === 1) return 0;
  if (City.zone[i] === type && City.dens[i] === dens) return 0;
  const cost = type === 0 ? 0 : 24;
  if (!free && City.money < cost) return 0;
  /* changing the zone evicts what stands there */
  if (City.occ[i] >= 0) demolishBuilding(City.occ[i], true);
  City.zone[i] = type;
  City.dens[i] = dens;
  if (!free) City.money -= cost;
  City.visualDirty = true;
  if (typeof Grow !== "undefined") Grow.timer = 0;
  return cost;
}

function newBuildingId() {

function footprintFree(cx, cz, w, d, ignoreZone) {
  for (let z = cz; z < cz + d; z++) {
    for (let x = cx; x < cx + w; x++) {
      if (!inGrid(x, z)) return false;
      const i = idxC(x, z);
      if (World.water[i] || City.road[i] || City.occ[i] >= 0) return false;
      if (World.cellSlope[i] > 0.5) return false;
      if (!ignoreZone && City.zone[i] === 0) return false;
    }
  }
  return true;
}
function footprintRoadSide(cx, cz, w, d) {
  /* returns the rotation that puts the building's front toward a road */
  const opts = [];
  for (let x = cx; x < cx + w; x++) {
    if (hasRoad(x, cz - 1)) opts.push({ rot: Math.PI, w: 1 });
    if (hasRoad(x, cz + d)) opts.push({ rot: 0, w: 1 });
  }
  for (let z = cz; z < cz + d; z++) {
    if (hasRoad(cx - 1, z)) opts.push({ rot: -Math.PI / 2, w: 1 });
    if (hasRoad(cx + w, z)) opts.push({ rot: Math.PI / 2, w: 1 });
  }
  if (!opts.length) return null;
  return opts[0].rot;
}

function occupy(b) {
  for (let z = b.cz; z < b.cz + b.d; z++)
    for (let x = b.cx; x < b.cx + b.w; x++) {
      City.occ[idxC(x, z)] = b.id;

}
function vacate(b) {
  for (let z = b.cz; z < b.cz + b.d; z++)
    for (let x = b.cx; x < b.cx + b.w; x++)
      if (City.occ[idxC(x, z)] === b.id) City.occ[idxC(x, z)] = -1;

function buildingWorldPos(b) {
  return {
    x: cellToWorld(b.cx) + (b.w - 1) * CELL * 0.5,
    z: cellToWorld(b.cz) + (b.d - 1) * CELL * 0.5
  };
}
function buildingGround(b) {
  let h = -1e9;
  let n = 0, sum = 0;
  for (let z = b.cz; z < b.cz + b.d; z++)
    for (let x = b.cx; x < b.cx + b.w; x++) {
      const v = cellTopH(x, z);
      sum += v; n++;
      if (v > h) h = v;
    }
  return lerp(sum / Math.max(n, 1), h, 0.8) + 0.02;
}

const CLS_INDEX = { rlow: 0, rhigh: 1, clow: 2, chigh: 3, off: 4, ind: 5 };

function spawnZonedBuilding(cx, cz, cls, level, lotW, lotD, rot) {
  let list = CATALOG[cls][clamp(level, 1, 5) - 1];
  let special = null;
  if (cls === "ind") {
    const res = World.resource[idxC(cx, cz)];
    if (res === 1 && CATALOG.farm.length) { list = CATALOG.farm; special = "farm"; }
    else if (res === 2 && CATALOG.mine.length) { list = CATALOG.mine; special = "mine"; }
  }
  const seed = Math.floor(Math.random() * 100000);
  const variant = list[seed % list.length];
  const id = newBuildingId();
  const rnd = mulberry32(seed);
  const b = {
    id, kind: 0, cls, level, special,
    cx, cz, w: lotW, d: lotD, rot,
    mesh: variant.name, seed: rnd(), h: variant.h, floors: variant.floors,
    smoke: variant.smoke || [],
    tint: buildingTint(cls, rnd),
    age: 0, build: 0, pop: 0, jobs: 0, workers: 0,
    happy: 0.55, value: 0.4, garbage: 0, garbageCollect: 0, crime: 0, fire: 0,
    abandoned: 0, abandonT: 0, burning: 0, burnT: 0, powered: 0, watered: 0,
    demandLock: 0
  };
  City.buildings[id] = b;
  occupy(b);
  /* level ground gently under the footprint */
  const g = buildingGround(b);
  for (let z = b.cz; z < b.cz + b.d; z++)
    for (let x = b.cx; x < b.cx + b.w; x++) flattenCell(x, z, g, 0.45);
  refreshCellsAround(b.cx, b.cz, Math.max(b.w, b.d));
  World.dirtyTerrain = true;
  City.visualDirty = true;
  City.stats.built++;
  return b;
}

function buildingTint(cls, rnd) {
  const r = rnd();
  switch (cls) {
    case "rlow": return [lerp(0.86, 1.10, r), lerp(0.88, 1.06, rnd()), lerp(0.84, 1.04, rnd())];
    case "rhigh": return [lerp(0.84, 1.12, r), lerp(0.86, 1.08, rnd()), lerp(0.86, 1.10, rnd())];
    case "clow": return [lerp(0.88, 1.12, r), lerp(0.88, 1.08, rnd()), lerp(0.86, 1.06, rnd())];
    case "chigh": return [lerp(0.86, 1.10, r), lerp(0.88, 1.10, rnd()), lerp(0.90, 1.14, rnd())];
    case "off": return [lerp(0.82, 1.10, r), lerp(0.88, 1.12, rnd()), lerp(0.92, 1.18, rnd())];
    default: return [lerp(0.88, 1.08, r), lerp(0.88, 1.06, rnd()), lerp(0.86, 1.02, rnd())];
  }
}

function placeService(key, cx, cz, rot, free) {
  const def = serviceByKey(key);
  if (!def) return null;
  let w = def.lw, d = def.ld;
  if (rot === Math.PI / 2 || rot === -Math.PI / 2) { const t = w; w = d; d = t; }
  if (!footprintFree(cx, cz, w, d, true)) return null;
  if (def.e.needsWater && !nearWater(cx, cz, w, d, 3)) return null;
  if (def.e.once && City.builtOnce[key]) return null;
  if (!free && City.money < def.cost) return null;
  const id = newBuildingId();
  const b = {
    id, kind: 1, svc: key, def, cls: def.cat,
    cx, cz, w, d, rot,
    mesh: def.mesh, seed: Math.random(), h: def.h, level: 1,
    smoke: def.smoke || [], tint: [1, 1, 1],
    age: 0, build: 0, pop: 0, jobs: Math.round(def.upkeep / 5), workers: 0,
    happy: 0.7, value: 0.5, garbage: 0, garbageCollect: 0, crime: 0, fire: 0,
    abandoned: 0, abandonT: 0, burning: 0, burnT: 0, powered: 0, watered: 0,
    active: 1, stored: 0
  };
  City.buildings[id] = b;
  occupy(b);
  const g = buildingGround(b);
  for (let z = b.cz; z < b.cz + b.d; z++)
    for (let x = b.cx; x < b.cx + b.w; x++) { flattenCell(x, z, g, 0.7); City.zone[idxC(x, z)] = 0; }
  refreshCellsAround(b.cx, b.cz, Math.max(b.w, b.d) + 1);
  World.dirtyTerrain = true;
  if (!free) City.money -= def.cost;
  if (def.e.once) City.builtOnce[key] = 1;
  City.visualDirty = true;
  City.netDirty = true;
  City.fieldsDirty = true;
  City.stats.built++;
  return b;
}

function nearWater(cx, cz, w, d, r) {
  for (let z = cz - r; z < cz + d + r; z++)
    for (let x = cx - r; x < cx + w + r; x++)
      if (inGrid(x, z) && World.water[idxC(x, z)]) return true;
  return false;
}

function demolishBuilding(id, silent) {
  const b = City.buildings[id];
  if (!b) return 0;
  vacate(b);
  if (b.kind === 1 && b.def && b.def.e.once) City.builtOnce[b.svc] = 0;
  City.buildings[id] = null;
  City.freeIds.push(id);
  City.visualDirty = true;
  City.netDirty = true;
  City.fieldsDirty = true;
  if (!silent) City.stats.demolished++;
  return b.kind === 1 ? Math.round(b.def.cost * 0.06) : 20;
}

/* --------------------------------------------------------------------------
   utility networks — power and water travel with the road network
   -------------------------------------------------------------------------- */
const netQueue = new Int32Array(GRID * GRID);
function floodNetwork(sources, out, maxSteps) {
  out.fill(0);
  let head = 0, tail = 0;
  const dist = City.netId;
  dist.fill(-1);
  for (const s of sources) {
    if (dist[s] === -1) { dist[s] = 0; out[s] = 1; netQueue[tail++] = s; }
  }
  while (head < tail) {
    const c = netQueue[head++];
    const d = dist[c];
    if (maxSteps && d >= maxSteps) continue;
    const x = c % GRID, z = (c / GRID) | 0;
    for (const dir of DIRS) {
      const nx = x + dir.dx, nz = z + dir.dz;
      if (!inGrid(nx, nz)) continue;
      const ni = idxC(nx, nz);
      if (dist[ni] !== -1) continue;
      if (City.road[ni] === 0 && City.pline[ni] === 0) continue;
      dist[ni] = d + 1;
      out[ni] = 1;
      netQueue[tail++] = ni;
    }
  }
}

function buildingTouchesNet(b, net) {
  for (let z = b.cz - 1; z <= b.cz + b.d; z++) {
    for (let x = b.cx - 1; x <= b.cx + b.w; x++) {
      if (!inGrid(x, z)) continue;
      if ((x < b.cx || x >= b.cx + b.w) && (z < b.cz || z >= b.cz + b.d)) continue;
      if (net[idxC(x, z)]) return true;
    }
  }
  return false;
}
function buildingHasRoad(b) {
  for (let x = b.cx; x < b.cx + b.w; x++) {
    if (hasRoad(x, b.cz - 1) || hasRoad(x, b.cz + b.d)) return true;
  }
  for (let z = b.cz; z < b.cz + b.d; z++) {
    if (hasRoad(b.cx - 1, z) || hasRoad(b.cx + b.w, z)) return true;
  }
  return false;
}

function recomputeNetworks() {
  /* power */
  const psrc = [];
  const wsrc = [];
  for (const b of City.buildings) {
    if (!b || b.kind !== 1 || !b.active) continue;
    const e = b.def.e;
    const cells = [];
    for (let z = b.cz - 1; z <= b.cz + b.d; z++)
      for (let x = b.cx - 1; x <= b.cx + b.w; x++)
        if (inGrid(x, z) && (City.road[idxC(x, z)] || City.pline[idxC(x, z)])) cells.push(idxC(x, z));
    if (e.power) for (const c of cells) psrc.push(c);
    if (e.water) for (const c of cells) wsrc.push(c);
  }
  floodNetwork(psrc, City.powered, 0);
  floodNetwork(wsrc, City.watered, 46);
  City.netDirty = false;
}

/* --------------------------------------------------------------------------
   scalar fields — coverage, pollution, land value
   -------------------------------------------------------------------------- */
function stampRadial(field, cx, cz, radius, strength) {
  const r = Math.ceil(radius / CELL);
  for (let z = cz - r; z <= cz + r; z++) {
    for (let x = cx - r; x <= cx + r; x++) {
      if (!inGrid(x, z)) continue;
      const dx = (x - cx) * CELL, dz = (z - cz) * CELL;
      const dist = Math.hypot(dx, dz);
      if (dist > radius) continue;
      const f = 1 - dist / radius;
      const i = idxC(x, z);
      field[i] += strength * f * f;
    }
  }
}
function blurField(field, amount) {
  const tmp = new Float32Array(field.length);
  tmp.set(field);
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      let s = tmp[i] * 4, w = 4;
      if (x > 0) { s += tmp[i - 1]; w++; }
      if (x < GRID - 1) { s += tmp[i + 1]; w++; }
      if (z > 0) { s += tmp[i - GRID]; w++; }
      if (z < GRID - 1) { s += tmp[i + GRID]; w++; }
      field[i] = lerp(field[i], s / w, amount);
    }
  }
}

function recomputeFields() {
  const pol = City.pollution, noi = City.noise;
  pol.fill(0); noi.fill(0);
  City.covPolice.fill(0); City.covFire.fill(0); City.covHealth.fill(0);
  City.covEdu.fill(0); City.covPark.fill(0); City.covTransit.fill(0);
  City.landfillCap = 0;

  const P = City.policies;
  const parkReach = P.parks_levy ? 1.35 : 1;
  const eduReach = P.education_boost ? 1.3 : 1;
  const polReach = P.night_patrol ? 1.25 : 1;

  for (const b of City.buildings) {
    if (!b) continue;
    const cx = b.cx + (b.w - 1) / 2, cz = b.cz + (b.d - 1) / 2;
    if (b.kind === 1) {
      const e = b.def.e;
      const bud = City.budget[serviceBudgetKey(b.def.cat)] || 1;
      const on = b.active && (!e.power || 1) ? 1 : 0;
      if (!on) continue;
      const R = (e.radius || 0) / CELL;
      if (e.police) stampRadial(City.covPolice, cx, cz, e.radius * polReach * bud, e.police);
      if (e.fire) stampRadial(City.covFire, cx, cz, e.radius * bud, e.fire);
      if (e.health) stampRadial(City.covHealth, cx, cz, e.radius * bud, e.health);
      if (e.education) stampRadial(City.covEdu, cx, cz, e.radius * eduReach * bud, e.education);
      if (e.happy || e.land) stampRadial(City.covPark, cx, cz, e.radius * parkReach, (e.happy || 0) * 0.5 + (e.land || 0) * 0.5);
      if (e.transit) stampRadial(City.covTransit, cx, cz, e.radius * bud, e.transit);
      if (e.pollution) stampRadial(pol, cx, cz, 62 + e.pollution * 26, e.pollution * 0.9);
      if (e.noise) stampRadial(noi, cx, cz, 44, e.noise);
      if (e.garbage) City.landfillCap += e.garbage;
      void R;
    } else {
      if (b.abandoned) continue;
      if (b.cls === "ind") {
        const f = City.policies.industrial_filter ? 0.42 : 1;
        stampRadial(pol, cx, cz, 46 + b.level * 12, (0.5 + b.level * 0.42) * f);
        stampRadial(noi, cx, cz, 34, 0.5 + b.level * 0.2);
      } else if (b.cls === "chigh" || b.cls === "clow") {
        stampRadial(noi, cx, cz, 24, 0.20 + b.level * 0.06);
        stampRadial(pol, cx, cz, 20, 0.06);
      } else if (b.cls === "off") {
        stampRadial(noi, cx, cz, 18, 0.10);
      }
    }
  }
  /* roads generate noise proportional to traffic */
  for (let i = 0; i < GRID * GRID; i++) {
    if (City.road[i]) {
      const t = ROAD_TYPES[City.road[i] - 1];
      const x = i % GRID, z = (i / GRID) | 0;
      const load = clamp01(City.trafficSmooth[i]);
      stampRadial(noi, x, z, 16 + t.noise * 10, t.noise * (0.14 + load * 0.42));
      if (load > 0.2) stampRadial(pol, x, z, 14, load * 0.18);
    }
  }
  blurField(pol, 0.75); blurField(pol, 0.55);
  blurField(noi, 0.6);

  /* land value */
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      if (World.water[i]) { City.land[i] = 0; continue; }
      let v = City.landBase(i);
      v += clamp01(City.covPark[i]) * 0.30;
      v += clamp01(City.covEdu[i] * 0.5) * 0.10;
      v += clamp01(City.covHealth[i] * 0.5) * 0.07;
      v += clamp01(City.covPolice[i] * 0.5) * 0.06;
      v += clamp01(City.covTransit[i] * 0.6) * 0.06;
      v -= clamp01(City.pollution[i] * 0.55) * 0.34;
      v -= clamp01(City.noise[i] * 0.5) * 0.16;
      v -= clamp01(City.crime[i] * 0.9) * 0.22;
      if (City.road[i] === 0) {
        let near = 0;
        for (const d of DIRS) if (hasRoad(x + d.dx, z + d.dz)) near = 1;
        if (!near) v -= 0.05;
      }
      City.land[i] = clamp01(v);
    }
  }
  blurField(City.land, 0.35);
  City.fieldsDirty = false;
}
City.baseLand = new Float32Array(GRID * GRID);
City.landBase = function (i) { return City.baseLand[i]; };

function serviceBudgetKey(cat) {
  switch (cat) {
    case "power": return "power";
    case "water": return "water";
    case "waste": return "waste";
    case "safety": return "police";
    case "health": return "health";
    case "education": return "education";
    case "parks": return "parks";
    case "transport": return "transport";
    default: return "parks";
  }
}

/* --------------------------------------------------------------------------
   growth engine
   -------------------------------------------------------------------------- */
const CLASS_FOR_ZONE = {
  1: { low: "rlow", high: "rhigh" },
  2: { low: "clow", high: "chigh" },
  3: { low: "ind", high: "ind" },
  4: { low: "off", high: "off" }
};

function capacityFor(b) {
  if (b.cls === "rlow") return { pop: 4 + b.level * 2, jobs: 0 };
  if (b.cls === "rhigh") return { pop: Math.round(b.floors * 3.4 + b.level * 6), jobs: 0 };
  if (b.cls === "clow") return { pop: 0, jobs: 5 + b.level * 3 };
  if (b.cls === "chigh") return { pop: 0, jobs: Math.round(b.floors * 2.6 + b.level * 5) };
  if (b.cls === "off") return { pop: 0, jobs: Math.round(b.floors * 3.0 + b.level * 6) };
  if (b.cls === "ind") return { pop: 0, jobs: 12 + b.level * 12 };
  return { pop: 0, jobs: 0 };
}

function tryGrowAt(x, z) {
  const i = idxC(x, z);
  const zt = City.zone[i];
  if (!zt || City.occ[i] >= 0 || City.road[i] || World.water[i]) return false;
  const dens = City.dens[i];
  const cls = dens ? CLASS_FOR_ZONE[zt].high : CLASS_FOR_ZONE[zt].low;
  const demand = zt === 1 ? City.demandR : zt === 2 ? City.demandC : zt === 3 ? City.demandI : City.demandO;
  if (demand < 0.06) return false;
  if (Math.random() > 0.18 + demand * 0.7) return false;

  const wantLot = (cls === "rlow" || cls === "clow") ? 1 : 2;
  /* try to find an aligned block anchored near this cell */
  for (const lot of (wantLot === 2 ? [2, 1] : [1])) {
    if (lot === 2) {
      for (const [ox, oz] of [[0, 0], [-1, 0], [0, -1], [-1, -1]]) {
        const bx = x + ox, bz = z + oz;
        if (!footprintFree(bx, bz, 2, 2)) continue;
        let ok = true;
        for (let zz = bz; zz < bz + 2 && ok; zz++)
          for (let xx = bx; xx < bx + 2 && ok; xx++) {
            const ii = idxC(xx, zz);
            if (City.zone[ii] !== zt || City.dens[ii] !== dens) ok = false;
          }
        if (!ok) continue;
        const rot = footprintRoadSide(bx, bz, 2, 2);
        if (rot === null) continue;
        const b = spawnZonedBuilding(bx, bz, cls, 1, 2, 2, rot);
        b.build = 0;
        return true;
      }
    } else {
      if (!footprintFree(x, z, 1, 1)) continue;
      const rot = footprintRoadSide(x, z, 1, 1);
      if (rot === null) continue;
      /* low-density classes only; a high-density zone waits for a full block */
      const useCls = (cls === "rhigh") ? "rlow" : (cls === "chigh" ? "clow" : cls);
      if (useCls === "ind" || useCls === "off") {
        if (!footprintFree(x, z, 1, 1)) continue;
      }
      const b = spawnZonedBuilding(x, z, useCls, 1, 1, 1, rot);
      b.build = 0;
      return true;
    }
  }
  return false;
}

function tryUpgrade(b) {
  if (b.kind !== 0 || b.abandoned || b.build < 1) return;
  if (b.level >= 5) return;
  if (b.cls === "ind" && b.level >= 3) return;
  const i = idxC(b.cx, b.cz);
  const need = 0.30 + b.level * 0.13;
  const value = City.land[i];
  if (value < need) return;
  if (b.happy < 0.55) return;
  const demand = b.cls[0] === "r" ? City.demandR : (b.cls[0] === "c" ? City.demandC :
    (b.cls === "off" ? City.demandO : City.demandI));
  if (demand < 0.12) return;
  if (Math.random() > 0.12) return;
  /* a low-density plot upgrades into the high-density class if the zone allows */
  const zt = City.zone[i];
  const dens = City.dens[i];
  let cls = b.cls;
  if (dens === 1 && b.w === 2) cls = CLASS_FOR_ZONE[zt].high;
  const lv = clamp(b.level + 1, 1, 5);
  const rot = b.rot;
  const cx = b.cx, cz = b.cz, w = b.w, d = b.d;
  demolishBuilding(b.id, true);
  const nb = spawnZonedBuilding(cx, cz, cls, lv, w, d, rot);
  nb.build = 0.35;
  nb.pop = b.pop; nb.workers = b.workers;
  nb.happy = b.happy;
}

/* --------------------------------------------------------------------------
   notifications
   -------------------------------------------------------------------------- */
function notify(title, detail, kind) {
  const n = { title, detail, kind: kind || "info", t: performance.now() };
  City.notifications.push(n);
  if (City.notifications.length > 5) City.notifications.shift();
  if (typeof pushNote === "function") pushNote(n);
}
/* ==========================================================================
   SECTION 7 — THE SIMULATION
   Population and employment, utility balances, happiness, demand, the
   monthly ledger, milestones, and the incidents that keep a mayor busy.
   ========================================================================== */

const SIM = {
  dayLength: 3.6,        /* real seconds per in-game day at speed 1 */
  growthBudget: 34,      /* plots considered per in-game day         */
  accum: 0,
  dayAccum: 0,
  lastMonth: 0
};

const MONTH_NAMES = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];

function gameDate() {
  const totalDays = Math.floor(City.time);
  const year = 1 + Math.floor(totalDays / 360);
  const dayOfYear = totalDays % 360;
  const month = Math.floor(dayOfYear / 30);
  const day = 1 + (dayOfYear % 30);
  return { year, month, day, name: MONTH_NAMES[month] };
}
function dayFraction() { return City.time - Math.floor(City.time); }
function gameHour() { return dayFraction() * 24; }

/* --------------------------------------------------------------------------
   per-building daily update
   -------------------------------------------------------------------------- */
function updateBuilding(b, days) {
  const i = idxC(b.cx, b.cz);
  const P = City.policies;

  if (b.build < 1) {
    b.build = Math.min(1, b.build + days * (b.kind === 1 ? 0.55 : 0.42));
    if (b.build >= 1 && b.kind === 0) City.visualDirty = true;
    return;
  }
  b.age += days;

  const road = buildingHasRoad(b);
  b.powered = buildingTouchesNet(b, City.powered) ? 1 : 0;
  b.watered = buildingTouchesNet(b, City.watered) ? 1 : 0;

  if (b.kind === 1) {
    const e = b.def.e;
    /* every service needs a road; and mains electricity unless it generates */
    let ok = road;
    if (!e.power && !b.powered) ok = false;
    b.active = ok ? 1 : 0;
    return;
  }

  /* ---- zoned building ---- */
  const cap = capacityFor(b);
  const pol = City.pollution[i];
  const noi = City.noise[i];
  const crime = City.crime[i];
  const value = City.land[i];
  /* utility satisfaction is graded, not binary — a city that is 90 per cent
     supplied should feel slightly strained, not ruined */
  const powerRatio = City.powerNeeded > 0 ? clamp01(City.powerProduced / City.powerNeeded) : 1;
  const waterRatio = City.waterNeeded > 0 ? clamp01(City.waterProduced / City.waterNeeded) : 1;
  const sewRatio = City.sewageNeeded > 0 ? clamp01(City.sewageCap / City.sewageNeeded) : 1;
  const garbRatio = City.garbageNeeded > 0 ? clamp01(City.garbageCap / City.garbageNeeded) : 1;
  /* the smallest settlements are forgiven their missing utilities */
  const civicScale = clamp01(City.population / 160);

  let h = 0.52;
  h += (value - 0.4) * 0.45;
  h -= clamp01(pol * 0.6) * 0.34;
  h -= clamp01(noi * 0.5) * 0.14;
  h -= clamp01(crime) * 0.26;
  h += clamp01(City.covPark[i] * 0.7) * 0.14;
  h += clamp01(City.covHealth[i] * 0.5) * 0.09;
  h += clamp01(City.covEdu[i] * 0.5) * 0.08;
  h += clamp01(City.covPolice[i] * 0.5) * 0.06;
  h += clamp01(City.covFire[i] * 0.5) * 0.04;
  h += clamp01(City.covTransit[i] * 0.6) * 0.05;
  h -= b.powered ? 0.34 * (1 - powerRatio) : 0.42;
  h -= b.watered ? 0.30 * (1 - waterRatio) : 0.36;
  h -= 0.20 * (1 - sewRatio) * civicScale;
  h -= 0.24 * (1 - garbRatio) * civicScale;
  if (City.landfillCap > 0 && City.garbageStored > City.landfillCap) h -= 0.14;
  if (!road) h -= 0.5;
  const tax = b.cls[0] === "r" ? City.taxR : (b.cls[0] === "c" ? City.taxC : (b.cls === "off" ? City.taxO : City.taxI));
  h -= clamp((tax - 0.09) * 2.4, -0.10, 0.45);
  /* commuting: unemployment hurts residents, empty desks hurt businesses */
  if (b.cls[0] === "r") h -= clamp01(City.unemployment - 0.08) * 0.5;
  else h -= clamp01(City.laborShortage - 0.05) * 0.45;
  if (b.burning) h -= 0.6;
  h = clamp01(h);
  b.happy = damp(b.happy, h, 1.4, days);
  b.value = damp(b.value, value, 1.2, days);

  /* occupancy follows happiness and demand */
  if (cap.pop > 0) {
    const target = cap.pop * clamp01(0.25 + b.happy * 0.9) * clamp01(0.35 + City.demandR * 1.5);
    b.pop = damp(b.pop, target, 0.55, days);
    if (b.pop < 0.1) b.pop = 0;
  }
  if (cap.jobs > 0) {
    const dem = b.cls[0] === "c" ? City.demandC : (b.cls === "off" ? City.demandO : City.demandI);
    const target = cap.jobs * clamp01(0.25 + b.happy * 0.85) * clamp01(0.4 + dem * 1.4);
    b.jobs = damp(b.jobs, target, 0.5, days);
  }

  /* refuse */
  const gRate = (b.pop * 0.55 + b.jobs * 0.42) * (P.recycling ? 0.66 : 1);
  b.garbage += gRate * days;
  b.garbage = Math.max(0, b.garbage - days * b.garbageCollect);
  if (b.garbage > 60) b.happy -= 0.02 * days;

  /* crime and fire pressure */
  const policeCov = clamp01(City.covPolice[i]);
  const fireCov = clamp01(City.covFire[i]);
  const crimeTarget = clamp01(0.30 + City.unemployment * 0.7 - policeCov * 0.85 - b.value * 0.25);
  b.crime = damp(b.crime, crimeTarget, 0.9, days);
  const fireBase = (b.cls === "ind" ? 0.9 : (b.cls[0] === "c" ? 0.55 : 0.4)) * (P.smoke && b.cls[0] === "r" ? 0.5 : 1);
  b.fire = clamp01(fireBase * (1 - fireCov * 0.8) * (b.abandoned ? 1.7 : 1));

  /* abandonment */
  if (b.happy < 0.22) {
    b.abandonT = (b.abandonT || 0) + days;
    if (b.abandonT > 12 && !b.abandoned) {
      b.abandoned = 1;
      b.pop = 0; b.jobs = 0;
      City.visualDirty = true;
    }
  } else {
    b.abandonT = Math.max(0, (b.abandonT || 0) - days * 2);
    if (b.abandoned && b.happy > 0.45) { b.abandoned = 0; City.visualDirty = true; }
  }
  if (b.abandoned && b.abandonT > 60 && Math.random() < 0.02 * days) {
    demolishBuilding(b.id, true);
  }
}

/* --------------------------------------------------------------------------
   aggregate pass
   -------------------------------------------------------------------------- */
function recomputeAggregates() {
  let pop = 0, jobsC = 0, jobsI = 0, jobsO = 0, capR = 0, capC = 0, capI = 0, capO = 0;
  let happySum = 0, happyN = 0;
  let power = 0, powerNeed = 0, water = 0, waterNeed = 0, sewCap = 0, sewNeed = 0;
  let garbCap = 0, garbNeed = 0, garbStored = 0, landfill = 0;
  let eduSum = 0, eduN = 0, healthSum = 0, safeSum = 0;
  let buildings = 0, abandoned = 0, burning = 0;
  const P = City.policies;
  const waterFactor = P.water_saving ? 0.8 : 1;

  for (const b of City.buildings) {
    if (!b) continue;
    buildings++;
    if (b.build < 1) continue;
    if (b.kind === 1) {
      const e = b.def.e;
      const bud = City.budget[serviceBudgetKey(b.def.cat)] || 1;
      if (b.active) {
        if (e.power) {
          let out = e.power * bud;
          if (e.solar) out *= clamp01(Math.sin((gameHour() / 24) * TAU - Math.PI * 0.5) * 1.6 + 0.25);
          if (e.wind) out *= 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(City.time * 0.7 + b.id));
          power += out;
        }
        if (e.water) water += e.water * bud;
        if (e.sewage) sewCap += e.sewage * bud;
        if (e.garbageRate) garbCap += e.garbageRate * bud;
        if (e.garbage) landfill += e.garbage;
      }
      if (!e.power) powerNeed += 45;
      waterNeed += 22 * waterFactor;
      continue;
    }
    if (b.abandoned) { abandoned++; continue; }
    if (b.burning) burning++;
    pop += b.pop;
    if (b.cls === "clow" || b.cls === "chigh") { jobsC += b.jobs; capC += capacityFor(b).jobs; }
    else if (b.cls === "off") { jobsO += b.jobs; capO += capacityFor(b).jobs; }
    else if (b.cls === "ind") { jobsI += b.jobs; capI += capacityFor(b).jobs; }
    else capR += capacityFor(b).pop;
    happySum += b.happy * Math.max(b.pop, 1); happyN += Math.max(b.pop, 1);
    garbNeed += (b.pop * 0.55 + b.jobs * 0.42) * (P.recycling ? 0.66 : 1);
    garbStored += b.garbage;
    const i = idxC(b.cx, b.cz);
    eduSum += clamp01(City.covEdu[i]) * Math.max(b.pop, 0.6); eduN += Math.max(b.pop, 0.6);
    healthSum += clamp01(City.covHealth[i]) * Math.max(b.pop, 0.6);
    safeSum += clamp01(City.covPolice[i]) * Math.max(b.pop, 0.6);
    const dens = b.pop + b.jobs;
    powerNeed += dens * 2.4 + 5;
    waterNeed += (dens * 1.4 + 3) * waterFactor;
    sewNeed += (dens * 1.25 + 2.5) * waterFactor;
  }

  City.population = Math.round(pop);
  City.jobsC = jobsC; City.jobsI = jobsI; City.jobsO = jobsO;
  City.capR = capR; City.capC = capC; City.capI = capI; City.capO = capO;
  City.workforce = pop * 0.58;
  const totalJobs = jobsC + jobsI + jobsO;
  City.totalJobs = totalJobs;
  City.employed = Math.min(City.workforce, totalJobs);
  City.unemployment = City.workforce > 1 ? clamp01(1 - City.employed / City.workforce) : 0;
  City.laborShortage = totalJobs > 1 ? clamp01(1 - City.employed / totalJobs) : 0;
  City.powerProduced = power; City.powerNeeded = powerNeed;
  City.waterProduced = water; City.waterNeeded = waterNeed;
  City.sewageCap = sewCap; City.sewageNeeded = sewNeed;
  City.garbageCap = garbCap; City.garbageNeeded = garbNeed;
  City.garbageStored = garbStored; City.landfillCap = landfill;
  City.happiness = happyN > 0 ? happySum / happyN : 0.6;
  City.edu = eduN > 0 ? eduSum / eduN : 0;
  City.health = eduN > 0 ? healthSum / eduN : 0;
  City.safety = eduN > 0 ? safeSum / eduN : 0;
  City.abandonedCount = abandoned;
  City.burningCount = burning;
  City.buildingCount = buildings;
  City.educated = City.workforce * City.edu;
  if (City.population > City.stats.maxPop) City.stats.maxPop = City.population;

  /* garbage collection allocation */
  const collect = City.garbageNeeded > 0 ? clamp01(City.garbageCap / City.garbageNeeded) : 1;
  for (const b of City.buildings) {
    if (!b || b.kind !== 0) continue;
    b.garbageCollect = (b.pop * 0.55 + b.jobs * 0.42) * collect * 1.05;
  }
}

/* --------------------------------------------------------------------------
   demand
   -------------------------------------------------------------------------- */
function updateDemand(days) {
  const pop = City.population;
  const workforce = City.workforce;
  const jobs = City.totalJobs;

  /* residential: driven by available jobs, mood, and the tax rate */
  let dR = 0.18;
  dR += clamp((jobs - workforce) / Math.max(workforce, 120), -0.6, 0.6) * 0.62;
  dR += (City.happiness - 0.5) * 0.55;
  dR -= (City.taxR - 0.09) * 3.2;
  dR -= clamp01(City.unemployment - 0.06) * 1.1;
  if (pop < 60) dR = Math.max(dR, 0.55);

  /* commercial: shoppers per capita against retail floorspace */
  const wantC = pop * 0.155 + City.jobsI * 0.08;
  let dC = clamp((wantC - City.jobsC) / Math.max(wantC, 18), -0.8, 0.9);
  dC += (City.happiness - 0.5) * 0.25;
  dC -= (City.taxC - 0.09) * 3.0;
  if (City.policies.small_business) dC += 0.07;

  /* industry: supplies commerce and exports */
  const wantI = pop * 0.135 + City.jobsC * 0.26 + 14;
  let dI = clamp((wantI - City.jobsI) / Math.max(wantI, 16), -0.8, 0.9);
  dI -= (City.taxI - 0.09) * 3.0;
  dI -= City.edu * 0.18;
  if (City.policies.industrial_filter) dI -= 0.04;

  /* offices: only where the workforce is educated */
  let dO = 0;
  if (City.milestone >= 4) {
    const wantO = City.educated * 0.62 + City.jobsC * 0.16 + 8;
    dO = clamp((wantO - City.jobsO) / Math.max(wantO, 14), -0.8, 0.9);
    dO += City.edu * 0.30 - 0.10;
    dO -= (City.taxO - 0.09) * 3.0;
    if (City.policies.high_tech) dO += 0.10;
  }

  /* utilities throttle everything */
  const util = Math.min(
    City.powerNeeded > 0 ? City.powerProduced / City.powerNeeded : 1,
    City.waterNeeded > 0 ? City.waterProduced / City.waterNeeded : 1);
  /* shortages choke growth but never freeze the city outright — unhappy
     buildings do the rest of the work */
  const throttle = 0.34 + 0.66 * clamp01((util - 0.55) / 0.45);
  const k = clamp01(days * 1.1);
  City.demandR = lerp(City.demandR, clamp01(dR) * throttle, k);
  City.demandC = lerp(City.demandC, clamp01(dC) * throttle, k);
  City.demandI = lerp(City.demandI, clamp01(dI) * throttle, k);
  City.demandO = lerp(City.demandO, clamp01(dO) * throttle, k);
}

/* --------------------------------------------------------------------------
   growth pass
   -------------------------------------------------------------------------- */
/* Candidate cells are cached: scanning 16k cells for the handful that are
   zoned, empty and beside a road would otherwise dominate the tick. */
const Grow = { cand: [], timer: 0, accum: 0, upAccum: 0 };
function refreshCandidates() {
  Grow.cand.length = 0;
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      if (!City.zone[i] || City.occ[i] >= 0 || City.road[i] || World.water[i]) continue;
      /* must have road frontage within one cell of the plot */
      if (!hasRoad(x - 1, z) && !hasRoad(x + 1, z) && !hasRoad(x, z - 1) && !hasRoad(x, z + 1) &&
        !hasRoad(x - 2, z) && !hasRoad(x + 2, z) && !hasRoad(x, z - 2) && !hasRoad(x, z + 2)) continue;
      Grow.cand.push(i);
    }
  }
  Grow.timer = 2.4;
}
function growthPass(days, dt) {
  Grow.timer -= dt;
  if (Grow.timer <= 0 || Grow.cand.length === 0) refreshCandidates();
  Grow.accum += SIM.growthBudget * days * (1 + Math.sqrt(City.population) / 26);
  let tries = Math.min(240, Math.floor(Grow.accum));
  Grow.accum -= tries;
  while (tries-- > 0 && Grow.cand.length) {
    const k = (Math.random() * Grow.cand.length) | 0;
    const i = Grow.cand[k];
    const x = i % GRID, z = (i / GRID) | 0;
    if (City.occ[i] >= 0 || !City.zone[i]) {
      Grow.cand[k] = Grow.cand[Grow.cand.length - 1];
      Grow.cand.pop();
      continue;
    }
    if (tryGrowAt(x, z)) {
      Grow.cand[k] = Grow.cand[Grow.cand.length - 1];
      Grow.cand.pop();
    }
  }
  /* upgrades */
  Grow.upAccum += City.buildings.length * 0.035 * days;
  let ups = Math.min(60, Math.floor(Grow.upAccum));
  Grow.upAccum -= ups;
  while (ups-- > 0) {
    const b = City.buildings[(Math.random() * City.buildings.length) | 0];
    if (b && b.kind === 0) tryUpgrade(b);
  }
}

/* --------------------------------------------------------------------------
   ledger
   -------------------------------------------------------------------------- */
function computeIncome() {
  let inc = 0;
  for (const b of City.buildings) {
    if (!b || b.kind !== 0 || b.abandoned || b.build < 1) continue;
    const v = 0.55 + b.value * 1.1;
    if (b.cls[0] === "r") inc += b.pop * 5.2 * v * (City.taxR / 0.09) * 0.09 * 11;
    else if (b.cls[0] === "c") inc += b.jobs * 6.0 * v * (City.taxC / 0.09) * 0.09 * 11;
    else if (b.cls === "off") inc += b.jobs * 7.4 * v * (City.taxO / 0.09) * 0.09 * 11;
    else inc += b.jobs * 5.0 * v * (City.taxI / 0.09) * 0.09 * 11 * (City.policies.industrial_filter ? 0.94 : 1);
  }
  return inc;
}
function computeExpense() {
  let exp = 0;
  for (const b of City.buildings) {
    if (!b) continue;
    if (b.kind === 1) {
      const bud = City.budget[serviceBudgetKey(b.def.cat)] || 1;
      exp += b.def.upkeep * (0.35 + 0.65 * bud);
    }
  }
  let roadUp = 0;
  for (let i = 0; i < GRID * GRID; i++) if (City.road[i]) roadUp += ROAD_TYPES[City.road[i] - 1].upkeep;
  exp += roadUp * City.budget.roads;
  for (const p of POLICY_DEFS) if (City.policies[p.key]) exp += p.cost * (18 + City.population * 0.055);
  exp += City.loan * City.loanRate / 12;
  return exp;
}

function monthlyLedger() {
  const inc = computeIncome();
  const exp = computeExpense();
  City.incomeLast = inc;
  City.expenseLast = exp;
  City.money += inc - exp;
  City.history.pop.push(City.population);
  City.history.money.push(City.money);
  City.history.happy.push(City.happiness);
  City.history.income.push(inc);
  City.history.expense.push(exp);
  City.history.traffic.push(City.trafficAvg || 0);
  for (const k in City.history) if (City.history[k].length > 240) City.history[k].shift();
  if (City.money < -6000) {
    notify("Treasury overdrawn", "Services will start failing if the balance stays negative. Consider a loan or a tax rise.", "bad");
  }
}

/* --------------------------------------------------------------------------
   milestones
   -------------------------------------------------------------------------- */
function checkMilestones() {
  while (City.milestone < MILESTONES.length - 1 && City.population >= MILESTONES[City.milestone + 1].pop) {
    City.milestone++;
    const m = MILESTONES[City.milestone];
    City.money += m.bonus;
    showToast("Milestone reached", m.name, m.unlock + "   ·   " + fmtMoneyFull(m.bonus) + " grant");
    notify("Milestone: " + m.name, m.unlock, "good");
    if (typeof rebuildToolbar === "function") rebuildToolbar();
  }
}

/* --------------------------------------------------------------------------
   incidents
   -------------------------------------------------------------------------- */
function updateIncidents(days) {
  /* ignition */
  if (Math.random() < days * 0.10 && City.population > 40) {
    const candidates = [];
    for (const b of City.buildings) {
      if (!b || b.kind !== 0 || b.burning || b.build < 1) continue;
      if (Math.random() < b.fire * 0.06) candidates.push(b);
    }
    if (candidates.length) {
      const b = candidates[(Math.random() * candidates.length) | 0];
      b.burning = 1; b.burnT = 0;
      City.fires.push(b.id);
      City.stats.fires++;
      const p = buildingWorldPos(b);
      notify("Fire reported", "A blaze has broken out" + (City.covFire[idxC(b.cx, b.cz)] > 0.2 ? ". Engines are responding." : " and no station covers the area."), "bad");
      if (typeof dispatchService === "function") dispatchService("fire", p.x, p.z);
    }
  }
  /* burning progression */
  for (let k = City.fires.length - 1; k >= 0; k--) {
    const b = City.buildings[City.fires[k]];
    if (!b || !b.burning) { City.fires.splice(k, 1); continue; }
    const cov = clamp01(City.covFire[idxC(b.cx, b.cz)] * City.budget.fire);
    b.burnT += days;
    const suppression = cov * 0.6;
    if (b.burnT > 1.2 && Math.random() < suppression * days * 2.4) {
      b.burning = 0; b.burnT = 0;
      City.fires.splice(k, 1);
      City.visualDirty = true;
    } else if (b.burnT > (2.5 + cov * 8)) {
      notify("Building lost", "A fire destroyed a structure. Zoning remains, so it will rebuild.", "bad");
      demolishBuilding(b.id, true);
      City.fires.splice(k, 1);
    }
  }
  /* crime events dispatch a patrol */
  if (Math.random() < days * 0.16 && City.population > 120) {
    let worst = null, wv = 0.35;
    for (const b of City.buildings) {
      if (!b || b.kind !== 0 || b.abandoned) continue;
      if (b.crime > wv) { wv = b.crime; worst = b; }
    }
    if (worst) {
      City.stats.crimes++;
      const p = buildingWorldPos(worst);
      if (typeof dispatchService === "function") dispatchService("police", p.x, p.z);
    }
  }
  /* sickness dispatch */
  if (Math.random() < days * 0.14 && City.population > 200) {
    const list = City.buildings.filter(b => b && b.kind === 0 && b.pop > 2);
    if (list.length) {
      const b = list[(Math.random() * list.length) | 0];
      const p = buildingWorldPos(b);
      if (typeof dispatchService === "function") dispatchService("ambulance", p.x, p.z);
    }
  }
  /* refuse collection rounds */
  if (Math.random() < days * 0.5 && City.garbageCap > 0) {
    const list = City.buildings.filter(b => b && b.kind === 0 && b.garbage > 12);
    if (list.length) {
      const b = list[(Math.random() * list.length) | 0];
      const p = buildingWorldPos(b);
      if (typeof dispatchService === "function") dispatchService("garbage", p.x, p.z);
    }
  }
}

/* --------------------------------------------------------------------------
   advisor: watches the city and speaks up when something is wrong
   -------------------------------------------------------------------------- */
const Advisor = { cool: {}, };
function advisorCheck() {
  const now = City.time;
  const say = (key, title, detail, kind, gap) => {
    if (Advisor.cool[key] && now - Advisor.cool[key] < (gap || 90)) return;
    Advisor.cool[key] = now;
    notify(title, detail, kind);
  };
  if (City.powerNeeded > City.powerProduced * 1.0 && City.population > 20)
    say("power", "Power shortfall", "Demand exceeds generation. Buildings are browning out and will empty if this continues.", "bad", 60);
  else if (City.powerNeeded > City.powerProduced * 0.88 && City.population > 20)
    say("power_warn", "Power reserve is thin", "You are within a whisker of the grid's limit. Build ahead of the curve.", "warn", 120);
  if (City.waterNeeded > City.waterProduced && City.population > 20)
    say("water", "Water shortfall", "Pumping capacity is below demand. Add a pump on the shoreline or a water tower.", "bad", 60);
  if (City.sewageNeeded > City.sewageCap * 1.02 && City.population > 60)
    say("sewage", "Sewage backing up", "Effluent has nowhere to go. Add an outlet, or better, a treatment plant.", "bad", 90);
  if (City.garbageNeeded > City.garbageCap * 1.05 && City.population > 100)
    say("garbage", "Refuse is piling up", "Collection capacity is short of what the city produces.", "warn", 90);
  if (City.landfillCap > 0 && City.garbageStored > City.landfillCap * 0.9)
    say("landfill", "Landfill nearly full", "Consider an incinerator, or the recycling ordinance.", "warn", 120);
  if (City.unemployment > 0.22 && City.population > 200)
    say("unemp", "Unemployment is high", "Zone more commerce, industry or offices so residents have somewhere to work.", "warn", 120);
  if (City.laborShortage > 0.3 && City.totalJobs > 60)
    say("labor", "Businesses cannot find staff", "There are more jobs than workers. Zone more housing.", "warn", 120);
  if (City.money < 2000 && City.money > -1e9)
    say("broke", "Funds running low", "Raise taxes, trim budgets, or take a loan before services fail.", "warn", 90);
  if (City.happiness < 0.35 && City.population > 150)
    say("unhappy", "The city is unhappy", "Check pollution, crime, and whether services actually reach your neighbourhoods.", "warn", 120);
  if (City.abandonedCount > 6)
    say("abandon", "Buildings are being abandoned", City.abandonedCount + " structures stand empty. Fix the underlying service or pollution problem.", "warn", 120);
  if (City.milestone >= 4 && City.demandO > 0.5 && City.jobsO < 10)
    say("office", "Offices want to build", "Educated workers are waiting. Zone office districts away from industry.", "info", 200);
}

/* --------------------------------------------------------------------------
   the tick
   -------------------------------------------------------------------------- */
let fieldTimer = 0, netTimer = 0;
function simulate(dt) {
  if (City.paused || City.speed === 0) return;
  const speedMul = [0, 1, 3, 9][City.speed];
  const days = (dt / SIM.dayLength) * speedMul;
  if (days <= 0) return;
  const prev = City.time;
  City.time += days;

  /* networks and fields are expensive: refresh them on a timer or on demand */
  netTimer -= dt;
  if (City.netDirty || netTimer <= 0) { recomputeNetworks(); netTimer = 1.2; }
  fieldTimer -= dt;
  if (City.fieldsDirty || fieldTimer <= 0) { recomputeFields(); fieldTimer = 2.6; }

  for (const b of City.buildings) if (b) updateBuilding(b, days);
  recomputeAggregates();
  updateDemand(days);
  growthPass(days, dt);
  updateIncidents(days);
  checkMilestones();

  /* crime field from buildings */
  if (City.tick % 8 === 0) {
    City.crime.fill(0);
    for (const b of City.buildings) {
      if (!b || b.kind !== 0 || b.build < 1) continue;
      stampRadial(City.crime, b.cx + (b.w - 1) / 2, b.cz + (b.d - 1) / 2, 26, b.crime * 0.5);
    }
    blurField(City.crime, 0.5);
  }
  City.tick++;

  if (Math.floor(prev / 30) !== Math.floor(City.time / 30)) {
    monthlyLedger();
    advisorCheck();
  }
}

/* --------------------------------------------------------------------------
   loans
   -------------------------------------------------------------------------- */
const LOANS = [
  { amount: 15000, rate: 0.05, name: "Municipal Note" },
  { amount: 60000, rate: 0.075, name: "Development Bond" },
  { amount: 200000, rate: 0.11, name: "Infrastructure Debenture" }
];
function takeLoan(idx) {
  const L = LOANS[idx];
  if (!L || City.loan > 0) return false;
  City.loan = L.amount;
  City.loanRate = L.rate;
  City.money += L.amount;
  notify("Loan drawn", L.name + " for " + fmtMoneyFull(L.amount) + " at " + Math.round(L.rate * 100) + "% annual interest.", "info");
  return true;
}
function repayLoan() {
  if (City.loan <= 0 || City.money < City.loan) return false;
  City.money -= City.loan;
  notify("Loan repaid", "The city is debt free.", "good");
  City.loan = 0; City.loanRate = 0;
  return true;
}
/* ==========================================================================
   SECTION 8 — MOVEMENT
   A* over the road graph, lane-accurate path geometry with cut corners,
   car-following behaviour, signalised junctions, pedestrians on the
   pavement, emergency dispatch, harbour traffic and aircraft.
   ========================================================================== */

const Traffic = {
  vehicles: [],
  peds: [],
  boats: [],
  aircraft: [],
  particles: [],
  maxVehicles: 240,
  maxPeds: 190,
  cellVeh: [],
  spawnAccum: 0,
  pedAccum: 0,
  volume: new Float32Array(GRID * GRID),
  lightPhase: 0
};
for (let i = 0; i < GRID * GRID; i++) Traffic.cellVeh.push([]);

/* --------------------------------------------------------------------------
   A* over road cells
   -------------------------------------------------------------------------- */
const PF = {
  g: new Float32Array(GRID * GRID),
  f: new Float32Array(GRID * GRID),
  came: new Int32Array(GRID * GRID),

/* --------------------------------------------------------------------------
   path -> lane geometry
   -------------------------------------------------------------------------- */
function laneOffsetFor(cell) {
