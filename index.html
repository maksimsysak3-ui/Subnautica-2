<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>citysim</title>
<meta name="description" content="A city simulation engine built on WebGPU.">
<!-- Adds COOP/COEP so SharedArrayBuffer works on GitHub Pages. Must run before the app. -->
<script src="./coi-serviceworker.js"></script>
<style>
  :root {
    --bg: #0b0e13;
    --fg: #c9d4e3;
    --dim: #5d6b80;
    --accent: #62d4ff;
    --warn: #ffb454;
    --err: #ff6b7a;
    --ok: #7ee0a0;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #gpu-canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; outline: none;
  }
  /* ---- boot screen ---- */
  #boot {
    position: fixed; inset: 0; display: grid; place-content: center;
    gap: 10px; background: var(--bg); z-index: 10;
    transition: opacity .35s ease; text-align: center;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot h1 {
    font-size: 12px; font-weight: 500; letter-spacing: .42em;
    text-transform: uppercase; color: var(--dim);
  }
  #boot-status { color: var(--accent); font-size: 12px; min-height: 1.5em; }
  /* ---- overlays mounted by the app ---- */
  #overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  noscript { position: fixed; inset: 0; display: grid; place-content: center; }
</style>
</head>
<body>
  <canvas id="gpu-canvas" tabindex="0"></canvas>
  <div id="overlay"></div>
  <div id="boot">
    <h1>citysim</h1>
    <div id="boot-status">initialising&hellip;</div>
  </div>
  <noscript>This requires JavaScript and a WebGPU-capable browser.</noscript>
  <script type="module" src="/src/main.ts"></script>
  <script>
  /* Boot watchdog.
   *
   * Without this the page sits on "initialising..." forever whenever the
   * module bundle fails to run, with nothing to go on.
   *
   * The case worth knowing about: a static host serving the repository root
   * hands back index.html pointing at /src/main.ts, and GitHub Pages serves
   * .ts files as video/mp2t -- HTTP 200, wrong MIME, browser refuses to
   * execute it as a module. So "did it 404" is not a sufficient test; the
   * bundle has to actually be JavaScript. Either way the built copy is in
   * ./docs, so go there rather than asking anyone to change a setting.
   */
  (function () {
    var el = document.querySelector('script[type=module]');
    var SRC = el.src;
    var ran = false;

    function say(msg) {
      var box = document.getElementById('boot-status');
      if (!box) return;
      box.innerHTML = msg;
      box.style.color = '#ffb454';
    }

    /** True when this page is already the built copy, so we cannot recurse. */
    function inDocs() {
      return /\/docs\/?$/.test(location.pathname.replace(/index\.html$/, ''));
    }

    function fallbackToDocs(reason) {
      if (inDocs()) return dead(reason);
      say('looking for the built copy&hellip;');
      fetch('docs/index.html', { cache: 'no-store' })
        .then(function (d) {
          if (d.ok) location.replace('docs/' + location.search + location.hash);
          else dead(reason);
        })
        .catch(function () { dead(reason); });
    }

    function dead(reason) {
      say(reason + '<br><br>' +
          '<span style="color:#5d6b80;font-size:11px">' + SRC + '</span><br><br>' +
          'Nothing is built here. Run <b>npm install &amp;&amp; npm run build</b>,<br>' +
          'or start the dev server with <b>npm run dev</b>.');
    }

    function diagnose() {
      if (ran || window.__citysimBooted) return;
      ran = true;

      fetch(SRC, { cache: 'no-store' }).then(function (r) {
        var type = (r.headers.get('content-type') || 'unknown').toLowerCase();
        if (!r.ok) {
          fallbackToDocs('<b>' + r.status + '</b> fetching the app bundle.');
        } else if (type.indexOf('javascript') === -1 && type.indexOf('ecmascript') === -1) {
          fallbackToDocs('The bundle came back as <b>' + type + '</b>, not JavaScript.');
        } else {
          say('the bundle downloaded but never ran.<br>' +
              '<span style="color:#5d6b80;font-size:11px">press ` for the log, ' +
              'or open the browser console</span>');
        }
      }).catch(function (e) {
        say('could not reach the app bundle:<br>' +
            '<span style="color:#5d6b80;font-size:11px">' + e + '</span>');
      });
    }

    // A 404 or a MIME refusal fires this at once; the timer is the backstop
    // for a bundle that loads but throws before it signals.
    el.addEventListener('error', diagnose);
    setTimeout(diagnose, 4000);
  })();
  </script>
</body>
</html>
