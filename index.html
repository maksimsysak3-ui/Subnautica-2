<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>METROPOLIS ENGINE - City Architect</title>
<style>
/* ============================================================================
   METROPOLIS ENGINE — hand-built interface
   A restrained, architectural UI: hairlines, deep graphite, drafting-blue
   accents and amber signal colour. No decorative clutter, no icon fonts —
   every glyph in this file is hand-drawn SVG.
   ========================================================================== */

:root{
  --bg:#0a0d12;
  --panel:rgba(15,19,26,0.90);
  --panel-solid:#0f131a;
  --panel-hi:rgba(26,33,44,0.94);
  --line:rgba(140,170,205,0.16);
  --line-strong:rgba(150,180,215,0.30);
  --txt:#dce6f2;
  --txt-dim:#8fa1b8;
  --txt-faint:#5d6d82;
  --accent:#5fc9e8;
  --accent-deep:#2b8fb3;
  --amber:#f0b23f;
  --green:#57c98a;
  --red:#e8615c;
  --violet:#a98ce0;
  --res:#6ecb7a;
  --com:#5aa9e6;
  --ind:#e2b452;
  --off:#57c3c9;
  --shadow:0 18px 48px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.03) inset;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--sans);font-size:13px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;user-select:none}
#gl{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:default;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
.pe{pointer-events:auto}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
svg{display:block}
.hidden{display:none !important}

/* ---------- shared chrome ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  backdrop-filter:blur(18px) saturate(1.25);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  box-shadow:var(--shadow);
}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--line-strong) 12%,var(--line-strong) 88%,transparent)}
.label{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-faint);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- top status bar ---------- */
#topbar{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;gap:0;height:52px;padding:0 4px;
  max-width:calc(100vw - 24px);
}
#topbar .seg{display:flex;align-items:center;gap:12px;padding:0 14px;height:100%}
#topbar .sep{width:1px;background:var(--line);margin:10px 0}
.stat{display:flex;flex-direction:column;justify-content:center;min-width:62px}
.stat .v{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-faint);font-weight:600}
.stat.pos .v{color:var(--green)} .stat.neg .v{color:var(--red)}
.stat .v.warn{color:var(--amber)}

#clockseg{gap:10px}
#datebox{display:flex;flex-direction:column;align-items:flex-start;min-width:132px;white-space:nowrap}
#dateline{font-family:var(--mono);font-size:13px;color:var(--txt);letter-spacing:.02em}
#cityname{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
.speeds{display:flex;gap:3px}
.spd{width:26px;height:26px;border:1px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;
  color:var(--txt-faint);transition:all .14s ease;background:rgba(255,255,255,0.015)}
.spd:hover{border-color:var(--line-strong);color:var(--txt)}
.spd.on{background:rgba(95,201,232,0.14);border-color:rgba(95,201,232,0.5);color:var(--accent);
  box-shadow:0 0 12px rgba(95,201,232,0.18)}

/* ---------- right: menu rail ---------- */
#menurail{position:absolute;top:10px;right:12px;display:flex;gap:6px;height:52px;align-items:center;padding:0 8px}
.mbtn{width:36px;height:36px;border-radius:7px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;
  color:var(--txt-dim);transition:all .14s ease}
.mbtn:hover{background:rgba(255,255,255,0.05);color:var(--txt);border-color:var(--line)}
.mbtn.on{background:rgba(95,201,232,0.13);color:var(--accent);border-color:rgba(95,201,232,0.42)}

/* ---------- demand meters ---------- */
#demand{position:absolute;right:12px;top:76px;padding:10px 12px 8px;display:flex;gap:11px;align-items:flex-end}
.dm{display:flex;flex-direction:column;align-items:center;gap:6px;width:26px}
.dm .bar{width:11px;height:74px;background:rgba(255,255,255,0.055);border-radius:3px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.05)}
.dm .fill{position:absolute;left:0;right:0;bottom:0;height:0%;border-radius:2px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.dm .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.38),transparent 55%)}
.dm .t{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--txt-faint)}
#dmR .fill{background:var(--res)} #dmC .fill{background:var(--com)}
#dmI .fill{background:var(--ind)} #dmO .fill{background:var(--off)}

/* ---------- info views (left rail) ---------- */
#viewrail{position:absolute;left:12px;top:76px;padding:7px 6px;display:flex;flex-direction:column;gap:3px;width:44px}
.vbtn{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--txt-faint);
  border:1px solid transparent;transition:all .13s ease;margin:0 auto}
.vbtn:hover{color:var(--txt);background:rgba(255,255,255,0.05)}
.vbtn.on{color:var(--accent);background:rgba(95,201,232,0.13);border-color:rgba(95,201,232,0.4)}

/* ---------- bottom tool dock ---------- */
#dock{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;max-width:calc(100vw - 24px)}
#subdock{display:flex;gap:5px;padding:7px;align-items:stretch;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#subdock::-webkit-scrollbar{display:none}
.tool{min-width:78px;padding:7px 9px 6px;border-radius:7px;border:1px solid transparent;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--txt-dim);transition:all .13s ease;position:relative;background:rgba(255,255,255,0.02)}
.tool:hover{background:rgba(255,255,255,0.06);color:var(--txt)}
.tool.on{background:rgba(95,201,232,0.14);border-color:rgba(95,201,232,0.45);color:var(--accent)}
.tool.locked{opacity:.34;filter:grayscale(1)}
.tool .nm{font-size:9.5px;letter-spacing:.05em;font-weight:600;text-align:center;white-space:nowrap}
.tool .cost{font-family:var(--mono);font-size:9px;color:var(--txt-faint)}
.tool.on .cost{color:rgba(95,201,232,.8)}
.tool .lk{position:absolute;top:3px;right:4px;color:var(--amber);opacity:.85}

#catdock{display:flex;gap:4px;padding:6px}
.cat{padding:7px 12px 6px;border-radius:7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--txt-dim);
  border:1px solid transparent;transition:all .13s ease;min-width:64px}
.cat:hover{background:rgba(255,255,255,0.05);color:var(--txt)}
.cat.on{background:rgba(255,255,255,0.09);color:#fff;border-color:var(--line-strong)}
.cat .nm{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}

/* ---------- selection / info panel ---------- */
#infopanel{position:absolute;left:12px;bottom:12px;width:284px;padding:0;overflow:hidden}
#infohead{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#infotitle{font-size:14px;font-weight:700;letter-spacing:.01em}
#infosub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-top:2px}
#infobody{padding:10px 14px 12px;display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow-y:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px}
.row .k{color:var(--txt-dim)} .row .v{font-family:var(--mono);font-weight:600}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,0.07);overflow:hidden;flex:1;max-width:96px}
.meter i{display:block;height:100%;border-radius:2px;transition:width .35s ease}
.xbtn{width:22px;height:22px;border-radius:5px;color:var(--txt-faint);display:flex;align-items:center;justify-content:center;flex:none}
.xbtn:hover{background:rgba(255,255,255,0.08);color:var(--txt)}
.actionbar{display:flex;gap:6px;padding:0 14px 12px}
.act{flex:1;padding:7px;border-radius:6px;border:1px solid var(--line);font-size:10.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--txt-dim);transition:all .13s}
.act:hover{border-color:var(--line-strong);color:var(--txt);background:rgba(255,255,255,0.05)}
.act.danger:hover{border-color:rgba(232,97,92,.6);color:var(--red);background:rgba(232,97,92,.1)}

/* ---------- minimap ---------- */
#minimap{position:absolute;right:12px;bottom:12px;width:178px;padding:8px}
#mmcanvas{width:162px;height:162px;display:block;border-radius:5px;background:#070a0e;border:1px solid var(--line)}
#mmlabel{display:flex;justify-content:space-between;align-items:center;margin-top:6px}

/* ---------- notifications ---------- */
#notes{position:absolute;right:12px;top:186px;width:264px;display:flex;flex-direction:column;gap:6px}
.note{padding:9px 11px;display:flex;gap:9px;align-items:flex-start;animation:slideIn .32s cubic-bezier(.2,.9,.3,1);
  border-left:2px solid var(--accent)}
.note.warn{border-left-color:var(--amber)} .note.bad{border-left-color:var(--red)} .note.good{border-left-color:var(--green)}
.note .nt{font-size:11.5px;font-weight:600;line-height:1.3}
.note .nd{font-size:10.5px;color:var(--txt-dim);margin-top:2px;line-height:1.35}
.note .ni{flex:none;margin-top:1px;color:var(--accent)}
.note.warn .ni{color:var(--amber)} .note.bad .ni{color:var(--red)} .note.good .ni{color:var(--green)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- modal windows ---------- */
#modalwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,6,9,0.62);
  backdrop-filter:blur(4px);animation:fadeUp .2s ease}
.modal{width:min(880px,calc(100vw - 40px));max-height:min(78vh,720px);display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:15px 18px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.mtitle{font-size:15px;font-weight:700;letter-spacing:.02em}
.msub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-faint);font-weight:600;margin-top:2px}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mtabs{display:flex;gap:4px;padding:10px 18px 0}
.mtab{padding:7px 13px;border-radius:6px 6px 0 0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt-faint);border-bottom:2px solid transparent}
.mtab:hover{color:var(--txt)} .mtab.on{color:var(--accent);border-bottom-color:var(--accent);background:rgba(95,201,232,.07)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(150,180,215,.16);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(150,180,215,.3);background-clip:padding-box}

/* budget rows */
.brow{display:grid;grid-template-columns:1fr 130px 96px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.brow .bn{font-size:12px}
.brow .bv{font-family:var(--mono);font-size:12px;text-align:right;font-weight:600}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;
  border:2px solid #0f131a;box-shadow:0 0 8px rgba(95,201,232,.4)}
.slider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #0f131a}

/* policy cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:9px}
.pcard{padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02);transition:all .14s;cursor:pointer}
.pcard:hover{border-color:var(--line-strong);background:rgba(255,255,255,.045)}
.pcard.on{border-color:rgba(95,201,232,.5);background:rgba(95,201,232,.08)}
.pcard .pn{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .pd{font-size:10.5px;color:var(--txt-dim);margin-top:4px;line-height:1.4}
.pcard .pc{font-family:var(--mono);font-size:10px;color:var(--amber);margin-top:6px}
.switch{width:28px;height:15px;border-radius:8px;background:rgba(255,255,255,.12);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:var(--txt-faint);transition:all .18s}
.pcard.on .switch{background:rgba(95,201,232,.42)}
.pcard.on .switch::after{left:15px;background:var(--accent)}

/* chart */
.chartbox{border:1px solid var(--line);border-radius:8px;padding:12px;background:rgba(0,0,0,.22)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--txt-dim)}
.legend i{width:9px;height:2.5px;border-radius:2px;display:block}

/* milestone list */
.mile{display:flex;gap:11px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.02)}
.mile.done{border-color:rgba(87,201,138,.3);background:rgba(87,201,138,.06)}
.mile .mk{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--txt-faint);flex:none}
.mile.done .mk{color:var(--green);border-color:rgba(87,201,138,.4)}

/* ---------- tooltip ---------- */
#tip{position:absolute;padding:8px 11px;max-width:250px;font-size:11px;line-height:1.4;z-index:60;
  opacity:0;transition:opacity .12s;background:var(--panel-hi);border:1px solid var(--line-strong);border-radius:7px;
  box-shadow:0 12px 30px rgba(0,0,0,.5)}
#tip .tt{font-weight:700;font-size:11.5px;margin-bottom:3px}
#tip .td{color:var(--txt-dim)}
#tip .tc{font-family:var(--mono);color:var(--amber);margin-top:5px;font-size:10.5px}

/* ---------- build hint strip ---------- */
#hint{position:absolute;bottom:146px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:11px;color:var(--txt-dim);
  letter-spacing:.03em;display:flex;gap:14px;align-items:center;white-space:nowrap}
#hint b{color:var(--txt);font-weight:600}
kbd{font-family:var(--mono);font-size:10px;padding:1.5px 5px;border:1px solid var(--line-strong);border-radius:4px;
  background:rgba(255,255,255,.05);color:var(--txt)}

/* ---------- cost ghost ---------- */
#costghost{position:absolute;font-family:var(--mono);font-size:12px;font-weight:700;pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.9);transform:translate(-50%,-140%);letter-spacing:-.01em}

/* ---------- loading ---------- */
#loader{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#141c26 0%,#080b10 62%,#04060a 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:100;transition:opacity .7s ease}
#loader .lt{font-size:11px;letter-spacing:.62em;text-transform:uppercase;color:var(--accent);font-weight:600;text-indent:.62em}
#loader .lm{font-size:38px;font-weight:200;letter-spacing:.24em;text-indent:.24em;color:#eaf2fb}
#lbar{width:296px;height:2px;background:rgba(255,255,255,.09);border-radius:2px;overflow:hidden}
#lbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent-deep),var(--accent));
  box-shadow:0 0 14px rgba(95,201,232,.7);transition:width .22s ease}
#lstat{font-family:var(--mono);font-size:10.5px;color:var(--txt-faint);letter-spacing:.05em;height:14px}
#loader .lgl{position:absolute;bottom:26px;font-size:10px;color:var(--txt-faint);letter-spacing:.2em;text-transform:uppercase}

/* ---------- start / new city dialog ---------- */
#startcard{width:min(640px,calc(100vw - 36px));padding:0;overflow:hidden;animation:fadeUp .4s cubic-bezier(.2,.9,.3,1)}
#startcard .sh{padding:24px 26px 18px;text-align:center;border-bottom:1px solid var(--line)}
#startcard .sh h1{font-size:26px;font-weight:200;letter-spacing:.2em;text-indent:.2em}
#startcard .sh p{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-top:7px;font-weight:600}
#startcard .sb{padding:20px 26px 24px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text]{background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:7px;padding:10px 12px;color:var(--txt);
  font-family:var(--sans);font-size:13.5px;outline:none;transition:border-color .15s}
.field input[type=text]:focus{border-color:rgba(95,201,232,.55)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{padding:11px 10px;border:1px solid var(--line);border-radius:8px;text-align:left;transition:all .14s;background:rgba(255,255,255,.02)}
.opt:hover{border-color:var(--line-strong);background:rgba(255,255,255,.05)}
.opt.on{border-color:rgba(95,201,232,.55);background:rgba(95,201,232,.09)}
.opt .on1{font-size:12px;font-weight:700} .opt .on2{font-size:10px;color:var(--txt-dim);margin-top:3px;line-height:1.35}
.bigbtn{padding:13px;border-radius:8px;background:linear-gradient(180deg,rgba(95,201,232,.22),rgba(43,143,179,.18));
  border:1px solid rgba(95,201,232,.5);color:#eaf7fc;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;
  transition:all .16s}
.bigbtn:hover{background:linear-gradient(180deg,rgba(95,201,232,.32),rgba(43,143,179,.26));box-shadow:0 0 24px rgba(95,201,232,.22)}
.ghostbtn{padding:11px;border-radius:8px;border:1px solid var(--line);color:var(--txt-dim);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600;transition:all .15s}
.ghostbtn:hover{border-color:var(--line-strong);color:var(--txt)}

/* ---------- milestone toast ---------- */
#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:26px 40px;text-align:center;
  opacity:0;transition:opacity .5s ease;pointer-events:none;border:1px solid rgba(240,178,63,.35);
  background:rgba(20,16,8,.86);box-shadow:0 0 60px rgba(240,178,63,.14),var(--shadow);border-radius:12px}
#toast .tk{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--amber);font-weight:700}
#toast .tv{font-size:24px;font-weight:300;letter-spacing:.12em;margin-top:9px}
#toast .tsub{font-size:11px;color:var(--txt-dim);margin-top:7px}

@media (max-width:1180px){
  #notes{display:none}
  .stat{min-width:52px}
}
@media (max-width:900px){
  #minimap{display:none}
  #infopanel{width:236px}
  #topbar{height:46px}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="ui"></div>
<script>
"use strict";
/* ==========================================================================
   METROPOLIS ENGINE
   A city-building simulation written from scratch: custom WebGL2 renderer,
   procedural architecture, road network, traffic agents and a full municipal
   economy. No external libraries, no downloaded assets — every vertex,
   shader and pixel in this file is generated at runtime.

   SECTION 1 — MATHEMATICS
   ========================================================================== */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const clamp01 = v => v < 0 ? 0 : (v > 1 ? 1 : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b - a) === 0 ? 0 : clamp01((v - a) / (b - a));
const smoothstep = (a, b, v) => { const t = invLerp(a, b, v); return t * t * (3 - 2 * t); };
const smootherstep = t => t * t * t * (t * (t * 6 - 15) + 10);

/* --- deterministic pseudo-random ------------------------------------------- */

/* --- value noise with fBm -------------------------------------------------- */
function makeNoise(seed) {
  const perm = new Uint8Array(512);

  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const grad = (h, x, y) => {
    switch (h & 7) {
      case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
      case 4: return x * 1.41421; case 5: return -x * 1.41421; case 6: return y * 1.41421; default: return -y * 1.41421;
    }

  function noise2(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = smootherstep(xf), v = smootherstep(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
    const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v) * 0.7071;

    let sum = 0, amp = 1, freq = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
      sum += noise2(x * freq, y * freq) * amp;
      norm += amp; amp *= gain; freq *= lac;
    }
    return sum / norm;
  }
  function ridged(x, y, oct) {
    let sum = 0, amp = 0.5, freq = 1, norm = 0;
    for (let i = 0; i < oct; i++) {
      const n = 1 - Math.abs(noise2(x * freq, y * freq));
      sum += n * n * amp; norm += amp; amp *= 0.5; freq *= 2.03;
    }
    return sum / norm;
  }
  return { noise2, fbm, ridged };
}

/* --- colour helpers -------------------------------------------------------- */
function hsl2rgb(h, s, l) {

/* --- formatting ------------------------------------------------------------ */
function fmtInt(n) {
  n = Math.round(n);
  const neg = n < 0; n = Math.abs(n);
  let s = String(n), out = "";
  while (s.length > 3) { out = "," + s.slice(-3) + out; s = s.slice(0, -3); }
  return (neg ? "-" : "") + s + out;
}
function fmtMoney(n) {
  const neg = n < 0; const a = Math.abs(n);
  let s;
  if (a >= 1e9) s = (a / 1e9).toFixed(2) + "B";
  else if (a >= 1e6) s = (a / 1e6).toFixed(2) + "M";
  else if (a >= 1e4) s = (a / 1e3).toFixed(1) + "K";
  else s = fmtInt(a);
  return (neg ? "-" : "") + "§" + s;
}
function fmtMoneyFull(n) { return (n < 0 ? "-" : "") + "§" + fmtInt(Math.abs(n)); }

  const a = Math.abs(n);

  if (a >= 1e4) return (n / 1e3).toFixed(0) + "K";
  if (a >= 1e3) return (n / 1e3).toFixed(1) + "K";

/* ==========================================================================
   SECTION 2 — THE RENDERER
   A small forward+shadow pipeline built directly on WebGL2:
     pass 1  depth-only render from the sun into a 2048² shadow map
     pass 2  scene into a multisampled RGBA16F buffer (sky, terrain, water,
             instanced architecture, agents, particles)
     pass 3  bright-pass + separable gaussian bloom at half and quarter res
     pass 4  ACES tonemap, vignette, grain, chromatic fringe to the backbuffer
   ========================================================================== */

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", {
  antialias: false, alpha: false, depth: true, stencil: false,
  powerPreference: "high-performance", preserveDrawingBuffer: false
});
if (!gl) {
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
    'font-family:sans-serif;color:#dce6f2;background:#0a0d12;text-align:center;padding:40px;line-height:1.7">' +
    '<div><div style="font-size:22px;font-weight:200;letter-spacing:.2em">METROPOLIS ENGINE</div>' +
    '<div style="margin-top:14px;color:#8fa1b8">This simulation requires WebGL 2. Please enable hardware acceleration ' +
    'or try a current desktop browser.</div></div></div>';
  throw new Error("WebGL2 unavailable");
}

const EXT_FLOAT = gl.getExtension("EXT_color_buffer_float");
const EXT_LINEAR = gl.getExtension("OES_texture_float_linear");
const HDR_FMT = EXT_FLOAT ? gl.RGBA16F : gl.RGBA8;
const MAX_SAMPLES = EXT_FLOAT ? Math.min(4, gl.getParameter(gl.MAX_SAMPLES)) : 0;

const Quality = {
  shadowSize: 2048,
  msaa: MAX_SAMPLES,
  bloom: true,
  pixelRatio: Math.min(window.devicePixelRatio || 1, 1.75),
  shadowDistance: 300,
  drawDistance: 1400
};

/* --------------------------------------------------------------------------
   shader plumbing
   -------------------------------------------------------------------------- */
function compileShader(type, src, tag) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    const lines = src.split("\n").map((l, i) => (i + 1) + ": " + l).join("\n");
    console.error("Shader error [" + tag + "]\n" + log + "\n" + lines);
    throw new Error("shader " + tag + ": " + log);
  }
  return sh;
}
function makeProgram(vsrc, fsrc, tag) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vsrc, tag + ".vs"));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fsrc, tag + ".fs"));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error("link " + tag + ": " + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const nm = info.name.replace(/\[0\]$/, "");
    u[nm] = gl.getUniformLocation(p, nm);
  }
  return { prog: p, u, tag };
}

/* --------------------------------------------------------------------------
   geometry containers
   -------------------------------------------------------------------------- */
const VERT_FLOATS = 10;   /* pos3 nor3 col3 mat1 */
const INST_FLOATS = 24;   /* mat4(16) tint4 params4 */

class Mesh {
  constructor(verts, indices, name) {
    this.name = name || "mesh";
    this.vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, verts instanceof Float32Array ? verts : new Float32Array(verts), gl.STATIC_DRAW);
    this.ibo = gl.createBuffer();
    const idx = indices.length > 65000 ? new Uint32Array(indices) : new Uint16Array(indices);
    this.idxType = idx instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    this.count = idx.length;
    this.vertCount = (verts.length / VERT_FLOATS) | 0;
  }
}

/* An instanced batch owns a VAO bound to a mesh plus its own instance stream. */
class Batch {
  constructor(mesh, capacity) {
    this.mesh = mesh;
    this.cap = capacity || 256;
    this.data = new Float32Array(this.cap * INST_FLOATS);
    this.n = 0;
    this.dirty = true;
    this.ibuf = gl.createBuffer();
    this.vao = gl.createVertexArray();
    this._setupVAO();
  }
  _setupVAO() {
    const g = gl;
    g.bindVertexArray(this.vao);
    g.bindBuffer(g.ARRAY_BUFFER, this.mesh.vbo);
    const S = VERT_FLOATS * 4;
    g.enableVertexAttribArray(0); g.vertexAttribPointer(0, 3, g.FLOAT, false, S, 0);
    g.enableVertexAttribArray(1); g.vertexAttribPointer(1, 3, g.FLOAT, false, S, 12);
    g.enableVertexAttribArray(2); g.vertexAttribPointer(2, 3, g.FLOAT, false, S, 24);
    g.enableVertexAttribArray(3); g.vertexAttribPointer(3, 1, g.FLOAT, false, S, 36);
    g.bindBuffer(g.ARRAY_BUFFER, this.ibuf);
    g.bufferData(g.ARRAY_BUFFER, this.data.byteLength, g.DYNAMIC_DRAW);
    const IS = INST_FLOATS * 4;
    for (let i = 0; i < 6; i++) {
      const loc = 4 + i;
      g.enableVertexAttribArray(loc);
      g.vertexAttribPointer(loc, 4, g.FLOAT, false, IS, i * 16);
      g.vertexAttribDivisor(loc, 1);
    }
    g.bindBuffer(g.ELEMENT_ARRAY_BUFFER, this.mesh.ibo);
    g.bindVertexArray(null);
  }
  grow(need) {
    if (need <= this.cap) return;
    let c = this.cap;
    while (c < need) c *= 2;
    const nd = new Float32Array(c * INST_FLOATS);
    nd.set(this.data.subarray(0, this.n * INST_FLOATS));
    this.data = nd; this.cap = c;
    gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibuf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    gl.bindVertexArray(null);
  }
  clear() { this.n = 0; this.dirty = true; }
  /* push a raw 16-float matrix plus tint/params */
  push(m, tr, tg, tb, ta, p0, p1, p2, p3) {
    this.grow(this.n + 1);
    const d = this.data, o = this.n * INST_FLOATS;
    d[o] = m[0]; d[o + 1] = m[1]; d[o + 2] = m[2]; d[o + 3] = m[3];
    d[o + 4] = m[4]; d[o + 5] = m[5]; d[o + 6] = m[6]; d[o + 7] = m[7];
    d[o + 8] = m[8]; d[o + 9] = m[9]; d[o + 10] = m[10]; d[o + 11] = m[11];
    d[o + 12] = m[12]; d[o + 13] = m[13]; d[o + 14] = m[14]; d[o + 15] = m[15];
    d[o + 16] = tr; d[o + 17] = tg; d[o + 18] = tb; d[o + 19] = ta;
    d[o + 20] = p0; d[o + 21] = p1; d[o + 22] = p2; d[o + 23] = p3;
    this.n++;
    this.dirty = true;
  }
  upload() {
    if (!this.dirty || this.n === 0) { this.dirty = false; return; }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * INST_FLOATS);
    this.dirty = false;
  }
  draw() {
    if (this.n === 0) return 0;
    this.upload();
    gl.bindVertexArray(this.vao);
    gl.drawElementsInstanced(gl.TRIANGLES, this.mesh.count, this.mesh.idxType, 0, this.n);
    return this.n;
  }
}

/* --------------------------------------------------------------------------

const GLSL_COMMON = `
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }

   -------------------------------------------------------------------------- */
const FS_BRIGHT = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 fragColor;
uniform sampler2D uTex; uniform float uThreshold, uKnee;
void main(){
  vec3 c = texture(uTex, vUV).rgb;
  float l = max(c.r, max(c.g, c.b));
  float s = clamp((l - uThreshold)/max(uKnee,1e-4), 0.0, 1.0);
  fragColor = vec4(c*s*s, 1.0);
}`;

const FS_BLUR = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 fragColor;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec2 t = uDir / vec2(textureSize(uTex,0));
  vec3 c = texture(uTex, vUV).rgb * 0.227027;
  c += (texture(uTex, vUV + t*1.3846).rgb + texture(uTex, vUV - t*1.3846).rgb) * 0.316216;
  c += (texture(uTex, vUV + t*3.2308).rgb + texture(uTex, vUV - t*3.2308).rgb) * 0.070270;
  fragColor = vec4(c, 1.0);
}`;

const FS_COMPOSITE = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 fragColor;
uniform sampler2D uScene, uBloom1, uBloom2;
uniform float uBloomAmt, uVignette, uTime, uGrain, uSaturation, uFade, uRain;
` + GLSL_COMMON + `
void main(){
  vec2 uv = vUV;
  vec2 d = uv - 0.5;
  float r2 = dot(d,d);
  /* gentle chromatic fringe toward the frame edge */
  float ca = 0.0016 * r2;
  vec3 c;
  c.r = texture(uScene, uv + d*ca).r;
  c.g = texture(uScene, uv).g;
  c.b = texture(uScene, uv - d*ca).b;

  vec3 b = texture(uBloom1, uv).rgb*0.62 + texture(uBloom2, uv).rgb*0.38;
  c += b * uBloomAmt;

  c = acesTonemap(c);
  float lum = dot(c, vec3(0.2126,0.7152,0.0722));
  c = mix(vec3(lum), c, uSaturation);
  /* filmic lift + shoulder */
  c = pow(c, vec3(0.4545));
  c = c*1.012 - 0.006;

  /* rain: sheets of fine streaks drifting across the frame */
  if (uRain > 0.01){
    float acc = 0.0;
    for (int L=0; L<3; L++){
      float fl = float(L);
      float sc = 1.0 + fl*0.7;
      vec2 ruv = uv*vec2(60.0*sc, 13.0*sc) + vec2(uTime*(2.0+fl)*1.4, -uTime*(14.0+fl*7.0));
      vec2 cellf = floor(ruv);
      float h = hash21(cellf + fl*37.0);
      float streak = smoothstep(0.986 - uRain*0.012, 1.0, h);
      float yfr = fract(ruv.y);
      acc += streak * smoothstep(0.0, 0.45, yfr) * (1.0-smoothstep(0.5, 1.0, yfr)) * (0.5 - fl*0.12);
    }
    c += vec3(0.55,0.62,0.72) * acc * uRain * 0.5;
    c *= 1.0 - uRain*0.08;
  }

  float vig = 1.0 - uVignette*smoothstep(0.16, 0.86, r2*1.9);
  c *= vig;
  float g = (hash21(uv*vec2(1920.0,1080.0) + fract(uTime))-0.5)*uGrain;
  c += g;
  c *= uFade;
  fragColor = vec4(clamp(c,0.0,1.0), 1.0);
}`;

  groundCol: [0.12, 0.13, 0.14],
  fogColor: [0.55, 0.63, 0.75],

  set(hour, cloud, rain) {

    const azim = hour * 0.26 + 0.6;
    const cosE = Math.cos(t);
    this.sunDir[0] = Math.cos(azim) * cosE * 0.86;
    this.sunDir[1] = elev;
    this.sunDir[2] = Math.sin(azim) * cosE * 0.86;
    const L = Math.hypot(this.sunDir[0], this.sunDir[1], this.sunDir[2]);
    this.sunDir[0] /= L; this.sunDir[1] /= L; this.sunDir[2] /= L;

    const day = clamp01((elev + 0.12) / 0.34);
    this.night = 1 - day;
    const dawn = clamp01(1 - Math.abs(elev - 0.06) / 0.24);

    const noonSun = [1.34, 1.24, 1.06];
    const duskSun = [1.42, 0.68, 0.30];
    const nightSun = [0.10, 0.14, 0.26];

    mix3(this.sunColor, c, noonSun, clamp01((day - 0.42) / 0.58));
    const dz = dawn * (1 - clamp01((day - 0.55) / 0.45));
    this.sunColor[0] += dz * 0.30; this.sunColor[1] += dz * 0.06;

    const topDay = [0.170, 0.360, 0.760], topDusk = [0.180, 0.190, 0.420], topNight = [0.017, 0.028, 0.070];
    const horDay = [0.640, 0.760, 0.900], horDusk = [0.900, 0.470, 0.290], horNight = [0.030, 0.048, 0.095];
    const tmp = [0, 0, 0];

    mix3(this.skyTop, tmp, topDay, clamp01((day - 0.4) / 0.6));
    mix3(tmp, horNight, horDusk, clamp01(day * 2.6));
    mix3(this.skyHorizon, tmp, horDay, clamp01((day - 0.4) / 0.6));

    const ov = clamp01((cloud - 0.42) / 0.58);
    const grey = (this.skyTop[0] + this.skyTop[1] + this.skyTop[2]) / 3;
    mix3(this.skyTop, this.skyTop, [grey * 0.95, grey * 0.99, grey * 1.06], ov * 0.72);
    const greyH = (this.skyHorizon[0] + this.skyHorizon[1] + this.skyHorizon[2]) / 3;

    this.groundCol[1] = 0.062 + day * 0.105;
    this.groundCol[2] = 0.070 + day * 0.095;

    this.fogDensity = 0.85 + ov * 0.85 + rain * 1.4 + this.night * 0.25;
    this.cloudCover = cloud;

};

  /* ---- hip roof ---- */

    b = this.vert(-x, 0, z, -1, 0.4, 0, col, mat);

  plate(w, t, d, col, mat) { return this.box(w, t, d, col, mat, { bottom: true }); }

  railing(w, d, h, col, mat, spacing) {

/* small helper: jitter a palette colour deterministically */
function tone(c, r, amt) {
  const a = amt === undefined ? 0.10 : amt;
  const f = 1 + (r - 0.5) * a * 2;
  return [clamp01(c[0] * f), clamp01(c[1] * f), clamp01(c[2] * f)];

/* ==========================================================================
   SECTION 4 — THE LAND
   Terrain synthesis (three distinct map archetypes), the ground mesh, the
   ocean sheet, the data textures the shaders read, and the natural scatter
   of trees, boulders and reeds that the city later clears away.
   ========================================================================== */

const CELL = 8;                 /* metres per grid cell */
const GRID = 128;               /* cells per side       */
const MAP = CELL * GRID;        /* 1024 m               */
const HALF = MAP / 2;
const VG = GRID + 1;            /* height vertices      */
const SEA = 0;                  /* sea level            */
const H_BIAS = -20, H_SCALE = 160;   /* height texture encoding */

const World = {
  seed: 1,
  type: "river",
  h: new Float32Array(VG * VG),
  cellH: new Float32Array(GRID * GRID),
  cellSlope: new Float32Array(GRID * GRID),
  water: new Uint8Array(GRID * GRID),
  shore: new Uint8Array(GRID * GRID),
  resource: new Uint8Array(GRID * GRID),   /* 1 fertile, 2 ore, 3 oil, 4 forest */
  mesh: null, vao: null, vbo: null, ibo: null, icount: 0,
  waterVAO: null, waterCount: 0,
  heightTex: null, overlayTex: null, lightTex: null,
  overlayData: new Uint8Array(GRID * GRID * 4),
  lightData: new Uint8Array(GRID * GRID),
  lightWork: new Float32Array(GRID * GRID),
  heightData: new Uint8Array(VG * VG),
  scatter: [],
  landCells: 0
};

const idxV = (x, z) => z * VG + x;
const idxC = (x, z) => z * GRID + x;
const inGrid = (x, z) => x >= 0 && z >= 0 && x < GRID && z < GRID;
const cellToWorld = c => (c - GRID / 2 + 0.5) * CELL;
const worldToCell = w => Math.floor(w / CELL + GRID / 2);

/* --------------------------------------------------------------------------
   generation
   -------------------------------------------------------------------------- */
function generateTerrain(seed, type) {
  World.seed = seed;
  World.type = type;
  const N = makeNoise(seed);
  const N2 = makeNoise(seed * 7919 + 13);
  const h = World.h;
  const rnd = mulberry32(seed ^ 0x9e3779b9);

  /* a meandering river spine, used by two of the three archetypes */
  const riverPhase = rnd() * TAU;
  const riverAmp = 90 + rnd() * 70;
  const riverWidth = 34 + rnd() * 18;
  const riverAxis = rnd() < 0.5 ? 0 : 1;
  function riverDist(x, z) {
    const along = riverAxis === 0 ? z : x;
    const across = riverAxis === 0 ? x : z;
    const c = Math.sin(along * 0.0062 + riverPhase) * riverAmp
      + Math.sin(along * 0.0141 + riverPhase * 2.3) * riverAmp * 0.34;
    return Math.abs(across - c);
  }

  /* coastline for the bay archetype */
  const bayAngle = rnd() * TAU;
  const bcos = Math.cos(bayAngle), bsin = Math.sin(bayAngle);

  for (let z = 0; z < VG; z++) {
    for (let x = 0; x < VG; x++) {
      const wx = (x - GRID / 2) * CELL;
      const wz = (z - GRID / 2) * CELL;
      const nx = wx / MAP, nz = wz / MAP;

      /* gentle rolling base — the buildable plain */
      let base = N.fbm(nx * 3.1, nz * 3.1, 5, 2.02, 0.5) * 13.0;
      base += N.fbm(nx * 8.4 + 11, nz * 8.4 - 4, 4, 2.1, 0.5) * 3.4;

      /* mountains framing the far edges keep the view composed */
      const edge = Math.max(Math.abs(nx), Math.abs(nz)) * 2;
      const frame = smoothstep(0.72, 1.02, edge);
      const ridge = N.ridged(nx * 2.4 + 40, nz * 2.4 - 17, 5);
      base += frame * (16 + ridge * 96);

      /* a broad low bowl at the centre so the first settlement sits flat */
      const dc = Math.hypot(nx, nz) * 2;
      base *= lerp(0.34, 1.0, smoothstep(0.10, 0.62, dc));
      base += 3.4;

      if (type === "river") {
        const d = riverDist(wx, wz);
        const cut = smoothstep(riverWidth * 2.4, riverWidth * 0.55, d);
        base = lerp(base, -7.5 - N2.fbm(nx * 6, nz * 6, 3, 2, 0.5) * 3.5, cut);
        /* flood plain terraces along the banks */
        const terrace = smoothstep(riverWidth * 3.6, riverWidth * 2.0, d) * (1 - cut);
        base = lerp(base, base * 0.55 + 1.6, terrace * 0.8);
      } else if (type === "bay") {
        const proj = wx * bcos + wz * bsin;
        const inlet = Math.sin(( -wx * bsin + wz * bcos) * 0.0105 + riverPhase) * 74;
        const coast = 96 + inlet + N.fbm(nx * 5.2 + 3, nz * 5.2 + 9, 4, 2, 0.5) * 64;
        const t = smoothstep(coast - 46, coast + 120, proj);
        base = lerp(base, -16 - t * 22, t);
        const beach = smoothstep(coast + 30, coast - 40, proj);
        base = lerp(base, base * 0.5 + 0.9, clamp01(beach) * 0.55 * (1 - t));
      } else { /* highland: a lake basin ringed by hills */
        const lx = Math.sin(riverPhase) * 150, lz = Math.cos(riverPhase * 1.7) * 130;
        const dl = Math.hypot(wx - lx, wz - lz) / (140 + N.fbm(nx * 6, nz * 6, 3, 2, 0.5) * 60);
        const lake = smoothstep(1.05, 0.45, dl);
        base = lerp(base, -9.0, lake);
        base += smoothstep(0.55, 1.35, dl) * 9.5;
        const d = riverDist(wx, wz);
        const creek = smoothstep(20.0, 6.0, d);
        base = lerp(base, Math.min(base, -2.4), creek * 0.9);
      }
      h[idxV(x, z)] = base;
    }
  }

  /* two smoothing passes — removes noise spikes, keeps the silhouette */
  const tmp = new Float32Array(h.length);
  for (let pass = 0; pass < 2; pass++) {
    tmp.set(h);
    for (let z = 1; z < VG - 1; z++) {
      for (let x = 1; x < VG - 1; x++) {
        const i = idxV(x, z);
        h[i] = (tmp[i] * 4 + tmp[i - 1] + tmp[i + 1] + tmp[i - VG] + tmp[i + VG]) / 8;
      }
    }
  }

  recomputeCells();
  scatterNature(seed);
  placeResources(seed);
}

function recomputeCells() {
  const h = World.h;
  World.landCells = 0;
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const a = h[idxV(x, z)], b = h[idxV(x + 1, z)], c = h[idxV(x, z + 1)], d = h[idxV(x + 1, z + 1)];
      const avg = (a + b + c + d) * 0.25;
      const mn = Math.min(a, b, c, d), mx = Math.max(a, b, c, d);
      const i = idxC(x, z);
      World.cellH[i] = avg;
      World.cellSlope[i] = (mx - mn) / CELL;
      World.water[i] = avg < SEA ? 1 : 0;
      if (!World.water[i]) World.landCells++;
    }
  }
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      let s = 0;
      if (!World.water[i]) {
        for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, nz = z + dz;
          if (inGrid(nx, nz) && World.water[idxC(nx, nz)]) s = 1;
        }
      }
      World.shore[i] = s;
    }
  }
}

function heightAt(wx, wz) {
  const fx = clamp(wx / CELL + GRID / 2, 0, GRID - 0.0001);
  const fz = clamp(wz / CELL + GRID / 2, 0, GRID - 0.0001);
  const x0 = Math.floor(fx), z0 = Math.floor(fz);
  const tx = fx - x0, tz = fz - z0;
  const h = World.h;
  const a = h[idxV(x0, z0)], b = h[idxV(x0 + 1, z0)], c = h[idxV(x0, z0 + 1)], d = h[idxV(x0 + 1, z0 + 1)];
  return lerp(lerp(a, b, tx), lerp(c, d, tx), tz);
}
function cellHeight(cx, cz) { return inGrid(cx, cz) ? World.cellH[idxC(cx, cz)] : 0; }
/* Highest of a cell's four corners. Surfaces laid on the ground sit on this,

function cellTopH(cx, cz) {
  if (!inGrid(cx, cz)) return 0;
  const h = World.h;
  return Math.max(h[idxV(cx, cz)], h[idxV(cx + 1, cz)], h[idxV(cx, cz + 1)], h[idxV(cx + 1, cz + 1)]);
}
function isWater(cx, cz) { return !inGrid(cx, cz) || World.water[idxC(cx, cz)] === 1; }

/* Flatten the four corners of a cell to a target height — used when roads

function flattenCell(cx, cz, target, strength) {
  const s = strength === undefined ? 1 : strength;
  const h = World.h;
  for (let dz = 0; dz <= 1; dz++) for (let dx = 0; dx <= 1; dx++) {
    const i = idxV(cx + dx, cz + dz);
    h[i] = lerp(h[i], target, s);

}

  const h = World.h;
  for (let z = Math.max(0, cz - r); z <= Math.min(GRID - 1, cz + r); z++) {
    for (let x = Math.max(0, cx - r); x <= Math.min(GRID - 1, cx + r); x++) {
      const a = h[idxV(x, z)], b = h[idxV(x + 1, z)], c = h[idxV(x, z + 1)], d = h[idxV(x + 1, z + 1)];
      const i = idxC(x, z);
      World.cellH[i] = (a + b + c + d) * 0.25;
      World.cellSlope[i] = (Math.max(a, b, c, d) - Math.min(a, b, c, d)) / CELL;
      World.water[i] = World.cellH[i] < SEA ? 1 : 0;
    }
  }
}

/* --------------------------------------------------------------------------
   natural scatter
   -------------------------------------------------------------------------- */
function scatterNature(seed) {
  const rnd = mulberry32(seed * 31 + 7);
  const N = makeNoise(seed + 991);
  World.scatter.length = 0;
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      if (World.water[i]) continue;
      const wx = cellToWorld(x), wz = cellToWorld(z);
      const dens = N.fbm(wx / MAP * 6.5, wz / MAP * 6.5, 4, 2, 0.5) * 0.5 + 0.5;
      const alt = World.cellH[i];
      const slope = World.cellSlope[i];
      let treeChance = dens * 1.35 - 0.34;
      treeChance *= smoothstep(78, 46, alt);
      treeChance *= smoothstep(0.85, 0.30, slope);
      if (alt < 1.2) treeChance *= 0.35;
      const count = treeChance > 0 ? Math.floor(treeChance * 2.1 + rnd() * 0.85) : 0;
      for (let k = 0; k < count; k++) {
        const px = wx + (rnd() - 0.5) * CELL * 0.92;
        const pz = wz + (rnd() - 0.5) * CELL * 0.92;
        const r = rnd();
        World.scatter.push({
          x: px, z: pz, cell: i,
          kind: r < 0.62 ? 0 : (r < 0.84 ? 1 : 2),   /* broadleaf / conifer / shrub */
          s: 0.62 + rnd() * 0.62,
          rot: rnd() * TAU,
          seed: rnd(),
          gone: 0
        });
      }
      if (slope > 0.55 && rnd() < 0.16) {
        World.scatter.push({
          x: wx + (rnd() - 0.5) * 5, z: wz + (rnd() - 0.5) * 5, cell: i,
          kind: 3, s: 0.6 + rnd() * 1.5, rot: rnd() * TAU, seed: rnd(), gone: 0
        });
      }
      if (World.shore[i] && rnd() < 0.30) {
        World.scatter.push({
          x: wx + (rnd() - 0.5) * 6, z: wz + (rnd() - 0.5) * 6, cell: i,
          kind: 4, s: 0.7 + rnd() * 0.6, rot: rnd() * TAU, seed: rnd(), gone: 0
        });
      }
    }
  }
}

function placeResources(seed) {
  const N = makeNoise(seed + 4441);
  const N2 = makeNoise(seed + 8123);
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const i = idxC(x, z);
      World.resource[i] = 0;
      if (World.water[i]) continue;
      const u = x / GRID, v = z / GRID;
      const ore = N.fbm(u * 4.1 + 9, v * 4.1 - 3, 3, 2, 0.5);
      const oil = N2.fbm(u * 3.4 - 6, v * 3.4 + 5, 3, 2, 0.5);
      const fert = N.fbm(u * 5.2 + 21, v * 5.2 + 33, 4, 2, 0.5);
      if (ore > 0.30 && World.cellSlope[i] > 0.10) World.resource[i] = 2;
      else if (oil > 0.33) World.resource[i] = 3;
      else if (fert > 0.20 && World.cellH[i] < 26 && World.cellSlope[i] < 0.22) World.resource[i] = 1;
    }
  }
}

/* --------------------------------------------------------------------------
   ground mesh
   -------------------------------------------------------------------------- */
function buildTerrainMesh() {
  const verts = new Float32Array(VG * VG * 6);
  const h = World.h;
  for (let z = 0; z < VG; z++) {
    for (let x = 0; x < VG; x++) {
      const i = idxV(x, z);
      const o = i * 6;
      const wx = (x - GRID / 2) * CELL, wz = (z - GRID / 2) * CELL;
      const hl = h[idxV(Math.max(x - 1, 0), z)], hr = h[idxV(Math.min(x + 1, VG - 1), z)];
      const hd = h[idxV(x, Math.max(z - 1, 0))], hu = h[idxV(x, Math.min(z + 1, VG - 1))];
      let nx = hl - hr, ny = 2 * CELL, nz = hd - hu;
      const L = Math.hypot(nx, ny, nz);
      verts[o] = wx; verts[o + 1] = h[i]; verts[o + 2] = wz;
      verts[o + 3] = nx / L; verts[o + 4] = ny / L; verts[o + 5] = nz / L;
    }
  }
  const idx = new Uint32Array(GRID * GRID * 6);
  let p = 0;
  for (let z = 0; z < GRID; z++) {
    for (let x = 0; x < GRID; x++) {
      const a = idxV(x, z), b = idxV(x + 1, z), c = idxV(x + 1, z + 1), d = idxV(x, z + 1);
      idx[p++] = a; idx[p++] = d; idx[p++] = c;
      idx[p++] = a; idx[p++] = c; idx[p++] = b;
    }
  }
  if (!World.vao) {
    World.vao = gl.createVertexArray();
    World.vbo = gl.createBuffer();
    World.ibo = gl.createBuffer();
    gl.bindVertexArray(World.vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, World.vbo);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, World.ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
  } else {
    gl.bindBuffer(gl.ARRAY_BUFFER, World.vbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
  }
  World.icount = idx.length;
  uploadHeightTexture();
}

function buildWaterMesh() {
  const S = 96;                       /* subdivisions */
  const EXT = MAP * 1.9;              /* extends past the map for an open horizon */
  const verts = new Float32Array((S + 1) * (S + 1) * 2);
  let p = 0;
  for (let z = 0; z <= S; z++) {
    for (let x = 0; x <= S; x++) {
      /* densify toward the centre where the shoreline detail matters */
      const u = x / S * 2 - 1, v = z / S * 2 - 1;
      const su = Math.sign(u) * Math.pow(Math.abs(u), 1.7);
      const sv = Math.sign(v) * Math.pow(Math.abs(v), 1.7);
      verts[p++] = su * EXT * 0.5;
      verts[p++] = sv * EXT * 0.5;
    }
  }
  const idx = new Uint32Array(S * S * 6);
  let q = 0;
  for (let z = 0; z < S; z++) {
    for (let x = 0; x < S; x++) {
      const a = z * (S + 1) + x, b = a + 1, c = a + S + 2, d = a + S + 1;
      idx[q++] = a; idx[q++] = d; idx[q++] = c;
      idx[q++] = a; idx[q++] = c; idx[q++] = b;
    }
  }
  World.waterVAO = gl.createVertexArray();
  gl.bindVertexArray(World.waterVAO);
  const vb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vb);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  World.waterCount = idx.length;
}

function initWorldTextures() {
  World.heightTex = makeDataTex(VG, gl.R8, gl.RED, gl.UNSIGNED_BYTE, gl.LINEAR);

function uploadHeightTexture() {
  const d = World.heightData, h = World.h;
  for (let i = 0; i < h.length; i++) d[i] = clamp(((h[i] - H_BIAS) / H_SCALE) * 255, 0, 255) | 0;
  gl.bindTexture(gl.TEXTURE_2D, World.heightTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

}

  gl.bindTexture(gl.TEXTURE_2D, World.overlayTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GRID, GRID, gl.RGBA, gl.UNSIGNED_BYTE, World.overlayData);
}

  gl.bindTexture(gl.TEXTURE_2D, World.lightTex);

  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, GRID, GRID, gl.RED, gl.UNSIGNED_BYTE, World.lightData);
}

/* ray/terrain intersection by marching then bisecting */
function pickTerrain(ray) {
  const o = ray.o, d = ray.d;
  let t = 0;
  /* jump the ray to the map's vertical slab first */
  if (o[1] > 120 && d[1] < 0) t = (120 - o[1]) / d[1];
  let prev = o[1] + d[1] * t - heightAt(o[0] + d[0] * t, o[2] + d[2] * t);
  const maxT = 3000;
  const step = 3.0;
  for (; t < maxT; t += step) {
    const px = o[0] + d[0] * t, py = o[1] + d[1] * t, pz = o[2] + d[2] * t;
    if (py < -60) break;
    const diff = py - heightAt(px, pz);
    if (diff <= 0 && prev > 0) {
      let lo = t - step, hi = t;
      for (let k = 0; k < 24; k++) {
        const mid = (lo + hi) * 0.5;
        const mx = o[0] + d[0] * mid, my = o[1] + d[1] * mid, mz = o[2] + d[2] * mid;
        if (my - heightAt(mx, mz) > 0) lo = mid; else hi = mid;
      }
      const ft = (lo + hi) * 0.5;
      return { x: o[0] + d[0] * ft, y: o[1] + d[1] * ft, z: o[2] + d[2] * ft, t: ft };
    }
    prev = diff;
  }
  /* fall back to the sea plane so the cursor never disappears */
  if (d[1] < -1e-4) {
    const ts = (SEA - o[1]) / d[1];
    if (ts > 0) return { x: o[0] + d[0] * ts, y: SEA, z: o[2] + d[2] * ts, t: ts };
  }
  return null;
}
/* ==========================================================================
   SECTION 5A — ASSET WORKSHOP: SURFACES, TRAFFIC, NATURE
   Road pieces are generated per connectivity mask so junctions, curves and
   dead ends all carry correct kerbs, crossings and lane markings.
   ========================================================================== */

const Assets = { M: {}, B: {}, order: [] };

function regMesh(name, mb) {
  if (mb.isEmpty()) { console.warn("empty mesh", name); }
  Assets.M[name] = mb.build(name);
  return Assets.M[name];
}
function batch(name, cap) {
  let b = Assets.B[name];
  if (!b) {
    const m = Assets.M[name];
    if (!m) throw new Error("no mesh " + name);
    b = Assets.B[name] = new Batch(m, cap || 64);
    Assets.order.push(name);
  }
  return b;
}

/* --------------------------------------------------------------------------
   ROADS
   -------------------------------------------------------------------------- */
const ROAD_TYPES = [
  { id: 0, key: "street", name: "Two-Lane Street", cw: 5.4, lanes: 1, speed: 10.5, cost: 60, upkeep: 0.16, cap: 14, noise: 0.35 },
  { id: 1, key: "avenue", name: "Boulevard", cw: 6.6, lanes: 2, speed: 15.0, cost: 190, upkeep: 0.5, cap: 34, noise: 0.6 },
  { id: 2, key: "highway", name: "Highway", cw: 7.2, lanes: 3, speed: 26.0, cost: 420, upkeep: 1.1, cap: 72, noise: 1.0 }
];

const DIRS = [
  { dx: 0, dz: -1, bit: 1, ang: 0 },
  { dx: 1, dz: 0, bit: 2, ang: Math.PI / 2 },
  { dx: 0, dz: 1, bit: 4, ang: Math.PI },
  { dx: -1, dz: 0, bit: 8, ang: -Math.PI / 2 }
];

/* helper: a flat quad in the xz plane at height y */
function slab(mb, x0, z0, x1, z1, y, col, mat) {
  mb.quad([x0, y, z1], [x1, y, z1], [x1, y, z0], [x0, y, z0], col, mat);
}

function buildRoadPiece(type, mask) {
  const T = ROAD_TYPES[type];
  const mb = new MB();
  const half = CELL / 2;
  const hw = T.cw / 2;
  const kerbH = type === 2 ? 0.28 : 0.17;
  const road = type === 2 ? PAL.asphalt : (type === 1 ? PAL.asphaltWorn : PAL.asphalt);
  const walk = PAL.sidewalk;
  const deg = DIRS.reduce((a, d) => a + ((mask & d.bit) ? 1 : 0), 0);

  /* foundation — hides the terrain step between neighbouring cells */
  mb.push(); mb.translate(0, -1.6, 0);
  mb.box(CELL, 1.62, CELL, [0.20, 0.20, 0.21], MAT.PLAIN, { noTop: true });
  mb.pop();

  /* carriageway: central square plus one arm per connection */
  slab(mb, -hw, -hw, hw, hw, 0.02, road, MAT.PLAIN);
  for (const d of DIRS) {
    if (!(mask & d.bit)) continue;
    if (d.dz === -1) slab(mb, -hw, -half, hw, -hw, 0.02, road, MAT.PLAIN);
    if (d.dz === 1) slab(mb, -hw, hw, hw, half, 0.02, road, MAT.PLAIN);
    if (d.dx === 1) slab(mb, hw, -hw, half, hw, 0.02, road, MAT.PLAIN);
    if (d.dx === -1) slab(mb, -half, -hw, -hw, hw, 0.02, road, MAT.PLAIN);
  }

  /* pavement: four corner pads, plus a full strip where no road continues */
  function pad(x0, z0, x1, z1) {
    mb.push();
    mb.translate((x0 + x1) / 2, 0, (z0 + z1) / 2);
    mb.box(Math.abs(x1 - x0), kerbH, Math.abs(z1 - z0), type === 2 ? PAL.concreteDark : walk, MAT.PLAIN,
      { topCol: type === 2 ? PAL.concreteDark : walk });
    mb.pop();
  }
  pad(-half, -half, -hw, -hw); pad(hw, -half, half, -hw);
  pad(-half, hw, -hw, half); pad(hw, hw, half, half);
  if (!(mask & 1)) pad(-hw, -half, hw, -hw);
  if (!(mask & 4)) pad(-hw, hw, hw, half);
  if (!(mask & 2)) pad(hw, -hw, half, hw);
  if (!(mask & 8)) pad(-half, -hw, -hw, hw);

  /* ---- lane markings ---- */
  const yM = 0.035;
  const white = PAL.paintWhite, yellow = PAL.paintYellow;
  function stripe(x0, z0, x1, z1, col) { slab(mb, x0, z0, x1, z1, yM, col, MAT.MARKING); }

  for (const d of DIRS) {
    if (!(mask & d.bit)) continue;
    const along = d.dz !== 0 ? "z" : "x";
    const s0 = hw, s1 = half;
    const dir = (d.dx + d.dz) > 0 ? 1 : -1;
    /* centre line */
    if (type === 0) {
      const dash = 1.05, gap = 0.95;
      for (let t = s0; t < s1; t += dash + gap) {
        const a = t, b = Math.min(t + dash, s1);
        if (along === "z") stripe(-0.075, dir * a, 0.075, dir * b, white);
        else stripe(dir * a, -0.075, dir * b, 0.075, white);
      }
    } else if (type === 1) {
      /* raised median with a planting strip */
      const w = 0.62;
      if (along === "z") {
        mb.push(); mb.translate(0, 0, dir * (s0 + s1) / 2);
        mb.box(w, 0.14, s1 - s0, PAL.concrete, MAT.PLAIN, { topCol: [0.30, 0.38, 0.22] });
        mb.pop();
      } else {
        mb.push(); mb.translate(dir * (s0 + s1) / 2, 0, 0);
        mb.box(s1 - s0, 0.14, w, PAL.concrete, MAT.PLAIN, { topCol: [0.30, 0.38, 0.22] });
        mb.pop();
      }
      /* outer lane divider */
      for (const side of [-1, 1]) {
        const o = side * (hw * 0.5);
        const dash = 1.2, gap = 1.1;
        for (let t = s0; t < s1; t += dash + gap) {
          const a = t, b = Math.min(t + dash, s1);
          if (along === "z") stripe(o - 0.06, dir * a, o + 0.06, dir * b, white);
          else stripe(dir * a, o - 0.06, dir * b, o + 0.06, white);
        }
      }
    } else {
      /* highway: solid edge lines plus dashed lane divisions */
      for (const side of [-1, 1]) {
        const o = side * (hw - 0.30);
        if (along === "z") stripe(o - 0.08, dir * s0, o + 0.08, dir * s1, white);
        else stripe(dir * s0, o - 0.08, dir * s1, o + 0.08, white);
      }
      for (const o of [-hw * 0.33, hw * 0.33]) {
        const dash = 1.6, gap = 1.5;
        for (let t = s0; t < s1; t += dash + gap) {
          const a = t, b = Math.min(t + dash, s1);
          if (along === "z") stripe(o - 0.06, dir * a, o + 0.06, dir * b, white);
          else stripe(dir * a, o - 0.06, dir * b, o + 0.06, white);
        }
      }
      /* jersey barrier along unconnected sides */
      for (const dd of DIRS) {
        if (mask & dd.bit) continue;
        mb.push();
        mb.translate(dd.dx * (hw + 0.24), 0, dd.dz * (hw + 0.24));
        if (dd.dx !== 0) mb.box(0.32, 0.72, CELL, PAL.concrete, MAT.PLAIN);
        else mb.box(CELL, 0.72, 0.32, PAL.concrete, MAT.PLAIN);
        mb.pop();
      }
    }
  }

  /* crossings and stop bars at junctions */
  if (deg >= 3 && type !== 2) {
    for (const d of DIRS) {
      if (!(mask & d.bit)) continue;
      const dir = (d.dx + d.dz) > 0 ? 1 : -1;
      const base = hw + 0.35;
      /* zebra */
      const n = 5;
      for (let k = 0; k < n; k++) {
        const o = -hw + 0.42 + (k * (T.cw - 0.84)) / (n - 1);
        if (d.dz !== 0) stripe(o - 0.20, dir * base, o + 0.20, dir * (base + 1.25), white);
        else stripe(dir * base, o - 0.20, dir * (base + 1.25), o + 0.20, white);
      }
      /* stop bar */
      const sb = base + 1.5;
      if (d.dz !== 0) stripe(dir > 0 ? 0.12 : -hw + 0.1, dir * sb, dir > 0 ? hw - 0.1 : -0.12, dir * (sb + 0.24), white);
      else stripe(dir * sb, dir > 0 ? -hw + 0.1 : 0.12, dir * (sb + 0.24), dir > 0 ? -0.12 : hw - 0.1, white);
    }
  }
  /* dead end: turning head marking */
  if (deg === 1 && type !== 2) {
    for (const d of DIRS) {
      if (!(mask & d.bit)) continue;
      const dir = (d.dx + d.dz) > 0 ? 1 : -1;
      if (d.dz !== 0) stripe(-hw + 0.3, -dir * (hw - 0.5), hw - 0.3, -dir * (hw - 0.2), white);
      else stripe(-dir * (hw - 0.5), -hw + 0.3, -dir * (hw - 0.2), hw - 0.3, white);
    }
  }
  return mb;
}

function buildBusStop() {

function buildBroadleaf(rnd) {
  const mb = new MB();
  const trunkH = 2.0 + rnd() * 1.1;
  mb.cylinder(0.24, 0.15, trunkH, 6, PAL.trunk, MAT.PLAIN, { bottom: true });
  /* a few branch stubs give the canopy something to sit on */
  for (let k = 0; k < 3; k++) {
    const a = rnd() * TAU;
    mb.push();
    mb.translate(0, trunkH * 0.72, 0); mb.rotateY(a); mb.rotateZ(0.75);
    mb.cylinder(0.09, 0.05, 0.9, 5, PAL.trunk, MAT.PLAIN);
    mb.pop();
  }
  const cols = [PAL.foliageA, PAL.foliageB, PAL.foliageC];
  const blobs = 3 + ((rnd() * 2) | 0);
  for (let k = 0; k < blobs; k++) {
    const r = 1.15 + rnd() * 0.75;
    const a = (k / blobs) * TAU + rnd();
    const rad = k === 0 ? 0 : 0.55 + rnd() * 0.5;
    mb.push();
    mb.translate(Math.cos(a) * rad, trunkH + 0.7 + rnd() * 0.7, Math.sin(a) * rad);
    mb.scale(1, 0.86, 1);
    mb.sphere(r, 7, 5, tone(cols[(rnd() * 3) | 0], rnd(), 0.22), MAT.FOLIAGE);
    mb.pop();
  }
  return mb;
}
function buildConifer(rnd) {
  const mb = new MB();
  const h = 5.5 + rnd() * 3.5;
  mb.cylinder(0.26, 0.14, h * 0.34, 6, [0.24, 0.19, 0.15], MAT.PLAIN, { bottom: true });
  const tiers = 4 + ((rnd() * 2) | 0);
  for (let k = 0; k < tiers; k++) {
    const t = k / tiers;
    const y = h * (0.18 + t * 0.68);
    const r = lerp(1.5, 0.32, t) * (0.9 + rnd() * 0.2);
    mb.push(); mb.translate(0, y, 0);
    mb.cylinder(r, r * 0.16, h * 0.30, 7, tone([0.19, 0.36, 0.20], rnd(), 0.24), MAT.FOLIAGE, { smooth: false });
    mb.pop();
  }
  return mb;
}

   -------------------------------------------------------------------------- */
function carBody(mb, L, W, H, style, col) {
  const dark = [0.09, 0.09, 0.10];
  const wheelR = 0.34, wheelW = 0.24;
  /* lower body with chamfered flanks */
  mb.push(); mb.translate(0, 0.30, 0);
  mb.chamferBox(W, H, L, 0.11, col, MAT.PAINT);
  mb.pop();
  /* sills darken the underside */
  mb.push(); mb.translate(0, 0.20, 0); mb.box(W * 0.97, 0.14, L * 0.96, dark, MAT.PLAIN, { bottom: true }); mb.pop();
  /* greenhouse */
  const gh = style === "van" ? 0.72 : 0.52;
  const ghL = style === "van" ? L * 0.66 : L * 0.48;
  const ghZ = style === "pickup" ? -L * 0.14 : (style === "van" ? -L * 0.02 : L * 0.02);
  mb.push(); mb.translate(0, 0.30 + H, ghZ);
  mb.chamferBox(W * 0.88, gh, ghL, 0.10, [0.10, 0.12, 0.15], MAT.VGLASS);
  mb.pop();
  /* roof panel in body colour */
  mb.push(); mb.translate(0, 0.30 + H + gh, ghZ);
  mb.box(W * 0.80, 0.05, ghL * 0.86, col, MAT.PAINT, { bottom: true });
  mb.pop();
  if (style === "pickup") {
    mb.push(); mb.translate(0, 0.30 + H, L * 0.24);
    mb.box(W * 0.92, 0.30, L * 0.42, col, MAT.PAINT, { bottom: true, noTop: true });
    mb.pop();
  }
  /* wheels */
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    mb.push();
    mb.translate(sx * (W / 2 - wheelW * 0.42), wheelR, sz * L * 0.31);
    mb.rotateZ(Math.PI / 2);
    mb.cylinder(wheelR, wheelR, wheelW, 9, [0.06, 0.06, 0.07], MAT.PLAIN, { bottom: true, smooth: false });
    mb.translate(0, wheelW * 0.5 + 0.005, 0);
    mb.cylinder(wheelR * 0.56, wheelR * 0.56, 0.02, 8, [0.55, 0.57, 0.60], MAT.METAL, { bottom: true });
    mb.pop();
  }
  /* lamps */
  for (const sx of [-1, 1]) {
    mb.push(); mb.translate(sx * W * 0.33, 0.52, -L / 2 - 0.01);
    mb.box(W * 0.24, 0.14, 0.05, [1.0, 0.96, 0.86], MAT.LAMP, { bottom: true });
    mb.pop();
    mb.push(); mb.translate(sx * W * 0.34, 0.56, L / 2 + 0.01);
    mb.box(W * 0.22, 0.11, 0.05, [0.95, 0.14, 0.10], MAT.LAMP, { bottom: true });
    mb.pop();
  }
}
