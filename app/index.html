<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gridiron GM</title>
  <meta name="description" content="An NFL franchise sim with real 2026 rosters, contracts and a play-by-play engine." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #05070d; }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 20%, #12305e 0%, #05070d 65%); color: #e8eefc; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; z-index: 1000; transition: opacity .6s; overflow: hidden; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .field { position: absolute; left: -50%; right: -50%; bottom: -35%; height: 75%; transform: perspective(600px) rotateX(72deg); background: repeating-linear-gradient(0deg, #1d5428 0 70px, #22622f 70px 140px); animation: turf 2.2s linear infinite; mask-image: linear-gradient(0deg, #000 30%, transparent); }
    @keyframes turf { to { background-position: 0 140px; } }
    #boot .ball { width: 70px; height: 42px; margin: 0 auto 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #b8642b, #6e3410); box-shadow: 0 20px 40px rgba(0,0,0,.6); position: relative; animation: spinball 1.1s linear infinite; }
    #boot .ball::after { content: ''; position: absolute; left: 22px; right: 22px; top: 19px; height: 3px; background: #fff; border-radius: 2px; box-shadow: 0 -6px 0 -1px transparent; }
    @keyframes spinball { 0% { transform: rotate(-25deg) scaleX(1); } 50% { transform: rotate(-25deg) scaleX(.55); } 100% { transform: rotate(-25deg) scaleX(1); } }
    #boot h1 { margin: 0; font-size: clamp(48px, 9vw, 104px); font-weight: 900; letter-spacing: .04em; text-transform: uppercase; line-height: .9; background: linear-gradient(180deg, #fff, #9fb2dc); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 10px 40px rgba(0,0,0,.5); }
    #boot .bar { width: min(420px, 80vw); height: 6px; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; margin: 26px auto 10px; }
    #boot .bar i { display: block; height: 100%; width: 4%; background: linear-gradient(90deg, #3b82f6, #f5c542); border-radius: 99px; transition: width .25s; }
    #boot .msg { font: 600 13px Inter, system-ui, sans-serif; color: #8e9bbb; letter-spacing: .08em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="boot"><div class="field"></div><div style="position:relative;text-align:center"><div class="ball"></div><h1>Gridiron GM</h1><div class="bar"><i id="boot-bar"></i></div><div class="msg" id="boot-msg">Loading the league…</div></div></div>
  <div id="root"></div>
  <script type="module" src="/main.tsx"></script>
</body>
</html>
