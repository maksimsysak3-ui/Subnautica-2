/* ======================= 35. AUDIO ENGINE ============================= */
(function(){
  let AC=null, master, uwFilt, busAmb, busMus, busSfx, noiseBuf, seaSrc, seaFilt, seaGain, windSrc, windFilt, windGain, rainGain;
  let muted=false, musicNext=0, chordI=0;
  function guard(){ return AC && AC.state==='running'; }
  function applyMute(){ const v=(typeof Settings!=='undefined'?Settings.volume:0.85); if(master&&AC) master.gain.setTargetAtTime(muted?0:0.85*v, AC.currentTime, 0.05); }
  function mkNoise(){ noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=noiseBuf.getChannelData(0); let last=0;
    for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2; } }
  function loopNoise(filtType,freq,q,gv){ const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=AC.createBiquadFilter(); f.type=filtType; f.frequency.value=freq; if(q)f.Q.value=q;
    const g=AC.createGain(); g.gain.value=gv; s.connect(f); f.connect(g); g.connect(busAmb); s.start(); return {s,f,g}; }
  function env(node,when,att,dur,peak){ const g=node; g.gain.cancelScheduledValues(when); g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,peak),when+att); g.gain.exponentialRampToValueAtTime(0.0001,when+dur); }
  function voice(freq,when,dur,peak,type,bus){ if(!guard())return; const o=AC.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
    const g=AC.createGain(); o.connect(g); g.connect(bus||busMus); env(g,when,Math.min(0.3,dur*0.3),dur,peak); o.start(when); o.stop(when+dur+0.05); }
  function noiseHit(when,dur,f0,f1,peak,type){ if(!guard())return; const s=AC.createBufferSource(); s.buffer=noiseBuf;
    const f=AC.createBiquadFilter(); f.type=type||'lowpass'; f.frequency.setValueAtTime(f0,when); f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),when+dur);
    const g=AC.createGain(); s.connect(f); f.connect(g); g.connect(busSfx); env(g,when,0.01,dur,peak); s.start(when); s.stop(when+dur+0.05); }
  const impl={
    _ready:false, muted:false,
    ensure(){ if(AC){ if(AC.state==='suspended') AC.resume(); return; }
      try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
      master=AC.createGain(); master.gain.value=0.85*(typeof Settings!=='undefined'?Settings.volume:1); master.connect(AC.destination);
      uwFilt=AC.createBiquadFilter(); uwFilt.type='lowpass'; uwFilt.frequency.value=20000; uwFilt.connect(master);
      busAmb=AC.createGain(); busAmb.gain.value=0.55; busAmb.connect(uwFilt);
      busMus=AC.createGain(); busMus.gain.value=0.22; busMus.connect(uwFilt);
      busSfx=AC.createGain(); busSfx.gain.value=0.6; busSfx.connect(master);
      mkNoise();
      const sea=loopNoise('lowpass',600,0,0.0); seaSrc=sea.s; seaFilt=sea.f; seaGain=sea.g;
      const wind=loopNoise('bandpass',500,0.8,0.0); windSrc=wind.s; windFilt=wind.f; windGain=wind.g;
      const rain=loopNoise('highpass',2600,0.5,0.0); rainGain=rain.g;
      this._ready=true; muted=this.muted; applyMute();
    },
    tick(dt){ if(!guard()) return; const t=AC.currentTime;
      const swell=0.62+0.38*Math.sin(Game.t*0.5)+0.12*Math.sin(Game.t*0.17);
      seaGain.gain.setTargetAtTime((0.10+world.seaState*0.5)*swell,t,0.4);
      seaFilt.frequency.setTargetAtTime(380+world.seaState*950,t,0.5);
      windGain.gain.setTargetAtTime(0.02+world.windStr*0.16,t,0.5);
      windFilt.frequency.setTargetAtTime(280+world.windStr*950,t,0.5);
      rainGain.gain.setTargetAtTime(world.rainI*0.16,t,0.3);
      uwFilt.frequency.setTargetAtTime(Game.screen==='fish'?680:20000,t,0.25);
      busMus.gain.setTargetAtTime(Game.screen==='fish'?0.14:0.2,t,0.4);
      if(t>=musicNext) this._music(t);
      if(Game.screen==='sail' && Math.random()<dt*0.12) this.gull();
    },
    _music(t){ const bpm=Game.screen==='fish'?38:50; const beat=60/bpm*2; musicNext=t+beat;
      const base={north:174.6,trop:220.0,med:196.0}[regionData().id]||196;
      const prog=[[0,3,7],[-2,3,7],[3,7,10],[-4,0,7]]; const ch=prog[chordI%prog.length]; chordI++;
      for(let i=0;i<ch.length;i++){ const f=base*Math.pow(2,ch[i]/12); voice(f,t+i*0.02,beat*1.7,0.10-i*0.015,i?'sine':'triangle',busMus); }
      if(chordI%2===0) voice(base*Math.pow(2,(ch[0]+12)/12),t+beat*0.5,beat*0.9,0.05,'sine',busMus);
    },
    splash(){ if(!guard())return; const t=AC.currentTime; noiseHit(t,0.35,1400,180,0.5); },
    reel(){ if(!guard())return; const t=AC.currentTime; for(let i=0;i<3;i++) voice(520-i*60,t+i*0.045,0.05,0.16,'square',busSfx); },
    chime(){ if(!guard())return; const t=AC.currentTime; const n=[523,659,784,1046]; n.forEach((f,i)=>voice(f,t+i*0.08,0.5,0.16,'sine',busSfx)); },
    coin(){ if(!guard())return; const t=AC.currentTime; voice(880,t,0.09,0.16,'triangle',busSfx); voice(1174,t+0.07,0.14,0.14,'triangle',busSfx); },
    ui(){ if(!guard())return; const t=AC.currentTime; voice(430,t,0.07,0.10,'sine',busSfx); },
    gull(){ if(!guard())return; const t=AC.currentTime; for(let c=0;c<2;c++){ const o=AC.createOscillator(); o.type='sawtooth';
      const g=AC.createGain(); const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800; bp.Q.value=3;
      o.connect(bp); bp.connect(g); g.connect(busSfx); const w=t+c*0.16; o.frequency.setValueAtTime(1400,w); o.frequency.exponentialRampToValueAtTime(2200,w+0.06); o.frequency.exponentialRampToValueAtTime(1200,w+0.16);
      env(g,w,0.02,0.16,0.05); o.start(w); o.stop(w+0.2); } },
    thunder(v){ if(!guard())return; const t=AC.currentTime; noiseHit(t,1.8*(v||1),260,45,0.5*(v||1)); const o=AC.createOscillator(); o.type='sine';
      const g=AC.createGain(); o.connect(g); g.connect(busSfx); o.frequency.setValueAtTime(60,t); o.frequency.exponentialRampToValueAtTime(32,t+1.6); env(g,t,0.05,1.6,0.3*(v||1)); o.start(t); o.stop(t+1.8); },
    toggleMute(){ muted=!muted; this.muted=muted; applyMute(); if(typeof toast==='function') toast(muted?'Sound off':'Sound on',ic(muted?'lock':'sun',16)); if(typeof saveGame==='function') saveGame(); },
    setVolume(v){ applyMute(); },
  };
  Object.assign(Sound,impl);
})();
window.addEventListener('pointerdown',()=>{ if(Sound.ensure)Sound.ensure(); });

function openAlmanac(){
  const L=ensureLayer('layer-almanac'); let total=0,found=0,secs='';
  for(const R of REGIONS){ let rows='';
    for(const id of R.fish){ total++; const d=FISH[id]; const got=player.discovered[id]; if(got)found++;
      rows+= got? `<div class="shop-item" style="padding:8px 10px"><div class="ic" style="background:radial-gradient(circle at 40% 35%,#fff,#e2d3ae)">${fishSVG(id,38)}</div>
        <div class="meta"><h4 style="font-size:14px">${d.name}${d.legendary?'<span class="tag leg">legendary</span>':''}</h4>

       : `<div class="shop-item" style="padding:8px 10px;opacity:.5"><div class="ic">${ic('fish',20)}</div><div class="meta"><h4 style="font-size:14px">? ? ?</h4><p style="font-size:11.5px">Undiscovered</p></div></div>`; }

  L.innerHTML=`<div class="scrim"></div><div class="panel" style="max-width:780px;position:relative">

    ${secs}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn gold" id="a-ok">Close</button></div></div>`;
  const back=Game.screen; L.querySelector('#a-ok').onclick=()=>Game.set(back==='pause'?'pause':'sail');

const MISSIONS={}, MISSION_REGION={};

const REP_TIERS=[{n:0,name:'Stranger'},{n:5,name:'Known'},{n:12,name:'Trusted'},{n:22,name:'Honoured'},{n:38,name:'Legend'}];
function regionIndexOf(rid){ for(let i=0;i<REGIONS.length;i++) if(REGIONS[i].id===rid) return i; return 0; }
function repOf(rid){ return (player.rep&&player.rep[rid])||0; }
function repTier(rid){ const r=repOf(rid); let t=REP_TIERS[0]; for(const x of REP_TIERS) if(r>=x.n) t=x; return t; }
function repTierIdx(rid){ const r=repOf(rid); let i=0; for(let k=0;k<REP_TIERS.length;k++) if(r>=REP_TIERS[k].n) i=k; return i; }
function upgTotal(){ let s=player.shipTier||0; for(const k in player.upg) s+=player.upg[k]; return s; }
function regionDiscovered(rid){ let n=0; for(const id in FISH){ if(FISH[id].region===rid&&!FISH[id].legendary&&player.discovered[id]) n++; } return n; }
function missionState(id){ const q=player.quests[id]; if(q&&q.state) return q.state; // 'active'|'done'
  const m=MISSIONS[id]; if(!m) return 'locked';
  const ci=regionIndexOf(MISSION_REGION[id]); if(ci>world.region && !player.regionDone[ci]) return 'locked';
  for(const r of (m.req||[])) if(missionState(r)!=='done') return 'locked';
  return 'available'; }
function missionTarget(m){ const g=m.goal; return (g.type==='sell'||g.type==='earn')?g.coin:(g.n||1); }
function missionProgress(id){ const m=MISSIONS[id], q=player.quests[id]||{}, g=m.goal;
  if(g.type==='earn') return Math.max(0,player.earned-(q.base||0));
  if(g.type==='upgrade') return Math.max(0,upgTotal()-(q.base||0));
  if(g.type==='build') return homeBuilt(g.id)?1:0;
  if(g.type==='discover') return regionDiscovered(g.region);
  return q.prog||0; }
function missionReady(id){ return missionState(id)==='active' && missionProgress(id)>=missionTarget(MISSIONS[id]); }
function missionGoalText(m){ const g=m.goal;
  if(g.type==='catchAny') return `Catch any ${g.n} fish`;
  if(g.type==='catch') return `Catch ${g.n}× ${FISH[g.sp].name}`;
  if(g.type==='sell') return `Sell ${coinStr(g.coin)} coin of fish`;
  if(g.type==='earn') return `Earn ${coinStr(g.coin)} coin`;
  if(g.type==='upgrade') return `Buy a boat upgrade`;
  if(g.type==='build') return `Build the ${STRUCT[g.id]?STRUCT[g.id].name:g.id} at home`;
  if(g.type==='discover') return `Log ${g.n} ${REGIONS[regionIndexOf(g.region)].name.replace(/^The /,'')} species`;
  return 'Complete the task'; }
function acceptMission(id){ const m=MISSIONS[id]; if(!m||missionState(id)!=='available')return;
  const g=m.goal; player.quests[id]={state:'active',prog:0,base:(g.type==='earn'?player.earned:g.type==='upgrade'?upgTotal():0),ready:false};
  if(Sound.ui)Sound.ui(); toast(`New mission: ${m.title}`,ic('scroll')); refreshCampaignUI(); saveGame(); }
function turnInMission(id){ const m=MISSIONS[id]; if(!missionReady(id))return; const q=player.quests[id]; q.state='done';
  const rw=m.reward; if(rw.coin){ player.money+=rw.coin; player.earned+=rw.coin; }
  const rid=MISSION_REGION[id]; if(rw.rep){ player.rep[rid]=repOf(rid)+rw.rep; }
  if(rw.star&&typeof awardStar==='function') awardStar(rw.star,`mission: ${m.title}`);
  const rpGain=(m.side?2:4)+(rw.star?4:0); player.rp=(player.rp||0)+rpGain;
  if(Sound.coin)Sound.coin(); if(Sound.chime)Sound.chime();
  toast(`${m.title} complete — ${ic('coin',12)} ${coinStr(rw.coin||0)}${rw.rep?' · +'+rw.rep+' rep':''} · +${rpGain} ${ic('scroll',11)}`,ic('star'));
  refreshCampaignUI(); saveGame(); if(typeof checkRegionGoal==='function') checkRegionGoal(); }
function questEvent(type,data){ let changed=false;
  for(const id in player.quests){ const q=player.quests[id]; if(!q||q.state!=='active')continue; const m=MISSIONS[id]; if(!m)continue; const g=m.goal;
    if(type==='catch'){ if(g.type==='catchAny'){q.prog=(q.prog||0)+1;changed=true;} else if(g.type==='catch'&&g.sp===data.sp){q.prog=(q.prog||0)+1;changed=true;} }
    else if(type==='sell'&&g.type==='sell'){ q.prog=(q.prog||0)+(data.coin||0); changed=true; } }
  checkReadiness(); if(changed) refreshCampaignUI(); }

function missionCard(id){ const m=MISSIONS[id], st=missionState(id); if(st==='locked')return '';
  const ready=missionReady(id), prog=missionProgress(id), tgt=missionTarget(m), giver=CHARS[m.giver]?CHARS[m.giver].name:'';
  let right='', body='';

    right=`<button class="btn small gold" onclick="acceptMission('${id}')">Accept</button>`; }
  else if(st==='active'){ const pc=clamp(prog/tgt*100,0,100);

function tavernHTML(port){ const R=regionData(), ch=CAMPAIGN[regionIndexOf(R.id)]; const cid=CHAPTER_CHAR[R.id], C=CHARS[cid];

function ensureContracts(port){ const key=port.name;
  if(!ECO.contracts) ECO.contracts={};
  const c=ECO.contracts[key];
  if(!c || c.day!==world.day){ const fs=regionData().fish.filter(id=>!FISH[id].legendary); const list=[];
    for(let i=0;i<3;i++){ const sp=pick(fs), count=3+rint(0,5), d=FISH[sp]; list.push({sp,count,reward:Math.round(d.base*count*1.9+60)}); }
    ECO.contracts[key]={day:world.day,list}; }
  return ECO.contracts[key].list;
}
function noticeHTML(port){
  const list=ensureContracts(port);
  let rows=list.map((c,i)=>{ const have=player.hold.filter(it=>it.id===c.sp).length, can=have>=c.count;
    return `<div class="shop-item"><div class="ic">${ic('scales',24)}</div><div class="meta"><h4>Deliver ${c.count}× ${FISH[c.sp].name}</h4>
      <p>Reward ${ic('coin',13)} ${coinStr(c.reward)} &nbsp;·&nbsp; in hold ${have}/${c.count}</p></div>
      <div><button class="btn small ${can?'gold':''}" ${can?'':'disabled'} onclick="fulfillContract(${i})">Fulfil</button></div></div>`; }).join('');

}
function fulfillContract(i){ const port=townPort, list=ECO.contracts[port.name].list, c=list[i]; if(!c) return;
  const have=player.hold.filter(it=>it.id===c.sp).length; if(have<c.count){ toast('Not enough in the hold',ic('fish')); return; }
  let cnt=0; player.hold=player.hold.filter(it=>{ if(it.id===c.sp&&cnt<c.count){cnt++;return false;} return true; });
  player.money+=c.reward; player.earned+=c.reward; player.contractsDone++; list.splice(i,1);
  if(player.contractsDone%3===0) awardStar(1,'3 contracts filled');
  if(Sound.coin)Sound.coin(); toast(`Contract complete · ${ic('coin',13)} ${coinStr(c.reward)}`,ic('scales')); renderTown(); saveGame(); checkRegionGoal();
}

  const sp=clamp(Math.abs(player.speed)/12,0,1);
  player.fouling=clamp((player.fouling||0)+dt*0.0038*techFoulRate()*(0.3+sp),0,1);
  if((player.engineWear>0.85||player.fouling>0.9)&&Game.frame%180===0) toast(player.engineWear>0.85?'Engine is straining — service it at a port':'Hull is thick with barnacles — careen at a port',ic('wrench'));
}
function serviceEngine(){ const cost=Math.round(40+player.engineWear*160*repPriceMul()); if(player.engineWear<0.02){toast('Engine runs sweet',ic('gear'));return;}
  if(player.money<cost){toast('Not enough coin',ic('coin'));return;} player.money-=cost; player.engineWear=0; if(Sound.chime)Sound.chime(); toast('Engine serviced',ic('gear')); renderTown(); saveGame(); }
function careenHull(){ const cost=Math.round(30+player.fouling*140*repPriceMul()); if(player.fouling<0.02){toast('Hull is clean',ic('wrench'));return;}
  if(player.money<cost){toast('Not enough coin',ic('coin'));return;} player.money-=cost; player.fouling=0; if(Sound.chime)Sound.chime(); toast('Hull careened — barnacles scraped',ic('wrench')); renderTown(); saveGame(); }
function labRPPerDay(){ return homeBuilt('lab')?(3+(player.shipTier||0)):0; }
function openResearch(){ ensureLayer('layer-research'); renderResearch(); Game.set('research'); if(Sound.ui)Sound.ui(); }
function renderResearch(){ const L=document.getElementById('layer-research'); let branches='';
  for(const b in RESEARCH){ const B=RESEARCH[b]; let nodes='';
    for(const n of B.nodes){ const lv=tech(n.id), maxed=lv>=n.max, cost=n.base+lv*n.step, can=!maxed&&player.rp>=cost;
      let pips=''; for(let i=0;i<n.max;i++) pips+=`<span style="width:9px;height:9px;border-radius:50%;display:inline-block;margin:0 1px;background:${i<lv?'#6fb0d0':'rgba(120,140,150,.28)'}"></span>`;
      const val = n.per? (n.id==='ballast'?`+${lv*n.per}${n.unit} (Mk ${lv})`:`${n.per}${n.unit} each`) : n.unit;
      nodes+=`<div class="shop-item" style="padding:8px 10px">
        <div class="meta"><h4 style="font-size:13px">${n.name} <span class="muted" style="font-weight:400">Mk ${lv}/${n.max}</span></h4>
          <div style="margin:2px 0">${pips}</div><p class="muted" style="font-size:11px">${val}</p></div>
        <div>${maxed?'<span class="tag">Max</span>':`<button class="btn small ${can?'gold':''}" ${can?'':'disabled'} onclick="buyResearch('${n.id}')">${ic('scroll',12)} ${cost}</button>`}</div></div>`; }
    branches+=`<div style="margin-bottom:8px"><div class="row" style="align-items:center;gap:8px"><div style="width:22px">${ic(B.icon,18)}</div><b style="font-size:14px">${B.name}</b><span class="muted" style="font-size:11.5px">— ${B.blurb}</span></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:6px;margin-top:3px">${nodes}</div></div>`; }
  // compounded bonuses summary — the "math"
  const bon=[]; const pct=(f,inv)=>Math.round((inv?1-f:f-1)*100);
  if(tech('drag'))bon.push(`−${pct(techDrag(),1)}% drag`); if(tech('thrust'))bon.push(`+${pct(techThrust())}% thrust`);
  if(tech('fuel'))bon.push(`−${pct(techFuel(),1)}% fuel`); if(tech('line'))bon.push(`+${pct(techLine())}% line`);
  if(tech('attract'))bon.push(`+${pct(techAttractR())}% draw`); if(tech('value'))bon.push(`+${pct(techValue())}% value`);
  if(tech('ballast'))bon.push(`+${techHold()} hold`); if(tech('storm'))bon.push(`−${pct(techStormR(),1)}% storm dmg`);
  if(tech('ward'))bon.push(`−${pct(techWard(),1)}% threat`); if(hasSonar())bon.push('sonar');
  L.innerHTML=`<div class="scrim"></div><div class="panel" style="max-width:760px;position:relative">
    <div class="row"><div><div class="kicker">R &amp; D Laboratory</div><h1>${ic('gear',26)} Research</h1></div><div class="spacer"></div>
      <div style="text-align:right"><div class="kicker">Research Points</div><div class="coin" style="font-size:22px;color:#8fd0e0">${ic('scroll',18)} ${player.rp||0}</div>
        <div class="muted" style="font-size:11px">+${labRPPerDay()}/day${homeBuilt('lab')?' (Marine Lab)':' · build a Marine Lab'}</div></div></div>
    <p class="muted" style="font-size:12px;margin-top:-4px">Earn points from new species, missions &amp; your Marine Lab. Bonuses <b>compound</b> — stack enough and your boat becomes a cheat code.</p>
    ${bon.length?`<div class="row" style="gap:5px;flex-wrap:wrap;margin:2px 0 8px">${bon.map(x=>`<span class="tag" style="background:rgba(110,176,208,.18)">${x}</span>`).join('')}</div>`:''}
    ${branches}
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn gold" onclick="Game.set('sail')">Close</button></div></div>`;
}

/* ======================= 41. 3D LINE-SPOOL INDICATOR ================== */
function drawLineSpool(rem){
  if(!UW.spool||!gl) return;
  const sz=Math.round(Math.min(140,W*0.12)*DPR), mx=Math.round(18*DPR), my=Math.round(128*DPR);
  const vx=glc.width-sz-mx, vy=glc.height-sz-my;
  gl.enable(gl.SCISSOR_TEST); gl.scissor(vx,vy,sz,sz); gl.viewport(vx,vy,sz,sz);
  gl.clear(gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
  const proj=m4persp(m4(),rad(38),1,0.1,20), eye=[1.7,1.15,2.6], view=m4lookAt(m4(),eye,[0,0,0],[0,1,0]);
  const sVP=cam.vp,sPos=cam.pos; cam.vp=m4mul(m4(),proj,view); cam.pos=eye;
  const sky=skyColors(), spin=Game.t*1.4, tilt=0.32, r=0.3+rem*0.66;
  const lm=m4(); m4compose(lm,[0,0,0],spin,0,tilt,[r,1,r]);
  drawLit(UW.spoolLine,lm,sky,{ambient:[0.62,0.6,0.55],tint:rem<0.25?[1,0.62,0.5]:[1,1,0.94],fogDensity:0,useSky:0,fogColor:[0,0,0]});
  const mm=m4(); m4compose(mm,[0,0,0],spin,0,tilt,[1,1,1]);
  drawLit(UW.spool,mm,sky,{ambient:[0.62,0.6,0.55],fogDensity:0,useSky:0,fogColor:[0,0,0]});
  cam.vp=sVP; cam.pos=sPos; gl.disable(gl.SCISSOR_TEST); gl.viewport(0,0,glc.width,glc.height);
}
