<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SALT &amp; TIDE — A Coastal Life (3D)</title>
<style>
  :root{
    --ink:#26333b; --ink-soft:#4a5b64; --gold:#c58a3c; --gold-deep:#9c6420;
    --panel-shadow:0 18px 50px rgba(20,30,38,.45);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:#07121a;color:var(--ink);
    font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#07121a;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  canvas#game{z-index:1;}
  canvas#fx{z-index:2;pointer-events:none;}

  #boot{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 120% at 50% 30%,#14323f,#08151c 70%);color:#e9dcc0;font-family:var(--serif);transition:opacity .8s ease;}
  #boot .mark{font-size:clamp(34px,7vw,68px);letter-spacing:.14em;font-weight:600;text-shadow:0 4px 24px rgba(0,0,0,.5);}
  #boot .sub{font-family:var(--sans);letter-spacing:.35em;text-transform:uppercase;font-size:11px;color:#9fb7bd;opacity:.85;}
  #boot .bar{width:min(320px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;}
  #boot .bar>i{display:block;height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#7fd7c4,#e8c987);transition:width .3s ease;}
  #boot.hidden{opacity:0;pointer-events:none;}

  .layer{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;}
  .layer.show{display:flex;}
  .layer.fade{animation:fadein .45s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @keyframes panelIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes scrimIn{from{opacity:0}to{opacity:1}}
  .panel{position:relative;background:linear-gradient(180deg,rgba(255,251,240,.96),rgba(238,222,190,.96));color:var(--ink);
    border-radius:16px;box-shadow:var(--panel-shadow),inset 0 0 0 1px rgba(120,90,50,.25),inset 0 2px 0 rgba(255,255,255,.6);
    padding:26px 30px;max-width:min(960px,94vw);max-height:92vh;overflow:auto;border:1px solid rgba(120,90,50,.3);
    animation:panelIn .3s cubic-bezier(.2,.7,.2,1) both;}
  .scrim{animation:scrimIn .3s ease both;}
  h1,h2,h3,h4{font-family:var(--serif);margin:0 0 .4em;font-weight:600;color:#2a3942;}
  .kicker{font-family:var(--sans);letter-spacing:.32em;text-transform:uppercase;font-size:11px;color:var(--gold-deep);font-weight:700;}
  .btn{font-family:var(--serif);font-size:17px;cursor:pointer;border:none;padding:12px 22px;border-radius:11px;color:#fff8ea;
    background:linear-gradient(180deg,#3f7d76,#2d5f61);box-shadow:0 6px 0 #1f4547,0 12px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .08s ease,box-shadow .08s ease,filter .15s ease;letter-spacing:.02em;}
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f4547,0 6px 14px rgba(0,0,0,.28);}
  .btn.gold{background:linear-gradient(180deg,#d79a44,#b1701f);box-shadow:0 6px 0 #7f4d13,0 12px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);}
  .btn.gold:active{box-shadow:0 2px 0 #7f4d13,0 6px 14px rgba(0,0,0,.28);}
  .btn.ghost{background:linear-gradient(180deg,#efe2c4,#e0cda4);color:#5a4426;box-shadow:0 5px 0 #b79c6f,0 10px 18px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5);}
  .btn.ghost:active{box-shadow:0 2px 0 #b79c6f;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);}
  .btn.small{font-size:14px;padding:8px 14px;border-radius:9px;box-shadow:0 4px 0 #1f4547,0 8px 14px rgba(0,0,0,.25);}
  .btn.small:active{box-shadow:0 1px 0 #1f4547;}

  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;font-family:var(--sans);}
  #hud .pill{position:absolute;pointer-events:auto;background:rgba(20,34,42,.42);color:#f2ead6;border-radius:12px;padding:8px 12px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.12);box-shadow:0 8px 22px rgba(0,0,0,.28);font-size:13px;line-height:1.15;}
  .hud-tl{left:14px;top:14px;display:flex;gap:10px;align-items:flex-start;}
  .hud-tr{right:14px;top:14px;text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .hud-bc{left:50%;bottom:16px;transform:translateX(-50%);text-align:center;background:rgba(20,34,42,.5);}
  .gauge{width:130px;height:9px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:4px;}
  .gauge>i{display:block;height:100%;border-radius:6px;transition:width .25s ease;}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:130px;}
  .stat b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#bcd0d4;font-weight:700;}
  .coin{color:#ffd98a;font-weight:700;}
  table.ledger{width:100%;border-collapse:collapse;font-size:14px;}
  table.ledger th,table.ledger td{padding:7px 10px;text-align:left;}
  table.ledger th{font-family:var(--sans);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--gold-deep);border-bottom:2px solid rgba(140,100,55,.3);}
  table.ledger tr+tr td{border-top:1px solid rgba(140,100,55,.18);}
  table.ledger td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:rgba(150,110,60,.16);color:#7a5a2c;margin-left:6px;}
  .tag.leg{background:linear-gradient(90deg,#f4d27a,#e0a63c);color:#5c3d0c;font-weight:700;}
  .tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap;}
  .tab{font-family:var(--serif);cursor:pointer;padding:8px 16px;border-radius:10px 10px 0 0;background:rgba(150,110,60,.14);color:#6b5230;border:1px solid transparent;}
  .tab.active{background:rgba(255,251,240,.9);color:#2a3942;border-color:rgba(140,100,55,.3);border-bottom-color:transparent;}
  .grid{display:grid;gap:12px;}
  .shop-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.4);border:1px solid rgba(140,100,55,.2);}
  .shop-item .ic{width:44px;height:44px;border-radius:10px;flex:0 0 auto;background:radial-gradient(circle at 35% 30%,#fff,#e6d3ab);display:grid;place-items:center;font-size:22px;box-shadow:inset 0 0 0 1px rgba(120,90,50,.25);}
  .shop-item .meta{flex:1 1 auto;min-width:0;}
  .shop-item .meta h4{margin:0;font-family:var(--serif);font-size:16px;}
  .shop-item .meta p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .spacer{flex:1 1 auto;}
  .muted{color:var(--ink-soft);}
  .center{text-align:center;}
  .toast-wrap{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:rgba(24,38,46,.82);color:#f4ead4;padding:9px 16px;border-radius:22px;font-size:13.5px;box-shadow:0 10px 26px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);animation:toastin .3s ease both;}
  @keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .icon-btn{pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(20,34,42,.42);color:#f2ead6;border:1px solid rgba(255,255,255,.12);font-size:17px;backdrop-filter:blur(7px);}
  .key{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);font-family:var(--sans);font-size:12px;font-weight:700;text-align:center;margin:0 1px;}
  a.link{color:var(--gold-deep);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .err{position:absolute;left:0;right:0;bottom:0;z-index:80;background:#3a0d0d;color:#ffd9d0;font:12px/1.4 monospace;padding:8px 12px;max-height:40%;overflow:auto;white-space:pre-wrap;display:none;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <canvas id="fx"></canvas>
  <div id="hud"></div>

  <div class="layer" id="layer-map"></div>
  <div class="layer" id="layer-town"></div>

</div>

<script>

/* ============================================================================
   SALT & TIDE — a hand-built, dependency-free 3D coastal fishing/trading game.
   Real-time WebGL2: Gerstner-wave ocean, procedural sky, 3D boat, underwater
   fishing, weather & day/night. All math, shaders, art and audio are original.
   ========================================================================== */
window.addEventListener('error', e=>{
  const b=document.getElementById('errbox'); if(b){ b.style.display='block';
    b.textContent += (e.message||e.error)+'\n'+(e.error&&e.error.stack?e.error.stack:'')+'\n'; }
});

/* ======================= 1. MATH / RNG / NOISE ============================ */
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>(v-a)/(b-a);
const map=(v,a,b,c,d)=>c+(d-c)*((v-a)/(b-a));
const smooth=t=>t*t*(3-2*t);
const smoother=t=>t*t*t*(t*(t*6-15)+10);
const clamp01=v=>v<0?0:(v>1?1:v);
const ease={inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-Math.pow(1-t,3),in:t=>t*t*t};
const wrap=(v,m)=>((v%m)+m)%m;
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
let RNG=mulberry32(0x5eed);
const rnd=()=>RNG();
const rrange=(a,b)=>a+(b-a)*RNG();
const rint=(a,b)=>Math.floor(a+(b-a+1)*RNG());
const pick=arr=>arr[Math.floor(RNG()*arr.length)];
const chance=p=>RNG()<p;
function makeNoise1D(seed){const r=mulberry32(seed);const N=512,g=new Float32Array(N);for(let i=0;i<N;i++)g[i]=r()*2-1;
  return function(x){const xi=Math.floor(x),f=x-xi;const a=g[wrap(xi,N)],b=g[wrap(xi+1,N)];return lerp(a,b,smoother(f));};}
function fbm1(noise,x,oct=4,lac=2,gain=.5){let amp=1,freq=1,sum=0,norm=0;for(let i=0;i<oct;i++){sum+=amp*noise(x*freq);norm+=amp;amp*=gain;freq*=lac;}return sum/norm;}
function hash2(x,y){let h=Math.sin(x*127.1+y*311.7)*43758.5453;return h-Math.floor(h);}

/* ======================= 2. COLOR ======================================== */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function rgb2css(c,a){return a==null?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
function mix(c1,c2,t){return[lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function shade(c,amt){return amt>=0?mix(c,[255,255,255],amt):mix(c,[8,14,20],-amt);}
function withA(cssOrArr,a){if(Array.isArray(cssOrArr))return rgb2css(cssOrArr,a);const c=hex2rgb(cssOrArr);return rgb2css(c,a);}
const v3=(c)=>[c[0]/255,c[1]/255,c[2]/255];   // 0..255 -> 0..1 for GL
function mixHex(h1,h2,t){ return rgb2css(mix(hex2rgb(h1),hex2rgb(h2),t)); }

function makeProgram(vsrc,fsrc){
  const p=gl.createProgram();

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function fishPeak(id){ return hashStr(id)%4; }             // each species peaks in one season
function fishSeasonMult(id){ let d=Math.abs((world.season||0)-fishPeak(id)); d=Math.min(d,4-d);
  return d===0?1.8:d===1?1.0:0.35; }                       // abundant at peak, scarce off-season

  world.curPhase=(world.curPhase||0)+dt*0.05;
  world.current=clamp(fbm1(nzCur, world.curPhase, 3), -1, 1);              // signed drift along the coast

}

function tideName(){ return world.tide>0.72?'High':world.tide<0.28?'Low':(tideRising()?'Rising':'Falling'); }
function tideBite(){ return 0.78 + world.tide*0.5; }                        // fish are keener on a high tide

  // current arrow — green if it aids your heading, amber if against
  const cs=world.current||0, sgn=Math.sign(cs)||1, clen=clamp(Math.abs(cs),0.06,1)*(r-4);
  const aids=sgn===nx, ccol=aids?'#7fd39a':'#e6a04a';
  c.strokeStyle=ccol; c.lineWidth=2.4; c.beginPath(); c.moveTo(cx-sgn*clen*0.5,cy+r+15); c.lineTo(cx+sgn*clen*0.5,cy+r+15); c.stroke();
  c.fillStyle=ccol; c.beginPath(); c.moveTo(cx+sgn*clen*0.5,cy+r+15); c.lineTo(cx+sgn*clen*0.5-sgn*5,cy+r+12); c.lineTo(cx+sgn*clen*0.5-sgn*5,cy+r+18); c.closePath(); c.fill();
  c.fillStyle=ccol; c.font='9px ui-sans-serif'; c.fillText(aids?'current — with you':'current — against',cx,cy+r+29);
  // nearest port marker

    c.fillStyle='#d8ccaa'; c.font='700 10px ui-sans-serif'; c.fillText(`${dir} ${p.name}`,cx,cy+r+43); c.fillStyle='#9fb3bb'; c.font='9px ui-sans-serif'; c.fillText(`${d}m`,cx,cy+r+54); } }
  c.restore(); c.textAlign='left';
}
function updateWeather(dt){
  world.wTimer-=dt;
  if(world.wTimer<=0&&world.wBlend>=1) setWeather(rollWeather());
  world.wBlend=Math.min(1,world.wBlend+dt/6);
  const a=WX[world.weatherPrev],b=WX[world.weather],t=smooth(world.wBlend);
  world.fog=lerp(a.fog,b.fog,t); world.rainI=lerp(a.rain,b.rain,t); world.snowI=lerp(a.snow,b.snow,t);
  world.cloudCover=lerp(a.cloud,b.cloud,t); world.storm=lerp(a.storm,b.storm,t);
  world.windTargetStr=lerp(a.wind,b.wind,t);
  const targetSea=lerp(a.sea,b.sea,t);
  world.seaState=lerp(world.seaState,targetSea,1-Math.pow(0.2,dt));
  world.overcast=clamp(world.cloudCover*0.8+world.storm*0.5,0,1);
  world.windStr=lerp(world.windStr,world.windTargetStr,1-Math.pow(0.1,dt));
  if(chance(dt*0.02)&&world.windStr<.5) world.windTarget=-world.windTarget;
  world.windDir=lerp(world.windDir,world.windTarget,1-Math.pow(0.3,dt));
  if(world.storm>0.5){ world.lightningTimer-=dt;
    if(world.lightningTimer<=0){ world.lightning=1; world.lightningTimer=rrange(3.5,9)/Math.max(.5,world.storm);
      Sound.thunder(rrange(.4,1.1)); } }
  world.lightning=Math.max(0,world.lightning-dt*3.5);
}
function advanceTime(dt){ world.time+=dt/DAY_LENGTH*world.timeScale; if(world.time>=1){ world.time-=1; world.day++; onNewDay(); } }
function onNewDay(){ if(typeof driftMarkets==='function') driftMarkets();
  if(typeof tradeAccrueDay==='function') tradeAccrueDay();
  if(typeof labRPPerDay==='function'){ const rp=labRPPerDay(); if(rp>0){ player.rp=(player.rp||0)+rp; toast(`Marine Lab — +${rp} research points`,ic('scroll')); } }
  const prevS=world.season; updateSeason();
  if(world.season!==prevS && typeof toast==='function'){ const s=seasonNow(); toast(`${s.name} — ${s.blurb}`,ic(s.icon)); }
  else if(typeof toast==='function') toast(`Day ${world.day} — dawn breaks`,ic('sunrise')); }

function sunDirection(time){ const a=(time-0.25)*TAU; const x=Math.cos(a),y=Math.sin(a),z=-0.34;
  const L=Math.hypot(x,y,z); return [x/L,y/L,z/L]; }
function dawnDusk(time){ const dawn=clamp(inv(0.16,0.27,time)*(1-inv(0.27,0.37,time)),0,1);
  const dusk=clamp(inv(0.63,0.74,time)*(1-inv(0.74,0.85,time)),0,1); return {dawn,dusk}; }

// Atmosphere palette (rgb 0..255) + sun direction (unit vec). Shared by sky & ocean.
function skyColors(){
  const R=regionData(); const sd=sunDirection(world.time); const sunAlt=sd[1];
  const dd=dawnDusk(world.time); const warm=clamp(dd.dawn+dd.dusk,0,1);
  const dayness=clamp(sunAlt*1.15+0.32,0,1);
  const nightTop=shade(hex2rgb(R.sky.night),-0.18), nightHor=shade(hex2rgb(R.sky.night),0.06);
  const dayTop=shade(hex2rgb(R.sky.day),-0.02), dayHor=shade(hex2rgb(R.sky.day),0.22);
  let top=mix(nightTop,dayTop,smooth(dayness));
  let hor=mix(nightHor,dayHor,smooth(dayness));
  const warmCol=mix(hex2rgb(R.sky.dawn),hex2rgb(R.sky.dusk),dd.dusk/(dd.dawn+dd.dusk+0.0001));
  hor=mix(hor,warmCol,warm*0.7); top=mix(top,shade(warmCol,-0.15),warm*0.25);
  const grey=[150,152,150];
  top=mix(top,shade(grey,-0.25),world.overcast*0.55); hor=mix(hor,shade(grey,-0.05),world.overcast*0.5);
  top=mix(top,[40,46,54],world.storm*0.55); hor=mix(hor,[70,74,80],world.storm*0.45);
  const ambient=mix(mix(nightTop,dayHor,dayness),warmCol,warm*0.5);
  const lightStr=clamp(dayness*(1-world.overcast*0.5)*(1-world.storm*0.5),0.05,1);
  const starA=clamp(1-dayness*3.0,0,1)*(1-world.overcast*0.85);
  return {top,hor,warmCol,ambient,sunCol:hex2rgb(R.sun),dayness,warm,lightStr,starA,sunDir:sd,sunAlt};
}

/* ======================= 7. SKY SHADER ================================== */
const SKY_GLSL=`
uniform vec3 uSunDir,uSkyTop,uSkyHor,uSunCol,uWarmCol;
uniform float uWarm,uLightStr,uOvercast,uStorm,uTime,uStarA,uAurora;
float hash13(vec3 p){ p=fract(p*0.1031); p+=dot(p,p.yzx+33.33); return fract((p.x+p.y)*p.z); }
vec3 skyColor(vec3 dir){
  dir=normalize(dir);
  float up=clamp(dir.y,0.0,1.0);
  vec3 col=mix(uSkyHor,uSkyTop,pow(up,0.55));
  float hor=smoothstep(0.34,0.0,abs(dir.y));
  col=mix(col,uWarmCol,hor*uWarm*0.6);
  float sd=max(dot(dir,uSunDir),0.0);
  float glow=pow(sd,6.0)*0.45*uLightStr + pow(sd,90.0)*0.7*uLightStr;
  float disk=smoothstep(0.9975,0.9990,sd)*clamp(uSunDir.y*4.0+0.4,0.0,1.0);
  col+=uSunCol*glow + uSunCol*disk*2.2;
  if(uStarA>0.01 && dir.y>0.015){
    vec3 sp=floor(dir*300.0); float st=hash13(sp);
    float s=smoothstep(0.992,1.0,st);
    float tw=0.55+0.45*sin(uTime*3.0+st*140.0);
    col+=vec3(1.0,0.98,0.92)*s*uStarA*tw*0.9;
  }
  if(uAurora>0.01){
    float ah=smoothstep(0.02,0.30,dir.y)*(1.0-smoothstep(0.5,0.96,dir.y));
    float w1=sin(dir.x*7.0+uTime*0.4+sin(dir.x*3.0)*2.0)*0.5+0.5;
    float w2=sin(dir.x*15.0-uTime*0.25)*0.5+0.5;
    float curt=pow(w1,2.0)*(0.55+0.45*w2);
    vec3 aur=mix(vec3(0.15,0.95,0.55),vec3(0.35,0.55,1.0),w2)*ah*curt;
    col+=aur*uAurora*1.9;
  }
  return col;
}`;
let skyProg;
function initSky(){
  skyProg=makeProgram(
    `layout(location=0) in vec2 aPos; out vec2 vNdc; void main(){ vNdc=aPos; gl_Position=vec4(aPos,1.0,1.0); }`,
    `in vec2 vNdc; out vec4 frag; uniform mat4 uInvVP; uniform vec3 uCamPos;
     ${SKY_GLSL}
     void main(){ vec4 w=uInvVP*vec4(vNdc,1.0,1.0); w/=w.w; vec3 dir=normalize(w.xyz-uCamPos);
       frag=vec4(skyColor(dir),1.0); }`);
}
function setSkyUniforms(p,sky){
  gl.uniform3fv(p.u('uSunDir'),new Float32Array(sky.sunDir));
  gl.uniform3fv(p.u('uSkyTop'),new Float32Array(v3(sky.top)));
  gl.uniform3fv(p.u('uSkyHor'),new Float32Array(v3(sky.hor)));
  gl.uniform3fv(p.u('uSunCol'),new Float32Array(v3(sky.sunCol)));
  gl.uniform3fv(p.u('uWarmCol'),new Float32Array(v3(sky.warmCol)));
  gl.uniform1f(p.u('uWarm'),sky.warm);
  gl.uniform1f(p.u('uLightStr'),sky.lightStr);
  gl.uniform1f(p.u('uOvercast'),world.overcast);
  gl.uniform1f(p.u('uStorm'),world.storm);
  gl.uniform1f(p.u('uTime'),Game.t);
  gl.uniform1f(p.u('uStarA'),sky.starA);
  gl.uniform1f(p.u('uAurora'),regionData().id==='verge'?clamp(1-sky.dayness*2.2,0,1)*(1-world.overcast*0.6):0);
}
function drawSky(sky){
  gl.useProgram(skyProg);
  gl.uniformMatrix4fv(skyProg.u('uInvVP'),false,cam.invVP);
  gl.uniform3fv(skyProg.u('uCamPos'),new Float32Array(cam.pos));
  setSkyUniforms(skyProg,sky);
  gl.bindVertexArray(quadVAO);
  gl.disable(gl.DEPTH_TEST);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

function buildPaperURL(){
  const s=256,oc=document.createElement('canvas');oc.width=s;oc.height=s;
  const g=oc.getContext('2d');const img=g.createImageData(s,s);const d=img.data;
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){ const i=(y*s+x)*4;
    let v=hash2(x*1.7,y*1.7)*0.6+hash2(x*0.13+9,y*0.13+3)*0.4; v=0.5+(v-0.5)*0.9;
    const sh=128+(v-0.5)*70; d[i]=d[i+1]=d[i+2]=sh; d[i+3]=255; }
  g.putImageData(img,0,0); return oc.toDataURL();
}

/* ======================= 10. MAIN LOOP ================================== */
function update(dt){
  Game.t+=dt;
  if(!Game.paused){
    const sim=(Game.screen==='sail'||Game.screen==='fish');
    if(sim){ advanceTime(dt); updateWeather(dt); if(typeof updateNav==='function') updateNav(dt);
      if(typeof updateWorldSim==='function') updateWorldSim(dt); }
  }
  if(view.flash>0) view.flash=Math.max(0,view.flash-dt*2.2);
  if(Game.screen==='cutting'&&typeof updateCutting3D==='function') updateCutting3D(dt);
  if(Game.screen==='cine') updateCine(dt);
  else if(Game.screen==='title'||Game.screen==='credits') updateTitleCamera(dt);
  else if(Game.screen==='sail') updateCameraRig(dt);
  if(typeof updateParticles==='function') updateParticles(dt);
  if(Sound.tick) Sound.tick(dt);
}
function render(){
  Game.frame++;
  if(!gl) return;
  const sky=skyColors();
  updateCameraMatrices();
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,glc.width,glc.height);
  gl.clearColor(v3(sky.hor)[0],v3(sky.hor)[1],v3(sky.hor)[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(Game.screen==='fish'){ renderUnderwater(sky); }
  else if(Game.screen==='cutting'){ if(typeof renderCuttingScene==='function') renderCuttingScene(sky); }
  else { drawSky(sky); if(typeof drawScene3D==='function') drawScene3D(sky); }
  drawFX(sky);
  if(typeof updateHUD==='function') updateHUD();
}
let _last=0;
function frame(now){
  if(!_last)_last=now; let dt=(now-_last)/1000; _last=now; dt=Math.min(dt,0.05);
  try{ update(dt); render(); }catch(e){ const b=document.getElementById('errbox'); b.style.display='block'; b.textContent+=e.message+'\n'+(e.stack||'')+'\n'; throw e; }
  if(typeof pressed!=='undefined') pressed.clear();
  requestAnimationFrame(frame);
}

  else if(hp.has('town')){ Game.set('sail'); if(hp.has('stock')){ const fs=regionData().fish; for(let i=0;i<9;i++){ const id=fs[i%(fs.length-1)]; const d=FISH[id]; const ln=rrange(d.len[0],d.len[1]); player.hold.push({id,len:Math.round(ln),value:fishValue(d,ln)}); } player.money=2000; } openTown(regionData().ports[0]); if(hp.has('tab')) setTownTab(hp.get('tab')); }
  else if(hp.has('almanac')){ Game.set('sail'); if(hp.has('disc')){ for(const id in FISH){ player.discovered[id]=true; player.records[id]=Math.round(rrange(FISH[id].len[0],FISH[id].len[1])); } } openAlmanac(); }
  else if(hp.has('cut')){ Game.set('sail'); const id=regionData().fish[hp.has('leg')?regionData().fish.length-1:4]; const d=FISH[id]; player.hold.push({id,len:Math.round(rrange(d.len[0],d.len[1])),value:fishValue(d,55)}); startCutting(); }
  else if(hp.has('skills')){ Game.set('sail'); player.money=8000; player.stars=5; player.shipTier=1; openSkills(); }
  else if(hp.has('t')||hp.has('w')||hp.has('play')){ Game.set('sail'); }
  else if(hp.has('title')){ openTitle(); }
  else startIntro();
  const bar=document.getElementById('bootbar'); if(bar) bar.style.width='100%';
  setTimeout(()=>{ const b=document.getElementById('boot'); if(b) b.classList.add('hidden'); },150);
  requestAnimationFrame(frame);
}

/* ======================= 13. OCEAN (Gerstner) =========================== */
const WAVES=[
  {dir:14,  amp:0.95, len:78, spd:0.85, steep:0.75},
  {dir:46,  amp:0.55, len:41, spd:1.0,  steep:0.6},
  {dir:-24, amp:0.34, len:22, spd:1.25, steep:0.5},
  {dir:78,  amp:0.20, len:13, spd:1.55, steep:0.42},
  {dir:-58, amp:0.11, len:7.5,spd:1.95, steep:0.35},
];
let WAVE_C=[];
function computeWaveConsts(){
  WAVE_C=WAVES.map(w=>{ const om=TAU/w.len; const A=w.amp; const d=[Math.cos(rad(w.dir)),Math.sin(rad(w.dir))];
    const Q=w.steep/(om*A*WAVES.length); const spd=w.spd*Math.sqrt(9.8*om); return {om,A,Q,dir:d,spd}; });
}
function gerstnerGLSL(){
  let s='void gerstner(vec2 P,float t,float ch,out vec2 disp,out float hgt,out vec3 nrm){\n disp=vec2(0.0);hgt=0.0;vec3 n=vec3(0.0,1.0,0.0);\n';
  WAVE_C.forEach(w=>{ const dx=w.dir[0].toFixed(5),dz=w.dir[1].toFixed(5),om=w.om.toFixed(6),A=w.A.toFixed(5),Q=w.Q.toFixed(6),sp=w.spd.toFixed(6);
    s+=`{float ph=${om}*(${dx}*P.x+${dz}*P.y)+t*${sp};float c=cos(ph),si=sin(ph);float a=${A}*ch;`;
    s+=`disp+=vec2(${Q}*a*${dx}*c,${Q}*a*${dz}*c);hgt+=a*si;`;
    s+=`n.x-=${dx}*${om}*a*c;n.z-=${dz}*${om}*a*c;n.y-=${Q}*${om}*a*si;}\n`; });

function seaSample(x,z,t,ch){ let dx=0,dz=0,hgt=0,nx=0,ny=1,nz=0;
  for(const w of WAVE_C){ const ph=w.om*(w.dir[0]*x+w.dir[1]*z)+t*w.spd; const c=Math.cos(ph),si=Math.sin(ph); const a=w.A*ch;
    dx+=w.Q*a*w.dir[0]*c; dz+=w.Q*a*w.dir[1]*c; hgt+=a*si; nx-=w.dir[0]*w.om*a*c; nz-=w.dir[1]*w.om*a*c; ny-=w.Q*w.om*a*si; }

function choppy(){ return 0.4+world.seaState*1.5; }

const OCEAN={N:150,reach:1500,prog:null,vao:null,idxCount:0};
function buildOcean(){
  computeWaveConsts();
  const N=OCEAN.N, verts=new Float32Array((N+1)*(N+1)*2);
  let p=0; for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){ verts[p++]=(i/N)*2-1; verts[p++]=(j/N)*2-1; }
  const idx=new Uint32Array(N*N*6); let q=0;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){ const a=j*(N+1)+i,b=a+1,c=a+(N+1),d=c+1;
    idx[q++]=a;idx[q++]=c;idx[q++]=b; idx[q++]=b;idx[q++]=c;idx[q++]=d; }
  OCEAN.idxCount=idx.length;
  OCEAN.vao=gl.createVertexArray(); gl.bindVertexArray(OCEAN.vao);
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const ib=gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);
  gl.bindVertexArray(null);

  OCEAN.prog=makeProgram(
   `layout(location=0) in vec2 aGrid; uniform mat4 uVP; uniform vec2 uCenter; uniform float uTime,uChoppy,uReach;
    out vec3 vWorld; out vec3 vNormal; out float vH;
    ${gerstnerGLSL()}
    void main(){ vec2 g=aGrid; vec2 w2=uCenter+sign(g)*pow(abs(g),vec2(1.7))*uReach;
      vec2 disp; float h; vec3 nrm; gerstner(w2,uTime,uChoppy,disp,h,nrm);
      vec3 wp=vec3(w2.x+disp.x,h,w2.y+disp.y); vWorld=wp; vNormal=nrm; vH=h;
      gl_Position=uVP*vec4(wp,1.0); }`,
   `in vec3 vWorld; in vec3 vNormal; in float vH; out vec4 frag;
    uniform vec3 uCamPos,uWaterTop,uWaterMid,uWaterDeep,uFoamCol;
    uniform float uReflStr,uFogDensity,uChoppy,uFogWeather,uMaxH;
    ${SKY_GLSL}
    float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
      float a=hash13(vec3(i,0.0)),b=hash13(vec3(i+vec2(1,0),0.0)),c=hash13(vec3(i+vec2(0,1),0.0)),d=hash13(vec3(i+vec2(1,1),0.0));
      return mix(mix(a,b,f.x),mix(c,d,f.x),f.y); }
    void main(){
      vec3 N=normalize(vNormal);
      // fine animated ripple detail perturbs the normal -> scatters glitter, adds texture
      { vec2 gp=vWorld.xz; float e=0.7;
        float n0=vnoise(gp*0.75+uTime*0.22)+0.5*vnoise(gp*2.1-uTime*0.18);
        float nx=vnoise((gp+vec2(e,0.0))*0.75+uTime*0.22)+0.5*vnoise((gp+vec2(e,0.0))*2.1-uTime*0.18);
        float nz=vnoise((gp+vec2(0.0,e))*0.75+uTime*0.22)+0.5*vnoise((gp+vec2(0.0,e))*2.1-uTime*0.18);
        N=normalize(N+vec3((n0-nx),0.0,(n0-nz))*(0.28+uChoppy*0.5));
      }
      vec3 toC=uCamPos-vWorld; float dist=length(toC); vec3 V=toC/max(dist,0.001);
      float ndv=max(dot(N,V),0.0);
      float fres=0.02+0.98*pow(1.0-ndv,5.0);
      vec3 Rr=reflect(-V,N); Rr.y=max(Rr.y,0.025);
      vec3 refl=skyColor(Rr);
      vec3 body=mix(uWaterDeep,uWaterTop,pow(ndv,0.7)); body=mix(body,uWaterMid,0.35);
      float sss=clamp(vH*0.5+0.4,0.0,1.0)*pow(max(dot(V,-uSunDir),0.0),2.0);
      body+=uWarmCol*sss*0.12*uLightStr;
      vec3 col=mix(body,refl,clamp(fres*uReflStr,0.0,1.0));
      vec3 Hh=normalize(uSunDir+V);
      float spec=pow(max(dot(N,Hh),0.0),200.0);
      col+=uSunCol*spec*1.25*uLightStr;
      float crest=smoothstep(0.74,1.0,vH/max(uMaxH,0.2));
      float ft=vnoise(vWorld.xz*0.5)*0.55+vnoise(vWorld.xz*1.9)*0.45;
      float foam=crest*(0.3+0.7*ft);
      col=mix(col,uFoamCol,clamp(foam*0.85,0.0,0.7));
      vec3 hdir=normalize(vWorld-uCamPos);
      float fogA=1.0-exp(-dist*uFogDensity);
      fogA=clamp(fogA+uFogWeather*smoothstep(60.0,700.0,dist),0.0,1.0);

      frag=vec4(col,1.0);
    }`);
}
function oceanWaterColors(sky){
  const R=regionData(), l=sky.lightStr;
  let top=mix(hex2rgb(R.water.top),sky.hor,0.30);
  top=mix(top,sky.warmCol,sky.warm*0.35); top=mix(top,[40,52,60],world.storm*0.4);
  top=mix(top,hex2rgb(R.water.deep),(1-l)*0.28);
  let mid=mix(hex2rgb(R.water.mid),[20,30,38],world.storm*0.3); mid=mix(mid,hex2rgb(R.water.deep),(1-l)*0.3);
  let deep=hex2rgb(R.water.deep);
  return {top,mid,deep};
}
function drawOcean(sky){
  const p=OCEAN.prog; gl.useProgram(p);

  gl.uniformMatrix4fv(p.u('uVP'),false,cam.vp);

  gl.uniform3fv(p.u('uFoamCol'),new Float32Array(v3(hex2rgb(regionData().foam))));
  gl.uniform1f(p.u('uReflStr'),0.9);
  gl.uniform1f(p.u('uFogDensity'),0.0022);
  gl.uniform1f(p.u('uFogWeather'),world.fog*0.9+world.storm*0.3);
  let maxH=0; for(const w of WAVES) maxH+=w.amp; maxH*=choppy();
  gl.uniform1f(p.u('uMaxH'),maxH);
  setSkyUniforms(p,sky);

  gl.drawElements(gl.TRIANGLES,OCEAN.idxCount,gl.UNSIGNED_INT,0);

}

/* ======================= 15. MESH TOOLKIT + LIT PROGRAM ================= */
function Mesh(){ return {pos:[],nrm:[],col:[]}; }
function triNormal(a,b,c){ const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz)||1; return [nx/l,ny/l,nz/l]; }
function addTri(m,a,b,c,col){ const n=triNormal(a,b,c); for(const p of [a,b,c]){ m.pos.push(p[0],p[1],p[2]); m.nrm.push(n[0],n[1],n[2]); m.col.push(col[0],col[1],col[2]); } }
function addQuad(m,a,b,c,d,col){ addTri(m,a,b,c,col); addTri(m,a,c,d,col); }
function addBox(m,cx,cy,cz,hx,hy,hz,col,colTop){
  const x0=cx-hx,x1=cx+hx,y0=cy-hy,y1=cy+hy,z0=cz-hz,z1=cz+hz; const t=colTop||col;
  addQuad(m,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],t); // top
  addQuad(m,[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],col); // bottom
  addQuad(m,[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],col); // +z
  addQuad(m,[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],col); // -z
  addQuad(m,[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],col); // +x
  addQuad(m,[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],col); // -x
}
function meshToVAO(m){
  const n=m.pos.length/3, data=new Float32Array(n*9);
  for(let i=0;i<n;i++){ const o=i*9; data[o]=m.pos[i*3];data[o+1]=m.pos[i*3+1];data[o+2]=m.pos[i*3+2];
    data[o+3]=m.nrm[i*3];data[o+4]=m.nrm[i*3+1];data[o+5]=m.nrm[i*3+2];
    data[o+6]=m.col[i*3];data[o+7]=m.col[i*3+1];data[o+8]=m.col[i*3+2]; }
  const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vb); gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
  const S=9*4;
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,S,0);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,S,12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,S,24);
  gl.bindVertexArray(null);
  return {vao,count:n};
}
function mat3FromMat4(m){ return new Float32Array([m[0],m[1],m[2],m[4],m[5],m[6],m[8],m[9],m[10]]); }
let litProg;
function initLit(){
  litProg=makeProgram(
   `layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec3 aCol;
    uniform mat4 uVP,uModel; uniform mat3 uNormalMat;
    out vec3 vN; out vec3 vCol; out vec3 vWorld;
    void main(){ vec4 wp=uModel*vec4(aPos,1.0); vWorld=wp.xyz; vN=normalize(uNormalMat*aNrm); vCol=aCol; gl_Position=uVP*wp; }`,
   `in vec3 vN; in vec3 vCol; in vec3 vWorld; out vec4 frag;
    uniform vec3 uCamPos,uAmbient,uTint,uFogColor; uniform float uFogDensity,uFogWeather,uUseSky,uEmissive;
    ${SKY_GLSL}
    void main(){
      vec3 N=normalize(vN);
      float diff=max(dot(N,uSunDir),0.0);
      vec3 amb=uAmbient*(0.5+0.5*clamp(N.y*0.5+0.5,0.0,1.0));
      vec3 base=vCol*uTint;
      vec3 col=base*(amb + uSunCol*diff*uLightStr*1.15) + base*uEmissive;
      vec3 V=normalize(uCamPos-vWorld);
      float rim=pow(1.0-max(dot(N,V),0.0),3.0);
      col+=uSunCol*rim*0.12*uLightStr;
      float dist=length(uCamPos-vWorld);
      float fogA=1.0-exp(-dist*uFogDensity); fogA=clamp(fogA+uFogWeather*smoothstep(60.0,700.0,dist),0.0,1.0);
      vec3 fc = uUseSky>0.5 ? skyColor(normalize(vWorld-uCamPos)) : uFogColor;
      col=mix(col,fc,fogA);
      frag=vec4(col,1.0);
    }`);
}
function drawLit(md,model,sky,o){
  o=o||{};
  const p=litProg; gl.useProgram(p); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  gl.uniformMatrix4fv(p.u('uVP'),false,cam.vp);
  gl.uniformMatrix4fv(p.u('uModel'),false,model);
  gl.uniformMatrix3fv(p.u('uNormalMat'),false,mat3FromMat4(model));
  gl.uniform3fv(p.u('uCamPos'),new Float32Array(cam.pos));
  gl.uniform3fv(p.u('uAmbient'),new Float32Array(o.ambient||v3(sky.ambient)));
  gl.uniform3fv(p.u('uTint'),new Float32Array(o.tint||[1,1,1]));
  gl.uniform3fv(p.u('uFogColor'),new Float32Array(o.fogColor||[0,0,0]));
  gl.uniform1f(p.u('uUseSky'),o.useSky===undefined?1:o.useSky);
  gl.uniform1f(p.u('uEmissive'),o.emissive||0);
  gl.uniform1f(p.u('uFogDensity'),o.fogDensity!=null?o.fogDensity:0.0020);
  gl.uniform1f(p.u('uFogWeather'),o.fogWeather!=null?o.fogWeather:(world.fog*0.9+world.storm*0.3));
  setSkyUniforms(p,sky);
  gl.bindVertexArray(md.vao); gl.drawArrays(gl.TRIANGLES,0,md.count); gl.bindVertexArray(null);
}

/* ======================= 16. BOAT MESH ================================== */
let BOAT={model:m4()};
function addOcta(m,cx,cy,cz,rx,ry,rz,col){
  const p=[[cx+rx,cy,cz],[cx-rx,cy,cz],[cx,cy+ry,cz],[cx,cy-ry,cz],[cx,cy,cz+rz],[cx,cy,cz-rz]];
  const f=[[0,2,4],[0,4,3],[0,3,5],[0,5,2],[1,4,2],[1,3,4],[1,5,3],[1,2,5]];
  for(const t of f) addTri(m,p[t[0]],p[t[1]],p[t[2]],col);
}
function addPrism(m,cx,cy,cz,r,h,segs,col,colTop){ // vertical cylinder
  const top=cy+h/2, bot=cy-h/2, t=colTop||col;
  for(let i=0;i<segs;i++){ const a=i/segs*TAU,b=(i+1)/segs*TAU;
    const ax=cx+Math.cos(a)*r,az=cz+Math.sin(a)*r,bx=cx+Math.cos(b)*r,bz=cz+Math.sin(b)*r;
    addQuad(m,[ax,bot,az],[bx,bot,bz],[bx,top,bz],[ax,top,az],col);
    addTri(m,[ax,top,az],[bx,top,bz],[cx,top,cz],t);
    addTri(m,[bx,bot,bz],[ax,bot,az],[cx,bot,cz],col);
  }
}
function buildBoat(){
  const m=Mesh();
  const st=player.style||{hull:[176,76,58],sail:[244,238,222],cabin:[164,68,54]};
  const red=v3(st.hull), redDk=v3(shade(st.hull,-0.28)), cream=v3([238,226,198]),
        wood=v3([126,90,58]), woodDk=v3([92,64,40]), deck=v3([158,122,78]),
        sailC=v3(st.sail), roof=v3(st.cabin), win=v3([120,178,198]),
        trim=v3([70,52,36]), dark=v3([54,50,48]), brass=v3([196,158,74]),
        buoyO=v3([224,132,54]), buoyW=v3([232,230,222]), netC=v3([150,150,120]),

  }

  addPrism(m,-2.15,1.98,0,0.155,0.14,8,red,red);
  // mast + crosstree + rigging + masthead lamp
  addPrism(m,0.55,2.35,0,0.07,3.5,6,wood,wood);
  addBox(m,0.55,3.4,0,0.06,0.05,0.6,wood);              // crosstree

// thin oriented box connecting two points (ropes/rigging/lanyards)
function addBox2(m,a,b,r,col){
  const dir=vNorm(vSub(b,a));
  const up=Math.abs(dir[1])>0.9?[1,0,0]:[0,1,0];
  const side=vNorm(vCross(dir,up)), up2=vNorm(vCross(side,dir));
  const c=[];
  for(const e of [a,b]) for(const su of [-1,1]) for(const uu of [-1,1])
    c.push([e[0]+side[0]*su*r+up2[0]*uu*r, e[1]+side[1]*su*r+up2[1]*uu*r, e[2]+side[2]*su*r+up2[2]*uu*r]);
  addQuad(m,c[0],c[2],c[6],c[4],col); addQuad(m,c[2],c[3],c[7],c[6],col);
  addQuad(m,c[3],c[1],c[5],c[7],col); addQuad(m,c[1],c[0],c[4],c[5],col);
  addQuad(m,c[0],c[1],c[3],c[2],col); addQuad(m,c[4],c[6],c[7],c[5],col);
}

function updatePlayer(dt){
  const eng=UPGRADES.engine.levels[player.upg.engine], sailU=UPGRADES.sail.levels[player.upg.sail];
  let dir=0; if(Input.left())dir=-1; else if(Input.right())dir=1;
  if(dir) player.facing=dir;

  player.targetYaw=player.facing>0?0:PI;
  let dy=((player.targetYaw-player.yaw+PI)%TAU)-PI; if(dy<-PI)dy+=TAU;
  const turnRate=1.5; player.yaw+=clamp(dy,-turnRate*dt,turnRate*dt);
  player.headX+=clamp(player.facing-player.headX,-dt*0.75,dt*0.75);
  // steering wheel angle: turns with the input, spring-centres when hands off
  const wt=(Input.right()?1:0)-(Input.left()?1:0);
  player.wheelA+=((wt*2.4)-player.wheelA)*Math.min(1,dt*7);
  const align=clamp(Math.cos(dy),0,1);   // build speed only once roughly pointed the right way
  const motor=player.motor&&player.fuel>0; let thrust=0; const eff=(typeof boatEfficiency==='function'?boatEfficiency():1);
  const techT=(typeof techThrust==='function'?techThrust()*techDrag():1);
  if(dir){ if(motor){ thrust=30*eng.spd*shipSpeed()*techT*eff*dir*align; player.fuel=Math.max(0,player.fuel-dt*0.55*eng.fuelUse*shipFuelUse()*(typeof techFuel==='function'?techFuel():1)*(0.5+Math.abs(player.speed)/26)); }
    else { const wal=0.35+0.65*clamp(dir*world.windDir*0.5+0.5,0,1); thrust=14*sailU.wind*shipSpeed()*techT*eff*(0.35+world.windStr*0.9)*wal*dir*align; } }
  if(typeof updateBoatSystems==='function') updateBoatSystems(dt, !!(dir&&motor));
  player.speed+=(thrust-player.speed*2.0)*dt; player.pos[0]+=player.speed*dt;
  if(typeof currentPush==='function') player.pos[0]+=currentPush()*dt*(typeof techNav==='function'?techNav():1);  // the current carries you
  const len=regionData().length;
  if(player.pos[0]<18){player.pos[0]=18;player.speed*=-.3;} if(player.pos[0]>len){player.pos[0]=len;player.speed*=-.3;}
  // storm hull damage far from port
  if(world.storm>0.55){ const np=nearestPort(); const far=!np||Math.abs(np.x-player.pos[0])>240;
    if(far){ player.hull=Math.max(0,player.hull-(world.storm-0.5)*dt*3.0*homeStormMult()*(typeof techStormR==='function'?techStormR():1)/UPGRADES.hull.levels[player.upg.hull].armor);
      if(Game.frame%40===0){ view.shake=Math.min(1.2,view.shake+0.25*world.storm); } if(player.hull<=0&&typeof onSink==='function') onSink(); } }

   `layout(location=0) in vec3 aPos; uniform mat4 uVP,uModel; uniform float uPoint;
    void main(){ gl_Position=uVP*uModel*vec4(aPos,1.0); gl_PointSize=uPoint; }`,
   `out vec4 frag; uniform vec4 uColor; uniform float uPoint;
    void main(){ if(uPoint>0.0){ vec2 d=gl_PointCoord-0.5; if(dot(d,d)>0.25) discard; } frag=uColor; }`);
  shaftProg=makeProgram(
   `layout(location=0) in vec2 aUV; uniform mat4 uVP,uModel; out vec2 vUV;
    void main(){ vUV=aUV; gl_Position=uVP*uModel*vec4(aUV.x,aUV.y,0.0,1.0); }`,
   `in vec2 vUV; out vec4 frag; uniform vec4 uColor;
    void main(){ float w=pow(clamp(1.0-abs(vUV.x),0.0,1.0),1.8);
      float top=smoothstep(0.0,-0.14,vUV.y); float bot=1.0-smoothstep(-0.5,-1.0,vUV.y);

function buildJelly(){
  const m=Mesh(); const rings=5,segs=12;
  const p=(t,a)=>[Math.sin(t)*Math.cos(a),Math.cos(t),Math.sin(t)*Math.sin(a)];
  for(let j=0;j<rings;j++){ const t0=j/rings*PI*0.55,t1=(j+1)/rings*PI*0.55;
    for(let i=0;i<segs;i++){ const a0=i/segs*TAU,a1=(i+1)/segs*TAU;
      addQuad(m,p(t0,a0),p(t0,a1),p(t1,a1),p(t1,a0),[1,1,1]); } }
  UW.jelly=meshToVAO(m);
}

/* ---- Seabed life: kelp, coral, rocks, seagrass (region-flavoured) ------- */
function addKelp(m,x,y,z,h,seed,col,tip){
  const segs=7, w=0.16; let px=x,py=y,pz=z;
  for(let i=0;i<segs;i++){ const t=(i+1)/segs;
    const nx=x+Math.sin(t*3.0+seed)*1.7*t, ny=y+t*h, nz=z+Math.cos(t*2.2+seed)*0.7*t;
    const c=mix(col,tip,t); const ww=w*(1-t*0.4);
    addQuad(m,[px,py,pz+w],[nx,ny,nz+ww],[nx,ny,nz-ww],[px,py,pz-w],c);
    addQuad(m,[px,py+0.02,pz],[nx,ny+0.02,nz],[nx+0.02,ny,nz+ww],[px+0.02,py,pz+w],mix(c,tip,0.2));
    px=nx;py=ny;pz=nz; }
}
// --- extra seabed-life builders (anemone, sponge, urchin, tube coral, blades) ---
function addAnemone(m,x,y,z,r,col,tip){
  addOcta(m,x,y+r*0.35,z,r*0.85,r*0.55,r*0.85,v3(shade(col,-0.1)));

function addSponge(m,x,y,z,r,h,col){

function addUrchin(m,x,y,z,r,col){
  addOcta(m,x,y+r*0.4,z,r*0.7,r*0.55,r*0.7,v3(col));
  const N=12; for(let i=0;i<N;i++){ const a=i/N*TAU, e=0.6+((i*7)%5)/5*0.7;
    addPrism(m,x+Math.cos(a)*r*0.45,y+r*0.5+e*r*0.35,z+Math.sin(a)*r*0.45,r*0.05,r*e,4,v3(mix(col,[15,15,25],0.35))); }

function addTubeCoral(m,x,y,z,col,rr){
  const n=4+((rr()*4)|0); for(let i=0;i<n;i++){ const bx=x+(rr()*2-1)*1.1,bz=z+(rr()*2-1)*1.1,h=1.2+rr()*2.4;

function addBlade(m,x,y,z,h,lean,leanZ,col){ const w=0.08;
  addQuad(m,[x-w,y,z],[x+w,y,z],[x+lean+w*0.5,y+h,z+leanZ],[x+lean-w*0.5,y+h,z+leanZ],col);

function addTuft(m,x,y,z,n,h,seed,col,tip){

function buildSeabedLife(){
  const R=regionData(), m=Mesh(); const rr=mulberry32(1000+world.region*7);
  const nz=makeNoise1D(556);
  const hAt=(x,z)=>(fbm1(nz,(x*0.5+555)*0.02,3)+fbm1(nz,(z*0.5-222)*0.02,3))*5.0;
  const cold=(R.id==='north'||R.id==='verge');
  const N=190;
  for(let i=0;i<N;i++){
    const x=(rr()*2-1)*195, z=(rr()*2-1)*100, y=hAt(x,z); const s=rr();
    if(cold){
      if(s<0.34){ for(let b=0;b<3;b++){ const h=16+rr()*24; addKelp(m,x+(rr()*2-1)*1.6,y,z+(rr()*2-1)*1.6,h,rr()*6,v3([40,86,60]),v3([120,150,90])); } }

      else if(s<0.92){ addUrchin(m,x,y,z,0.5+rr()*0.4,[40,44,60]); }
      else { addOcta(m,x,y+0.1,z,0.55,0.11,0.55,v3(pick([[210,120,80],[230,180,90]]))); }       // starfish
    } else if(R.id==='trop'){
      if(s<0.28){ const cols=[[224,110,120],[240,160,70],[150,110,200],[90,180,180]]; const cc=pick(cols);
        addOcta(m,x,y+0.4,z,0.7,0.6,0.7,v3(cc));

      else if(s<0.44){ addOcta(m,x,y+0.5,z,1.1,0.7,1.1,v3([210,180,120])); }                    // brain coral
      else if(s<0.58){ const fc=pick([[214,92,120],[186,112,196],[232,142,82]]);
        for(let b=0;b<5;b++){ const ang=(b/4-0.5)*1.3; addKelp(m,x,y,z,2.6+rr()*2.4,ang*3.5,v3(fc),v3(mix(fc,[255,255,255],0.35))); } }
      else if(s<0.72){ addTubeCoral(m,x,y,z,pick([[230,120,110],[240,180,90],[170,120,210]]),rr); }
      else if(s<0.84){ addAnemone(m,x,y,z,0.6+rr()*0.6,pick([[120,180,220],[240,150,90],[200,110,180]]),[255,240,180]); }
      else if(s<0.93){ addUrchin(m,x,y,z,0.45+rr()*0.4,[30,30,50]); }

    } else { // med
      if(s<0.4){ addTuft(m,x,y,z,8,4+rr()*4,rr(),[70,120,60],[160,190,100]); }                  // posidonia meadow tuft
      else if(s<0.58){ for(let b=0;b<4;b++) addKelp(m,x+(rr()*2-1),y,z+(rr()*2-1),4+rr()*6,rr()*6,v3([70,120,60]),v3([150,180,90])); }

    else if(q<0.85){ addOcta(m,x,y+0.06,z,0.16+rr()*0.16,0.08,0.16+rr()*0.16,v3(shade([196,182,150],(rr()-0.5)*0.3))); } // pebbles/shells
    else { addOcta(m,x,y+0.05,z,0.4,0.09,0.4,v3(pick([[214,120,90],[120,150,200],[230,200,120]]))); } }          // starfish/shell
  // tall pinnacles (reefs / rock towers) that rise into the mid-water
  for(let i=0;i<10;i++){ const x=(rr()*2-1)*155,z=(rr()*2-1)*78,y=hAt(x,z); const hh=20+rr()*20;
    const cc = R.id==='trop'? pick([[224,110,120],[240,160,70],[120,180,180]]) : R.id==='med'? [130,120,96] : [76,80,84];

  if(UW.decor&&UW.decor.vao) gl.deleteVertexArray(UW.decor.vao);

function updateJellies(dt){ for(const j of UW.jellies){ j.ph+=dt*1.2; j.y+=Math.sin(j.ph)*0.3*dt + j.vy*dt;

function drawJellies(sky){

function updateAmbient(dt){ if(!UW.ambient) return; const L=fishing.lure;

/* ======================= 21. FISHING SIM ================================ */
const WORLD_DEPTH=58;
const fishing={ active:false, lure:{x:0,y:-2,z:0,vx:0,vy:0,vz:0}, maxDepthWorld:48, school:[], hitFlash:0, msg:'', fight:null };
function fishValue(def,len){ const t=inv(def.len[0],def.len[1],len)||0; return Math.round(def.base*(0.7+0.6*clamp(t,0,1))*(typeof techValue==='function'?techValue():1)); }
function pickFishId(){
  const R=regionData(); const ids=R.fish.filter(id=>!FISH[id].legendary);
  if(chance(0.015*fishSeasonMult(R.legendary))&&FISH[R.legendary]) return R.legendary;
  let tot=0; const w=[]; for(const k of ids){ const d=FISH[k]; const ew=d.weight*(0.4+d.len[1]/70)*fishSeasonMult(k); w.push(ew); tot+=ew; }
  let r=rnd()*tot; for(let i=0;i<ids.length;i++){ r-=w[i]; if(r<=0) return ids[i]; } return ids[0];
}
function spawnFish(nearX, atEdge, forceId){
  const id=forceId||pickFishId(); const def=FISH[id];
  const y=-rrange(def.depth[0],def.depth[1])*WORLD_DEPTH;
  const x=nearX + (atEdge? (chance(0.5)?-1:1)*rrange(34,46) : rrange(-40,40));
  const z=rrange(-2.2,2.2);
  const skittish = def.legendary || def.hits>=3;
  const schooling = def.hits===1 && def.len[1]<=24;
  const shoal = schooling? 3+rint(0,3) : 1;
  for(let s=0;s<shoal;s++){
    const ox=schooling?rrange(-5,5):0, oy=schooling?rrange(-3,3):0, oz=schooling?rrange(-3,3):0;
    const len=rrange(def.len[0],def.len[1]);
    fishing.school.push({id,def,pos:[x+ox,clamp(y+oy,-WORLD_DEPTH+1,-1.5),z+oz],dir:rrange(0,TAU),vx:0,vy:0,vz:0,hp:def.hits,size:len/58,len,
      wt:rrange(0.3,1.4),phase:rrange(0,TAU),cd:0,skittish,band:clamp(y+oy,-WORLD_DEPTH+1,-1.5),flash:0,sch:schooling});
    if(fishing.school.length>28) break;
  }
}
function spawnInitialFish(){ fishing.school=[]; for(let i=0;i<18;i++) spawnFish(player.pos[0],false);
  const R=regionData(); const big=R.fish.filter(id=>!FISH[id].legendary).sort((a,b)=>FISH[b].len[1]-FISH[a].len[1]).slice(0,3);
  for(const id of big) spawnFish(player.pos[0],false,id);
  UW.motes=[]; for(let i=0;i<UW.moteN;i++) UW.motes.push({x:player.pos[0]+rrange(-30,30),y:-rrange(2,WORLD_DEPTH),z:rrange(-16,16),vy:rrange(1,4),ph:rrange(0,TAU)});
  initJellies(player.pos[0]); initAmbient(player.pos[0]); }
function toggleFishing(){
  if(Game.screen==='sail'){
    if(Math.abs(player.speed)>3){ toast('Slow down to drop your line',ic('rod')); return; }
    if(player.bait<=0){ toast('Out of bait — buy more at a port',ic('worm')); return; }
    player.bait--; fishing.active=true; fishing.fight=null; buildSeabedLife();
    tip('firstfish','Pilot the glowing lure with the arrows and touch a fish to hook it. Deeper water hides richer fish — and, rarely, something dangerous.');
    // roll whether a predator prowls this session — usually not, more likely at night / in a storm
    if(typeof Beast!=='undefined'){ beastReset(); const nf=clamp(1-skyColors().dayness*1.7,0,1);
      Beast.present=chance(0.14 + nf*0.14 + world.storm*0.22); }
    fishing.remaining=1; fishing.lineOut=2.5;
    fishing.lure={x:player.pos[0],y:-2.5,z:0,vx:0,vy:0,vz:0};
    spawnInitialFish(); if(Sound.splash)Sound.splash();
    cam.pos=[player.pos[0],1,15]; cam.target=[player.pos[0],-3,0];
    Game.set('fish');
  } else if(Game.screen==='fish'){
    fishing.active=false; if(Sound.reel)Sound.reel(); Game.set('sail');
  }
}
function updateFishing(dt){
  if(fishing.fight){ updateFight(dt); return; }
  const L=fishing.lure, lp=UPGRADES.lure.levels[player.upg.lure];
  // pilot the lure
  let ax=0,ay=0; if(Input.left())ax-=1; if(Input.right())ax+=1; if(Input.up())ay+=1; if(Input.down())ay-=1;
  const acc=46; L.vx+=(ax*acc-L.vx*3.2)*dt; L.vy+=(ay*acc-L.vy*3.2)*dt;
  L.x+=L.vx*dt; L.y+=L.vy*dt;
  if(L.y>-1.2) L.y=-1.2;
  // line spool: line pays out with depth+distance from the boat; cannot exceed the spool length
  const bx=player.pos[0], spoolMax=lineSpool();
  let dxl=L.x-bx, dyl=-L.y, len=Math.hypot(dxl,dyl);
  if(len>spoolMax){ const s=spoolMax/len; L.x=bx+dxl*s; L.y=-dyl*s; if(L.y>-1.2)L.y=-1.2; len=spoolMax; if(L.vy>0)L.vy*=0.4; }
  fishing.lineOut=len; fishing.remaining=clamp(1-len/spoolMax,0,1);
  const attractR=(3.6+lp.attract*0.06)*homeAttract()*(typeof techAttractR==='function'?techAttractR():1)*(typeof tideBite==='function'?tideBite():1), fleeR=7.5, hitR=1.7+lp.power*0.5; fishing.hitR=hitR;
  fishing.hitFlash=Math.max(0,fishing.hitFlash-dt*3);
  // fish behaviour

  player.hold.push({id:f.id,len:Math.round(f.len),value:val});
  const firstEver=!player.discovered[f.id]; player.discovered[f.id]=true;
  if(firstEver&&typeof awardRP==='function') awardRP(f.def.legendary?14:5, 'new species logged');
  if(typeof questEvent==='function') questEvent('catch',{sp:f.id});
  if(!player.records[f.id]||f.len>player.records[f.id]) player.records[f.id]=Math.round(f.len);
  view.flash=0.5; view.flashCol=f.def.legendary?'#ffe6a0':'#dff3ff';
  if(Sound.chime)Sound.chime();
  if(f.def.legendary){ const ri=world.region; player.caughtLegendary[ri]=true;
    toast(`Legendary — ${f.def.name}! (${coinStr(val)} coin)`,ic('trophy')); awardStar(2,'legendary catch'); if(typeof checkRegionGoal==='function') checkRegionGoal(); }
  else toast(`Caught ${f.def.name} · ${Math.round(f.len)}cm · ${val} coin`,ic('fish'));
}

    const ax=cx+Math.cos(a)*r,az=cz+Math.sin(a)*r,bx=cx+Math.cos(b)*r,bz=cz+Math.sin(b)*r;
    addTri(m,[ax,bot,az],[bx,bot,bz],[cx,top,cz],col);
    addTri(m,[bx,bot,bz],[ax,bot,az],[cx,bot,cz],col); }
}

let COAST={mesh:null,lamps:[],lights:[]};
const GULLS=[];
function buildCoast(){
  const R=regionData(), m=Mesh(); const rr=mulberry32(700+world.region*13);
  const nz=makeNoise1D(300+world.region*5), nz2=makeNoise1D(811+world.region);
  const shoreZ=-60, len=R.length;
  const hillCol=hex2rgb(R.hills[2]), hillBack=hex2rgb(R.hills[0]), sand=[214,198,160];
  const cold=(R.id==='north'||R.id==='verge');
  const rows=[{z:shoreZ,h:0},{z:-70,h:3},{z:-84,h:9},{z:-100,h:20},{z:-120,h:37},{z:-146,h:58},{z:-176,h:80},{z:-214,h:98}];
  const NR=rows.length, maxH=rows[NR-1].h, snowline=maxH*0.55;
  const hf=x=>0.42+0.58*(fbm1(nz,x*0.0042,5)*0.5+0.5);
  const rug=(x,zi)=>fbm1(nz2,x*0.02+zi*4.1,4);
  const H=(x,zi)=> Math.max(0, rows[zi].h*hf(x) + (zi?rug(x,zi)*rows[zi].h*0.32:0));
  const groundY=(x,z)=>{ if(z>=rows[0].z) return 0; for(let r=0;r<NR-1;r++){ const a=rows[r],b=rows[r+1];
    if(z<=a.z&&z>=b.z){ const t=(z-a.z)/(b.z-a.z); return lerp(H(x,r),H(x,r+1),t); } } return H(x,NR-1); };
  const colAt=(x,zi,y)=>{ let base= zi<=1? mix(sand,hillCol,0.4) : mix(hillCol,hillBack,clamp((zi-1)/(NR-2),0,1));
    base=shade(base, rug(x,zi)*0.12+(hf(x)-0.7)*0.1);
    if(y>snowline){ const t=clamp((y-snowline)/(maxH*0.3),0,1); base= cold? mix(base,[236,240,246],t*0.92) : mix(base,[128,122,114],t*0.6); }
    if(zi===0) base=sand; return v3(base); };
  const step=11;
  for(let x=-60;x<len+60;x+=step){
    for(let r=0;r<NR-1;r++){ const a=rows[r],b=rows[r+1];
      const ya0=H(x,r),ya1=H(x+step,r),yb0=H(x,r+1),yb1=H(x+step,r+1);
      addQuad(m,[x,ya0,a.z],[x+step,ya1,a.z],[x+step,yb1,b.z],[x,yb0,b.z], colAt(x,r+1,(yb0+yb1)/2));
    }
  }
  // ---- dense forests (thousands of clustered trees) ----
  const treeKind = R.id==='trop'?'palm':R.id==='med'?'cypress':'pine';
  const clusters=Math.floor(len/70);
  for(let c=0;c<clusters;c++){ const cx=rr()*len, cz=lerp(-72,-152,rr()), n=28+Math.floor(rr()*48);
    for(let t=0;t<n;t++){ const x=cx+(rr()*2-1)*24, z=cz+(rr()*2-1)*18; if(z>-66||z<-192) continue;
      const y=groundY(x,z); if(y<1.5||y>snowline) continue; addLoTree(m,x,y,z,0.6+rr()*0.8,treeKind,rr); } }
  for(let i=0;i<Math.floor(len/6);i++){ const x=rr()*len, z=lerp(-68,-176,rr()), y=groundY(x,z);
    if(y<1.2) continue; const rl=rr();
    if(y>snowline){ if(rl<0.5) addOcta(m,x,y+0.3,z,0.6+rr(),0.5+rr()*0.7,0.6+rr(),v3(cold?[220,226,232]:[120,116,108])); continue; }
    if(rl<0.72) addLoTree(m,x,y,z,0.55+rr()*0.7,treeKind,rr);
    else if(rl<0.9) addCone(m,x,y,z,0.4+rr()*0.5,0.7+rr()*0.7,5,v3(shade([70,96,64],(rr()-.5)*.3)));
    else addOcta(m,x,y+0.3,z,0.5+rr(),0.4+rr()*0.6,0.5+rr(),v3([104,100,92])); }
  // coastal rocks at the waterline
  for(let i=0;i<Math.floor(len/50);i++){ const x=rr()*len, z=shoreZ+2+rr()*6;
    for(let k=0;k<3;k++) addOcta(m,x+rr()*4-2,-0.2+rr()*0.6,z+rr()*3,0.5+rr()*0.9,0.4+rr()*0.7,0.5+rr()*0.9,v3([96,94,88])); }
  // ---- mountainous offshore islands + sea stacks ----
  for(let i=0;i<9;i++){ const ix=rr()*len, iz=-16-rr()*42, base=4+rr()*7, peaks=2+Math.floor(rr()*2);
    let py=0, pr=base;
    for(let k=0;k<peaks;k++){ const ox=(rr()*2-1)*base*0.3, oz=(rr()*2-1)*base*0.3;
      addCone(m,ix+ox,py,iz+oz,pr,pr*1.5,7,v3(mix(hillCol,sand,0.32))); py+=pr*0.9; pr*=0.6; }
    if(cold&&py>7) addCone(m,ix,py-1.2,iz,pr*1.4,pr*1.7,6,v3([234,238,244]));
    const nt=Math.floor(base*2.4); for(let t=0;t<nt;t++){ const a=rr()*TAU, rad=rr()*base*0.95;
      const tx=ix+Math.cos(a)*rad, tz=iz+Math.sin(a)*rad; addLoTree(m,tx,base*0.32+rr()*base*0.35,tz,0.4+rr()*0.4,treeKind,rr); } }
  for(let i=0;i<6;i++){ const x=rr()*len, iz=-12-rr()*30, h=5+rr()*9;
    addPrism(m,x,h*0.4,iz,0.8+rr()*0.9,h,6,v3([92,90,86]),v3([96,94,90])); }
  // ---- end headlands: natural cliff walls that close off both ends of the route ----
  const headland=(cx,dir)=>{
    for(let z=-58;z<=24;z+=5){ const t=clamp((z+58)/82,0,1);       // 0 at shore .. 1 at seaward tip
      const h=(26+rr()*12)*(1-t*0.4);                              // tall by the shore, tapering out to sea
      const w=8+rr()*3.5;
      const bx=cx + dir*(3+t*11 + rr()*2);                         // curl the cliff back across the boat lane
      addCone(m,bx,h*0.42,z,w,h,7,v3(mix(hillCol,hillBack,0.42+rr()*0.16)));
      if(cold&&h>17) addCone(m,bx,h*0.86,z,w*0.5,h*0.5,6,v3([232,238,244]));
      else if(!cold&&t<0.5) addLoTree(m,bx+(rr()*2-1)*w*0.4,h*0.5,z,0.5+rr()*0.5,treeKind,rr); }
    for(let k=0;k<12;k++){ const z=-56+rr()*76; addOcta(m,cx+dir*(1+rr()*7),-0.2+rr()*1.3,z,1+rr()*1.7,0.8+rr()*1.5,1+rr()*1.7,v3([94,92,88])); }
  };
  headland(2,1); headland(len-2,-1);
  // villages at ports
  COAST.lamps=[]; COAST.lights=[];
  for(const p of R.ports){

function drawCoast3D(sky){
  if(!COAST.mesh) return;
  drawLit(COAST.mesh,COAST_MODEL,sky,{fogDensity:0.0016,fogWeather:world.fog*0.9+world.storm*0.3});
  const t=Game.t, ch=choppy();
  // navigation buoys bobbing on the swell
  if(COAST.buoyMesh&&COAST.buoys) for(const b of COAST.buoys){ const s=seaSample(b.x,b.z,t,ch), fwd=seaSample(b.x+1.2,b.z,t,ch), sd=seaSample(b.x,b.z+1.2,t,ch);
    const mo=m4(); m4compose(mo,[b.x,s.y-0.4,b.z],0,Math.atan2(fwd.y-s.y,1.2),Math.atan2(sd.y-s.y,1.2),[1,1,1]);
    drawLit(COAST.buoyMesh,mo,sky,{tint:v3(b.col),fogDensity:0.0016}); }
  // other fishing boats working the coast
  if(BOAT.mesh&&COAST.boats) for(const bt of COAST.boats){ const x=wrap(bt.x0+t*bt.spd,COAST.len+240)-120;
    const s=seaSample(x,bt.z,t,ch), fwd=seaSample(x+(bt.spd>0?2.6:-2.6),bt.z,t,ch), sd=seaSample(x,bt.z+2.6,t,ch);
    const mo=m4(); m4compose(mo,[x,s.y+0.05,bt.z],bt.spd>0?0:PI,Math.atan2(fwd.y-s.y,2.6)*(bt.spd>0?1:-1),Math.atan2(sd.y-s.y,2.6),[0.92,0.92,0.92]);
    drawLit(BOAT.mesh,mo,sky,{tint:bt.tint,fogDensity:0.0016}); if(BOAT.sails) drawLit(BOAT.sails,mo,sky,{tint:bt.tint,fogDensity:0.0016}); }
  // gulls
  if(COAST.gull){ for(const g of GULLS){ const a=Game.t*g.spd+g.ph; const x=g.cx+Math.cos(a)*g.r, z=g.cz+Math.sin(a)*g.r;
    const y=g.y+Math.sin(Game.t*0.6+g.ph)*1.2; const flap=0.5+0.5*Math.abs(Math.sin(Game.t*g.flap+g.ph));
    const mo=m4(); m4compose(mo,[x,y,z],a+PI/2,0,0,[1.1,0.5+flap*0.9,1.1]);
    drawLit(COAST.gull,mo,sky,{fogDensity:0.0016}); } }
  // warm lamp / lighthouse glows at dusk & night
  const glow=clamp(1-sky.dayness*1.6,0,1);
  if(glow>0.05 && unlitProg){ gl.useProgram(unlitProg); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE); gl.depthMask(false);
    gl.uniform1f(unlitProg.u('uPoint'),0); gl.uniformMatrix4fv(unlitProg.u('uVP'),false,cam.vp); gl.bindVertexArray(UW.dot.vao);
    for(const L of COAST.lamps){ const mo=m4trans(m4(),L[0],L[1],L[2]); gl.uniformMatrix4fv(unlitProg.u('uModel'),false,mo);
      const d=Math.hypot(cam.pos[0]-L[0],cam.pos[2]-L[2]); gl.uniform4f(unlitProg.u('uColor'),1,0.86,0.5,0.5*glow); gl.uniform1f(unlitProg.u('uPoint'),clamp(700/d,4,26)*DPR); gl.drawArrays(gl.POINTS,0,1); }
    for(const L of COAST.lights){ const mo=m4trans(m4(),L[0],L[1],L[2]); gl.uniformMatrix4fv(unlitProg.u('uModel'),false,mo);
      const beam=0.5+0.5*Math.sin(Game.t*1.5); gl.uniform4f(unlitProg.u('uColor'),1,0.92,0.6,(0.4+0.5*beam)*glow); gl.uniform1f(unlitProg.u('uPoint'),40*DPR); gl.drawArrays(gl.POINTS,0,1); }
    gl.bindVertexArray(null); gl.depthMask(true); gl.disable(gl.BLEND); }
}

function enterRegion(i){
  world.region=clamp(i,0,REGIONS.length-1);
  const home=regionData().ports[0];
  player.pos=[home.x+140,0,0]; player.speed=0; player.facing=-1; player.yaw=PI;
  if(typeof Traders!=='undefined') Traders.list=[];
  if(typeof beastReset==='function') beastReset();
  fishing.fight=null;
  if(player.seenPorts) player.seenPorts[home.name]=true;
  buildCoast(); buildSeabedLife();
  if(typeof toast==='function') toast(regionData().name,ic(RICON[regionData().id]));
}
let nearPort=null;
function updateDocking(){ nearPort=null; for(const p of regionData().ports){ const d=Math.abs(p.x-player.pos[0]);
    if(d<80&&player.seenPorts&&!player.seenPorts[p.name]){ player.seenPorts[p.name]=true; toast(`Charted ${p.name}`,ic(p.icon)); }
    if(d<28){ nearPort=p; break; } } }
function tryDock(){
  if(Game.screen!=='sail'){ return; }
  if(!nearPort){ toast('No harbour within reach',ic('anchor')); return; }
  if(Math.abs(player.speed)>4.5){ toast('Ease off the throttle to dock',ic('anchor')); return; }
  if(typeof openTown==='function') openTown(nearPort);
}

const RAIN={n:640};
function initRain(){
  RAIN.drops=[]; for(let i=0;i<RAIN.n;i++) RAIN.drops.push([rrange(-1,1),rnd(),rrange(-1,1),rnd()]);
  RAIN.arr=new Float32Array(RAIN.n*2*3);
  RAIN.vao=gl.createVertexArray(); gl.bindVertexArray(RAIN.vao); RAIN.buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,RAIN.buf);
  gl.bufferData(gl.ARRAY_BUFFER,RAIN.arr,gl.DYNAMIC_DRAW); gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0); gl.bindVertexArray(null);
}
function drawPrecip(sky){
  if(Game.screen==='fish'||!RAIN.vao) return;
  const rain=world.rainI, snow=world.snowI; if(rain<0.02&&snow<0.02) return;
  const Rr=50, H=70, cx=cam.pos[0], cy=cam.pos[1], cz=cam.pos[2], wind=world.windDir*(2+world.windStr*7);
  const I=m4ident(m4());
  if(rain>0.02){ const n=Math.floor(RAIN.n*clamp(rain,0,1)); const speed=48, len=1.1+rain*1.4;
    for(let i=0;i<n;i++){ const d=RAIN.drops[i]; const x=cx+d[0]*Rr, z=cz+d[2]*Rr, y=cy+H*0.55-wrap(d[1]*H+Game.t*speed,H);
      const o=i*6; RAIN.arr[o]=x-wind*len*0.3;RAIN.arr[o+1]=y+len;RAIN.arr[o+2]=z; RAIN.arr[o+3]=x;RAIN.arr[o+4]=y;RAIN.arr[o+5]=z; }
    gl.useProgram(unlitProg); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false); gl.uniform1f(unlitProg.u('uPoint'),0);
    gl.uniformMatrix4fv(unlitProg.u('uVP'),false,cam.vp); gl.uniformMatrix4fv(unlitProg.u('uModel'),false,I);
    gl.uniform4f(unlitProg.u('uColor'),0.74,0.83,0.92,0.32+world.storm*0.28);
    gl.bindVertexArray(RAIN.vao); gl.bindBuffer(gl.ARRAY_BUFFER,RAIN.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,RAIN.arr.subarray(0,n*6));
    gl.drawArrays(gl.LINES,0,n*2); gl.bindVertexArray(null); gl.depthMask(true); gl.disable(gl.BLEND);
  }
  if(snow>0.02){ const n=Math.floor(RAIN.n*clamp(snow,0,1)); const speed=9;
    for(let i=0;i<n;i++){ const d=RAIN.drops[i]; const sway=Math.sin(Game.t*0.6+d[3]*TAU)*2.6; const x=cx+d[0]*Rr+sway, z=cz+d[2]*Rr, y=cy+H*0.55-wrap(d[1]*H+Game.t*speed,H);
      const o=i*6; RAIN.arr[o]=x;RAIN.arr[o+1]=y;RAIN.arr[o+2]=z; RAIN.arr[o+3]=x+0.01;RAIN.arr[o+4]=y;RAIN.arr[o+5]=z; }
    gl.useProgram(unlitProg); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    gl.uniformMatrix4fv(unlitProg.u('uVP'),false,cam.vp); gl.uniformMatrix4fv(unlitProg.u('uModel'),false,I);
    gl.uniform4f(unlitProg.u('uColor'),0.96,0.98,1.0,0.75); gl.uniform1f(unlitProg.u('uPoint'),3.2*DPR);
    gl.bindVertexArray(RAIN.vao); gl.bindBuffer(gl.ARRAY_BUFFER,RAIN.buf); gl.bufferSubData(gl.ARRAY_BUFFER,0,RAIN.arr.subarray(0,n*6));
    gl.drawArrays(gl.POINTS,0,n*2); gl.bindVertexArray(null); gl.depthMask(true); gl.disable(gl.BLEND);
  }
}

const ECO={fish:{},goods:{}};
function initEconomy(){
  for(const R of REGIONS) for(const p of R.ports){
    ECO.fish[p.name]={}; for(const id of R.fish){ let mlt=0.82+rnd()*0.4; if(p.spec.includes(id)) mlt+=0.35; ECO.fish[p.name][id]=mlt; }
    ECO.goods[p.name]={}; for(const g in GOODS){ ECO.goods[p.name][g]=Math.round(GOODS[g].base*(0.7+rnd()*0.7)); }
  }
}
function driftMarkets(){
  for(const pn in ECO.fish){ for(const id in ECO.fish[pn]) ECO.fish[pn][id]=clamp(ECO.fish[pn][id]+(rnd()-0.5)*0.12,0.6,1.75);
    for(const g in ECO.goods[pn]) ECO.goods[pn][g]=Math.round(clamp(ECO.goods[pn][g]*(1+(rnd()-0.5)*0.2),GOODS[g].base*0.5,GOODS[g].base*1.9)); }
}
function fishSellPrice(port,item){ return Math.max(1,Math.round(item.value*(item.mult||1)*(ECO.fish[port.name]&&ECO.fish[port.name][item.id]||1)*homeSellMult()*(1+repSellBonus()))); }
// reputation perks: standing in the current region gives market discounts + a sell bonus
function repDiscount(){ return (typeof repTierIdx==='function')?([0,0,0.08,0.15,0.22][repTierIdx(regionData().id)]||0):0; }
function repSellBonus(){ return (typeof repTierIdx==='function')?([0,0.03,0.06,0.10,0.15][repTierIdx(regionData().id)]||0):0; }
function repPriceMul(){ return 1-repDiscount(); }
function goodsPrice(port,g){ return (ECO.goods[port.name]&&ECO.goods[port.name][g])||GOODS[g].base; }

const STRUCT_ORDER=['warehouse','market','countinghouse','crane','boathouse','smokehouse','lighthouse','baitshack','lab'];
const HOME_PLOTS={warehouse:[-16,-72],market:[13,-69],countinghouse:[-3,-88],crane:[25,-66],boathouse:[-27,-79],smokehouse:[-11,-90],lighthouse:[27,-95],baitshack:[7,-64],lab:[-22,-92]};
function homeBuilt(id){ return !!(player.home&&player.home.built&&player.home.built[id]); }
function homeHas(id){ return homeBuilt(id); }
function homeSellMult(){ return 1+(homeBuilt('smokehouse')?0.18:0)+(homeBuilt('countinghouse')?0.10:0); }
function homeStormMult(){ return homeBuilt('lighthouse')?0.5:1; }
function homeAttract(){ return 1; }
function homeHoldBonus(){ return homeBuilt('boathouse')?12:0; }
function homeMoorage(){ return 0; }
function tradeCapacity(){ return (homeBuilt('warehouse')?45:0)+(homeBuilt('crane')?45:0)+(homeBuilt('market')?25:0); }
function homeStockTotal(){ let s=0; const st=(player.home&&player.home.stock)||{}; for(const k in st) s+=st[k]; return s; }
function homeTradeMarkup(){ return 1.2+(homeBuilt('countinghouse')?0.25:0)+(homeBuilt('market')?0.12:0); }
function tradeRate(){ if(!homeBuilt('warehouse'))return 0; return 2+(homeBuilt('market')?2:0)+(homeBuilt('crane')?1:0)+(homeBuilt('countinghouse')?1:0); }
function buyStructure(id){ const s=STRUCT[id]; if(!s||homeBuilt(id))return; if(player.money<s.cost){toast('Not enough coin',ic('coin'));return;}
  player.money-=s.cost; player.home.built[id]=true; if(Sound.chime)Sound.chime();
  if(typeof checkReadiness==='function') checkReadiness();
  toast(`${s.name} built at your home port`,ic('house')); if(typeof buildCoast==='function') buildCoast(); renderTown(); saveGame(); }
function depositGood(id){ const have=player.cargo[id]||0; if(!have){ toast('None of that in your cargo',ic('crate')); return; }
  const room=tradeCapacity()-homeStockTotal(); if(room<=0){ toast('Warehouse is full',ic('crate')); return; }
  const n=Math.min(have,room); player.cargo[id]-=n; if(player.cargo[id]<=0)delete player.cargo[id];
  player.home.stock[id]=(player.home.stock[id]||0)+n; if(Sound.ui)Sound.ui(); toast(`Stocked ${n}× ${GOODS[id].name} for trade`,ic('crate')); renderTown(); saveGame(); }
function collectTrade(){ const a=Math.round(player.home.accrued||0); if(a<=0){ toast('No trade earnings waiting',ic('coin')); return; }
  player.money+=a; player.home.accrued=0; if(Sound.coin)Sound.coin(); toast(`Collected ${coinStr(a)} in trade earnings`,ic('coin')); renderTown(); saveGame(); }
// passive: traders buy a little of your warehouse stock each day
function tradeAccrueDay(){ if(!homeBuilt('warehouse'))return; const st=player.home.stock||{}; let toSell=tradeRate(); const mk=homeTradeMarkup();
  const ids=Object.keys(st).filter(k=>st[k]>0).sort((a,b)=>GOODS[b].base-GOODS[a].base); let gain=0;
  for(const id of ids){ if(toSell<=0)break; const n=Math.min(st[id],toSell); const price=Math.round(GOODS[id].base*mk);
    st[id]-=n; toSell-=n; gain+=n*price; if(st[id]<=0)delete st[id]; }
  if(gain>0) player.home.accrued=(player.home.accrued||0)+gain; }
// live: a trader boat has moored and bought a parcel (called by the harbour visuals)
function tradeLiveBuy(){ if(!homeBuilt('warehouse'))return 0; const st=player.home.stock||{}; const mk=homeTradeMarkup();
  const ids=Object.keys(st).filter(k=>st[k]>0); if(!ids.length)return 0; const id=pick(ids);
  const n=Math.min(st[id],1+Math.floor(RNG()*3)); const price=Math.round(GOODS[id].base*mk);
  st[id]-=n; if(st[id]<=0)delete st[id]; const gain=n*price; player.money+=gain;
  if(Sound.coin)Sound.coin(); toast(`A trader bought ${n}× ${GOODS[id].name} · ${ic('coin',12)} ${coinStr(gain)}`,ic('boat')); return gain; }

// --- transactions ---
function sellFish(id){ let got=0,cnt=0; player.hold=player.hold.filter(it=>{ if(it.id===id){got+=fishSellPrice(townPort,it);cnt++;return false;} return true; });
  if(cnt){ player.money+=got; player.earned+=got; if(typeof questEvent==='function') questEvent('sell',{coin:got}); if(Sound.coin)Sound.coin(); toast(`Sold ${cnt}× ${FISH[id].name} · ${ic('coin',13)} ${coinStr(got)}`,ic('coin')); } renderTown(); saveGame(); checkRegionGoal(); }
function sellAllFish(){ let got=0; const cnt=player.hold.length; for(const it of player.hold) got+=fishSellPrice(townPort,it); player.hold=[];
  if(cnt){ player.money+=got; player.earned+=got; if(typeof questEvent==='function') questEvent('sell',{coin:got}); if(Sound.coin)Sound.coin(); toast(`Sold your catch (${cnt}) · ${ic('coin',13)} ${coinStr(got)}`,ic('coin')); } renderTown(); saveGame(); checkRegionGoal(); }
function sellAllButBest(){ // keep the single largest specimen of each species as a trophy
  const best={}; for(const it of player.hold){ if(!best[it.id]||it.len>best[it.id].len) best[it.id]=it; }
  const keep=new Set(Object.values(best)); let got=0,cnt=0; const next=[];
  for(const it of player.hold){ if(keep.has(it)) next.push(it); else { got+=fishSellPrice(townPort,it); cnt++; } }
  player.hold=next;
  if(cnt){ player.money+=got; player.earned+=got; if(typeof questEvent==='function') questEvent('sell',{coin:got}); if(Sound.coin)Sound.coin(); toast(`Sold ${cnt} · kept your biggest of each · ${ic('coin',13)} ${coinStr(got)}`,ic('coin')); }
  else toast('Only trophies in the hold',ic('basket')); renderTown(); saveGame(); checkRegionGoal(); }
function buyFuel(n){ const room=player.fuelMax-player.fuel; const buy=Math.min(n,Math.ceil(room)); if(buy<=0){toast('Tanks are full',ic('fuel'));return;} const cost=Math.max(1,Math.round(buy*3*repPriceMul()));
  if(player.money<cost){toast('Not enough coin',ic('coin'));return;} player.money-=cost; player.fuel=Math.min(player.fuelMax,player.fuel+buy); if(Sound.coin)Sound.coin(); renderTown(); saveGame(); }
function fillFuel(){ buyFuel(Math.ceil(player.fuelMax-player.fuel)); }
function buyBait(n){ const cost=Math.max(1,Math.round(n*5*repPriceMul())); if(player.money<cost){toast('Not enough coin',ic('coin'));return;} player.money-=cost; player.bait+=n; if(Sound.coin)Sound.coin(); renderTown(); saveGame(); }
function repairHull(){ const need=Math.ceil(player.hullMax-player.hull); if(need<=0){toast('Hull is sound',ic('wrench'));return;} const pp=4*repPriceMul(); const afford=Math.min(need,Math.floor(player.money/pp));
  if(afford<=0){toast('Not enough coin',ic('coin'));return;} player.money-=Math.round(afford*pp); player.hull=Math.min(player.hullMax,player.hull+afford); if(Sound.coin)Sound.coin(); renderTown(); saveGame(); }
function buyGoods(g){ const price=goodsPrice(townPort,g); if(cargoCount()>=cargoMax()){toast('Cargo hold is full',ic('crate'));return;} if(player.money<price){toast('Not enough coin',ic('coin'));return;}
  player.money-=price; player.cargo[g]=(player.cargo[g]||0)+1; if(Sound.coin)Sound.coin(); renderTown(); saveGame(); }
function sellGoods(g){ if(!player.cargo[g])return; const price=goodsPrice(townPort,g); player.money+=price; player.earned+=price; player.cargo[g]--; if(player.cargo[g]<=0) delete player.cargo[g]; if(Sound.coin)Sound.coin(); renderTown(); saveGame(); }
function buyUpgrade(cat){ const cur=player.upg[cat], nxt=UPGRADES[cat].levels[cur+1]; if(!nxt){toast('Fully upgraded',ic('gear'));return;} const cost=Math.round(nxt.cost*repPriceMul()); if(player.money<cost){toast('Not enough coin',ic('coin'));return;}
  player.money-=cost; player.upg[cat]++; applyUpgrades(); if(Sound.chime)Sound.chime(); toast(`Installed ${nxt.label}`,ic(UPGRADES[cat].icon)); renderTown(); saveGame(); }

function showEvent(title,icon,body,buttons){
  const L=document.getElementById('layer-event');
  const btns=(buttons||[{label:'Continue',cls:'gold',act:()=>Game.set('sail')}]).map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.label}</button>`).join(' ');
  L.innerHTML=`<div class="panel" style="max-width:560px;text-align:center">

  const arr=buttons||[{label:'Continue',cls:'gold',act:()=>Game.set('sail')}];

function checkRegionGoal(){
  const R=regionData(); if(player.regionDone[world.region]) return;
  if(player.earned>=R.goal.earn && player.caughtLegendary[world.region]){
    player.regionDone[world.region]=true; saveGame();
    const nextI=world.region+1, hasNext=nextI<REGIONS.length;
    showEvent(`${R.name} — Mastered!`,ic('trophy',64),
      `You've earned your keep and bested the ${FISH[R.legendary].name}. ${hasNext?`Word spreads of richer waters to the south. <b>${REGIONS[nextI].name}</b> awaits.`:'You are a legend of every coast. The horizon is yours.'}`,
      hasNext?[{label:`Sail to ${REGIONS[nextI].name} ${ic('arrowr',15)}`,cls:'gold',act:()=>{ player.earned=0; enterRegion(nextI); Game.set('sail'); saveGame(); }},
               {label:'Stay a while',cls:'ghost',act:()=>Game.set('sail')}]
             :[{label:`${ic('trophy',15)} Roll the credits`,cls:'gold',act:()=>rollCredits()},{label:'Sail on',cls:'ghost',act:()=>Game.set('sail')}]);
  }
}
function onSink(){
  player.hull=Math.max(6,player.hullMax*0.15); player.speed=0;
  const lost=Math.round(player.money*0.12); player.money=Math.max(0,player.money-lost);
  const lostFish=player.hold.length; player.hold=[];
  const p=nearestPort(); player.pos[0]=p.x; view.flash=0.8; view.flashCol='#ffffff'; view.shake=1.0;
  showEvent('Rescued at Sea',ic('buoy',60),`A squall nearly claimed you. The coast guard towed you to <b>${p.name}</b>. You lost your catch${lostFish?` (${lostFish} fish)`:''} and ${ic('coin',14)} ${lost} in the ordeal.`,
    [{label:'Count my blessings',cls:'gold',act:()=>Game.set('sail')}]);
}

function coastChartSVG(){
  const R=regionData(), len=R.length; const W=780, H=150, padL=24, padR=24, mw=W-padL-padR;
  const X=x=>padL+clamp(x/len,0,1)*mw;
  const hills=hex2rgb(R.hills[1]), water=hex2rgb(R.water.top), sand=[214,198,160];
  let g=`<rect x=0 y=0 width=${W} height=${H} rx=10 fill="rgb(${water[0]},${water[1]},${water[2]})"/>`;
  // coastline ribbon (land across the top)
  let path=`M0 0 L${W} 0 L${W} 52`; for(let i=8;i>=0;i--){ const px=padL+mw*(i/8); path+=` L${px} ${44+Math.sin(i*1.7)*7}`; } path+=` L0 52 Z`;
  g+=`<path d="${path}" fill="rgb(${hills[0]},${hills[1]},${hills[2]})"/>`;
  g+=`<path d="M0 54 L${W} 54" stroke="rgb(${sand[0]},${sand[1]},${sand[2]})" stroke-width=6 opacity=.8/>`;
  // end headlands
  g+=`<path d="M0 8 l18 0 l-6 46 l-12 0 z" fill="rgb(${hills[2]},${hills[1]},${hills[0]})" opacity=.85/><path d="M${W} 8 l-18 0 l6 46 l12 0 z" fill="rgb(${hills[2]},${hills[1]},${hills[0]})" opacity=.85/>`;
  // shoals (if any this region)
  if(typeof COAST!=='undefined'&&COAST.shoals) for(const s of COAST.shoals){ const sx=X(s.x); g+=`<path d="M${sx-8} 66 q8 -6 16 0 q-8 5 -16 0" fill="none" stroke="#e7d6b4" stroke-width=1.6 opacity=.7/><path d="M${sx-5} 72 q5 -4 10 0" fill="none" stroke="#e7d6b4" stroke-width=1.4 opacity=.5/>`; }
  // ports
  for(const p of R.ports){ const seen=p.kind==='home'||(player.seenPorts&&player.seenPorts[p.name]); const px=X(p.x);
    g+=`<line x1=${px} y1=54 x2=${px} y2=70 stroke="${seen?'#e6c07a':'#5c6a70'}" stroke-width=1.5/>`;
    g+=`<circle cx=${px} cy=52 r=${p.kind==='home'?6:4.5} fill="${seen?(p.kind==='home'?'#f0c877':'#d8ccaa'):'#48565c'}" stroke="#2a3238" stroke-width=1/>`;
    if(seen){ g+=`<text x=${px} y=${p.kind==='home'?30:40} text-anchor="middle" font-size=10 fill="#f4ead4" font-family="ui-sans-serif">${p.name}</text>`; }
    else g+=`<text x=${px} y=40 text-anchor="middle" font-size=9 fill="#8a949a" font-family="ui-sans-serif">?</text>`; }
  // your boat
  const bx=X(player.pos[0]);
  g+=`<g transform="translate(${bx},94)"><path d="M-8 0 q8 7 16 0 l-3 6 q-5 3 -10 0 z" fill="#b0563e"/><rect x=-1 y=-9 width=2 height=9 fill="#8a6a3a"/><path d="M1 -8 q6 3 7 8 h-7 z" fill="#f0ead6"/></g>`;
  g+=`<text x=${bx} y=118 text-anchor="middle" font-size=9 fill="#ffd98a" font-family="ui-sans-serif">You</text>`;
  // scale + goal
  g+=`<text x=${padL} y=${H-6} font-size=9 fill="#9fb3bb" font-family="ui-sans-serif">◀ ${R.name.replace(/^The /,'')} ▶</text>`;
  g+=`<text x=${W-padR} y=${H-6} text-anchor="end" font-size=9 fill="#9fb3bb" font-family="ui-sans-serif">${ic(seasonNow().icon,10)?'':''}${seasonNow().name} · ${tideName()} tide</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;border-radius:10px" xmlns="http://www.w3.org/2000/svg">${g.replace(/\s*\/>/g,' />')}</svg>`;
}
function openMap(){
  const L=document.getElementById('layer-map'); const R=regionData();
  let regs=REGIONS.map((rg,i)=>{ const done=player.regionDone[i]; const locked=i>0&&!player.regionDone[i-1];
    const cur=i===world.region;
    return `<div class="shop-item" style="padding:8px 10px;${cur?'outline:2px solid var(--gold)':''};${locked?'opacity:.5':''}"><div class="ic">${ic(RICON[rg.id],24)}</div><div class="meta"><h4 style="font-size:14px">${rg.sub||('Ch '+(i+1))} · ${rg.name} ${done?ic('check',14):locked?ic('lock',13):cur?'<span class="tag" style="background:rgba(200,150,70,.2)">here</span>':''}</h4>
      <p class="muted" style="font-size:11.5px">Goal: ${coinStr(rg.goal.earn)} &amp; the ${FISH[rg.legendary].name.replace(/^The /,"")}${done?' — mastered':''}.</p></div></div>`; }).join('');
  L.innerHTML=`<div class="scrim"></div><div class="panel" style="max-width:820px;position:relative">
    <div class="kicker">Ship's Chart</div><h1 style="margin:.1em 0">${ic('map',28)} The Four Coasts</h1>

  L.querySelector('#m-ok').onclick=()=>Game.set(Game.prev==='pause'?'pause':'sail');
  Game.set('map');
}

function setLetterbox(on){ const t=document.getElementById('lbtop'),b=document.getElementById('lbbot'); if(t)t.style.height=on?'8vh':'0'; if(b)b.style.height=on?'8vh':'0'; }
function setupFlyCam(){ const px=regionData().ports[0].x; Cine.keys=[
  {pos:[px-64,2.2,72],tgt:[px+6,3,-28]},{pos:[px-18,5,42],tgt:[px+30,2.6,-30]},
  {pos:[px+34,8.5,24],tgt:[px+62,2,-50]},{pos:[px+88,14,46],tgt:[px+48,3.5,-62]}]; }
function applyFlyCam(p){ const k=Cine.keys; if(!k)return; const n=k.length-1; const f=clamp(p,0,1)*n; let i=clamp(Math.floor(f),0,n-1); const t=smoother(f-i);
  cam.pos=vLerp(k[i].pos,k[i+1].pos,t); cam.target=vLerp(k[i].tgt,k[i+1].tgt,t); }
function startIntro(){
  injectCineCSS();
  world.time=0.73; world.timeScale=0; setWeather('clear'); world.wBlend=1; updateWeather(0.001);
  const px=regionData().ports[0].x; player.pos=[px+70,0,0]; player.facing=-1; player.yaw=PI; player.speed=0;
  setupFlyCam(); applyFlyCam(0);
  Cine.phase='studio'; Cine.t=0;
  const c=ensureCineDom(); c.innerHTML=studioHTML()+letterboxHTML()+titleCardHTML();
  Game.set('cine');
  requestAnimationFrame(()=>{ const st=document.getElementById('studio'); if(st) st.style.opacity='1'; });
}
function updateCine(dt){
  Cine.t+=dt;
  if(Cine.phase==='studio'){
    applyFlyCam(0);
    const st=document.getElementById('studio');
    if(Cine.t>3.8 && st) st.style.opacity='0';
    if(Cine.t>=4.9){ Cine.phase='fly'; Cine.t=0; if(st) st.style.display='none'; setLetterbox(true); }
  } else if(Cine.phase==='fly'){
    const dur=10.5, p=clamp(Cine.t/dur,0,1); applyFlyCam(ease.inOut(p));
    const tc=document.getElementById('cinetitle'); if(tc) tc.style.opacity= p>0.5? clamp((p-0.5)/0.3,0,1).toString():'0';
    if(Cine.t>=dur) endIntro();
  }
}
function endIntro(){ Cine.phase='idle'; const c=document.getElementById('cine'); if(c) c.innerHTML=''; openTitle(); }
function skipIntro(){ Cine.phase='idle'; const c=document.getElementById('cine'); if(c) c.innerHTML=''; openTitle(); }
