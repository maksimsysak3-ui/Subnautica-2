<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SALT &amp; TIDE — A Coastal Life</title>
<style>
  /* ============================================================
     SALT & TIDE  —  a hand-built, self-contained watercolor game
     Everything (art, sound, world) is generated in code.
     ============================================================ */
  :root{
    --ink:#26333b;
    --ink-soft:#4a5b64;
    --parch:#f3e7cf;
    --parch-2:#e8d7b6;
    --parch-line:#c9b48a;
    --gold:#c58a3c;
    --gold-deep:#9c6420;
    --sea:#2f6f86;
    --panel-shadow:0 18px 50px rgba(20,30,38,.45);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:#0c1418;color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#0c1418;}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto;}

  /* ---- Loading veil ---- */
  #boot{
    position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 120% at 50% 30%,#14323f,#08151c 70%);
    color:#e9dcc0;font-family:var(--serif);transition:opacity .8s ease;
  }
  #boot .mark{font-size:clamp(34px,7vw,68px);letter-spacing:.14em;font-weight:600;
    text-shadow:0 4px 24px rgba(0,0,0,.5);}
  #boot .sub{font-family:var(--sans);letter-spacing:.35em;text-transform:uppercase;
    font-size:11px;color:#9fb7bd;opacity:.85;}
  #boot .bar{width:min(320px,60vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;}
  #boot .bar > i{display:block;height:100%;width:0%;border-radius:4px;
    background:linear-gradient(90deg,#7fd7c4,#e8c987);transition:width .25s ease;}
  #boot.hidden{opacity:0;pointer-events:none;}

  /* ---- Generic overlay layer for menus/UI (HTML for crisp text) ---- */
  .layer{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;}
  .layer.show{display:flex;}
  .layer.fade{animation:fadein .45s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---- Parchment panel styling ---- */
  .panel{
    position:relative;background:
      linear-gradient(180deg,rgba(255,251,240,.96),rgba(238,222,190,.96));
    color:var(--ink);border-radius:16px;
    box-shadow:var(--panel-shadow), inset 0 0 0 1px rgba(120,90,50,.25),
      inset 0 2px 0 rgba(255,255,255,.6);
    padding:26px 30px;max-width:min(940px,94vw);max-height:92vh;overflow:auto;
    border:1px solid rgba(120,90,50,.3);
  }
  .panel:before{ /* subtle deckle edge */
    content:"";position:absolute;inset:6px;border-radius:12px;pointer-events:none;
    box-shadow:inset 0 0 0 1.5px rgba(140,105,60,.28);
    -webkit-mask:linear-gradient(#000,#000);
  }
  h1,h2,h3{font-family:var(--serif);margin:0 0 .4em;font-weight:600;color:#2a3942;}
  .kicker{font-family:var(--sans);letter-spacing:.32em;text-transform:uppercase;
    font-size:11px;color:var(--gold-deep);font-weight:700;}

  /* ---- Buttons ---- */
  .btn{
    font-family:var(--serif);font-size:17px;cursor:pointer;border:none;
    padding:12px 22px;border-radius:11px;color:#fff8ea;
    background:linear-gradient(180deg,#3f7d76,#2d5f61);
    box-shadow:0 6px 0 #1f4547, 0 12px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25);
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    letter-spacing:.02em;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f4547,0 6px 14px rgba(0,0,0,.28);}
  .btn.gold{background:linear-gradient(180deg,#d79a44,#b1701f);box-shadow:0 6px 0 #7f4d13,0 12px 22px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.3);}
  .btn.gold:active{box-shadow:0 2px 0 #7f4d13,0 6px 14px rgba(0,0,0,.28);}
  .btn.ghost{background:linear-gradient(180deg,#efe2c4,#e0cda4);color:#5a4426;box-shadow:0 5px 0 #b79c6f,0 10px 18px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.5);}
  .btn.ghost:active{box-shadow:0 2px 0 #b79c6f;}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);}
  .btn.small{font-size:14px;padding:8px 14px;border-radius:9px;box-shadow:0 4px 0 #1f4547,0 8px 14px rgba(0,0,0,.25);}
  .btn.small:active{box-shadow:0 1px 0 #1f4547;}

  /* ---- HUD ---- */
  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;font-family:var(--sans);}
  #hud .pill{
    position:absolute;pointer-events:auto;background:rgba(20,34,42,.42);
    color:#f2ead6;border-radius:12px;padding:8px 12px;backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.12);
    box-shadow:0 8px 22px rgba(0,0,0,.28);font-size:13px;line-height:1.15;
  }
  .hud-tl{left:14px;top:14px;display:flex;gap:10px;align-items:center;}
  .hud-tr{right:14px;top:14px;text-align:right;}
  .hud-bl{left:14px;bottom:14px;}
  .hud-hint{left:50%;bottom:18px;transform:translateX(-50%);text-align:center;
    background:rgba(20,34,42,.5);font-size:13px;letter-spacing:.02em;}
  .gauge{width:120px;height:9px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:3px;}
  .gauge > i{display:block;height:100%;border-radius:6px;transition:width .25s ease;}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:120px;}
  .stat b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#bcd0d4;font-weight:700;}
  .coin{color:#ffd98a;font-weight:700;}

  /* ---- Market / shop tables ---- */
  table.ledger{width:100%;border-collapse:collapse;font-size:14px;}
  table.ledger th,table.ledger td{padding:7px 10px;text-align:left;}
  table.ledger th{font-family:var(--sans);text-transform:uppercase;letter-spacing:.1em;font-size:11px;color:var(--gold-deep);border-bottom:2px solid rgba(140,100,55,.3);}
  table.ledger tr+tr td{border-top:1px solid rgba(140,100,55,.18);}
  table.ledger td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:rgba(150,110,60,.16);color:#7a5a2c;margin-left:6px;}
  .tag.leg{background:linear-gradient(90deg,#f4d27a,#e0a63c);color:#5c3d0c;font-weight:700;}

  .tabs{display:flex;gap:8px;margin:6px 0 16px;flex-wrap:wrap;}
  .tab{font-family:var(--serif);cursor:pointer;padding:8px 16px;border-radius:10px 10px 0 0;
    background:rgba(150,110,60,.14);color:#6b5230;border:1px solid transparent;}
  .tab.active{background:rgba(255,251,240,.9);color:#2a3942;border-color:rgba(140,100,55,.3);border-bottom-color:transparent;box-shadow:0 -3px 10px rgba(0,0,0,.06);}

  .grid{display:grid;gap:12px;}
  .shop-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;
    background:rgba(255,255,255,.4);border:1px solid rgba(140,100,55,.2);}
  .shop-item .ic{width:44px;height:44px;border-radius:10px;flex:0 0 auto;
    background:radial-gradient(circle at 35% 30%,#fff,#e6d3ab);display:grid;place-items:center;font-size:22px;
    box-shadow:inset 0 0 0 1px rgba(120,90,50,.25);}
  .shop-item .meta{flex:1 1 auto;min-width:0;}
  .shop-item .meta h4{margin:0;font-family:var(--serif);font-size:16px;}
  .shop-item .meta p{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft);}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .spacer{flex:1 1 auto;}
  .muted{color:var(--ink-soft);}
  .center{text-align:center;}
  .toast-wrap{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
  .toast{background:rgba(24,38,46,.82);color:#f4ead4;padding:9px 16px;border-radius:22px;font-size:13.5px;
    box-shadow:0 10px 26px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);animation:toastin .3s ease both;}
  @keyframes toastin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .icon-btn{pointer-events:auto;cursor:pointer;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:rgba(20,34,42,.42);color:#f2ead6;border:1px solid rgba(255,255,255,.12);font-size:17px;backdrop-filter:blur(7px);}
  .key{display:inline-block;min-width:20px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.25);font-family:var(--sans);font-size:12px;font-weight:700;text-align:center;margin:0 1px;}
  .scrim{position:absolute;inset:0;background:rgba(8,16,20,.55);backdrop-filter:blur(3px);}
  .noscroll{overflow:hidden;}
  a.link{color:var(--gold-deep);cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- HUD (populated by JS) -->
  <div id="hud"></div>
  <div class="toast-wrap" id="toasts"></div>

  <!-- Menu / UI layers (populated by JS) -->
  <div class="layer" id="layer-title"></div>
  <div class="layer" id="layer-map"></div>
  <div class="layer" id="layer-town"></div>
  <div class="layer" id="layer-pause"></div>
  <div class="layer" id="layer-help"></div>
  <div class="layer" id="layer-event"></div>

  <!-- Boot veil -->
  <div id="boot">
    <div class="mark">SALT &amp; TIDE</div>
    <div class="sub">a coastal life</div>
    <div class="bar"><i id="bootbar"></i></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   SALT & TIDE
   A single-file, dependency-free, hand-built coastal fishing/trading game.
   All visuals are drawn with Canvas 2D in a watercolor style; all audio is
   synthesized with the Web Audio API; the world, weather and economy are
   simulated in code. Nothing is loaded from the network.

   Sections:
     1. Math / RNG / noise utilities
     2. Color + watercolor painting helpers
     3. World data: regions, fish rosters, upgrades, goods
     (further sections appended below)
   ========================================================================== */

/* ======================= 1. MATH / RNG / NOISE ============================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const inv   = (a,b,v)=> (v-a)/(b-a);
const map   = (v,a,b,c,d)=> c+(d-c)*((v-a)/(b-a));
const smooth= t=> t*t*(3-2*t);
const smoother=t=> t*t*t*(t*(t*6-15)+10);
const ease  = { inOut:t=> t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
                out:t=>1-Math.pow(1-t,3), in:t=>t*t*t,
                outBack:t=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2);} };
const rad   = d=> d*Math.PI/180;
const dist2 = (x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return dx*dx+dy*dy;};
const wrap  = (v,m)=> ((v%m)+m)%m;
const sign  = Math.sign;
const round = Math.round;

// Deterministic seedable PRNG (mulberry32)
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = mulberry32(0x5eed);
const rnd  = ()=> RNG();
const rrange=(a,b)=> a + (b-a)*RNG();
const rint = (a,b)=> Math.floor(a + (b-a+1)*RNG());
const pick = arr=> arr[Math.floor(RNG()*arr.length)];
const chance=p=> RNG()<p;

// 1D value noise with smooth interpolation (for waves, terrain silhouettes)
function makeNoise1D(seed){
  const r = mulberry32(seed);
  const N = 512, g = new Float32Array(N);
  for(let i=0;i<N;i++) g[i] = r()*2-1;
  return function(x){
    const xi = Math.floor(x), f = x-xi;
    const a = g[wrap(xi,N)], b = g[wrap(xi+1,N)];
    const u = smoother(f);
    return lerp(a,b,u);
  };
}
// fractal brownian motion over a 1D noise
function fbm1(noise,x,oct=4,lac=2,gain=.5){
  let amp=1,freq=1,sum=0,norm=0;
  for(let i=0;i<oct;i++){ sum+=amp*noise(x*freq); norm+=amp; amp*=gain; freq*=lac; }
  return sum/norm;
}
// 2D hash value noise (for water shimmer / paper grain)
function hash2(x,y){
  let h = Math.sin(x*127.1 + y*311.7) * 43758.5453;
  return h - Math.floor(h);
}

/* ======================= 2. COLOR + WATERCOLOR ============================ */
// Parse "#rrggbb" -> [r,g,b]
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length===3) h = h.split('').map(c=>c+c).join('');
  const n = parseInt(h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function rgb2css(c,a){ return a==null? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }
function mix(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }
function mixHex(h1,h2,t){ return rgb2css(mix(hex2rgb(h1),hex2rgb(h2),t)); }
function shade(c,amt){ // amt<0 darken, >0 lighten toward white/black
  if(amt>=0) return mix(c,[255,255,255],amt);
  return mix(c,[8,14,20],-amt);
}
function withA(cssOrArr,a){
  if(Array.isArray(cssOrArr)) return rgb2css(cssOrArr,a);
  const c=hex2rgb(cssOrArr); return rgb2css(c,a);
}
// HSL helper for procedural palettes
function hsl(h,s,l,a){ return `hsla(${h},${s}%,${l}%,${a==null?1:a})`; }

/* ======================= 3. WORLD DATA =================================== */
/* Fish value scales roughly with size; "hits" = lure contacts needed to land.
   depth = fraction of the water column [0..1] the fish prefers (0 = surface).
   weight = spawn weighting (rarity). */

const FISH = {
  // --- Northern Reach ---
  herring:   {name:'Herring',       col:'#9fb7c4', acc:'#e8f0f4', len:[18,28], depth:[.08,.35], hits:1, base:14,  weight:34, spd:1.35, schooling:true,  region:'north'},
  mackerel:  {name:'Mackerel',      col:'#4c8f8a', acc:'#173b3a', len:[24,36], depth:[.12,.45], hits:1, base:22,  weight:28, spd:1.5,  schooling:true,  region:'north'},
  cod:       {name:'Atlantic Cod',  col:'#8a8a6a', acc:'#4b4a30', len:[40,70], depth:[.35,.72], hits:2, base:48,  weight:22, spd:.85, region:'north'},
  pollock:   {name:'Pollock',       col:'#6f7d78', acc:'#2f3a36', len:[34,58], depth:[.3,.62], hits:1, base:30,  weight:20, spd:1.0, region:'north'},
  salmon:    {name:'King Salmon',   col:'#c9736a', acc:'#7d332e', len:[46,78], depth:[.2,.5], hits:2, base:70,  weight:13, spd:1.7, region:'north'},
  halibut:   {name:'Halibut',       col:'#5b5a4c', acc:'#2b2a20', len:[60,110],depth:[.62,.95], hits:3, base:120, weight:9,  spd:.6, region:'north'},
  lobster:   {name:'Lobster',       col:'#b1503a', acc:'#5f2216', len:[26,44], depth:[.8,.98], hits:2, base:95,  weight:8,  spd:.5, crawler:true, region:'north'},
  kingcrab:  {name:'King Crab',     col:'#c0603f', acc:'#5a2413', len:[34,56], depth:[.82,.99], hits:3, base:160, weight:5,  spd:.45, crawler:true, region:'north'},
  oldbarnacle:{name:'Old Barnacle', col:'#3f5850', acc:'#dfe8d6', len:[150,150],depth:[.7,.95], hits:8, base:1400,weight:0, spd:.7, legendary:true, region:'north',
               lore:'A halibut the size of a door. Fishermen leave a lantern burning for the ones it took.'},

  // --- Tropical Keys ---
  sardine:   {name:'Sardine',       col:'#a9c0cf', acc:'#eef6fb', len:[14,22], depth:[.05,.3], hits:1, base:12, weight:32, spd:1.5, schooling:true, region:'trop'},
  snapper:   {name:'Red Snapper',   col:'#d15a4e', acc:'#7a2a22', len:[30,52], depth:[.3,.6], hits:2, base:60, weight:24, spd:1.0, region:'trop'},
  parrot:    {name:'Parrotfish',    col:'#39a58c', acc:'#f2c14e', len:[28,46], depth:[.18,.4], hits:1, base:40, weight:22, spd:1.1, region:'trop'},
  grouper:   {name:'Grouper',       col:'#7c6a4b', acc:'#3a3020', len:[55,95], depth:[.5,.85], hits:3, base:130,weight:12, spd:.7, region:'trop'},
  mahi:      {name:'Mahi-Mahi',     col:'#3fb2c9', acc:'#f4d03f', len:[50,86], depth:[.12,.42], hits:2, base:110,weight:14, spd:2.0, region:'trop'},
  tuna:      {name:'Yellowfin Tuna',col:'#3a6b8c', acc:'#f2c744', len:[70,120],depth:[.25,.6], hits:4, base:260,weight:8,  spd:2.3, region:'trop'},
  marlin:    {name:'Blue Marlin',   col:'#2f5f9e', acc:'#bcd8f0', len:[130,180],depth:[.2,.55], hits:6, base:520,weight:3, spd:2.6, region:'trop'},
  reefking:  {name:'The Reef King',  col:'#b5892f', acc:'#3a2c10', len:[160,160],depth:[.45,.8],hits:9, base:1900,weight:0, spd:1.4, legendary:true, region:'trop',
               lore:'An ancient goliath grouper wearing a crown of coral. The whole reef answers to it.'},

  // --- Mediterranean ---
  anchovy:   {name:'Anchovy',       col:'#b9c6cc', acc:'#eef4f6', len:[10,16], depth:[.05,.28], hits:1, base:11, weight:30, spd:1.5, schooling:true, region:'med'},
  seabream:  {name:'Sea Bream',     col:'#c9c3a8', acc:'#6a6448', len:[26,42], depth:[.22,.5], hits:1, base:38, weight:26, spd:1.1, region:'med'},
  seabass:   {name:'Sea Bass',      col:'#8f9aa0', acc:'#3a4247', len:[34,60], depth:[.3,.62], hits:2, base:72, weight:20, spd:1.15, region:'med'},
  octopus:   {name:'Octopus',       col:'#9c5a6a', acc:'#43222a', len:[30,56], depth:[.7,.96], hits:2, base:90, weight:14, spd:.6, crawler:true, region:'med'},
  dorade:    {name:'Gilt Dorade',   col:'#c9a94e', acc:'#6a5220', len:[30,50], depth:[.25,.5], hits:2, base:88, weight:12, spd:1.2, region:'med'},
  swordfish: {name:'Swordfish',     col:'#4a5b66', acc:'#cdd6da', len:[120,175],depth:[.2,.55], hits:5, base:340,weight:6, spd:2.4, region:'med'},
  bluefin:   {name:'Bluefin Tuna',  col:'#2c526e', acc:'#e0b23a', len:[110,165],depth:[.3,.65], hits:5, base:400,weight:5, spd:2.3, region:'med'},
  leviathan: {name:'The Old Emperor',col:'#586b74', acc:'#e6d59a', len:[190,190],depth:[.3,.7],hits:10,base:2600,weight:0, spd:1.8, legendary:true, region:'med',
               lore:'A bluefin that has outlived three lighthouses. Sailors say it remembers every hook.'},
};

// Region definitions: palette, weather tendencies, ports, goal, fish set.
const REGIONS = [
  {
    id:'north', name:'The Northern Reach', order:0, icon:'❄️',
    blurb:'Cold, moody waters under evergreen headlands. Fog rolls thick and the sea keeps secrets.',
    length: 5200,                          // world length in metres (x)
    sky:{ dawn:'#caa9a0', day:'#a9c6d4', dusk:'#d79b74', night:'#0e2130' },
    sun:'#ffe9c2', water:{ top:'#3f7285', mid:'#245264', deep:'#0c2531' },
    hills:['#26414a','#33525a','#48707a'], // far->near silhouettes
    foam:'#dfeef2',
    weather:{ clear:.22, cloud:.28, fog:.2, rain:.16, snow:.09, storm:.05 },
    fish:['herring','mackerel','cod','pollock','salmon','halibut','lobster','kingcrab','oldbarnacle'],
    legendary:'oldbarnacle',
    goal:{ earn:2400, note:'Earn 2,400 coin and land Old Barnacle to master the Reach.' },
    ports:[
      {name:'Gull Harbor',   x:420,  kind:'home',  spec:['cod','herring'],    icon:'⚓'},
      {name:'Fable Cove',    x:2100, kind:'trade', spec:['salmon','mackerel'],icon:'🏘️'},
      {name:'Cape Iron',     x:3700, kind:'trade', spec:['halibut','lobster'],icon:'🗼'},
      {name:'Stormwatch',    x:4950, kind:'trade', spec:['kingcrab'],         icon:'🌊'},
    ],

function handleHotkeys(k, e){
  if(Game.screen==='sail'){

// Camera update
function updateView(dt){
  view.camX = lerp(view.camX, view.targetCamX, 1-Math.pow(0.0008,dt));
  view.waterY = lerp(view.waterY, view.targetWaterY, 1-Math.pow(0.0006,dt));
  view.pxPerDepth = (H - view.waterY) / SEA_DEPTH;
  if(view.shake>0){
    view.shake = Math.max(0, view.shake - dt*1.6);
    const s = view.shake*view.shake*10;
    view.shakeX = (rnd()*2-1)*s; view.shakeY=(rnd()*2-1)*s;
  } else { view.shakeX=view.shakeY=0; }
  if(view.flash>0) view.flash = Math.max(0, view.flash - dt*2.2);
}
function addShake(a){ view.shake = Math.min(1.4, view.shake + a); }
function addFlash(a,col){ view.flash=Math.min(1,a); if(col) view.flashCol=col; }

const DAY_LENGTH = 210;   // real seconds for a full in-game day
const WEATHER_TYPES = ['clear','cloud','fog','rain','snow','storm'];

const world = {
  region: 0,
  time: 0.30,             // 0..1 (0 = midnight, .25 dawn, .5 noon, .75 dusk)
  day: 1,
  timeScale: 1,
  // weather crossfade
  weather:'clear', weatherPrev:'clear', wBlend:1, wTimer:26,
  // resolved atmospheric factors (0..1)
  fog:0, rainI:0, snowI:0, cloudCover:.3, storm:0, overcast:0,
  // wind
  windDir:1, windTarget:1, windStr:.4, windTargetStr:.4, gust:0,
  // sea state (roughness 0..1) driven by wind+storm
  seaState:.3,
  noiseW: makeNoise1D(9911),
  noiseSea: makeNoise1D(4242),
  noiseCloud: makeNoise1D(7777),
  lightning:0, lightningTimer:5,
};

function regionData(){ return REGIONS[world.region]; }

function rollWeather(){
  const w = regionData().weather;
  let total=0; for(const k in w) total+=w[k];
  let r = rnd()*total, chosen='clear';
  for(const k in w){ r-=w[k]; if(r<=0){ chosen=k; break; } }
  return chosen;
}
function setWeather(next){
  world.weatherPrev = world.weather;
  world.weather = next;
  world.wBlend = 0;
  world.wTimer = rrange(24, 52);   // seconds until next change
}
// target atmospheric values for a weather type
const WX = {
  clear:{fog:0,   rain:0,  snow:0,  cloud:.15, storm:0,  wind:.35, sea:.22},
  cloud:{fog:.05, rain:0,  snow:0,  cloud:.62, storm:0,  wind:.45, sea:.34},
  fog:  {fog:.82, rain:0,  snow:0,  cloud:.5,  storm:0,  wind:.22, sea:.2},
  rain: {fog:.2,  rain:.7, snow:0,  cloud:.85, storm:.15,wind:.6,  sea:.55},
  snow: {fog:.3,  rain:0,  snow:.75,cloud:.8,  storm:.05,wind:.4,  sea:.4},
  storm:{fog:.12, rain:1,  snow:0,  cloud:1,   storm:1,  wind:1,   sea:1},
};

function updateWeather(dt){
  world.wTimer -= dt;
  if(world.wTimer<=0 && world.wBlend>=1){
    setWeather(rollWeather());
  }
  world.wBlend = Math.min(1, world.wBlend + dt/6);   // 6s crossfade
  const a = WX[world.weatherPrev], b = WX[world.weather], t=smooth(world.wBlend);
  world.fog        = lerp(a.fog,b.fog,t);
  world.rainI      = lerp(a.rain,b.rain,t);
  world.snowI      = lerp(a.snow,b.snow,t);
  world.cloudCover = lerp(a.cloud,b.cloud,t);
  world.storm      = lerp(a.storm,b.storm,t);
  world.windTargetStr = lerp(a.wind,b.wind,t);
  const targetSea  = lerp(a.sea,b.sea,t);
  world.seaState   = lerp(world.seaState, targetSea, 1-Math.pow(0.2,dt));
  world.overcast   = clamp(world.cloudCover*0.8 + world.storm*0.5, 0, 1);

  // wind drift
  world.windStr = lerp(world.windStr, world.windTargetStr, 1-Math.pow(0.1,dt));
  const wob = world.noiseW(Game.t*0.05);
  world.gust = 0.5 + 0.5*Math.sin(Game.t*0.7 + wob*4);
  // occasionally flip wind direction on calm
  if(chance(dt*0.02) && world.windStr<.5) world.windTarget = -world.windTarget;
  world.windDir = lerp(world.windDir, world.windTarget, 1-Math.pow(0.3,dt));

  // lightning during storms
  if(world.storm>0.5){
    world.lightningTimer -= dt;
    if(world.lightningTimer<=0){
      world.lightning = 1;
      world.lightningTimer = rrange(3.5, 9)/Math.max(.5,world.storm);
      addFlash(0.5,'#dfeaff');
      Sound.thunder(rrange(.4,1.1));
    }
  }
  world.lightning = Math.max(0, world.lightning - dt*3.5);
}

function advanceTime(dt){
  world.time += dt/DAY_LENGTH * world.timeScale;
  if(world.time>=1){ world.time-=1; world.day++; onNewDay(); }
}
function onNewDay(){
  // markets drift each day; supplies fatigue
  driftMarkets();
  toast(`Day ${world.day} — dawn breaks`, '🌅');
}

// Sun altitude: -1 (deep night) .. 1 (noon). Returns {alt, isDay, dawn, dusk}
function sunInfo(){
  const th = (world.time - 0.25) * TAU;      // sunrise at .25
  const alt = Math.sin(th);                  // -1..1
  const t = world.time;
  const dawn = clamp(inv(0.18,0.30,t) * (1-inv(0.30,0.38,t)),0,1);
  const dusk = clamp(inv(0.66,0.76,t) * (1-inv(0.76,0.86,t)),0,1);
  return { alt, isDay: alt>-0.06, dawn, dusk,
           az: (t*TAU) };                     // azimuth for sun x-position
}

/* ======================= 6. PAINT HELPERS • PAPER • SKY ================== */
const GEN = { dirty:true, paper:null, coast:{} };

// One-time tileable paper grain (soft-light overlay for a painted texture)
function buildPaper(){
  const s=256, oc=document.createElement('canvas'); oc.width=s;oc.height=s;
  const g=oc.getContext('2d'); const img=g.createImageData(s,s); const d=img.data;
  const nz = makeNoise1D(31), nz2 = makeNoise1D(88);
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const i=(y*s+x)*4;
    // fibrous grain: mix of hash + low-freq blotches
    let v = hash2(x*1.7,y*1.7)*0.6 + hash2(x*0.13+9,y*0.13+3)*0.4;
    v = 0.5 + (v-0.5)*0.9;
    const shade = 128 + (v-0.5)*70;
    d[i]=d[i+1]=d[i+2]=shade; d[i+3]=255;
  }
  g.putImageData(img,0,0);
  GEN.paper = oc;
}
function paintPaper(alpha){
  if(!GEN.paper) buildPaper();
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation='soft-light';
  const p=GEN.paper, sc=Math.ceil(W/p.width), sr=Math.ceil(H/p.height);
  for(let i=0;i<=sc;i++)for(let j=0;j<=sr;j++) ctx.drawImage(p, i*p.width, j*p.height);
  ctx.restore();
}
// soft radial blob (a single loaded 'brush' of colour)
function blob(x,y,r,col,a0,a1){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0, withA(col,a0));
  g.addColorStop(0.6, withA(col,(a0+ (a1||0))*0.5));
  g.addColorStop(1, withA(col,a1||0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
}
// wet-edge horizontal wash band
function washBand(y0,y1,cTop,cBot,edge){
  const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,cTop); g.addColorStop(1,cBot);
  ctx.fillStyle=g; ctx.fillRect(-4,y0,W+8,y1-y0);
  if(edge){ ctx.fillStyle=withA(edge,0.10); ctx.fillRect(-4,y1-2,W+8,3); }
}

// -------- Sky colour model (shared by sky + water reflection) ------------
function skyColors(){
  const R = regionData(), s = sunInfo();
  const dayness = clamp(s.alt*1.15 + 0.32, 0, 1);
  const warm = clamp(s.dawn + s.dusk, 0, 1);

  const nightTop = shade(hex2rgb(R.sky.night), -0.18);
  const nightHor = shade(hex2rgb(R.sky.night),  0.06);
  const dayTop   = shade(hex2rgb(R.sky.day),   -0.02);
  const dayHor   = shade(hex2rgb(R.sky.day),    0.22);

  let top = mix(nightTop, dayTop, smooth(dayness));
  let hor = mix(nightHor, dayHor, smooth(dayness));
  // warm dawn/dusk wash near horizon
  const warmCol = mix(hex2rgb(R.sky.dawn), hex2rgb(R.sky.dusk), s.dusk/(s.dawn+s.dusk+0.0001));
  hor = mix(hor, warmCol, warm*0.7);
  top = mix(top, shade(warmCol,-0.15), warm*0.25);

  // overcast greys everything down & flattens
  const grey=[150,152,150];
  top = mix(top, shade(grey,-0.25), world.overcast*0.55);
  hor = mix(hor, shade(grey,-0.05), world.overcast*0.5);
  // storm darkens & cools
  top = mix(top, [40,46,54], world.storm*0.55);
  hor = mix(hor, [70,74,80], world.storm*0.45);

  // ambient light tint used to colour boat/sea highlights
  const ambient = mix(mix(nightTop,dayHor,dayness), warmCol, warm*0.5);
  const lightStrength = clamp(dayness*(1-world.overcast*0.5)*(1-world.storm*0.5),0.05,1);
  return { top, hor, warm, warmCol, dayness, sun:s, ambient, lightStrength,
           sunCol:hex2rgb(R.sun) };
}

function celestial(phase){
  const alt = Math.sin((phase-0.25)*TAU);
  const px = clamp(map(phase,0.24,0.76,0.08,0.92), -0.2,1.2);
  const x = W*px;
  const y = view.waterY - alt*(view.waterY*0.82) - 22;
  return {x,y,alt};
}

// -------- Clouds ---------------------------------------------------------
function drawClouds(sky){
  const cover = world.cloudCover;
  if(cover<0.02 && world.storm<0.02) return;
  const n = Math.round(6 + cover*10);
  const scroll = Game.t * (6 + world.windStr*40) * world.windDir;
  const baseY = view.waterY;
  const nz = world.noiseCloud;
  ctx.save();
  for(let i=0;i<n;i++){
    // stable per-cloud pseudo position that scrolls with wind
    const seed=i*97.13;
    const speed = 0.4 + (i%3)*0.28;                 // parallax layers
    let cx = wrap((i*197.7 + scroll*speed*0.35), W+520) - 260;
    const layer = (i%3);
    const cy = baseY*(0.12 + 0.16*((i*0.37)%1)) + layer*8;
    const nzv = nz(i*3.1 + Game.t*0.03);
    const scale = (0.6 + 0.9*((i*0.53)%1)) * (1+cover*0.4);
    const wCloud = 140*scale, hCloud=42*scale;
    // colour: brighter top, warm/greyer bottom; storm = dark & low
    const stormy = world.storm;
    let cTop = mix(sky.top, [255,255,255], 0.5*sky.lightStrength*(1-stormy*0.7));
    let cBot = mix(sky.hor, [180,182,186], 0.35);
    cTop = mix(cTop, [70,74,82], stormy*0.7);
    cBot = mix(cBot, [46,50,58], stormy*0.75);
    const alpha = clamp(0.12 + cover*0.7 + stormy*0.3, 0, 0.92);
    // build a cloud from overlapping soft ellipses
    const puffs = 5 + (i%3);
    for(let p=0;p<puffs;p++){
      const t=p/(puffs-1);
      const ex = cx + (t-0.5)*wCloud*1.6 + Math.sin(seed+p)*10;
      const puffH = hCloud*(0.5+0.9*Math.sin(t*Math.PI));
      const ey = cy - puffH*0.3 + Math.cos(seed*1.3+p)*4;
      const rr = puffH*1.3;
      const col = mix(cBot,cTop, clamp(1-t*0.2 - (ey<cy?0.3:0),0,1));
      const g=ctx.createRadialGradient(ex,ey-rr*0.2,rr*0.1, ex,ey,rr);
      g.addColorStop(0, withA(col, alpha));
      g.addColorStop(1, withA(col, 0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(ex,ey,rr*1.5,rr,0,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// -------- Stars ----------------------------------------------------------
let STARS=null;
function buildStars(){
  STARS=[]; const r=mulberry32(2024);
  for(let i=0;i<170;i++) STARS.push({x:r(), y:r()*0.7, s:0.4+r()*1.7, ph:r()*TAU, tw:0.5+r()*2});
}
function drawStars(sky){
  const a = clamp(1-sky.dayness*3.0,0,1) * (1-world.overcast*0.85);
  if(a<=0.02) return;
  if(!STARS) buildStars();
  ctx.save();
  for(const st of STARS){
    const tw = 0.6+0.4*Math.sin(Game.t*st.tw+st.ph);
    ctx.fillStyle = withA([255,250,235], a*tw*0.9);
    const x=st.x*W, y=st.y*view.waterY;
    ctx.beginPath(); ctx.arc(x,y,st.s,0,TAU); ctx.fill();
    if(st.s>1.3){ // bright star glow
      ctx.fillStyle=withA([210,225,255],a*tw*0.25);
      ctx.beginPath(); ctx.arc(x,y,st.s*2.6,0,TAU); ctx.fill();
    }
  }
  ctx.restore();
}

// -------- Full sky render ------------------------------------------------
function drawSky(sky){
  // base wash
  washBand(0, view.waterY+2, rgb2css(sky.top), rgb2css(sky.hor));
  // horizon warm/dawn glow bloom
  if(sky.warm>0.02){
    const gy=view.waterY;
    const g=ctx.createLinearGradient(0,gy-view.waterY*0.5,0,gy);
    g.addColorStop(0,withA(sky.warmCol,0)); g.addColorStop(1,withA(sky.warmCol,0.35*sky.warm));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,gy);
  }
  drawStars(sky);
  // moon (opposite phase to sun)
  const moon = celestial(wrap(world.time+0.5,1));
  if(moon.alt>-0.05){
    const ma = clamp(moon.alt*1.4,0,1)*(1-world.overcast*0.7);
    blob(moon.x,moon.y, 70, [220,228,240], 0.10*ma, 0);
    ctx.fillStyle=withA([245,246,238], 0.95*ma);
    ctx.beginPath(); ctx.arc(moon.x,moon.y,15,0,TAU); ctx.fill();
    ctx.fillStyle=withA([210,214,206],0.5*ma);   // crater shading
    ctx.beginPath(); ctx.arc(moon.x+5,moon.y-3,4,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(moon.x-4,moon.y+4,3,0,TAU); ctx.fill();
  }
  // sun with glow
  const sun = celestial(world.time);
  if(sun.alt>-0.06){
    const sa = clamp(sun.alt*1.6+0.25,0,1)*(1-world.storm*0.6);
    const glow = mix(sky.sunCol, sky.warmCol, sky.warm*0.6);
    blob(sun.x,sun.y, 220, glow, 0.28*sa*(1-world.overcast*0.5), 0);
    blob(sun.x,sun.y, 90,  glow, 0.5*sa, 0);
    ctx.fillStyle=withA(mix(sky.sunCol,[255,255,255],0.4), 0.95*sa);
    ctx.beginPath(); ctx.arc(sun.x,sun.y,20,0,TAU); ctx.fill();
    window.__sunScreen={x:sun.x,y:sun.y,a:sa};  // used for water glitter path
  } else window.__sunScreen=null;
  drawClouds(sky);
}

/* ======================= 7. SEA (sailing horizon plane) ================= */
// wave displacement (px) at a given world x and foreground factor f01 (0 horizon..1 near)
function waveAt(wx, f01){
  const t=Game.t, nz=world.noiseSea;
  const amp=(1.5 + f01*15) * (0.5 + world.seaState*1.3);
  let h = Math.sin(wx*0.10 - t*1.25)*0.5
        + Math.sin(wx*0.031 + t*0.8)*0.32
        + Math.sin(wx*0.24 + t*2.3)*0.18
        + (nz(wx*0.02 + t*0.15)-0)*0.5;
  return h*amp;
}
function waterCols(sky){
  const R=regionData();
  const l = sky.lightStrength;
  let top = mix(hex2rgb(R.water.top), sky.hor, 0.35);         // surface reflects sky
  top = mix(top, sky.warmCol, sky.warm*0.4);
  top = mix(top, [40,52,60], world.storm*0.4);
  let mid = mix(hex2rgb(R.water.mid), [20,30,38], world.storm*0.3);
  let deep= hex2rgb(R.water.deep);
  top = mix(top, deep, (1-l)*0.25);   // darker water at night
  mid = mix(mid, deep, (1-l)*0.3);
  return {top,mid,deep};
}
function drawSea(sky){
  const wy=view.waterY, wc=waterCols(sky);
  // body gradient
  const g=ctx.createLinearGradient(0,wy,0,H);
  g.addColorStop(0, rgb2css(wc.top));
  g.addColorStop(0.42, rgb2css(mix(wc.top,wc.mid,0.8)));
  g.addColorStop(1, rgb2css(wc.deep));
  ctx.fillStyle=g; ctx.fillRect(0,wy,W,H-wy);

  // reflected horizon glow band just under the waterline
  ctx.save(); ctx.globalCompositeOperation='screen';
  const rg=ctx.createLinearGradient(0,wy,0,wy+(H-wy)*0.4);
  rg.addColorStop(0, withA(mix(sky.hor,sky.warmCol,sky.warm*0.6), 0.5*sky.lightStrength));
  rg.addColorStop(1, withA(sky.hor,0));
  ctx.fillStyle=rg; ctx.fillRect(0,wy,W,(H-wy)*0.4);
  ctx.restore();

  // wave rows (perspective: denser near horizon, taller near foreground)
  const rows=46;
  for(let i=1;i<=rows;i++){
    const f = i/rows;                        // 0..1 horizon->foreground
    const yBase = wy + (H-wy)*Math.pow(f,1.5);
    const rowH = (H-wy)*(Math.pow(f,1.5)-Math.pow((i-1)/rows,1.5));
    // sample a wavy stroke
    const crest = 0.5+0.5*Math.sin(Game.t*1.4 + f*8);
    const lightRow = mix(wc.top, [255,255,255], 0.08*sky.lightStrength*f);
    const darkRow  = mix(wc.mid, wc.deep, f*0.6);
    ctx.beginPath();
    const step=Math.max(6, 34-f*22);
    for(let sx=-10;sx<=W+10;sx+=step){
      const wx=screenToWorldX(sx);
      const disp=waveAt(wx, f);
      const y=yBase + disp*0.6;
      if(sx<=-10) ctx.moveTo(sx,y); else ctx.lineTo(sx,y);
    }
    ctx.lineTo(W+10, yBase+rowH+30); ctx.lineTo(-10,yBase+rowH+30); ctx.closePath();
    ctx.fillStyle= rgb2css(mix(darkRow, lightRow, 0.35+0.4*crest));
    ctx.globalAlpha=0.5+0.5*f;
    ctx.fill();
    ctx.globalAlpha=1;
    // crest highlight strokes on nearer rows
    if(f>0.35 && world.seaState>0.15){
      ctx.strokeStyle=withA(sky.foam||'#eef',0.10+0.22*world.seaState);
      ctx.lineWidth=Math.max(1,f*2.2);
      ctx.beginPath();
      for(let sx=-10;sx<=W+10;sx+=step){
        const wx=screenToWorldX(sx);
        const y=yBase + waveAt(wx,f)*0.6 - 2;
        if(sx<=-10) ctx.moveTo(sx,y); else ctx.lineTo(sx,y);
      }
      ctx.stroke();
    }
  }

  // sun/moon glitter path
  const cel = window.__sunScreen;
  if(cel && cel.a>0.1){
    ctx.save(); ctx.globalCompositeOperation='screen';
    const cx=clamp(cel.x,0,W);
    for(let i=0;i<60;i++){
      const f=i/60, y=wy + (H-wy)*Math.pow(f,1.4);
      const spread=6+f*90;
      const flick=0.5+0.5*Math.sin(Game.t*5+i*1.7);
      const gx=cx + Math.sin(Game.t*2+i)*spread;
      const a=(1-f)*0.5*cel.a*flick*(1-world.overcast*0.6);
      ctx.fillStyle=withA(mix(regionData().sun?hex2rgb(regionData().sun):[255,240,200],[255,255,255],0.3), a);
      ctx.fillRect(gx-(3+f*10), y, 6+f*20, 1.5+f*2.5);
    }
    ctx.restore();
  }

  // foam flecks when rough
  if(world.seaState>0.45){
    ctx.save();
    const n=Math.round((world.seaState-0.4)*90);
    for(let i=0;i<n;i++){
      const f=0.4+rnd()*0.6, y=wy+(H-wy)*Math.pow(f,1.4);
      const x=rnd()*W;
      ctx.fillStyle=withA('#f2fbff',0.12+rnd()*0.25*world.seaState);
      ctx.beginPath(); ctx.arc(x,y,0.6+f*1.8,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ======================= 8. PARALLAX COAST ============================== */
function hillProfile(nzSeed, baseAmp){
  // cached noise fn per seed
  hillProfile._c = hillProfile._c || {};
  if(!hillProfile._c[nzSeed]) hillProfile._c[nzSeed]=makeNoise1D(nzSeed);
  return hillProfile._c[nzSeed];
}
function drawCoast(sky){
  const R=regionData(), wy=view.waterY;
  const layers=R.hills.length;
  for(let li=0;li<layers;li++){
    const depth=li/(layers-1);                 // 0 far .. 1 near
    const par=0.05 + depth*0.32;               // parallax factor
    const nz=hillProfile(1000+li*37);
    let col=hex2rgb(R.hills[li]);
    // atmospheric perspective: far hills fade toward sky/horizon & desaturate
    col = mix(col, sky.hor, (1-depth)*0.55 + world.fog*0.5);
    col = mix(col, [70,74,80], world.storm*0.4);
    col = shade(col, (sky.dayness-0.5)*0.12);
    const amp=(28+depth*70)*(1);
    const baseY = wy - 2 + (1-depth)*6;
    const scroll = view.camX*par*0.4;
    ctx.beginPath(); ctx.moveTo(-4, wy+4);
    const step=14;
    for(let sx=-4;sx<=W+4;sx+=step){
      const u=(sx+scroll)*0.006;
      const h = fbm1(nz, u, 4)* amp + fbm1(nz, u*2.3+50, 3)*amp*0.3;
      const y = baseY - Math.max(0,h) - 6;
      ctx.lineTo(sx, y);
    }
    ctx.lineTo(W+4, wy+4); ctx.closePath();
    ctx.fillStyle=rgb2css(col); ctx.fill();
    // near ridgeline gets a soft rim light at dawn/dusk
    if(depth>0.6 && sky.warm>0.1){
      ctx.strokeStyle=withA(sky.warmCol, 0.18*sky.warm);
      ctx.lineWidth=2; ctx.stroke();
    }
  }
  // atmospheric haze right at the waterline
  const hz=ctx.createLinearGradient(0,wy-40,0,wy+8);
  hz.addColorStop(0,withA(sky.hor,0));
  hz.addColorStop(1,withA(mix(sky.hor,[255,255,255],0.2), 0.35+world.fog*0.4));
  ctx.fillStyle=hz; ctx.fillRect(0,wy-40,W,48);
}

/* ======================= 9. PARTICLES =================================== */
let particles=[];
function spawnP(o){ particles.push(Object.assign({x:0,y:0,vx:0,vy:0,life:1,max:1,r:2,col:'#fff',grav:0,drag:0.98,kind:'dot',a:0.8},o)); }
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy += p.grav*dt; p.vx*=p.drag; p.vy*=p.drag;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt/p.max;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life,0,1)*p.a;
    if(p.kind==='spray'||p.kind==='dot'||p.kind==='splash'){
      ctx.fillStyle=withA(p.col,a); ctx.beginPath(); ctx.arc(p.x,p.y,p.r*clamp(p.life+0.3,0,1),0,TAU); ctx.fill();
    } else if(p.kind==='bubble'){
      ctx.strokeStyle=withA(p.col,a*0.8); ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.stroke();
    } else if(p.kind==='ring'){
      ctx.strokeStyle=withA(p.col,a); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(1.4-p.life),0,TAU); ctx.stroke();
    }
  }
}

const player = {
  money: 120, fuel: 60, fuelMax: 60, bait: 12,
  hull: 100, hullMax: 100,
  hold: [],          // caught fish {id, len, value}
  cargo: {},         // trade goods {id:qty}
  upg: { engine:0, sail:0, hull:0, line:0, lure:0, sonar:0 },
  x: 420, vx:0, facing:1, motor:true,
  regionDone: [false,false,false],
  earnedThisRegion: 0,
  caughtLegendary: [false,false,false],
  home: {name:'', flags:{}},
  discovered: {},    // fish id -> true
};
function holdMax(){ return UPGRADES.hull.levels[player.upg.hull].hold; }
function holdCount(){ return player.hold.length; }
function upgVal(cat,prop){ const l=UPGRADES[cat].levels[player.upg[cat]]; return l[prop]; }

function boatBandY(){ return view.waterY + (H-view.waterY)*0.46; }

function updatePlayer(dt){
  const eng=UPGRADES.engine.levels[player.upg.engine];
  const sailU=UPGRADES.sail.levels[player.upg.sail];
  let dir=0;
  if(Input.left()) dir=-1; else if(Input.right()) dir=1;
  const usingMotor = player.motor && player.fuel>0;
  let thrust=0;
  if(dir!==0){
    if(usingMotor){
      thrust = 300*eng.spd*dir;
      player.fuel = Math.max(0, player.fuel - dt*1.7*eng.fuelUse*(0.6+Math.abs(player.vx)/160));
      if(Game.frame%4===0 && Math.abs(player.vx)>30) emitWake();
    } else {
      const align = 0.35 + 0.65*clamp(dir*world.windDir*0.5+0.5,0,1);
      thrust = 150*sailU.wind*(0.35+world.windStr*0.9)*align*dir;
    }
  }
  player.vx += (thrust - player.vx*2.6)*dt;
  player.x += player.vx*dt;
  const len=regionData().length;
  if(player.x<40){ player.x=40; player.vx*=-0.3; }
  if(player.x>len){ player.x=len; player.vx*=-0.3; }
  if(Math.abs(player.vx)>4) player.facing = player.vx>0?1:-1;

  // camera follows with lookahead
  view.targetCamX = player.x + player.facing*70/view.pxPerM * clamp(Math.abs(player.vx)/120,0,1);

  // storm hull damage if out at sea (far from any port) during heavy weather
  if(world.storm>0.55){
    const near = nearestPort();
    const far = !near || Math.abs(near.x-player.x)>320;
    if(far){
      const dmg = (world.storm-0.5)* dt * 3.2 / upgVal('hull','armor');
      player.hull=Math.max(0,player.hull-dmg);
      if(player.hull<=0) onSink();
      if(Game.frame%30===0) addShake(0.2*world.storm);
    }
  }
  // spray from bow when moving in chop
  if(Math.abs(player.vx)>60 && world.seaState>0.25 && Game.frame%3===0){
    const bx=W/2 + player.facing*30, by=boatBandY()+waveAt(player.x,0.46);
    spawnP({x:bx,y:by,vx:player.facing*rrange(20,60)+player.vx*0.2,vy:-rrange(40,110),
      grav:260,r:rrange(1.2,2.6),col:'#eaf6fb',max:0.8,kind:'spray',a:0.7});
  }
}
function emitWake(){
  const by=boatBandY()+waveAt(player.x,0.46)+8;
  spawnP({x:W/2 - player.facing*34, y:by, vx:-player.facing*rrange(6,24), vy:rrange(-6,4),
    grav:8,r:rrange(2.5,5),col:'#dff0f4',max:1.4,kind:'spray',a:0.5,drag:0.94});
}
function nearestPort(){
  const ps=regionData().ports; let best=null,bd=1e9;
  for(const p of ps){ const d=Math.abs(p.x-player.x); if(d<bd){bd=d;best=p;} }
  return best;
}
function onSink(){
  player.hull=1; player.vx=0;
  // rescue: lose some catch & money, tow to nearest port
  const lost=Math.round(player.money*0.15);
  player.money=Math.max(0,player.money-lost);
  player.hold.length=0;
  const p=nearestPort(); player.x=p.x;
  addFlash(0.7,'#ffffff'); addShake(1.0);
  showEvent('Rescued at Sea','⛑️',
    `A storm nearly took you. The coast guard towed you to <b>${p.name}</b>. You lost your catch and ${lost} coin in the ordeal.`,
    [{label:'Count my blessings',cls:'gold',act:()=>{closeOverlays();Game.set('sail');}}]);
  Game.set('event');
}

// --- Boat art ---
function drawBoat(cx,cy,ang,scale,light,submergeReflection=true){
  const R=regionData();
  ctx.save();
  ctx.translate(cx,cy);
  // reflection first (below), faint & wavering
  if(submergeReflection){
    ctx.save();
    ctx.globalAlpha=0.16;
    ctx.scale(1,-1);
    ctx.translate(0, -6 - waveAt(player.x,0.5)*0.5);
    ctx.filter='blur(1px)';
    drawBoatBody(ang*0.4, scale, light, true);
    ctx.filter='none';
    ctx.restore();
  }
  ctx.rotate(ang);
  drawBoatBody(ang, scale, light, false);
  ctx.restore();
}
function drawBoatBody(ang, s, light, isRef){
  const f=player.facing;
  ctx.save(); ctx.scale(f*s, s);
  const hullCol = mix([166,74,58], light, 0.12);      // weathered red
  const hullDk  = shade(hullCol,-0.3);
  const wood    = mix([120,86,54], light,0.1);
  const cream   = mix([238,226,196], light,0.15);
  // hull
  ctx.beginPath();
  ctx.moveTo(-40,-2);
  ctx.quadraticCurveTo(-46,10, -30,16);
  ctx.lineTo(30,16);
  ctx.quadraticCurveTo(48,12, 46,-4);       // pointed bow (right)
  ctx.lineTo(38,-4);
  ctx.lineTo(-38,-4);
  ctx.closePath();
  const hg=ctx.createLinearGradient(0,-6,0,18);
  hg.addColorStop(0,rgb2css(hullCol)); hg.addColorStop(1,rgb2css(hullDk));
  ctx.fillStyle=hg; ctx.fill();
  // gunwale stripe
  ctx.fillStyle=rgb2css(cream); ctx.fillRect(-40,-6,86,3.2);
  ctx.fillStyle=withA(shade(cream,-0.35),0.8); ctx.fillRect(-40,-3.2,86,1.2);
  // cabin
  ctx.fillStyle=rgb2css(mix(cream,[210,120,90],0.15));
  roundRect(-16,-22,26,18,3); ctx.fill();
  ctx.fillStyle=rgb2css(shade(hullCol,-0.1)); roundRect(-16,-26,26,6,2); ctx.fill(); // roof
  // window
  ctx.fillStyle=withA(mix([120,180,200],light,0.3), light[0]>120?0.9:0.7);
  roundRect(-11,-19,9,8,2); ctx.fill();
  if(skyColors().dayness<0.35){ // warm lantern glow at night
    ctx.save(); ctx.globalCompositeOperation='screen';
    blob(-6,-15,26,[255,210,130],0.5,0); ctx.restore();
    ctx.fillStyle=withA([255,224,150],0.95); roundRect(-11,-19,9,8,2); ctx.fill();
  }
  // mast + sail
  ctx.strokeStyle=rgb2css(wood); ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.moveTo(20,-6); ctx.lineTo(20,-58); ctx.stroke();
  // sail bulges with wind (relative to facing)
  const wind = world.windStr*world.windDir*f;
  const bulge = 8 + wind*10 + Math.sin(Game.t*3)*1.5*world.windStr;
  ctx.beginPath();
  ctx.moveTo(20,-56); ctx.lineTo(20,-10);
  ctx.quadraticCurveTo(20-bulge, -33, 20-2, -56);   // sail toward -x (behind mast)
  ctx.closePath();
  const sailCol=mix([246,240,224],light,0.1);
  const sg=ctx.createLinearGradient(20,-56,20-bulge,-33);
  sg.addColorStop(0,rgb2css(sailCol)); sg.addColorStop(1,rgb2css(shade(sailCol,-0.18)));
  ctx.fillStyle=sg; ctx.fill();
  ctx.strokeStyle=withA(shade(sailCol,-0.3),0.5); ctx.lineWidth=1; ctx.stroke();
  // little flag
  ctx.fillStyle=rgb2css([190,80,66]);
  const fl=Math.sin(Game.t*6)*2;
  ctx.beginPath(); ctx.moveTo(20,-58); ctx.lineTo(30,-56+fl); ctx.lineTo(20,-52); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawPlayerBoat(sky){
  const bx=W/2, by=boatBandY()+waveAt(player.x,0.46);
  const slope=(waveAt(player.x+8,0.46)-waveAt(player.x-8,0.46));

function drawWeatherFX(sky){
  // fog wash
  if(world.fog>0.03){
    const f=world.fog;
    const g=ctx.createLinearGradient(0,view.waterY-60,0,H);
    g.addColorStop(0,withA(mix(sky.hor,[230,232,230],0.4), f*0.5));
    g.addColorStop(0.5,withA(mix(sky.hor,[220,224,224],0.3), f*0.3));
    g.addColorStop(1,withA(mix(sky.hor,[210,215,215],0.2), f*0.42));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // drifting fog banks
    ctx.save(); ctx.globalCompositeOperation='screen';
    for(let i=0;i<4;i++){
      const y=view.waterY*0.4 + i*40 + Math.sin(Game.t*0.2+i)*10;
      const x=wrap(Game.t*(8+i*4)*world.windDir + i*260, W+400)-200;
      blob(x,y,180,[235,238,236], f*0.10, 0);
    }
    ctx.restore();
  }
  // rain
  if(world.rainI>0.02){
    const n=Math.round(world.rainI*260);
    ctx.strokeStyle=withA([200,220,235], 0.28+world.storm*0.2);
    ctx.lineWidth=1;
    const wind=world.windDir*(6+world.windStr*10);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const sp=520+((i*37)%60)*9;
      const x=wrap(hash2(i,3)*W + Game.t*wind*14, W+40)-20;
      const y=wrap(hash2(i,9)*H + Game.t*sp, H+40)-20;
      const len=10+ (world.rainI)*10;
      ctx.moveTo(x,y); ctx.lineTo(x-wind*0.9, y+len);
    }
    ctx.stroke();
    // rain splashes on water
    if(Game.frame%2===0) for(let k=0;k<world.rainI*4;k++){
      const x=rnd()*W, y=view.waterY+(H-view.waterY)*(0.2+rnd()*0.8);
      spawnP({x,y,vx:0,vy:0,r:rrange(1,3),col:'#dfeef5',max:0.4,kind:'ring',a:0.4});
    }
  }
  // snow
  if(world.snowI>0.02){
    const n=Math.round(world.snowI*220);
    for(let i=0;i<n;i++){
      const sp=40+((i*13)%40)*2.2;
      const drift=Math.sin(Game.t*0.8 + i)*18 + world.windDir*20;
      const x=wrap(hash2(i,5)*W + Game.t*drift + Math.sin(Game.t+i)*8, W+30)-15;
      const y=wrap(hash2(i,11)*H + Game.t*sp, H+30)-15;
      const r=0.8+ (i%3)*0.7;
      ctx.fillStyle=withA([245,248,252], 0.5+ (i%3)*0.15);
      ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
    }
  }
  // storm darkening vignette + lightning
  if(world.storm>0.05){
    ctx.fillStyle=withA([10,14,22], world.storm*0.22);
    ctx.fillRect(0,0,W,H);
  }
}
function drawFlash(){
  if(view.flash>0.01){ ctx.fillStyle=withA(view.flashCol, view.flash*0.5); ctx.fillRect(0,0,W,H); }

function drawVignette(){

  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}

function update(dt){
  Game.t += dt;
  if(Game.paused) return;
  const sim = (Game.screen==='sail' || Game.screen==='fish');
  if(sim){
    advanceTime(dt);
    updateWeather(dt);
    if(fishing.active){ updateFishing(dt); }
    else { updatePlayer(dt); maybePortPrompt(); }
  }
  updateView(dt);
  updateParticles(dt);
}

function renderScene(){
  const sky=skyColors();
  if(fishing.active){ renderUnderwater(sky); return; }
  drawSky(sky);
  drawCoast(sky);
  drawPorts(sky);
  drawSea(sky);
  drawPlayerBoat(sky);
  drawWeatherFX(sky);
}
function render(){
  Game.frame++;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.shakeX,view.shakeY);
  renderScene();
  ctx.restore();
  drawFlash();
  paintPaper(0.42);
  drawVignette();
  updateHUD();
}
let _last=0;
function frame(now){
  if(!_last) _last=now;
  let dt=(now-_last)/1000; _last=now;
  dt=Math.min(dt,0.05);
  update(dt);
  render();
  pressed.clear();
  requestAnimationFrame(frame);
}

function boot(){
  resize();
  buildPaper(); buildStars();
  world.region=0;
  const R=regionData();
  player.x=R.ports[0].x; view.camX=player.x; view.targetCamX=player.x;
  view.waterY=H*0.46; view.targetWaterY=H*0.46;
  setWeather('cloud'); world.wBlend=1;
  updateWeather(0.001);
  Game.set('sail');   // temporary: jump straight into sailing for now
  const bar=document.getElementById('bootbar');
  if(bar) bar.style.width='100%';
  setTimeout(()=>{ const b=document.getElementById('boot'); if(b) b.classList.add('hidden'); }, 500);
  requestAnimationFrame(frame);
}
window.addEventListener('load', boot);
