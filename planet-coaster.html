      // resolve what is under the cursor for THIS position before acting on it
      this.updateHover();
      if (e.button !== 0) Cam.beginDrag(this.R, e.clientX, e.clientY, e.button === 1 || e.ctrlKey || e.altKey);
      if (e.button === 0 && Cam.mode === 'orbit') this.pointerAction(e, true);
    });
    cv.addEventListener('pointermove', e => {
      const dx = e.clientX - this.mouse.x, dy = e.clientY - this.mouse.y;
      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
      if (this.mouse.down) this.mouse.moved += Math.abs(dx) + Math.abs(dy);
      this.updateHover();
      if (this.mouse.down && (this.mouse.btn === 2 || this.mouse.btn === 1)) {
        Cam.dragTo(this.R, e.clientX, e.clientY, dx, dy);
      } else if (this.mouse.down && this.mouse.btn === 0 && Cam.mode === 'orbit') {
        this.pointerAction(e, false);
      }
    });
    cv.addEventListener('pointerup', e => {
      if (this.mouse.down && this.mouse.btn === 0 && this.mouse.moved < 6) this.click(e);
      this.mouse.down = false; this.paintStart = null; Cam.endDrag();
    });
    cv.addEventListener('pointercancel', () => { this.mouse.down = false; Cam.endDrag(); });
    cv.addEventListener('wheel', e => { e.preventDefault(); Cam.zoom(e.deltaY, this.hoverPoint); }, { passive: false });

    window.addEventListener('keydown', e => {
      this.keys[e.key.toLowerCase()] = true;
      const k = e.key.toLowerCase();
      if (e.ctrlKey || e.metaKey) {
        if (k === 's') { e.preventDefault(); this.save(); return; }
        if (k === 'l') { e.preventDefault(); this.load(); return; }
      }
      if (k === 'escape') {
        if (Cam.mode === 'ride') { this.exitRideCam(); return; }
        if (Coaster.placing) { Coaster.placing = null; Coaster.blueprint = null; UI.hint('Cancelled.'); return; }
        UI.sub = null; UI.setTool('select'); UI.closeInspector(); UI.closeModal();
        document.querySelectorAll('#bpBody .item').forEach(x => x.classList.remove('on'));
        return;
      }
      if (k === 'r') { UI.rot = (UI.rot + 1) % 4; this.ghostKey = ''; return; }
      if (k === 'm') { $('#minimap').classList.toggle('show'); return; }
      if (k === 'l') { UI.landDialog(); return; }
      if (k === 'f') { UI.finances(); return; }
      if (k === 'h') { UI.help(); return; }
      if (k === 'c' && Cam.mode === 'ride') {
        this.rideCamMode = ((this.rideCamMode || 0) + 1) % 2;
        UI.hint(this.rideCamMode === 0 ? 'Chase camera' : 'Front-seat camera');
        return;
      }
      if (k === ' ') { e.preventDefault(); this.setSpeed(this.speed === 0 ? 1 : 0); return; }
      if (k === 'enter' && Coaster.active) { Coaster.add(); return; }
      if (k === 'backspace' && Coaster.active) { e.preventDefault(); Coaster.undo(); return; }
      if (k >= '1' && k <= '9' && !Coaster.active) { const t = TOOLS[+k - 1]; if (t) UI.setTool(t.id); }
      if (k === 'q') Cam.rotateBy(-1);
      if (k === 'e') Cam.rotateBy(1);
      if (k === 'z') Cam.pitch = Cam.pitch > 1.0 ? 0.55 : 1.28;
      if (k === 'p') this.setSpeed(this.speed === 0 ? 1 : 0);
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
  },
  updateHover() {
    if (Cam.mode !== 'orbit') { this.hoverTile = null; return; }
    const p = Cam.rayToPlane(this.R, this.mouse.x, this.mouse.y, 0);
    if (!p) { this.hoverTile = null; this.hoverPoint = null; return; }
    // step the ray down onto the terrain for hilly ground
    let best = p;
    const ray = Cam.rayDir(this.R, this.mouse.x, this.mouse.y);
    if (ray) {
      const at = (t) => ({ x: ray.o.x + ray.d.x * t, y: ray.o.y + ray.d.y * t, z: ray.o.z + ray.d.z * t });
      let t = 0, prev = 0, hit = -1;
      for (let k = 0; k < 400; k++) {
        const q = at(t);
        if (q.y < WORLD.hAt(q.x, q.z)) { hit = t; break; }
        prev = t; t += 1.0;
        if (t > 900) break;
      }
      if (hit >= 0) {
        // binary refine so the cursor lands on the exact tile, not a metre off
        let lo = prev, hi = hit;
        for (let k = 0; k < 18; k++) {
          const mid = (lo + hi) / 2, q = at(mid);
          if (q.y < WORLD.hAt(q.x, q.z)) hi = mid; else lo = mid;
        }
        best = at((lo + hi) / 2);
      } else {
        // the cursor is off the land entirely — better to build nothing than
        // to drop it wherever the ray happens to cross y = 0
        this.hoverTile = null; this.hoverPoint = null; this.hoverObj = null;
        return;
      }
    }
    this.hoverPoint = best;
    const i = WORLD.ti(best.x), j = WORLD.tj(best.z);
    this.hoverTile = WORLD.inb(i, j) ? { i, j } : null;
    this.hoverObj = this.hoverTile ? Park.objAt(this.hoverTile.i, this.hoverTile.j) : null;
  },
  pointerAction(e, isStart) {
    // continuous painting for paths and terrain
    if (!this.hoverTile) return;
    if (UI.tool === 'path' && UI.sub) { this.paintPath(this.hoverTile.i, this.hoverTile.j); }
    else if (UI.tool === 'terrain') { this.editTerrain(this.hoverTile.i, this.hoverTile.j, e.shiftKey ? -1 : 1, e.ctrlKey); }
    else if (UI.tool === 'scenery' && UI.sub && !isStart && this.mouse.moved > 20) { this.tryPlace(); }
  },
  click(e) {
    if (Cam.mode === 'ride') return;
    if (!this.hoverTile) return;
    Audio.resume();
    const { i, j } = this.hoverTile;
    if (Coaster.placing) {
      const a = this.anchorTile({ w: 4, d: 3 }, UI.rot);
      if (Coaster.blueprint) Coaster.buildBlueprint(Coaster.blueprint, a.i, a.j, UI.rot);
      else Coaster.placeStation(a.i, a.j, UI.rot);
      return;
    }
    switch (UI.tool) {
      case 'select': {
        const g = this.pickPerson();
        if (g) { this.select(g); return; }
        const o = this.hoverObj;
        if (o) { this.select(o); if (o.kind === 'coaster' && o.track) Coaster.enter(o); }
        else this.select(null);
        break;
      }
      case 'delete': this.deleteAt(i, j); break;
      case 'path': if (UI.sub) this.paintPath(i, j); break;
      case 'terrain': this.editTerrain(i, j, e.shiftKey ? -1 : 1, e.ctrlKey); break;
      case 'shop': case 'ride': case 'scenery': if (UI.sub) this.tryPlace(); break;
    }
  },
  pickPerson() {
    let best = null, bd = 3.2;
    const ray = Cam.rayDir(this.R, this.mouse.x, this.mouse.y);
    if (!ray) return null;
    const all = Park.guests.concat(Park.staff);
    for (const p of all) {
      const dx = p.x - ray.o.x, dy = p.y + 1 - ray.o.y, dz = p.z - ray.o.z;
      const t = dx * ray.d.x + dy * ray.d.y + dz * ray.d.z;
      if (t < 0) continue;
      const px = ray.o.x + ray.d.x * t, py = ray.o.y + ray.d.y * t, pz = ray.o.z + ray.d.z * t;
      const d = Math.hypot(px - p.x, py - (p.y + 1), pz - p.z);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  },
  select(o) {
    this.selected = o; Park.selected = o;
    UI.inspect(o);
  },

  /* ---------------- placement ---------------- */
  paintPath(i, j) {
    const kind = UI.sub.id;
    const t = WORLD.t(i, j);
    if (t === T_BUILD) return;
    if (!WORLD.ownsTile(i, j)) {
      if (!this._landWarn || Date.now() - this._landWarn > 2000) {
        this._landWarn = Date.now();
        UI.notify('Not your land', 'Buy this plot from the land market first (L).', 'warn');
      }
      return;
    }
    if (kind === 'erase') {
      if (t === T_GRASS) return;
      WORLD.setT(i, j, T_GRASS); Path.dirty = true; Park.money += 8;
      return;
    }
    const target = kind === 'path' ? T_PATH : kind === 'queue' ? T_QUEUE : T_PLAZA;
    if (t === target) return;
    const cost = UI.sub.cost;
    if (Park.money < cost) { UI.notify('Out of funds', 'You cannot afford more path.', 'bad'); return; }
    Park.spend(cost);
    WORLD.setT(i, j, target);
    // flatten the tile a little so paths sit on the ground nicely
    Path.dirty = true;
    if (Math.random() < .25) Audio.play('click');
  },
  editTerrain(i, j, dir, level) {
    if (!WORLD.ownsTile(i, j)) return;
    const W = N + 1, r = 2;
    const cost = 30;
    if (Park.money < cost) return;
    Park.money -= cost;
    const base = WORLD.h[j * W + i];
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      const ii = i + di, jj = j + dj;
      if (ii < 0 || jj < 0 || ii > N || jj > N) continue;
      const f = clamp(1 - Math.hypot(di, dj) / (r + .5), 0, 1);
      const k = jj * W + ii;
      if (level) WORLD.h[k] = lerp(WORLD.h[k], base, f * .5);
      else WORLD.h[k] += dir * f * .55;
    }
    WORLD.dirty = true;
  },
  /* Top-left tile of a footprint centred on the hovered tile. */
  anchorTile(def, rot) {
    const rotated = (rot % 2) === 1;
    const gw = rotated ? def.d : def.w, gd = rotated ? def.w : def.d;
    const h = this.hoverTile;
    if (!h) return null;
    return { i: h.i - ((gw - 1) >> 1), j: h.j - ((gd - 1) >> 1), gw, gd };
  },
  placementDef() {
    if (!UI.sub) return null;
    if (UI.tool === 'shop') return { kind: 'shop', def: UI.sub };
    if (UI.tool === 'ride') return { kind: 'ride', def: UI.sub };
    if (UI.tool === 'scenery') return { kind: 'scenery', def: UI.sub };
    return null;
  },
  /* Why a footprint cannot be built here — used by the ghost and the hint line. */
  blockReason(def, i0, j0, gw, gd, allowPath) {
    let unowned = 0, occupied = 0, onPath = 0, steep = 0, off = 0;
    for (let j = j0; j < j0 + gd; j++) for (let i = i0; i < i0 + gw; i++) {
      if (!WORLD.inb(i, j)) { off++; continue; }
      if (WORLD.land[j * N + i] !== 1) { unowned++; continue; }
      const t = WORLD.type[j * N + i];
      if (t === T_BUILD || t === T_QUEUE) occupied++;
      else if (!allowPath && (t === T_PATH || t === T_PLAZA || t === T_ENTRY)) onPath++;
      if (Math.abs(WORLD.tileH(i, j)) > 3.2) steep++;
    }
    if (off) return 'outside the map';
    if (unowned) return 'you do not own this land — press L to buy it';
    if (occupied) return 'something is already built here';
    if (onPath) return 'this would sit on a path';
    if (steep) return 'the ground is too steep — level it with the terrain tool';
    if (Park.money < def.cost) return 'you cannot afford this (' + money(def.cost) + ')';
    return null;
  },
  tryPlace() {
    const p = this.placementDef(); if (!p || !this.hoverTile) return;
    const a = this.anchorTile(p.def, UI.rot); if (!a) return;
    const { i, j, gw, gd } = a;
    const rot = UI.rot;
    const allowPath = p.kind === 'scenery' && ['bench', 'bin', 'lamp', 'speaker', 'statue', 'topiary', 'lights', 'banner'].includes(p.def.kind);
    const why = this.blockReason(p.def, i, j, gw, gd, allowPath);
    if (why) {
      if (!this._blockWarn || Date.now() - this._blockWarn > 1200) {
        this._blockWarn = Date.now();
        UI.notify('Cannot build here', why.charAt(0).toUpperCase() + why.slice(1) + '.', 'warn');
        Audio.play('error');
      }
      return;
    }
    Park.spend(p.def.cost);
    let o;
    if (p.kind === 'shop') o = new Shop(p.def, i, j, rot);
    else if (p.kind === 'ride') o = new Ride(p.def, i, j, rot);
    else { o = new ParkObject('scenery', p.def, i, j, rot); o.seed = rndi(0, 3); }
    o.y = WORLD.tileH(i, j);
    if (p.kind !== 'scenery') WORLD.flatten(i, j, gw, gd, o.y);
    o.updateMatrix();
    if (p.kind === 'scenery') {
      Park.objects.push(o);
      o.footprint((ii, jj) => WORLD.setOwn(ii, jj, o.id));
      this.sceneryDirty = true;
    } else {
      Park.addObject(o);
      // carve a small apron of path in front so guests can reach it
      const dir = [[0, -1], [-1, 0], [0, 1], [1, 0]][rot];
      const ci = i + Math.floor(gw / 2), cj = j + Math.floor(gd / 2);
      const fi = ci + dir[0] * (Math.floor(gd / 2) + 1), fj = cj + dir[1] * (Math.floor(gd / 2) + 1);
      if (WORLD.t(fi, fj) === T_GRASS) { WORLD.setT(fi, fj, T_PATH); Path.dirty = true; }
    }
    Audio.play('build');
    UI.notify('Built', p.def.name + ' — ' + money(p.def.cost), 'money');
    if (p.kind === 'ride') { o.openR = true; this.autoConnect(o); }
    if (p.kind === 'shop') this.autoConnect(o, true);
  },
  /* Lay a queue from a ride's entrance to the nearest walkway, so a new ride
     is actually reachable the moment it is built. Charged at the normal rate. */
  autoConnect(o, quiet) {
    if (Path.dirty) Path.rebuild();
    Park.mainSpot();
    const e = o.entrance;
    const ei = WORLD.ti(e.x), ej = WORLD.tj(e.z);
    if (!WORLD.inb(ei, ej)) return false;
    // nearest walkway tile on the main network
    let best = null, bd = 1e9;
    for (let j = Math.max(0, ej - 34); j < Math.min(N, ej + 34); j++)
      for (let i = Math.max(0, ei - 34); i < Math.min(N, ei + 34); i++) {
        if (!Path.walkable(i, j) || Path.comp[j * N + i] !== Park.mainComponent) continue;
        if (WORLD.type[j * N + i] === T_QUEUE) continue;
        const d = Math.abs(i - ei) + Math.abs(j - ej);
        if (d < bd) { bd = d; best = { i, j }; }
      }
    if (!best) {
      if (!quiet) UI.notify('No walkway nearby', 'Lay a path within about 30 tiles and the queue will connect itself.', 'warn');
      return false;
    }
    // breadth-first route from the entrance to that tile, over ground we may build on
    const from = ej * N + ei, goal = best.j * N + best.i;
    const prevOf = new Int32Array(N * N).fill(-2);
    const q = [from]; prevOf[from] = -1;
    let found = false;
    for (let head = 0; head < q.length && head < 24000; head++) {
      const k = q[head];
      if (k === goal) { found = true; break; }
      const ci = k % N, cj = (k / N) | 0;
      for (let d = 0; d < 4; d++) {
        const ni = ci + [1, -1, 0, 0][d], nj = cj + [0, 0, 1, -1][d];
        if (!WORLD.inb(ni, nj)) continue;
        const nk = nj * N + ni;
        if (prevOf[nk] !== -2) continue;
        if (WORLD.land[nk] !== 1) continue;
        const t = WORLD.type[nk];
        if (t === T_BUILD) continue;                       // cannot cut through buildings
        if (Math.abs(WORLD.tileH(ni, nj)) > 3.6) continue; // nor up a cliff
        prevOf[nk] = k;
        q.push(nk);
      }
    }
    if (!found) {
      if (!quiet) UI.notify('No route', 'Nothing could reach that entrance — clear a gap or lay the path by hand.', 'warn');
      return false;
    }
    const route = [];
    for (let k = goal; k !== -1; k = prevOf[k]) route.push(k);
    route.reverse();                                       // entrance last
    let laid = 0, cost = 0;
    for (let idx = route.length - 1, n = 0; idx >= 0; idx--, n++) {
      const k = route[idx];
      if (WORLD.type[k] !== T_GRASS) continue;
      const kind = n < 4 ? T_QUEUE : T_PATH;               // a short queue, then a walkway
      const price = kind === T_QUEUE ? 34 : 24;
      if (Park.money < price) break;
      Park.money -= price; cost += price; laid++;
      WORLD.type[k] = kind;
      WORLD.dirty = true; Path.dirty = true;
    }
    Path.rebuild();
    const ok = Path.connected(Park.mainSpot().x, Park.mainSpot().z, e.x, e.z);
    if (!quiet && laid) UI.notify('Queue connected', laid + ' tiles laid for ' + money(cost) + '. Guests can reach ' + (o.name || 'it') + ' now.', ok ? 'good' : 'warn');
    return ok;
  },
  deleteAt(i, j) {
    const o = Park.objAt(i, j) || Park.objects.find(x => x.kind === 'scenery' && WORLD.ownerOf(i, j) === x.id);
    if (!o) return;
    this.demolish(o.id);
  },
  demolish(id) {
    const o = Park.objects.find(x => x.id === id) || Park.coasters.find(x => x.id === id);
    if (!o) return;
    if (o.kind === 'coaster') { Coaster._rebuildTarget = null; Coaster.active = o; Coaster.demolish(); return; }
    const refund = Math.round((o.def.cost || 0) * .55);
    Park.money += refund;
    if (o.kind === 'scenery') {
      o.footprint((ii, jj) => WORLD.setOwn(ii, jj, -1));
      const k = Park.objects.indexOf(o); if (k >= 0) Park.objects.splice(k, 1);
      this.sceneryDirty = true;
    } else Park.removeObject(o);
    if (this.selected === o) this.select(null);
    UI.notify('Demolished', o.def.name + ' — refunded ' + money(refund), '');
    Audio.play('click');
  },
  hire(def) {
    if (Park.money < def.cost) { UI.notify('Out of funds', 'Cannot afford to hire.', 'bad'); return; }
    Park.spend(def.cost);
    const s = new Staff(def.id, WORLD.wx(N / 2), WORLD.wz(N / 2 + 16));
    Park.staff.push(s);
    UI.notify('Hired', s.name + ' joined the team as a ' + def.name.toLowerCase() + '.', 'good');
    if (UI.tool === 'staff') UI.openBuild('staff');
  },
  fire(id) {
    const k = Park.staff.findIndex(s => s.id === id);
    if (k >= 0) {
      const s = Park.staff[k]; Park.staff.splice(k, 1);
      UI.notify('Dismissed', s.name + ' has left the park.', '');
      UI.closeInspector();
      if (UI.tool === 'staff') UI.openBuild('staff');
    }
  },
  setPrice(id, v) {
    const o = Park.objects.find(x => x.id === id) || Park.coasters.find(x => x.id === id);
    if (!o) return;
    o.price = +v;
    const e = document.getElementById('prc' + id); if (e) e.textContent = '$' + v;
  },
  toggleOpen(id) {
    const o = Park.objects.find(x => x.id === id) || Park.coasters.find(x => x.id === id);
    if (!o) return;
    if (o.broken) { UI.notify('Broken', 'Needs a mechanic first.', 'warn'); return; }
    if (o.kind === 'coaster' && !o.track.complete) { UI.notify('Incomplete', 'Finish the circuit first.', 'warn'); return; }
    if (o.kind === 'coaster' && !o.openR && o.stalls) { UI.notify('Unsafe', o.name + ' stalls on the circuit and cannot open. Add a lift hill or reduce the height.', 'bad'); return; }
    o.openR = !o.openR;
    if (o.openR) { o.state = o.kind === 'coaster' ? 'open' : 'idle'; Audio.play('open'); }
    UI.inspect(o);
  },
  setSpeed(s) { this.speed = s; UI.updateHUD(); },
  rideCam(id) {
    const c = Park.coasters.find(x => x.id === id);
    if (!c || !c.track || !c.track.complete) return;
    this.rideCamTarget = c;
    Cam.mode = 'ride';
    $('#ridecam').classList.add('show');
    document.body.classList.add('ridemode');
    if (c.trains.length && c.trains[0].state === 'station') { c.trains[0].timer = .3; }
  },
  exitRideCam() {
    Cam.mode = 'orbit'; this.rideCamTarget = null;
    $('#ridecam').classList.remove('show');
    document.body.classList.remove('ridemode');
    Cam.fov = 38 * DEG; Cam.shake = 0;
    Audio.setRumble(0);
  },

  /* ---------------- simulation ---------------- */
  update(dt) {
    const sdt = dt * this.speed;
    Park.now += dt;
    if (this.speed > 0) {
      // clock: 1 real second ≈ 1 park minute at speed 1
      Park.time += sdt * 1.0;
      if (Park.time >= 24 * 60) { Park.time -= 24 * 60; Park.day++; this.dayTick(); }
      const hour = Math.floor(Park.time / 60);
      if (hour !== this._lastHour) { this._lastHour = hour; this.hourTick(); }

      this.spawnGuests(sdt);
      for (let k = Park.guests.length - 1; k >= 0; k--) {
        const g = Park.guests[k];
        g.update(sdt);
        if (g.dead) Park.guests.splice(k, 1);
      }
      for (const s of Park.staff) s.update(sdt);
      for (const o of Park.objects) if (o.kind === 'ride') o.update(sdt);
      for (const c of Park.coasters) Coaster.simulate(c, sdt);

      // ambient stats
      let h = 0;
      for (const g of Park.guests) h += g.happy;
      Park.happiness = Park.guests.length ? h / Park.guests.length : .7;
      Park.computeRating();
    }
    // riders inherit the car transform
    this.updateRiders();
    Cam.update(dt);
    if (Cam.mode === 'ride') this.updateRideCam(dt);
    else {
      // keyboard panning
      let f = 0, r = 0;
      if (this.keys['w'] || this.keys['arrowup']) f += 1;
      if (this.keys['s'] || this.keys['arrowdown']) f -= 1;
      if (this.keys['a'] || this.keys['arrowleft']) r -= 1;
      if (this.keys['d'] || this.keys['arrowright']) r += 1;
      if (f || r) Cam.moveRelative(f, r, dt);
      Cam.ty = damp(Cam.ty, WORLD.hAt(Cam.dx, Cam.dz), 2.2, dt);
    }
    Audio.setCrowd(Math.min(.09, Park.guests.length * .0007));
    if (this.selected && (this.selected instanceof Person) && Park.now - (this._insT || 0) > .4) {
      this._insT = Park.now; UI.inspect(this.selected);
    }
    this.autosaveT += dt;
    if (this.autosaveT > 120) { this.autosaveT = 0; this.save(true); }
  },
  updateRiders() {
    for (const c of Park.coasters) {
      for (const tr of c.trains) {
        if (!tr.riders.length) continue;
        const seatsPerCar = c.type.seat;
        for (let k = 0; k < tr.riders.length; k++) {
          const g = tr.riders[k];
          const ci = Math.min(tr.cars.length - 1, Math.floor(k / seatsPerCar));
          const si = k % seatsPerCar;
          const m = tr.cars[ci].m;
          const inverted = c.type.style === 'inverted';
          const lx = (si % 2 ? .42 : -.42), ly = inverted ? -1.62 : .22, lz = (si < 2 ? -.72 : .78);
          g.x = m[0] * lx + m[4] * ly + m[8] * lz + m[12];
          g.y = m[1] * lx + m[5] * ly + m[9] * lz + m[13];
          g.z = m[2] * lx + m[6] * ly + m[10] * lz + m[14];
          // face along the track and roll with the car, so riders stay in their seats
          g.yaw = Math.atan2(m[10], m[8]);
          g.roll = -Math.atan2(m[4], m[5]);
          g.pitchRide = Math.asin(clamp(m[9], -1, 1));
          g.moving = false;
          g.state = 'riding';
          g.armLift = clamp((tr.v - 11) / 20, 0, 1);
        }
      }
    }
    for (const o of Park.objects) {
      if (o.kind !== 'ride' || !o.riders.length) continue;
      const n = o.riders.length;
      for (let k = 0; k < n; k++) this.seatRider(o, o.riders[k], k, n);
    }
  },

  /* Put a rider where the ride's own geometry says the seats are, so you can
     watch them go round rather than float in the middle. */
  seatRider(o, g, k, n) {
    const kind = o.def.kind;
    const spin = o.spin || 0, h = o.h || 0;
    let rad = Math.min(o.gw, o.gd) * TILE * .3, y = 1.6, a = (k / n) * TAU + spin, roll = 0, faceOut = true;
    switch (kind) {
      case 'carousel': { const ring = 12; a = ((k % ring) / ring) * TAU + spin; rad = 4.6; y = 2.0 + Math.sin(spin * 2 + k) * .35; break; }
      case 'ferris': {
        const g12 = 12, idx = k % g12, ang = spin + idx / g12 * TAU;
        const R0 = 11;
        g.x = o.x + Math.cos(-o.rot * PI / 2) * 0 + (Math.cos(ang) * R0) * Math.cos(-o.rot * PI / 2);
        g.z = o.z + (Math.cos(ang) * R0) * Math.sin(-o.rot * PI / 2) + (k % 2 ? .5 : -.5);
        g.y = o.y + R0 + .7 + Math.sin(ang) * R0 - 1.5;
        g.yaw = -o.rot * PI / 2; g.roll = 0; g.moving = false; g.state = 'riding';
        return;
      }
      case 'drop': { rad = 2.4; y = 1.4 + h * 31; a = (k / n) * TAU + spin * .2; break; }
      case 'tower': { rad = 3.4; y = 2.4 + h * 24; a = (k / n) * TAU + spin * .5; break; }
      case 'swing': { rad = 7.7; y = 3.0 + h * 5 + 8 - 5.6; a = (k / n) * TAU + spin; roll = -0.35; break; }
      case 'teacup': { const cups = 4, ci = k % cups; a = ci / cups * TAU + spin; rad = 3.2; y = 1.9; break; }
      case 'pirate': { rad = 0; y = 12 - Math.cos(spin) * 11 + 1.2; break; }
      case 'bumper': { const ph = (k / n) * TAU; a = Park.now * .8 + ph; rad = 4.2 + Math.sin(Park.now * 1.7 + k) * 2.0; y = 1.2; break; }
      case 'enterprise': { const ring = 16; a = ((k % ring) / ring) * TAU; rad = 9; y = 9.6 + Math.sin(a) * 9 * Math.cos(h * 1.15); roll = -h; break; }
      case 'topspin': { rad = 0; y = 8 - Math.cos(spin * .7 * 2.6) * 3.4; roll = spin * .9; break; }
      case 'frisbee': { const ring = 16; a = ((k % ring) / ring) * TAU + spin * 1.6; rad = 4.0; y = 16 - 12.4 + Math.sin(Park.now * 1.05) * (0.25 + h * 1.15) * 4; break; }
      case 'gravitron': { const ring = 16; a = ((k % ring) / ring) * TAU + spin * 2.2; rad = 4.6; y = 3.0 + h * 1.2; break; }
      case 'balloonride': { const ring = 8; a = ((k % ring) / ring) * TAU + spin; rad = 5.2; y = 7.4 - (1 - h) * 1.6 - 5.0 + .6; break; }
      case 'rapids': { const boats = 5, bi = k % boats; a = Park.now * .55 + bi / boats * TAU; rad = 5.2; y = 2.0; break; }
      case 'haunted': { rad = 6; a = Park.now * .5 + (k / n) * TAU; y = 1.2; break; }
    }
    const cx = Math.cos(a) * rad, cz = Math.sin(a) * rad;
    g.x = o.x + cx; g.z = o.z + cz;
    g.y = o.y + y;
    g.yaw = faceOut ? -a + PI / 2 : -a;
    g.roll = roll;
    g.moving = false;
    g.state = 'riding';
  },
  updateRideCam(dt) {
    const c = this.rideCamTarget;
    if (!c || !c.trains.length) { this.exitRideCam(); return; }
    const tr = c.trains[0];
    const car = tr.cars[Math.min(this.rideCamCar, tr.cars.length - 1)];
    const m = car.m;
    const fx = m[8], fy = m[9], fz = m[10];
    const ux = m[4], uy = m[5], uz = m[6];
    // 0 = chase camera above and behind the train, 1 = front-seat view
    const chase = (this.rideCamMode || 0) === 0;
    const up = chase ? 4.4 : 2.2;
    const back = chase ? -8.5 : 1.1;
    Cam.ridePos.x = m[12] + ux * up + fx * back;
    Cam.ridePos.y = m[13] + uy * up + fy * back;
    Cam.ridePos.z = m[14] + uz * up + fz * back;
    const lookAhead = chase ? 14 : 12, lookDown = chase ? -2.2 : 0;
    Cam.rideLook.x = Cam.ridePos.x + fx * lookAhead + ux * lookDown;
    Cam.rideLook.y = Cam.ridePos.y + fy * lookAhead + uy * lookDown;
    Cam.rideLook.z = Cam.ridePos.z + fz * lookAhead + uz * lookDown;
    V3.set(Cam.rideUp, ux, uy, uz);
    Cam.fov = lerp(52, 76, clamp(tr.v / 45, 0, 1)) * DEG;
    Cam.shake = clamp(tr.v / 40, 0, 1) * 1.2;
    const g = tr.g || 1;
    $('#rcSpd').textContent = Math.round(tr.v * 3.6);
    $('#gLab').textContent = g.toFixed(1) + ' G';
    const f = $('#gFill');
    const pct = clamp(Math.abs(g) / 5 * 50, 0, 50);
    if (g >= 0) { f.style.bottom = '50%'; f.style.top = ''; f.style.height = pct + '%'; }
    else { f.style.top = '50%'; f.style.bottom = ''; f.style.height = pct + '%'; }
    Audio.setRumble(clamp(tr.v / 60, 0, 1) * .28);
    if (tr.v > 22 && Math.random() < dt * 1.6) Audio.play('scream');
  },
  spawnGuests(dt) {
    const hour = Park.time / 60;
    if (hour < 8 || hour > 21) return;
    if (Park.guests.length >= Park.maxGuests) return;
    const attract = Park.rating * .55 + Park.attractions().length * 2.4 + Park.marketing * 4;
    const feeFactor = clamp(1.4 - Park.entryFee / (14 + Park.rating * .5), .05, 1.6);
    const daily = Math.sin(clamp((hour - 8) / 13, 0, 1) * PI) * 1.5;
    const rate = attract * feeFactor * daily * .012;
    this._spawnAcc = (this._spawnAcc || 0) + rate * dt;
    while (this._spawnAcc >= 1) {
      this._spawnAcc -= 1;
      this.spawnGuest();
    }
  },
  spawnGuest() {
    const c = N >> 1;
    const x = WORLD.wx(c + rndi(-2, 2)), z = WORLD.wz(c + 20);
    const g = new Guest(x, z);
    if (Park.entryFee > g.cash) return;
    g.cash -= Park.entryFee;
    Park.earn(Park.entryFee, 'entry');
    Park.totalGuests++;
    const tgt = { x: WORLD.wx(c), z: WORLD.wz(c + 8) };
    g.goto(tgt.x, tgt.z);
    g.state = 'arriving';
    Park.guests.push(g);
  },
  hourTick() {
    const wages = Park.staff.reduce((a, s) => a + s.wage, 0);
    let upkeep = 0;
    for (const o of Park.objects) upkeep += (o.def.up || 0);
    for (const c of Park.coasters) upkeep += 30 + (c.track ? c.track.length * .08 : 0);
    Park.money -= wages + upkeep;
    Park.log.wage += wages; Park.log.upkeep += upkeep;
    const income = Park.log.ticket + Park.log.shop + Park.log.entry;
    Park.profitPerHour = (income - (Park.lastIncome || 0)) - wages - upkeep;
    Park.lastIncome = income;
    Park.hist.push({ t: Park.day * 24 + Park.time / 60, money: Park.money, guests: Park.guests.length, rating: Park.rating });
    if (Park.hist.length > 400) Park.hist.shift();
    if (Park.money < 0 && !this._brokeWarn) {
      this._brokeWarn = true;
      UI.notify('In the red', 'Your park is losing money. Raise prices or close costly rides.', 'bad');
      setTimeout(() => this._brokeWarn = false, 30000);
    }
  },
  dayTick() {
    UI.notify('A new day', `Day ${Park.day} begins. Rating ${Park.rating}, ${Park.guests.length} guests still in the park.`, 'good');
    // rides recover a little, litter accumulates
    for (const o of Park.objects) if (o.kind === 'ride') o.wear = Math.max(0, o.wear - .02);
    if (Park.rating > 700 && !Park.awards.includes('best')) {
      Park.awards.push('best');
      UI.notify('Award won', 'Your park has been voted Best Theme Park of the Year. Bonus ' + money(25000) + '.', 'money');
      Park.money += 25000;
    }
  },

  /* ---------------- save / load ---------------- */
  save(silent) {
    try {
      const d = {
        v: 3, money: Park.money, time: Park.time, day: Park.day, fee: Park.entryFee,
        h: Array.from(WORLD.h).map(x => Math.round(x * 100) / 100),
        t: Array.from(WORLD.type),
        objs: Park.objects.map(o => ({ k: o.kind, d: o.def.id, i: o.i, j: o.j, r: o.rot, p: o.price, open: o.openR })),
        cos: Park.coasters.map(c => ({
          t: c.type.id, i: c.i, j: c.j, r: c.rot, pieces: c.track.pieces, done: c.track.complete,
          price: c.price, open: c.openR, name: c.name, se: c.track.stationEnd, trains: c.trains.length
        })),
        staff: Park.staff.map(s => ({ r: s.role, x: s.x, z: s.z })),
        land: Array.from(Land.ownedPlots), bought: Land.bought,
        log: Park.log
      };
      localStorage.setItem('planetcoaster_save', JSON.stringify(d));
      if (!silent) UI.notify('Saved', 'Park written to browser storage.', 'good');
    } catch (e) { UI.notify('Save failed', String(e), 'bad'); }
  },
  load() {
    const raw = localStorage.getItem('planetcoaster_save');
    if (!raw) { UI.notify('No save', 'Nothing stored yet.', 'warn'); return; }
    try {
      const d = JSON.parse(raw);
      for (const o of Park.objects) if (o.mesh) o.mesh.dispose();
      for (const c of Park.coasters) { if (c.trackMesh) c.trackMesh.dispose(); if (c.stationMesh) c.stationMesh.dispose(); }
      Park.objects.length = 0; Park.coasters.length = 0; Park.guests.length = 0; Park.staff.length = 0; Park.litter.length = 0;
      WORLD.h.set(d.h); WORLD.type.set(d.t); WORLD.own.fill(-1);
      if (d.land && d.land.length === Land.ownedPlots.length) {
        Land.ownedPlots.set(d.land); Land.bought = d.bought || 0;
        WORLD.land.fill(0);
        for (let pj = 0; pj < PLOTS; pj++) for (let pi = 0; pi < PLOTS; pi++)
          if (Land.owns(pi, pj))
            for (let j = pj * PLOT; j < Math.min(N, (pj + 1) * PLOT); j++)
              for (let i = pi * PLOT; i < Math.min(N, (pi + 1) * PLOT); i++) WORLD.land[j * N + i] = 1;
      }
      Park.money = d.money; Park.time = d.time; Park.day = d.day; Park.entryFee = d.fee;
      Park.log = d.log || Park.log;
      for (const s of d.objs) {
        let def, o;
        if (s.k === 'shop') { def = CAT.shops.find(x => x.id === s.d); o = new Shop(def, s.i, s.j, s.r); }
        else if (s.k === 'ride') { def = CAT.rides.find(x => x.id === s.d); o = new Ride(def, s.i, s.j, s.r); }
        else { def = CAT.scenery.find(x => x.id === s.d); o = new ParkObject('scenery', def, s.i, s.j, s.r); o.seed = 1; }
        if (!def) continue;
        o.y = WORLD.tileH(s.i, s.j); o.updateMatrix();
        if (s.p !== undefined) o.price = s.p;
        if (s.open !== undefined) o.openR = s.open;
        if (s.k === 'scenery') { Park.objects.push(o); o.footprint((i, j) => WORLD.setOwn(i, j, o.id)); }
        else Park.addObject(o);
      }
      for (const s of d.cos) {
        const type = CAT.coasterTypes.find(x => x.id === s.t);
        const c = new CoasterRide(type, s.i, s.j, s.r);
        c.y = WORLD.tileH(s.i, s.j); c.updateMatrix();
        const a = -s.r * PI / 2, yaw = a - PI / 2;
        c.track = new Track(type, c.x - Math.cos(yaw) * 9, c.y + 1.2, c.z - Math.sin(yaw) * 9, yaw);
        for (const p of s.pieces) c.track.addPiece(p);
        c.track.stationEnd = s.se || 24;
        c.track.complete = s.done;
        c.name = s.name; c.price = s.price;
        c.stationMesh = this.R.makeMesh(Coaster.stationGeo(c));
        c.trackMesh = this.R.makeMesh(buildTrackGeo(c.track));
        if (s.done) {
          c.computeStats(); c.spawnTrains(s.trains || 1);
          c.carMesh = this.R.makeMesh(buildCarGeo(type, false));
          c.frontMesh = this.R.makeMesh(buildCarGeo(type, true));
          c.openR = s.open; c.state = s.open ? 'open' : 'closed';
        }
        Park.coasters.push(c);
        c.footprint((i, j) => { WORLD.setT(i, j, T_BUILD); WORLD.setOwn(i, j, c.id); });
      }
      for (const s of d.staff || []) Park.staff.push(new Staff(s.r, s.x, s.z));
      WORLD.dirty = true; Path.dirty = true; this.sceneryDirty = true; Park.litterDirty = true;
      UI.notify('Loaded', 'Park restored.', 'good');
    } catch (e) { UI.notify('Load failed', String(e), 'bad'); }
  }
};
/* ============================================================================
   SECTION 21 — RENDERING
   ========================================================================== */
Object.assign(Game, {
  rebuildScenery() {
    const g = new Geo();
    const anim = [];
    for (const o of Park.objects) {
      if (o.kind !== 'scenery') continue;
      const pf = PF.sceneryGeo(o.def, o.seed || 0);
      const m = M4.compose(M4.create(), o.x, o.y, o.z, 0, -o.rot * PI / 2, 0, 1, 1, 1);
      g.mergeM(pf.base, m);
      if (pf.parts.length) anim.push({ o, parts: pf.parts });
    }
    if (this.sceneryMesh) this.sceneryMesh.dispose();
    this.sceneryMesh = this.R.makeMesh(g);
    this.animScenery = anim;
    // cache meshes for animated scenery parts
    for (const a of anim) for (const p of a.parts) {
      if (!p._mesh) p._mesh = this.R.makeMesh(p.geo);
    }
    this.sceneryDirty = false;
  },
  rebuildLitter() {
    const g = new Geo();
    for (const l of Park.litter) {
      const m = M4.compose(M4.create(), l.x, WORLD.hAt(l.x, l.z) + .02, l.z, 0, (l.x * 3.1 + l.z) % TAU, 0, 1, 1, 1);
      g.mergeM(this.litterGeos[l.k] || this.litterGeos[0], m);
    }
    if (this.litterMesh) this.litterMesh.dispose();
    this.litterMesh = this.R.makeMesh(g);
    Park.litterDirty = false;
  },
  rebuildQueues() {
    const g = new Geo();
    const rail = Prefab.queueRail();
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      if (WORLD.type[j * N + i] !== T_QUEUE) continue;
      const x = WORLD.wx(i), z = WORLD.wz(j), y = WORLD.tileH(i, j);
      const horiz = WORLD.t(i - 1, j) === T_QUEUE || WORLD.t(i + 1, j) === T_QUEUE;
      const m = M4.compose(M4.create(), x, y, z, 0, horiz ? PI / 2 : 0, 0, 1, 1, 1);
      g.mergeM(rail, m);
    }
    if (this.queueMesh) this.queueMesh.dispose();
    this.queueMesh = this.R.makeMesh(g);
    this.queueDirty = false;
  },

  /* Placement ghost for shops / rides / scenery */
  updatePlaceGhost() {
    // the coaster station gets the same preview treatment as everything else
    if (Coaster.placing && this.hoverTile && Cam.mode !== 'ride') {
      const a = this.anchorTile({ w: 4, d: 3 }, UI.rot);
      const why = this.blockReason({ cost: 6000 }, a.i, a.j, a.gw, a.gd, false);
      this.ghostOK = !why;
      if (why !== this._lastWhy) {
        this._lastWhy = why;
        UI.hint(why ? '<b style="color:#ff8f8f">' + why.charAt(0).toUpperCase() + why.slice(1) + '</b>'
          : 'Click to drop the <b>station</b> &middot; <kbd>R</kbd> rotate &middot; <kbd>Esc</kbd> cancel', true);
      }
      let y = -1e9;
      for (let jj = a.j; jj < a.j + a.gd; jj++) for (let ii = a.i; ii < a.i + a.gw; ii++) if (WORLD.inb(ii, jj)) y = Math.max(y, WORLD.tileH(ii, jj));
      if (y < -1e8) y = 0;
      const x = WORLD.wx(a.i) + (a.gw - 1) * TILE / 2, z = WORLD.wz(a.j) + (a.gd - 1) * TILE / 2;
      if (!this._stationGhost || this._stationGhostType !== Coaster.placing.id) {
        this._stationGhostType = Coaster.placing.id;
        if (this._stationGhost) this._stationGhost.dispose();
        this._stationGhost = this.R.makeMesh(Coaster.stationGeo({ gw: 4, gd: 3, type: Coaster.placing }));
      }
      this.ghostObj = { pf: { mesh: this._stationGhost }, m: M4.compose(M4.create(), x, y, z, 0, -UI.rot * PI / 2, 0, 1, 1, 1) };
      this.buildFootprint(a.i, a.j, a.gw, a.gd, false);
      return;
    }
    const p = this.placementDef();
    if (!p || !this.hoverTile || Cam.mode === 'ride') { this.ghostObj = null; this._fpKey = null; this._lastWhy = undefined; return; }
    const a = this.anchorTile(p.def, UI.rot);
    const { i, j, gw, gd } = a;
    const allowPath = p.kind === 'scenery' && ['bench', 'bin', 'lamp', 'speaker', 'statue', 'topiary', 'lights', 'banner'].includes(p.def.kind);
    const why = this.blockReason(p.def, i, j, gw, gd, allowPath);
    this.ghostOK = !why;
    if (why !== this._lastWhy) {
      this._lastWhy = why;
      UI.hint(why ? '<b style="color:#ff8f8f">' + why.charAt(0).toUpperCase() + why.slice(1) + '</b>'
        : 'Click to place <b>' + p.def.name + '</b> &middot; <kbd>R</kbd> rotate &middot; <kbd>Esc</kbd> cancel', true);
    }
    const x = WORLD.wx(i) + (gw - 1) * TILE / 2, z = WORLD.wz(j) + (gd - 1) * TILE / 2;
    let y = -1e9;
    for (let jj = j; jj < j + gd; jj++) for (let ii = i; ii < i + gw; ii++) if (WORLD.inb(ii, jj)) y = Math.max(y, WORLD.tileH(ii, jj));
    if (y < -1e8) y = 0;
    const pf = PF.ghost(p.kind, p.def);
    this.ghostObj = { pf, m: M4.compose(M4.create(), x, y, z, 0, -UI.rot * PI / 2, 0, 1, 1, 1) };
    this.buildFootprint(i, j, gw, gd, allowPath);
  },

  /* A tile-by-tile grid under the ghost: green where it can sit, red where it cannot. */
  buildFootprint(i0, j0, gw, gd, allowPath) {
    const key = i0 + ',' + j0 + ',' + gw + ',' + gd + ',' + (this.ghostOK ? 1 : 0);
    if (key === this._fpKey) return;
    this._fpKey = key;
    const g = new Geo();
    for (let j = j0; j < j0 + gd; j++) for (let i = i0; i < i0 + gw; i++) {
      let ok = WORLD.inb(i, j) && WORLD.land[j * N + i] === 1;
      if (ok) {
        const t = WORLD.type[j * N + i];
        if (t === T_BUILD || t === T_QUEUE) ok = false;
        else if (!allowPath && (t === T_PATH || t === T_PLAZA || t === T_ENTRY)) ok = false;
        else if (Math.abs(WORLD.tileH(i, j)) > 3.2) ok = false;
      }
      const c = ok ? [.35, 1, .55] : [1, .32, .32];
      const y = (WORLD.inb(i, j) ? WORLD.tileH(i, j) : 0) + .10;
      const x = WORLD.wx(i), z = WORLD.wz(j), h = TILE / 2 - .16;
      g.quadV([x - h, y, z + h], [x + h, y, z + h], [x + h, y, z - h], [x - h, y, z - h], [c[0] * .35, c[1] * .35, c[2] * .35]);
      for (const [dx, dz] of [[0, -1], [0, 1], [-1, 0], [1, 0]])
        g.box(x + dx * h, y, z + dz * h, dx ? .18 : TILE - .3, .07, dz ? .18 : TILE - .3, c);
    }
    if (this.footprintMesh) this.footprintMesh.dispose();
    this.footprintMesh = this.R.makeMesh(g);
  },

  /* Fill the instance buffer with every visible person */
  buildCrowd() {
    const buf = this.crowdBuf;
    let o = 0;
    const t = Park.now;
    const maxParts = buf.length / INST_STRIDE;
    const cx = Cam.eye.x, cz = Cam.eye.z;
    const people = [];
    for (const g of Park.guests) people.push(g);
    for (const s of Park.staff) people.push(s);
    // nearest-first so the cap drops distant people, not random ones
    if (people.length * BODY_PARTS > maxParts) {
      people.sort((a, b) => dist2(a.x, a.z, cx, cz) - dist2(b.x, b.z, cx, cz));
    }
    for (const p of people) {
      if (o + BODY_PARTS * INST_STRIDE > buf.length) break;
      const d2 = dist2(p.x, p.z, cx, cz);
      if (d2 > 62000) continue;
      o = p.writeInstances(buf, o, t);
    }
    this.crowdCount = o / INST_STRIDE;
    if (this.crowdCount) this.crowdMesh.setInstances(buf.subarray(0, o), this.crowdCount);
    else this.crowdMesh.instCount = 0;
  },

  /* Everything that casts a shadow / is drawn in the main pass */
  drawScene(R, depthPass) {
    R.draw(WORLD.mesh);
    R.draw(WORLD.propMesh);
    if (this.sceneryMesh) R.draw(this.sceneryMesh, null, (!depthPass && this.nightGlow) ? { emissive: this.nightGlow * .30 } : null);
    if (this.queueMesh) R.draw(this.queueMesh);
    if (!depthPass && this.litterMesh) R.draw(this.litterMesh);

    const t = Park.now;
    const glow = depthPass ? 0 : (this.nightGlow || 0);
    for (const o of Park.objects) {
      if (o.kind === 'shop') {
        const pf = PF.shop(o.def);
        R.draw(pf.mesh, o.matrix, glow ? { emissive: glow * .45 } : null);
      } else if (o.kind === 'ride') {
        const pf = PF.ride(o.def);
        R.draw(pf.mesh, o.matrix, glow ? { emissive: glow * .40 } : null);
        const tmp = M4.create(), out = M4.create();
        for (const part of pf.parts) {
          part.anim(tmp, o, t);
          M4.mul(out, o.matrix, tmp);
          R.draw(part.mesh, out);
        }
      }
    }
    if (this.animScenery) {
      const tmp = M4.create(), out = M4.create();
      for (const a of this.animScenery) {
        const m = M4.compose(M4.create(), a.o.x, a.o.y, a.o.z, 0, -a.o.rot * PI / 2, 0, 1, 1, 1);
        for (const p of a.parts) { p.anim(tmp, a.o, t); M4.mul(out, m, tmp); R.draw(p._mesh, out); }
      }
    }
    for (const c of Park.coasters) {
      if (c.stationMesh) R.draw(c.stationMesh, c.matrix);
      if (c.trackMesh) R.draw(c.trackMesh);
      if (c.track && c.track.complete && c.carMesh) {
        for (const tr of c.trains) {
          for (let k = 0; k < tr.cars.length; k++) {
            R.draw(k === 0 ? c.frontMesh : c.carMesh, tr.cars[k].m);
          }
        }
      }
    }
  },

  render() {
    const R = this.R;
    // ---- time of day ----
    const hour = Park.time / 60;
    const dayT = clamp((hour - 5) / 14, 0, 1);          // 05:00 → 19:00
    const sunAng = (hour / 24) * TAU - PI / 2;
    const elev = Math.sin((hour - 6) / 12 * PI);
    const night = clamp(-elev * 2.2, 0, 1);
    const dawn = clamp(1 - Math.abs(hour - 6.8) / 1.8, 0, 1) + clamp(1 - Math.abs(hour - 18.6) / 2.0, 0, 1);
    V3.set(R.sun.dir, Math.cos(sunAng) * .55, Math.max(.06, elev), Math.sin(sunAng) * .35);
    V3.norm(R.sun.dir, R.sun.dir);
    const warm = clamp(dawn, 0, 1);
    R.sun.col = [
      lerp(lerp(1.0, 1.0, warm), 0.30, night),
      lerp(lerp(0.96, 0.72, warm), 0.34, night),
      lerp(lerp(0.88, 0.48, warm), 0.52, night)];
    R.sky = [lerp(.34, .13, night), lerp(.44, .15, night), lerp(.58, .24, night)];
    R.gnd = [lerp(.20, .09, night), lerp(.19, .08, night), lerp(.16, .10, night)];
    this.nightGlow = night;
    const skyTop = [lerp(.16, .02, night), lerp(.42, .04, night), lerp(.86, .12, night)];
    const skyMid = [lerp(.52, .05, night) + warm * .28, lerp(.72, .07, night) + warm * .10, lerp(.96, .17, night)];
    const skyBot = [lerp(.82, .09, night) + warm * .18, lerp(.88, .10, night) - warm * .10, lerp(.98, .18, night) - warm * .22];
    R.fogCol = [lerp(skyBot[0], skyMid[0], .5), lerp(skyBot[1], skyMid[1], .5), lerp(skyBot[2], skyMid[2], .5)];
    R.fogDens = 0.0022 + night * 0.0016;

    Cam.apply(R);

    // ---- shadow pass ----
    const shX = Cam.mode === 'orbit' ? Cam.dx : Cam.look.x;
    const shZ = Cam.mode === 'orbit' ? Cam.dz : Cam.look.z;
    R.setSunMatrix(shX, shZ, clamp(Cam.mode === 'orbit' ? Cam.dist * 1.5 : 90, 60, 190));
    R.beginShadow();
    R.useProgram(R.progDep, true);
    this.drawScene(R, true);
    if (this.crowdCount) { R.useProgram(R.progDepI, true); R.drawInstanced(this.crowdMesh); }
    R.endShadow();

    // ---- main pass, rendered offscreen so it can be graded ----
    const posted = R.beginPost();
    R.clearMain();
    const sp = R.projectToScreen(Cam.eye.x + R.sun.dir.x * 300, Cam.eye.y + R.sun.dir.y * 300, Cam.eye.z + R.sun.dir.z * 300);
    const onScreen = sp.z > 0;
    R.drawSky(skyTop, skyMid, skyBot,
      [onScreen ? sp.x * .5 + .5 : -5, onScreen ? sp.y * .5 + .5 : -5],
      clamp(elev * 2 + .2, 0, 1),
      night,
      night > .5 ? [.7, .78, .95] : [1, .92, .72]);

    R.useProgram(R.progMain, false);
    this.drawScene(R, false);
    R.draw(WORLD.waterMesh, null, { alpha: 1, emissive: .18 });

    // selection highlight
    if (this.selected && this.selected.matrix) {
      // (drawn as a subtle emissive re-draw)
      const o = this.selected;
      if (o.kind === 'shop') R.draw(PF.shop(o.def).mesh, o.matrix, { emissive: .35 + Math.sin(Park.now * 6) * .12, tint: [1.2, 1.3, 1.5] });
      else if (o.kind === 'ride') R.draw(PF.ride(o.def).mesh, o.matrix, { emissive: .35 + Math.sin(Park.now * 6) * .12, tint: [1.2, 1.3, 1.5] });
    }

    // placement ghost — drawn solid so complex rides stay readable
    if (this.ghostObj) {
      const gl = R.gl;
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      if (this.footprintMesh) { gl.depthMask(false); R.draw(this.footprintMesh, null, { alpha: .8, emissive: .95 }); gl.depthMask(true); }
      R.draw(this.ghostObj.pf.mesh, this.ghostObj.m, {
        alpha: .92, emissive: .30,
        tint: this.ghostOK ? [.62, 1.25, .82] : [1.45, .55, .55]
      });
      gl.disable(gl.BLEND);
    }
    // coaster ghost piece
    if (Coaster.ghostMesh) {
      const gl = R.gl;
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
      R.draw(Coaster.ghostMesh, null, { alpha: .62, emissive: .75 });
      gl.depthMask(true); gl.disable(gl.BLEND);
    }

    // ---- crowd ----
    if (this.crowdCount) { R.useProgram(R.progMainI, false); R.drawInstanced(this.crowdMesh); }

    if (posted) R.endPost(night);
  }
});

/* ============================================================================
   SECTION 22 — MAIN LOOP
   ========================================================================== */
let _last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - _last) / 1000);
  _last = now;

  Game.update(dt);

  if (WORLD.dirty) WORLD.buildMesh(Game.R);
  if (Path.dirty) { Path.rebuild(); Game.queueDirty = true; Park.mainSpot(); }
  if (Game.queueDirty) Game.rebuildQueues();
  if (Game.sceneryDirty) Game.rebuildScenery();
  if (Park.litterDirty) Game.rebuildLitter();
  if (Thumbs.warmQueue === null || Thumbs.warmQueue.length) Thumbs.warm(5);
  Game.updatePlaceGhost();
  Coaster.updateGhost(Game.R);
  Game.buildCrowd();
  Game.render();
  Minimap.draw(dt);

  UI.updateHUD();
  Game.fpsN++; Game.fpsT += dt;
  if (Game.fpsT > .5) {
    $('#fps').textContent = `${Math.round(Game.fpsN / Game.fpsT)} fps · ${Game.R.drawCalls} draws · ${(Game.R.tris / 1000).toFixed(0)}k tris · ${Park.guests.length} guests`;
    Game.fpsN = 0; Game.fpsT = 0;
  }
  requestAnimationFrame(frame);
}

window.addEventListener('load', () => {
  try {
    Audio.init();
    Game.init();
    requestAnimationFrame(frame);
  } catch (e) {
    $('#boot').innerHTML = `<h1 style="font-size:22px">Could not start</h1><div class="sub" style="max-width:520px;text-align:center;letter-spacing:0;text-transform:none">${e && e.message ? e.message : e}</div>`;
    console.error(e);
  }
});

</script>
</body>
