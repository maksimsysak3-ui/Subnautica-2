<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Planet Coaster — Park Architect</title>
<style>
/* ============================================================
   PLANET COASTER :: PARK ARCHITECT
   A single-file 3D theme park builder.
   Custom WebGL renderer, zero dependencies.
   ============================================================ */
:root{
  --bg:#0d1117;
  --panel:rgba(16,22,32,.88);
  --panel-solid:#121a26;
  --edge:rgba(255,255,255,.10);
  --edge-hot:rgba(120,200,255,.55);
  --txt:#dbe6f2;
  --dim:#8ea3ba;
  --accent:#39c0ff;
  --accent2:#7ef0c0;
  --warn:#ffb84d;
  --bad:#ff6b6b;
  --good:#6be675;
  --gold:#ffd76a;
  --shadow:0 10px 34px rgba(0,0,0,.55);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{
  font-family:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
  color:var(--txt);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  cursor:default;
}
canvas#gl{position:fixed;inset:0;display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
#ui > *{pointer-events:auto;}

/* ---------- generic chrome ---------- */
.panel{
  background:var(--panel);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--edge);
  border-radius:var(--r);
  box-shadow:var(--shadow);
}
.hdr{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;
  font-size:12px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
  color:var(--dim);
  border-bottom:1px solid var(--edge);
}
.hdr .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.hdr .x{margin-left:auto;cursor:pointer;color:var(--dim);line-height:1;padding:2px;border-radius:4px;display:flex}
.hdr .x:hover{color:#fff;background:rgba(255,255,255,.10)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2c3a4e transparent}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#2c3a4e;border-radius:6px;border:2px solid transparent;background-clip:padding-box}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- top status bar ---------- */
#topbar{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;gap:2px;
  padding:4px;
  font-variant-numeric:tabular-nums;
  z-index:20;
}
.stat{
  display:flex;align-items:center;gap:8px;
  padding:7px 13px;border-radius:8px;
  transition:background .15s;
  white-space:nowrap;
}
.stat:hover{background:rgba(255,255,255,.05)}
.stat .ico{display:flex;align-items:center;color:var(--dim)}
.ic{width:18px;height:18px;display:block;flex:0 0 auto}
.tool .ic{width:23px;height:23px}
.sbtn .ic{width:17px;height:17px}
.btn .ic{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:5px}
.item .th{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.55));transition:transform .16s}
.item:hover .th{transform:scale(1.08)}
.item.wide .th{aspect-ratio:16/11}
.pc img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.pc{padding:2px}
.thumbrow{display:flex;gap:9px;align-items:center}
.thumbrow img{width:52px;height:52px;object-fit:contain;flex:0 0 auto}
.stat .col{display:flex;flex-direction:column;line-height:1.15}
.stat .lbl{font-size:9px;letter-spacing:.10em;text-transform:uppercase;color:var(--dim)}
.stat .val{font-size:15px;font-weight:700}
.sep{width:1px;background:var(--edge);margin:6px 3px}
#vMoney{color:var(--gold)}
.flashGood{animation:fg .6s ease}
.flashBad{animation:fb .6s ease}
@keyframes fg{0%{color:var(--good);text-shadow:0 0 14px var(--good)}100%{}}
@keyframes fb{0%{color:var(--bad);text-shadow:0 0 14px var(--bad)}100%{}}

/* ---------- speed controls ---------- */
#speedbar{position:absolute;top:10px;right:10px;display:flex;gap:4px;padding:5px;align-items:center}
.sbtn{
  width:34px;height:32px;border-radius:8px;border:1px solid transparent;
  background:rgba(255,255,255,.05);color:var(--txt);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;transition:.13s;
}
.sbtn:hover{background:rgba(255,255,255,.13)}
.sbtn.on{background:linear-gradient(180deg,#2a9fd6,#1d7fb0);border-color:var(--edge-hot);color:#fff;box-shadow:0 0 14px rgba(57,192,255,.35)}

/* ---------- bottom toolbar ---------- */
#toolbar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:5px;padding:7px;
  z-index:20;
}
.tool{
  width:60px;height:58px;border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;transition:.14s;position:relative;
}
.tool:hover{background:rgba(255,255,255,.11);transform:translateY(-3px)}
.tool.on{background:linear-gradient(180deg,rgba(57,192,255,.30),rgba(57,192,255,.10));border-color:var(--edge-hot);box-shadow:0 0 18px rgba(57,192,255,.28)}
.tool .e{font-size:21px;line-height:1}
.tool .t{font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim)}
.tool.on .t{color:#dff3ff}
.tool .key{position:absolute;top:3px;right:5px;font-size:8px;color:#5f748c}

/* ---------- side build panel ---------- */
#buildPanel{
  position:absolute;left:12px;top:64px;bottom:88px;width:272px;
  display:none;flex-direction:column;
}
#buildPanel.show{display:flex}
#bpBody{flex:1;padding:9px;display:flex;flex-direction:column;gap:9px}
.cat{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:5px 0 -2px 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.item{
  background:rgba(255,255,255,.045);border:1px solid var(--edge);border-radius:9px;
  padding:9px 7px;cursor:pointer;transition:.13s;text-align:center;position:relative;overflow:hidden;
}
.item:hover{background:rgba(57,192,255,.15);border-color:var(--edge-hot);transform:translateY(-2px)}
.item.on{background:linear-gradient(180deg,rgba(57,192,255,.30),rgba(57,192,255,.08));border-color:var(--accent)}
.item .e{font-size:22px;display:block;line-height:1.15}
.item .n{display:block}
.item .n{font-size:10.5px;margin-top:3px;font-weight:600}
.item .c{display:block;font-size:9.5px;color:var(--gold);margin-top:1px;font-variant-numeric:tabular-nums;line-height:1.35}
.item.locked{opacity:.36;cursor:not-allowed}
.item.locked:hover{transform:none;background:rgba(255,255,255,.045);border-color:var(--edge)}

/* ---------- coaster editor ---------- */
#coasterPanel{
  position:absolute;right:12px;top:64px;width:326px;max-height:calc(100% - 168px);
  display:none;flex-direction:column;
}
#coasterPanel.show{display:flex}
#cpBody{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.piecegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{
  aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.05);
  border:1px solid var(--edge);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:19px;transition:.12s;position:relative;
}
.pc:hover{background:rgba(126,240,192,.18);border-color:var(--accent2);transform:scale(1.07)}
.pc.on{background:linear-gradient(180deg,rgba(126,240,192,.32),rgba(126,240,192,.08));border-color:var(--accent2)}
.pc .tip{
  position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
  background:#0a0f16;border:1px solid var(--edge);padding:3px 7px;border-radius:5px;
  font-size:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:9
}
.pc:hover .tip{opacity:1}
.row{display:flex;align-items:center;gap:8px;font-size:11.5px}
.row label{color:var(--dim);min-width:74px}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:3px;background:#26364a;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 9px rgba(57,192,255,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--accent);cursor:pointer}
.num{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent2);font-size:11px}
.btn{
  padding:8px 12px;border-radius:8px;border:1px solid var(--edge);
  background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;
  font-size:11.5px;font-weight:600;transition:.13s;text-align:center;flex:1;
  font-family:inherit;
}
.btn:hover{background:rgba(255,255,255,.14);border-color:var(--edge-hot)}
.btn.pri{background:linear-gradient(180deg,#2a9fd6,#1a6f9c);border-color:#3fb6ec;color:#fff}
.btn.pri:hover{background:linear-gradient(180deg,#37b4ee,#2183b4)}
.btn.go{background:linear-gradient(180deg,#33b06a,#1f7a48);border-color:#4ad48a;color:#fff}
.btn.go:hover{filter:brightness(1.15)}
.btn.dan{background:linear-gradient(180deg,#c04a4a,#8c2f2f);border-color:#e07070;color:#fff}
.btn.dan:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:6px}
.meterbox{display:flex;flex-direction:column;gap:5px;padding:9px;background:rgba(0,0,0,.28);border-radius:9px;border:1px solid var(--edge)}
.meter{display:flex;align-items:center;gap:7px;font-size:10.5px}
.meter .mn{min-width:64px;color:var(--dim)}
.meter .bar{flex:1;height:6px;background:#1b2635;border-radius:4px;overflow:hidden}
.meter .fill{height:100%;border-radius:4px;transition:width .35s ease}
.meter .mv{min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- inspector ---------- */
#inspector{position:absolute;right:12px;bottom:88px;width:262px;display:none;flex-direction:column}
#inspector.show{display:flex}
#insBody{padding:10px;display:flex;flex-direction:column;gap:8px;font-size:11.5px;max-height:400px;overflow-y:auto}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv .k{color:var(--dim)}
.kv .v{font-weight:600;text-align:right}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:9.5px;font-weight:700;letter-spacing:.05em}

/* ---------- notifications ---------- */
#notif{position:absolute;top:62px;right:12px;width:280px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.note{
  background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--accent);
  border-radius:9px;padding:9px 11px;font-size:11.5px;box-shadow:var(--shadow);
  animation:slidein .35s cubic-bezier(.2,1.2,.3,1);backdrop-filter:blur(12px);
}
.note.good{border-left-color:var(--good)}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.note.money{border-left-color:var(--gold)}
.note .nt{font-weight:700;margin-bottom:2px}
.note .nb{color:var(--dim);font-size:10.5px;line-height:1.4}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.note.out{animation:slideout .3s ease forwards}
@keyframes slideout{to{opacity:0;transform:translateX(40px);height:0;padding:0;margin:0}}

/* ---------- hint / status line ---------- */
#hint{
  position:absolute;bottom:84px;left:50%;transform:translateX(-50%);
  padding:7px 15px;border-radius:20px;font-size:11.5px;color:var(--dim);
  background:rgba(10,15,22,.75);border:1px solid var(--edge);
  white-space:nowrap;opacity:0;transition:opacity .25s;backdrop-filter:blur(8px);
}
#hint.show{opacity:1}
#hint b{color:var(--accent2)}
kbd{
  background:#1d2836;border:1px solid #33465e;border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-size:10px;font-family:inherit;color:#cfe3f5;margin:0 1px;
}

/* ---------- ride cam overlay ---------- */
/* the on-ride camera takes over the screen: hide the builder chrome */
body.ridemode #buildPanel,
body.ridemode #coasterPanel,
body.ridemode #inspector,
body.ridemode #toolbar,
body.ridemode #hint,
body.ridemode #minimap{display:none!important}
/* the inspector steps aside when the coaster editor is open */
#coasterPanel.show ~ #inspector{right:352px}
#ridecam{position:absolute;inset:0;display:none;pointer-events:none}
#ridecam.show{display:block}
#ridecam .vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(0,0,0,.65)}
#ridecam .gbar{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:8px;height:200px;background:rgba(0,0,0,.5);border-radius:5px;overflow:hidden;border:1px solid var(--edge)}
#ridecam .gfill{position:absolute;bottom:50%;left:0;width:100%;background:linear-gradient(0deg,#3ad07a,#ffd76a,#ff5b5b);transition:height .1s}
#ridecam .glab{position:absolute;left:40px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:700;text-shadow:0 2px 6px #000}
#ridecam .spd{position:absolute;right:30px;bottom:100px;text-align:right;text-shadow:0 2px 10px #000}
#ridecam .spd .n{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#ridecam .spd .u{font-size:12px;color:var(--dim);letter-spacing:.2em}
#ridecam .exit{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:12px;color:#cfe3f5;text-shadow:0 2px 6px #000;pointer-events:auto}

/* ---------- modal ---------- */
#modalWrap{position:absolute;inset:0;background:rgba(4,7,11,.72);display:none;align-items:center;justify-content:center;backdrop-filter:blur(5px);z-index:40}
#modalWrap.show{display:flex}
#modal{width:min(900px,94vw);max-height:88vh;display:flex;flex-direction:column}
#modalBody{padding:16px;overflow-y:auto;font-size:12.5px;line-height:1.6}
#modalBody h3{font-size:13px;color:var(--accent);margin:14px 0 6px;letter-spacing:.05em;text-transform:uppercase}
#modalBody h3:first-child{margin-top:0}
#modalBody p{color:#c3d3e4;margin-bottom:7px}
#modalBody ul{margin:0 0 9px 17px;color:#b7c8db}
#modalBody li{margin-bottom:3px}
#modalFoot{padding:11px;border-top:1px solid var(--edge);display:flex;gap:7px;justify-content:flex-end}
table.tb{width:100%;border-collapse:collapse;font-size:11.5px}
table.tb th{text-align:left;color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--edge);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
table.tb td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
table.tb tr:hover td{background:rgba(255,255,255,.04)}

/* ---------- loading ---------- */
#boot{position:fixed;inset:0;background:linear-gradient(160deg,#0a1220,#0d1117 60%,#131c2a);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .7s}
#boot.gone{opacity:0;pointer-events:none}
#boot h1{font-size:40px;font-weight:200;letter-spacing:.28em;text-transform:uppercase;background:linear-gradient(90deg,#39c0ff,#7ef0c0,#ffd76a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
#boot .sub{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);margin-bottom:28px}
#boot .bar{width:280px;height:3px;background:#1b2635;border-radius:3px;overflow:hidden}
#boot .bfill{height:100%;width:0;background:linear-gradient(90deg,#39c0ff,#7ef0c0);transition:width .2s;box-shadow:0 0 12px #39c0ff}
#boot .msg{margin-top:11px;font-size:10.5px;color:#5f748c;letter-spacing:.1em;height:14px}

/* ---------- minimap ---------- */
#minimap{position:absolute;left:12px;bottom:88px;width:150px;height:150px;padding:0;overflow:hidden;display:none}
#minimap.show{display:block}
#mmc{width:100%;height:100%;display:block;border-radius:11px}

#fps{position:absolute;left:12px;top:12px;font-size:10px;color:#4d6076;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="boot">
  <h1>Planet Coaster</h1>
  <div class="sub">Park Architect Edition</div>
  <div class="bar"><div class="bfill" id="bootBar"></div></div>
  <div class="msg" id="bootMsg">initialising renderer…</div>
</div>

<div id="ui">
  <div id="fps"></div>

  <div id="topbar" class="panel">
    <div class="stat"><span class="ico" data-ic="money"></span><span class="col"><span class="lbl">Funds</span><span class="val" id="vMoney">$0</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="guests"></span><span class="col"><span class="lbl">Guests</span><span class="val" id="vGuests">0</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="star"></span><span class="col"><span class="lbl">Rating</span><span class="val" id="vRating">0</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="smile"></span><span class="col"><span class="lbl">Happiness</span><span class="val" id="vHappy">0%</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="chart"></span><span class="col"><span class="lbl">Profit / hr</span><span class="val" id="vProfit">$0</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="land"></span><span class="col"><span class="lbl">Owned Land</span><span class="val" id="vLand">0</span></span></div>
    <div class="sep"></div>
    <div class="stat"><span class="ico" data-ic="clock"></span><span class="col"><span class="lbl">Park Time</span><span class="val" id="vTime">Day 1 · 09:00</span></span></div>
  </div>

  <div id="speedbar" class="panel">
    <div class="sbtn" id="spd0" title="Pause (Space)" data-ic="pause"></div>
    <div class="sbtn on" id="spd1" title="Normal speed" data-ic="play"></div>
    <div class="sbtn" id="spd2" title="Fast" data-ic="play2"></div>
    <div class="sbtn" id="spd3" title="Very fast" data-ic="play3"></div>
    <div class="sep"></div>
    <div class="sbtn" id="btnRotL" title="Rotate view left (Q)" data-ic="rotl"></div>
    <div class="sbtn" id="btnRotR" title="Rotate view right (E)" data-ic="rotr"></div>
    <div class="sbtn" id="btnTilt" title="Toggle overhead view (Z)" data-ic="tilt"></div>
    <div class="sep"></div>
    <div class="sbtn" id="btnLand" title="Buy land (L)" data-ic="land"></div>
    <div class="sbtn" id="btnMap" title="Minimap (M)" data-ic="map"></div>
    <div class="sbtn" id="btnFin" title="Park management (F)" data-ic="stats"></div>
    <div class="sbtn" id="btnHelp" title="Help (H)" data-ic="help"></div>
  </div>

  <div id="notif"></div>

  <div id="buildPanel" class="panel">
    <div class="hdr"><span class="dot"></span><span id="bpTitle">Build</span><span class="x" data-ic="close" onclick="UI.closeBuild()"></span></div>
    <div id="bpBody" class="scroll"></div>
  </div>

  <div id="coasterPanel" class="panel">
    <div class="hdr"><span class="dot"></span>Coaster Editor<span class="x" data-ic="close" onclick="Coaster.exit()"></span></div>
    <div id="cpBody" class="scroll"></div>
  </div>

  <div id="inspector" class="panel">
    <div class="hdr"><span class="dot"></span><span id="insTitle">Inspector</span><span class="x" data-ic="close" onclick="UI.closeInspector()"></span></div>
    <div id="insBody" class="scroll"></div>
  </div>

  <div id="minimap" class="panel"><canvas id="mmc" width="300" height="300"></canvas></div>

  <div id="hint"></div>

  <div id="toolbar" class="panel"></div>

  <div id="ridecam">
    <div class="vig"></div>
    <div class="gbar"><div class="gfill" id="gFill"></div></div>
    <div class="glab" id="gLab">0.0 G</div>
    <div class="spd"><div class="n" id="rcSpd">0</div><div class="u">KM / H</div></div>
    <div class="exit">On-Ride Camera — <kbd>Esc</kbd> exit · <kbd>C</kbd> chase / front seat</div>
  </div>

  <div id="modalWrap"><div id="modal" class="panel">
    <div class="hdr"><span class="dot"></span><span id="modalTitle">Info</span><span class="x" data-ic="close" onclick="UI.closeModal()"></span></div>
    <div id="modalBody" class="scroll"></div>
    <div id="modalFoot"><button class="btn pri" style="flex:0 0 auto;padding:8px 22px" onclick="UI.closeModal()">Close</button></div>
  </div></div>
</div>

<script>
"use strict";
/* ============================================================================
   SECTION 1 — MATH
   Minimal, allocation-conscious 3D math. Column-major matrices (GL order).
   ========================================================================== */
const PI = Math.PI, TAU = PI * 2, DEG = PI / 180;
const clamp = (v, a, b) => v >= a ? (v <= b ? v : b) : a;   // NaN-safe: falls through to `a`

      const nx = g.nrm[i], ny = g.nrm[i + 1], nz = g.nrm[i + 2];
      this.nrm.push(m[0] * nx + m[4] * ny + m[8] * nz, m[1] * nx + m[5] * ny + m[9] * nz, m[2] * nx + m[6] * ny + m[10] * nz);
    }
    for (let i = 0; i < g.col.length; i++) this.col.push(g.col[i]);
    for (let i = 0; i < g.idx.length; i++) this.idx.push(g.idx[i] + base);
    this.n += g.n;
    return this;
  }
}

/* ============================================================================
   SECTION 3 — WEBGL RENDERER
   Forward renderer: sun + hemisphere ambient, packed-RGBA shadow map,
   exponential height fog, instanced boxes for crowds, sky dome gradient.
   ========================================================================== */
const VS_COMMON = `
attribute vec3 aPos; attribute vec3 aNrm; attribute vec3 aCol;
#ifdef INST
attribute vec4 iM0; attribute vec4 iM1; attribute vec4 iM2; attribute vec4 iM3; attribute vec3 iCol;
#endif
uniform mat4 uVP, uModel, uLightVP;
varying vec3 vN, vC, vW; varying vec4 vLS;
void main(){
#ifdef INST
  mat4 M = mat4(iM0,iM1,iM2,iM3);
  vec4 w = M * vec4(aPos,1.0);
  vN = normalize(mat3(M) * aNrm);
  vC = aCol * iCol;
#else
  vec4 w = uModel * vec4(aPos,1.0);
  vN = normalize(mat3(uModel) * aNrm);
  vC = aCol;
#endif
  vW = w.xyz;
  vLS = uLightVP * w;
  gl_Position = uVP * w;
}`;

const FS_MAIN = `
precision highp float;
varying vec3 vN, vC, vW; varying vec4 vLS;
uniform vec3 uSunDir, uSunCol, uSkyCol, uGndCol, uFogCol, uTint;
uniform float uFogDens, uShadowOn, uAlpha, uEmissive, uTexel;
uniform sampler2D uShadow;
uniform vec3 uEye;

float unpack(vec4 c){ return dot(c, vec4(1.0, 1.0/255.0, 1.0/65025.0, 1.0/16581375.0)); }

float shadowAt(vec3 sc, float bias){
  if(sc.x<0.005||sc.x>0.995||sc.y<0.005||sc.y>0.995||sc.z>1.0) return 1.0;
  float s = 0.0;
  for(int i=-1;i<=1;i++){
    for(int j=-1;j<=1;j++){
      float d = unpack(texture2D(uShadow, sc.xy + vec2(float(i),float(j))*uTexel));
      s += step(sc.z - bias, d);
    }
  }
  return s/9.0;
}

void main(){
  vec3 N = normalize(vN);
  float ndl = dot(N, uSunDir);
  float diff = max(ndl, 0.0);
  float wrap = max((ndl+0.45)/1.45, 0.0);       // soft wrap term for toy-like shading
  float hemi = 0.5 + 0.5*N.y;
  vec3 amb = mix(uGndCol, uSkyCol, hemi);

  float sh = 1.0;
  if(uShadowOn > 0.5){
    vec3 sc = vLS.xyz/vLS.w * 0.5 + 0.5;
    float bias = max(0.0016*(1.0-ndl), 0.0006);
    sh = shadowAt(sc, bias);
    sh = mix(1.0, sh, clamp(ndl*3.0,0.0,1.0));
  }

  vec3 base = vC * uTint;
  vec3 lit = base * (amb + uSunCol * (diff*0.78 + wrap*0.30) * sh);

  // cheap specular sheen on upward faces (paint/metal feel)
  vec3 V = normalize(uEye - vW);
  vec3 H = normalize(V + uSunDir);
  float spec = pow(max(dot(N,H),0.0), 42.0) * 0.22 * sh;
  lit += uSunCol * spec;

  lit = mix(lit, base, uEmissive);

  float d = length(uEye - vW);
  float fog = 1.0 - exp(-pow(d*uFogDens, 2.0));
  fog *= clamp(1.0 - (vW.y-4.0)*0.012, 0.0, 1.0);
  lit = mix(lit, uFogCol, clamp(fog,0.0,1.0));

  gl_FragColor = vec4(lit, uAlpha);
}`;

const FS_DEPTH = `
precision highp float;
varying vec3 vN, vC, vW; varying vec4 vLS;
vec4 pack(float v){
  vec4 c = fract(v * vec4(1.0,255.0,65025.0,16581375.0));
  c -= c.yzww * vec4(1.0/255.0,1.0/255.0,1.0/255.0,0.0);
  return c;
}
void main(){ gl_FragColor = pack(gl_FragCoord.z); }`;

const VS_SKY = `
attribute vec2 aPos; varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.999,1.0); }`;
const FS_SKY = `
precision highp float; varying vec2 vUv;
uniform vec3 uTop,uMid,uBot,uSunCol; uniform vec2 uSunScreen; uniform float uSunUp,uStars,uAspect;
float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
void main(){
  float y = vUv.y;
  vec3 c = y > 0.5 ? mix(uMid,uTop,(y-0.5)*2.0) : mix(uBot,uMid,y*2.0);
  // stars at night
  if(uStars > 0.01){
    vec2 g = floor(vUv*vec2(220.0*uAspect,220.0));
    float r = h(g);
    if(r > 0.9975){
      float tw = 0.6+0.4*sin(r*90.0);
      c += vec3(0.85,0.9,1.0)*uStars*tw*smoothstep(0.15,0.6,y);
    }
  }
  // sun/moon glow
  vec2 d = (vUv - uSunScreen); d.x *= uAspect;
  float r = length(d);
  c += uSunCol * exp(-r*9.0) * 0.55 * uSunUp;
  c += uSunCol * exp(-r*140.0) * 1.6 * uSunUp;
  gl_FragColor = vec4(c,1.0);
}`;

const FS_POST = `
precision highp float; varying vec2 vUv;
uniform sampler2D uScene; uniform vec2 uPixel;
uniform float uVignette, uSat, uContrast, uLift, uNight;
void main(){
  vec3 c = texture2D(uScene, vUv).rgb;
  // gentle unsharp: sharpen the low-poly silhouettes without ringing
  vec3 blur = (texture2D(uScene, vUv + vec2(uPixel.x, 0.0)).rgb
             + texture2D(uScene, vUv - vec2(uPixel.x, 0.0)).rgb
             + texture2D(uScene, vUv + vec2(0.0, uPixel.y)).rgb
             + texture2D(uScene, vUv - vec2(0.0, uPixel.y)).rgb) * 0.25;
  c = clamp(c + (c - blur) * 0.35, 0.0, 2.0);
  // filmic-ish tone curve
  c = (c * (2.51 * c + 0.03)) / (c * (2.43 * c + 0.59) + 0.14);
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uSat);
  c = (c - 0.5) * uContrast + 0.5 + uLift;
  // cool the shadows a touch at night
  c = mix(c, c * vec3(0.82, 0.90, 1.12), uNight * 0.5);
  vec2 d = vUv - 0.5;
  float vig = 1.0 - dot(d, d) * uVignette;
  c *= vig;
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

class Renderer {
  constructor(canvas, cfg) {
    this.cv = canvas;
    this.cfg = cfg || {};
    const opts = { antialias: true, alpha: !!this.cfg.alpha, premultipliedAlpha: false, powerPreference: 'high-performance', stencil: false };
    let gl = canvas.getContext('webgl2', opts);
    this.gl2 = !!gl;
    if (!gl) gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) throw new Error('WebGL unavailable');
    this.gl = gl;
    if (!this.gl2) {
      this.extInst = gl.getExtension('ANGLE_instanced_arrays');
      if (!this.extInst) throw new Error('Instancing unsupported');
    }
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.clearColor(.05, .07, .1, 1);

    this.progMain = this.build(VS_COMMON, FS_MAIN, false);
    this.progMainI = this.build(VS_COMMON, FS_MAIN, true);
    this.progDep = this.build(VS_COMMON, FS_DEPTH, false);
    this.progDepI = this.build(VS_COMMON, FS_DEPTH, true);
    this.progSky = this.rawProg(VS_SKY, FS_SKY);
    this.skyBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.skyBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

    this.SHADOW = this.cfg.shadowSize || 1536;
    this.initShadow();
    if (!this.cfg.alpha) { this.progPost = this.rawProg(VS_SKY, FS_POST); this.initPost(); }

    this.vp = M4.create(); this.lightVP = M4.create();
    this.proj = M4.create(); this.view = M4.create();
    this.eye = V3.make();
    this.sun = { dir: V3.make(.5, .8, .35), col: [1, .96, .88] };
    this.sky = [.35, .6, .95]; this.gnd = [.22, .2, .18];
    this.fogCol = [.68, .78, .9]; this.fogDens = 0.0038;
    this.shadowOn = 1;
    this.drawCalls = 0; this.tris = 0;
  }
  build(vsSrc, fsSrc, inst) {
    const pre = inst ? '#define INST\n' : '';
    return this.rawProg(pre + vsSrc, fsSrc, inst);
  }
  rawProg(vs, fs, inst) {
    const gl = this.gl;
    const c = (t, s) => {
      const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
      if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh) + '\n' + s);
      return sh;
    };
    const p = gl.createProgram();
    gl.attachShader(p, c(gl.VERTEX_SHADER, vs)); gl.attachShader(p, c(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p.u = {}; p.a = {};
    const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < nu; i++) { const info = gl.getActiveUniform(p, i); p.u[info.name] = gl.getUniformLocation(p, info.name); }
    const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
    for (let i = 0; i < na; i++) { const info = gl.getActiveAttrib(p, i); p.a[info.name] = gl.getAttribLocation(p, info.name); }
    p.inst = !!inst;
    return p;
  }
  initShadow() {
    const gl = this.gl, S = this.SHADOW;
    this.shTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, this.shTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    this.shFbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.shFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.shTex, 0);
    this.shRb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, this.shRb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, S, S);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.shRb);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(innerWidth * dpr), h = Math.floor(innerHeight * dpr);
    if (this.cv.width !== w || this.cv.height !== h) { this.cv.width = w; this.cv.height = h; this.resizePost(w, h); }
    this.aspect = w / h;
  }
  /* Offscreen colour target so the frame can be graded before it is shown. */
  initPost() {
    const gl = this.gl;
    this.postTex = gl.createTexture();
    this.postFbo = gl.createFramebuffer();
    this.postRb = gl.createRenderbuffer();
    this.postW = 0; this.postH = 0;
  }
  resizePost(w, h) {
    if (!this.progPost) return;
    const gl = this.gl;
    if (this.postW === w && this.postH === h) return;
    this.postW = w; this.postH = h;
    gl.bindTexture(gl.TEXTURE_2D, this.postTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.postFbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, this.postTex, 0);
    gl.bindRenderbuffer(gl.RENDERBUFFER, this.postRb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, this.postRb);
    this.postOk = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  beginPost() {
    if (!this.progPost || !this.postOk) return false;
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, this.postFbo);
    gl.viewport(0, 0, this.postW, this.postH);
    return true;
  }
  endPost(night) {
    if (!this.progPost || !this.postOk) return;
    const gl = this.gl, p = this.progPost;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, this.cv.width, this.cv.height);
    gl.disable(gl.DEPTH_TEST);
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.skyBuf);
    gl.enableVertexAttribArray(p.a.aPos);
    gl.vertexAttribPointer(p.a.aPos, 2, gl.FLOAT, false, 0, 0);
    this.divisor(p.a.aPos, 0);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.postTex);
    gl.uniform1i(p.u.uScene, 0);
    gl.uniform2f(p.u.uPixel, 1 / this.postW, 1 / this.postH);
    gl.uniform1f(p.u.uVignette, 0.42);
    gl.uniform1f(p.u.uSat, 1.12);
    gl.uniform1f(p.u.uContrast, 1.06);
    gl.uniform1f(p.u.uLift, 0.008);
    gl.uniform1f(p.u.uNight, night || 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.DEPTH_TEST);
  }
  /* --- Mesh objects --- */
  makeMesh(geo) { const m = new Mesh(this.gl, this.gl2, this.extInst); m.upload(geo); return m; }
}

class Mesh {
  constructor(gl, gl2, ext) {
    this.gl = gl; this.gl2 = gl2; this.ext = ext;
    this.vb = gl.createBuffer(); this.nb = gl.createBuffer(); this.cb = gl.createBuffer(); this.ib = gl.createBuffer();
    this.count = 0; this.instBuf = null; this.instCount = 0;
    this.use32 = gl2 || !!gl.getExtension('OES_element_index_uint');
  }
  upload(geo, dynamic) {
    const gl = this.gl, u = dynamic ? gl.DYNAMIC_DRAW : gl.STATIC_DRAW;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geo.pos), u);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.nb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geo.nrm), u);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.cb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geo.col), u);
    const big = geo.n > 65535;
    this.idxType = (big && this.use32) ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
    const arr = this.idxType === gl.UNSIGNED_INT ? new Uint32Array(geo.idx) : new Uint16Array(geo.idx);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, arr, u);
    this.count = geo.idx.length;
    return this;
  }
  setInstances(f32, count) {
    const gl = this.gl;
    if (!this.instBuf) this.instBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, f32, gl.DYNAMIC_DRAW);
    this.instCount = count;
  }
  dispose() {
    const gl = this.gl;
    gl.deleteBuffer(this.vb); gl.deleteBuffer(this.nb); gl.deleteBuffer(this.cb); gl.deleteBuffer(this.ib);
    if (this.instBuf) gl.deleteBuffer(this.instBuf);
    this.count = 0;
  }
}

/* Instance layout: mat4 (16) + colour (3) = 19 floats, padded to 20 */
const INST_STRIDE = 20;
/* body parts per person written by Person.writeInstances */
const BODY_PARTS = 15;
/* ============================================================================
   SECTION 4 — DRAW PIPELINE
   ========================================================================== */
Renderer.prototype.bindMesh = function (p, mesh) {
  const gl = this.gl;
  const bind = (buf, loc, size) => {
    if (loc === undefined || loc < 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
    this.divisor(loc, 0);
  };
  bind(mesh.vb, p.a.aPos, 3);
  bind(mesh.nb, p.a.aNrm, 3);
  bind(mesh.cb, p.a.aCol, 3);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.ib);
};
Renderer.prototype.divisor = function (loc, d) {
  if (loc < 0) return;
  if (this.gl2) this.gl.vertexAttribDivisor(loc, d);
  else this.extInst.vertexAttribDivisorANGLE(loc, d);
};
Renderer.prototype.bindInstances = function (p, mesh) {
  const gl = this.gl, S = INST_STRIDE * 4;
  gl.bindBuffer(gl.ARRAY_BUFFER, mesh.instBuf);
  const names = ['iM0', 'iM1', 'iM2', 'iM3'];
  for (let i = 0; i < 4; i++) {
    const loc = p.a[names[i]]; if (loc === undefined || loc < 0) continue;
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, S, i * 16);
    this.divisor(loc, 1);
  }
  const lc = p.a.iCol;
  if (lc !== undefined && lc >= 0) {
    gl.enableVertexAttribArray(lc);
    gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, S, 64);
    this.divisor(lc, 1);
  }
};
Renderer.prototype.unbindInstances = function (p) {
  const gl = this.gl;
  ['iM0', 'iM1', 'iM2', 'iM3', 'iCol'].forEach(n => {
    const loc = p.a[n]; if (loc === undefined || loc < 0) return;
    this.divisor(loc, 0); gl.disableVertexAttribArray(loc);
  });
};
Renderer.prototype.useProgram = function (p, depthPass) {
  const gl = this.gl;
  gl.useProgram(p);
  this.cur = p;
  gl.uniformMatrix4fv(p.u.uVP, false, depthPass ? this.lightVP : this.vp);
  if (p.u.uLightVP) gl.uniformMatrix4fv(p.u.uLightVP, false, this.lightVP);
  if (p.u.uSunDir) {
    gl.uniform3f(p.u.uSunDir, this.sun.dir.x, this.sun.dir.y, this.sun.dir.z);
    gl.uniform3fv(p.u.uSunCol, this.sun.col);
    gl.uniform3fv(p.u.uSkyCol, this.sky);
    gl.uniform3fv(p.u.uGndCol, this.gnd);
    gl.uniform3fv(p.u.uFogCol, this.fogCol);
    gl.uniform1f(p.u.uFogDens, this.fogDens);
    gl.uniform1f(p.u.uShadowOn, depthPass ? 0 : this.shadowOn);
    gl.uniform1f(p.u.uTexel, 1 / this.SHADOW);
    gl.uniform3f(p.u.uEye, this.eye.x, this.eye.y, this.eye.z);
    gl.uniform1f(p.u.uAlpha, 1);
    gl.uniform1f(p.u.uEmissive, 0);
    gl.uniform3f(p.u.uTint, 1, 1, 1);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, this.shTex);
    gl.uniform1i(p.u.uShadow, 0);
  }
};
Renderer.prototype.draw = function (mesh, model, opt) {
  if (!mesh || !mesh.count) return;
  const gl = this.gl, p = this.cur;
  gl.uniformMatrix4fv(p.u.uModel, false, model || M4.I);
  if (p.u.uTint) {
    const t = opt && opt.tint; gl.uniform3f(p.u.uTint, t ? t[0] : 1, t ? t[1] : 1, t ? t[2] : 1);
    gl.uniform1f(p.u.uAlpha, opt && opt.alpha !== undefined ? opt.alpha : 1);
    gl.uniform1f(p.u.uEmissive, opt && opt.emissive || 0);
  }
  this.bindMesh(p, mesh);
  gl.drawElements(gl.TRIANGLES, mesh.count, mesh.idxType, 0);
  this.drawCalls++; this.tris += mesh.count / 3;
};
Renderer.prototype.drawInstanced = function (mesh) {
  if (!mesh || !mesh.count || !mesh.instCount) return;
  const gl = this.gl, p = this.cur;
  this.bindMesh(p, mesh);
  this.bindInstances(p, mesh);
  if (this.gl2) gl.drawElementsInstanced(gl.TRIANGLES, mesh.count, mesh.idxType, 0, mesh.instCount);
  else this.extInst.drawElementsInstancedANGLE(gl.TRIANGLES, mesh.count, mesh.idxType, 0, mesh.instCount);
  this.unbindInstances(p);
  this.drawCalls++; this.tris += mesh.count / 3 * mesh.instCount;
};
Renderer.prototype.setCamera = function (eye, target, up, fov, near, far) {
  V3.copy(this.eye, eye);
  M4.perspective(this.proj, fov, this.aspect, near, far);
  M4.lookAt(this.view, eye, target, up || WORLD_UP);
  M4.mul(this.vp, this.proj, this.view);
};
Renderer.prototype.setSunMatrix = function (centerX, centerZ, radius) {
  const d = this.sun.dir;
  const eye = V3.make(centerX + d.x * 220, d.y * 220, centerZ + d.z * 220);
  const tgt = V3.make(centerX, 0, centerZ);
  const up = Math.abs(d.y) > .98 ? V3.make(0, 0, 1) : WORLD_UP;
  const lp = M4.create(), lv = M4.create();
  M4.ortho(lp, -radius, radius, -radius, radius, 1, 480);
  M4.lookAt(lv, eye, tgt, up);
  M4.mul(this.lightVP, lp, lv);
};
Renderer.prototype.beginShadow = function () {
  const gl = this.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, this.shFbo);
  gl.viewport(0, 0, this.SHADOW, this.SHADOW);
  gl.clearColor(1, 1, 1, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.cullFace(gl.FRONT);
};
Renderer.prototype.endShadow = function () {
  const gl = this.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, this.cv.width, this.cv.height);
  gl.cullFace(gl.BACK);
};
Renderer.prototype.clearMain = function () {
  const gl = this.gl;
  if (!(this.progPost && this.postOk)) gl.viewport(0, 0, this.cv.width, this.cv.height);
  gl.clearColor(this.fogCol[0], this.fogCol[1], this.fogCol[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  this.drawCalls = 0; this.tris = 0;
};
Renderer.prototype.drawSky = function (top, mid, bot, sunScreen, sunUp, stars, sunCol) {
  const gl = this.gl, p = this.progSky;
  gl.useProgram(p);
  gl.depthMask(false);
  gl.bindBuffer(gl.ARRAY_BUFFER, this.skyBuf);
  gl.enableVertexAttribArray(p.a.aPos);
  gl.vertexAttribPointer(p.a.aPos, 2, gl.FLOAT, false, 0, 0);
  this.divisor(p.a.aPos, 0);
  gl.uniform3fv(p.u.uTop, top); gl.uniform3fv(p.u.uMid, mid); gl.uniform3fv(p.u.uBot, bot);
  gl.uniform3fv(p.u.uSunCol, sunCol);
  gl.uniform2f(p.u.uSunScreen, sunScreen[0], sunScreen[1]);
  gl.uniform1f(p.u.uSunUp, sunUp);
  gl.uniform1f(p.u.uStars, stars);
  gl.uniform1f(p.u.uAspect, this.aspect);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.depthMask(true);
};
Renderer.prototype.projectToScreen = function (x, y, z) {
  const v = { x: 0, y: 0, z: 0 };
  const m = this.vp;
  const w = m[3] * x + m[7] * y + m[11] * z + m[15];
  v.x = (m[0] * x + m[4] * y + m[8] * z + m[12]) / w;
  v.y = (m[1] * x + m[5] * y + m[9] * z + m[13]) / w;
  v.z = w;
  return v;
};

const WORLD_UP = V3.make(0, 1, 0);

/* ============================================================================
   SECTION 5 — CAMERA
   RTS-style orbit rig + free-fly + on-ride first person.
   ========================================================================== */
const Cam = {
  tx: 0, ty: 0, tz: 0,          // focus target
  dx: 0, dy: 0, dz: 0,          // smoothed focus
  yaw: -2.05, pitch: 0.66, distT: 128, dist: 128,
  yawS: -2.05, pitchS: 0.66,
  fov: 38 * DEG,                 // long lens: far less perspective distortion
  mode: 'orbit',                 // orbit | ride | fly
  eye: V3.make(), look: V3.make(),
  shake: 0, shakeX: 0, shakeY: 0,
  flyPos: V3.make(0, 20, 0), flyYaw: 0, flyPitch: -0.2,
  ridePos: V3.make(), rideLook: V3.make(), rideUp: V3.make(0, 1, 0),

  init(x, z) { this.tx = this.dx = x; this.tz = this.dz = z; },
  update(dt) {
    this.dx = damp(this.dx, this.tx, 9, dt);
    this.dy = damp(this.dy, this.ty, 9, dt);
    this.dz = damp(this.dz, this.tz, 9, dt);
    this.dist = damp(this.dist, this.distT, 9, dt);
    this.yawS = damp(this.yawS, this.yaw, 14, dt);
    this.pitchS = damp(this.pitchS, this.pitch, 14, dt);
    this.fovS = this.fovS === undefined ? this.fov : damp(this.fovS, this.fov, 10, dt);
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.2);
      this.shakeX = (Math.random() - .5) * this.shake * .06;
      this.shakeY = (Math.random() - .5) * this.shake * .06;
    } else { this.shakeX = this.shakeY = 0; }

    if (this.mode === 'orbit') {
      const cp = Math.cos(this.pitchS), sp = Math.sin(this.pitchS);
      this.eye.x = this.dx + Math.cos(this.yawS) * cp * this.dist;
      this.eye.y = this.dy + sp * this.dist;
      this.eye.z = this.dz + Math.sin(this.yawS) * cp * this.dist;
      V3.set(this.look, this.dx, this.dy, this.dz);
    } else if (this.mode === 'fly') {
      V3.copy(this.eye, this.flyPos);
      V3.set(this.look,
        this.flyPos.x + Math.cos(this.flyYaw) * Math.cos(this.flyPitch),
        this.flyPos.y + Math.sin(this.flyPitch),
        this.flyPos.z + Math.sin(this.flyYaw) * Math.cos(this.flyPitch));
    } else {
      V3.copy(this.eye, this.ridePos);
      V3.copy(this.look, this.rideLook);
    }
  },
  apply(R) {
    const up = this.mode === 'ride' ? this.rideUp : WORLD_UP;
    const e = V3.make(this.eye.x, this.eye.y, this.eye.z);
    if (this.shake > 0) { e.x += this.shakeX * 3; e.y += this.shakeY * 3; }
    R.setCamera(e, this.look, up, this.fovS || this.fov, 0.25, 1200);
  },
  /* ---- dragging ----------------------------------------------------
     Right-drag grabs the ground: whatever was under the cursor when you
     pressed stays under the cursor. Middle-drag (or ctrl/alt) orbits.
     ------------------------------------------------------------------ */
  drag: null,
  beginDrag(R, mx, my, orbit) {
    if (this.mode !== 'orbit') { this.drag = null; return; }
    if (orbit) { this.drag = { orbit: true }; return; }
    const y = this.ty;
    const p = this.rayToPlane(R, mx, my, y);
    this.drag = p ? { orbit: false, y, ax: p.x, az: p.z } : { orbit: true };
  },
  dragTo(R, mx, my, dx, dy) {
    const d = this.drag;
    if (!d) return;
    if (d.orbit) {
      this.yaw += dx * .0042;
      this.pitch = clamp(this.pitch - dy * .0038, .34, 1.36);
      return;
    }
    const p = this.rayToPlane(R, mx, my, d.y);
    if (!p) return;
    const ox = d.ax - p.x, oz = d.az - p.z;
    // move both the target and its smoothed follower so the grab feels 1:1
    this.tx = clamp(this.tx + ox, -WORLD.half, WORLD.half);
    this.tz = clamp(this.tz + oz, -WORLD.half, WORLD.half);
    this.dx = clamp(this.dx + ox, -WORLD.half, WORLD.half);
    this.dz = clamp(this.dz + oz, -WORLD.half, WORLD.half);
  },
  endDrag() { this.drag = null; },

  /* Turn the view a quarter-turn at a time; the grid stays readable. */
  rotateBy(steps) {
    const q = PI / 4;
    this.yaw = (Math.round(this.yaw / q) + steps) * q;
  },

  /* Zoom towards whatever is under the cursor, the way a map does. */
  zoom(d, focus) {
    const before = this.distT;
    this.distT = clamp(this.distT * (1 + d * .0013), 14, 300);
    if (focus && this.mode === 'orbit') {
      const f = 1 - this.distT / before;               // positive when zooming in
      if (f > 0) {
        this.tx = clamp(lerp(this.tx, focus.x, f * .85), -WORLD.half, WORLD.half);
        this.tz = clamp(lerp(this.tz, focus.z, f * .85), -WORLD.half, WORLD.half);
      }
    }
  },
  pan(dx, dz) {
    const s = this.dist * 0.0016;
    const c = Math.cos(this.yawS), si = Math.sin(this.yawS);
    this.tx += (-dx * si + dz * c) * -s * 1.0 + (dx * c + dz * si) * 0;
    // proper: forward = -(cos,sin) ; right = (-sin,cos)
  },
  panWorld(dx, dz) {
    const s = this.dist * 0.0017;
    const fx = -Math.cos(this.yawS), fz = -Math.sin(this.yawS);
    const rx = -fz, rz = fx;
    this.tx += (rx * dx + fx * dz) * s;
    this.tz += (rz * dx + fz * dz) * s;
    this.tx = clamp(this.tx, -WORLD.half - 20, WORLD.half + 20);
    this.tz = clamp(this.tz, -WORLD.half - 20, WORLD.half + 20);
  },
  moveRelative(f, r, dt) {
    const spd = this.dist * .9 * dt;
    const fx = -Math.cos(this.yawS), fz = -Math.sin(this.yawS);
    const rx = -fz, rz = fx;
    this.tx = clamp(this.tx + (fx * f + rx * r) * spd, -WORLD.half - 20, WORLD.half + 20);
    this.tz = clamp(this.tz + (fz * f + rz * r) * spd, -WORLD.half - 20, WORLD.half + 20);
  },
  /* screen ray -> ground plane at height h */
  rayToPlane(R, mx, my, h) {
    const nx = (mx / innerWidth) * 2 - 1, ny = 1 - (my / innerHeight) * 2;
    const inv = M4.create();
    if (!M4.invert(inv, R.vp)) return null;
    const p0 = M4.xformPoint({}, inv, nx, ny, -1);
    const p1 = M4.xformPoint({}, inv, nx, ny, 1);
    const dy = p1.y - p0.y;
    if (Math.abs(dy) < 1e-6) return null;
    const t = (h - p0.y) / dy;
    if (t < 0) return null;
    return { x: p0.x + (p1.x - p0.x) * t, y: h, z: p0.z + (p1.z - p0.z) * t };
  },
  rayDir(R, mx, my) {
    const nx = (mx / innerWidth) * 2 - 1, ny = 1 - (my / innerHeight) * 2;
    const inv = M4.create();
    if (!M4.invert(inv, R.vp)) return null;
    const p0 = M4.xformPoint({}, inv, nx, ny, -1);
    const p1 = M4.xformPoint({}, inv, nx, ny, 1);
    const d = V3.norm({}, V3.sub({}, p1, p0));
    return { o: p0, d };
  }
};
/* ============================================================================
   SECTION 6 — WORLD GRID & TERRAIN
   The park sits on a tile grid. Tiles carry a type (grass / path / queue /
   footprint) and a height. Terrain is regenerated whenever tiles change.
   ========================================================================== */
const TILE = 4;                 // world units per tile
const N = 140;                  // tiles per side (560 m across)
const T_GRASS = 0, T_PATH = 1, T_QUEUE = 2, T_BUILD = 3, T_WATER = 4, T_ENTRY = 5, T_PLAZA = 6;

const WORLD = {
  n: N, tile: TILE, half: N * TILE / 2,
  type: new Uint8Array(N * N),
  own: new Int32Array(N * N),        // id of object occupying tile (-1 none)
  land: new Uint8Array(N * N),       // 1 = the park owns this tile
  h: new Float32Array((N + 1) * (N + 1)),
  dirty: true,
  mesh: null, waterMesh: null, propMesh: null,

  idx(i, j) { return j * N + i; },
  inb(i, j) { return i >= 0 && j >= 0 && i < N && j < N; },
  t(i, j) { return this.inb(i, j) ? this.type[j * N + i] : 255; },
  setT(i, j, v) { if (this.inb(i, j)) { this.type[j * N + i] = v; this.dirty = true; } },
  ownerOf(i, j) { return this.inb(i, j) ? this.own[j * N + i] : -1; },
  setOwn(i, j, v) { if (this.inb(i, j)) this.own[j * N + i] = v; },

  /* tile <-> world */
  wx(i) { return (i - N / 2) * TILE + TILE / 2; },
  wz(j) { return (j - N / 2) * TILE + TILE / 2; },
  ti(x) { return Math.floor(x / TILE + N / 2); },
  tj(z) { return Math.floor(z / TILE + N / 2); },

  ownsTile(i, j) { return this.inb(i, j) && this.land[j * N + i] === 1; },
  ownsWorld(x, z) { return this.ownsTile(this.ti(x), this.tj(z)); },

  hAt(x, z) {
    const fx = clamp(x / TILE + N / 2, 0, N), fz = clamp(z / TILE + N / 2, 0, N);
    const i = Math.min(N - 1, Math.floor(fx)), j = Math.min(N - 1, Math.floor(fz));
    const u = fx - i, v = fz - j, W = N + 1;
    const h00 = this.h[j * W + i], h10 = this.h[j * W + i + 1], h01 = this.h[(j + 1) * W + i], h11 = this.h[(j + 1) * W + i + 1];
    return lerp(lerp(h00, h10, u), lerp(h01, h11, u), v);
  },
  tileH(i, j) {
    const W = N + 1;
    return (this.h[j * W + i] + this.h[j * W + i + 1] + this.h[(j + 1) * W + i] + this.h[(j + 1) * W + i + 1]) * .25;
  },

  generate() {
    const W = N + 1;
    for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) {
      const x = i - N / 2, z = j - N / 2;
      const r = Math.hypot(x, z) / (N / 2);
      // Flat buildable plateau in the middle, rolling hills toward the rim
      let h = 0;
      const rim = smoothstep(clamp((r - .86) / .14, 0, 1));
      h += rim * (fbm(i * .045, j * .045, 5) * 26 - 5);
      h += rim * rim * 18;
      h += (1 - rim) * (fbm(i * .07 + 40, j * .07 + 40, 3) - .5) * 0.9;
      this.h[j * W + i] = h;
    }
    this.type.fill(T_GRASS);
    this.own.fill(-1);
    Land.reset();
    // Entrance plaza & main street
    const c = N >> 1;
    for (let j = c + 12; j < c + 20; j++) for (let i = c - 3; i <= c + 3; i++) this.type[j * N + i] = T_PATH;
    for (let j = c + 18; j < c + 21; j++) for (let i = c - 5; i <= c + 5; i++) this.type[j * N + i] = T_ENTRY;
    for (let j = c - 4; j < c + 13; j++) for (let i = c - 2; i <= c + 2; i++) this.type[j * N + i] = T_PATH;
    for (let j = c - 4; j <= c; j++) for (let i = c - 12; i <= c + 12; i++) this.type[j * N + i] = T_PATH;
    for (let j = c - 5; j <= c + 1; j++) for (let i = c - 6; i <= c + 6; i++) if (this.type[j * N + i] === T_PATH) this.type[j * N + i] = T_PLAZA;
    this.dirty = true;
  },

  /* Build the terrain mesh: flat-shaded quads with a hand-painted look. */
  buildMesh(R) {
    const g = new Geo(), W = N + 1;
    const grassA = hex(0x4e9b46), grassB = hex(0x62b054), grassC = hex(0x3f8a3e), grassD = hex(0x74bd5e);
    const rock = hex(0x6f6a62), rock2 = hex(0x857f74), sand = hex(0xcfbc88);
    const pathC = hex(0xc4b79d), pathD = hex(0xb0a288);
    const queueC = hex(0xb59ad0), plazaA = hex(0xd8cdb6), plazaB = hex(0xc2b59a), entryC = hex(0xcfae82);
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const t = this.type[j * N + i];
        const x0 = (i - N / 2) * TILE, x1 = x0 + TILE, z0 = (j - N / 2) * TILE, z1 = z0 + TILE;
        const y00 = this.h[j * W + i], y10 = this.h[j * W + i + 1], y01 = this.h[(j + 1) * W + i], y11 = this.h[(j + 1) * W + i + 1];
        let c;
        const chk = ((i ^ j) & 1) === 0;
        if (t === T_PATH || t === T_BUILD) c = chk ? pathC : pathD;
        else if (t === T_QUEUE) c = shade(queueC, chk ? 1 : .92);
        else if (t === T_PLAZA) c = ((i + j) % 4 < 2) ? plazaA : plazaB;
        else if (t === T_ENTRY) c = shade(entryC, chk ? 1 : .93);
        else {
          const slope = Math.max(Math.abs(y10 - y00), Math.abs(y01 - y00)) / TILE;
          const hh = (y00 + y11) * .5;
          const n = noise2(i * .31, j * .31), n2 = noise2(i * .09 + 11, j * .09 + 7);
          c = n > .70 ? grassD : n > .55 ? grassB : n < .32 ? grassC : grassA;
          c = shade(c, .93 + n2 * .16);
          if (slope > .58) c = shade(n > .5 ? rock2 : rock, .9 + n * .25);
          else if (hh < -1.0) c = shade(sand, .9 + n * .2);
          if (hh > 18) c = shade(rock2, 1.0 + n * .22);
        }
        // land the park does not own reads cooler and darker
        if (this.land[j * N + i] !== 1) c = [c[0] * .42 + .06, c[1] * .46 + .07, c[2] * .50 + .10];
        // choose the diagonal that keeps the quad convex-ish
        if (Math.abs(y00 - y11) < Math.abs(y10 - y01)) {
          g.triV([x0, y00, z0], [x0, y01, z1], [x1, y11, z1], c);
          g.triV([x0, y00, z0], [x1, y11, z1], [x1, y10, z0], shade(c, .97));
        } else {
          g.triV([x0, y00, z0], [x0, y01, z1], [x1, y10, z0], c);
          g.triV([x1, y10, z0], [x0, y01, z1], [x1, y11, z1], shade(c, .97));
        }
        // path kerbs give the walkways a built look
        if (t === T_PATH || t === T_QUEUE || t === T_PLAZA) {
          const kc = t === T_QUEUE ? hex(0x8f6fb0) : hex(0xa89478);
          const y = Math.max(y00, y10, y01, y11);
          const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          for (const [di, dj] of nb) {
            const nt = this.t(i + di, j + dj);
            if (nt === T_PATH || nt === T_QUEUE || nt === T_PLAZA || nt === T_BUILD || nt === T_ENTRY) continue;
            const cx = (i - N / 2) * TILE + TILE / 2 + di * (TILE / 2 - .12);
            const cz = (j - N / 2) * TILE + TILE / 2 + dj * (TILE / 2 - .12);
            g.box(cx, y - .02, cz, di ? .24 : TILE, .16, dj ? .24 : TILE, kc);
          }
        }
      }
    }
    // Fence along the edge of the land the park actually owns
    const fenceC = hex(0x6c5a47);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      if (this.land[j * N + i] !== 1) continue;
      const cx = this.wx(i), cz = this.wz(j);
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if (this.ownsTile(i + di, j + dj)) continue;
        const ex = cx + di * TILE / 2, ez = cz + dj * TILE / 2;
        const ax = ex - dj * TILE / 2, az = ez - di * TILE / 2;
        const bx = ex + dj * TILE / 2, bz = ez + di * TILE / 2;
        const ay = this.hAt(ax, az) + 1.25, by = this.hAt(bx, bz) + 1.25;
        g.beam(ax, ay, az, bx, by, bz, .09, .11, fenceC);
        g.beam(ax, ay - .5, az, bx, by - .5, bz, .09, .11, fenceC);
        g.box(ax, this.hAt(ax, az), az, .17, 1.4, .17, shade(fenceC, .85));
      }
    }
    if (this.mesh) this.mesh.dispose();
    this.mesh = R.makeMesh(g);
    this.dirty = false;
    this.buildProps(R);
  },

  /* Decorative scenery outside the park: rocks and forest. Generated once. */
  props: null,
  buildProps(R) {
    if (this.propMesh) return;
    const g = new Geo();
    let seed = 1;
    const rr = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let k = 0; k < 900; k++) {
      const a = rr() * TAU, rad = (N / 2 - 3) * TILE * (0.62 + rr() * 0.36);
      const x = Math.cos(a) * rad, z = Math.sin(a) * rad;
      const i = this.ti(x), j = this.tj(z);
      if (!this.inb(i, j) || this.type[j * N + i] !== T_GRASS) continue;
      const y = this.hAt(x, z);
      if (y < -1.5) continue;
      const r2 = rr();
      if (r2 < .72) {
        const hgt = 4 + rr() * 6, tc = hex(0x5b4230);
        g.cyl(x, y, z, .34 + rr() * .16, hgt * .45, 6, tc, .8);
        const lc = shade(hex(rr() < .5 ? 0x2f7a3e : 0x3b8f45), .85 + rr() * .35);
        g.cone(x, y + hgt * .32, z, 2.0 + rr(), hgt * .55, 7, lc);
        g.cone(x, y + hgt * .58, z, 1.5 + rr() * .6, hgt * .5, 7, shade(lc, 1.1));
      } else if (r2 < .9) {
        const s = .8 + rr() * 2.2, rc = shade(hex(0x8a8378), .8 + rr() * .4);
        g.sphere(x, y + s * .3, z, s, 5, rc);
      } else {
        const bc = shade(hex(0x3f8a4a), .85 + rr() * .3);
        g.sphere(x, y + .5, z, .8 + rr() * .5, 5, bc);
      }
    }
    this.propMesh = R.makeMesh(g);
  },

  /* Water plane for the low areas */
  buildWater(R) {
    const g = new Geo(), c = hex(0x2a6fa8);
    const lim = (N / 2) * TILE;
    g.quadV([-lim, -1.6, -lim], [-lim, -1.6, lim], [lim, -1.6, lim], [lim, -1.6, -lim], c);
    this.waterMesh = R.makeMesh(g);
  },

  clearArea(i0, j0, w, d) {
    for (let j = j0; j < j0 + d; j++) for (let i = i0; i < i0 + w; i++) if (this.inb(i, j)) { this.type[j * N + i] = T_GRASS; this.own[j * N + i] = -1; }
    this.dirty = true;
  },
  areaFree(i0, j0, w, d, allowPath) {
    for (let j = j0; j < j0 + d; j++) for (let i = i0; i < i0 + w; i++) {
      if (!this.inb(i, j)) return false;
      if (this.land[j * N + i] !== 1) return false;
      const t = this.type[j * N + i];
      if (t === T_BUILD || t === T_QUEUE) return false;
      if (!allowPath && (t === T_PATH || t === T_PLAZA || t === T_ENTRY)) return false;
      if (Math.abs(this.tileH(i, j)) > 3.2) return false;
    }
    return true;
  },
  flatten(i0, j0, w, d, y) {
    const W = N + 1;
    for (let j = j0; j <= j0 + d; j++) for (let i = i0; i <= i0 + w; i++)
      if (i >= 0 && j >= 0 && i <= N && j <= N) this.h[j * W + i] = y;
    this.dirty = true;
  }
};

/* ============================================================================
   SECTION 6b — LAND OWNERSHIP
   The map is divided into plots. The park starts on a handful of them and
   the rest can be bought, at a price that climbs the further out you go.
   ========================================================================== */
const PLOT = 14;                       // tiles per side of a purchasable plot
const PLOTS = Math.ceil(N / PLOT);     // plots per side

const Land = {
  ownedPlots: new Uint8Array(PLOTS * PLOTS),
  bought: 0,

  reset() {
    this.ownedPlots.fill(0);
    this.bought = 0;
    const c = Math.floor(PLOTS / 2);
    // the starting park is a generous central block — room for several
    // coasters before anyone needs to think about buying land
    for (let pj = c - 2; pj <= c + 2; pj++) for (let pi = c - 2; pi <= c + 2; pi++) this.claim(pi, pj);
  },
  idx(pi, pj) { return pj * PLOTS + pi; },
  inb(pi, pj) { return pi >= 0 && pj >= 0 && pi < PLOTS && pj < PLOTS; },
  owns(pi, pj) { return this.inb(pi, pj) && this.ownedPlots[this.idx(pi, pj)] === 1; },
  plotOf(i, j) { return { pi: Math.floor(i / PLOT), pj: Math.floor(j / PLOT) }; },

  claim(pi, pj) {
    if (!this.inb(pi, pj) || this.owns(pi, pj)) return false;
    this.ownedPlots[this.idx(pi, pj)] = 1;
    this.bought++;
    for (let j = pj * PLOT; j < Math.min(N, (pj + 1) * PLOT); j++)
      for (let i = pi * PLOT; i < Math.min(N, (pi + 1) * PLOT); i++) WORLD.land[j * N + i] = 1;
    WORLD.dirty = true;
    return true;
  },
  /* Only plots touching land you already own are for sale. */
  adjacent(pi, pj) {
    return this.owns(pi - 1, pj) || this.owns(pi + 1, pj) || this.owns(pi, pj - 1) || this.owns(pi, pj + 1);
  },
  /* Buildable terrain is worth more; distant, mountainous plots are cheap but useless. */
  price(pi, pj) {
    let flat = 0, n = 0;
    for (let j = pj * PLOT; j < Math.min(N, (pj + 1) * PLOT); j += 2)
      for (let i = pi * PLOT; i < Math.min(N, (pi + 1) * PLOT); i += 2) {
        n++; if (Math.abs(WORLD.tileH(i, j)) < 3.2) flat++;
      }
    const usable = n ? flat / n : 0;
    const base = 5000 + this.bought * 700;
    return Math.round((base * (0.35 + usable * 1.15)) / 100) * 100;
  },
  buy(pi, pj) {
    if (!this.inb(pi, pj)) return 'That plot is off the map.';
    if (this.owns(pi, pj)) return 'You already own that plot.';
    if (!this.adjacent(pi, pj)) return 'You can only buy land next to your park.';
    const cost = this.price(pi, pj);
    if (Park.money < cost) return 'You cannot afford that plot (' + money(cost) + ').';
    Park.spend(cost);
    this.claim(pi, pj);
    Audio.play('cash');
    UI.notify('Land purchased', 'Plot bought for ' + money(cost) + '. The park now covers ' + this.areaText() + '.', 'money');
    return null;
  },
  tilesOwned() { let n = 0; for (let k = 0; k < N * N; k++) if (WORLD.land[k]) n++; return n; },
  areaText() {
    const m2 = this.tilesOwned() * TILE * TILE;
    return m2 >= 10000 ? (m2 / 10000).toFixed(1) + ' ha' : m2 + ' m2';
  }
};

/* ============================================================================
   SECTION 8 — PREFABS
   Every building, prop and flat ride is generated here from primitives.
   A prefab returns { base: Geo, parts: [{ geo, anim(m, ride, t) }] }.
   ========================================================================== */
const Prefab = {
  /* --- shared decorative helpers --- */
  bunting(g, x, y, z, r, c1, c2, seg = 16) {
    for (let i = 0; i < seg; i++) {
      const a = i / seg * TAU, a2 = (i + 1) / seg * TAU;
      const x1 = x + Math.cos(a) * r, z1 = z + Math.sin(a) * r;
      const x2 = x + Math.cos(a2) * r, z2 = z + Math.sin(a2) * r;
      const sag = .18;
      g.beam(x1, y, z1, x2, y, z2, .04, .04, hex(0x4a4a4a));
      g.triV([x1, y - .04, z1], [x2, y - .04, z2], [(x1 + x2) / 2, y - .04 - sag * 2, (z1 + z2) / 2], i % 2 ? c1 : c2);
    }
  },
  stripedRoof(g, x, y, z, r, h, seg, c1, c2) {
    for (let i = 0; i < seg; i++) {
      const a = i / seg * TAU, a2 = (i + 1) / seg * TAU;
      g.triV([x + Math.cos(a) * r, y, z + Math.sin(a) * r],
        [x + Math.cos(a2) * r, y, z + Math.sin(a2) * r],
        [x, y + h, z], i % 2 ? c1 : c2);
    }
  },
  lightBulbs(g, x, y, z, r, n, c) {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU;
      g.sphere(x + Math.cos(a) * r, y, z + Math.sin(a) * r, .14, 5, c);
    }
  },

  /* ------------------------------------------------------------------
     SHOP / FACILITY building
     ------------------------------------------------------------------ */
  shop(def) {
    const g = new Geo();
    const W = def.w * TILE, D = def.d * TILE;
    const body = hex(def.color), roof = hex(def.roof);
    const wall = shade(hex(0xf5efe2), 1);
    const hw = W / 2 - .35, hd = D / 2 - .35;
    // plinth
    g.box(0, -.1, 0, W - .2, .28, D - .2, hex(0xb9ab90));
    // walls
    g.box(0, .18, 0, W - .7, 2.9, D - .7, wall);
    // colour band
    g.box(0, .18, 0, W - .62, .55, D - .62, body);
    g.box(0, 2.55, 0, W - .62, .55, D - .62, body);
    // corner posts
    for (const sx of [-1, 1]) for (const sz of [-1, 1])
      g.box(sx * hw, .18, sz * hd, .34, 3.1, .34, shade(body, .8));
    // hipped roof
    const rh = 1.5, ry = 3.1;
    const p = [[-W / 2, ry, -D / 2], [W / 2, ry, -D / 2], [W / 2, ry, D / 2], [-W / 2, ry, D / 2]];
    const ax = [-W / 6, ry + rh, 0], bx = [W / 6, ry + rh, 0];
    g.quadV(p[3], p[2], bx, ax, shade(roof, 1.15));
    g.triV(p[0], p[3], ax, shade(roof, .88));
    g.triV(p[2], p[1], bx, shade(roof, .88));
    g.quadV(p[1], p[0], ax, bx, shade(roof, .95));
    // awning + counter on -Z face
    g.box(0, 2.35, -D / 2 - .5, W - .9, .18, 1.1, shade(roof, 1.05));
    for (let i = 0; i < 5; i++) {
      const x = -W / 2 + .6 + i * (W - 1.2) / 4;
      g.box(x, 2.2, -D / 2 - .96, (W - 1.2) / 5 - .1, .2, .2, i % 2 ? shade(body, 1.1) : wall);
    }
    g.box(-hw + .1, .2, -D / 2 - .95, .16, 2.2, .16, shade(body, .7));
    g.box(hw - .1, .2, -D / 2 - .95, .16, 2.2, .16, shade(body, .7));
    g.box(0, .5, -D / 2 - .18, W - 1.4, .95, .36, shade(hex(0x6d5a45), 1));   // counter
    g.box(0, 1.45, -D / 2 - .18, W - 1.4, .12, .5, shade(hex(0x8b7355), 1.1)); // counter top
    // sign board
    g.box(0, ry + .5, -D / 2 - .06, W - 1.0, .95, .22, shade(body, 1.2));
    g.box(0, ry + .62, -D / 2 - .19, W - 1.5, .6, .06, hex(0xfff4d0));
    // menu window glow
    g.box(0, 1.7, -D / 2 - .21, W - 1.9, .6, .06, hex(0xffe9a8));
    // small chimney / vent
    g.box(hw - .5, 3.0, hd - .5, .5, 1.0, .5, shade(roof, .8));
    // planters
    for (const sx of [-1, 1]) {
      g.box(sx * (W / 2 + .35), 0, -D / 2 + .6, .6, .5, .6, hex(0x9c7b5c));
      g.sphere(sx * (W / 2 + .35), .75, -D / 2 + .6, .42, 5, hex(0x4e9b52));
      g.sphere(sx * (W / 2 + .35) + .2, .95, -D / 2 + .5, .12, 4, hex(0xff6f91));
    }
    return { base: g, parts: [] };
  },

  /* ------------------------------------------------------------------
     SCENERY
     ------------------------------------------------------------------ */
  scenery(kind, seed = 0) {
    const g = new Geo();
    const parts = [];
    const rr = (() => { let s = seed * 7919 + 13; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; }; })();
    switch (kind) {
      case 'bench': {
        const w = hex(0x9a6b42), m = hex(0x555f6b);
        g.box(0, .34, .16, 2.4, .12, .5, w);
        g.box(0, .78, .42, 2.4, .55, .12, w);
        for (const sx of [-1, 1]) { g.box(sx * 1.0, 0, 0, .12, .38, .7, m); }
        break;
      }
      case 'bin': {
        g.cyl(0, 0, 0, .38, .95, 8, hex(0x3f6b4a));
        g.cyl(0, .95, 0, .42, .12, 8, hex(0x2c4c36));
        g.box(0, 1.07, 0, .5, .06, .5, hex(0x223c2b));
        break;
      }
      case 'lamp': {
        g.cyl(0, 0, 0, .13, 4.2, 8, hex(0x2f3742));
        g.box(0, 4.2, 0, .5, .16, .5, hex(0x2f3742));
        g.sphere(0, 4.5, 0, .42, 7, hex(0xfff0b8));
        g.box(0, 4.75, 0, .55, .22, .55, hex(0x2f3742));
        break;
      }
      case 'tree': {
        const h = 2.4 + rr() * 1.4;
        g.cyl(0, 0, 0, .3, h, 7, hex(0x6b4a2f), .8);
        const lc = shade(hex(0x3e9c4b), .9 + rr() * .3);
        g.sphere(0, h + 1.0, 0, 1.7 + rr() * .4, 7, lc);
        g.sphere(-1.0, h + .5, .4, 1.1, 6, shade(lc, .9));
        g.sphere(1.0, h + .7, -.4, 1.2, 6, shade(lc, 1.08));
        break;
      }
      case 'pine': {
        const h = 3.2 + rr() * 2;
        g.cyl(0, 0, 0, .26, h * .4, 6, hex(0x5b4230), .8);
        const lc = shade(hex(0x2f7a44), .9 + rr() * .25);
        g.cone(0, h * .25, 0, 1.7, h * .5, 7, lc);
        g.cone(0, h * .55, 0, 1.35, h * .45, 7, shade(lc, 1.08));
        g.cone(0, h * .85, 0, .95, h * .4, 7, shade(lc, 1.16));
        break;
      }
      case 'palm': {
        const h = 4.5 + rr() * 1.5;
        for (let i = 0; i < 6; i++) {
          const t = i / 6, t2 = (i + 1) / 6;
          const bend = .55;
          g.beam(Math.sin(t * 1.4) * bend, t * h, 0, Math.sin(t2 * 1.4) * bend, t2 * h, 0, .34 - t * .12, .34 - t * .12, shade(hex(0x9c7b52), 1 - t * .1));
        }
        const tx = Math.sin(1.4) * .55;
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * TAU;
          const lc = shade(hex(0x3fa055), .85 + rr() * .3);
          g.triV([tx, h, 0], [tx + Math.cos(a) * 2.6, h - 1.1, Math.sin(a) * 2.6], [tx + Math.cos(a + .32) * 2.2, h - .6, Math.sin(a + .32) * 2.2], lc);
        }
        g.sphere(tx, h - .3, 0, .35, 5, hex(0x8b6b3a));
        break;
      }
      case 'flower': {
        g.box(0, 0, 0, 3.0, .38, 3.0, hex(0xa08056));
        g.box(0, .38, 0, 2.7, .12, 2.7, hex(0x4a3b28));
        const cols = [0xff6f91, 0xffd93d, 0xff8c42, 0xc77dff, 0xffffff];
        for (let i = 0; i < 16; i++) {
          const x = (rr() - .5) * 2.4, z = (rr() - .5) * 2.4;
          g.cyl(x, .45, z, .05, .3, 4, hex(0x3f8a4a));
          g.sphere(x, .82, z, .18, 5, hex(pick(cols)));
        }
        break;
      }
      case 'hedge': {
        g.box(0, 0, 0, 3.4, 1.5, 1.4, hex(0x2f7a3f), 1.12, .92, .8);
        g.box(0, 1.5, 0, 3.0, .22, 1.1, hex(0x3d9450));
        break;
      }
      case 'fountain': {
        const r = 3.4;
        g.cyl(0, 0, 0, r, .7, 16, hex(0xd8d2c4));
        g.cyl(0, .7, 0, r - .45, .12, 16, hex(0x4a9ed8));
        g.cyl(0, .5, 0, .9, 1.5, 12, hex(0xe6e0d2));
        g.cyl(0, 2.0, 0, 1.6, .22, 12, hex(0xd8d2c4));
        g.cyl(0, 2.22, 0, .45, 1.2, 10, hex(0xe6e0d2));
        g.sphere(0, 3.6, 0, .55, 8, hex(0xffd76a));
        const jet = new Geo();
        for (let i = 0; i < 10; i++) {
          const a = i / 10 * TAU;
          jet.beam(0, 0, 0, Math.cos(a) * 1.5, -1.0, Math.sin(a) * 1.5, .1, .1, hex(0x9fd8f5));
        }
        parts.push({ geo: jet, y: 3.4, anim: (m, o, t) => M4.compose(m, 0, 3.4, 0, 0, t * 1.2, 0, 1, 1 + Math.sin(t * 3) * .12, 1) });
        break;
      }
      case 'statue': {
        g.box(0, 0, 0, 2.0, .5, 2.0, hex(0xcfc7b5));
        g.box(0, .5, 0, 1.5, 1.6, 1.5, hex(0xe0d9c8));
        g.box(0, 2.1, 0, 1.1, .2, 1.1, hex(0xcfc7b5));
        const s = hex(0xf0ece0);
        g.cbox(0, 4.0, 0, .8, 1.6, .5, s);
        g.sphere(0, 4.3, 0, .38, 7, s);
        g.cbox(-.55, 4.2, 0, .22, 1.2, .22, s);
        g.cbox(.55, 4.5, 0, .22, 1.4, .22, s);
        g.cbox(-.22, 2.3, 0, .28, .95, .28, s);
        g.cbox(.22, 2.3, 0, .28, .95, .28, s);
        break;
      }
      case 'topiary': {
        g.cyl(0, 0, 0, .8, .35, 8, hex(0x9c8060));

        g.sphere(0, 2.1, 0, .65, 7, c);
        g.sphere(-.55, 2.5, 0, .25, 5, c);
        g.sphere(.55, 2.5, 0, .25, 5, c);

      }
      case 'arch': {
        const c = hex(0xe8d9b8), t = hex(0xd94f3c);
        for (const sx of [-1, 1]) { g.box(sx * 3.0, 0, 0, .9, 5.0, .9, c); g.box(sx * 3.0, 5.0, 0, 1.2, .4, 1.2, t); }
        g.box(0, 5.4, 0, 7.2, .8, 1.0, c);
        g.box(0, 6.2, 0, 5.6, .5, .8, t);
        for (let i = -2; i <= 2; i++) g.sphere(i * 1.3, 6.9, 0, .3, 6, hex(0xffd76a));
        break;
      }
      case 'speaker': {
        g.cyl(0, 0, 0, .12, 2.6, 6, hex(0x33393f));
        g.box(0, 2.6, 0, .7, .8, .7, hex(0x2b3138));
        g.cone(0, 3.4, 0, .5, .5, 8, hex(0x4a5560));
        break;
      }
      case 'firework': {
        g.cyl(0, 0, 0, .5, .5, 8, hex(0x33393f));
        for (let i = 0; i < 4; i++) g.cyl(-.3 + (i % 2) * .6, .5, -.3 + Math.floor(i / 2) * .6, .16, .9, 6, hex(0xd94f3c));
        break;
      }
      case 'clock': {
        const c = hex(0xe6ddc8), t = hex(0x9c3f3f);
        g.box(0, 0, 0, 4.0, 1.0, 4.0, hex(0xcfc7b5));
        g.box(0, 1.0, 0, 3.0, 8.0, 3.0, c);
        for (let i = 0; i < 3; i++) g.box(0, 2.0 + i * 2.4, 0, 3.3, .25, 3.3, t);
        g.box(0, 9.0, 0, 3.6, 2.4, 3.6, shade(c, 1.05));
        for (const [dx, dz] of [[0, -1], [0, 1], [-1, 0], [1, 0]])
          g.box(dx * 1.85, 9.4, dz * 1.85, dx ? .12 : 1.6, 1.6, dz ? .12 : 1.6, hex(0xfff6e0));
        g.cone(0, 11.4, 0, 2.6, 3.0, 8, t);
        g.sphere(0, 14.4, 0, .4, 7, hex(0xffd76a));

        break;

      case 'castle': {
        const w = hex(0xe8e2d2), t = hex(0x4a6fd4), s = hex(0xcfc7b5);

        g.box(0, 1, 0, 9, 7, 7, w);
        for (let i = -4; i <= 4; i += 1.6) { g.box(i, 8, -3.4, 1.0, .9, .8, w); g.box(i, 8, 3.4, 1.0, .9, .8, w); }
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
          g.cyl(sx * 5.0, 1, sz * 4.2, 1.8, 10, 10, w);
          g.cyl(sx * 5.0, 11, sz * 4.2, 2.1, .5, 10, s);
          g.cone(sx * 5.0, 11.5, sz * 4.2, 2.3, 4.5, 10, t);
          g.sphere(sx * 5.0, 16.2, sz * 4.2, .35, 6, hex(0xffd76a));
        }
        g.cyl(0, 8, 0, 2.6, 8, 12, w);
        g.cone(0, 16, 0, 3.2, 6, 12, shade(t, 1.1));
        g.sphere(0, 22.2, 0, .5, 7, hex(0xffd76a));
        g.box(0, 1, -3.6, 3.0, 4.2, .6, hex(0x6b4a2f));
        g.box(0, 5.2, -3.6, 3.0, .4, .8, s);
        break;
      }
      case 'gazebo': {
        const post = hex(0xf0e6d2), roof = hex(0x8b5a2b);
        g.cyl(0, 0, 0, 3.4, .5, 12, hex(0xd8cdb4));
        g.cyl(0, .5, 0, 3.1, .25, 12, hex(0xe8dcc0));
        for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; g.cyl(Math.cos(a) * 2.8, .75, Math.sin(a) * 2.8, .16, 3.2, 6, post); }
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * TAU, a2 = (i + 1) / 8 * TAU;

        }
        this.stripedRoof(g, 0, 4.1, 0, 3.6, 1.8, 12, roof, shade(roof, 1.25));
        g.sphere(0, 6.1, 0, .4, 7, hex(0xffd76a));
        g.cyl(0, .75, 0, .5, .5, 8, hex(0xd8cdb4));
        break;
      }
      case 'torii': {
        const c = hex(0xc0392b), t = hex(0x2b2118);
        for (const sx of [-1, 1]) { g.cyl(sx * 2.6, 0, 0, .4, 5.4, 8, c, .88); g.cyl(sx * 2.6, 0, 0, .55, .3, 8, t); }
        g.box(0, 5.4, 0, 7.6, .5, .9, t);
        g.box(0, 5.9, 0, 8.6, .45, 1.0, c);
        g.box(0, 4.3, 0, 5.6, .4, .7, c);
        g.box(0, 4.7, 0, .7, .8, .7, t);
        break;
      }
      case 'rockarch': {
        const r = hex(0x8a8378);
        for (const sx of [-1, 1]) {
          g.sphere(sx * 3.2, 1.4, 0, 2.0, 6, shade(r, .95));
          g.sphere(sx * 3.0, 3.4, .3, 1.6, 6, shade(r, 1.08));
          g.sphere(sx * 2.4, 5.0, -.2, 1.3, 6, shade(r, .9));

        g.sphere(0, 5.8, 0, 1.7, 6, shade(r, 1.12));
        g.sphere(-1.3, 5.6, .2, 1.3, 5, shade(r, 1.0));
        g.sphere(1.3, 5.6, -.2, 1.3, 5, shade(r, 1.0));
        g.sphere(-3.4, .4, 1.8, 1.0, 5, shade(r, .85));
        g.sphere(3.6, .3, -1.6, .8, 5, shade(r, .85));
        break;
      }
      case 'dino': {
        const c = hex(0x4f7f4a), b = hex(0xd8cdb4);
        g.box(0, 0, 0, 10, .5, 5, b);
        g.cbox(0, 5.4, 0, 2.6, 3.2, 5.4, c);                 // body
        g.beam(0, 4.6, -2.4, 0, 8.6, -4.6, 1.2, 1.2, c);     // neck
        g.cbox(0, 9.6, -5.2, 1.4, 1.3, 2.6, shade(c, 1.1));  // head
        g.cbox(0, 9.1, -6.2, 1.0, .5, 1.2, hex(0xe0d6c0));   // jaw
        g.beam(0, 4.6, 2.4, 0, 2.2, 6.4, 1.0, 1.0, c);       // tail
        g.beam(0, 2.2, 6.4, 0, 1.2, 8.4, .5, .5, c);
        for (const sx of [-1, 1]) { g.cyl(sx * 1.0, .5, -1.4, .6, 3.4, 6, shade(c, .9)); g.cyl(sx * 1.1, .5, 1.6, .7, 3.6, 6, shade(c, .9)); }
        for (let i = 0; i < 5; i++) g.cone(0, 6.6 + i * .1, -1.6 + i * 1.1, .45, .9, 5, hex(0xc9a227));
        break;
      }
      case 'pond': {
        g.cyl(0, 0, 0, 5.4, .5, 18, hex(0x6b8f4a));
        g.cyl(0, .5, 0, 4.6, .12, 18, hex(0x2f86b8));
        for (let i = 0; i < 14; i++) {
          const a = i / 14 * TAU;
          g.sphere(Math.cos(a) * 5.0, .5, Math.sin(a) * 5.0, .5 + (i % 3) * .18, 5, hex(0x8a8378));
        }
        for (let i = 0; i < 5; i++) {
          const a = i * 1.9, r2 = 1.4 + (i % 3);
          g.cyl(Math.cos(a) * r2, .6, Math.sin(a) * r2, .55, .06, 7, hex(0x3f8a4a));
        }
        g.cyl(1.2, .6, -1.0, .18, .5, 5, hex(0x3f8a4a));
        g.sphere(1.2, 1.2, -1.0, .3, 5, hex(0xff8fb1));
        break;
      }
      case 'campfire': {
        g.cyl(0, 0, 0, 2.2, .25, 12, hex(0x9c8c70));
        for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; g.sphere(Math.cos(a) * 2.0, .2, Math.sin(a) * 2.0, .35, 5, hex(0x8a8378)); }
        for (let i = 0; i < 5; i++) {
          const a = i / 5 * TAU;
          g.beam(Math.cos(a) * .8, .2, Math.sin(a) * .8, 0, 1.4, 0, .18, .18, hex(0x6b4a2f));
        }
        for (const [sx, sz] of [[-2.8, 0], [2.8, 0], [0, 2.8]]) { g.box(sx, 0, sz, 1.8, .45, .5, hex(0x9a6b42)); }
        const fire = new Geo();
        fire.cone(0, 0, 0, .7, 1.6, 6, hex(0xff8c1a));
        fire.cone(0, .5, 0, .45, 1.2, 6, hex(0xffd23f));
        parts.push({ geo: fire, anim: (m, o, t) => M4.compose(m, 0, .5, 0, 0, t * 2.4, 0, 1 + Math.sin(t * 9) * .12, 1 + Math.sin(t * 7) * .18, 1) });
        break;
      }
      case 'pylon': {
        g.box(0, 0, 0, 1.6, .5, 1.6, hex(0x2b3138));
        g.cyl(0, .5, 0, .34, 5.5, 6, hex(0x3d444d));
        for (let i = 0; i < 4; i++) g.box(0, 1.4 + i * 1.2, 0, 1.5, .22, 1.5, hex([0x39c0ff, 0xff2fa0, 0x7ef0c0, 0xffd23f][i]));
        g.cone(0, 6.0, 0, .6, 1.4, 6, hex(0x39c0ff));
        g.sphere(0, 7.5, 0, .3, 6, hex(0xff2fa0));
        break;
      }
      case 'saloon': {
        const w = hex(0x9a6b42), t = hex(0x6b4a2f), sgn = hex(0xd94f3c);
        g.box(0, 0, 0, 11, 6.5, 1.2, w);
        for (let i = -4; i <= 4; i += 2) g.box(i, 0, 0, .5, 6.5, 1.3, shade(w, .85));
        g.box(0, 6.5, 0, 11.6, 1.8, 1.6, t);
        g.box(0, 7.0, -.9, 9.0, .9, .12, sgn);
        g.box(0, 2.6, -.7, 11.4, .25, 1.6, t);
        for (const sx of [-4.6, 4.6]) g.cyl(sx, 0, -1.2, .18, 2.6, 6, t);
        g.box(0, 0, -.7, 2.6, 2.4, .3, hex(0x5c4033));
        for (const sx of [-3.2, 3.2]) g.box(sx, 2.8, -.66, 1.6, 1.8, .12, hex(0xffe9a8));
        break;
      }
      case 'lights': {
        g.cyl(0, 0, 0, .16, 4.6, 6, hex(0x3d3d3d));
        g.box(0, 4.6, 0, .5, .2, .5, hex(0x3d3d3d));
        for (let k = 0; k < 3; k++) {
          const a = k / 3 * TAU;
          for (let i = 1; i < 6; i++) {
            const t = i / 6, x = Math.cos(a) * t * 4.5, z = Math.sin(a) * t * 4.5;
            const y = 4.5 - Math.sin(t * PI) * 1.1 - t * 1.4;
            g.sphere(x, y, z, .17, 5, hex([0xffd76a, 0xff8fb1, 0x7ef0c0][i % 3]));
          }
        }
        break;
      }
      case 'banner': {
        g.cyl(0, 0, 0, .16, 6.0, 6, hex(0xd8d2c4));
        g.sphere(0, 6.1, 0, .26, 6, hex(0xffd76a));
        const c = hex(0x3ba7d4);
        g.box(.9, 3.4, 0, 1.7, 2.4, .08, c);
        g.box(.9, 3.4, 0, 1.5, .5, .12, hex(0xfff4e0));
        break;
      }
      case 'maze': {
        const c = hex(0x2f7a3f);
        g.box(0, 0, 0, 3.8, 2.6, 1.2, c, 1.12, .92, .8);
        g.box(0, 2.6, 0, 3.4, .26, .9, shade(c, 1.2));
        break;
      }
    }
    return { base: g, parts };
  },

  /* ------------------------------------------------------------------
     FLAT RIDES — base + animated parts
     ------------------------------------------------------------------ */
  ride(kind, def) {
    const g = new Geo(), parts = [];
    const W = def.w * TILE, D = def.d * TILE;
    // shared foundation
    g.box(0, -.15, 0, W, .35, D, hex(0xb0a48c));
    switch (kind) {
      case 'carousel': {
        const r = 6.0;
        g.cyl(0, .2, 0, r + .5, .45, 20, hex(0xe8d9b8));
        g.cyl(0, .2, 0, r + .8, .2, 20, hex(0xd94f3c));
        g.cyl(0, .0, 0, .9, 5.2, 10, hex(0xf5f0e2));
        this.lightBulbs(g, 0, 5.4, 0, r * .9, 20, hex(0xfff3c4));
        // canopy (static)
        this.stripedRoof(g, 0, 5.2, 0, r + .6, 2.2, 20, hex(0xd94f3c), hex(0xfff4e0));
        g.sphere(0, 7.6, 0, .5, 8, hex(0xffd76a));
        this.bunting(g, 0, 5.1, 0, r + .55, hex(0xffd23f), hex(0x3ba7d4), 20);
        // spinning platform with horses
        const spin = new Geo();
        spin.cyl(0, 0, 0, r, .3, 20, hex(0xf0e6d2));
        spin.cyl(0, .3, 0, r - .1, .08, 20, hex(0xd94f3c));
        const horseCols = [0xffffff, 0xf5d0a9, 0x6b4a2f, 0xd94f3c, 0x3ba7d4, 0xffd23f];
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * TAU, hx = Math.cos(a) * (r - 1.4), hz = Math.sin(a) * (r - 1.4);
          spin.cyl(hx, .3, hz, .09, 4.8, 6, hex(0xd4af37));
          const hc = hex(horseCols[i % horseCols.length]);
          const hy = 1.5 + (i % 2) * .5;
          const m = M4.compose(M4.create(), hx, hy, hz, 0, -a + PI / 2, 0, 1, 1, 1);
          const horse = new Geo();
          horse.cbox(0, 1.0, 0, .5, .9, 1.9, hc);            // body
          horse.cbox(0, 1.5, -1.0, .42, .8, .6, hc);          // neck/head
          horse.cbox(0, 1.7, -1.35, .34, .45, .5, hc);
          for (const sx of [-.28, .28]) for (const sz of [-.6, .6]) horse.cbox(sx, .55, sz, .16, .8, .16, shade(hc, .8));
          horse.cbox(0, 1.3, .95, .12, .6, .5, shade(hc, .7));  // tail
          horse.cbox(0, 1.35, 0, .58, .18, 1.0, hex(0xd94f3c)); // saddle
