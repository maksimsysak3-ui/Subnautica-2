    let d = dd;
    if (this.complete) { d = ((d % this.length) + this.length) % this.length; }
    else d = clamp(d, 0, this.length);
    // binary search
    let lo = 0, hi = S.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (S[mid].d < d) lo = mid + 1; else hi = mid; }
    const b = S[lo], a = S[Math.max(0, lo - 1)];
    const span = (b.d - a.d) || 1, t = clamp((d - a.d) / span, 0, 1);
    return {
      p: V3.lerp({}, a.p, b.p, t),
      f: V3.norm({}, V3.lerp({}, a.f, b.f, t)),
      u: V3.norm({}, V3.lerp({}, a.u, b.u, t)),
      pitch: lerp(a.pitch, b.pitch, t),
      bank: lerp(a.bank, b.bank, t),
      lift: b.lift, brake: b.brake, launch: b.launch, boost: b.boost || 0, type: b.type, idx: lo
    };
  }
  curvatureAt(d) {
    const a = this.sampleAt(d - 2), b = this.sampleAt(d + 2);
    if (!a || !b) return { k: 0, ax: 0, ay: 0 };
    const dfx = b.f.x - a.f.x, dfy = b.f.y - a.f.y, dfz = b.f.z - a.f.z;
    const s = this.sampleAt(d);
    const r = V3.cross({}, s.f, s.u);
    const lat = (dfx * r.x + dfy * r.y + dfz * r.z) / 4;
    const ver = (dfx * s.u.x + dfy * s.u.y + dfz * s.u.z) / 4;
    return { k: Math.hypot(lat, ver), lat, ver, s };
  }
}

/* ============================================================================
   SECTION 10 — TRACK MESH GENERATION
   Rails, cross-ties, spine and automatic support structure.
   ========================================================================== */
function buildTrackGeo(track, ghostFrom) {
  const g = new Geo();
  const T = track.type;
  const railC = hex(T.rail), spineC = hex(T.spine), tieC = hex(T.tie);
  const S = track.samples;
  if (S.length < 2) return g;
  const gauge = 1.25;
  const inverted = T.style === 'inverted';
  const yOff = inverted ? 0.55 : -0.30;

  const railPt = (s, side) => {
    const r = V3.cross({}, s.f, s.u);
    return [s.p.x + r.x * side * gauge + s.u.x * yOff, s.p.y + r.y * side * gauge + s.u.y * yOff, s.p.z + r.z * side * gauge + s.u.z * yOff];
  };
  const spinePt = (s) => [s.p.x + s.u.x * (yOff - .38), s.p.y + s.u.y * (yOff - .38), s.p.z + s.u.z * (yOff - .38)];

  const step = 1;
  for (let i = 0; i + step < S.length; i += step) {
    const a = S[i], b = S[i + step];
    const c1 = a.lift ? hex(0xf0c419) : a.brake ? hex(0xff4d4d) : a.launch ? hex(0xf5c518) : a.boost ? hex(0x39c0ff) : railC;
    for (const side of [-1, 1]) {
      const pa = railPt(a, side), pb = railPt(b, side);
      g.beam(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2], .17, .17, c1, a.u.x, a.u.y, a.u.z);
    }
    if (T.style !== 'wood') {
      const sa = spinePt(a), sb = spinePt(b);
      g.beam(sa[0], sa[1], sa[2], sb[0], sb[1], sb[2], .34, .34, spineC, a.u.x, a.u.y, a.u.z);
    }
    // cross ties
    if (i % 3 === 0) {
      const pa = railPt(a, -1), pb = railPt(a, 1);
      g.beam(pa[0], pa[1], pa[2], pb[0], pb[1], pb[2], .14, T.style === 'wood' ? .22 : .14, tieC, a.u.x, a.u.y, a.u.z);
      if (T.style !== 'wood') {
        const sp = spinePt(a);
        g.beam((pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2, (pa[2] + pb[2]) / 2, sp[0], sp[1], sp[2], .12, .12, tieC);
      }
    }
    // chain lift dogs
    if (a.lift && i % 4 === 0) {
      const mp = [(railPt(a, -1)[0] + railPt(a, 1)[0]) / 2, (railPt(a, -1)[1] + railPt(a, 1)[1]) / 2, (railPt(a, -1)[2] + railPt(a, 1)[2]) / 2];
      g.box(mp[0], mp[1] - .1, mp[2], .3, .2, .3, hex(0x555b63));
    }
  }
  // ---- supports ----
  const supC = hex(T.style === 'wood' ? 0x7a5230 : 0xb9c1c9);
  let lastSupport = -99;
  for (let i = 0; i < S.length; i += 2) {
    const s = S[i];
    if (s.d - lastSupport < (T.style === 'wood' ? 6 : 9)) continue;
    const gy = WORLD.hAt(s.p.x, s.p.z);
    const topY = s.p.y + (inverted ? 1.6 : -0.8);
    if (topY - gy < 1.2) continue;
    lastSupport = s.d;
    const h = topY - gy;
    if (T.style === 'wood') {
      // A-frame timber bent
      const r = V3.cross({}, s.f, s.u);
      const spread = Math.min(1.2 + h * .16, 5);
      for (const side of [-1, 1]) {
        g.beam(s.p.x + r.x * side * spread, gy, s.p.z + r.z * side * spread, s.p.x + r.x * side * .9, topY, s.p.z + r.z * side * .9, .3, .3, supC);
      }
      for (let y = gy + 2.5; y < topY - 1; y += 3.0) {
        const t = (y - gy) / h, sp = lerp(spread, .9, t);
        g.beam(s.p.x + r.x * sp, y, s.p.z + r.z * sp, s.p.x - r.x * sp, y, s.p.z - r.z * sp, .22, .22, shade(supC, .9));
      }
      g.box(s.p.x, gy - .2, s.p.z, spread * 2.4, .4, 1.6, hex(0x8a8378));
    } else {
      g.cyl(s.p.x, gy, s.p.z, .34, h, 8, supC);
      g.cyl(s.p.x, gy, s.p.z, .8, .5, 8, hex(0x9aa4ae));
      if (h > 8) {
        const r = V3.cross({}, s.f, s.u);
        for (const side of [-1, 1]) {
          g.beam(s.p.x, gy + h * .45, s.p.z, s.p.x + r.x * side * 3.4, gy, s.p.z + r.z * side * 3.4, .2, .2, supC);
          g.cyl(s.p.x + r.x * side * 3.4, gy, s.p.z + r.z * side * 3.4, .5, .4, 6, hex(0x9aa4ae));
        }
      }
      if (inverted) {
        const r = V3.cross({}, s.f, s.u);
        g.beam(s.p.x, topY, s.p.z, s.p.x, s.p.y + 1.0, s.p.z, .26, .26, supC);
      }
    }
  }
  return g;
}

/* Ghost preview geometry for a candidate piece */
function buildGhostGeo(track, samples, ok) {
  const g = new Geo();
  const c = ok ? [.45, 1, .7] : [1, .4, .4];
  const gauge = 1.25;
  for (let i = 0; i + 1 < samples.length; i++) {
    const a = samples[i], b = samples[i + 1];
    const ra = V3.cross({}, a.f, a.u), rb = V3.cross({}, b.f, b.u);
    for (const side of [-1, 1]) {
      g.beam(a.p.x + ra.x * side * gauge, a.p.y + ra.y * side * gauge, a.p.z + ra.z * side * gauge,
        b.p.x + rb.x * side * gauge, b.p.y + rb.y * side * gauge, b.p.z + rb.z * side * gauge, .18, .18, c);
    }
    if (i % 4 === 0) {
      g.beam(a.p.x + ra.x * gauge, a.p.y + ra.y * gauge, a.p.z + ra.z * gauge,
        a.p.x - ra.x * gauge, a.p.y - ra.y * gauge, a.p.z - ra.z * gauge, .12, .12, c);
      const gy = WORLD.hAt(a.p.x, a.p.z);
      if (a.p.y - gy > 1) g.beam(a.p.x, gy, a.p.z, a.p.x, a.p.y - .6, a.p.z, .1, .1, [c[0] * .7, c[1] * .7, c[2] * .7]);
    }
  }
  return g;
}

/* Train car geometry for a coaster type */
function buildCarGeo(T, isFront) {
  const g = new Geo();
  const c = hex(T.carColor);
  const inverted = T.style === 'inverted';
  const yb = inverted ? -1.9 : 0.05;

  g.box(0, yb - .25, 0, 1.5, .3, 3.6, hex(0x33383f));
  // body
  g.box(0, yb, 0, 1.9, 1.05, 3.5, c);
  g.box(0, yb + 1.05, 0, 1.75, .16, 3.3, shade(c, 1.25));

  if (isFront) {
    g.triV([-.95, yb + 1.05, -1.75], [.95, yb + 1.05, -1.75], [0, yb + .45, -2.9], shade(c, 1.15));
    g.triV([-.95, yb, -1.75], [0, yb + .45, -2.9], [.95, yb, -1.75], shade(c, .8));
    g.triV([-.95, yb, -1.75], [-.95, yb + 1.05, -1.75], [0, yb + .45, -2.9], shade(c, .9));
    g.triV([.95, yb, -1.75], [0, yb + .45, -2.9], [.95, yb + 1.05, -1.75], shade(c, .9));
    g.sphere(0, yb + .55, -2.5, .18, 6, hex(0xfff0b0));
  }
  // seats + restraints
  for (let i = 0; i < 2; i++) {
    const z = -0.75 + i * 1.5;
    g.box(0, yb + .35, z + .5, 1.55, .55, .5, hex(0x2b3138));
    for (const sx of [-.42, .42]) {
      g.box(sx, yb + .5, z, .55, .55, .7, hex(0x3d444d));
      g.beam(sx - .3, yb + 1.35, z - .1, sx + .3, yb + 1.35, z - .1, .1, .1, hex(0xd8d8d8));
      g.beam(sx - .3, yb + 1.35, z - .1, sx - .3, yb + .75, z + .35, .09, .09, hex(0xd8d8d8));
      g.beam(sx + .3, yb + 1.35, z - .1, sx + .3, yb + .75, z + .35, .09, .09, hex(0xd8d8d8));
    }
  }
  // wheel assemblies gripping the rail
  for (const sz of [-1.3, 1.3]) for (const sx of [-1, 1]) {
    g.box(sx * 1.25, yb - .45, sz, .34, .55, .8, hex(0x4a5058));
    g.cyl(sx * 1.25, yb - .55, sz, .26, .18, 8, hex(0x22262b));
  }
  if (inverted) {
    for (const sz of [-1.2, 1.2]) g.beam(0, yb + 1.2, sz, 0, .3, sz, .3, .8, hex(0x9aa4ae));
  }
  return g;
}
/* ============================================================================
   SECTION 11 — PARK OBJECTS
   ========================================================================== */
let NEXT_ID = 1;

class ParkObject {
  constructor(kind, def, i, j, rot) {
    this.id = NEXT_ID++;
    this.kind = kind;             // shop | scenery | ride | coaster
    this.def = def;
    this.i = i; this.j = j; this.rot = rot || 0;
    this.w = def.w || 1; this.d = def.d || 1;
    const rotated = (this.rot % 2) === 1;
    this.gw = rotated ? this.d : this.w;
    this.gd = rotated ? this.w : this.d;
    this.x = WORLD.wx(i) + (this.gw - 1) * TILE / 2;
    this.z = WORLD.wz(j) + (this.gd - 1) * TILE / 2;
    this.y = 0;
    this.mesh = null; this.parts = [];
    this.matrix = M4.create();
    this.spin = 0; this.h = 0; this.phase = 0;
    this.built = Park.time;
  }
  footprint(cb) { for (let jj = this.j; jj < this.j + this.gd; jj++) for (let ii = this.i; ii < this.i + this.gw; ii++) cb(ii, jj); }
  updateMatrix() { M4.compose(this.matrix, this.x, this.y, this.z, 0, -this.rot * PI / 2, 0, 1, 1, 1); }
}

class Shop extends ParkObject {
  constructor(def, i, j, rot) {
    super('shop', def, i, j, rot);
    this.price = def.price;
    this.stock = 100;
    this.served = 0; this.revenue = 0;
    this.queue = [];
    this.name = def.name;
  }
  get frontTile() {
    const dir = [[0, -1], [-1, 0], [0, 1], [1, 0]][this.rot];
    return { i: this.i + Math.floor(this.gw / 2) + dir[0], j: this.j + Math.floor(this.gd / 2) + dir[1] };
  }
  /* The counter, one tile in front of the shop's serving face */
  get entrance() {
    const a = -this.rot * PI / 2;
    const off = (this.gd * TILE) / 2 + 1.8;
    return { x: this.x + Math.sin(a) * off, z: this.z - Math.cos(a) * off };
  }
}

class Ride extends ParkObject {
  constructor(def, i, j, rot) {
    super('ride', def, i, j, rot);
    this.name = def.name;
    this.price = def.price;
    this.cap = def.cap;
    this.dur = def.dur;
    this.excitement = def.exc; this.intensity = def.fear; this.nausea = def.naus;
    this.state = 'idle';         // idle | loading | running | unloading | broken
    this.timer = 0;
    this.riders = [];
    this.queue = [];
    this.ridden = 0; this.revenue = 0;
    this.reliability = 0.92 + Math.random() * 0.07;
    this.wear = 0;
    this.broken = false;
    this.openR = true;
    this.spin = 0; this.h = 0;
    this.queueTiles = [];
  }
  get entrance() {
    const a = -this.rot * PI / 2;
    const off = (this.gd * TILE) / 2 + 1.4;
    return { x: this.x + Math.sin(a) * off, z: this.z - Math.cos(a) * off };
  }
  ratingFor(g) {
    // Guests prefer rides matching their intensity preference
    const dI = Math.abs(this.intensity - g.prefIntensity);
    const dN = Math.max(0, this.nausea - g.nauseaTol);
    return clamp(this.excitement * 1.25 - dI * .75 - dN * .7, 0, 12);
  }
  update(dt) {
    if (this.broken) { return; }
    this.wear += dt * 0.0009 * (1 + this.ridden * 0.0004);
    switch (this.state) {
      case 'idle':
        if (!this.openR) break;
        this.state = 'loading'; this.timer = 6; break;
      case 'loading':
        this.timer -= dt;
        while (this.riders.length < this.cap && this.queue.length) {
          const g = this.queue.shift();
          if (!g || g.dead) continue;
          g.boardRide(this);
          this.riders.push(g);
        }
        if (this.timer <= 0) {
          if (this.riders.length === 0) { this.state = 'idle'; this.timer = 3; break; }
          if (Math.random() > this.reliability - this.wear) { this.breakDown(); break; }
          this.state = 'running'; this.timer = this.dur / Park.rideSpeedup;
          this.spinTarget = 1;
          Park.money += this.riders.length * this.price;
          this.revenue += this.riders.length * this.price;
          Park.log.ticket += this.riders.length * this.price;
        }
        break;
      case 'running': {
        this.timer -= dt;
        const p = 1 - this.timer / (this.dur / Park.rideSpeedup);
        const env = Math.min(1, Math.min(p, 1 - p) * 6);
        this.spin += dt * 1.4 * env * (this.def.kind === 'teacup' ? 2.2 : 1);
        if (this.def.kind === 'drop') {
          const c = (p * 3) % 1;
          this.h = c < .6 ? smoothstep(c / .6) : 1 - smoothstep((c - .6) / .4) ** 0.35;
        } else if (this.def.kind === 'tower') {
          this.h = smoothstep(clamp(Math.sin(p * PI) * 1.4, 0, 1));
        } else if (this.def.kind === 'pirate') {
          this.spin = Math.sin(Park.now * 1.4) * (0.35 + env * 0.75);
        } else if (this.def.kind === 'swing' || this.def.kind === 'balloonride' || this.def.kind === 'gravitron') {
          this.h = env;
        } else if (this.def.kind === 'enterprise') {
          this.h = smoothstep(clamp((p - .18) / .35, 0, 1)) * (p > .8 ? 1 - smoothstep((p - .8) / .2) : 1);
        } else if (this.def.kind === 'topspin' || this.def.kind === 'frisbee') {
          this.h = env;
          this.spin += dt * 1.1 * env;
        } else if (this.def.kind === 'haunted' || this.def.kind === 'rapids') {
          this.spin = 0; this.h = 0;
        }
        if (this.timer <= 0) { this.state = 'unloading'; this.timer = 4; }
        break;
      }
      case 'unloading':
        this.timer -= dt;
        this.spin *= (1 - dt * 1.2);
        this.h *= (1 - dt * 1.5);
        if (this.timer <= 0) {
          for (const g of this.riders) g.finishRide(this);
          this.ridden += this.riders.length;
          this.riders.length = 0;
          this.state = 'idle';
        }
        break;
      case 'broken':
        break;
    }
  }
  breakDown() {
    this.broken = true; this.state = 'broken';
    for (const g of this.riders) g.finishRide(this, true);
    this.riders.length = 0;
    UI.notify('Breakdown!', this.name + ' has broken down. A mechanic is needed.', 'bad');
    Park.needMechanic.push(this);
  }
  repair() {
    this.broken = false; this.wear = 0; this.state = 'idle';
    const k = Park.needMechanic.indexOf(this); if (k >= 0) Park.needMechanic.splice(k, 1);
  }
}

class CoasterRide extends ParkObject {
  constructor(type, i, j, rot) {
    super('coaster', { w: 4, d: 3, name: type.name }, i, j, rot);
    this.type = type;
    this.name = type.name + ' ' + (Park.coasterCount + 1);
    this.track = null;
    this.trains = [];
    this.price = 9;
    this.state = 'building';    // building | testing | open | closed | broken
    this.excitement = 0; this.intensity = 0; this.nausea = 0;
    this.queue = [];
    this.ridden = 0; this.revenue = 0;
    this.tested = false;
    this.reliability = .95;
    this.wear = 0; this.broken = false;
    this.trackMesh = null; this.carMesh = null; this.frontMesh = null;
    this.stationMesh = null;
    this.maxSpeed = 0; this.maxG = 0; this.minG = 0; this.maxLatG = 0;
    this.openR = false;
    this.cap = type.cars * type.seat;
  }
  get entrance() {
    const a = -this.rot * PI / 2;
    return { x: this.x + Math.sin(a) * 6, z: this.z - Math.cos(a) * 6 };
  }
  ratingFor(g) {
    const dI = Math.abs(this.intensity - g.prefIntensity);
    const dN = Math.max(0, this.nausea - g.nauseaTol);
    return clamp(this.excitement * 1.35 - dI * .8 - dN * .8, 0, 14);
  }
  computeStats() {
    const t = this.track; if (!t || !t.complete) return;
    // Simulate a lap to gather speed / G data
    let v = 4, d = 0, maxV = 0, maxG = -99, minG = 99, maxLat = 0, air = 0, samples = 0, stall = 0;
    const dt = 0.02;
    const profile = [];
    let rideTime = 0, vSum = 0, lastProfileD = -99;
    let dropStartY = null, lastY = null, drops = [], banked = 0, bankSum = 0;
    for (let step = 0; step < 20000 && d < t.length * 1.02; step++) {
      const s = t.sampleAt(d);
      if (!s) break;
      const approach = d > t.length - 30;           // drive tyres into the station
      if (approach) v = damp(v, 5.0, 3, dt);
      else if (s.lift) v = Math.max(v, 6.5);
      else if (s.boost) v = v < s.boost ? Math.min(s.boost, v + 11 * dt) : damp(v, s.boost, 3, dt);
      else if (s.launch) v = Math.min(this.type.maxSpeed, v + 26 * dt);
      else if (s.brake) v = Math.max(4.5, v - 9 * dt);
      else {
        v += (-G * Math.sin(s.pitch) - this.type.fric * v * v - 0.07) * dt;
      }
      if (v < 0.6) { v = 0.6; if (!s.lift && !s.brake && !s.launch && !s.boost && !approach) stall += dt; }
      const c = t.curvatureAt(d);
      const centri = v * v * (c.ver || 0);
      const vertG = Math.cos(s.pitch) * Math.cos(s.bank) + centri / G;
      const latG = Math.abs(v * v * (c.lat || 0) / G - Math.sin(s.bank) * 1.0);
      maxV = Math.max(maxV, v); maxG = Math.max(maxG, vertG); minG = Math.min(minG, vertG);
      maxLat = Math.max(maxLat, latG);
      if (vertG < 0.25 && v > 2.5) air += dt;
      samples++; rideTime += dt; vSum += v;
      // profile sample every couple of metres for the report chart
      if (d - lastProfileD > 2) {
        lastProfileD = d;
        profile.push({ d, y: s.p.y - this.y, v, gv: vertG, gl: latG });
      }
      if (Math.abs(s.bank) > 12 * DEG) { banked += dt; bankSum += Math.abs(s.bank); }
      // track descents so we can report the drops like a real ride sheet
      if (lastY !== null) {
        if (s.p.y < lastY - 0.01) { if (dropStartY === null) dropStartY = lastY; }
        else if (dropStartY !== null) {
          const h = dropStartY - lastY;
          if (h > 3) drops.push(h);
          dropStartY = null;
        }
      }
      lastY = s.p.y;
      d += v * dt;
    }
    this.maxSpeed = maxV; this.maxG = maxG; this.minG = minG; this.maxLatG = maxLat;
    this.airtime = air;
    this.stallTime = stall;
    this.stalls = stall > 3.0;
    if (dropStartY !== null && lastY !== null && dropStartY - lastY > 3) drops.push(dropStartY - lastY);
    drops.sort((a, b) => b - a);
    this.profile = profile;
    this.rideTime = rideTime;
    this.avgSpeed = samples ? vSum / samples : 0;
    this.drops = drops;
    this.biggestDrop = drops.length ? drops[0] : 0;
    this.bankedFraction = rideTime ? banked / rideTime : 0;
    this.avgBank = banked ? bankSum / (banked / dt) : 0;
    const dwell = 14;
    this.throughput = Math.round(this.cap * Math.max(1, this.trains.length || 1) * 3600 / Math.max(20, rideTime + dwell));
    this.prestige = Math.round(clamp(this.excitement * 6 + t.inversions * 4 + this.biggestDrop * .7 + t.length * .02, 0, 200));
    const L = t.length, drop = t.drop, inv = t.inversions;
    let exc = 0;
    exc += clamp(maxV / 6, 0, 8);
    exc += clamp(drop / 8, 0, 6);
    exc += inv * 1.35;
    exc += clamp(air * 1.6, 0, 4);
    exc += clamp(L / 220, 0, 3);
    exc += clamp(t.pieces.filter(p => PIECE_BY_ID[p].y !== 0).length * .07, 0, 2.5);
    let inten = clamp(Math.max(0, maxG - 1) * 1.5 + maxLat * 1.6 + inv * .9 + maxV / 12, 0, 12);
    let naus = clamp(inv * 1.1 + maxLat * 1.9 + Math.max(0, -minG) * 2.2 + (t.pieces.filter(p => p.indexOf('helix') === 0).length) * .9, 0, 12);
    // brutal rides scare guests off
    if (inten > 9) exc *= .8;
    if (maxG > 6) { exc *= .6; inten += 2; }
    // soft-compress the raw scores: a 14 should be a once-in-a-park ride
    const soften = (raw, scale) => 14 * (1 - Math.exp(-Math.max(0, raw) / scale));
    this.excitement = clamp(soften(exc, 8.5), 0, 14);
    this.intensity = clamp(soften(inten, 7.0), 0, 14);
    this.nausea = clamp(soften(naus, 7.0), 0, 14);
    this.price = clamp(Math.round(2 + this.excitement * 1.05), 2, 26);
  }
  repair() {
    this.broken = false; this.wear = 0;
    this.state = this.openR ? 'open' : 'closed';
    const k = Park.needMechanic.indexOf(this); if (k >= 0) Park.needMechanic.splice(k, 1);
  }
  elementCensus() {
    const t = this.track, out = {};
    if (!t) return out;
    for (const id of t.pieces) {
      const def = PIECE_BY_ID[id];
      if (!def) continue;
      out[def.n] = (out[def.n] || 0) + 1;
    }
    return out;
  }
  spawnTrains(n) {
    this.trains.length = 0;
    const T = this.type;
    const carLen = 4.2;
    for (let k = 0; k < n; k++) {
      this.trains.push({
        d: -k * (T.cars * carLen + 8), v: 0, riders: [], state: 'station', timer: 3,
        cars: new Array(T.cars).fill(0).map((_, i) => ({ off: -i * carLen, m: M4.create() })),
        g: 1, lat: 0
      });
    }
  }
}

/* ============================================================================
   SECTION 12 — PARK STATE
   ========================================================================== */
const Park = {
  money: 60000,
  guests: [], staff: [], objects: [], coasters: [], litter: [],
  rating: 0, happiness: .7, entryFee: 12,
  time: 9 * 60, day: 1, hourF: 9,
  now: 0, speed: 1, paused: false,
  rideSpeedup: 1,
  coasterCount: 0,
  needMechanic: [],
  totalGuests: 0, admissions: 0,
  log: { ticket: 0, shop: 0, entry: 0, wage: 0, upkeep: 0, build: 0 },
  hist: [],
  marketing: 0,
  research: { unlocked: {} },
  awards: [],
  selected: null,
  maxGuests: 480,

  reset() {
    this.money = 60000; this.guests.length = 0; this.staff.length = 0;
    this.objects.length = 0; this.coasters.length = 0; this.litter.length = 0;
    this.time = 9 * 60; this.day = 1; this.now = 0; this.totalGuests = 0;
  },
  spend(n, what) {
    this.money -= n; this.log.build += n;
    UI.flashMoney(-n);
    return true;
  },
  earn(n, cat) { this.money += n; if (cat) this.log[cat] = (this.log[cat] || 0) + n; },

  objAt(i, j) {
    const id = WORLD.ownerOf(i, j);
    if (id < 0) return null;
    return this.objects.find(o => o.id === id) || this.coasters.find(o => o.id === id) || null;
  },
  attractions() { return this.objects.filter(o => o.kind === 'ride').concat(this.coasters.filter(c => c.state === 'open')); },
  addObject(o) {
    this.objects.push(o);
    o.footprint((i, j) => { WORLD.setT(i, j, T_BUILD); WORLD.setOwn(i, j, o.id); });
    WORLD.dirty = true;
    Path.dirty = true;
  },
  removeObject(o) {
    o.footprint((i, j) => { WORLD.setT(i, j, T_GRASS); WORLD.setOwn(i, j, -1); });
    let k = this.objects.indexOf(o); if (k >= 0) this.objects.splice(k, 1);
    k = this.coasters.indexOf(o); if (k >= 0) this.coasters.splice(k, 1);
    if (o.mesh) o.mesh.dispose();
    if (o.trackMesh) o.trackMesh.dispose();
    for (const g of this.guests) { if (g.target === o) g.retarget(); }
    WORLD.dirty = true; Path.dirty = true;
  },

  /* Park value & rating -------------------------------------------------- */
  /* The path component the entrance belongs to — the park proper. */
  mainComponent: 0,
  mainSpot() {
    if (this._mainSpot && this._mainSpotV === Path.version) return this._mainSpot;
    const c = N >> 1;
    const n = Path.nearestWalkable(c, c + 18, 12) || Path.nearestWalkable(c, c, 30);
    const spot = n ? { x: WORLD.wx(n.i), z: WORLD.wz(n.j) } : { x: 0, z: 0 };
    this.mainComponent = n ? Path.comp[n.j * N + n.i] : -1;
    this._mainSpot = spot; this._mainSpotV = Path.version;
    return spot;
  },
  computeRating() {
    const atts = this.attractions();
    let score = 0;
    score += Math.min(atts.length * 3.5, 45);
    let exc = 0; for (const a of atts) exc += a.excitement;
    score += Math.min(exc * 0.9, 30);
    score += Math.min(this.beauty * .012, 22);
    const shops = this.objects.filter(o => o.kind === 'shop').length;
    score += Math.min(shops * 1.6, 14);
    score -= Math.min(this.litter.length * .12, 16);
    score += (this.happiness - .5) * 30;
    const janitors = this.staff.filter(s => s.role === 'janitor').length;
    score += Math.min(janitors * 1.1, 6);
    this.rating = clamp(Math.round(score), 0, 999);
  },
  get beauty() {
    let b = 0;
    for (const o of this.objects) if (o.kind === 'scenery') b += o.def.beauty;
    return b;
  },
  beautyAt(x, z, r = 22) {
    let b = 0;
    for (const o of this.objects) {
      if (o.kind !== 'scenery') continue;
      const d2 = dist2(x, z, o.x, o.z);
      if (d2 < r * r) b += o.def.beauty * (1 - Math.sqrt(d2) / r);
    }
    return b;
  },
  upkeepPerHour() {
    let u = 0;
    for (const o of this.objects) u += (o.def.up || 0);
    for (const c of this.coasters) u += 40 + (c.track ? c.track.length * .12 : 0);
    for (const s of this.staff) u += s.wage;
    return u;
  }
};

/* ============================================================================
   SECTION 13 — PATHFINDING
   BFS flow-fields over walkable tiles. One field per destination is far too
   costly, so we use A* with a cached neighbour table and short paths.
   ========================================================================== */
const Path = {
  walk: new Uint8Array(N * N),
  dirty: true,
  open: new Int32Array(N * N),
  came: new Int32Array(N * N),
  gScore: new Float32Array(N * N),
  visited: new Int32Array(N * N),
  stamp: 1,

  comp: new Int32Array(N * N),
  version: 0,
  queueBuf: new Int32Array(N * N),

  rebuild() {
    for (let k = 0; k < N * N; k++) {
      const t = WORLD.type[k];
      this.walk[k] = (t === T_PATH || t === T_QUEUE || t === T_PLAZA || t === T_ENTRY) ? 1 : 0;
    }
    // Flood-fill connected components so unreachable targets can be rejected
    // instantly instead of burning a full A* search per guest per decision.
    this.comp.fill(-1);
    const q = this.queueBuf;
    let label = 0;
    for (let start = 0; start < N * N; start++) {
      if (this.walk[start] !== 1 || this.comp[start] !== -1) continue;
      let head = 0, tail = 0;
      q[tail++] = start; this.comp[start] = label;
      while (head < tail) {
        const k = q[head++], i = k % N, j = (k / N) | 0;
        for (let d = 0; d < 4; d++) {
          const ni = i + [1, -1, 0, 0][d], nj = j + [0, 0, 1, -1][d];
          if (ni < 0 || nj < 0 || ni >= N || nj >= N) continue;
          const nk = nj * N + ni;
          if (this.walk[nk] !== 1 || this.comp[nk] !== -1) continue;
          this.comp[nk] = label; q[tail++] = nk;
        }
      }
      label++;
    }
    this.components = label;
    this.version++;
    this.dirty = false;
  },
  /* Component id of the walkable tile at (or nearest to) a world position. */
  compAt(x, z) {
    if (this.dirty) this.rebuild();
    const n = this.nearestWalkable(WORLD.ti(x), WORLD.tj(z), 4);
    return n ? this.comp[n.j * N + n.i] : -1;
  },
  connected(x1, z1, x2, z2) {
    const a = this.compAt(x1, z1);
    if (a < 0) return false;
    return a === this.compAt(x2, z2);
  },
  walkable(i, j) { return i >= 0 && j >= 0 && i < N && j < N && this.walk[j * N + i] === 1; },
  nearestWalkable(i, j, maxR = 8) {
    if (this.walkable(i, j)) return { i, j };
    for (let r = 1; r <= maxR; r++) {
      for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
        if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
        if (this.walkable(i + di, j + dj)) return { i: i + di, j: j + dj };
      }
    }
    return null;
  },
  /* A* returning an array of world-space waypoints */
  find(si, sj, ti, tj, limit = 4000) {
    if (this.dirty) this.rebuild();
    if (!this.walkable(si, sj)) { const n = this.nearestWalkable(si, sj); if (!n) return null; si = n.i; sj = n.j; }
    if (!this.walkable(ti, tj)) { const n = this.nearestWalkable(ti, tj); if (!n) return null; ti = n.i; tj = n.j; }
    if (si === ti && sj === tj) return [];
    if (this.comp[sj * N + si] !== this.comp[tj * N + ti]) return null;   // different islands
    const S = ++this.stamp;
    const start = sj * N + si, goal = tj * N + ti;
    // binary min-heap of [priority, tile]
    const hk = [], hv = [];
    const push = (v, k) => {
      hk.push(k); hv.push(v);
      let c = hk.length - 1;
      while (c > 0) { const p = (c - 1) >> 1; if (hv[p] <= hv[c]) break; [hv[p], hv[c]] = [hv[c], hv[p]]; [hk[p], hk[c]] = [hk[c], hk[p]]; c = p; }
    };
    const pop = () => {
      const top = hk[0];
      const lk = hk.pop(), lv = hv.pop();
      if (hk.length) {
        hk[0] = lk; hv[0] = lv;
        let c = 0;
        for (;;) {
          const l = c * 2 + 1, r = l + 1; let m = c;
          if (l < hv.length && hv[l] < hv[m]) m = l;
          if (r < hv.length && hv[r] < hv[m]) m = r;
          if (m === c) break;
          [hv[m], hv[c]] = [hv[c], hv[m]]; [hk[m], hk[c]] = [hk[c], hk[m]]; c = m;
        }
      }
      return top;
    };
    this.gScore[start] = 0; this.came[start] = -1; this.visited[start] = S;
    push(0, start);
    let count = 0;
    const H = (k) => { const i = k % N, j = (k / N) | 0; return Math.abs(i - ti) + Math.abs(j - tj); };
    while (hk.length && count++ < limit) {
      const cur = pop();
      if (cur === goal) {
        const out = [];
        let k = cur;
        while (k !== -1) { out.push({ i: k % N, j: (k / N) | 0 }); k = this.came[k]; }
        out.reverse();
        return out.map(p => ({ x: WORLD.wx(p.i) + (Math.random() - .5) * 1.6, z: WORLD.wz(p.j) + (Math.random() - .5) * 1.6 }));
      }
      const ci = cur % N, cj = (cur / N) | 0;
      const g0 = this.gScore[cur];
      for (let d = 0; d < 4; d++) {
        const ni = ci + [1, -1, 0, 0][d], nj = cj + [0, 0, 1, -1][d];
        if (!this.walkable(ni, nj)) continue;
        const nk = nj * N + ni;
        const isQ = WORLD.type[nk] === T_QUEUE;
        const cost = g0 + (isQ ? 3.2 : 1);
        if (this.visited[nk] === S && this.gScore[nk] <= cost) continue;
        this.visited[nk] = S; this.gScore[nk] = cost; this.came[nk] = cur;
        push(cost + H(nk) * 1.05, nk);
      }
    }
    return null;
  }
};
/* ============================================================================
   SECTION 14 — PEOPLE
   Low-poly humanoids assembled from 10 instanced boxes with a procedural
   walk cycle, plus a needs-driven behaviour tree.
   ========================================================================== */
const SKIN = [0xf2c9a0, 0xe8b184, 0xc98d5f, 0x8d5a35, 0x5f3a20, 0xf7dcc0];
const SHIRT = [0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f, 0x9b59b6, 0xe67e22, 0x1abc9c, 0xecf0f1, 0x34495e, 0xff6f91, 0x7ed6df, 0xf6b93b];
const PANTS = [0x2c3e50, 0x34495e, 0x7f8c8d, 0x2980b9, 0x8e44ad, 0x27ae60, 0x795548, 0x455a64];
const HAIR = [0x2b1b0e, 0x4a2c14, 0x7a4a1e, 0xc79a3a, 0x1a1a1a, 0xa03030, 0xd9d9d9, 0x5b3a1a];

const FIRST = ['Ava', 'Liam', 'Mia', 'Noah', 'Zoe', 'Kai', 'Elle', 'Finn', 'Ivy', 'Milo', 'Nora', 'Otto', 'Remy', 'Sage', 'Theo', 'Wren', 'Juno', 'Cleo', 'Dax', 'Pip', 'Rosa', 'Hugo', 'Iris', 'Jonas', 'Lena', 'Bruno', 'Suki', 'Tariq', 'Nina', 'Oscar'];
const LAST = ['Vale', 'Marsh', 'Quill', 'Rook', 'Stone', 'Frost', 'Harlow', 'Bell', 'Crane', 'Doyle', 'Ember', 'Grove', 'Hale', 'Kerr', 'Lark', 'Mint', 'North', 'Pike', 'Ridge', 'Swift'];

class Person {
  constructor(x, z) {
    this.id = NEXT_ID++;
    this.x = x; this.z = z; this.y = WORLD.hAt(x, z);
    this.yaw = rnd(TAU); this.yawT = this.yaw;
    this.vx = 0; this.vz = 0;
    this.speed = 3.0 + rnd(-.5, .9);
    this.phase = rnd(TAU);
    this.path = null; this.pi = 0;
    this.height = rnd(.9, 1.12);
    this.skin = pick(SKIN); this.shirt = pick(SHIRT); this.pants = pick(PANTS); this.hair = pick(HAIR);
    this.name = pick(FIRST) + ' ' + pick(LAST);
    this.anim = 0; this.bob = 0;
    this.dead = false;
    this.state = 'idle';
    this.riding = null;
    this.sitT = 0;
    this.armLift = 0;
    this.moodT = 0;
  }
  canReach(x, z) { return Path.connected(this.x, this.z, x, z); }
  goto(tx, tz) {
    const si = WORLD.ti(this.x), sj = WORLD.tj(this.z);
    const ti = WORLD.ti(tx), tj = WORLD.tj(tz);
    const p = Path.find(si, sj, ti, tj);
    if (!p) { this.path = null; return false; }
    p.push({ x: tx, z: tz });
    this.path = p; this.pi = 0;
    return true;
  }
  followPath(dt, speedMul = 1) {
    if (!this.path || this.pi >= this.path.length) { this.moving = false; return true; }
    const wp = this.path[this.pi];
    const dx = wp.x - this.x, dz = wp.z - this.z;
    const d = Math.hypot(dx, dz);
    if (d < 1.0) { this.pi++; return this.pi >= this.path.length; }
    const sp = this.speed * speedMul;
    const nx = dx / d, nz = dz / d;
    this.x += nx * sp * dt; this.z += nz * sp * dt;
    this.yawT = Math.atan2(nz, nx);
    this.anim += dt * sp * 1.75;
    this.moving = true;
    return false;
  }
  physUpdate(dt) {
    this.yaw = angLerp(this.yaw, this.yawT, 1 - Math.exp(-11 * dt));
    const gy = WORLD.hAt(this.x, this.z);
    this.y = damp(this.y, gy, 12, dt);
    if (!this.moving) this.anim = damp(this.anim, Math.round(this.anim / PI) * PI, 8, dt);
  }
  /* Write this person's body-part instances into the crowd buffer.
     Limbs pivot at the shoulder/hip: the instanced box is centre-origin, so
     each limb's centre is derived from its pivot and swing angle. */
  writeInstances(buf, o, t) {
    const H = this.height;
    const walking = this.moving ? 1 : 0;
    const sw = walking ? Math.sin(this.anim) : 0;
    const bounce = walking ? Math.abs(Math.sin(this.anim * 2)) * .05 : Math.sin(t * 2 + this.phase) * .012;
    const sitting = this.state === 'sitting' || this.state === 'riding';
    const root = M4.create();
    // Height scales the whole figure uniformly: scaling only Y would pull the
    // limbs (whose positions come from sin/cos of the swing) out of their sockets.
    M4.compose(root, this.x, this.y + bounce * H, this.z, 0, -this.yaw + PI / 2, this.roll || 0, H, H, H);
    const tmp = M4.create(), out = M4.create();

    const put = (px, py, pz, rx, sx, sy, sz, col) => {
      M4.compose(tmp, px, py, pz, rx, 0, 0, sx, sy, sz);
      M4.mul(out, root, tmp);
      for (let k = 0; k < 16; k++) buf[o + k] = out[k];
      buf[o + 16] = col[0]; buf[o + 17] = col[1]; buf[o + 18] = col[2]; buf[o + 19] = 0;
      o += INST_STRIDE;
    };
    /* a limb hanging from a pivot, swung by `ang` about the X axis */
    const limb = (px, pivotY, pz, ang, len, w, d, col) => {
      const cy = pivotY - Math.cos(ang) * len / 2;
      const cz = pz + Math.sin(ang) * len / 2;
      put(px, cy, cz, ang, w, len, d, col);
      return { y: pivotY - Math.cos(ang) * len, z: pz + Math.sin(ang) * len };
    };

    const skin = hex(this.skin), shirt = hex(this.shirt), pants = hex(this.pants), hair = hex(this.hair);
    const lean = sitting ? .18 : (walking ? .06 : 0);
    const drop = sitting ? -.30 : 0;                       // hips sink when seated

    // ---- legs (hip pivot at 0.88) ----
    const hipY = 0.88 + drop;
    const thighA = sitting ? -1.45 : sw * .62;
    const thighB = sitting ? -1.45 : -sw * .62;
    const kneeA = limb(-.13, hipY, 0, thighA, .46, .20, .22, pants);
    const kneeB = limb(.13, hipY, 0, thighB, .46, .20, .22, pants);
    const shinA = sitting ? 0 : thighA * .45;
    const shinB = sitting ? 0 : thighB * .45;
    const ankA = limb(-.13, kneeA.y, kneeA.z, shinA, .44, .19, .21, pants);
    const ankB = limb(.13, kneeB.y, kneeB.z, shinB, .44, .19, .21, pants);
    put(-.13, ankA.y + .05, ankA.z + .07, 0, .22, .13, .34, hex(0x2b2b2b));
    put(.13, ankB.y + .05, ankB.z + .07, 0, .22, .13, .34, hex(0x2b2b2b));

    // ---- body ----
    put(0, hipY + .07, 0, lean, .46, .20, .29, pants);                 // hips
    put(0, hipY + .40, -lean * .12, lean, .50, .64, .31, shirt);       // torso
    const shoulderY = hipY + .70;

    // ---- arms (shoulder pivot) ----
    const lift = this.armLift;
    const swingA = -sw * .55, swingB = sw * .55;
    const armA = lerp(swingA, -2.55, lift);
    const armB = lerp(swingB, -2.55, lift);
    const elbA = limb(-.32, shoulderY, 0, armA, .34, .17, .18, shirt);
    const elbB = limb(.32, shoulderY, 0, armB, .34, .17, .18, shirt);
    limb(-.32, elbA.y, elbA.z, armA * 1.15, .32, .15, .16, skin);
    limb(.32, elbB.y, elbB.z, armB * 1.15, .32, .15, .16, skin);

    // ---- head ----
    const headY = shoulderY + .28;
    put(0, shoulderY + .08, 0, 0, .18, .14, .18, skin);                // neck
    put(0, headY, -lean * .1, lean * .5, .35, .37, .33, skin);         // head
    put(0, headY + .22, -lean * .1, lean * .5, .39, .13, .37, hair);   // hair
    return o;
  }
}

/* --------------------------------------------------------------------------
   GUEST — needs, wallet, opinions, memories
   -------------------------------------------------------------------------- */
class Guest extends Person {
  constructor(x, z) {
    super(x, z);
    this.type = 'guest';
    this.hunger = rnd(.05, .35);
    this.thirst = rnd(.05, .35);
    this.toilet = rnd(0, .25);
    this.energy = rnd(.7, 1);
    this.nausea = 0;
    this.happy = .78 + rnd(-.1, .2);
    this.cash = rnd(35, 160);
    this.spent = 0;
    // a real crowd contains thrill-seekers as well as families, so big
    // coasters always have someone willing to queue for them
    this.prefIntensity = rnd(1.0, 11.0);
    this.nauseaTol = rnd(2.5, 11);
    this.patience = rnd(45, 150);
    this.ridden = [];
    this.state = 'arriving';
    this.target = null;
    this.wait = 0;
    this.thought = '';
    this.thoughtT = 0;
    this.queueIdx = -1;
    this.timeInPark = 0;
    this.litterCarried = 0;
    this.group = 1;
  }
  think(msg) { this.thought = msg; this.thoughtT = 6; }

  update(dt) {
    this.timeInPark += dt;
    const rate = dt / 60;
    this.hunger = clamp(this.hunger + rate * .155, 0, 1);
    this.thirst = clamp(this.thirst + rate * .205, 0, 1);
    this.toilet = clamp(this.toilet + rate * .125 + (this.state === 'buying' ? rate * .06 : 0), 0, 1);
    this.energy = clamp(this.energy - rate * .090, 0, 1);
    this.nausea = clamp(this.nausea - rate * .60, 0, 1);
    if (this.thoughtT > 0) this.thoughtT -= dt;
    this.armLift = damp(this.armLift, (this.state === 'riding' && this.riding && this.riding.intensity > 4) ? 1 : 0, 6, dt);

    // mood drift from needs and surroundings
    let mood = 0;
    if (this.hunger > .75) mood -= .022;
    if (this.thirst > .75) mood -= .026;
    if (this.toilet > .8) mood -= .035;
    if (this.energy < .18) mood -= .02;
    if (this.nausea > .6) mood -= .03;
    if (this.state === 'queuing') mood -= .012;
    mood += Park.beautyAt(this.x, this.z) * .0009;
    mood -= Math.min(.02, Park.litter.length * .00004);
    if (this.state === 'walking' || this.state === 'idle') mood += .004;
    // happiness drifts on the same park-hour scale as the needs above
    this.happy = clamp(this.happy + mood * rate * 1.5, 0, 1);

    switch (this.state) {
      case 'arriving': {
        this.moving = true;
        this.followPath(dt);
        if (!this.path || this.pi >= this.path.length) { this.state = 'idle'; this.moving = false; }
        break;
      }
      case 'idle': this.decide(); break;
      case 'walking': {
        const done = this.followPath(dt);
        if (done) { this.arriveAtTarget(); }
        break;
      }
      case 'queuing': {
        this.moving = false;
        this.wait += dt;
        const t = this.target;
        if (!t || t.broken || (t.openR === false)) { this.leaveQueue('The ride closed!'); break; }
        // shuffle forward inside the queue
        const idx = t.queue.indexOf(this);
        if (idx < 0) { this.state = 'idle'; break; }
        const ent = t.entrance;
        const back = 2.2 + idx * 1.5;
        const a = -t.rot * PI / 2;
        const tx = ent.x + Math.sin(a) * back, tz = ent.z - Math.cos(a) * back;
        const dx = tx - this.x, dz = tz - this.z, d = Math.hypot(dx, dz);
        if (d > .5) { this.x += dx / d * Math.min(d, this.speed * .7 * dt); this.z += dz / d * Math.min(d, this.speed * .7 * dt); this.moving = true; this.anim += dt * 4; this.yawT = Math.atan2(dz, dx); }
        else this.yawT = a + PI / 2;
        if (this.wait > this.patience) { this.leaveQueue('I have been queuing forever!'); }
        break;
      }
      case 'riding': {
        this.moving = false;
        break;
      }
      case 'buying': {
        this.moving = false;
        this.wait -= dt;
        if (this.wait <= 0) this.completePurchase();
        break;
      }
      case 'sitting': {
        this.moving = false;
        this.sitT -= dt;
        this.energy = clamp(this.energy + dt * .012, 0, 1);
        this.nausea = clamp(this.nausea - dt * .01, 0, 1);
        if (this.sitT <= 0) { this.state = 'idle'; if (this.bench) this.bench.taken = false; this.bench = null; }
        break;
      }
      case 'leaving': {
        const done = this.followPath(dt);
        if (done) { this.dead = true; }
        break;
      }
      case 'stuck': {
        this.moving = false;
        this.wait -= dt;
        if (this.wait <= 0) this.state = 'idle';
        break;
      }
      // Stranded on a disconnected stub: cut across the grass back to the
      // main network rather than standing there forever.
      case 'lost': {
        const tx = this.lostX, tz = this.lostZ;
        const dx = tx - this.x, dz = tz - this.z, d = Math.hypot(dx, dz);
        this.moving = true; this.anim += dt * this.speed * 1.75;
        this.yawT = Math.atan2(dz, dx);
        if (d > 1.2) {
          this.x += dx / d * this.speed * .8 * dt;
          this.z += dz / d * this.speed * .8 * dt;
        }
        const i = WORLD.ti(this.x), j = WORLD.tj(this.z);
        if (d <= 1.2 || (Path.walkable(i, j) && Path.comp[j * N + i] === Park.mainComponent)) {
          this.state = 'idle'; this.stuckCount = 0; this.moving = false;
          this.happy = clamp(this.happy - .04, 0, 1);
        }
        break;
      }
    }
    this.physUpdate(dt);
    if (this.timeInPark > 60 * 7.5 * (0.75 + this.happy) || this.happy < .06) {
      if (this.state !== 'leaving' && this.state !== 'riding' && this.state !== 'queuing') this.leavePark();
    }
    // drop litter occasionally
    if (this.litterCarried > 0 && Math.random() < dt * .06) {
      const bin = this.nearest(o => o.kind === 'scenery' && o.def.kind === 'bin', 9);
      this.litterCarried--;
      if (!bin) {
        Park.litter.push({ x: this.x + rnd(-1, 1), z: this.z + rnd(-1, 1), k: rndi(0, 1), y: this.y });
        Park.litterDirty = true;
      }
    }
    if (this.nausea > .93 && Math.random() < dt * .3) {
      Park.litter.push({ x: this.x, z: this.z, k: 2, y: this.y });
      Park.litterDirty = true;
      this.nausea = .3; this.happy = clamp(this.happy - .12, 0, 1);
      this.think('Ugh… I feel sick.');
    }
  }

  nearest(pred, maxD = 1e9) {
    let best = null, bd = maxD * maxD;
    for (const o of Park.objects) {
      if (!pred(o)) continue;
      const d = dist2(this.x, this.z, o.x, o.z);
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  }

  decide() {
    // Priority: toilet > nausea > thirst/hunger > ride > rest > wander
    const wants = [];
    if (this.toilet > .58) wants.push(['toilet', (this.toilet - .45) * 5.0]);
    if (this.nausea > .58) wants.push(['nausea', (this.nausea - .45) * 4.4]);
    if (this.thirst > .52) wants.push(['thirst', (this.thirst - .40) * 4.4]);
    if (this.hunger > .52) wants.push(['hunger', (this.hunger - .40) * 4.0]);
    if (this.energy < .25) wants.push(['rest', (.3 - this.energy) * 9]);
    if (this.cash < 12) wants.push(['cash', 2.2]);
    wants.push(['ride', 1.5 + this.happy * .5]);
    wants.push(['wander', .3]);
    wants.sort((a, b) => b[1] - a[1]);
    const want = wants[0][0];

    if (want === 'rest') {
      const b = this.findBench();
      if (b) { this.target = b; this.wantAction = 'sit'; if (this.goto(b.x, b.z)) { this.state = 'walking'; return; } }
    }
    if (want === 'ride') {
      const r = this.chooseRide();
      if (r) {
        this.target = r; this.wantAction = 'ride';
        const e = r.entrance;
        if (this.goto(e.x, e.z)) { this.state = 'walking'; this.think('Let’s ride ' + r.name + '!'); return; }
      }
    }
    if (want !== 'wander' && want !== 'rest') {
      const shop = this.findShop(want);
      if (shop) {
        this.target = shop; this.wantAction = 'buy';
        const e = shop.entrance || { x: shop.x, z: shop.z - (shop.gd * TILE) / 2 - 1.5 };
        const a = -shop.rot * PI / 2;
        const off = (shop.gd * TILE) / 2 + 1.8;
        if (this.goto(shop.x + Math.sin(a) * off, shop.z - Math.cos(a) * off)) { this.state = 'walking'; return; }
      } else if (want === 'toilet' && this.toilet > .95) {
        this.think('I really need a restroom!');
        this.happy = clamp(this.happy - .08, 0, 1);
      } else if (want === 'hunger' && this.hunger > .9) this.think('I’m starving — no food here!');
    }
    // wander to a random path tile
    const spot = this.randomPathSpot();
    if (spot && this.goto(spot.x, spot.z)) { this.state = 'walking'; this.wantAction = 'wander'; this.stuckCount = 0; }
    else {
      this.stuckCount = (this.stuckCount || 0) + 1;
      if (this.stuckCount > 3) {
        // walk back to the main path network across open ground
        const t = Park.mainSpot();
        this.lostX = t.x; this.lostZ = t.z;
        this.state = 'lost';
        this.think('How do I get back?');
      } else { this.state = 'stuck'; this.wait = 1.4; }
    }
  }
  /* Somewhere to stroll: a walkable tile a short way from where we are.
     Sampling the whole map would almost always miss on a park this size. */
  randomPathSpot() {
    const ci = WORLD.ti(this.x), cj = WORLD.tj(this.z);
    for (let k = 0; k < 36; k++) {
      const r = 3 + Math.random() * 16, a = Math.random() * TAU;
      const i = ci + Math.round(Math.cos(a) * r), j = cj + Math.round(Math.sin(a) * r);
      if (!Path.walkable(i, j)) continue;
      if (WORLD.type[j * N + i] === T_QUEUE) continue;
      return { x: WORLD.wx(i), z: WORLD.wz(j) };
    }
    // nothing nearby — fall back to the main concourse
    const spot = Park.mainSpot();
    return (spot && dist2(spot.x, spot.z, this.x, this.z) > 4) ? spot : null;
  }
  findBench() {
    let best = null, bd = 40 * 40;
    for (const o of Park.objects) {
      if (o.kind !== 'scenery' || o.def.kind !== 'bench' || o.taken) continue;
      const d = dist2(this.x, this.z, o.x, o.z);
      if (d < bd && this.canReach(o.x, o.z)) { bd = d; best = o; }
    }
    return best;
  }
  findShop(need) {
    let best = null, bs = -1e9;
    for (const o of Park.objects) {
      if (o.kind !== 'shop') continue;
      if (o.def.need !== need) continue;
      if (o.def.price > this.cash) continue;
      const e = o.entrance;
      if (!this.canReach(e.x, e.z)) continue;
      const d = dist(this.x, this.z, o.x, o.z);
      const s = 100 - d * .8 - o.queue.length * 3 - o.price * .6;
      if (s > bs) { bs = s; best = o; }
    }
    return best;
  }
  chooseRide() {
    let best = null, bs = -2.5;
    for (const r of Park.attractions()) {
      if (r.broken || r.openR === false) continue;
      if (r.price > this.cash) continue;
      const e = r.entrance;
      if (!this.canReach(e.x, e.z)) continue;
      const seen = this.ridden.filter(x => x === r.id).length;
      let s = 1.8 + r.ratingFor(this) - seen * 1.7 - r.queue.length * .30 - dist(this.x, this.z, r.x, r.z) * .012 - r.price * .10;
      if (r.intensity > this.prefIntensity + 3.2) s -= 8;
      if (r.nausea > this.nauseaTol + 2) s -= 6;
      s += rnd(-1, 1);
      if (s > bs) { bs = s; best = r; }
    }
    return best;
  }
  arriveAtTarget() {
    const t = this.target;
    this.moving = false;
    if (this.wantAction === 'sit' && t && !t.taken) {
      t.taken = true; this.bench = t; this.state = 'sitting'; this.sitT = rnd(18, 40);
      this.x = t.x; this.z = t.z; this.yawT = -t.rot * PI / 2 + PI;
      return;
    }
    if (this.wantAction === 'ride' && t) {
      if (t.broken || t.openR === false || t.price > this.cash) { this.state = 'idle'; return; }
      if (t.queue.length > 42) { this.think('That queue is way too long.'); this.state = 'idle'; return; }
      t.queue.push(this); this.state = 'queuing'; this.wait = 0;
      return;
    }
    if (this.wantAction === 'buy' && t) {
      this.state = 'buying'; this.wait = 2.2 + t.queue.length * .5;
      t.queue.push(this);
      this.yawT = -t.rot * PI / 2 + PI / 2;
      return;
    }
    this.state = 'idle';
  }
  completePurchase() {
    const s = this.target;
    if (!s) { this.state = 'idle'; return; }
    const k = s.queue.indexOf(this); if (k >= 0) s.queue.splice(k, 1);
    if (this.cash >= s.price) {
      this.cash -= s.price; this.spent += s.price;
      Park.earn(s.price, 'shop'); s.revenue += s.price; s.served++;
      const value = s.def.price > 0 ? clamp(1.2 - s.price / (s.def.price * 2.2), 0, 1) : 1;
      switch (s.def.need) {
        case 'hunger': this.hunger = clamp(this.hunger - s.def.satisfy / 100, 0, 1); this.litterCarried++; break;
        case 'thirst': this.thirst = clamp(this.thirst - s.def.satisfy / 100, 0, 1); this.toilet = clamp(this.toilet + .12, 0, 1); this.litterCarried++; break;
        case 'toilet': this.toilet = 0; break;
        case 'nausea': this.nausea = 0; break;
        case 'cash': this.cash += 60; break;
        case 'shop': this.happy = clamp(this.happy + .07, 0, 1); break;
        case 'info': this.happy = clamp(this.happy + .02, 0, 1); break;
      }
      this.happy = clamp(this.happy + .04 * value, 0, 1);
      if (s.price > s.def.price * 1.8) { this.happy -= .09; this.think('That was a rip-off!'); }
    }
    this.state = 'idle';
  }
  /* Called when whatever this guest was heading for disappears. */
  retarget() {
    if (this.state === 'riding') { this.riding = null; }
    this.target = null; this.path = null; this.wantAction = null;
    if (this.bench) { this.bench.taken = false; this.bench = null; }
    this.state = 'idle';
  }
  leaveQueue(msg) {
    const t = this.target;
    if (t) { const k = t.queue.indexOf(this); if (k >= 0) t.queue.splice(k, 1); }
    this.happy = clamp(this.happy - .16, 0, 1);
    this.think(msg);
    this.state = 'idle';
  }
  boardRide(ride) {
    this.state = 'riding'; this.riding = ride;
    this.cash -= ride.price; this.spent += ride.price;
    this.rideSeat = ride.riders ? ride.riders.length : 0;
  }
  finishRide(ride, aborted) {
    this.riding = null;
    this.state = 'idle';
    this.ridden.push(ride.id);
    if (aborted) { this.happy = clamp(this.happy - .2, 0, 1); this.think('We got stuck on the ride!'); this.state = 'idle'; return; }
    const rating = ride.ratingFor(this);
    this.happy = clamp(this.happy + rating * .022 - .01, 0, 1);
    this.nausea = clamp(this.nausea + ride.nausea * .055 * (1 + Math.max(0, ride.nausea - this.nauseaTol) * .25), 0, 1);
    this.energy = clamp(this.energy - .04, 0, 1);
    if (rating > 7) this.think('WOW! ' + ride.name + ' was amazing!');
    else if (rating < 2) this.think(ride.name + ' was not for me…');
    // step off next to the ride
    const a = -ride.rot * PI / 2;
    const off = (ride.gd * TILE) / 2 + 2.4;
    this.x = ride.x + Math.sin(a) * off + rnd(-1.5, 1.5);
    this.z = ride.z - Math.cos(a) * off + rnd(-1.5, 1.5);
  }
  leavePark() {
    this.state = 'leaving';
    const ex = WORLD.wx(N / 2), ez = WORLD.wz(N / 2 + 20);
    if (!this.goto(ex, ez)) this.dead = true;
    if (this.happy > .8) Park.happyLeavers++;
    Park.leavers++;
  }
}

   STAFF
   -------------------------------------------------------------------------- */
class Staff extends Person {
  constructor(role, x, z) {
    super(x, z);
    this.type = 'staff';
    this.role = role;
    const d = CAT.staff.find(s => s.id === role);
    this.def = d; this.wage = d.wage;
    this.shirt = d.color; this.pants = 0x2c3e50;
    this.name = pick(FIRST) + ' ' + pick(LAST);
    this.state = 'idle';
    this.taskT = 0;
    this.cleaned = 0; this.repaired = 0;
    this.speed = 3.4;
    this.zone = null;
  }
  update(dt) {
    switch (this.state) {
      case 'idle': this.assign(); break;
      case 'walking': {
        const done = this.followPath(dt);
        if (done) { this.state = 'working'; this.taskT = this.role === 'mechanic' ? 6 : 1.6; this.moving = false; }
        break;
      }
      case 'working': {
        this.taskT -= dt;
        this.armLift = .6 + Math.sin(Park.now * 8) * .35;
        if (this.taskT <= 0) { this.finishTask(); this.armLift = 0; }
        break;
      }
      case 'patrol': {
        const done = this.followPath(dt);
        if (done) this.state = 'idle';
        break;
      }
    }
    this.physUpdate(dt);
  }
  assign() {
    if (this.role === 'janitor') {
      let best = -1, bd = 1e9;
      for (let k = 0; k < Park.litter.length; k++) {
        const l = Park.litter[k], d = dist2(this.x, this.z, l.x, l.z);
        if (d < bd) { bd = d; best = k; }
      }
      if (best >= 0 && bd < 200 * 200) {
        this.targetLitter = Park.litter[best];
        if (this.goto(this.targetLitter.x, this.targetLitter.z)) { this.state = 'walking'; return; }
      }
    } else if (this.role === 'mechanic') {
      const broken = Park.needMechanic[0];
      if (broken) {
        this.targetRide = broken;
        const e = broken.entrance;
        if (this.goto(e.x, e.z)) { this.state = 'walking'; return; }
      }
      // otherwise inspect the most worn ride
      let worst = null, w = .18;
      for (const o of Park.objects) if (o.kind === 'ride' && o.wear > w) { w = o.wear; worst = o; }
      if (worst) { this.targetRide = worst; const e = worst.entrance; if (this.goto(e.x, e.z)) { this.state = 'walking'; return; } }
    } else if (this.role === 'entertainer') {
      // walk to the busiest queue and cheer people up
      let best = null, bl = 2;
      for (const r of Park.attractions()) if (r.queue.length > bl) { bl = r.queue.length; best = r; }
      if (best) { const e = best.entrance; if (this.goto(e.x + rnd(-3, 3), e.z + rnd(-3, 3))) { this.state = 'walking'; return; } }
    }
    const spot = this.randomSpot();
    if (spot && this.goto(spot.x, spot.z)) { this.state = 'patrol'; }
    else { this.state = 'idle'; this.moving = false; }
  }
  randomSpot() {
    for (let k = 0; k < 20; k++) {
      const i = rndi(0, N - 1), j = rndi(0, N - 1);
      if (Path.walk[j * N + i] === 1) return { x: WORLD.wx(i), z: WORLD.wz(j) };
    }
    return null;
  }
  finishTask() {
    if (this.role === 'janitor' && this.targetLitter) {
      const k = Park.litter.indexOf(this.targetLitter);
      if (k >= 0) { Park.litter.splice(k, 1); Park.litterDirty = true; this.cleaned++; }
      this.targetLitter = null;
    } else if (this.role === 'mechanic' && this.targetRide) {
      if (this.targetRide.broken) { this.targetRide.repair(); this.repaired++; UI.notify('Repaired', this.name + ' fixed ' + this.targetRide.name + '.', 'good'); }
      else this.targetRide.wear = Math.max(0, this.targetRide.wear - .2);
      this.targetRide = null;
    } else if (this.role === 'entertainer') {
      for (const g of Park.guests) if (dist2(g.x, g.z, this.x, this.z) < 100) { g.happy = clamp(g.happy + .05, 0, 1); g.patience += 4; }
    } else if (this.role === 'security') {
      for (const g of Park.guests) if (dist2(g.x, g.z, this.x, this.z) < 144) g.happy = clamp(g.happy + .008, 0, 1);
    }
    this.state = 'idle';
  }
}

  /* --------- full ride analysis, Planet Coaster style --------- */
  ratingWord(kind, v) {
    const scales = {
      exc: [[2, 'Dull'], [4, 'Mild'], [6, 'Fun'], [8, 'Exciting'], [10, 'Thrilling'], [99, 'Legendary']],
      int: [[2, 'Very Gentle'], [4, 'Gentle'], [6, 'Moderate'], [8, 'High'], [10, 'Extreme'], [99, 'Ultra Extreme']],
      nau: [[2, 'Negligible'], [4, 'Low'], [6, 'Moderate'], [8, 'High'], [99, 'Severe']],
    };
    for (const [lim, word] of scales[kind]) if (v < lim) return word;
    return '';
  },
  grade(v) { return v >= 12 ? 'A+' : v >= 10 ? 'A' : v >= 8 ? 'B' : v >= 6 ? 'C' : v >= 4 ? 'D' : v >= 2 ? 'E' : 'F'; },

  rideReport(id) {
    const c = Park.coasters.find(x => x.id === id);
    if (!c || !c.track || !c.track.complete) { this.notify('No data', 'Complete the circuit first.', 'warn'); return; }
    c.computeStats();
    const t = c.track;
    const bar = (label, v, max, col, word) => `
      <div class="meter" style="margin:5px 0">
        <span class="mn" style="min-width:86px">${label}</span>
        <span class="bar" style="height:9px"><span class="fill" style="width:${clamp(v / max * 100, 0, 100)}%;background:${col}"></span></span>
        <span class="mv" style="min-width:74px;text-align:right">${v.toFixed(2)} <span style="color:var(--dim);font-weight:400">${word || ''}</span></span>
      </div>`;
    const row = (k, v, note) => `<tr><td>${k}</td><td style="text-align:right;font-weight:600">${v}</td><td style="color:var(--dim);font-size:10.5px">${note || ''}</td></tr>`;

    let h = `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:6px">
      <img src="${Thumbs.coasterType(c.type)}" style="width:88px;height:88px;object-fit:contain;flex:0 0 auto">
      <div style="flex:1">
        <div style="font-size:17px;font-weight:700">${c.name}</div>
        <div style="color:var(--dim);font-size:11.5px;margin-bottom:8px">${c.type.name} &middot; ${t.pieces.length} pieces &middot; ${c.state}${c.stalls ? ' &middot; <b style="color:var(--bad)">stalls on circuit</b>' : ''}</div>
        ${bar('Excitement', c.excitement, 14, 'linear-gradient(90deg,#3d8f5a,#6be675)', this.ratingWord('exc', c.excitement) + ' (' + this.grade(c.excitement) + ')')}
        ${bar('Intensity', c.intensity, 14, 'linear-gradient(90deg,#8a6a2a,#ffb84d)', this.ratingWord('int', c.intensity))}
        ${bar('Nausea', c.nausea, 14, 'linear-gradient(90deg,#6a7020,#c8d84a)', this.ratingWord('nau', c.nausea))}
      </div></div>`;

    h += `<h3>Ride Profile</h3>
      <canvas id="rcChart" width="1200" height="320" style="width:100%;height:auto;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid var(--edge)"></canvas>
      <div style="display:flex;gap:16px;font-size:10.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap">
        <span><b style="color:#7ec8ff">&#9644;</b> height</span>
        <span><b style="color:#ffd76a">&#9644;</b> speed</span>
        <span><b style="color:#ff8f8f">&#9644;</b> vertical G</span>
        <span><b style="color:#9be89b">&#9644;</b> lateral G</span>
        <span>horizontal axis: distance along the track</span>
      </div>`;

    h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px">`;
    h += `<div><h3>Track</h3><table class="tb">
      ${row('Track length', Math.round(t.length) + ' m')}
      ${row('Ride time', (c.rideTime || 0).toFixed(1) + ' s')}
      ${row('Max height', (t.maxH - c.y).toFixed(1) + ' m')}
      ${row('Highest drop', (c.biggestDrop || 0).toFixed(1) + ' m')}
      ${row('Drops', (c.drops || []).length, (c.drops || []).slice(0, 3).map(d => d.toFixed(0) + 'm').join(', '))}
      ${row('Inversions', t.inversions)}
      ${row('Banked track', Math.round((c.bankedFraction || 0) * 100) + '%')}
      </table></div>`;
    h += `<div><h3>Forces</h3><table class="tb">
      ${row('Top speed', Math.round(c.maxSpeed * 3.6) + ' km/h', Math.round(c.maxSpeed) + ' m/s')}
      ${row('Average speed', Math.round((c.avgSpeed || 0) * 3.6) + ' km/h')}
      ${row('Max positive G', c.maxG.toFixed(2) + ' G', c.maxG > 5 ? 'punishing' : c.maxG > 3.5 ? 'strong' : 'comfortable')}
      ${row('Max negative G', c.minG.toFixed(2) + ' G', c.minG < -1.2 ? 'ejector' : c.minG < 0 ? 'floater' : '')}
      ${row('Max lateral G', (c.maxLatG || 0).toFixed(2) + ' G', c.maxLatG > 1.6 ? 'unbanked turns' : 'well banked')}
      ${row('Airtime', (c.airtime || 0).toFixed(1) + ' s')}
      ${row('Prestige', c.prestige || 0)}
      </table></div>`;
    h += `<div><h3>Operations</h3><table class="tb">
      ${row('Trains', c.trains.length)}
      ${row('Capacity', c.cap + ' riders')}
      ${row('Throughput', (c.throughput || 0) + ' /hr')}
      ${row('Ticket price', money(c.price))}
      ${row('Total riders', c.ridden)}
      ${row('Revenue', money(c.revenue))}
      ${row('Reliability', Math.round(clamp(c.reliability - c.wear, 0, 1) * 100) + '%', c.broken ? 'broken down' : '')}
      </table></div>`;
    const cens = c.elementCensus();
    const centries = Object.entries(cens).sort((a, b) => b[1] - a[1]).slice(0, 10);
    h += `<div><h3>Elements Used</h3><table class="tb">
      ${centries.map(([k, v]) => row(k, v)).join('')}
      </table></div>`;
    h += `</div>`;

    const verdict = c.stalls ? ['Fails safety test', 'The train loses momentum and stops on the circuit. Add a chain lift or launch, or lower the layout.', 'var(--bad)']
      : c.maxG > 6 ? ['Dangerously intense', 'Peak forces above 6 G will frighten almost every guest away. Widen the turns and soften the pull-outs.', 'var(--warn)']
        : c.excitement > 8 && c.intensity < 8 ? ['Outstanding', 'A thrilling ride most guests will queue for. Well balanced forces.', 'var(--good)']
          : c.excitement < 4 ? ['Forgettable', 'Guests will ride it once. More height, speed and airtime would help.', 'var(--warn)']
            : ['Solid', 'A respectable ride. More airtime or an inversion would push the excitement higher.', 'var(--accent)'];
    h += `<h3>Verdict</h3><div style="border-left:3px solid ${verdict[2]};padding:8px 12px;background:rgba(255,255,255,.04);border-radius:0 8px 8px 0">
      <b style="color:${verdict[2]}">${verdict[0]}</b><div style="color:var(--dim);margin-top:3px">${verdict[1]}</div></div>`;

    this.modal('Ride Report', h, () => this.drawProfile(c));
  },

  /* Height, speed and G-force plotted along the length of the track. */
  drawProfile(c) {
    const cv = document.getElementById('rcChart');
    if (!cv || !c.profile || !c.profile.length) return;
    const x = cv.getContext('2d');
    const W = cv.width, H = cv.height, PADL = 46, PADR = 16, PADT = 12, PADB = 26;
    x.clearRect(0, 0, W, H);
    const P = c.profile;
    const maxD = P[P.length - 1].d || 1;
    let maxY = 1, maxV = 1, maxA = 1;
    for (const p of P) { maxY = Math.max(maxY, p.y); maxV = Math.max(maxV, p.v); maxA = Math.max(maxA, Math.abs(p.gv), Math.abs(p.gl)); }
    const px = (d) => PADL + (d / maxD) * (W - PADL - PADR);
    const py = (v, max, min) => { min = min || 0; return H - PADB - ((v - min) / (max - min)) * (H - PADT - PADB); };

    // grid
    x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 1;
    x.fillStyle = 'rgba(220,235,250,.45)'; x.font = '13px system-ui';
    for (let i = 0; i <= 4; i++) {
      const yy = PADT + (H - PADT - PADB) * i / 4;
      x.beginPath(); x.moveTo(PADL, yy); x.lineTo(W - PADR, yy); x.stroke();
      x.fillText(Math.round(maxY * (1 - i / 4)) + 'm', 6, yy + 4);
    }
    for (let i = 0; i <= 6; i++) {
      const xx = px(maxD * i / 6);
      x.beginPath(); x.moveTo(xx, PADT); x.lineTo(xx, H - PADB); x.stroke();
      x.fillText(Math.round(maxD * i / 6) + 'm', xx - 12, H - 7);
    }
    // height as a filled area
    x.beginPath(); x.moveTo(px(0), H - PADB);
    for (const p of P) x.lineTo(px(p.d), py(p.y, maxY));
    x.lineTo(px(maxD), H - PADB); x.closePath();
    const grad = x.createLinearGradient(0, PADT, 0, H - PADB);
    grad.addColorStop(0, 'rgba(126,200,255,.45)'); grad.addColorStop(1, 'rgba(126,200,255,.05)');
    x.fillStyle = grad; x.fill();
    x.strokeStyle = '#7ec8ff'; x.lineWidth = 2; x.beginPath();
    P.forEach((p, i) => i ? x.lineTo(px(p.d), py(p.y, maxY)) : x.moveTo(px(p.d), py(p.y, maxY)));
    x.stroke();
    // speed
    x.strokeStyle = '#ffd76a'; x.lineWidth = 2; x.beginPath();
    P.forEach((p, i) => { const yy = py(p.v, maxV); i ? x.lineTo(px(p.d), yy) : x.moveTo(px(p.d), yy); });
    x.stroke();
    // G forces, centred on the 1 G line
    const gy = (g) => py(g, maxA, -maxA);
    x.strokeStyle = 'rgba(255,255,255,.20)'; x.setLineDash([4, 4]); x.beginPath();
    x.moveTo(PADL, gy(0)); x.lineTo(W - PADR, gy(0)); x.stroke(); x.setLineDash([]);
    x.strokeStyle = '#ff8f8f'; x.lineWidth = 1.6; x.beginPath();
    P.forEach((p, i) => { const yy = gy(p.gv); i ? x.lineTo(px(p.d), yy) : x.moveTo(px(p.d), yy); });
    x.stroke();
    x.strokeStyle = '#9be89b'; x.lineWidth = 1.4; x.beginPath();
    P.forEach((p, i) => { const yy = gy(p.gl); i ? x.lineTo(px(p.d), yy) : x.moveTo(px(p.d), yy); });
    x.stroke();
  },

  /* --------- inspector --------- */
  inspect(o) {
    const p = $('#inspector'), b = $('#insBody');
    if (!o) { p.classList.remove('show'); return; }
    p.classList.add('show');
    let h = '';
    const meter = (n, v, c) => `<div class="meter"><span class="mn">${n}</span><span class="bar"><span class="fill" style="width:${clamp(v * 100, 0, 100)}%;background:${c}"></span></span><span class="mv">${Math.round(v * 100)}</span></div>`;
    const kv = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`;

    if (o instanceof Guest) {
      $('#insTitle').textContent = o.name;
      h += kv('Status', o.state);
      h += kv('Cash', money(o.cash));
      h += kv('Spent', money(o.spent));
      h += kv('Rides taken', o.ridden.length);
      h += kv('Prefers intensity', o.prefIntensity.toFixed(1));
      h += `<div class="meterbox">`;
      h += meter('Happiness', o.happy, 'linear-gradient(90deg,#ff6b6b,#ffd76a,#6be675)');
      h += meter('Hunger', o.hunger, '#f0a63c');
      h += meter('Thirst', o.thirst, '#3ba7d4');
      h += meter('Toilet', o.toilet, '#c77dff');
      h += meter('Energy', o.energy, '#6be675');
      h += meter('Nausea', o.nausea, '#9aa832');
      h += `</div>`;
      if (o.thought) h += `<div style="font-style:italic;color:#cfe3f5;background:rgba(255,255,255,.05);padding:7px;border-radius:8px">“${o.thought}”</div>`;
    }
    else if (o instanceof Staff) {
      $('#insTitle').textContent = o.name;
      h += kv('Role', o.def.name);
      h += kv('Status', o.state);
      h += kv('Wage', money(o.wage) + ' / hr');
