/* ============================================================================
   SECTION 16 — MINIMAP
   ========================================================================== */
const Minimap = {
  ctx: null, t: 0,
  init() { this.ctx = $('#mmc').getContext('2d'); },
  draw(dt) {
    this.t += dt; if (this.t < .25) return; this.t = 0;
    if (!$('#minimap').classList.contains('show')) return;
    const c = this.ctx, S = 300, s = S / N;
    c.fillStyle = '#0d1117'; c.fillRect(0, 0, S, S);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const t = WORLD.type[j * N + i];
      if (t === T_GRASS) { const h = WORLD.tileH(i, j); c.fillStyle = h > 8 ? '#4a4437' : h < -1 ? '#1e3a52' : '#2c4a2c'; }
      else if (t === T_PATH || t === T_PLAZA || t === T_ENTRY) c.fillStyle = '#b4a68c';
      else if (t === T_QUEUE) c.fillStyle = '#8f6fb0';
      else c.fillStyle = '#d94f3c';
      c.fillRect(i * s, j * s, s + .6, s + .6);
    }
    c.fillStyle = '#39c0ff';
    for (const co of Park.coasters) if (co.track) for (let k = 0; k < co.track.samples.length; k += 4) {
      const p = co.track.samples[k].p;
      c.fillRect((WORLD.ti(p.x)) * s, (WORLD.tj(p.z)) * s, 2, 2);
    }
    c.fillStyle = '#ffe066';
    for (const g of Park.guests) c.fillRect(WORLD.ti(g.x) * s, WORLD.tj(g.z) * s, 2, 2);
    // camera frustum marker
    c.strokeStyle = '#fff'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(WORLD.ti(Cam.dx) * s, WORLD.tj(Cam.dz) * s, 6, 0, TAU); c.stroke();
  }
};
/* ============================================================================
   SECTION 17 — COASTER EDITOR
   ========================================================================== */
const Coaster = {
  active: null,        // the Coaster being edited
  placing: null,       // track type awaiting station placement
  piece: 'straight',
  autoBank: true,
  ghostMesh: null,
  ghostOK: false,
  ghostSamples: null,
  rideCamTrain: 0,

  /* Drop a whole ready-made coaster in one click. */
  beginBlueprint(bp) {
    this.blueprint = bp;
    this.placing = CAT.coasterTypes.find(t => t.id === bp.type);
    UI.hint('Click a clear, flat spot to build <b>' + bp.name + '</b> — <kbd>R</kbd> rotates.');
  },
  buildBlueprint(bp, i, j, rot) {
    const type = CAT.coasterTypes.find(t => t.id === bp.type);
    const est = 6000 + bp.seq.reduce((a, p) => a + (PIECE_BY_ID[p] ? PIECE_BY_ID[p].cost : 0), 0);
    if (Park.money < est) { UI.notify('Too expensive', bp.name + ' costs about ' + money(est) + '.', 'bad'); return false; }
    this.placing = type;
    const purse = Park.money;
    const n0 = Park.coasters.length;
    this.placeStation(i, j, rot);
    if (Park.coasters.length === n0) return false;
    const c = Park.coasters[Park.coasters.length - 1];
    c.name = bp.name + (Park.coasterCount > 1 ? ' ' + Park.coasterCount : '');
    this.active = c;
    let rejected = 0;
    for (const pid of bp.seq) {
      const before = c.track.pieces.length;
      this.piece = pid; this.add();
      if (c.track.pieces.length === before) rejected++;
    }
    this.autoComplete();
    // If the layout cannot get home from where it ended up, walk the tail back
    // a piece at a time and try again — a shorter version of the same design.
    for (let attempt = 0; attempt < 10 && !c.track.closeError().ok; attempt++) {
      if (c.track.pieces.length <= 4) break;
      c.track.removeLast();
      this.autoComplete();
    }
    if (!c.track.closeError().ok) {
      UI.notify('Not enough room', bp.name + ' could not fit here — try a clearer, flatter spot nearer the middle of your land.', 'warn');
      this.demolish();
      Park.money = purse;                       // a design that will not fit costs nothing
      return false;
    }
    this.complete();
    c.price = bp.price;
    c.computeStats();
    c.spawnTrains(2);
    c.tested = true;
    if (!c.stalls) { c.openR = true; c.state = 'open'; }
    Game.autoConnect(c);
    this.blueprint = null;
    UI.notify(bp.name + ' is open', 'Excitement ' + c.excitement.toFixed(1) + ', intensity ' + c.intensity.toFixed(1) +
      ', top speed ' + Math.round(c.maxSpeed * 3.6) + ' km/h.' + (rejected ? ' ' + rejected + ' pieces did not fit.' : ''), 'good');
    Audio.play('complete');
    this.refresh();
    return true;
  },
  beginPlacement(type) {
    this.blueprint = null;
    this.placing = type;
    UI.hint('Click the ground to place the <b>station</b> for your ' + type.name + '. <kbd>R</kbd> rotates.');
  },
  placeStation(i, j, rot) {
    const type = this.placing;
    if (!type) return;
    const c = new CoasterRide(type, i, j, rot);
    if (!WORLD.areaFree(i, j, c.gw, c.gd)) { UI.notify('Blocked', 'Not enough clear ground for the station.', 'warn'); return; }
    const base = 6000;
    if (Park.money < base) { UI.notify('Too expensive', 'You need ' + money(base) + ' to start a coaster.', 'bad'); return; }
    Park.spend(base);
    c.y = WORLD.tileH(i, j);
    WORLD.flatten(i, j, c.gw, c.gd, c.y);
    c.updateMatrix();
    const a = -rot * PI / 2;
    // Track leaves the station heading "forward" (away from the entrance side)
    const yaw = a - PI / 2;
    const sx = c.x - Math.sin(a) * (c.gd * TILE) / 2, sz = c.z + Math.cos(a) * (c.gd * TILE) / 2;
    c.track = new Track(type, c.x - Math.cos(yaw) * 9, c.y + 1.2, c.z - Math.sin(yaw) * 9, yaw);
    c.track.addPiece('straight');
    c.track.addPiece('straight');
    c.track.addPiece('straight');
    c.track.stationEnd = c.track.length;
    Park.coasterCount++;
    Park.coasters.push(c);
    c.footprint((ii, jj) => { WORLD.setT(ii, jj, T_BUILD); WORLD.setOwn(ii, jj, c.id); });
    WORLD.dirty = true; Path.dirty = true;
    c.stationMesh = Game.R.makeMesh(this.stationGeo(c));
    this.placing = null;
    Game.autoConnect(c);
    this.enter(c);
    if (UI.tool === 'coaster') UI.openBuild('coaster');
    UI.notify('Station placed', 'Now lay track from the glowing build head.', 'good');
  },
  stationGeo(c) {
    const g = new Geo();
    const W = (c.gw || 4) * TILE, D = (c.gd || 3) * TILE;
    const T = c.type;
    g.box(0, -.4, 0, W + 2, .8, D + 2, hex(0xb0a48c));
    // platforms either side of the track
    for (const sx of [-1, 1]) g.box(sx * 3.2, .4, 0, 2.6, .7, D + 1, hex(0xd8cdb4));
    for (const sx of [-1, 1]) for (let z = -D / 2; z <= D / 2; z += 2.4) g.cyl(sx * 4.3, 1.1, z, .16, 4.2, 6, hex(0x6d5a45));
    g.box(0, 5.3, 0, W + 3, .5, D + 2.5, hex(T.rail));
    g.box(0, 5.8, 0, W + 2.4, .3, D + 2.0, hex(0xf0e6d2));
    g.box(0, 6.1, -D / 2 - .8, W, 1.4, .4, hex(0x2f3b52));
    g.box(0, 6.3, -D / 2 - 1.0, W - 1.4, .9, .12, hex(0xffd76a));
    // rails through the station
    for (const sx of [-1.25, 1.25]) g.box(sx, 1.05, 0, .34, .34, D + 2, hex(T.rail));
    g.box(0, .7, 0, .8, .35, D + 2, hex(T.spine));
    return g;
  },

  enter(c) {
    this.active = c;
    Game.select(null);
    $('#coasterPanel').classList.add('show');
    this.refresh();
    Cam.tx = c.x; Cam.tz = c.z;
  },
  exit() {
    this.active = null; this.placing = null; this.blueprint = null;
    $('#coasterPanel').classList.remove('show');
    if (this.ghostMesh) { this.ghostMesh.dispose(); this.ghostMesh = null; }
  },
  refresh() {
    const c = this.active; if (!c) return;
    const b = $('#cpBody');
    const t = c.track;
    const close = t.closeError();
    let h = `<div style="font-size:12px;font-weight:700">${c.name}</div>`;
    h += `<div style="font-size:10.5px;color:var(--dim);margin-top:-4px">${c.type.name} · ${t.pieces.length} pieces · ${Math.round(t.length)} m</div>`;

    const GROUPS = [['basic', 'Straight'], ['turn', 'Turns & Banking'], ['hill', 'Hills & Drops'], ['special', 'Inversions & Specials'], ['service', 'Lifts, Launches & Brakes']];
    for (const [gid, label] of GROUPS) {
      const list = PIECES.filter(p => (p.group || 'basic') === gid);
      if (!list.length) continue;
      h += `<div class="cat">${label}</div><div class="piecegrid">`;
      for (const p of list) {
        h += `<div class="pc ${this.piece === p.id ? 'on' : ''}" onclick="Coaster.setPiece('${p.id}')">` +
          `<img src="${Thumbs.piece(p)}" alt=""><span class="tip">${p.n} · ${money(p.cost)}</span></div>`;
      }
      h += `</div>`;
    }

    h += `<div class="btnrow"><button class="btn go" onclick="Coaster.add()">${ICON.plus}Add Piece</button>
          <button class="btn" onclick="Coaster.undo()" ${t.pieces.length <= 3 ? 'disabled' : ''}>${ICON.undo}Undo</button></div>`;
    h += `<div class="row"><label>Auto‑bank</label><input type="checkbox" ${this.autoBank ? 'checked' : ''} onchange="Coaster.autoBank=this.checked"></div>`;

    h += `<div class="meterbox">
      <div class="kv"><span class="k">Highest point</span><span class="v">${(t.maxH - c.y).toFixed(1)} m</span></div>
      <div class="kv"><span class="k">Total drop</span><span class="v">${t.drop.toFixed(1)} m</span></div>
      <div class="kv"><span class="k">Inversions</span><span class="v">${t.inversions}</span></div>
      <div class="kv"><span class="k">Circuit gap</span><span class="v" style="color:${close.ok ? 'var(--good)' : 'var(--warn)'}">${close.d.toFixed(1)} m / ${close.dy.toFixed(1)} m up</span></div>
    </div>`;

    if (!t.complete) {
      h += `<div class="btnrow"><button class="btn ${close.ok ? 'go' : ''}" ${close.ok ? '' : 'disabled'} onclick="Coaster.complete()">${ICON.link}Complete Circuit</button>
            <button class="btn pri" onclick="Coaster.autoComplete()">${ICON.wand}Auto-Route</button></div>`;
      if (!close.ok) h += `<div style="font-size:10.5px;color:var(--dim)">Bring the track back near the station, level and facing the same way, to close the loop.</div>`;
    } else {
      h += `<div class="meterbox">
        <div class="meter"><span class="mn">Excitement</span><span class="bar"><span class="fill" style="width:${c.excitement / 14 * 100}%;background:#6be675"></span></span><span class="mv">${c.excitement.toFixed(1)}</span></div>
        <div class="meter"><span class="mn">Intensity</span><span class="bar"><span class="fill" style="width:${c.intensity / 14 * 100}%;background:#ffb84d"></span></span><span class="mv">${c.intensity.toFixed(1)}</span></div>
        <div class="meter"><span class="mn">Nausea</span><span class="bar"><span class="fill" style="width:${c.nausea / 14 * 100}%;background:#9aa832"></span></span><span class="mv">${c.nausea.toFixed(1)}</span></div>
        <div class="kv"><span class="k">Top speed</span><span class="v">${Math.round(c.maxSpeed * 3.6)} km/h</span></div>
        <div class="kv"><span class="k">Max / min G</span><span class="v">${c.maxG.toFixed(1)} / ${c.minG.toFixed(1)}</span></div>
        <div class="kv"><span class="k">Airtime</span><span class="v">${(c.airtime || 0).toFixed(1)} s</span></div>
        ${c.stalls ? '<div class="kv"><span class="k" style="color:var(--bad)">Verdict</span><span class="v" style="color:var(--bad)">Train stalls!</span></div>' : ''}
      </div>`;
      h += `<div class="row"><label>Ticket price</label><input type="range" min="0" max="30" value="${c.price}" oninput="Game.setPrice(${c.id},this.value)"><span class="num" id="prc${c.id}">$${c.price}</span></div>`;
      h += `<div class="row"><label>Trains</label><input type="range" min="1" max="3" value="${c.trains.length || 1}" oninput="Coaster.setTrains(this.value)"><span class="num">${c.trains.length || 1}</span></div>`;
      h += `<div class="btnrow"><button class="btn pri" onclick="Coaster.test()">${ICON.flask}Test Ride</button>
            <button class="btn ${c.openR ? '' : 'go'}" onclick="Game.toggleOpen(${c.id});Coaster.refresh()">${c.openR ? ICON.stop + 'Close' : ICON.open + 'Open'}</button></div>`;
      h += `<div class="btnrow"><button class="btn" onclick="Game.rideCam(${c.id})">${ICON.camera}Ride Cam</button>
            <button class="btn pri" onclick="UI.rideReport(${c.id})">${ICON.stats}Full Report</button></div>`;
      h += `<div class="btnrow"><button class="btn dan" onclick="Coaster.demolish()">${ICON.trash}Demolish</button></div>`;
    }
    b.innerHTML = h;
  },
  setPiece(id) { this.piece = id; this.refresh(); },
  setTrains(n) {
    const c = this.active; if (!c) return;
    c.spawnTrains(clamp(+n, 1, 3));
    this.refresh();
  },
  currentGhost() {
    const c = this.active; if (!c || c.track.complete) return null;
    const def = PIECE_BY_ID[this.piece];
    const s = Track.integrate(c.track.endFrame(), def, null, c.track.length, c.track.pieces.length,
      { autoBank: this.autoBank });
    let ok = true;
    for (const p of s) {
      if (p.p.y - WORLD.hAt(p.p.x, p.p.z) < 0.6) ok = false;
      if (!WORLD.ownsWorld(p.p.x, p.p.z)) ok = false;
      if (p.p.y > 130) ok = false;
    }
    if (Park.money < def.cost) ok = false;
    return { samples: s, ok };
  },
  add() {
    const c = this.active; if (!c || c.track.complete) return;
    const gh = this.currentGhost();
    if (!gh || !gh.ok) { UI.notify('Cannot build', 'That piece would leave the park, hit the ground or you cannot afford it.', 'warn'); Audio.play('error'); return; }
    const def = PIECE_BY_ID[this.piece];
    Park.spend(def.cost);
    c.track.append(this.piece, { autoBank: this.autoBank });
    this.rebuild();
    Audio.play('place');
    this.refresh();
  },
  undo() {
    const c = this.active; if (!c) return;
    if (c.track.pieces.length <= 3) { UI.notify('Station', 'The station section cannot be removed.', 'warn'); return; }
    const id = c.track.pieces[c.track.pieces.length - 1];
    c.track.removeLast();
    Park.money += Math.round(PIECE_BY_ID[id].cost * .7);
    c.state = 'building'; c.openR = false;
    this.rebuild();
    this.refresh();
  },
  complete() {
    const c = this.active; if (!c) return;
    const e = c.track.closeError();
    if (!e.ok) return;
    c.track.complete = true;
    c.state = 'closed';
    c.computeStats();
    c.spawnTrains(1);
    c.carMesh = Game.R.makeMesh(buildCarGeo(c.type, false));
    c.frontMesh = Game.R.makeMesh(buildCarGeo(c.type, true));
    this.rebuild();
    Audio.play('complete');
    UI.notify('Circuit complete!', c.name + ' — excitement ' + c.excitement.toFixed(1) + ', intensity ' + c.intensity.toFixed(1) + '. Test it before opening.', 'good');
    this.refresh();
  },
  test() {
    const c = this.active; if (!c || !c.track.complete) return;
    c.computeStats();
    c.tested = true;
    if (c.stalls) {
      UI.notify('Test failed', c.name + ' stalls on the circuit — the train runs out of momentum. Add a chain lift or launch, or lower the hills.', 'bad');
    } else if (c.maxG > 6) {
      UI.notify('Test passed — just', 'Peak force of ' + c.maxG.toFixed(1) + ' G is brutal. Guests will find this terrifying.', 'warn');
    } else {
      UI.notify('Test passed', 'Top speed ' + Math.round(c.maxSpeed * 3.6) + ' km/h, ' + c.airtime.toFixed(1) + ' s of airtime.', 'good');
    }
    c.trains[0].state = 'run'; c.trains[0].v = 3; c.trains[0].d = c.track.stationEnd;
    UI.rideReport(c.id);
  },
  /* --------------------------------------------------------------
     Auto-complete: plans a run of pieces that brings the track back
     to the station. A depth-2 greedy search over the piece catalogue,
     aiming first at an approach point behind the station, then
     straightening in. The player still pays for every piece laid.
     -------------------------------------------------------------- */
  autoComplete() {
    const c = this.active; if (!c || c.track.complete) return;
    let plan = this.planRoute(c.track);
    if (!plan) plan = this.planRoute(c.track, 40000);   // one deeper attempt
    if (!plan) {
      UI.notify('No route found', 'The station is boxed in, too close or too far. Steer nearer by hand and try again.', 'warn');
      return;
    }
    let spent = 0, laid = 0;
    const valid = () => true;
    for (const p of plan) {
      if (Park.money < PIECE_BY_ID[p].cost) { UI.notify('Out of funds', 'Auto-route stopped early.', 'bad'); break; }
      if (!this.tryAutoAdd(c, p, this.validSamples)) break;
      spent += PIECE_BY_ID[p].cost; laid++;
    }
    this.rebuild();
    const e = c.track.closeError();
    if (e.ok) UI.notify('Route home found', laid + ' pieces laid for ' + money(spent) + '. Press Complete Circuit.', 'good');
    else UI.notify('Nearly there', 'Auto-route got within ' + e.d.toFixed(0) + ' m — finish it by hand.', 'warn');
    this.refresh();
  },

  validSamples(samples) {
    for (const p of samples) {
      if (p.p.y - WORLD.hAt(p.p.x, p.p.z) < 0.7) return false;
      if (!WORLD.ownsWorld(p.p.x, p.p.z)) return false;
      if (p.p.y > 130) return false;
    }
    return true;
  },

  /* --------------------------------------------------------------
     A* over (position, heading, height, pitch) using track pieces as
     edges. Long routes are split into two legs — first to an approach
     point behind the station, then straight in — which keeps each
     search small enough to solve quickly.
     -------------------------------------------------------------- */
  planSegment(startFrame, gx, gy, gz, gdx, gdz, tol, budget, ceil) {
    // Never route above the energy the train already has: the apex of the
    // existing track, minus a margin for drag.
    const ceilY = ceil !== undefined ? ceil : Math.max(startFrame.p.y, gy) + 2.5;
    const ACTIONS = ['straight', 'left', 'right', 'lturn', 'rturn', 'up', 'down', 'steepdn', 'level', 'helixl', 'helixr'];
    const key = (f) => {
      const yaw = Math.atan2(f.f.z, f.f.x);
      const pitch = Math.asin(clamp(f.f.y, -1, 1));
      return Math.round(f.p.x / 5) + ',' + Math.round(f.p.z / 5) + ',' + Math.round(f.p.y / 6) + ','
        + ((Math.round(yaw / (PI / 6)) % 12) + 12) % 12 + ',' + Math.round(pitch / (PI / 8));
    };
    const heur = (f) => {
      const d = Math.hypot(f.p.x - gx, f.p.z - gz);
      const dy = Math.abs(f.p.y - gy);
      const dot = f.f.x * gdx + f.f.z * gdz;
      return d + dy * 2.2 + (1 - dot) * tol.align;
    };
    const goal = (f) => Math.hypot(f.p.x - gx, f.p.z - gz) < tol.d
      && Math.abs(f.p.y - gy) < tol.y
      && (f.f.x * gdx + f.f.z * gdz) > tol.dot;

    const nodes = [{ f: startFrame, g: 0, h: heur(startFrame), parent: -1, act: null, depth: 0 }];
    const hk = [0], hv = [nodes[0].h];
    const push = (v, k) => {
      hk.push(k); hv.push(v);
      let c = hk.length - 1;
      while (c > 0) { const p = (c - 1) >> 1; if (hv[p] <= hv[c]) break; const a = hv[p]; hv[p] = hv[c]; hv[c] = a; const b = hk[p]; hk[p] = hk[c]; hk[c] = b; c = p; }
    };
    const pop = () => {
      const top = hk[0], lk = hk.pop(), lv = hv.pop();
      if (hk.length) {
        hk[0] = lk; hv[0] = lv;
        let c = 0;
        for (;;) {
          const l = c * 2 + 1, r = l + 1; let m = c;
          if (l < hv.length && hv[l] < hv[m]) m = l;
          if (r < hv.length && hv[r] < hv[m]) m = r;
          if (m === c) break;
          const a = hv[m]; hv[m] = hv[c]; hv[c] = a; const b2 = hk[m]; hk[m] = hk[c]; hk[c] = b2; c = m;
        }
      }
      return top;
    };
    const seen = new Map([[key(startFrame), 0]]);
    let best = 0, bestH = nodes[0].h, expansions = 0, found = false;
    const W = 2.4;                       // weighted A* — fast, slightly suboptimal
    while (hk.length && expansions < budget) {
      const ni = pop(), node = nodes[ni];
      expansions++;
      if (node.h < bestH) { bestH = node.h; best = ni; }
      if (goal(node.f)) { best = ni; found = true; break; }
      if (node.depth > 40) continue;
      for (const a of ACTIONS) {
        const def = PIECE_BY_ID[a];
        const samples = Track.integrate(node.f, def, null, 0, 0, { autoBank: this.autoBank });
        if (!this.validSamples(samples)) continue;
        const nf = samples[samples.length - 1];
        if (nf.p.y > ceilY) continue;
        const k = key(nf);
        const climb = Math.max(0, nf.p.y - node.f.p.y);
        const g = node.g + def.len + def.cost * 0.0012 + climb * 4.0;
        const prev = seen.get(k);
        if (prev !== undefined && nodes[prev].g <= g) continue;
        const idx = nodes.length;
        nodes.push({ f: nf, g, h: heur(nf), parent: ni, act: a, depth: node.depth + 1 });
        seen.set(k, idx);
        push(g + nodes[idx].h * W, idx);
        if (nodes.length > 60000) { hk.length = 0; hv.length = 0; break; }
      }
    }
    const acts = [];
    let k = best;
    while (k > 0 && nodes[k].act) { acts.push(nodes[k].act); k = nodes[k].parent; }
    acts.reverse();
    return { acts, frame: nodes[best].f, found, h: bestH };
  },

  planRoute(track, budget) {
    const B = budget || 14000;
    const gx = track.start.x, gy = track.start.y, gz = track.start.z;
    const gdx = Math.cos(track.start.yaw), gdz = Math.sin(track.start.yaw);
    const finalTol = { d: 8, y: 4.0, dot: .62, align: 16 };
    const start = track.endFrame();

    // Direct attempt first — short routes solve immediately.
    const ceil = Math.max(start.p.y + 3, gy + 3, track.maxH - 10);
    const direct = this.planSegment(start, gx, gy, gz, gdx, gdz, finalTol, B, ceil);
    if (direct.found) return direct.acts;

    // Otherwise aim for an approach point 34 m behind the station, then run in.
    const ax = gx - gdx * 34, az = gz - gdz * 34;
    const leg1 = this.planSegment(start, ax, gy, az, gdx, gdz, { d: 11, y: 4.5, dot: .80, align: 20 }, B, ceil);
    if (leg1.found) {
      const leg2 = this.planSegment(leg1.frame, gx, gy, gz, gdx, gdz, finalTol, Math.floor(B * .6), ceil);
      if (leg2.found) return leg1.acts.concat(leg2.acts);
      // aligned but short of the station: straights will finish the job
      const fill = [];
      let f = leg1.frame;
      for (let k = 0; k < 8; k++) {
        const sm = Track.integrate(f, PIECE_BY_ID.straight, null, 0, 0, {});
        if (!this.validSamples(sm)) break;
        f = sm[sm.length - 1]; fill.push('straight');
        if (Math.hypot(f.p.x - gx, f.p.z - gz) < 8) break;
      }
      if (Math.hypot(f.p.x - gx, f.p.z - gz) < 9 && Math.abs(f.p.y - gy) < 4.5) return leg1.acts.concat(fill);
      return leg1.acts.length ? leg1.acts : null;
    }
    if (direct.h < 9) return direct.acts;
    return null;
  },

  tryAutoAdd(c, pieceId) {
    const def = PIECE_BY_ID[pieceId];
    if (Park.money < def.cost) return false;
    const s = Track.integrate(c.track.endFrame(), def, null, c.track.length, c.track.pieces.length, { autoBank: this.autoBank });
    if (!this.validSamples(s)) return false;
    Park.spend(def.cost);
    c.track.append(pieceId, { autoBank: this.autoBank });
    return true;
  },

  demolish() {
    const c = this.active; if (!c) return;
    Park.money += Math.round(c.track.pieces.length * 150);
    Park.removeObject(c);
    if (c.stationMesh) c.stationMesh.dispose();
    this.exit();
    UI.notify('Demolished', c.name + ' has been removed.', '');
  },
  rebuild() {
    const c = this.active || Coaster._rebuildTarget;
    if (!c) return;
    if (c.trackMesh) c.trackMesh.dispose();
    c.trackMesh = Game.R.makeMesh(buildTrackGeo(c.track));
  },
  updateGhost(R) {
    if (!this.active || this.active.track.complete) {
      if (this.ghostMesh) { this.ghostMesh.dispose(); this.ghostMesh = null; }
      return;
    }
    const gh = this.currentGhost();
    if (!gh) return;
    const key = this.piece + '|' + this.active.track.pieces.length + '|' + (this.autoBank ? 1 : 0);
    if (key !== this._ghostKey) {
      this._ghostKey = key;
      if (this.ghostMesh) this.ghostMesh.dispose();
      this.ghostMesh = R.makeMesh(buildGhostGeo(this.active.track, gh.samples, gh.ok));
      this.ghostOK = gh.ok;
    }
  },

  /* ---- train physics ---- */
  simulate(c, dt) {
    const t = c.track;
    if (!t || !t.complete) return;
    const T = c.type;
    for (let ti = 0; ti < c.trains.length; ti++) {
      const tr = c.trains[ti];
      if (tr.state === 'station') {
        tr.d = t.stationEnd * .5;
        tr.v = 0;
        tr.timer -= dt;
        // load guests
        if (c.openR && !c.broken) {
          while (tr.riders.length < c.cap && c.queue.length) {
            const g = c.queue.shift();
            if (!g || g.dead) continue;
            g.boardRide(c); tr.riders.push(g);
          }
        }
        if (tr.timer <= 0) {
          // keep the doors open while there are still guests to load
          if (c.openR && !c.broken && c.queue.length && tr.riders.length < c.cap) { tr.timer = 1.2; }
          else {
            // block safety: don't dispatch if another train is still near the station
            let clear = true;
            for (const o of c.trains) if (o !== tr && o.state === 'run' && o.d < t.length * .35) clear = false;
            if (clear) { tr.state = 'run'; tr.v = 3.2; tr.d = t.stationEnd; }
            else tr.timer = 1;
          }
        }
        continue;
      }
      // running
      const steps = Math.max(1, Math.min(6, Math.ceil(dt / 0.02)));
      const h = dt / steps;
      for (let s = 0; s < steps; s++) {
        const sm = t.sampleAt(tr.d);
        if (!sm) break;
        if (tr.d > t.length - 30) {
          tr.v = damp(tr.v, 5.0, 3, h);              // powered approach into the station
        } else if (sm.lift) {
          tr.v = damp(tr.v, 6.2, 4, h);
          if (tr.v < 6.0) tr.v = damp(tr.v, 6.2, 6, h);
        } else if (sm.boost) {
          tr.v = tr.v < sm.boost ? Math.min(sm.boost, tr.v + 11 * h) : damp(tr.v, sm.boost, 3, h);
        } else if (sm.launch) {
          tr.v = Math.min(T.maxSpeed, tr.v + 28 * h);
        } else if (sm.brake) {
          tr.v = Math.max(4.0, tr.v - 11 * h);
        } else {
          tr.v += (-G * Math.sin(sm.pitch) - T.fric * tr.v * tr.v - 0.07) * h;
        }
        if (tr.v < .5) tr.v = .5;
        if (tr.v > T.maxSpeed * 1.25) tr.v = T.maxSpeed * 1.25;
        tr.d += tr.v * h;
        if (tr.d >= t.length) {
          tr.d -= t.length;
          tr.state = 'station'; tr.timer = 5.5;
          // unload
          for (const g of tr.riders) g.finishRide(c);
          c.ridden += tr.riders.length;
          Park.money += tr.riders.length * c.price;
          c.revenue += tr.riders.length * c.price;
          Park.log.ticket += tr.riders.length * c.price;
          tr.riders.length = 0;
          c.wear += .004;
          if (c.openR && Math.random() > c.reliability - c.wear) {
            c.broken = true; c.state = 'broken';
            Park.needMechanic.push(c);
            UI.notify('Breakdown!', c.name + ' has broken down — send a mechanic.', 'bad');
          }
          break;
        }
      }
      // G forces for HUD
      const sm = t.sampleAt(tr.d);
      if (sm) {
        const cv = t.curvatureAt(tr.d);
        tr.g = Math.cos(sm.pitch) * Math.cos(sm.bank) + (tr.v * tr.v * (cv.ver || 0)) / G;
        tr.lat = (tr.v * tr.v * (cv.lat || 0)) / G;
      }
      // transforms
      const carLen = 4.2;
      for (let k = 0; k < tr.cars.length; k++) {
        const car = tr.cars[k];
        let dd = tr.d - k * carLen;
        if (dd < 0) dd += t.length;
        const s2 = t.sampleAt(dd);
        if (!s2) continue;
        const r = V3.cross({}, s2.f, s2.u);
        M4.fromBasis(car.m, r.x, r.y, r.z, s2.u.x, s2.u.y, s2.u.z, s2.f.x, s2.f.y, s2.f.z, s2.p.x, s2.p.y, s2.p.z, 1, 1, 1);
        car.s = s2;
      }
    }
  }
};
/* ============================================================================
   SECTION 18 — PROCEDURAL AUDIO
   Small WebAudio synth: UI clicks, cash, construction, coaster rumble, crowd.
   ========================================================================== */
const Audio_ = {
  ctx: null, master: null, on: true, rumble: null, rumbleGain: null, crowdGain: null,
  init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = .35;
      this.master.connect(this.ctx.destination);
      // continuous coaster rumble (noise through a bandpass)
      const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * .5;
      const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 220; bp.Q.value = .8;
      this.rumbleGain = this.ctx.createGain(); this.rumbleGain.gain.value = 0;
      src.connect(bp); bp.connect(this.rumbleGain); this.rumbleGain.connect(this.master);
      src.start();
      // crowd murmur
      const src2 = this.ctx.createBufferSource(); src2.buffer = buf; src2.loop = true;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      this.crowdGain = this.ctx.createGain(); this.crowdGain.gain.value = 0;
      src2.connect(lp); lp.connect(this.crowdGain); this.crowdGain.connect(this.master);
      src2.start();
    } catch (e) { this.ctx = null; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, dur, type, vol, slide) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || .2, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);

      case 'place': this.tone(340, .10, 'triangle', .12, 520); break;
      case 'build': this.tone(180, .18, 'sawtooth', .10, 90); this.tone(520, .1, 'square', .05); break;
      case 'cash': this.tone(880, .08, 'square', .09); setTimeout(() => this.tone(1320, .12, 'square', .07), 70); break;
      case 'error': this.tone(150, .18, 'sawtooth', .12, 90); break;
      case 'complete': [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, .22, 'triangle', .12), i * 90)); break;
      case 'scream': this.tone(rnd(500, 900), .5, 'sawtooth', .05, rnd(200, 400)); break;
      case 'open': [392, 523, 659].forEach((f, i) => setTimeout(() => this.tone(f, .18, 'sine', .12), i * 80)); break;

  setRumble(v) { if (this.rumbleGain) this.rumbleGain.gain.value = clamp(v, 0, .5); },
  setCrowd(v) { if (this.crowdGain) this.crowdGain.gain.value = clamp(v, 0, .12); }

const PF = {
  cache: {},
  get(key, make) {
    if (this.cache[key]) return this.cache[key];
    const built = make();
    const R = Game.R;
    const entry = { mesh: R.makeMesh(built.base), parts: built.parts.map(p => ({ mesh: R.makeMesh(p.geo), anim: p.anim })) };
    this.cache[key] = entry;
    return entry;
  },
  shop(def) { return this.get('shop_' + def.id, () => Prefab.shop(def)); },
  /* Single merged mesh of a prefab in a neutral pose — used for the build ghost. */
  ghost(kind, def) {
    const key = 'ghost_' + kind + '_' + (def.id || def.kind);
    if (this.cache[key]) return this.cache[key];
    const built = kind === 'shop' ? Prefab.shop(def) : kind === 'ride' ? Prefab.ride(def.kind, def) : Prefab.scenery(def.kind, 2);
    const g = new Geo();
    g.merge(built.base);
    const m = M4.create();
    for (const part of built.parts) { part.anim(m, { spin: 0.5, h: 0.4 }, 0.5); g.mergeM(part.geo, m); }
    const entry = { mesh: Game.R.makeMesh(g), parts: [] };
    this.cache[key] = entry;
    return entry;
  },
  ride(def) { return this.get('ride_' + def.id, () => Prefab.ride(def.kind, def)); },
  scenery(def, seed) { return this.get('sc_' + def.kind, () => Prefab.scenery(def.kind, 3)); },
  sceneryGeo(def, seed) {
    const k = 'scg_' + def.kind + '_' + (seed % 4);
    if (!this.cache[k]) this.cache[k] = Prefab.scenery(def.kind, seed % 4);
    return this.cache[k];
  }
};

/* ============================================================================
   SECTION 19b — THUMBNAIL RENDERER
   Every catalogue entry and every piece of track is previewed with a real
   render of its own geometry, produced on a second, offscreen GL context.
   ========================================================================== */
const Thumbs = {
  size: 168,
  cache: {},
  R: null, cv: null,

  init() {
    this.cv = document.createElement('canvas');
    this.cv.width = this.cv.height = this.size;
    this.R = new Renderer(this.cv, { alpha: true, shadowSize: 256 });
    const R = this.R;
    R.aspect = 1;
    R.shadowOn = 0;
    R.fogDens = 0;
    V3.norm(R.sun.dir, V3.set(R.sun.dir, .48, .74, .48));
    R.sun.col = [1.02, .98, .92];
    R.sky = [.46, .52, .60];
    R.gnd = [.26, .25, .24];
  },

  /* Render a Geo from a three-quarter view that frames it exactly. */
  shot(geo, opt) {
    if (!this.R) this.init();
    opt = opt || {};
    const R = this.R, gl = R.gl;
    if (!geo.pos.length) return '';
    let x0 = 1e9, y0 = 1e9, z0 = 1e9, x1 = -1e9, y1 = -1e9, z1 = -1e9;
    for (let i = 0; i < geo.pos.length; i += 3) {
      const x = geo.pos[i], y = geo.pos[i + 1], z = geo.pos[i + 2];
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (z < z0) z0 = z; if (z > z1) z1 = z;
    }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, cz = (z0 + z1) / 2;
    const rad = Math.max(.5, Math.hypot(x1 - x0, y1 - y0, z1 - z0) / 2);
    const yaw = opt.yaw !== undefined ? opt.yaw : -2.35;
    const pitch = opt.pitch !== undefined ? opt.pitch : 0.52;
    const FOV = 30 * DEG, tanH = Math.tan(FOV / 2);
    // view axis pointing from the camera towards the model
    const ax = -Math.cos(yaw) * Math.cos(pitch), ay = -Math.sin(pitch), az = -Math.sin(yaw) * Math.cos(pitch);
    // Fit every corner of the bounding box in frame rather than guessing a
    // multiplier — otherwise anything tall and thin gets its head cut off.
    let dist = rad;
    for (const px of [x0, x1]) for (const py of [y0, y1]) for (const pz of [z0, z1]) {
      const vx = px - cx, vy = py - cy, vz = pz - cz;
      const along = vx * ax + vy * ay + vz * az;
      const perp = Math.hypot(vx - ax * along, vy - ay * along, vz - az * along);
      dist = Math.max(dist, perp / tanH + along);
    }
    dist *= (opt.zoom || 1.06);
    const eye = V3.make(cx - ax * dist, cy - ay * dist, cz - az * dist);
    R.setCamera(eye, V3.make(cx, cy, cz), WORLD_UP, FOV, Math.max(.05, dist * .04), dist * 8);
    const mesh = R.makeMesh(geo);
    gl.viewport(0, 0, this.size, this.size);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    R.useProgram(R.progMain, false);
    R.draw(mesh);
    const url = this.cv.toDataURL('image/png');
    mesh.dispose();
    return url;
  },

  /* Queue every catalogue thumbnail and render a couple per frame. */
  warmQueue: null,
  warm(budgetMs) {
    if (!this.warmQueue) {
      this.warmQueue = [];
      for (const d of CAT.coasterTypes) this.warmQueue.push(() => this.coasterType(d));
      for (const d of PIECES) this.warmQueue.push(() => this.piece(d));
      for (const d of CAT.rides) this.warmQueue.push(() => this.ride(d));
      for (const d of CAT.shops) this.warmQueue.push(() => this.shop(d));
      for (const d of CAT.scenery) this.warmQueue.push(() => this.scenery(d));
      for (const d of CAT.staff) this.warmQueue.push(() => this.staff(d));
      for (const k of ['path', 'queue', 'plaza', 'erase']) this.warmQueue.push(() => this.path(k));
    }
    const t0 = performance.now();
    while (this.warmQueue.length && performance.now() - t0 < (budgetMs || 6)) this.warmQueue.shift()();
    return this.warmQueue.length;
  },

  get(key, make, opt) {
    if (this.cache[key] !== undefined) return this.cache[key];
    let url = '';
    try { url = this.shot(make(), opt); } catch (e) { console.warn('thumb', key, e); }
    this.cache[key] = url;
    return url;
  },

  shop(def) { return this.get('shop:' + def.id, () => Prefab.shop(def).base, { yaw: -2.2, pitch: .42, zoom: 1.05 }); },
  ride(def) {
    return this.get('ride:' + def.id, () => {
      const pf = Prefab.ride(def.kind, def);
      const g = new Geo();
      g.merge(pf.base);
      const m = M4.create();
      const fake = { spin: 0.6, h: 0.45 };
      for (const part of pf.parts) { part.anim(m, fake, 0.6); g.mergeM(part.geo, m); }
      return g;
    }, { yaw: -2.2, pitch: .40, zoom: 1.04 });
  },
  scenery(def) {
    return this.get('sc:' + def.kind, () => {
      const pf = Prefab.scenery(def.kind, 2);
      const g = new Geo(); g.merge(pf.base);
      const m = M4.create();
      for (const part of pf.parts) { part.anim(m, { spin: 0, h: 0 }, 0.4); g.mergeM(part.geo, m); }
      return g;
    }, { yaw: -2.3, pitch: .38, zoom: 1.08 });
  },
  staff(def) {
    return this.get('staff:' + def.id, () => Prefab.person(def.color, 0x2c3e50, 0xe8b184, 0x4a2c14), { yaw: -1.9, pitch: .18, zoom: 1.12 });
  },
  path(kind) { return this.get('path:' + kind, () => Prefab.pathSample(kind), { yaw: -2.3, pitch: .55, zoom: 1.02 }); },

  /* A short demo train + track in the style of the chosen coaster */
  coasterType(type) {
    return this.get('ct:' + type.id, () => {
      const t = new Track(type, 0, 6, 0, 0);
      t.append('straight'); t.append('right'); t.append('down'); t.append('level');
      const g = buildTrackGeo(t);
      const sm = t.sampleAt(t.length * .18);
      if (sm) {
        const r = V3.cross({}, sm.f, sm.u);
        const m = M4.fromBasis(M4.create(), r.x, r.y, r.z, sm.u.x, sm.u.y, sm.u.z, sm.f.x, sm.f.y, sm.f.z, sm.p.x, sm.p.y, sm.p.z, 1, 1, 1);
        g.mergeM(buildCarGeo(type, true), m);
      }
      return g;
    }, { yaw: -2.45, pitch: .30, zoom: 1.02 });
  },

  /* Literally a picture of the track piece, entered from level track */
  piece(def) {
    return this.get('pc:' + def.id, () => {
      const t = new Track(CAT.coasterTypes[0], 0, 40, 0, 0);
      t.samples.length = 0; t.pieces.length = 0; t.length = 0;
      t.append('straight');
      const from = t.samples.length;
      t.append(def.id, { autoBank: true });
      t.append('straight');
      const g = new Geo();
      const S = t.samples, gauge = 1.25;
      const railC = hex(def.lift ? 0xf0c419 : def.brake ? 0xff4d4d : def.launch ? 0xf5c518 : 0x39c0ff);
      const dim = hex(0x5a6472);
      for (let i = 0; i + 1 < S.length; i++) {
        const a = S[i], b = S[i + 1];
        const active = i >= from - 1 && i <= from + Math.round(def.len / .6);
        const c = active ? railC : dim;
        const ra = V3.cross({}, a.f, a.u), rb = V3.cross({}, b.f, b.u);
        for (const side of [-1, 1]) {
          g.beam(a.p.x + ra.x * side * gauge, a.p.y + ra.y * side * gauge, a.p.z + ra.z * side * gauge,
            b.p.x + rb.x * side * gauge, b.p.y + rb.y * side * gauge, b.p.z + rb.z * side * gauge,
            .30, .30, c, a.u.x, a.u.y, a.u.z);
        }
        if (i % 3 === 0) {
          g.beam(a.p.x + ra.x * gauge, a.p.y + ra.y * gauge, a.p.z + ra.z * gauge,
            a.p.x - ra.x * gauge, a.p.y - ra.y * gauge, a.p.z - ra.z * gauge,
            .26, .26, active ? shade(c, .8) : dim, a.u.x, a.u.y, a.u.z);
          const sp = [a.p.x + a.u.x * -.55, a.p.y + a.u.y * -.55, a.p.z + a.u.z * -.55];
          g.beam(a.p.x, a.p.y, a.p.z, sp[0], sp[1], sp[2], .3, .3, active ? shade(c, .7) : dim);
        }
      }
      return g;
    }, { yaw: -2.45, pitch: .34, zoom: 1.05 });
  }
};

      this.mouse.x = e.clientX; this.mouse.y = e.clientY;
