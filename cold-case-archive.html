doc({ id: 'fa_offense', c: 'fairbanks', init: true, type: 'report', form: 'OFFENSE REPORT', title: 'Offense Report', date: '05/25/1974',
  fields: [['CASE NO.', '74-0610'], ['OFFENSE', 'Homicide'], ['VICTIM', 'FAIRBANKS, Annette L. — W/F — 19'], ['LOCATION', 'Lakeview Park beach, near old boathouse (5th Precinct)'], ['OFFICER', 'Det. L. Varner #377']],
  body: `<p>At 0530 hrs on 05/25/74, a city parks employee found the body of a young woman on the beach at Lakeview Park, [[fa_water|near the old boathouse, about 20 feet from the waterline]]. Identified as Annette "Nettie" FAIRBANKS, 19, a first-year student at St. Brendan's School of Nursing, living in the school residence hall.</p>
<p>Ligature: [[fa_knot|white cotton cord, tied in a tight binding knot. It was photographed in place (photo #6) and cut at autopsy so the knot was preserved.]]</p>
<p>[[fa_shoe|She was wearing one brown penny loafer, on her right foot. The left was not found on the beach or in the park.]]</p>
<p>The victim left the residence hall at about 2215 hrs to "walk by the lake." A classmate saw her at 2300 talking to a man on the boardwalk (statement attached).</p>
<p>Developed suspect: HAYES, Darnell, night custodian at St. Brendan's School of Nursing. See attached.</p><p class="sig">L. Varner</p><span class="sigline">Det. Louis Varner #377, 5th Precinct</span>` });
doc({ id: 'fa_autopsy', c: 'fairbanks', init: true, type: 'report', org: 'OFFICE OF THE COUNTY MEDICAL EXAMINER', form: 'POSTMORTEM REPORT', title: 'Medical Examiner\'s Report', date: '05/26/1974',
  body: `<p><b>Cause of death:</b> Ligature strangulation.</p><p><b>Time of death:</b> about 2300 to 0100 hrs.</p><p><b>Findings:</b> Sexual assault. Vaginal swabs taken; smears on two glass slides show spermatozoa. Slides retained (one slide remains; the other was broken in transit to the FBI). Two head hairs recovered from the front of the victim's cardigan sweater and sent to the FBI Laboratory.</p><p>Manner: HOMICIDE.</p><p class="sig">J. Abernathy</p><span class="sigline">James Abernathy, M.D., Deputy Medical Examiner</span>` });
doc({ id: 'fa_tate', c: 'fairbanks', init: true, type: 'stmt', form: 'WITNESS STATEMENT', title: 'Statement of Gloria Tate', date: '05/25/1974',
  fields: [['WITNESS', 'TATE, Gloria — 24 — nursing student']],
  body: `<p>I was walking back from the Rexall about eleven and I saw Nettie on the boardwalk by the boathouse, talking to a man. She waved at me. [[fa_tate_desc|He was white, in his thirties, I think, in a navy peacoat and a knit watch cap even though it was warm. Very pale eyes. When he put his hand on the railing I saw a tattoo on the back of his left hand, a star, like a compass star.]] He didn't look at me. Nettie looked happy. She liked talking to people. That was the thing about her.</p><p class="sig">Gloria Tate</p>
<span class="pencil">Witness doesn't know Hayes. Lighting poor. — LV</span>` });
doc({ id: 'fa_fbi', c: 'fairbanks', init: true, type: 'lab', org: 'FEDERAL BUREAU OF INVESTIGATION — LABORATORY DIVISION', form: 'REPORT OF EXAMINATION — MICROSCOPIC ANALYSIS', title: 'FBI Hair Report (1974)', date: '07/30/1974',
  fields: [['YOUR NO.', '74-0610'], ['FBI FILE', '95-HQ-31447'], ['EXAMINER', 'SA R. Whitcomb, Hairs & Fibers Unit']],
  body: `<p>Specimens: Q1, Q2, two head hairs from victim's sweater. K1, known head hair sample of Darnell HAYES (25 hairs).</p>
<p>Result: [[fa_hair_hayes|The questioned hairs Q1 and Q2 exhibit the same microscopic characteristics as the known head hairs of Darnell HAYES and are therefore consistent with having originated from HAYES.]]</p>
<p>Hair comparisons are not a basis for absolute personal identification.</p><p class="sig">R. Whitcomb</p><span class="sigline">Special Agent Robert Whitcomb</span>` });
doc({ id: 'fa_hayes', c: 'fairbanks', init: true, type: 'report', form: 'SUSPECT WORKUP', title: 'Suspect Workup — Darnell Hayes', date: '06/03/1974',
  fields: [['SUBJECT', 'HAYES, Darnell — B/M — 23'], ['BY', 'Det. Varner']],
  body: `<p>[[fa_hayes_job|Night custodian at St. Brendan's School of Nursing since 1972, assigned to the residence hall where the victim lived.]] Prior arrest: 1970, disorderly conduct (dismissed). Ten-print card on file.</p>
<p>[[fa_hayes_noalibi|Subject states he finished his shift at 2200 hrs and walked home to his room on Kelso St., where he lives alone. No witnesses.]]</p>
<p>Subject was "evasive and nervous" in interview. [[fa_hayes_bt|Employee health record, St. Brendan's: blood type B.]] Known hair sample taken with consent, sent to FBI.</p>
<p>[[fa_varner|Recommend arrest. — 06/1974. DA KITTREDGE DECLINED, 08/1974: "A hair is not a case. Your witness describes a white man with a tattoo."]]</p>` });

  body: `<div class="mast">The Port Avery Ledger</div><div class="ndate">WEDNESDAY, JUNE 5, 1974 · FIFTEEN CENTS</div><h1>Janitor Questioned in Nurse Student Slaying</h1><h2>Police: "Scientific evidence" being studied by FBI</h2><div class="cols"><p>A custodian at St. Brendan's School of Nursing was questioned for a second time yesterday in the strangling death of student Annette Fairbanks, 19, whose body was found on the Lakeview Park beach May 25.</p><p>Detective Louis Varner of the Fifth Precinct said hair samples had been sent to the FBI Laboratory in Washington and that he expected "a scientific answer within weeks."</p><p>The custodian, who has not been charged, could not be reached for comment. Students at the residence hall have been asked not to walk alone after dark.</p></div>` });

person('hayes', { name: 'Darnell Hayes', born: 1951, cases: ['fairbanks'], suspect: true, known0: true, loc0: true, bt: 'B', prints: () => true, role: 'Night custodian, St. Brendan\'s (1974)',
  scene: () => fl('exon:hayes') ? 'The porch of a small house on the east side. He does not invite you in. He does not tell you to leave.' : (cstat('fairbanks').perp === 'hayes' && cstat('fairbanks').st === 'closed') ? 'State Prison, visiting room. He looks at you the whole time without blinking.' : "St. Brendan's Hospital boiler room, where he's now on the maintenance crew. He keeps working while you talk.",
  topics: [
    { id: 'night', q: 'Tell me about May 24th, 1974.', a: 'I finished at ten. I walked home to Kelso Street. Nobody walked with me, because nobody ever walked with me. Detective Varner had me in a room for a day and a half. He said my hair was on her. I never touched that girl. I mopped the floor she walked on. That\'s all I ever did to her.' },
    { id: 'after', q: 'What happened after the DA refused to charge you?', a: 'The Ledger said "janitor questioned" with a picture of the school. Everybody at St. Brendan\'s knew who the janitor was. My landlord asked me to move. My mother\'s church prayed for me, out loud, by name, like I was sick. Fourteen years. You want to know what happened? Nothing happened, every day.' },
  ] });

doc({ id: 'rv_vicapdoc', c: 'sorensen', type: 'lab', org: 'FBI — NATIONAL CENTER FOR THE ANALYSIS OF VIOLENT CRIME, QUANTICO', form: 'VICAP — CRIME ANALYSIS REPORT', title: 'VICAP reply',

/* =====================================================================
   CASE 76-1102 — THE DELANCEY STREET FIRE — "Conviction Review"
   Truth: there was no crime. An electric space heater on an extension
   cord in a cold house. Roy Delacroix was convicted on arson folklore
   and a paid jailhouse informant.
   ===================================================================== */
addCase({
  id: 'delacroix', no: '76-1102', year: 1976, title: 'The Delancey Street Fire', label: 'DELACROIX, R.\nArson / murder — 1976', kind: 'Conviction under review',
  closure: 'review', target: 'roy', initStatus: { st: 'convicted', perp: 'roy' },
  blurb: 'Monday, February 2, 1976, 2:40 a.m. A fire at 1417 Delancey Street killed three children: Ava, 6, Jonah, 4, and Lily, 2. Their father, Roy Delacroix, got out with burns on his hands. The fire marshal said the fire was set. A man from the county jail said Roy confessed. A jury agreed. This box isn\'t unsolved. It\'s here because Roy writes to it.',
  outcome: (s, p, living) => living
    ? `<p>On ${proseDate(s.t)}, Circuit Judge Andrea Kowalczyk vacated the 1977 convictions of Roy Delacroix. The Prosecuting Attorney declined to retry him. The State's own expert would no longer testify that the fire was set.</p><p>Roy Delacroix walked out of Northfield State Prison at 4:15 in the afternoon after ${YQ(s.t).y - 1976} years, carrying everything he owned in a mesh laundry bag. Celeste was waiting in the parking lot. He asked her to drive him to the cemetery before anything else, and she did.</p>`
    : `<p>On ${proseDate(s.t)}, Circuit Judge Andrea Kowalczyk vacated the 1977 convictions of Roy Delacroix, who died in Northfield State Prison in 2002. The order is called a <b>posthumous exoneration</b>. Under the law it means that he did not do it. It doesn't mean anything else.</p><p>Celeste had the court order framed and hung it in her kitchen, across from the photograph of the three children on the front steps at Delancey Street.</p>`,
  epilogue: s => {
    const st = cstat('delacroix');
    if (st.st === 'exonerated') return st.posthumous
      ? `Roy Delacroix's name was cleared after his death. The State Fire Marshal's office now trains its investigators on NFPA 921. Vern Albrecht's photographs from Delancey Street are used in the course as an example of what not to conclude.`
      : `Roy Delacroix lives in a rented room above a barbershop on Calder Street and works mornings at the Salvation Army warehouse. Every February 2nd he and Celeste drive to Oakwood Cemetery together. He sent B-14 one more letter. It said only: "Thank you. I'm warm."`;
    return dead('roy') ? `Roy Delacroix died in Northfield State Prison in 2002, still convicted of setting the fire that killed his children. His last letter is in the box.` : `Roy Delacroix is still in Northfield State Prison. His letters still come every Christmas.`;
  },
});

doc({ id: 'de_marshal', c: 'delacroix', init: true, type: 'report', org: 'PORT AVERY FIRE DEPARTMENT — FIRE MARSHAL DIVISION', form: 'FIRE INVESTIGATION REPORT', title: "Fire Marshal's Report", date: '02/09/1976',
  fields: [['INCIDENT', '76-0207'], ['ADDRESS', '1417 Delancey St. (1-1/2 story frame dwelling)'], ['FATALITIES', '3 (children)'], ['INVESTIGATOR', 'Fire Marshal V. Albrecht']],
  body: `<p>This investigator examined the fire scene on 02/02/76 and 02/03/76. Findings:</p>
<p>1. [[de_pour|Irregular, puddle-shaped burn patterns ("pour patterns") on the floor of the hallway and of the children's bedroom indicate that a liquid accelerant was poured and ignited. A trail runs from the hall into the bedroom.]] (Photo F-3)</p>
<p>2. [[de_crazed|The glass of the children's bedroom window shows extensive "crazing" (a fine network of cracks), which indicates very rapid heating consistent with an accelerant-fed fire.]] (Photo F-7)</p>
<p>3. [[de_low|Charring under the bedroom door threshold and low on the walls indicates burning liquid flowed at floor level.]]</p>
<p>4. [[de_two|Two separate and distinct points of origin are present, one in the hallway and one in the children's bedroom. Multiple origins are a classic indicator of an incendiary fire.]]</p>
<p>5. An electric space heater was found in the children's bedroom in the OFF position. It was not involved in the ignition. (Photo F-9)</p>
<p>6. Floor samples taken for laboratory analysis. [[de_burned_off|See lab report; any negative result is explained by the accelerant being consumed in the fire.]]</p>
<p><b>Conclusion:</b> The fire was INCENDIARY, intentionally set with a liquid accelerant.</p><p class="sig">V. Albrecht</p><span class="sigline">Vernon Albrecht, Fire Marshal, 26 years' service</span>` });
doc({ id: 'de_gc', c: 'delacroix', init: true, type: 'lab', org: 'STATE CRIME LABORATORY — CHEMISTRY', form: 'REPORT OF ANALYSIS — FIRE DEBRIS', title: 'Lab Report: fire debris (1976)', date: '02/24/1976',
  fields: [['AGENCY NO.', 'PAFD 76-0207'], ['METHOD', 'Gas chromatography, headspace']],
  body: `<p>Items: S-1, floor debris, hallway "pour" area. S-2, floor debris, children's bedroom "pour" area. S-3, threshold debris, children's bedroom door. S-4, comparison sample, front room.</p>
<p>Result: [[de_gc_neg|No ignitable liquid residues were detected in items S-1 through S-4.]]</p><p class="sig">T. Ruhl</p><span class="sigline">Thomas Ruhl, Chemist II</span>
<span class="pencil">Consumed by fire. Doesn't change my opinion. — V.A.</span>` });
doc({ id: 'de_engine', c: 'delacroix', init: true, type: 'report', org: 'PORT AVERY FIRE DEPARTMENT', form: 'ENGINE COMPANY 7 — RUN REPORT', title: 'Engine Co. 7 run report', date: '02/02/1976',
  body: `<p>Alarm 0241. On scene 0246. [[de_flashover_rpt|On arrival: heavy fire through the front-left (children's) bedroom window and venting through the roof above it. The room was fully involved.]] Adult male on front lawn with burned hands, screaming that his children were inside.</p>
<p>[[de_hose|0249: 1-3/4" line directed through the children's bedroom window from the exterior to knock down the fire.]] 0252: interior attack through the front door. 0258: three children located in the bedroom, deceased.</p><p>Fire under control 0317. Cold outside, about 4&deg;F. The hydrant on the corner was frozen and a second line had to be laid from Fulton Street.</p><p class="sig">Capt. D. Mahoney</p>` });
doc({ id: 'de_roy76', c: 'delacroix', init: true, type: 'stmt', form: 'STATEMENT OF ACCUSED', title: "Roy Delacroix's statement", date: '02/02/1976',
  body: `<p>My wife was at work, nights at St. Brendan's. I was asleep on the couch in the front room with the TV on. I woke up choking. The hall was orange. [[de_roy_burns|I went for the kids' door and the knob burned my hand, look at my hand. I couldn't open it.]] So I ran out the front to get to their window from outside, because I thought I could break it and get them through.</p>
<p>[[de_window_blew|When I got around to the window it blew out at me like a bomb. Fire came out of it sideways.]] I couldn't get near it. I was screaming. The firemen came.</p>
<p>[[de_heater|The kids had the electric heater in their room because the furnace has been broke since January. The landlord won't fix it.]] I don't know how it started. I would never hurt my kids. I would never.</p><p class="sig">Roy Delacroix</p>` });
doc({ id: 'de_trial', c: 'delacroix', init: true, type: 'report', org: 'CIRCUIT COURT — COUNTY OF PORT AVERY', form: 'PEOPLE v. DELACROIX — TRIAL TRANSCRIPT (EXCERPTS)', title: 'Trial transcript excerpts', date: '1977',
  body: `<p><b>Direct examination of LESTER GAINES (Vol. III, p. 412):</b></p><p>Q. What did the defendant tell you in the county jail?<br>A. [[de_gaines_test|He said he poured it so it'd look like an accident. He said his wife was going to leave him and take the kids, and she wasn't going to get them.]]<br>Q. Have you been promised anything for your testimony?<br>A. No sir. I just think it's wrong what he did.</p>
<p><b>Cross-examination of V. ALBRECHT (Vol. II, p. 288):</b></p><p>Q. The lab found no accelerant, isn't that right?<br>A. In my experience, accelerant burns off. I've been to over four hundred fires. I know a pour pattern when I see one.</p>
<p><b>Closing argument, Asst. Prosecutor D. Kittredge (Vol. IV, p. 601):</b></p><p>"[[de_closing|Ladies and gentlemen, ask yourselves what kind of father runs out the front door instead of into his children's room.]]"</p>
<p><b>Verdict:</b> Guilty, three counts of first-degree murder, one count of arson. Sentence: life without parole.</p>` });

doc({ id: 'de_letter88', c: 'delacroix', init: true, type: 'hand', title: 'Letter from Roy Delacroix', date: 'Dec 1987',
  body: `<span class="date">Northfield State Prison — December 18, 1987</span><p>To whoever has the box now,</p><p>The lady in Records writes back to me every year, so I know somebody is down there. This is my eleventh Christmas letter. I'm not asking for anything except that someone reads it.</p><p>I did not set that fire. I think it was the heater. We had it on the cord because the plug by Lily's crib didn't work. I told them that the first night and every night after.</p><p>Ava would be eighteen this year. She wanted to be a veterinarian.</p><p>Merry Christmas.<br>Roy Delacroix #149-302</p>` });

doc({ id: 'de_review', c: 'delacroix', type: 'lab', org: 'HALDANE FIRE ENGINEERING, P.C. — ANN ARBOR', form: 'INDEPENDENT FIRE ORIGIN & CAUSE REVIEW (NFPA 921)', title: 'Independent fire review (NFPA 921)',
  body: `<p>At the request of the PAPD Cold Case Archive, I reviewed the Fire Marshal's 1976 report and photographs, the Engine 7 run report, the 1976 laboratory analysis, and the trial testimony, applying NFPA 921, <i>Guide for Fire and Explosion Investigations</i>.</p>
<p><b>1. "Pour patterns."</b> [[de_flashover|The children's bedroom was fully involved when Engine 7 arrived. The room had reached flashover. After flashover, radiant heat and burning floor coverings produce irregular, puddle-like burns that can't be told apart from liquid pours by eye. The 1990 Lime Street test fire showed exactly this. The "trail" into the hall follows the path of fire and gases out the bedroom door.]]</p>
<p><b>2. Crazed glass.</b> [[de_crazing_water|Crazing is caused by rapid <i>cooling</i>, not rapid heating. Water hitting hot glass does it. Engine 7 sprayed a hose line into this exact window at 0249.]]</p>
<p><b>3. Low burns and threshold burns.</b> These are expected in a post-flashover room. They are not evidence of liquid.</p>
<p><b>4. "Two points of origin."</b> [[de_origin|The hallway burning is fire spread from the bedroom, drawn by the open front door when Mr. Delacroix ran outside. It is one fire.]]</p>
<p><b>5. The heater.</b> [[de_arc|The remains of the extension cord at the bedside show beads characteristic of electrical arcing, meaning the circuit was energized when the fire reached it. The heater's switch position can't be read from a melted knob. The area of origin is consistent with the bedside, where the heater sat close to the bedding.]]</p>
<p><b>6.</b> No ignitable liquid was found in any sample, including the alleged pour areas.</p>
<p><b>Opinion:</b> Nothing in the record supports an incendiary classification. The cause should have been classified as <b>undetermined</b>, with an accidental electrical or heater ignition at the bedside as the most probable hypothesis. To a reasonable degree of engineering certainty, the 1976 conclusion was not scientifically supportable.</p><p class="sig">Paul Haldane</p><span class="sigline">Paul Haldane, P.E., C.F.E.I.</span>` });

/* ---------- findings ---------- */

person('roy', { name: 'Roy Delacroix', born: 1948, died: T(2002, 2), spare: () => cstat('delacroix').st === 'exonerated' && cstat('delacroix').t < T(2002, 2), cases: ['delacroix'], known0: true, loc0: true, role: 'Convicted 1977; Northfield State Prison #149-302',

  onDeath: (s, heads) => mail({ from: 'Northfield State Prison — Chaplain', subj: 'Roy Delacroix', c: 'delacroix', body: '<p>Detective, Roy asked me to send this to you if he did not get better. He said you would know which box it goes in.</p><p>"Tell Celeste I\'m not mad at anybody. Tell her I see them every night, and they\'re warm."</p>' }),
  scene: () => cstat('delacroix').st === 'exonerated' ? 'A booth at the Calder Street Coney Island. He orders pie and doesn\'t eat it. He keeps touching the window glass.' : 'Northfield State Prison, a visiting room with a painted mural of a lake. His hands are scarred white across both palms.',
  topics: [
    { id: 'night', q: 'Tell me about that night.', a: 'I was on the couch. I woke up choking and the hall was orange. I went for their door, and look, that\'s the doorknob. [[de_roy_burns|I couldn\'t turn it.]] I ran out the front to get to their window. [[de_window_blew|When I got there it blew out at me like a bomb.]] I\'ve told this so many times it sounds like somebody else\'s story. It isn\'t.' },

    { id: 'kids', q: 'Tell me about your kids.', a: 'Ava wanted to be a vet. She made our cat a bed out of a shoebox. Jonah could do every word of Green Eggs and Ham, he\'d say it at you whether you wanted it or not. Lily was two. Lily was just two.' },

person('celeste', { name: 'Celeste Moreau (Delacroix)', born: 1951, cases: ['delacroix'], known0: true, loc0: true, role: 'The children\'s mother',

    { id: 'heater', q: 'Tell me about the heater.', a: '[[de_heater|The furnace went out in January. Voss, the landlord, kept saying parts were on order.]] We put the little electric heater in the kids\' room. I told the detectives in 1976. Albrecht said the heater was off. Roy never turned that heater off. It was four degrees.' },

const ROY_LETTERS = [
  [T(1989, 4), 'December 1989', `To whoever has the box,<p>I saw in the paper that a man in Illinois named Gary Dotson walked out of prison because of a blood test, a DNA. I read it four times. I know there isn't any blood in a fire. I read it four times anyway.</p><p>I've started a vegetable garden in the yard program. Tomatoes. Ava would laugh at me.</p>`],
  [T(1991, 4), 'December 1991', `To the box,<p>My mother died in August. They let me go to the funeral in leg irons with two guards, and I stood at the back. My cousin said Ma never once thought I did it. I wanted to say thank you, but the guards were standing there.</p><p>Merry Christmas to the lady in Records and to whoever is reading.</p>`],
  [T(1993, 4), 'December 1993', `To the box,<p>There's a magazine in the prison library called Fire Engineering. The librarian lets me read the old ones. One has an article about a house they burned on purpose in Florida called Lime Street. They got the floor to look like somebody poured gasoline, and nobody poured anything. I tore the page out. I'm sorry, Mrs. Abernathy. I am enclosing it.</p>`],
  [T(1995, 4), 'December 1995', `To the box,<p>Celeste remarried. A good man, a mailman in Flint. She still comes on Ava's birthday. We sit there and don't say much. You'd think after twenty years you'd run out of things not to say.</p>`],
  [T(1996, 4), 'December 1996', `To the box,<p>The new lady wrote back this year instead of the old one. She said the old one retired, a Miss Kowalski. Please tell her thank you for nineteen Christmas letters. Please tell her I hope she finds what she was looking for. She told me once she was looking for someone too.</p>`],
  [T(1998, 4), 'December 1998', `To the box,<p>I turned fifty. The doctor says it's my liver. Hepatitis C, from before I got clean, back in the county jail in '76. They have a treatment, but it isn't on the formulary.</p><p>I'm not writing for pity. I'm writing so it's written down somewhere besides in me.</p>`],
  [T(2000, 4), 'December 2000', `To the box,<p>Short one this year. My hand shakes now.</p><p>I still think it was the heater.</p>`],
  [T(2001, 4), 'December 2001', `To whoever,<p>If you're reading this, I'm probably not going to write another one. The chaplain is helping me with the words.</p><p>I don't hate the fire marshal. I think he believed it. I think believing it is worse than lying, because you can't take it back. Please tell Celeste the heater wasn't her fault either. She thinks it was, because she bought it.</p><p>Ava, Jonah, Lily. Write their names down somewhere. Roy</p>`],
];
ROY_LETTERS.forEach(([t, d, body], i) => event({ id: 'royl' + i, at: t, c: () => cstat('delacroix').st !== 'exonerated' && alive('roy'), run: (s, heads) => {

  mail({ from: 'Roy Delacroix #149-302', subj: 'Christmas letter, ' + d, c: 'delacroix', doc: id, body: '<p>A letter from Northfield State Prison, filed to box 76-1102.</p>' });
} }));

ROY_LETTERS.forEach(([t, d, body], i) => { DOCS['de_letter_' + i] = { id: 'de_letter_' + i, c: 'delacroix', type: 'hand', title: 'Letter from Roy Delacroix — ' + d, date: d, body: `<span class="date">Northfield State Prison — ${d}</span><p>${body}</p>` }; });

hints('delacroix', [
  { c: () => !has('de_gc_neg'), t: sp => sp === 'dot' ? "This one isn't unsolved. It's closed. Roy Delacroix writes every Christmas and I file the letters. Read the fire marshal's report, then the lab report from the same month. Read them one after the other." : "Read Albrecht's report and the 1976 lab report back to back." },
  { c: () => !has('de_gaines_deal'), t: "The other leg of that conviction is a jailhouse informant. Men like Gaines don't testify for free. Corrections keeps files on everyone." },
  { c: () => has('de_gaines_deal') && !has('de_gaines_recant'), t: 'Gaines was paroled in 1991. People in recovery sometimes want to make amends. Go see him and show him his own file.' },
  { c: () => S.t < T(1990, 3) && !has('de_flashover'), t: "Albrecht's opinion is what the fire academy taught for fifty years. Nobody can contradict it with science yet. Keep reading the news, and the Lab Manual." },
  { c: () => S.t >= T(1990, 3) && !has('de_lime') && S.t < T(1992, 1), t: 'There\'s something in the trade papers about a test fire in Jacksonville, Florida, called Lime Street. Somebody should call them.' },
  { c: () => S.t >= T(1992, 1) && !has('de_flashover'), t: "There's a national standard for fire investigation now, NFPA 921. An independent engineer could re-read Albrecht's photographs under it. It's on the Evidence tab." },

]);

addCase({
  id: 'vandermeer', no: '83-0917', year: 1983, title: 'Henry Vandermeer', label: 'VANDERMEER, H.\nSuspicious death — 1983', kind: 'Suspicious Death',
  closure: 'charge', truth: 'peter', requires: [['va_tox_arsenic']],
  reqMsg: `The death certificate says heart disease, signed by his own doctor. Until you can show me Henry Vandermeer was <b>poisoned</b>, there's no homicide to charge anyone with.`,
  blurb: 'Saturday, September 17, 1983. Henry Vandermeer, 64, founder of Vandermeer Furniture, died in his bed on Lakecrest Drive. His physician signed for heart disease, and there was no autopsy. Three years later his daughter brought the police two anonymous letters. A detective took a report, filed it in this box, and that was all.',
  outcome: (s, p, living) => `<p>Peter Vandermeer was arrested at his condominium in ${proseDate(s.t)}. At trial the State played the segmental hair analysis for the jury like a calendar: no arsenic in February 1983, rising in March after Peter moved home, a spike in the last six weeks. ${alive('rosa') ? 'Rosa Delgado testified through an interpreter, hands folded, and never once looked at the defense table.' : 'Rosa Delgado\'s deposition was read into the record. She had died the previous winter.'}</p><p>He was convicted of first-degree murder and sentenced to life. ${alive('corinne') ? 'His mother sat behind him every day of the trial. She did not come to the sentencing.' : ''}</p>`,

  { c: () => S.ev.va_hair && !has('va_tox_arsenic'), t: 'Send the hair to Toxicology. Ask them to cut it in segments. Hair grows about a centimeter a month, so it\'s a calendar.' },
  { c: () => alive('rosa') && knows('rosa') && !has('va_rosa_tea'), t: 'Rosa Delgado has been waiting fourteen years for someone to knock. Go to San Antonio.' },
  { c: () => !has('va_rosa_tea') && dead('rosa'), t: 'Rosa died before anyone asked her. The paper has to carry it now: who moved in when, who stood to lose, and what was in the inventory.' },
  { c: () => !closed('vandermeer'), t: 'The poison establishes a murder. Now show the DA who was standing next to the teapot.' },
  { c: () => true, t: 'The tea. Somebody always knows about the tea.' },
]);
/* =====================================================================
   CASE 86-0521 — MARCUS BELL — "Skate Palace"
   Truth: Lamont "Monty" Price shot 16-year-old Marcus in the dark because
   Marcus was wearing his cousin DeShawn's red jacket, and DeShawn owed
   Price money. Nobody would talk in 1986. Time, and a traffic stop in
   2001, change that.
   ===================================================================== */
addCase({
  id: 'bell', no: '86-0521', year: 1986, title: 'Marcus Bell', label: 'BELL, M.\nSkate Palace — 1986', kind: 'Homicide',
  closure: 'charge', truth: 'price',
  blurb: 'Wednesday, May 21, 1986, 10:40 p.m. Marcus Bell, 16, an honor student at Eastgate High, was shot twice in the parking lot of the Skate Palace roller rink on teen night, with about two hundred kids nearby. Nobody saw anything. Everybody said a name. It was the wrong name.',
  outcome: (s, p, living) => `<p>Lamont Price was brought from State Prison to the Port Avery courthouse in ${proseDate(s.t)} and arraigned for the murder of Marcus Bell. ${alive('keisha') ? 'Keisha Ward testified for two hours. When the defense asked why she had waited sixteen years, she said, "Because I was fourteen and I wanted to turn fifteen."' : ''}</p><p>The jury convicted him of second-degree murder. He got 30 to 60 years, consecutive to the sentence he was already serving. ${alive('loretta') ? 'Loretta Bell read a victim impact statement. It was one sentence long: "His name was Marcus and he was wearing his cousin\'s coat because he was cold."' : ''}</p>`,
  wrongOutcome: (s, p) => `<p>${pname(p)} was charged with the murder of Marcus Bell.</p>`,
  epilogue: s => closed('bell') && !cstat('bell').wrong
    ? `Eastgate High renamed its scholarship for college-bound seniors the Marcus Bell Award. Keisha Ward presents it every June. Andre Mims, named in rumor for sixteen years, came to the first ceremony and stood at the back.`
    : `Loretta Bell still calls the Detective Bureau every May 21st. Whoever answers the phone takes a message.`,
});

doc({ id: 'be_offense', c: 'bell', init: true, type: 'report', form: 'OFFENSE REPORT', title: 'Offense Report', date: '05/22/1986',
  fields: [['CASE NO.', '86-0521'], ['OFFENSE', 'Homicide (shooting)'], ['VICTIM', 'BELL, Marcus D. — B/M — 16'], ['LOCATION', 'Skate Palace, 2900 Eastgate Ave. — N parking lot'], ['OFFICER', 'Det. R. Kowalczyk #451']],
  body: `<p>At 2240 hrs on 05/21/86 (Wednesday teen night), shots were fired in the north lot of the Skate Palace roller rink. Officers found Marcus BELL, 16, of 418 Kelso St., on the pavement beside a parked car with two gunshot wounds. He was transported to Mercy Hospital and pronounced dead at 2318.</p>
<p>An estimated 200 juveniles were on the premises or in the lot. [[be_canvass|Canvass of 61 juveniles produced no witness willing to give a statement. Refused or stated "didn't see": Keisha WARD (14), Tyrell WARD (16), DeShawn BELL (18, victim's cousin), and others.]]</p>
<p>[[be_casings_note|Two 9mm Luger casings recovered from the lot (B-1, B-2).]] The victim was a sophomore at Eastgate High with no criminal record. Mother states he "didn't run with anybody."</p>
<p>Several anonymous callers name "Dre from Kelso," identified as Andre MIMS, 19. See tip sheet.</p><p class="sig">R. Kowalczyk</p>` });
doc({ id: 'be_autopsy', c: 'bell', init: true, type: 'report', org: 'OFFICE OF THE COUNTY MEDICAL EXAMINER', form: 'POSTMORTEM REPORT — SUMMARY', title: 'Autopsy summary', date: '05/22/1986',
  body: `<p><b>Cause of death:</b> Gunshot wounds of the back (2), one perforating the aorta.</p><p><b>Range:</b> Indeterminate, no soot or stippling. Shot from behind at a distance.</p><p><b>Projectiles:</b> One 9mm full-metal-jacket bullet recovered (B-3). The second exited.</p><p><b>Clothing:</b> Blue jeans, gray sweatshirt, and [[be_jacket_doc|a red satin "Starter"-style jacket, men's XL, too large for the decedent (5'7", 128 lbs). Name label sewn inside the collar: "D. BELL."]]</p>` });
doc({ id: 'be_ballistics', c: 'bell', init: true, type: 'lab', org: 'STATE CRIME LABORATORY — FIREARMS', form: 'FIREARMS EXAMINATION', title: 'Firearms report (1986)', date: '06/30/1986',
  body: `<p>B-1, B-2: 9mm Luger casings, Winchester headstamp. Firing pin and breech face marks show both were fired in the <b>same firearm</b>.</p><p>B-3: 9mm FMJ bullet, 6 lands and grooves, right twist, consistent with several pistol makes including Smith &amp; Wesson.</p><p>No firearm submitted for comparison. Evidence retained.</p>` });
doc({ id: 'be_tips', c: 'bell', init: true, type: 'ledger', form: 'TIP SHEET — 86-0521', title: 'Tip sheet', date: 'May–Aug 1986',
  body: `<table><tr><th>DATE</th><th>SOURCE</th><th>TIP</th></tr><tr><td>5/22</td><td>Anon. (female)</td><td>"Dre from Kelso did it."</td></tr><tr><td>5/22</td><td>Anon. (male)</td><td>"Andre Mims. Everybody knows."</td></tr><tr><td>5/24</td><td>Anon.</td><td>"Kelso Street. Dre."</td></tr><tr><td>5/30</td><td>Anon. (male, older)</td><td>[[be_tip_monty|"Wasn't Dre. Ask Monty P. who he was really looking for."]] (hung up)</td></tr><tr><td>6/11</td><td>Anon.</td><td>"Dre bragged about it at the Shell station."</td></tr></table>` });
doc({ id: 'be_mims', c: 'bell', init: true, type: 'report', form: 'INTERVIEW SUMMARY', title: 'Interview of Andre Mims', date: '05/27/1986',
  body: `<p>MIMS, Andre "Dre," 19, Kelso St. Two prior arrests (possession). Denies involvement. [[be_mims_claim|Claims he was "at Mercy getting my wrist set" at the time of the shooting.]] The claim was not verified before the subject was released. His left wrist was in a cast at the interview.</p><span class="pencil">Cast could be from punching somebody after. Check ER. — RK</span>` });
doc({ id: 'be_photo', c: 'bell', init: true, type: 'photo', title: 'Exhibit B-4: victim\'s jacket', date: '05/22/1986', svg: () => PHOTO.jacket(), cap: 'B-4 — jacket, collar label "D. BELL"', body: 'Two entry defects in the back panel. The label is sewn in by hand in black thread.' });
doc({ id: 'be_photo2', c: 'bell', init: true, type: 'photo', title: 'Exhibits B-1/B-2: casings', date: '05/22/1986', svg: () => PHOTO.casings(), cap: 'B-1, B-2 — 9mm Luger', body: 'Firing pin impressions are visible at the primer under magnification.' });
doc({ id: 'be_flyer', c: 'bell', init: true, type: 'news', title: 'Reward flyer', date: '1986',
  body: `<div class="mast" style="font-size:40px">$2,500 REWARD</div><div class="ndate">FOR INFORMATION LEADING TO AN ARREST</div><h1>WHO KILLED MARCUS BELL?</h1><h2>May 21, 1986 · Skate Palace, Eastgate Ave.</h2><div class="cols"><p>Marcus was 16. He played trumpet in the Eastgate band and wanted to go to Michigan State to be an engineer. He was not in a gang. He was at the rink with his friends.</p><p>Somebody saw. Please call the Detective Bureau. You do not have to give your name. — Loretta Bell (mother)</p></div>` });
doc({ id: 'be_er', c: 'bell', type: 'report', org: 'MERCY HOSPITAL — EMERGENCY DEPARTMENT', form: 'ED TREATMENT RECORD (EXTRACT)', title: 'Mercy ER record — Andre Mims',
  body: `<p><b>Patient:</b> MIMS, Andre. <b>Arrived:</b> [[be_mims_er|05/21/86 2152 hrs]]. Distal radius fracture (L), "fell off bike." Reduced and cast. <b>Discharged:</b> [[be_mims_er|05/22/86 0035 hrs]].</p><p>Note: patient was in Bay 6 throughout and was given medication at 2230.</p>` });

doc({ id: 'be_price_rap', c: 'bell', type: 'report', org: 'STATE BUREAU OF IDENTIFICATION', form: 'CRIMINAL HISTORY TRANSCRIPT', title: 'Criminal history — Lamont Price',
  body: `<p>PRICE, Lamont "Monty," B/M, DOB 7/1966.</p><table><tr><th>YEAR</th><th>CHARGE</th><th>DISPOSITION</th></tr><tr><td>1985</td><td>Assault (debt collection, per complaint)</td><td>Dismissed, complainant declined</td></tr><tr><td>1989</td><td>Possession w/ intent</td><td>2 yrs</td></tr><tr><td>[[be_price_prison|1998]]</td><td>[[be_price_prison|Delivery of cocaine >650g]]</td><td>[[be_price_prison|20 years, State Prison]]</td></tr></table><p>Known associates (1986, Gang Squad card): "Collects for himself. Lends money on Kelso. Drives a gold Monte Carlo."</p>` });

});

person('mims', { name: 'Andre "Dre" Mims', born: 1967, cases: ['bell'], suspect: true, known0: true, loc0: true, role: 'Named by rumor, 1986',

  ] });
person('keisha', { name: 'Keisha Ward', born: 1972, cases: ['bell'], loc0: true, role: 'Witness, 14 in 1986',
  scene: () => S.t >= T(1998, 2) ? 'Her kitchen on the east side. A boy about nine does homework at the table. She sends him upstairs.' : S.t >= T(1993, 1) ? 'The parking lot of the Kroger where she works. She keeps her keys between her fingers.' : 'The front steps of her mother\'s house. Her mother stands in the doorway.',
  topics: [
    { id: 'early', q: 'Did you see what happened to Marcus?', c: () => S.t < T(1993, 1), a: 'I didn\'t see nothing. I was inside skating.\n\n(Her mother closes the door.)' },

    { id: 'late', q: 'Keisha, it\'s been a long time. Monty Price is in prison for twenty years.', c: () => S.t >= T(1998, 2), a: '(She looks at the stairs where her son went up.)\n\nI tell my son about Marcus. He asked me last week what happened to him. I didn\'t have an answer I could say out loud.\n\n[[be_keisha|It was Monty Price. I was standing by the doors. Monty came across the lot fast with his hand in his jacket. Marcus had DeShawn\'s red Starter on because it was cold, and Monty thought he was DeShawn. He shot him in the back twice. Then Monty walked right past me and said, "You didn\'t see nothing, little girl." I was fourteen.]]\n\nI\'ll testify. Write that down before I change my mind.' },

person('loretta', { name: 'Loretta Bell', born: 1950, cases: ['bell'], known0: true, loc0: true, role: "Marcus's mother",

/* =====================================================================
   CASE 52-0071 — UNIDENTIFIED MALE, PIER 9 — "The Finn"
   Truth: Matti Rautio, merchant seaman from Hancock, Michigan, came to
   Port Avery for dock work in October 1952 to send money home to his wife
   Aili. He pawned his wedding ring the day before he went into the harbor.
   The job is to give him back his name.
   ===================================================================== */
addCase({
  id: 'rautio', no: '52-0071', year: 1952, title: 'John Doe, Pier 9', label: 'UNIDENTIFIED MALE\nPier 9 — 1952', kind: 'Unidentified Decedent',
  closure: 'identify', truth: 'rautio_m',
  blurb: 'Thursday, October 9, 1952. Harbor police pulled a man from the water beside Pier 9. He was about thirty-five, with an anchor tattooed on his forearm, a pawn ticket, and a Finnish New Testament in his pocket. Nobody came for him. He is buried in grave 41-B in the county cemetery under a concrete marker that says UNKNOWN.',
  outcome: (s, p) => `<p>On ${proseDate(s.t)} the Medical Examiner amended the record for case 52-0071. The unidentified man recovered from Port Avery harbor on October 9, 1952, was <b>Matti Juhani Rautio</b>, born 1918 in Hancock, Michigan, merchant seaman, husband of Aili and father of Matti Jr.</p><p>${alive('aili') ? 'Aili Lahti, 77, was told in person, at her kitchen table in Duluth. She was quiet for a long time. Then she said, in Finnish and then in English, "He was coming home. I knew it. Fifty years I knew it."' : 'Aili did not live to hear it. Her son Matti Jr. was told by telephone and asked the detective to repeat the name twice.'}</p>`,
  epilogue: s => cstat('rautio').st === 'identified'

/* ---------- sound: everything synthesized, nothing downloaded ---------- */
const SND = (() => {
  let ctx = null, master = null, nbuf = null; const loops = {};
  const init = () => {
    if (ctx) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = PREFS.sound ? .55 : 0; master.connect(ctx.destination); }
    catch (e) { ctx = null; }
  };
  const noise = () => { if (nbuf) return nbuf; nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return nbuf; };
  const burst = (dur, freq, q, gain, type = 'bandpass') => {
    if (!ctx) return; const t = ctx.currentTime, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise(); f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + .05);
  };
  const tone = (f0, f1, dur, gain, type = 'sine') => {
    if (!ctx) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
  };
  const loop = (name, freq, type, gain, q = .7) => {
    if (!ctx || loops[name]) return; const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise(); s.loop = true; f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0; g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 1.2);
    s.connect(f); f.connect(g); g.connect(master); s.start(); loops[name] = { s, g };
  };
  const stop = name => { const L = loops[name]; if (!L || !ctx) return; L.g.gain.linearRampToValueAtTime(0, ctx.currentTime + .6); setTimeout(() => { try { L.s.stop(); } catch (e) { } }, 700); delete loops[name]; };
  const hum = () => {
    if (!ctx || loops.hum) return; const g = ctx.createGain(); g.gain.value = .012; g.connect(master);
    [60, 120, 180].forEach((f, i) => { const o = ctx.createOscillator(); o.frequency.value = f; const og = ctx.createGain(); og.gain.value = [1, .5, .2][i]; o.connect(og); og.connect(g); o.start(); });
    loops.hum = { s: { stop() { } }, g }; loop('room', 380, 'lowpass', .018);
  };
  return {
    init, hum, set(v) { if (master) master.gain.value = v ? .55 : 0; },
    key: () => burst(.035, 2200 + Math.random() * 1800, 2.5, .14), pencil: () => burst(.2, 5200, .6, .05, 'highpass'),
    paper: () => burst(.28, 1500, .4, .07), stamp: () => { tone(120, 40, .3, .45); burst(.09, 700, 1, .25); },
    bell: () => { tone(1320, 1300, 1.2, .06, 'triangle'); tone(1980, 1970, .9, .03); },
    rain: () => loop('rain', 1300, 'lowpass', .07), unrain: () => stop('rain'),
    hiss: () => loop('hiss', 3500, 'highpass', .025), unhiss: () => stop('hiss'),
  };
})();

/* ---------- status helpers ---------- */
function stLabel(c) {
  const s = cstat(c);
  if (s.st === 'open') return s.reopened ? ['REOPENED', 'open'] : ['OPEN', 'open'];
  return { closed: ['CLOSED', 'closed'], cleared: ['CLEARED', 'closed'], identified: ['IDENTIFIED', 'exon'], convicted: ['CONVICTED 1977', 'locked'], exonerated: ['EXONERATED', 'exon'] }[s.st] || ['OPEN', 'open'];
}
const docInCase = (d, c) => d && (d.c === c || (d.cases || []).includes(c));
const evInCase = (id, c) => { const E = EVID[id]; return E.c === c || (E.cases || []).includes(c); };
const unreadIn = c => [...S.docs].filter(id => docInCase(getDoc(id), c) && !S.read.has(id)).length;
const speaker = () => S.t < T(1996, 4) ? 'dot' : 'ortiz';
const DA_NAME = () => S.t < T(1997, 1) ? 'Gerald Kittredge, Prosecuting Attorney' : 'Miriam Okonjo, Prosecuting Attorney';
