    ${st.reopened ? `<p class="meta" style="color:var(--red2)">A conviction you built in this case was vacated. ${esc(pname(st.wrongPerp))} was innocent.</p>` : ''}
    <div class="actions"><button class="abtn prime" id="bFile" ${done || S.ap < 1 ? 'disabled' : ''}>${act} · 1 hr</button></div></div>
    <div class="tabs">${tabs.map(([k, n, cnt]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-t="${k}">${n}${cnt ? `<span class="n">${cnt}</span>` : ''}</button>`).join('')}</div>
    <div class="tabbody">${tabHTML(c, S.tab)}</div>`;
  P.querySelectorAll('.tab').forEach(b => b.onclick = () => { S.tab = b.dataset.t; renderPane(); });
  $('#bFile').onclick = () => openFile(c);
  wireTab(c, S.tab);
}
function deskHTML() {
  const open = CASE_ORDER.filter(c => !closed(c)).length;
  return `<div class="desk"><h2>Sub-basement B, Room 14</h2>
  <p>A metal desk, a hot plate, a fluorescent tube that hums in B-flat, and nine cardboard boxes. ${open === 9 ? 'None of them has been opened in years.' : `${9 - open} of them have a final disposition.`}</p>
  <div class="sect">How the archive works</div>
  <p>&#9656; <b>Pick a box</b> from the shelf. Read everything. When a phrase looks wrong or important, <b>click it</b> to add it to your notes. Notes are what you'll argue with later.</p>
  <p>&#9656; <b>Evidence</b> goes to the State Crime Lab. Tests cost budget and come back next quarter. <b>Some tests use up the sample.</b> Science gets better every year, so sometimes the right move is to wait.</p>
  <p>&#9656; <b>People</b> can be interviewed and <b>Leads</b> pursued. Each costs one of your hours this quarter. People die. People move. Some of them get braver with time.</p>
  <p>&#9656; The <b>Board</b> lets you lay files side by side. If two cases share a signature, link them.</p>
  <p>&#9656; When you have a case, <b>file it with the DA</b>: name a suspect and choose up to five exhibits from your notes. The DA will tell you what's missing. The DA will also charge the wrong man if you hand her a convincing enough wrong case.</p>
  <p>&#9656; <b>End the quarter</b> to move time forward. You have until December 2008.</p>
  <div class="sect">Start here</div>
  <p>Dot suggests the newest box first, <a href="#" data-open="ochoa" style="color:var(--amber2)">81-0447, the night clerk</a>. "Hal Prentice left it half done. You'll learn how the place works."</p></div>`;
}
function tabHTML(c, t) {
  if (t === 'files') {
    const ds = [...S.docs].map(getDoc).filter(d => docInCase(d, c));
    if (!ds.length) return '<p class="empty">No documents.</p>';
    return `<p class="note">Click a document to read it. Click any phrase that matters to add it to your notes.</p><div class="grid">${ds.map(d => `<button class="file t-${d.type}" data-d="${d.id}"><div class="ty">${({ report: 'Report', stmt: 'Statement', hand: 'Handwritten', diary: 'Diary', lab: 'Lab report', news: 'Clipping', photo: 'Photograph', tape: 'Interview notes', ledger: 'Record', cert: 'Record', memo: 'Memo' })[d.type] || 'Document'}</div><div class="tt">${esc(d.title)}</div><div class="dd">${esc(d.date || '')}</div>${S.read.has(d.id) ? '' : '<span class="new">NEW</span>'}</button>`).join('')}</div>`;
  }
  if (t === 'evidence') {
    const es = Object.keys(S.ev).filter(id => evInCase(id, c));
    const crime = es.filter(id => EVID[id].role !== 'ref'), refs = es.filter(id => EVID[id].role === 'ref');
    const card = id => {
      const E = EVID[id], st = S.ev[id], opts = testOptions(id), pend = pendingFor(id);
      return `<div class="card"><h4>${esc(E.name)}</h4><div class="sub">${st.qty != null ? `Sample: <span class="qty">${Array.from({ length: E.qty }, (_, i) => `<i class="${i < st.qty ? 'on' : ''}"></i>`).join('')}</span> ` : ''}${E.role === 'ref' ? '<span class="chip blue">Reference</span>' : ''}${st.qty != null || E.owner ? `<span class="chip ${st.q}">${st.q}</span>` : ''}${st.gone ? '<span class="chip bad">destroyed</span>' : ''}${pend.length ? `<span class="chip fair">at lab ×${pend.length}</span>` : ''}</div>
      <p>${esc(E.desc)}</p>
      ${E.role === 'ref' ? `<p class="sub">Compared automatically against every profile the lab develops in this matter (${(E.sys || []).map(x => SYS_LABEL[x]).join(', ')}).</p>` : ''}
      ${opts.length ? `<div class="tests">${opts.map(o => `<button class="tbt" data-ev="${id}" data-t="${o.tid}" ${o.why ? 'disabled' : ''}><span>${esc(o.name)}${o.use ? ` <small style="color:var(--red2)">· uses ${o.use}</small>` : ''}<br><small>${esc(o.why || o.note)}</small></span><small>${o.cost ? '$' + o.cost.toLocaleString() : 'free'} · ${o.turn} qtr</small></button>`).join('')}</div>` : (E.role === 'ref' || st.gone ? '' : '<p class="sub">No examinations available yet.</p>')}
      ${st.hist.length ? `<div class="hist">${st.hist.map(esc).join('<br>')}</div>` : ''}</div>`;
    };
    return (crime.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${crime.map(card).join('')}</div>` : '<p class="empty">No physical evidence.</p>') + (refs.length ? `<div class="sect">Reference samples</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${refs.map(card).join('')}</div>` : '');
  }
  if (t === 'people') {
    const ps = Object.keys(PEOPLE).filter(p => knows(p) && (PEOPLE[p].cases || []).includes(c));
    if (!ps.length) return '<p class="empty">Nobody yet.</p>';
    return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">${ps.map(p => {
      const P = PEOPLE[p], ci = canInterview(p), d = dead(p), ini = P.name.replace(/["“”]/g, '').split(' ').filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('');
      const life = P.victim ? 'Born ' + P.born : d ? `${P.born}–${YQ(P.died).y}` : `Age ${ageOf(p)}`;
      return `<div class="card person"><div class="mug ${d ? 'dead' : ''}">${ini}</div><div style="flex:1;min-width:0"><h4>${esc(P.name)}</h4><div class="sub">${esc(P.role)} · ${life}</div>
      ${P.victim ? '' : `<div style="margin-top:10px"><button class="abtn" data-iv="${p}" ${ci.ok ? '' : 'disabled'}>${ci.ok ? (ci.cost ? 'Interview · 1 hr' : 'Talk · free') : esc(ci.why)}</button></div>`}</div></div>`;
    }).join('')}</div>`;
  }
  if (t === 'leads') {
    const ls = LEADS.filter(L => L.c === c || (L.cases || []).includes(c)).map(L => [L, leadVisible(L)]).filter(([, v]) => v);
    if (!ls.length) return '<p class="empty">No leads yet. Read the file and talk to people. Leads appear as you learn things.</p>';
    const act = ls.filter(([, v]) => v === true || v === 'pending'), dn = ls.filter(([, v]) => v === 'done');
    return (act.length ? act.map(([L, v]) => `<div class="lead"><div><h4>${esc(L.name)}</h4><p>${esc(L.desc)}</p></div><div class="go">${v === 'pending' ? '<span class="chip fair">awaiting reply</span>' : `<button class="abtn" data-lead="${L.id}" ${S.ap < L.ap || (L.cost && S.money < L.cost) ? 'disabled' : ''}>${L.ap ? L.ap + ' hr' : 'Free'}${L.cost ? ' · $' + L.cost.toLocaleString() : ''}</button>`}</div></div>`).join('') : '<p class="empty">Nothing to pursue right now.</p>')
      + (dn.length ? `<div class="sect">Done</div>` + dn.map(([L]) => `<div class="lead done"><div><h4>${esc(L.name)}</h4></div></div>`).join('') : '');
  }
  if (t === 'notes') {
    const fs = poolFindings(c);
    if (!fs.length) return '<p class="empty">No notes yet. Click important phrases in the documents. Lab results and interviews add notes on their own.</p>';
    const order = ['physical', 'forensic', 'testimony', 'record', 'confession'];
    return `<p class="note">${linkedCount(c) > 1 ? 'Notes from every case in this linked series. ' : ''}These are your exhibits. Color marks the kind: <span style="color:#d5584e">physical</span>, <span style="color:#86a7c4">forensic</span>, <span style="color:#d9a04b">testimony</span>, <span style="color:#7fae86">record</span>.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${fs.sort((a, b) => order.indexOf(getF(a).kind) - order.indexOf(getF(b).kind)).map(f => { const F = getF(f); return `<div class="fnd k-${F.kind}"><span class="kd">${F.kind}${F.c !== c ? ' · ' + CASES[F.c].no : ''}</span>${esc(F.text)}</div>`; }).join('')}</div>`;
  }
  return '';
}
function wireTab(c, t) {
  const P = $('#pane');
  P.querySelectorAll('[data-d]').forEach(b => b.onclick = () => openDoc(b.dataset.d));
  P.querySelectorAll('[data-t].tbt').forEach(b => b.onclick = () => openTest(b.dataset.ev, b.dataset.t));
  P.querySelectorAll('[data-iv]').forEach(b => b.onclick = () => openInterview(b.dataset.iv));
  P.querySelectorAll('[data-lead]').forEach(b => b.onclick = () => runLead(b.dataset.lead));
}

/* ---------- documents ---------- */
function ivBody(p) {
  const log = S.ivlog[p] || [];
  return log.map(x => `<p class="q">${dateOf(x.t)} — Q: ${esc(x.q)}</p><p class="a">${nl(x.a)}</p>`).join('') || '<p>(no notes)</p>';
}
function paperHTML(d) {
  let body = d.iv ? ivBody(d.iv) : (typeof d.body === 'function' ? d.body(S) : (d.body || ''));
  body = clue(body);
  const fields = d.fields ? `<div class="fields">${d.fields.map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div>` : '';
  const head = (org) => `<div class="lh"><div class="org">${esc(org)}</div><div class="ttl">${esc(d.form || d.title)}</div></div>`;
  switch (d.type) {
    case 'hand': return `<div class="paper hand">${body}</div>`;
    case 'diary': return `<div class="paper hand diary">${body}</div>`;
    case 'news': return `<div class="paper news">${body}</div>`;
    case 'photo': return `<div class="paper photo"><div class="frame">${typeof d.svg === 'function' ? d.svg() : d.svg}<div class="cap">${esc(d.cap || '')}</div></div><div class="exif">${body}</div></div>`;
    case 'tape': return `<div class="paper tape"><div class="cass"><div class="reel"></div><div style="flex:1"><b>${esc(d.title)}</b><br><small>Field notes, transcribed</small></div><div class="reel"></div></div>${body}</div>`;
    case 'lab': return `<div class="paper lab">${head(d.org || 'STATE CRIME LABORATORY')}${fields}${body}</div>`;
    case 'ledger': return `<div class="paper ledger">${head(d.org || 'PORT AVERY POLICE DEPARTMENT')}${fields}${body}</div>`;
    default: return `<div class="paper ${d.type}">${d.stamp ? `<div class="stampmark">${esc(d.stamp)}</div>` : ''}${head(d.org || 'PORT AVERY POLICE DEPARTMENT')}${fields}${body}</div>`;
  }
}
function openDoc(id) {
  const d = getDoc(id); if (!d) return;
  S.read.add(id); saveGame(); SND.paper(); if (d.type === 'tape') SND.hiss();
  openModal(`<div class="${PREFS.hl ? 'hlclues' : ''}">${paperHTML(d)}</div>`, () => { renderShelf(); renderPane(); });
}

/* ---------- labs ---------- */
function openTest(evId, tid) {
  const E = EVID[evId], st = S.ev[evId], TT = TESTS[tid], o = testOptions(evId).find(x => x.tid === tid); if (!o || o.why) return;
  if (o.picks) {
    openModal(`<div class="panel"><h3>${esc(TT.name)}</h3><div class="sub">${esc(E.name)}: choose what to compare it against. $${o.cost} each.</div><div class="mlist">${o.picks.map(p => `<button class="mitem" data-pk="${p}"><span class="s">${esc(PEOPLE[p] ? PEOPLE[p].name + ' — ten-print card' : EVID[p].name)}</span></button>`).join('')}</div></div>`);
    $('#mbody').querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { if (submitTest(evId, tid, b.dataset.pk)) UI.toast('SENT TO THE LAB', TT.name + ' — results next quarter'); saveGame(); closeModal(); render(); });
    return;
  }
  const warn = [];
  if (TT.use && st.qty != null) { const left = st.qty - Math.min(TT.use, st.qty); warn.push(left <= 0 ? `<b style="color:var(--red2)">This uses up the last of the sample.</b> Nothing will be left for any future test.` : `This uses ${Math.min(TT.use, st.qty)} of ${st.qty} remaining units of sample.`); }
  if (tid === 'rflp' && (st.qty < 2 || st.q !== 'good')) warn.push(`<i>Dr. Okafor:</i> "In my opinion this sample is ${st.qty < 2 ? 'too small' : 'too degraded'} for RFLP. It will very probably fail, and the attempt will use it up."`);
  if (tid === 'serology' && st.qty <= 1) warn.push(`<i>${S.t < T(1993, 3) ? 'Bernard Lusk' : 'Lab'}:</i> "I can type it, but that's the whole stain. DNA people would kill me."`);
  if (tid === 'dqa1' && st.qty <= 1 && S.t < T(1996, 1)) warn.push(`<i>Dr. Okafor:</i> "DQ-alpha will give you a type that roughly 1 in 30 people share, and there won't be anything left over. STR kits are a few years out. I'm not telling you what to do."`);
  if (tid === 'hairmicro') warn.push(`<i>Lab:</i> "Hair comparison is an opinion, not an identification."`);
  openModal(`<div class="panel"><h3>${esc(TT.name)}</h3><div class="sub">${esc(E.name)}<br>${esc(TT.note)}</div>
    <p>Cost: <b>$${o.cost.toLocaleString()}</b> · Results in <b>${o.turn} quarter${o.turn > 1 ? 's' : ''}</b></p>${warn.map(w => `<p>${w}</p>`).join('')}
    <div class="row"><button class="abtn" id="tCancel">Not yet</button><button class="abtn prime" id="tGo">Submit to the lab</button></div></div>`);
  $('#tCancel').onclick = closeModal;
  $('#tGo').onclick = () => { if (submitTest(evId, tid)) UI.toast('SENT TO THE LAB', TT.name + ' — results in ' + o.turn + ' qtr'); saveGame(); closeModal(); render(); };
}

/* ---------- leads ---------- */
function runLead(id) {
  const L = LEADS.find(l => l.id === id); const r = doLead(L);
  saveGame(); render();
  if (r.err) return UI.toast('CAN\'T', r.err);
  if (r.deny) { SND.stamp(); return openModal(`<div class="paper memo verdict"><div class="bigstamp no">DENIED</div><div class="lh"><div class="org">OFFICE OF THE PROSECUTING ATTORNEY</div><div class="ttl">RE: ${esc(L.name)}</div></div><p>${r.deny}</p><p class="sig">${DA_NAME().split(',')[0]}</p><span class="sigline">${DA_NAME()}</span></div>`); }
  if (r.pending) { SND.stamp(); return UI.toast('REQUEST SENT', L.name + ' — reply by mail next quarter'); }
  const doc0 = r.fx && r.fx.doc && r.fx.doc[0];
  SND.paper();
  openModal(`<div class="panel"><h3>${esc(L.name)}</h3><p>${r.ok || ''}</p><div class="row">${doc0 ? `<button class="abtn prime" id="lDoc">Read it</button>` : ''}<button class="abtn" id="lOk">Back to the box</button></div></div>`);
  $('#lOk').onclick = closeModal; if (doc0) $('#lDoc').onclick = () => { closeModal(); openDoc(doc0); };
}

/* ---------- interviews ---------- */
function openInterview(p) {
  const ci = canInterview(p); if (!ci.ok) return;
  S.ap -= ci.cost; saveGame(); render();
  const P = PEOPLE[p], sc = typeof P.scene === 'function' ? P.scene(S) : (P.scene || '');
  openModal(`<div class="ivw"><div class="hd"><div class="mug">${P.name.replace(/["“”]/g, '').split(' ').filter(w => /^[A-Z]/.test(w)).map(w => w[0]).slice(0, 2).join('')}</div><div><h3>${esc(P.name)}</h3><div class="sub">${esc(P.role)} · ${dateOf(S.t)}</div></div></div><div class="log" id="ivlog"><div class="scene">${esc(sc)}</div></div><div class="qs" id="ivqs"></div></div>`, () => render());
  drawQs(p);
}
function drawQs(p) {
  const qs = topicsFor(p), box = $('#ivqs'); if (!box) return;
  box.innerHTML = qs.length ? qs.map(t => `<button data-q="${t.id}">&#9656; ${esc(t.q)}</button>`).join('') + '<button data-end="1" style="color:var(--dim)">End the interview</button>' : '<div class="none">Nothing more to ask right now. You can come back when you know more.</div><button data-end="1">End the interview</button>';
  box.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const tp = PEOPLE[p].topics.find(x => x.id === b.dataset.q), a = ask(p, b.dataset.q), log = $('#ivlog');
    const qd = document.createElement('div'); qd.className = 'q'; qd.textContent = 'Q: ' + tp.q; log.appendChild(qd);
    const ad = document.createElement('div'); ad.className = 'a'; ad.innerHTML = clue(nl(a)); log.appendChild(ad); markClues(ad);
    log.scrollTop = log.scrollHeight; SND.key(); saveGame(); drawQs(p); renderTop();
  });
  box.querySelectorAll('[data-end]').forEach(b => b.onclick = closeModal);
}

/* ---------- the DA ---------- */
function openFile(c) {
  const C = CASES[c], sus = C.closure === 'review' ? [C.target] : suspectsFor(c), pool = poolFindings(c);
  const who = C.closure === 'identify' ? 'Who was he?' : C.closure === 'review' ? 'Conviction under review' : 'Who did it?';
  const to = C.closure === 'identify' ? 'County Medical Examiner' : C.closure === 'review' ? 'Circuit Court — Motion for Relief from Judgment' : DA_NAME();
  if (!sus.length) return openModal(`<div class="panel"><h3>${esc(to)}</h3><p>You don't have anyone to name yet.</p></div>`);
  if (!pool.length) return openModal(`<div class="panel"><h3>${esc(to)}</h3><p>You have no notes to put in front of anyone. Read the file and click what matters.</p></div>`);
  openModal(`<div class="panel daform"><h3>${esc(to)}</h3><div class="sub">${C.closure === 'review' ? 'Choose up to five exhibits showing the 1977 conviction rested on false evidence.' : 'Name one person, then choose <b>up to five</b> exhibits from your notes. Filing costs one hour. A refused filing costs a little standing.'}</div>
    <div class="sect">${who}</div>${sus.map((p, i) => `<label class="opt ${sus.length === 1 ? 'on' : ''}"><input type="radio" name="perp" value="${p}" ${sus.length === 1 ? 'checked' : ''}><span><b>${esc(pname(p))}</b><span class="k">${esc(PEOPLE[p].role)}${dead(p) ? ' · deceased' : ''}</span></span></label>`).join('')}
    <div class="sect">Exhibits <span id="exn">0</span>/5</div>${pool.map(f => { const F = getF(f); return `<label class="opt"><input type="checkbox" name="ex" value="${f}"><span><span class="k">${F.kind}${F.c !== c ? ' · ' + CASES[F.c].no : ''}</span>${esc(F.text)}</span></label>`; }).join('')}
    <div class="row"><button class="abtn" id="daC">Not yet</button><button class="abtn prime" id="daGo" disabled>File · 1 hr</button></div></div>`);
  const upd = () => {
    const ex = [...$('#mbody').querySelectorAll('input[name=ex]:checked')];
    $('#mbody').querySelectorAll('input[name=ex]').forEach(i => { i.disabled = !i.checked && ex.length >= 5; i.closest('.opt').classList.toggle('on', i.checked); });
    $('#mbody').querySelectorAll('input[name=perp]').forEach(i => i.closest('.opt').classList.toggle('on', i.checked));
    $('#exn').textContent = ex.length;
    $('#daGo').disabled = !ex.length || !$('#mbody').querySelector('input[name=perp]:checked');
  };
  $('#mbody').querySelectorAll('input').forEach(i => i.onchange = upd); upd();
  $('#daC').onclick = closeModal;
  $('#daGo').onclick = () => {
    const perp = $('#mbody').querySelector('input[name=perp]:checked').value, ex = [...$('#mbody').querySelectorAll('input[name=ex]:checked')].map(i => i.value);
    const r = fileCase(c, perp, ex); saveGame(); SND.stamp(); verdict(c, perp, r);
  };
}
function verdict(c, perp, r) {
  const C = CASES[c];
  const stamp = r.ok ? (C.closure === 'identify' ? ['IDENTIFIED', 'blue'] : C.closure === 'review' ? ['VACATED', 'blue'] : ['CHARGED', 'ok']) : ['DECLINED', 'no'];
  const from = C.closure === 'identify' ? 'OFFICE OF THE COUNTY MEDICAL EXAMINER' : C.closure === 'review' ? 'CIRCUIT COURT — COUNTY OF PORT AVERY' : 'OFFICE OF THE PROSECUTING ATTORNEY';
  const body = r.ok ? r.txt : `<p>Detective,</p><p>${r.msg}</p><p>Come back when you have it.</p><p class="sig">${C.closure === 'identify' ? 'Dr. M. Szabo' : DA_NAME().split(',')[0]}</p><span class="sigline">${C.closure === 'identify' ? 'Deputy Medical Examiner' : DA_NAME()}</span>`;
  const extra = UI.banners.splice(0).map(h => `<div class="paper memo" style="margin-top:14px"><div class="lh"><div class="org">${esc(h.k)}</div><div class="ttl">${esc(h.h)}</div></div><p>${esc(h.s)}</p></div>`).join('');
  openModal(`<div class="paper memo verdict"><div class="bigstamp ${stamp[1]}">${stamp[0]}</div><div class="lh"><div class="org">${from}</div><div class="ttl">RE: ${C.no} — ${esc(C.title.toUpperCase())}</div></div>${body}</div>${extra}`, () => render());
  if (r.ok) SND.bell();
}

/* ---------- inbox, board, manual, menu ---------- */
function openInbox() {
  const list = () => S.inbox.length ? `<div class="mlist">${S.inbox.map(m => `<button class="mitem ${m.read ? '' : 'unread'}" data-m="${m.id}"><span class="d">${dateOf(m.t)}</span><span class="f">${esc(m.from)}</span><span class="s">${esc(m.subj)}</span></button>`).join('')}</div>` : '<p class="empty">Empty.</p>';
  openModal(`<div class="panel"><h3>Inbox</h3><div class="sub">Lab results, records replies, memos and letters. Newest first.</div><div id="ibl">${list()}</div><div class="row"><button class="abtn" id="ibAll">Mark all read</button></div></div>`, () => render());
  const wire = () => $('#mbody').querySelectorAll('[data-m]').forEach(b => b.onclick = () => readMail(b.dataset.m));
  wire(); $('#ibAll').onclick = () => { S.inbox.forEach(m => m.read = true); saveGame(); $('#ibl').innerHTML = list(); wire(); renderTop(); };
}
function readMail(id) {
  const m = S.inbox.find(x => x.id === id); if (!m) return; m.read = true; saveGame(); SND.paper();
  openModal(`<div class="paper memo"><div class="lh"><div class="org">${esc(m.from)}</div><div class="ttl">${esc(m.subj)}</div></div><div class="fields"><div><span>RECEIVED</span>${dateOf(m.t)}</div>${m.c ? `<div><span>FILE</span>${CASES[m.c].no} ${esc(CASES[m.c].title)}</div>` : ''}</div>${clue(m.body)}<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">${m.doc ? '<button class="abtn" id="mDoc" style="color:var(--ink);border-color:var(--ink2)">Open the document</button>' : ''}${m.c ? '<button class="abtn" id="mCase" style="color:var(--ink);border-color:var(--ink2)">Go to the box</button>' : ''}<button class="abtn" id="mBack" style="color:var(--ink);border-color:var(--ink2)">Back to inbox</button></div></div>`, () => render());
  if (m.doc) $('#mDoc').onclick = () => { closeModal(); openDoc(m.doc); };
  if (m.c) $('#mCase').onclick = () => { S.sel = m.c; closeModal(); render(); };
  $('#mBack').onclick = () => { closeModal(); openInbox(); };
}
const SIGNAME = { knot: 'the ligature knot', shoe: 'the missing left shoe', water: 'proximity to water' };
function sigsOf(c) { return new Set(poolFindings(c).map(f => getF(f).sig).filter(Boolean)); }
function openBoard(msg) {
  const series = []; const seen = new Set();
  CASE_ORDER.forEach(c => { if (seen.has(c)) return; const s = seriesOf(c); s.forEach(x => seen.add(x)); if (s.length > 1) series.push(s); });
  openModal(`<div class="panel"><h3>The Board</h3><div class="sub">Lay two files side by side. If your notes show they share a <b>signature</b>, something the killer didn't need to do but did anyway, you can link them. Linked cases share notes, leads and DA filings.</div>
    ${msg ? `<p class="yarn" style="font-size:20px">${msg}</p>` : ''}
    ${series.length ? `<p>${series.map(s => '<span class="yarn">— ' + s.map(x => CASES[x].no + ' ' + CASES[x].title).join(' ⟷ ') + ' —</span>').join('<br>')}</p>` : ''}
    <div class="board"><div class="cols">${CASE_ORDER.slice().sort((a, b) => CASES[a].year - CASES[b].year).map((c, i) => { const sg = [...sigsOf(c)]; return `<div class="pinc ${linkedCount(c) > 1 ? 'linked' : ''}" style="--r:${((i * 37) % 7 - 3) * .6}deg"><label><input type="checkbox" value="${c}"> ${CASES[c].no}</label><h5>${esc(CASES[c].title)}</h5>${sg.length ? `<ul>${sg.map(s => `<li>${SIGNAME[s]}</li>`).join('')}</ul>` : '<ul><li style="list-style:none;margin-left:-16px;color:#776">no signature noted</li></ul>'}</div>`; }).join('')}</div></div>
    <div class="row"><button class="abtn prime" id="bLink">Link the two selected files</button></div></div>`);
  $('#bLink').onclick = () => {
    const sel = [...$('#mbody').querySelectorAll('.pinc input:checked')].map(i => i.value);
    if (sel.length !== 2) return UI.toast('THE BOARD', 'Select exactly two files.');
    const [a, b] = sel;
    if (seriesOf(a).includes(b)) return openBoard('Those are already linked.');
    const shared = [...sigsOf(a)].filter(s => sigsOf(b).has(s));
    const strong = shared.filter(s => s !== 'water');
    if (strong.length) { S.links.push([a, b]); saveGame(); SND.stamp(); render(); return openBoard(`Linked by ${strong.map(s => SIGNAME[s]).join(' and ')}.`); }
    if ((a === 'rautio' || b === 'rautio') && has('ra_union') && has('rv_vance')) return openBoard('The same ship, the <i>Arthur M. Vance</i>, twenty years apart. That\'s strange. But a ship isn\'t a signature.');
    if (shared.includes('water')) return openBoard('Every body in a port city is found near water, Detective. That\'s geography, not a signature.');
    openBoard('Nothing in your notes ties those two together.');
  };
}
function openManual() {
  const got = CODEX.filter(x => x.from <= S.t), lock = CODEX.length - got.length;
  openModal(`<div class="panel codex"><h3>State Crime Laboratory — Methods Manual</h3><div class="sub">What science can do for you right now, and what it can't. Entries are added as methods reach the lab bench.</div>${got.map(x => `<div class="entry"><h4>${esc(x.title)}</h4><div class="yrs">${esc(x.yrs)}</div>${x.body}</div>`).join('')}${lock ? `<p class="lock">${lock} more ${lock > 1 ? 'entries' : 'entry'} will be added as science catches up.</p>` : ''}</div>`);
}
function openMenu() {
  openModal(`<div class="panel"><h3>Detective ${esc(S.name)}</h3><div class="sub">File opened January 1988 · ${S.solved.length} resolved · Standing ${S.standing}</div>
    <div class="mlist">
      <button class="mitem" id="mnSound"><span class="s">Sound: ${PREFS.sound ? 'ON' : 'OFF'}</span></button>
      <button class="mitem" id="mnHl"><span class="s">Underline clues more clearly: ${PREFS.hl ? 'ON' : 'OFF'}</span></button>
      <button class="mitem" id="mnConf"><span class="s">Confirm before ending a quarter with hours left: ${PREFS.noConfirm ? 'OFF' : 'ON'}</span></button>
      <button class="mitem" id="mnRetire"><span class="s">Retire now and see the final report</span></button>
      <button class="mitem" id="mnQuit"><span class="s">Save and return to the title screen</span></button>
      <button class="mitem" id="mnNew"><span class="s" style="color:var(--red2)">Abandon this file and start over</span></button>
    </div></div>`);
  $('#mnSound').onclick = () => { PREFS.sound = !PREFS.sound; SND.set(PREFS.sound); savePrefs(); openMenu(); };
  $('#mnHl').onclick = () => { PREFS.hl = !PREFS.hl; savePrefs(); openMenu(); };
  $('#mnConf').onclick = () => { PREFS.noConfirm = !PREFS.noConfirm; savePrefs(); openMenu(); };
  $('#mnRetire').onclick = () => confirmBox('Retire from B-14 now? Every open box stays open, and the final report is written today.', () => { S.ended = true; saveGame(); closeModal(); finale(); });
  $('#mnQuit').onclick = () => { saveGame(); closeModal(); showTitle(); };
  $('#mnNew').onclick = () => confirmBox('Abandon this file permanently? Your save will be erased.', () => { clearSave(); S = null; closeModal(); showTitle(); });
}
function confirmBox(text, yes) {
  openModal(`<div class="panel"><p style="font-size:16px">${text}</p><div class="row"><button class="abtn" id="cbN">No</button><button class="abtn prime" id="cbY">Yes</button></div></div>`);
  $('#cbN').onclick = closeModal; $('#cbY').onclick = () => { closeModal(); yes(); };
}
function hint() {
  const sp = speaker(), c = S.sel;
  let t;
  if (!c) t = sp === 'dot' ? "Pick a box, honey. I'd start with Ochoa, the newest one. Hal Prentice left it half done. You'll learn how the place works." : 'Pick a box. Any box. They\'ve all waited long enough.';
  else if (closed(c) && CASES[c].closure !== 'review') { const h = HINTS[c]; t = h[h.length - 1].t; }
  else { const h = (HINTS[c] || []).find(x => x.c()); t = h ? h.t : 'Nothing I can see that you\'ve missed. Sometimes a box just needs time.'; }
  if (typeof t === 'function') t = t(sp);
  openModal(`<div class="paper hand"><span class="date">${sp === 'dot' ? 'A note from Dot' : 'Det. Ortiz'}${c ? ' — ' + CASES[c].no : ''}</span><p>${esc(t)}</p></div>`);
}

/* ---------- time ---------- */
function endQ() {
  if (S.ap > 0 && !PREFS.noConfirm) return confirmBox(`You still have <b>${S.ap} hour${S.ap > 1 ? 's' : ''}</b> left this quarter. Hours don't carry over. End the quarter anyway?`, doEndQ);
  doEndQ();
}
function doEndQ() {
  UI.quiet = true; let heads;
  try { heads = endQuarter().concat(UI.banners.splice(0)); } finally { UI.quiet = false; }
  saveGame();
  if (S.ended) return finale();
  transition(heads, () => { render(); playPendingCine(); });
}
function transition(heads, done) {
  const { y, q } = YQ(S.t), el = $('#qt');
  el.innerHTML = `<div class="cal"><div class="yr">${q === 1 ? y : QSHORT[q - 1].toUpperCase()}</div><div class="mo">${QNAME[q - 1]} ${y}</div>
    <div class="heads">${heads.map((h, i) => `<div class="hl ${h.cls || ''}" style="--r:${(h.r != null ? h.r : ((i * 53) % 5 - 2) * .5)}deg;animation-delay:${.25 + i * .12}s"><div class="k">${esc(h.k)}</div><div class="h">${esc(h.h)}</div>${h.s ? `<div class="s">${esc(h.s)}</div>` : ''}</div>`).join('') || '<div class="hl" style="animation-delay:.3s"><div class="h" style="font-family:var(--type);font-weight:400">A quiet quarter. The pipe drips. The boxes wait.</div></div>'}</div>
    <div style="margin-top:26px"><button class="tbtn" id="qtGo">BACK TO WORK</button></div></div>`;
  el.classList.remove('hidden'); el.scrollTop = 0; SND.paper();
  $('#qtGo').onclick = () => { el.classList.add('hidden'); done(); };
}

/* ---------- cinematics ---------- */
function cine(pages, done) {
  const el = $('#cine'), tx = $('#cinetxt'); let i = 0, timer = null, full = '';
  el.classList.remove('hidden');
  const finish = () => { clearInterval(timer); timer = null; tx.innerHTML = full; };
  const show = () => {
    const p = pages[i]; full = `${p.big ? `<span class="big">${esc(p.big)}</span>` : ''}${esc(p.text)}`;
    tx.innerHTML = p.big ? `<span class="big">${esc(p.big)}</span>` : ''; const node = document.createElement('span'); node.className = 'caret'; tx.appendChild(node);
    let k = 0; const s = p.text; clearInterval(timer);
    timer = setInterval(() => { k += 2; node.textContent = s.slice(0, k); if (k % 6 === 0 && s[k] !== ' ') SND.key(); if (k >= s.length) { clearInterval(timer); timer = null; node.classList.remove('caret'); } }, 22);
  };
  const next = () => { if (timer) return finish(); i++; if (i >= pages.length) { end(); return; } show(); };
  const end = () => { clearInterval(timer); el.classList.add('hidden'); el.onclick = null; document.removeEventListener('keydown', key); done && done(); };
  const key = e => { if (e.key === 'Escape') end(); else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
  el.onclick = next; document.addEventListener('keydown', key); show();
}
function playPendingCine() {
  const q = (S.cine || []).splice(0); if (!q.length) return; saveGame();
  const pages = [];
  q.forEach(k => {
    if (k === 'dot_retire') pages.push({ big: 'DECEMBER 1996', text: `Dot Kowalski cleans out her desk on a Friday. The photograph that was always face down goes into her purse face up.\n\nAt the door she says, "Don't let them put the boxes on the floor."\n\nThen she climbs the stairs one at a time and doesn't look back, because she was never that kind of woman.` });
    if (k === 'dot_dies') pages.push({ big: '1931 — 2003', text: closed('kowalski') ? `Dorothy Kowalski died in her sleep in the flat on Garfield Avenue, in the bedroom across the hall from the one that was Marion's.\n\nShe is buried at St. Hedwig's, beside her sister. There is rhubarb at the foot of both graves.` : `Dorothy Kowalski died in her sleep in the flat on Garfield Avenue, in the bedroom across the hall from the one that was Marion's.\n\nShe had kept that room as it was for forty-four years. The paycheck was still on the dresser.` });
  });
  if (pages.length) cine(pages, () => render());
}

/* ---------- finale ---------- */
function finale() {
  closeModal();
  const rows = [], score = { pts: 0 };
  CASE_ORDER.slice().sort((a, b) => CASES[a].year - CASES[b].year).forEach(c => {
    const C = CASES[c], st = cstat(c); let tag, cls, txt;
    if (st.wrong && !st.revealed) { tag = 'WRONGFUL'; cls = 'var(--red2)'; score.pts -= 150; txt = `<b>${esc(pname(st.perp))} was innocent.</b> The State convicted ${esc(pname(st.perp))} on the case you built. The truth: ${esc(C.title)} was killed by ${esc(pname(C.truth))}. ${C.exonText ? '' : ''}Nobody will ever know, unless someone opens this box again.`; }
    else {
      txt = C.epilogue(S) || '';
      if (['closed', 'cleared'].includes(st.st)) { tag = st.st === 'cleared' ? 'CLEARED' : 'SOLVED'; cls = 'var(--red2)'; score.pts += st.st === 'cleared' ? 80 : 100; }
      else if (st.st === 'identified') { tag = 'IDENTIFIED'; cls = 'var(--blue)'; score.pts += 100; }
      else if (st.st === 'exonerated') { tag = st.posthumous ? 'EXONERATED †' : 'EXONERATED'; cls = 'var(--blue)'; score.pts += st.posthumous ? 80 : 150; }
      else { tag = C.closure === 'review' ? 'CONVICTED' : 'UNSOLVED'; cls = 'var(--dim)'; }
      if (st.reopened) { score.pts -= 50; txt += ` <i>(A wrongful conviction in this case was found and vacated: ${esc(pname(st.wrongPerp))}.)</i>`; }
    }
    rows.push(`<div class="res"><div class="stt" style="color:${cls};border-color:${cls}">${tag}</div><div><h4>${C.no} — ${esc(C.title)}</h4><p>${txt}</p></div></div>`);
  });
  const p = score.pts, unsolved = CASE_ORDER.filter(c => !closed(c) || (cstat(c).wrong && !cstat(c).revealed)).length;
  const rank = p >= 880 ? 'THE KEEPER OF B-14' : p >= 700 ? 'COLD CASE LEGEND' : p >= 500 ? 'DETECTIVE FIRST GRADE' : p >= 300 ? 'ARCHIVIST' : p >= 100 ? 'BOX SHUFFLER' : 'BASEMENT FIXTURE';
  const pages = [{ big: YQ(Math.min(S.t, LAST_T)).y >= 2008 ? 'DECEMBER 2008' : 'RETIREMENT', text: `The movers come on a Tuesday. They wrap each box in plastic, which Dot would have hated, and carry them up the stairs two at a time.\n\nThe fluorescent tube over the desk flickers once more and goes out for good.\n\nSomebody has to write the final report. It's you.` }];
  cine(pages, () => {
    const el = $('#qt');
    el.innerHTML = `<div class="fin"><div style="text-align:center"><div class="mo">FINAL REPORT · DETECTIVE ${esc(S.name)} · 1988–${YQ(Math.min(S.t, LAST_T)).y}</div><div class="yr" style="font-size:clamp(34px,7vw,64px);margin:10px 0">${rank}</div><div class="mo">${p} POINTS · ${9 - unsolved} OF 9 BOXES GIVEN A TRUE ANSWER</div></div>
      <div style="margin-top:24px">${rows.join('')}</div>
      <div class="res"><div class="stt" style="color:var(--amber);border-color:var(--amber)">2018</div><div><h4>Ten years later</h4><p>In April 2018, investigators in California identified the "Golden State Killer" by uploading crime-scene DNA from the 1970s to a public genealogy website and building his family tree. Within a few years, hundreds of cold cases across the country were solved the same way.${unsolved ? ` In the new evidence facility in Port Avery, ${unsolved} ${unsolved > 1 ? 'boxes were' : 'box was'} still waiting.` : ' The Port Avery archive had nothing left for it to do.'}</p></div></div>
      <p style="text-align:center;margin-top:30px;color:var(--dim);font-size:13px">All persons and cases are fictional. Every forensic method, and the year it arrived, is real.</p>
      <div style="text-align:center;margin:20px 0 40px"><button class="tbtn" id="finNew">OPEN A NEW FILE</button></div></div>`;
    el.classList.remove('hidden'); el.scrollTop = 0; SND.bell();
    $('#finNew').onclick = () => { clearSave(); S = null; el.classList.add('hidden'); showTitle(); };
  });
}

/* ---------- new game / title ---------- */
function newGame(name) {
  S = newState(name);
  for (const p in PEOPLE) if (PEOPLE[p].known0) S.known.add(p);
  for (const id in DOCS) if (DOCS[id].init) S.docs.add(id);
  for (const id in EVID) if (EVID[id].init) addEv(id);
  for (const c in CASES) if (CASES[c].initStatus) S.cases[c] = Object.assign({ t: -44 }, CASES[c].initStatus);
  S.money = fyBudget(1988); S.ap = 3;
  mail({ from: 'Port Avery Ledger (clipping)', subj: 'England: DNA "fingerprint" convicts a killer', body: '<p><i>LEICESTER, England, Jan. 23 (AP)</i> — A baker\'s assistant, Colin Pitchfork, was sentenced to life in prison yesterday for the murders of two teenage girls, the first murder conviction in the world obtained by "genetic fingerprinting." The technique was invented in 1984 by Dr. Alec Jeffreys of the University of Leicester. It also cleared a 17-year-old who had confessed to one of the killings.</p><p>American laboratories are said to be "watching closely."</p>' });
  mail({ from: CAST.ruane, subj: 'Your assignment', body: `<p>Detective ${esc(name)},</p><p>Effective today you are assigned to Records, Sub-basement B, Room 14. You will be responsible for the inactive homicide and death-investigation files stored there.</p><p>I don\'t expect anything from you. Nobody upstairs does. If you close something, we\'ll talk about your budget. If you embarrass this department, we\'ll talk about your pension.</p><p>— Capt. F. Ruane</p>` });
  mail({ from: CAST.dot, subj: 'Welcome to B-14', body: `<p>Detective,</p><p>I\'m Dot. I\'ve run Records since 1961 and I know where everything in this room is, including the light switch, which is behind the boiler for reasons nobody remembers.</p><p>The nine boxes on the shelf are what\'s left of the cases nobody upstairs wanted to look at anymore. Read them properly. When something in a report is wrong, or strange, or matters, mark it. The lab upstairs at the State Police can do more every year, and it costs money every time. Some of what they do uses up what they test. Think before you send anything that can't be replaced.</p><p>You get a few hours a quarter to go out and knock on doors. Use them on the living. They don\'t stay living.</p><p>One of the boxes is my sister\'s. It\'s 59-0233. You don\'t have to start there. I\'d rather you didn\'t.</p><p>If you get stuck, ask me. I\'m by the boiler.</p><p>— Dot</p>` });
  saveGame();
}
function startApp() {
  $('#title').classList.add('hidden'); $('#qt').classList.add('hidden'); $('#app').classList.remove('hidden'); SND.unrain(); SND.hum(); render();
}
function showTitle() {
  $('#app').classList.add('hidden'); $('#qt').classList.add('hidden'); $('#title').classList.remove('hidden');
  $('#nameform').classList.add('hidden'); $('#tmenu').classList.remove('hidden');
  const sv = loadGame(); $('#bCont').classList.toggle('hidden', !sv);
  if (sv) $('#bCont').textContent = `CONTINUE — DET. ${sv.name} · ${dateOf(sv.t)}`;
  $('#bSound').textContent = 'SOUND: ' + (PREFS.sound ? 'ON' : 'OFF');
  const sub = 'Nine boxes. Twenty years. The science is coming.'; const el = $('#tsub'); el.textContent = ''; let k = 0;
  clearInterval(showTitle.t); showTitle.t = setInterval(() => { el.textContent = sub.slice(0, ++k); if (k >= sub.length) clearInterval(showTitle.t); }, 45);
}
function wire() {
  const gesture = () => { SND.init(); SND.set(PREFS.sound); if (!$('#title').classList.contains('hidden')) SND.rain(); };
  document.addEventListener('pointerdown', gesture, { once: true });
  $('#bCont').onclick = () => { SND.init(); S = loadGame(); if (!S) return showTitle(); startApp(); if (S.ended) finale(); else playPendingCine(); };
  $('#bNew').onclick = () => { SND.init(); if (loadGame()) return confirmBox('Starting a new file will erase your current save. Continue?', () => { $('#tmenu').classList.add('hidden'); $('#nameform').classList.remove('hidden'); $('#nm').focus(); }); $('#tmenu').classList.add('hidden'); $('#nameform').classList.remove('hidden'); $('#nm').focus(); };
  $('#bSound').onclick = () => { PREFS.sound = !PREFS.sound; savePrefs(); SND.init(); SND.set(PREFS.sound); $('#bSound').textContent = 'SOUND: ' + (PREFS.sound ? 'ON' : 'OFF'); };
  $('#nameform').onsubmit = e => {
    e.preventDefault(); const name = ($('#nm').value.trim() || 'Calloway').toUpperCase().replace(/[^A-Z' -]/g, '').slice(0, 18) || 'CALLOWAY';
    newGame(name); $('#title').classList.add('hidden'); SND.unrain();
    cine([
      { big: 'PORT AVERY, 1988', text: 'A Great Lakes port city of 181,000. Three shipyards, two of them closed. A police department with eleven floors.\n\nAnd under the eleven floors, Sub-basement B.' },
      { big: 'ROOM 14', text: 'In the spring you testified against your partner. The jury believed you. The department never forgave you.\n\nThe Captain needed somewhere to put you, and he found the one room in the building that nobody visits.' },
      { big: 'NINE BOXES', text: 'Thirty-six years of the unsolved. A drowned man with no name. A girl who walked home. A fire. A cup of tea.\n\nNobody upstairs expects you to open them. The science that could open most of them hasn\'t been invented yet.' },
      { big: '1988 — 2008', text: 'You have twenty years. Each quarter you get a few hours of fieldwork and a lab budget nobody upstairs will defend.\n\nWitnesses will die. Evidence will rot. Some things get better with time.\n\nLearn which is which.' },
      { big: 'DETECTIVE ' + name, text: 'Report to B-14.' },
    ], () => { startApp(); setTimeout(() => readMail(S.inbox.find(m => m.subj === 'Welcome to B-14').id), 400); });
  };
  $('#mx').onclick = closeModal;
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal(); });
  $('#bInbox').onclick = openInbox; $('#bBoard').onclick = () => openBoard(); $('#bManual').onclick = openManual; $('#bMenu').onclick = openMenu;
  $('#bHint').onclick = hint; $('#bEnd').onclick = endQ;
  showTitle();
}
wire();
</script>
</body>
</html>
